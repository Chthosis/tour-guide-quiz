<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"对","stem":"中国在巴黎和会上的外交失败，是五四运动的直接导火线。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。五四运动的直接导火线是中国在巴黎和会上的外交失败(不是华盛顿\n\n会议)；1919 年 5 月 4 日，北京学生 3000 余人齐集天安门前举行示威，震惊中外的五四运\n\n动爆发。\n\n同类对比‑ 五四运动\n\n‑ 导火线：中国在巴黎和会上的外交失败；\n\n‑ 爆发：1919 年 5 月 4 日，北京学生 3000 余人齐集天安门前举行示威；\n\n‑ 口号：\"外争主权、内除国贼\"\"还我青岛\"。","clips":[]},{"n":2,"kind":"判断题","answer":"错","stem":"金沙遗址出土的\"太阳神鸟\"金饰已成为世界文化遗产的标志。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"世界\"应改为\"中国\"。2001 年在成都城西发现与三星堆遗址有明显\n\n传承关系的金沙遗址，同样出土大量的黄金器、玉器、象牙和陶器等文物，其中\"太阳神鸟\"\n\n金饰已成为中国文化遗产的标志。","clips":[]},{"n":3,"kind":"判断题","answer":"错","stem":"龙山文化距今 6500~5000 年，因发现于内蒙古赤峰市红山而得名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"龙山\"应改为\"红山\"。红山文化距今 6500~5000 年，因发现于内蒙古\n\n赤峰市红山而得名。红山文化出土的\"玉龙\"是其极具代表性的文物，也是中国现今发现较早\n\n期的龙的形象之一，被誉为\"中华第一龙\"，赤峰也因此被称作\"玉龙的故乡\"。","clips":[]},{"n":4,"kind":"判断题","answer":"错","stem":"安徽省内河航道的里程和密度均居全国之首。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"安徽\"应改为\"江苏\"。江苏省内河航道总里程约 2.4 万千米、约占全\n\n国的 1/5，等级航道里程 8818 千米、约占全国的 1/7，里程和密度均居全国之首。\n\n易混对比‑ ‑ 交通\"之最\"\n\n‑ 内河航道：总里程约 2.4 万千米，里程和密度均居全国之首(江苏)；\n\n‑ 高速铁路：全国第一个\"市市通高铁\"的省份(福建)；\n\n‑ 高铁建设：全国率先实现设区市时速 350 千米高铁全覆盖(江西)。","clips":[]},{"n":5,"kind":"判断题","answer":"错","stem":"庙号是古代帝王、诸侯、高官死后，朝廷根据他们生平事迹给予的称号。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，古代帝王、诸侯、高官死后，朝廷根据他们生平事迹给予的称号是谥\n\n号(不是庙号)；逝去帝王在宗庙中的称号才叫庙号，如唐太宗、宋太祖。\n\n易混对比‑ ‑ 谥号、庙号与尊号\n\n‑ 谥号：古代帝王、诸侯、高官死后，朝廷根据生平事迹给予的称号，目的是贬善恶；\n\n‑ 庙号：逝去帝王在宗庙中的称号；\n\n‑ 尊号：古代给帝王、皇后及皇太后加封的尊崇性质的称号。","clips":[]},{"n":6,"kind":"判断题","answer":"错","stem":"全国整体地势东高西低，呈三级阶梯状逐级下降，地势落差巨大。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"东高西低\"应改为\"西高东低\"。全国整体地势西高东低，呈三级阶梯\n\n状逐级下降，地势落差巨大，这是影响水系流向、气候分异与地貌格局的重要因素。\n\n易混对比‑ ‑ 我国地势三级阶梯\n\n‑ 地势：全国整体西高东低(不是东高西低)，呈三级阶梯状逐级下降；\n\n‑ 第一级阶梯：青藏高原，平均海拔 4000 米以上，号称\"世界屋脊\"；\n\n‑ 第三级阶梯：东部平原与低山丘陵，海拔多在 500 米以下。","clips":[]},{"n":7,"kind":"判断题","answer":"对","stem":"贵州省茶园面积超 700 万亩，辣椒产销规模居全国首位。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。贵州省茶园面积超 700 万亩，辣椒产销规模居全国首位。","clips":[]},{"n":8,"kind":"判断题","answer":"错","stem":"1864 年\"共产主义者同盟\"建立，揭开了国际共产主义运动的历史序幕。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"1864 年\"应改为\"1847 年\"。1847 年\"共产主义者同盟\"建立，揭开了\n\n国际共产主义运动的历史序幕；1864 年成立的是国际工人协会(第一国际)。\n\n易混对比‑ ‑ 国际共产主义运动历程\n\n‑ 共产主义者同盟：1847 年建立，揭开了国际共产主义运动的历史序幕；\n\n‑ 《共产党宣言》：1848 年出版，第一次全面系统地阐述了科学社会主义理论；\n\n‑ 国际工人协会(第一国际)：1864 年诞生。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"山西作为中华文明的重要发祥地，自古便有\"皆三代之居，皆在河、洛之间\"的说法。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"山西\"应改为\"河南\"。河南作为中华文明的重要发祥地，自古便有\"\n\n昔三代之居，皆在河、洛之间\"的说法。","clips":[]},{"n":10,"kind":"判断题","answer":"对","stem":"\"歌圩\"是壮族人民对歌、赛歌的盛大集会，相传与歌仙刘三姐有关。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\"歌圩\"是壮族人民对歌、赛歌的盛大集会，相传与歌仙刘三姐有关。\n\n\"三月三\"歌节，又称三月三歌圩，是壮族盛大的传统歌节。","clips":[]},{"n":11,"kind":"判断题","answer":"对","stem":"昌化鸡血石雕产自浙江昌化，其独特之处在于石材中含有天然的\"鸡血\"(辰砂矿物)，被奉为\"石中皇后\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。昌化鸡血石雕产自浙江昌化，核心原料鸡血石仅产于昌化镇玉岩山一\n\n带；其独特之处在于石材中含有天然的\"鸡血\"(辰砂矿物)，色泽鲜红，如同鸡血般艳丽，是\n\n鸡血石雕的核心价值所在，被奉为\"石中皇后\"。\n\n同类对比‑ ‑ 昌化鸡血石雕\n\n‑ 产地：产自浙江昌化，核心原料鸡血石仅产于昌化镇玉岩山一带；\n\n‑ 特色：石材中含有天然的\"鸡血\"(辰砂矿物)；\n\n‑ 美誉：被奉为\"石中皇后\"；\n\n‑ 工艺：\"惜血如金、巧借血色\"。","clips":[]},{"n":12,"kind":"判断题","answer":"对","stem":"湖南自古盛植木芙蓉，五代时就有\"秋风万里芙蓉国\"之说，因此又有\"芙蓉国\"之称。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。湖南自古盛植木芙蓉，五代时就有\"秋风万里芙蓉国\"之说，因此又有\n\n\"芙蓉国\"之称。","clips":[]},{"n":13,"kind":"判断题","answer":"错","stem":"1851 年爆发的太平天国运动持续了 14 年，纵横 18 省，一度定都北京。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"北京\"应改为\"南京\"。1851 年，洪秀全领导的太平天国运动爆发，\n\n持续 14 年，纵横 18 省，1853 年定都南京，改称天京。\n\n易混对比‑ ‑ 太平天国运动\n\n‑ 爆发：1851 年，洪秀全领导的太平天国运动爆发；\n\n‑ 规模：运动持续 14 年，纵横 18 省；\n\n‑ 都城：一度定都南京(不是北京)，最终被中外反动势力绞杀。","clips":[]},{"n":14,"kind":"判断题","answer":"错","stem":"瓷器的烧成温度必须在 1500°C 以上。","options":{"对":"正确","错":"错误"},"explanation":"\"1500°C 以上\"错误，应为\"1200°C 以上\"。瓷器是以高岭土(俗称瓷土)为原料，经\n\n1200°C 以上高温烧制而成的器物。高温烧制使瓷土形成结晶，胎体致密、硬度高、吸水率\n\n低，加上表面施高温釉，成品光亮坚硬。\n\n26 版教材将\"瓷胎烧结后，质地致密，胎体吸水率不足 1%\"改为\"吸水率低\"，并将瓷器定义\n\n补写为以高岭土为原料、1200°C 以上高温烧制，补入结晶、胎体致密、硬度高和高温釉等\n\n特点。\n\n易混对比‑ ‑ 陶器与瓷器\n\n‑ 陶器：以黏土为原料，经 700~1000°C 的炉温焙烧而成；\n\n‑ 瓷器：以高岭土为原料，经 1200°C 以上高温烧制而成；\n\n‑ 陶器缺陷：质地松、强度低、吸水率高，唐宋以后陶器大量被瓷器取代。","clips":[]},{"n":15,"kind":"判断题","answer":"对","stem":"\"墙倒屋不塌\"这句民间俗语，充分表达了我国木构架梁柱式结构体系的特点。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。由于木材建造的梁柱式结构是一个富有弹性的框架，具有突出的优点\n\n即抗震性能强，它可以把巨大的震动能量消失在弹性很强的节点上，\"墙倒屋不塌\"这句民间\n\n俗语，充分表达了上述梁柱式结构体系的特点。\n\n同类对比‑ ‑ 木构架梁柱式结构\n\n‑ 框架：木材建造的梁柱式结构是一个富有弹性的框架；\n\n‑ 优点：突出优点即抗震性能强，可以把巨大的震动能量消失在弹性很强的节点上；\n\n‑ 俗语：\"墙倒屋不塌\"充分表达了我国木构架梁柱式结构体系的特点。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"重庆简称\"渝\"，因长江古称\"渝水\"而得名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"长江\"应改为\"嘉陵江\"。因嘉陵江古称\"渝水\"，此为重庆简称\"渝\"\n\n的出处。南宋时，宋孝宗之子赵惇先封恭王，后即帝位为光宗皇帝，称为\"双重喜庆\"，遂升\n\n恭州为重庆府，\"重庆\"由此而得名。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"巴丹吉林沙漠是中国第二大沙漠、第三大流动沙漠。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应改为\"第三大沙漠、第二大流动沙漠\"。巴丹吉林沙漠是中国第三大\n\n沙漠、第二大流动沙漠。巴丹吉林沙漠有世界最高的固定沙山、最密集的沙漠湖泊、最广阔\n\n的鸣沙区域，风蚀地貌鬼斧神工，被中国国家地理杂志评为\"中国最美沙漠\"。2024 年 7 月，\n\n\"巴丹吉林沙漠‑ 沙山湖泊群\"被成功列入《世界遗产名录》，填补了中国世界自然遗产中缺\n\n少沙漠类型的空白。\n\n易混对比‑ ‑ 沙漠之最\n\n‑ 塔克拉玛干沙漠：中国最大的沙漠，面积 33.76 万平方公里(新疆)；\n\n‑ 巴丹吉林沙漠：中国第三大沙漠、第二大流动沙漠，\"中国最美沙漠\"(内蒙古)。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"广东阳江是\"南国风筝之乡\"，1993 年被授予\"世界风筝都\"称号。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"世界风筝都\"应改为\"全国风筝之乡\"。广东阳江是南派风筝代表之一，\n\n有\"南国风筝之乡\"之称，1993 年被国家体委授予\"全国风筝之乡\"称号；\"世界风筝都\"是山\n\n东潍坊。\n\n易混对比‑ ‑ \"风筝之乡\"与\"世界风筝都\"\n\n‑ 阳江：广东阳江是南国风筝之乡，1993 年被国家体委授予\"全国风筝之乡\"称号；\n\n‑ 潍坊：山东潍坊是\"世界风筝都\"，自 1984 年起每年举办国际风筝节；\n\n‑ 非遗：2006 年，潍坊、南通、拉萨、北京、天津的风筝制作技艺列入第一批国家级非物\n\n质文化遗产名录。","clips":[]},{"n":19,"kind":"判断题","answer":"对","stem":"杭州西湖北面的保俶塔与南面重建的雷峰塔，是一组绝妙的对景。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。在园林中，从甲风景点可观赏乙风景点，从乙风景点可观赏甲风景点\n\n的构景方法，叫对景；杭州西湖北面的保俶塔，与南面重建的雷峰塔，就是一组绝妙的对景。\n\n同类对比‑ ‑ 古典园林构景手段\n\n‑ 对景：从甲风景点可观赏乙风景点，从乙风景点也可观赏甲风景点；\n\n‑ 实例：杭州西湖北面的保俶塔与南面重建的雷峰塔是一组绝妙的对景；\n\n‑ 其他手段：还有抑景、夹景、添景、框景、漏景和借景。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"洛阳因地处洛河之阳而得名，是十三朝古都、丝绸之路的东方起点、隋唐大运河的中心。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。洛阳因地处洛河之阳而得名，十三朝古都、丝绸之路的东方起点、隋\n\n唐大运河的中心。\n\n同类对比‑ ‑ 河南古都(河南)\n\n‑ 洛阳：十三朝古都、丝绸之路的东方起点、隋唐大运河的中心；\n\n‑ 开封：八朝古都，北宋东京；\n\n‑ 安阳：殷墟所在地，甲骨文出土地。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"著名社会学家费孝通最早提出中华民族是\"多元一体\"的复合体这一概念。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。著名社会学家费孝通最早提出中华民族是\"多元一体\"的复合体这一概\n\n念，并于 1988 年在《中华民族多元一体格局》一文中系统阐述；他指出，中华民族是一个\"\n\n多元一体\"的整体，\"多元\"指各民族保留自身语言、习俗等文化特征，\"一体\"则强调各民族\n\n共同形成了更高层次的中华民族认同。\n\n同类对比‑ ‑ 费孝通\"多元一体\"理论\n\n‑ 提出：著名社会学家费孝通最早提出中华民族是\"多元一体\"的复合体；\n\n‑ 系统阐述：1988 年在《中华民族多元一体格局》一文中系统阐述；\n\n‑ \"多元\"：各民族保留自身语言、习俗等文化特征；\n\n‑ \"一体\"：各民族在长期交往中形成的共同国家认同。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"法国是欧盟最大的农业生产国，也是世界主要农产品和农业食品出口国。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。法国是欧盟最大的农业生产国，也是世界主要农产品和农业食品出口\n\n国，葡萄酒的出口量约占世界葡萄酒出口总量的一半；法国是全球旅游主要目的地之一，国\n\n际旅游收入居世界第二，是世界著名的三大烹饪王国之一。\n\n同类对比‑ ‑ 法国农业与工业\n\n‑ 农业地位：法国是欧盟最大的农业生产国；\n\n‑ 出口：也是世界主要农产品和农业食品出口国；\n\n‑ 葡萄酒：出口量约占世界葡萄酒出口总量的一半。","clips":[]},{"n":23,"kind":"判断题","answer":"错","stem":"我国大陆海岸线约 1.42 万千米，专属经济区与大陆架管辖海域近 300 万平方千米。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"1.42 万千米\"应改为\"1.84 万千米\"。我国大陆海岸线约 1.84 万千米，\n\n岛屿岸线约 1.42 万千米，内水加领海海域面积约 38 万平方千米，专属经济区与大陆架管辖\n\n海域近 300 万平方千米。\n\n易混对比‑ ‑ 我国海岸线与管辖海域\n\n‑ 大陆海岸线：约 1.84 万千米；\n\n‑ 岛屿岸线：约 1.42 万千米；\n\n‑ 内水加领海：海域面积约 38 万平方千米；\n\n‑ 专属经济区与大陆架：管辖海域近 300 万平方千米。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"福建旅游鲜明的特色是\"山海一体，闽台同根，民俗奇异，宗教多元\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。福建旅游鲜明的特色是\"山海一体，闽台同根，民俗奇异，宗教多元\"。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"截至目前，我国共有 61 个项目列入联合国教科文组织非遗名录、名册，总数居世界第一。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"61 个\"应改为\"45 个\"。截至目前，我国共有 45 个项目列入联合国教\n\n科文组织非遗名录、名册，总数居世界第一，其中，列入代表作名录 40 项，列入急需保护\n\n名录项目 3 项，入选优秀保护实践名册 2 项。(数据更新，以此为准)。\n\n口诀：非遗 45 中国一：代表 40，急 3，优 2。\n\n同类对比‑ ‑ 中国非遗名录数据\n\n‑ 列入非遗名录、名册项目：45 个，总数居世界第一；\n\n‑ 代表作名录：40 项；\n\n‑ 急需保护名录：3 项；\n\n‑ 优秀保护实践名册：2 项。","clips":[]},{"n":26,"kind":"判断题","answer":"错","stem":"秦皇岛市是中国最佳旅游城市，是理想的旅游、度假和避暑胜地。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"秦皇岛市\"应改为\"大连市\"。大连市是中国最佳旅游城市，是理想的\n\n旅游、度假和避暑胜地。","clips":[]},{"n":27,"kind":"判断题","answer":"错","stem":"茶叶按初加工方式可分为绿茶、红茶、乌龙茶、白茶、紧压茶和花茶六大类。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。初加工六大类应包括青茶、黄茶、黑茶，紧压茶和花茶属于再加工茶。\n\n初加工茶分绿茶、红茶、青茶(乌龙茶)、黄茶、白茶、黑茶六大类；紧压茶和花茶属于再加\n\n工茶，再加工茶还有袋泡茶等。\n\n26 版教材改动：再加工茶举例增加袋泡茶，不再限定为两种。初加工茶分六大类；再加工\n\n茶有花茶、紧压茶、袋泡茶等。\n\n易混对比‑ ‑ 茶叶初加工与再加工\n\n‑ 初加工茶：按初加工方式可分为绿茶、红茶、青茶(乌龙茶)、黄茶、白茶、黑茶六大类；\n\n‑ 再加工茶：以六大类茶为原料再加工形成，如花茶、紧压茶、袋泡茶等；\n\n‑ 紧压茶：经过蒸软、压制成型、干燥等工序做成的茶饼，便于保存和运输。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"上海外滩是上海城市的象征。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。上海外滩是上海城市的象征。","clips":[]},{"n":29,"kind":"判断题","answer":"对","stem":"班固的《汉书》记载了从高祖建汉到王莽政权间 230 年的历史。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。班固的《汉书》记载高祖建汉到王莽政权间 230 年的历史，其事详，\n\n结构谨严，描写生动，人物形象塑造栩栩如生。\n\n同类对比‑ ‑ 《汉书》与纪传体史学\n\n‑ 《汉书》：班固著，记载高祖建汉到王莽政权间 230 年的历史；\n\n‑ 叙事特点：叙事详，结构谨严，描写生动，人物形象塑造栩栩如生；\n\n‑ 《史记》：司马迁著，被赞誉为\"史家之绝唱，无韵之离骚\"。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"闻名于世的畲族\"惠明茶\"历史悠久，1915 年获巴拿马万国博览会金质奖章。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。闻名于世的畲族\"惠明茶\"历史悠久，明清时期曾被列为贡品，1915\n\n年获巴拿马万国博览会金质奖章。\"惠明茶\"明清时期曾被列为贡品。\n\n同类对比‑ ‑ 畲族文化(浙江)\n\n‑ 景宁畲族自治县：全国唯一的畲族自治县，设于丽水市；\n\n‑ 畲民自称\"山哈\"，意为山里的客人；\n\n‑ \"凤凰装\"：畲族女性传统服装，民族特色鲜明。","clips":[]},{"n":31,"kind":"判断题","answer":"对","stem":"明末总结造园经验的著作是《园冶》。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。皇家和私人的园林在传统基础上有了很大的发展，在明末出现了一部\n\n总结造园经验的著作《园冶》，并留下了许多优秀作品。\n\n同类对比‑ ‑ 中国古典园林发展阶段\n\n‑ 转折点：魏晋南北朝时期是中国园林发展的转折点，私家园林逐渐增加；\n\n‑ 成熟阶段：唐宋时期园林达到成熟，写意山水园技巧取得很大成就；\n\n‑ 精深发展：明清时期园林进入精深发展阶段；\n\n‑ 造园著作：明末出现总结造园经验的著作‑ ‑ 《园冶》。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"无名氏的《古诗十九首》代表了文人五言诗的最高成就。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。无名氏的《古诗十九首》代表了文人五言诗的最高成就。\n\n同类对比‑ ‑ 《古诗十九首》\n\n‑ 作者：无名氏；\n\n‑ 体裁：东汉文人五言诗，代表作有《行行重行行》《青青河畔草》等；\n\n‑ 地位：代表了文人五言诗的最高成就。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"1840 年天津被辟为通商口岸。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"1840\"应改为\"1860\"。天津 1860 年被辟为通商口岸。\n\n同类对比‑ ‑ 近代开埠\n\n‑ 1860 年：天津被辟为通商口岸；\n\n‑ 1842 年《南京条约》：开放广州、福州、厦门、宁波、上海五处为通商口岸；\n\n‑ 1843 年 11 月 17 日：上海正式对外开埠。","clips":[]},{"n":34,"kind":"判断题","answer":"对","stem":"唐代孙思邈著《千金方》，被誉为\"东方医学圣典\"，他本人被誉为\"药王\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。唐朝名医孙思邈著《千金方》，被誉为\"东方医学圣典\"，他本人被为\"\n\n药王\"。\n\n同类对比‑ ‑ 孙思邈与《千金方》\n\n‑ 朝代：唐朝名医；\n\n‑ 著作：著《千金方》；\n\n‑ 美誉：《千金方》被誉为\"东方医学圣典\"，孙思邈本人被为\"药王\"。","clips":[]},{"n":35,"kind":"判断题","answer":"错","stem":"人面鱼纹盆出土于三门峡庙底沟遗址，花瓣纹彩陶钵出土于西安半坡村遗址。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，两处遗址恰好相反。仰韶文化彩陶的代表器物包括西安半坡村遗址出\n\n土的人面鱼纹盆、西安临潼姜寨遗址出土的变体鱼纹葫芦瓶，以及河南三门峡庙底沟遗址出\n\n土的花瓣纹彩陶钵。\n\n易混对比‑ ‑ 仰韶文化彩陶代表器物\n\n‑ 人面鱼纹盆：西安半坡村遗址出土；\n\n‑ 变体鱼纹葫芦瓶：西安临潼姜寨遗址出土；\n\n‑ 花瓣纹彩陶钵：河南省三门峡庙底沟遗址出土。","clips":[]},{"n":36,"kind":"判断题","answer":"错","stem":"香港行人和车辆靠右行驶，和内地正好相反。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，\"靠右行驶\"应改为\"靠左行驶\"。香港行人和车辆靠左行驶，与内地正\n\n好相反。香港交通规则：行人和车辆靠左行驶，与内地相反(其他教材补充)。\n\n易混对比‑ ‑ 香港民俗要点(香港)\n\n‑ 行驶规则：行人和车辆靠左行驶，与内地相反；\n\n‑ 数字宜忌：喜\"3\"\"8\"\"6\"\"9\"，忌\"4\"；\n\n‑ 送花禁忌：忌剑兰、茉莉、梅花；\n\n‑ 隐私禁忌：忌打听住址、收入、年龄。","clips":[]},{"n":37,"kind":"判断题","answer":"错","stem":"2006 年 7 月 1 日全线通车的青藏铁路，从此结束了新疆不通铁路的历史。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，青藏铁路结束的是西藏(不是新疆)不通铁路的历史。2006 年 7 月 1\n\n日，全长 1956 公里的世界上海拔最高、线路最长的高原铁路‑ ‑ 青藏铁路全线通车，从此\n\n结束了西藏不通铁路的历史，对于增进民族团结、促进民族区域发展、巩固国防意义重大。\n\n易混对比‑ ‑ 我国铁路建设成就\n\n‑ 成渝铁路：新中国成立后建成的第一条铁路，1952 年 7 月 1 日建成通车；\n\n‑ 宝成铁路：1958 年通车，后被改造成中国第一条电气化铁路；\n\n‑ 青藏铁路：2006 年 7 月 1 日全线通车，从此结束了西藏(不是新疆)不通铁路的历史。","clips":[]},{"n":38,"kind":"判断题","answer":"对","stem":"承德是一个先有皇家园林和皇家寺庙群，而后有人口聚集的城市。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。承德是一个先有皇家园林和皇家寺庙群，而后有人口聚集的城市。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"清明上河园是以北宋张择端《清明上河图》为蓝本，按 1:1 复原的大型宋文化主题公园。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。清明上河园是以北宋张择端《清明上河图》为蓝本 1:1 复原的大型宋\n\n文化主题公园。\n\n同类对比‑ ‑ 河南宋文化名片(河南)\n\n‑ 清明上河园：以张择端《清明上河图》为蓝本 1:1 复原，被誉为\"活着的清明上河图\"；\n\n‑ 开封：北宋都城东京，八朝古都。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"1884 年清政府正式在新疆设省，并取\"故土新归\"之意，改称西域为\"新疆\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1884 年清政府正式在新疆设省，并取\"故土新归\"之意，改称西域为\"\n\n新疆\"。公元前 60 年，西汉中央政府在乌垒(今巴州轮台县境内)设立西域都护府，新疆自此\n\n正式纳入中央政府管辖。\n\n同类对比‑ ‑ 新疆沿革(新疆)\n\n‑ 古称\"西域\"：意为中国的西部疆域，自古以来是祖国不可分割的一部分；\n\n‑ 公元前 60 年：西汉在乌垒(今巴州轮台县境内)设西域都护府，自此纳入中央政府管辖；\n\n‑ 1884 年：清政府正式设省，取\"故土新归\"之意，改称西域为\"新疆\"。","clips":[]},{"n":41,"kind":"单项选择题","answer":"B","stem":"江西客家山歌中(   )最为著名，其与采茶戏都被列入《第一批国家级非物质文化遗产名录》。","options":{"A":"于都客家山歌","B":"兴国客家山歌","C":"瑞金客家山歌","D":"会昌客家山歌"},"explanation":"客家山歌中兴国客家山歌最为著名，采茶戏、兴国山歌都被列入《第一批国家级非物\n\n质文化遗产名录》。A 项于都、C 项瑞金、D 项会昌均为江西客家地区，但客家山歌中最为著\n\n名、列入首批国家级非遗名录者为兴国客家山歌，故不选。","clips":[]},{"n":42,"kind":"单项选择题","answer":"C","stem":"素有\"淮左名都，竹西佳处\"\"中国运河第一城\"之称的城市是(    )。","options":{"A":"南京市","B":"镇江市","C":"扬州市","D":"苏州市"},"explanation":"扬州素有\"淮左名都，竹西佳处\"\"中国运河第一城\"之称，兼具世界运河之都、世界美\n\n食之都、东亚文化之都三重文化名片。A 项南京以\"六朝古都\"著称，B 项苏州以园林闻名，D\n\n项镇江以\"城市山林\"著称，素有\"淮左名都，竹西佳处\"\"中国运河第一城\"之称、兼具三重文\n\n化名片者为扬州，故不选。\n\n同类对比‑ ‑ 扬州名片(江苏)\n\n‑ 古称：广陵、江都，2500 余年建城史，首批国家历史文化名城；\n\n‑ \"淮左名都，竹西佳处\"\"中国运河第一城\"；\n\n‑ 三重文化名片：世界运河之都、世界美食之都、东亚文化之都；\n\n‑ 何园：中国晚清第一名园。","clips":[],"sourceNote":"试卷与解析的选项顺序不同，本题采用解析卷顺序。"},{"n":43,"kind":"单项选择题","answer":"A","stem":"在陕西泾阳县、三原县以及河南三门峡市、山西运城市等地保存的传统窑洞建筑是(     )。","options":{"A":"地坑院","B":"吊脚楼","C":"土楼","D":"碉楼"},"explanation":"在陕西泾阳县、三原县以及河南三门峡市、山西运城市等地，还保存着一种叫作\"地\n\n坑院\"的传统窑洞建筑。B 项吊脚楼为土家族等民族的传统民居，C 项土楼为福建客家民居，\n\nD 项碉楼以广东开平碉楼为代表，陕西等地保存的传统窑洞建筑为地坑院，故不选。\n\n易混对比‑ ‑ 特色民居形式\n\n‑ 地坑院：传统窑洞建筑，\"地下四合院\"，见于陕西泾阳、三原及豫晋部分地区；\n\n‑ 窑洞：黄土高原传统民居；\n\n‑ 碉楼：开平碉楼为代表，兼具防卫与居住功能。","clips":[]},{"n":44,"kind":"单项选择题","answer":"D","stem":"被李约瑟誉为\"中国科学史上的里程碑\"的是(   )。","options":{"A":"《齐民要术》","B":"《天工开物》","C":"《农政全书》","D":"《梦溪笔谈》"},"explanation":"北宋科学家沈括编撰《梦溪笔谈》，内容涉及天文、数学、物理、化学、生物等多个\n\n学科门类，英国科学史家李约瑟评价此书为\"中国科学史上的里程碑\"。A《齐民要术》是北\n\n魏贾思勰所著；B《天工开物》是明朝宋应星所著。\n\n易混对比‑ ‑ 沈括与《梦溪笔谈》\n\n‑ 《梦溪笔谈》：北宋科学家沈括编撰，内容涉及天文、数学、物理、化学、生物等多个学\n\n科门类；\n\n‑ 评价：英国科学史家李约瑟评价此书为\"中国科学史上的里程碑\"；\n\n‑ 活字印刷：布衣毕昇发明活字印刷术的事迹就记载在此书中。","clips":[],"sourceNote":"试卷与解析的选项顺序不同，本题采用解析卷顺序。"},{"n":45,"kind":"单项选择题","answer":"C","stem":"亚洲第一、世界第二大鲜切花拍卖市场位于云南的(      )。","options":{"A":"大理市","B":"丽江市","C":"昆明市","D":"西双版纳傣族自治州"},"explanation":"昆明国际花卉拍卖交易中心是亚洲第一，世界第二大鲜切花拍卖市场，占有全国 40%\n\n左右的鲜切花市场。A 项大理以苍洱风光著称，B 项丽江以古城纳西文化闻名，D 项西双版\n\n纳以热带雨林和傣族风情著称，亚洲第一、世界第二大鲜切花拍卖市场位于昆明，故不选。\n\n云南花卉产业在全国具有领先地位，该交易中心占有全国 40%左右的鲜切花市场。","clips":[]},{"n":46,"kind":"单项选择题","answer":"A","stem":"每年的(       )为中国旅游日。","options":{"A":"5 月 19 日","B":"9 月 27 日","C":"10 月 1 日","D":"12 月 11 日"},"explanation":"2011 年 3 月 30 日，国务院常务会议通过决议确定中国旅游日为每年的 5 月 19 日《徐\n\n霞客游记》首篇《游天台山日记》开篇之日，每年的这一天，我国各地都要举行隆重的旅游\n\n节庆活动。B9 月 27 日是世界旅游日，由世界旅游组织确定；D12 月 11 日是中国正式加入世\n\n界贸易组织的日子。\n\n同类对比‑ ‑ 中国旅游日\n\n‑ 设立：2011 年 3 月 30 日，国务院常务会议通过决议确定；\n\n‑ 日期：每年 5 月 19 日；\n\n‑ 由来：《徐霞客游记》首篇《游天台山日记》的开篇之日；\n\n‑ 世界旅游日：每年 9 月 27 日，由世界旅游组织确定。","clips":[]},{"n":47,"kind":"单项选择题","answer":"A","stem":"(   )以烧制乳浊釉瓷为主，以其\"入窑一色，出窑万彩\"的神奇\"窑变\"而闻名。","options":{"A":"钧窑","B":"定窑","C":"汝窑","D":"哥窑"},"explanation":"钧窑釉色以红、蓝为主，使用乳浊釉，\"入窑一色，出窑万彩\"。这种\"窑变\"现象使钧\n\n瓷表面图案千变万化，每一件都很独特。26 版教材改动：新增\"釉色以红、蓝为主\"。\n\n易混对比‑ ‑ 宋代五大名窑\n\n‑ 汝窑：五窑中以\"汝窑为魁\"，专为宫廷烧造御用瓷器；\n\n‑ 钧窑：釉色以红、蓝为主，使用乳浊釉，\"入窑一色，出窑万彩\"，每件都独特；\n\n‑ 官窑：多为皇室烧造，南宋官窑有\"紫口铁足\"特征；\n\n‑ 定窑：宋代五大名窑中唯一烧造白瓷的窑场。","clips":[]},{"n":48,"kind":"单项选择题","answer":"C","stem":"我国文学史上第一篇文学批评著作是曹丕的(    )。","options":{"A":"《诗品》","B":"《文心雕龙》","C":"《典论·论文》","D":"《文赋》"},"explanation":"曹丕的《典论·论文》是我国文学史上第一篇文学批评著作，文中论述了文学乃\"经\n\n国之大业，不朽之盛事\"的社会功能，批评了\"文人相轻\"的陋习，提出了\"文以气为主\"的主\n\n张。\n\n易混对比‑ ‑ 曹丕与《典论·论文》\n\n‑ 《典论·论文》：曹丕所著，是我国文学史上第一篇文学批评著作；\n\n‑ 核心主张：论述文学乃\"经国之大业，不朽之盛事\"，批评\"文人相轻\"陋习，提出\"文以气\n\n为主\"；\n\n‑ 《燕歌行》：曹丕诗歌代表作，是我国现存最早的文人创作的完整七言诗。","clips":[]},{"n":49,"kind":"单项选择题","answer":"A","stem":"\"天津\"之名意为(      )。","options":{"A":"天子经过的渡口","B":"天子的渡口驿站","C":"天降的津梁","D":"天边的渡口"},"explanation":"天津简称津，意为天子经过的渡口，别名津沽、津门等，直辖市。B 项\"天子的渡口\n\n驿站\"、C 项\"天降的津梁\"、D 项\"天边的渡口\"均与教材\"天子经过的渡口\"的释义不符，故不\n\n选。\n\n易混对比‑ ‑ 城市得名由来\n\n‑ 天津：意为\"天子经过的渡口\"，别名津沽、津门；\n\n‑ 重庆：宋光宗\"双重喜庆\"，升恭州为重庆府而得名。","clips":[]},{"n":50,"kind":"单项选择题","answer":"C","stem":"《水经注》的作者是北魏地理学家(      )。","options":{"A":"沈括","B":"徐霞客","C":"郦道元","D":"王士性"},"explanation":"北魏时期，郦道元为《水经》作注，详细记载了 1000 多条大小河流及有关的历史遗\n\n迹、人物掌故、神话传说等，是中国古代最全面、最系统的综合性地理著作。A 沈括编撰《梦\n\n溪笔谈》；B 徐霞客、D 王士性是明代两位大旅行家。\n\n同类对比‑ ‑ 《水经注》与古代地理学\n\n‑ 作者：北魏郦道元为《水经》作注；\n\n‑ 内容：详细记载了 1000 多条大小河流及有关的历史遗迹、人物掌故、神话传说等；\n\n‑ 地位：是中国古代最全面、最系统的综合性地理著作。","clips":[]},{"n":51,"kind":"单项选择题","answer":"D","stem":"被称为\"海上花园城市\"的是(   )。","options":{"A":"福州市","B":"泉州市","C":"漳州市","D":"厦门市"},"explanation":"厦门简称\"厦\"或\"鹭\"，\"会展友好型城市\"，被称为海上花园城市。A 项福州为福建省\n\n会，B 项泉州为东亚文化之都，C 项漳州以土楼闻名，被称为\"海上花园城市\"者为厦门，故\n\n不选。\n\n易混对比‑ ‑ 城市美誉\n\n‑ 厦门：\"海上花园城市\"(福建)；\n\n‑ 苏州：\"人间天堂\"(江苏)；\n\n‑ 哈尔滨：\"冰城\"\"东方莫斯科\"\"东方小巴黎\"(黑龙江)。","clips":[]},{"n":52,"kind":"单项选择题","answer":"D","stem":"被誉为\"中国古代建筑艺术历史长廊\"的是(        )。","options":{"A":"平遥古城","B":"云冈石窟","C":"晋祠","D":"五台山"},"explanation":"五台山是研究我国古代建筑艺术的活标本，被誉为\"中国古代建筑艺术历史长廊\"。A\n\n项平遥古城、B 项云冈石窟、C 项晋祠均为山西名胜，但被誉为\"中国古代建筑艺术历史长廊\n\n\"者为五台山，故不选。\n\n同类对比‑ ‑ 山西古建(山西)\n\n‑ 五台山：中国佛教四大名山之首，\"中国古代建筑艺术历史长廊\"，北台叶斗海拔 3061 为\"\n\n华北屋脊\"；\n\n‑ 平遥古城：\"龟城\"，保存完整的明民宅近 4000 座；\n\n‑ 晋祠：荟萃多元古建筑形制的千年古祠(太原)。","clips":[]},{"n":53,"kind":"单项选择题","answer":"D","stem":"古称金陵、建康，是中国四大古都之一、十朝都会的是(        )。","options":{"A":"杭州","B":"扬州","C":"苏州","D":"南京"},"explanation":"南京古称金陵、建康等，简称\"宁\"，是中国四大古都之一、十朝都会。A 项杭州为浙\n\n江省会，B 项扬州、C 项苏州均为江苏名城，古称金陵、建康、简称\"宁\"、为十朝都会者为\n\n南京，故不选。\n\n易混对比‑ ‑ 古都名片\n\n‑ 南京：古称金陵、建康，中国四大古都之一、十朝都会(江苏)；\n\n‑ 洛阳：十三朝古都、丝绸之路的东方起点、隋唐大运河的中心(河南)；\n\n‑ 西安：3100 多年建城史、1100 多年国都史，先后有 13 个封建王朝建都(陕西)。","clips":[]},{"n":54,"kind":"单项选择题","answer":"D","stem":"掺入玛瑙为釉、釉色以天青为贵的是(      )。","options":{"A":"哥窑","B":"官窑","C":"定窑","D":"汝窑"},"explanation":"汝窑瓷器釉色以天青为贵、粉青为上，天蓝和月白次之。天青瓷在宋徽宗时烧造约\n\n20 年，工艺精湛，掺入玛瑙为釉，釉色淡雅如雨过天晴。26 版教材整体改写汝窑：窑址明\n\n确为古汝州(今河南宝丰)，改写香灰胎、开片、釉色等级(天青为贵、粉青为上，天蓝和月\n\n白次之)及宋徽宗时天青瓷烧造约 20 年，保留玛瑙为釉和\"似玉、非玉、而胜玉\"评价。\n\n易混对比‑ ‑ 汝窑的专属特征\n\n‑ 地位：宋代五大名窑以\"汝窑为魁\"；\n\n‑ 窑址：古汝州(今河南省平顶山市宝丰县)；\n\n‑ 釉色：以天青为贵、粉青为上，天蓝和月白次之，掺入玛瑙为釉；\n\n‑ 珍贵：天青瓷在宋徽宗时烧造约 20 年，烧造时间短，传世品少。","clips":[]},{"n":55,"kind":"单项选择题","answer":"C","stem":"2010 年首部 3D 电影《阿凡达》的取景地，让美景享誉世界的是(    )。","options":{"A":"武陵源","B":"天门山","C":"张家界","D":"崀山"},"explanation":"2010 年首部 3D 电影《阿凡达》，更是让其中的电影取景地‑ ‑ 张家界的美景享誉世\n\n界。A 项武陵源、B 项天门山均在张家界市，D 项崀山在邵阳，《阿凡达》电影取景地、美景\n\n享誉世界者为张家界，故不选。张家界原名大庸市，因旅游建市。俗话说\"九寨沟看水，张\n\n家界看山\"，张家界武陵源景区有\"中国山水画的原本\"\"缩小的仙境，放大的盆景\"的美誉。\n\n同类对比‑ ‑ 张家界名片(湖南)\n\n‑ 原名：大庸市，因旅游建市；\n\n‑ 武陵源景区：\"中国山水画的原本\"\"缩小的仙境，放大的盆景\"；\n\n‑ 《阿凡达》：2010 年首部 3D 电影取景地，让美景享誉世界。","clips":[]},{"n":56,"kind":"单项选择题","answer":"C","stem":"以\"小桥流水、粉墙黛瓦、史迹名园\"为独特风貌的城市是(       )。","options":{"A":"南京市","B":"无锡市","C":"苏州市","D":"扬州市"},"explanation":"从春秋伍子胥建阖闾大城迄今，苏州城保持着\"水陆并行、河街相邻\"的双棋盘格局，\n\n以\"小桥流水、粉墙黛瓦、史迹名园\"为独特风貌。A 项南京以\"六朝古都\"著称，B 项无锡素\n\n有\"太湖明珠\"之誉，D 项扬州有\"中国运河第一城\"之称，保持\"水陆并行、河街相邻\"双棋盘\n\n格局者为苏州，故不选。\n\n同类对比‑ ‑ 江苏名城名片(江苏)\n\n‑ 苏州：古称姑苏、平江，\"小桥流水、粉墙黛瓦、史迹名园\"，大运河沿线唯一以古城概念\n\n申遗的城市；\n\n‑ 南京：古称金陵、建康，中国四大古都之一、十朝都会；\n\n‑ 扬州：古称广陵、江都，\"淮左名都，竹西佳处\"\"中国运河第一城\"；\n\n‑ 无锡：别名梁溪，素有\"太湖明珠\"之誉。","clips":[]},{"n":57,"kind":"单项选择题","answer":"D","stem":"\"丞相祠堂何处寻，锦官城外柏森森\"出自杜甫的(    )。","options":{"A":"《登高》","B":"《登楼》","C":"《阁夜》","D":"《蜀相》"},"explanation":"\"丞相祠堂何处寻，锦官城外柏森森\"出自杜甫《蜀相》，杜甫有\"诗圣\"之称，其诗有\"\n\n诗史\"之誉。\n\n易混对比‑ ‑ 杜甫诗句与称号\n\n‑ \"丞相祠堂何处寻，锦官城外柏森森\"：出自杜甫《蜀相》；\n\n‑ 杜甫：有\"诗圣\"之称，其诗深刻地反映了安史之乱前后的社会现实，有\"诗史\"之誉；\n\n‑ 代表作：\"三吏三别\"(《新安吏》《石壕吏》《潼关吏》等)。","clips":[]},{"n":58,"kind":"单项选择题","answer":"B","stem":"《红楼梦》中有具体做法、可照法仿制的代表性菜品是(        )。","options":{"A":"糟鹅掌鸭信","B":"茄鲞","C":"炒豆腐脑","D":"黄焖鱼翅"},"explanation":"红楼菜的研制，一是根据书中写有具体做法的菜，照法仿制，如茄鲞等。A 为红楼菜\n\n代表名菜；C 为曾得到慈禧太后赞赏的宫廷素菜；D 为谭家菜代表名菜。26 版教材改动：红\n\n楼菜代表名菜名录调整‑ 新增茄鲞、鸡髓笋，\"糟掌\"改为\"糟鹅掌鸭信\"，删去乌龙戏珠、炸\n\n鹌鹑；本题所考\"照法仿制，如茄鲞\"新老教材一致。\n\n同类对比‑ ‑ 红楼菜\n\n‑ 性质：依据《红楼梦》所记述的贾府饮食研制，具有官府菜的特点；\n\n‑ 研制方式：一是根据书中写有具体做法的菜照法仿制，如茄鲞；\n\n‑ 代表名菜：茄鲞、糟鹅掌鸭信、火腿炖肘子、鸡髓笋、老蚌怀珠、怡红祝寿等。","clips":[]},{"n":59,"kind":"单项选择题","answer":"A","stem":"下列名山中，属典型的丹霞地貌的是(   )。","options":{"A":"福建武夷山","B":"陕西华山","C":"湖南张家界","D":"安徽黄山"},"explanation":"武夷山位于福建省武夷山市、江西省铅山县境内，属典型的丹霞地貌，素有\"碧水丹\n\n山\"\"奇秀甲东南\"之美誉，是世界文化与自然双遗产地。\n\n同类对比‑ ‑ 我国丹霞地貌景观\n\n‑ 命名：1928 年由中国学者在广东丹霞山正式命名，是唯一以我国地名命名、被国际地貌\n\n学会专门设立工作组独立研究的地貌类型；\n\n‑ 代表：广东丹霞山、福建武夷山、江西龙虎山和圭峰(也称龟峰)等；\n\n‑ 武夷山：位于福建省武夷山市、江西省铅山县境内，素有\"碧水丹山\"\"奇秀甲东南\"之美誉。","clips":[]},{"n":60,"kind":"单项选择题","answer":"B","stem":"北京社稷坛按\"五行\"中五方五色配置，其中中央为(    )。","options":{"A":"红","B":"黄","C":"白","D":"青"},"explanation":"北京社稷坛按\"五行\"中五方五色的配置，中央为黄，东方为青，南方为红，西方为白，\n\n北方为黑，用五色土覆盖于坛面，以象征\"普天之下，莫非王土\"和祈求全国风调雨顺、五谷\n\n丰登。\n\n易混对比‑ ‑ 社稷坛五色土\n\n‑ 配置：北京社稷坛按\"五行\"中五方五色配置，中央为黄，东方为青、南方为红、西方为白、\n\n北方为黑；\n\n‑ 做法：用五色土覆盖于坛面；\n\n‑ 寓意：象征\"普天之下，莫非王土\"，祈求全国风调雨顺、五谷丰登。","clips":[],"sourceNote":"试卷与解析的部分选项文字不同。此处保留试卷选项，两卷正确选项一致。"},{"n":61,"kind":"单项选择题","answer":"B","stem":"因春秋时期老子(李耳)归隐修炼于此，唐太宗赐名，有\"天下无双圣境，世界第一仙山\"美誉是(     )。","options":{"A":"嵩山","B":"老君山","C":"云台山","D":"白云山"},"explanation":"老君山因春秋时期老子(李耳)归隐修炼于此，唐太宗赐名\"老君山\"，是中原道教的核\n\n心圣地，有\"天下无双圣境，世界第一仙山\"美誉。A 项嵩山以\"天地之中\"历史建筑群著称，\n\nC 项云台山、D 项白云山均为河南著名山水景区，老子归隐修炼、唐太宗赐名者为老君山，\n\n故不选。\n\n易混对比‑ ‑ 河南名山(河南)\n\n‑ 老君山：老子归隐修炼地，唐太宗赐名，\"天下无双圣境，世界第一仙山\"；\n\n‑ 嵩山：\"天地之中\"历史建筑群为世界文化遗产，少林寺坐落于腹地；\n\n‑ 云台山：5A 景区，以峡谷地貌著称。","clips":[]},{"n":62,"kind":"单项选择题","answer":"C","stem":"(   )城内街道、集市、商铺等还保留着原有形制，是研究我国明清县城建置的实物资料。","options":{"A":"南京古城","B":"西安古城","C":"平遥古城","D":"丽江古城"},"explanation":"平遥古城位于山西省平遥县，始建于西周，距今已有 2800 多年的悠久历史。现存城\n\n墙为明洪武年间重建，墙外有护城河。城内街道、集市、商铺等还保留着原有形制，是研究\n\n我国明清县城建置的实物资料。\n\n同类对比‑ ‑ 平遥古城与著名古城\n\n‑ 平遥古城：位于山西省平遥县，始建于西周，距今已有 2800 多年的历史；\n\n‑ 价值：晋商文化的代表，是清代中国的\"金融中心\"，被誉为\"中国古代华尔街\"；\n\n‑ 四大古城：我国保存最完好的历史文化古城是平遥古城、丽江古城、徽州古城、阆中古城。","clips":[]},{"n":63,"kind":"单项选择题","answer":"A","stem":"2023 年，习近平总书记在内蒙古、新疆、广西考察时指出，新时代党的民族工作和民族地区各项工作的共同主线是(        )。","options":{"A":"铸牢中华民族共同体意识","B":"坚持民族区域自治","C":"促进民族团结进步","D":"推动各民族共同繁荣"},"explanation":"2023 年，习近平总书记在内蒙古、新疆、广西考察时指出，铸牢中华民族共同体意\n\n识是新时代党的民族工作的主线，也是民族地区各项工作的主线。B 项民族区域自治是中国\n\n解决国内民族问题的基本政策，也是我国的一项基本政治制度。C 项促进民族团结进步是《中\n\n华人民共和国民族团结进步促进法》的立法目的之一。D 项各民族共同繁荣发展是民族区域\n\n自治的着力点之一。26 版教材新增考点。\n\n同类对比‑ ‑ 新时代党的民族工作\n\n‑ 主线：铸牢中华民族共同体意识是新时代党的民族工作的主线，也是民族地区各项工作的\n\n主线；\n\n‑ 提出：2023 年，习近平总书记在内蒙古、新疆、广西考察时指出；\n\n‑ 法律保障：2026 年 7 月 1 日起施行的《中华人民共和国民族团结进步促进法》进一步明\n\n确\"国家坚持和完善民族区域自治制度\"。","clips":[]},{"n":64,"kind":"单项选择题","answer":"B","stem":"有\"乾坤聚秀之区，阴阳合会之所\"之称的是(   )。","options":{"A":"清东陵","B":"清西陵","C":"明十三陵","D":"明显陵"},"explanation":"清西陵有\"乾坤聚秀之区，阴阳合会之所\"之称。A 项清东陵在河北遵化，C 项明十三\n\n陵在北京昌平，D 项明显陵在湖北钟祥，有\"乾坤聚秀之区，阴阳合会之所\"之称者为清西陵，\n\n故不选。\n\n易混对比‑ ‑ 清代皇陵(河北)\n\n‑ 清西陵：有\"乾坤聚秀之区，阴阳合会之所\"之称；\n\n‑ 清东陵已开放 10 座陵寝，孝陵神道长达千米，为清代最长神道。","clips":[]},{"n":65,"kind":"单项选择题","answer":"B","stem":"被视为道教发祥地的青城山、终南山，在道教流派上属于(   )。","options":{"A":"正一道","B":"全真派","C":"灵宝派","D":"净明道"},"explanation":"目前全国道教宫观大部分属全真派，被视为道教发祥地的青城山、终南山皆属全真派，\n\n北京白云观、成都青羊宫、沈阳太清宫等都是全真派的著名道观。A 正一道主要流行在江南\n\n和台湾，以苏州玄妙观、桃园妙应坛等为代表。\n\n易混对比‑ ‑ 道教全真派与正一道\n\n‑ 全真派：目前全国道教宫观大部分属全真派，青城山、终南山皆属全真派；\n\n‑ 全真派名观：北京白云观、成都青羊宫、沈阳太清宫等；\n\n‑ 正一道：主要流行在江南和台湾，以苏州玄妙观、桃园妙应坛等为代表。","clips":[]},{"n":66,"kind":"单项选择题","answer":"C","stem":"世界首个双重遗产是(   )。","options":{"A":"武夷山","B":"黄山","C":"泰山","D":"峨眉山及乐山大佛"},"explanation":"世界文化与自然双重遗产是指自然和文化价值相结合的遗产，泰山(泰山、岱庙、济\n\n南灵岩寺)是世界首个双重遗产。双遗 4：吾皇太饿‑ ‑ 武(武夷山)皇(黄山)太(泰山)峨(峨\n\n眉山‑ 乐山大佛)。我国世界文化与自然双重遗产共 4 项：泰山、黄山、峨眉山及乐山大佛、\n\n武夷山，数量与澳大利亚并列世界第一。\n\n同类对比‑ ‑ 世界双重遗产\n\n‑ 泰山：世界首个双重遗产(山东)；\n\n‑ 4 处名单：泰山、黄山、峨眉山及乐山大佛、武夷山；\n\n‑ 数量：与澳大利亚并列世界第一。","clips":[]},{"n":67,"kind":"单项选择题","answer":"C","stem":"下列名茶中，属于黄茶的是(       )。","options":{"A":"西湖龙井","B":"安徽祁红","C":"君山银针","D":"铁观音"},"explanation":"黄茶著名品种有君山银针、蒙顶黄芽等。A 西湖龙井与太湖碧螺春、黄山毛峰、峨眉\n\n竹叶青并为最负盛名的绿茶；B 安徽祁红、云南滇红是红茶名品；D 铁观音是福建乌龙茶名\n\n品。\n\n易混对比‑ ‑ 黄茶与绿茶名品\n\n‑ 黄茶：著名品种有君山银针、蒙顶黄芽等，黄叶黄汤；\n\n‑ 黄茶工艺：加工过程中采用杀青、焖黄的方法，使鲜叶进行非酶性氧化；\n\n‑ 绿茶：西湖龙井茶、太湖碧螺春茶、黄山毛峰茶、峨眉竹叶青茶最负盛名。","clips":[]},{"n":68,"kind":"单项选择题","answer":"D","stem":"盐矿储藏量不仅是中国之最、也是世界之最，素有\"聚宝盆\"美称的盆地是(      )。","options":{"A":"塔里木盆地","B":"准噶尔盆地","C":"四川盆地","D":"柴达木盆地"},"explanation":"柴达木盆地的盐矿储藏量不仅是中国之最，也是世界之最，察尔汗盐湖、茶卡盐湖为\n\n国内知名盐湖和旅游点，有\"聚宝盆\"的美称。\n\n易混对比‑ ‑ 柴达木盆地\n\n‑ 位置：位于青海省西北部和青藏高原东北部，为高原型盆地；\n\n‑ 盐矿：盐矿储藏量不仅是中国之最，也是世界之最，察尔汗盐湖、茶卡盐湖为国内知名盐\n\n湖和旅游点；\n\n‑ 聚宝盆：盆地还盛产锂矿、铁矿、铜矿、锡矿等多种矿物，故有\"聚宝盆\"的美称。","clips":[]},{"n":69,"kind":"单项选择题","answer":"C","stem":"被誉为\"草原明珠\"的是(   )。","options":{"A":"锡林郭勒草原","B":"科尔沁草原","C":"呼伦贝尔草原","D":"乌兰布统草原"},"explanation":"呼伦贝尔草原被誉为\"草原明珠\"。A 项锡林郭勒草原、B 项科尔沁草原、D 项乌兰布\n\n统草原均为内蒙古著名草原，但被善为\"草原明珠\"者为呼伦贝尔草原，故不选。\n\n易混对比‑ ‑ 草原誉称(内蒙古)\n\n‑ 呼伦贝尔草原：\"草原明珠\"；\n\n‑ 科尔沁草原：\"草原上的花园\"。","clips":[]},{"n":70,"kind":"单项选择题","answer":"D","stem":"崇圣寺三塔是大理\"文献名邦\"的象征，位于(      )。","options":{"A":"云南昆明","B":"四川成都","C":"贵州贵阳","D":"云南大理"},"explanation":"崇圣寺三塔位于云南大理，是大理\"文献名邦\"的象征，是云南古代历史文化的象征，\n\n也是中国南方最古老、最雄伟的建筑之一。\n\n同类对比‑ ‑ 崇圣寺三塔与著名古塔\n\n‑ 崇圣寺三塔：是大理\"文献名邦\"的象征，也是云南古代历史文化的象征；\n\n‑ 地位：中国南方最古老、最雄伟的建筑之一；\n\n‑ 其他名塔：河南嵩岳寺塔、西安小雁塔(方形密檐式)、北京妙应寺白塔(覆钵式塔)等都是\n\n现存著名古塔。","clips":[]},{"n":71,"kind":"单项选择题","answer":"D","stem":"北宋时在成都产生的世界上最早的纸币是(       )。","options":{"A":"银票","B":"会子","C":"飞钱","D":"交子"},"explanation":"北宋时在成都产生了世界上最早的纸币‑ ‑ 交子。A 项银票为明清信用工具，B 项会\n\n子为南宋纸币，C 项飞钱为唐代汇兑凭证，世界上最早的纸币为北宋成都产生的交子，故不\n\n选。唐宋时期四川经济发达，唐代有\"扬一益二\"之称(扬：扬州；益：益州)。\n\n同类对比‑ ‑ 古代四川经济名片(四川)\n\n‑ \"扬一益二\"：唐代扬州、益州(成都)并称，经济发达；\n\n‑ 交子：北宋时在成都产生，世界上最早的纸币。","clips":[]},{"n":72,"kind":"单项选择题","answer":"A","stem":"\"星星的故乡\"\"看见贺兰\"等新业态推动(     )\"文+百业\"深度融合。","options":{"A":"宁夏","B":"甘肃","C":"青海","D":"新疆"},"explanation":"\"星星的故乡\"\"看见贺兰\"等新业态推动宁夏\"文旅+百业\"深度融合。B 项甘肃、C 项青\n\n海、D 项新疆均为西北省区，但\"星星的故乡\"\"看见贺兰\"等新业态推动\"文旅+百业\"深度融\n\n合者为宁夏，故不选。贺兰山东麓葡萄酒品牌价值在葡萄酒细分领域中居中国第一、世界第\n\n四，获国际顶级赛事大奖 1100 多项。","clips":[]},{"n":73,"kind":"单项选择题","answer":"D","stem":"明清科举殿试一甲前三名赐\"进士及第\"，二甲、三甲分别赐(    )。","options":{"A":"\"同进士出身\"和\"进士出身\"","B":"\"解元出身\"和\"会元出身\"","C":"\"贡士出身\"和\"进士出身\"","D":"\"进士出身\"和\"同进士出身\""},"explanation":"明清科举殿试排名分三等称\"三甲\"，一甲前三名赐\"进士及第\"，二甲和三甲分别赐\"\n\n进士出身\"和\"同进士出身\"称号。B 解元、会元分别是乡试、会试第一名的称呼。\n\n易混对比‑ ‑ 明清科举\"三甲\"\n\n‑ 一甲：取前三名，分别称状元、榜眼、探花，赐\"进士及第\"；\n\n‑ 二甲：赐\"进士出身\"；\n\n‑ 三甲：赐\"同进士出身\"；\n\n‑ 连中三元：乡试第一名解元、会试第一名会元、殿试第一名状元。","clips":[]},{"n":74,"kind":"单项选择题","answer":"A","stem":"正定\"三八席\"是极具代表性的传统民俗宴席，\"三八席\"是指(   )。","options":{"A":"八凉、八热、八蒸碗","B":"四凉、四热、八大碗","C":"六凉、六热、六蒸碗","D":"八冷、八热、八扣碗"},"explanation":"正定\"三八席\"(八凉、八热、八蒸碗)是极具代表性的传统民俗宴席。B 项\"四凉、四\n\n热、八大碗\"、C 项\"六凉、六热、六蒸碗\"、D 项\"八冷、八热、八扣碗\"均与教材\"八凉、八\n\n热、八蒸碗\"的表述不符，故不选。\n\n同类对比‑ ‑ 河北风物(河北)\n\n‑ \"涉县三珍\"(\"太行三珍\")：核桃、柿子、花椒；\n\n‑ 河间驴肉火烧：河北标志性特产美食；\n\n‑ 正定\"三八席\"：八凉、八热、八蒸碗的传统民俗宴席。","clips":[]},{"n":75,"kind":"单项选择题","answer":"C","stem":"新疆维吾尔族地区特有的水利灌溉工程是(   )。","options":{"A":"都江堰","B":"灵渠","C":"坎儿井","D":"红旗渠"},"explanation":"坎儿井是新疆维吾尔族地区特有的水利灌溉工程。A 项都江堰在四川，B 项灵渠在广\n\n西，D 项红旗渠在河南安阳林州，新疆维吾尔族地区特有的水利灌溉工程为坎儿井，故不选。\n\n易混对比‑ ‑ 古代水利工程\n\n‑ 都江堰：四川，战国时期修筑；\n\n‑ 灵渠：广西，沟通湘江与漓江；\n\n‑ 坎儿井：新疆特有，维吾尔族地区水利灌溉工程；\n\n‑ 红旗渠：河南安阳林州，被誉为\"人工天河\"。","clips":[]},{"n":76,"kind":"单项选择题","answer":"D","stem":"浙江龙泉青瓷在(   )时达到巅峰。","options":{"A":"元朝","B":"明朝","C":"北宋","D":"南宋"},"explanation":"龙泉青瓷在南宋时达到巅峰，成品具备\"青如玉、明如镜、薄如纸、声如磬\"的特点。\n\n同类对比‑ ‑ 龙泉青瓷\n\n‑ 产地：浙江龙泉，境内烧制青瓷的古代窑址有 360 多处，史称龙泉窑；\n\n‑ 巅峰：龙泉青瓷在南宋时达到巅峰；\n\n‑ 特点：成品具备\"青如玉、明如镜、薄如纸、声如磬\"的特点。","clips":[]},{"n":77,"kind":"单项选择题","answer":"A","stem":"最能代表潍坊风筝特点的是(   )。","options":{"A":"\"蜈蚣\"风筝","B":"\"灵芝\"风筝","C":"硬翅风筝","D":"软翅风筝"},"explanation":"潍坊风筝题材广泛，其中最能代表其特点的是\"蜈蚣\"风筝；以\"龙头蜈蚣\"为代表的制\n\n作技艺曾获金奖。26 教材新增考点。\n\n同类对比‑ ‑ 潍坊风筝\n\n‑ 地位：潍坊是\"世界风筝都\"，也被称为\"风筝的故乡\"；\n\n‑ 代表：潍坊风筝题材广泛，最能代表其特点的当数\"蜈蚣\"风筝；\n\n‑ 非遗：2006 年，潍坊风筝制作技艺被列入第一批国家级非物质文化遗产名录。","clips":[]},{"n":78,"kind":"单项选择题","answer":"B","stem":"著有《史学要论》、大力宣传马克思主义唯物史观的学者是(      )。","options":{"A":"梁启超","B":"李大钊","C":"郭沫若","D":"范文澜"},"explanation":"李守常(李大钊)著《史学要论》，大力宣传马克思主义唯物史观。\n\n易混对比‑ ‑ 李大钊与马克思主义史学\n\n‑ 李大钊：著《史学要论》，大力宣传马克思主义唯物史观；\n\n‑ 李大钊(李守常)：是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者；\n\n‑ 郭沫若、范文澜：等一批学者也先后运用唯物史观开展历史研究。","clips":[]},{"n":79,"kind":"单项选择题","answer":"A","stem":"春秋鲁国人，中国儒家文化的集大成者，被后世奉为\"圣人\"的是(       )。","options":{"A":"孔丘","B":"孟子","C":"荀子","D":"曾子"},"explanation":"春秋鲁国人孔丘是中国儒家文化的集大成者，被后世奉为\"圣人\"。B 项孟子被尊为\"\n\n亚圣\"，C 项荀子为战国儒家代表，D 项曾子为孔子弟子，中国儒家文化的集大成者、被后世\n\n奉为\"圣人\"者为孔丘，故不选。\n\n同类对比‑ ‑ 儒家圣贤与\"三孔\"(山东)\n\n‑ 孔丘：春秋鲁国人，儒家文化集大成者，被后世奉为\"圣人\"；\n\n‑ 孔庙：\"天下第一庙\"，建筑时间最久远、保存最完整；\n\n‑ 孔府：\"天下第一家\"，延续时间最长的贵族庄园；\n\n‑ 孔林：世界上规模最大、延续时间最久的家族古墓群。","clips":[]},{"n":80,"kind":"单项选择题","answer":"C","stem":"古代天文学中，\"荧惑星\"指的是(   )。","options":{"A":"水星","B":"金星","C":"火星","D":"土星"},"explanation":"易混对比‑ ‑ 五星与七曜\n\n‑ 五星：荧惑星(火星)、辰星(水星)、岁星(木星)、太白星(金星)、镇星(土星)；\n\n‑ 七曜：五星又称五曜，加上太阳星(日)、太阴星(月)合称七曜；\n\n‑ 荧惑：即火星，本题所考\"荧惑星\"。","clips":[]},{"n":81,"kind":"单项选择题","answer":"A","stem":"1935 年 12 月召开的瓦窑堡会议明确提出党的基本策略任务是(   )。","options":{"A":"建立广泛的抗日民族统一战线","B":"确立思想建党、政治建军原则","C":"确立毛泽东在党中央和红军的领导地位","D":"确定把全党工作重点转移到社会主义现代化建设上来"},"explanation":"1935 年 12 月 17~25 日，中共中央在陕北子长县瓦窑堡召开政治局扩大会议，即瓦窑\n\n堡会议；会议决议和毛泽东《论反对日本帝国主义的策略》的报告，明确提出了党的基本策\n\n略任务是建立广泛的抗日民族统一战线。B 确立思想建党、政治建军原则的是古田会议；C\n\n遵义会议事实上确立了毛泽东同志在党中央和红军的领导地位；D 确定把全党工作重点转移\n\n到社会主义现代化建设上来的是党的十一届三中全会。\n\n易混对比‑ ‑ 党的会议与历史贡献\n\n‑ 瓦窑堡会议：1935 年 12 月召开，明确提出党的基本策略任务是建立广泛的抗日民族统一\n\n战线；\n\n‑ 古田会议：1929 年 12 月召开，确立了思想建党、政治建军的原则；\n\n‑ 遵义会议：1935 年 1 月召开，事实上确立了毛泽东同志在党中央和红军的领导地位，是\n\n党的历史上生死攸关的转折点。","clips":[]},{"n":82,"kind":"单项选择题","answer":"B","stem":"中国最大的北方小油菜基地的是(    )。","options":{"A":"青海湖","B":"百里油菜花海","C":"龙羊峡","D":"贵德梨花"},"explanation":"百里油菜花海位于海北藏族自治州门源县、祁连山与大坂山之间的盆地，是中国最大\n\n的北方小油菜基地。A 项青海湖、C 项龙羊峡、D 项贵德梨花均为青海知名景观，位于门源\n\n县、为中国最大北方小油菜基地者为百里油菜花海，故不选。\n\n同类对比‑ ‑ 青海名片(青海)\n\n‑ 青海湖：我国最大的内陆咸水湖；\n\n‑ 柴达木盆地：以\"聚宝盆\"著称于世；\n\n‑ 百里油菜花海：位于门源县，中国最大的北方小油菜基地。","clips":[]},{"n":83,"kind":"单项选择题","answer":"A","stem":"中国第一部字典是东汉许慎编撰的(    )。","options":{"A":"《说文解字》","B":"《康熙字典》","C":"《广韵》","D":"《尔雅》"},"explanation":"东汉许慎编撰了中国第一部字典《说文解字》，保存了大批先秦字体和汉代的文字训\n\n诂，反映了上古汉语词汇的面貌。","clips":[]},{"n":84,"kind":"单项选择题","answer":"C","stem":"蕈状岩的典型代表，野柳地质公园的象征，台湾旅游业一张亮丽名片的是(         )。","options":{"A":"烛台石","B":"仙女鞋","C":"女王头","D":"豆腐岩"},"explanation":"女王头是蕈状岩的典型代表，是野柳地质公园的象征，更是台湾旅游业的一张亮丽的\n\n名片。A 项烛台石、B 项仙女鞋、D 项豆腐岩均为野柳地质公园著名景观，但蕈状岩典型代\n\n表、野柳地质公园象征者为女王头，故不选。\n\n同类对比‑ ‑ 野柳风景区(台湾)\n\n‑ 野柳：伸入海中的山岬，远望如海龟蹒跚离岸，故称野柳龟；\n\n‑ 女王头：蕈状岩典型代表，野柳地质公园的象征，台湾旅游业的亮丽名片。","clips":[]},{"n":85,"kind":"单项选择题","answer":"A","stem":"满族人口居全国第 1 位的省份是(   )。","options":{"A":"辽宁省","B":"吉林省","C":"黑龙江省","D":"河北省"},"explanation":"辽宁人口占全国满族人口的 50.4%，居全国第 1 位。B 项吉林、C 项黑龙江、D 项河北\n\n均非教材所载满族人口占比最高的省份，满族人口占全国 50.4%、居全国第 1 位的是辽宁，\n\n故不选。\n\n同类对比‑ ‑ 辽宁民族人口(辽宁)\n\n‑ 满族：人口占全国满族人口的 50.4%，居全国第 1 位；\n\n‑ 锡伯族：人口占全国锡伯族人口的 70.2%，居全国第 1 位；\n\n‑ 世居少数民族：满族、蒙古族、回族、朝鲜族、锡伯族。","clips":[]},{"n":86,"kind":"单项选择题","answer":"D","stem":"世界独立纬向山系之最、距海洋最远的山系是(         )。","options":{"A":"祁连山","B":"喜马拉雅山","C":"昆仑山","D":"天山"},"explanation":"天山位于欧亚大陆腹地，横贯中国新疆中部，为世界独立纬向山系之最，也是世界上\n\n距离海洋最远的山系。\n\n同类对比‑ ‑ 天山\n\n‑ 位置：位于欧亚大陆腹地，横贯中国新疆中部，在塔里木盆地和准噶尔盆地之间；\n\n‑ 之最：世界独立纬向山系之最，也是世界上距离海洋最远的山系；\n\n‑ 干旱：还是全球干旱地区最大的山系。","clips":[]},{"n":87,"kind":"单项选择题","answer":"C","stem":"具有\"一座没有围墙的博物馆\"独特魅力的城市是(        )。","options":{"A":"杭州市","B":"宁波市","C":"绍兴市","D":"嘉兴市"},"explanation":"绍兴具有\"一座没有围墙的博物馆\"的独特魅力。A 项杭州以西湖文化著称，B 项宁波\n\n为港口城市，D 项嘉兴有南湖红船，具有\"一座没有围墙的博物馆\"魅力者为绍兴，故不选。\n\n同类对比‑ ‑ 浙江城市名片(浙江)\n\n‑ 绍兴：\"一座没有围墙的博物馆\"；\n\n‑ 杭州：以西湖文化、运河文化、钱塘江文化为核心，\"茶都\"；\n\n‑ 景宁：全国唯一的畲族自治县。","clips":[]},{"n":88,"kind":"单项选择题","answer":"B","stem":"春秋时期称霸中原，成为春秋五霸之一的楚国国君是(            )。","options":{"A":"楚成王","B":"楚庄王","C":"楚怀王","D":"楚悼王"},"explanation":"春秋时期楚庄王称霸中原，成为春秋五霸之一。A 项楚成王、C 项楚怀王、D 项楚悼\n\n王均为楚国国君，但春秋时期称霸中原、成为春秋五霸之一者为楚庄王，故不选。\n\n同类对比‑ ‑ 楚文化源流(湖北)\n\n‑ 屈家岭文化：长江中游新石器时代大型聚落遗址，楚文化发展的基础；\n\n‑ 楚先民：以凤鸟为图腾；\n\n‑ 楚庄王：春秋时期称霸中原，春秋五霸之一；\n\n‑ 屈原：战国时代伟大诗人，创造\"楚辞\"诗体，作《离骚》《九歌》《九章》《天问》。","clips":[]},{"n":89,"kind":"单项选择题","answer":"A","stem":"世界上最小的国家，是一个\"国中国\"的是(     )。","options":{"A":"梵蒂冈","B":"摩纳哥","C":"列支敦士登","D":"圣马力诺"},"explanation":"梵蒂冈是世界上最小的国家，面积 0.44 平方千米，在罗马城的西北角，是一个\"国中\n\n国\"，也是全世界天主教的中心。\n\n同类对比‑ ‑ 梵蒂冈\n\n‑ 地位：世界上最小的国家；\n\n‑ 面积：面积 0.44 平方千米，在罗马城的西北角；\n\n‑ 特点：是一个\"国中国\"，也是全世界天主教的中心‑ ‑ 以教皇为首的教廷的所在地。","clips":[]},{"n":90,"kind":"单项选择题","answer":"B","stem":"青藏高原唯一人口超过百万的中心城市的是(      )。","options":{"A":"拉萨","B":"西宁","C":"格尔木","D":"兰州"},"explanation":"西宁古称西平郡、青唐城，是青藏高原唯一人口超过百万的中心城市。A 项拉萨是西\n\n藏自治区首府，C 项格尔木坐拥察尔汗盐湖等景观，D 项兰州为甘肃省会，青藏高原唯一人\n\n口超过百万的中心城市为西宁，故不选。\n\n同类对比‑ ‑ 青藏高原城市\n\n‑ 西宁：青藏高原唯一人口超过百万的中心城市，古称西平郡、青唐城(青海)；\n\n‑ 拉萨：藏语意为\"圣地\"，史称\"逻些\"，素有\"日光城\"美誉(西藏)。","clips":[]},{"n":91,"kind":"单项选择题","answer":"B","stem":"拥有人类非物质文化遗产数量最多的国家是(      )。","options":{"A":"意大利","B":"中国","C":"法国","D":"日本"},"explanation":"截至目前，我国共有 45 个项目列入联合国教科文组织非遗名录、名册，总数居世界\n\n第一，其中，列入代表作名录 40 项，列入急需保护名录项目 3 项，入选优秀保护实践名册\n\n2 项。(数据更新，以此为准)。\n\n口诀：非遗 45 中国一：代表 40，急 3，优 2。","clips":[]},{"n":92,"kind":"单项选择题","answer":"B","stem":"世界最大的藏学学府，藏传佛教格鲁派六大宗主寺一的是(          )。","options":{"A":"塔尔寺","B":"拉卜楞寺","C":"大昭寺","D":"哲蚌寺"},"explanation":"甘南夏河拉卜楞寺世界最大的藏学学府、藏传佛教格鲁派六大宗主寺之一、青川地区\n\n最大的藏族宗教和文化中心。A 项塔尔寺在青海西宁，C 项大昭寺在西藏拉萨，D 项哲蚌寺\n\n为拉萨格鲁派三大寺之一，世界最大的藏学学府为甘南夏河拉卜楞寺，故不选。\n\n易混对比‑ ‑ 藏传佛教格鲁派名寺\n\n‑ 拉卜楞寺：世界最大的藏学学府，位于甘南夏河(甘肃)；\n\n‑ 塔尔寺：宗喀巴诞生地，艺术\"三绝\"酥油花、堆绣、壁画(青海)；\n\n‑ 甘丹寺、色拉寺、哲蚌寺：拉萨著名寺院(西藏)；\n\n‑ 扎什伦布寺：日喀则著名寺院(西藏)。","clips":[]},{"n":93,"kind":"单项选择题","answer":"D","stem":"香港的(   )被称为\"百业之首\"。","options":{"A":"旅游业","B":"航运业","C":"贸易业","D":"金融业"},"explanation":"香港的金融业被称为\"百业之首\"。A 项旅游业、B 项航运业、C 项贸易业均为香港重\n\n要产业，但被称为\"百业之首\"者为香港的金融业，故不选。\n\n同类对比‑ ‑ 香港经济地位(香港)\n\n‑ 金融业：被称为\"百业之首\"；\n\n‑ 国际金融中心：继纽约、伦敦之后的世界第三大金融中心；\n\n‑ 四大支柱行业：金融服务业、旅游业、贸易及物流业、专业及工商业支援服务业。","clips":[]},{"n":94,"kind":"单项选择题","answer":"C","stem":"金银线垫绣是(   )中具有特色的工种之一，它使绣上的景物形象富有立体感。","options":{"A":"苏州苏绣","B":"湖南湘绣","C":"广东粤绣","D":"四川蜀绣"},"explanation":"粤绣以“金银线绣”和“垫绣”为核心技法。“垫绣”是粤绣的独创，通过在纹样下\n\n方垫入棉絮等材料，使纹样凸起，具有强烈的立体感。\n\n26 版教材将粤绣核心技法“金银线垫绣”拆分为“金银线绣”和“垫绣”，删除“绣工多为\n\n男工”等旧述。\n\n同类对比——四大名绣\n\n· 苏绣：产地江苏苏州，以针法细腻、色彩清雅、构图精巧著称；\n\n· 湘绣：产自湖南长沙，以狮、虎为代表题材，有“苏猫湘虎”之说，独门绝技为“毛针”；\n\n· 粤绣：产于广东，以“金银线绣”和“垫绣”为核心技法，《百鸟朝凤》是粤绣名作；\n\n· 蜀绣：以四川成都为中心，有“蜀中之宝”的美誉，代表作有《蜀宫乐女演乐图》《熊猫\n\n图》《芙蓉鲤鱼》。","clips":[]},{"n":95,"kind":"单项选择题","answer":"D","stem":"1947 年 8 月，揭开人民解放军战略反攻序幕的是(    )。","options":{"A":"攻克济南","B":"三大战役","C":"转战陕北","D":"千里跃进大别山"},"explanation":"1947 年 6 月，刘邓大军突破黄河天险，8 月，千里跃进大别山，揭开战略反攻的序幕。\n\n同类对比‑ ‑ 人民解放战争战略反攻\n\n‑ 时间：1947 年 6 月刘邓大军突破黄河天险，8 月千里跃进大别山；\n\n‑ 意义：揭开了战略反攻的序幕；\n\n‑ 战果：到 11 月共歼敌 3 万余人，建立 33 个县的民主政权。","clips":[]},{"n":96,"kind":"单项选择题","answer":"B","stem":"1930 年夏，全国面积最大、力量最强的农村革命根据地是(       )。","options":{"A":"井冈山革命根据地","B":"赣南闽西根据地","C":"湘鄂西革命根据地","D":"陕甘革命根据地"},"explanation":"到 1930 年夏，全国已经建立十几块农村革命根据地，其中毛泽东、朱德领导下的赣\n\n南闽西根据地是当时全国面积最大、力量最强的根据地，建立了苏区中央局和苏维埃中央政\n\n府。\n\n同类对比‑ ‑ 中央革命根据地\n\n‑ 地位：赣南闽西根据地是当时全国面积最大、力量最强的农村革命根据地；\n\n‑ 领导：由毛泽东、朱德领导建立；\n\n‑ 别称：建立了苏区中央局和苏维埃中央政府，因此又称中央根据地、中央苏区。","clips":[]},{"n":97,"kind":"单项选择题","answer":"C","stem":"\"越陈越香\"是(   )区别于其他茶类的最大特点。","options":{"A":"碧螺春","B":"大红袍","C":"普洱茶","D":"铁观音"},"explanation":"\"越陈越香\"被公认为是普洱茶区别于其他茶类的最大特点，还有一定的减肥降脂功效。\n\n同类对比‑ ‑ 普洱茶\n\n‑ 特点：\"越陈越香\"被公认为是普洱茶区别于其他茶类的最大特点；\n\n‑ 功效：还有一定的减肥降脂功效；\n\n‑ 归类：普洱茶是黑茶名品，黑茶主要分布在湖南、四川、云南、湖北。","clips":[]},{"n":98,"kind":"单项选择题","answer":"D","stem":"中国经济第一大省是(    )。","options":{"A":"江苏省","B":"山东省","C":"浙江省","D":"广东省"},"explanation":"广东经济发展水平稳居全国首位，不仅是中国第一经济大省，更是全球最具活力和竞\n\n争力的区域经济体之一。A 项江苏、B 项山东、C 项浙江均为经济大省，但中国经济第一大\n\n省为广东，故不选。\n\n同类对比‑ ‑ 经济大省座次\n\n‑ 广东：中国第一经济大省，经济发展水平稳居全国首位；\n\n‑ 江苏：2025 年经济总量突破 14 万亿元，稳居全国第二位；\n\n‑ 上海：2025 年经济总量 5.67 万亿元，稳居中国城市首位。","clips":[]},{"n":99,"kind":"单项选择题","answer":"C","stem":"以蓝釉为其特点的北京特有传统工艺品是(     )。","options":{"A":"苏绣","B":"玉雕","C":"景泰蓝","D":"内画鼻烟壶"},"explanation":"景泰蓝是北京特有的传统工艺品，得名于明朝景泰年间，且以蓝釉为其特点。A 项苏\n\n绣为江苏苏州传统工艺，B 项玉雕、D 项内画鼻烟壶虽为北京传统工艺，但得名于明朝景泰\n\n年间、以蓝釉为特点者为景泰蓝，故不选。\n\n同类对比‑ ‑ 景泰蓝(北京)\n\n‑ 得名：明朝景泰年间，以蓝釉为特点，北京特有传统工艺品；\n\n‑ 工艺：集青铜、瓷器、传统绘画、雕刻技艺于一体，堪称中国传统工艺的集大成者；\n\n‑ 现存最早产品：元代，已有近千年历史。","clips":[]},{"n":100,"kind":"单项选择题","answer":"B","stem":"全球最大综合孔径射电望远镜是(   )。","options":{"A":"中国天眼","B":"千眼天珠","C":"郭守敬望远镜","D":"拉索"},"explanation":"圆环阵太阳射电成像望远镜直径 1000 米，由 313 台 6 米口径射电天线均匀排列而成，\n\n是全球最大综合孔径射电望远镜，可以全天候监测太阳射电爆发，预警空间天气。因从空中\n\n俯瞰像一串巨大珠串，故名\"千眼天珠\"。D\"拉索\"是超高能伽马射线探测装置。\n\n易混对比‑ ‑ \"拉索\"与\"千眼天珠\"\n\n‑ \"拉索\"：全球海拔最高、规模最大、灵敏度最强的超高能伽马射线探测装置；\n\n‑ \"千眼天珠\"：全球最大综合孔径射电望远镜，直径 1000 米，由 313 台 6 米口径射电天线\n\n均匀排列而成；\n\n‑ 位置：二者均在四川稻城县建成。","clips":[]},{"n":101,"kind":"单项选择题","answer":"B","stem":"我国第一艘载人飞船(   )成功升空并安全着陆，中国成为世界上第三个独立掌握载人航天技术的国家。","options":{"A":"神舟四号","B":"神舟五号","C":"神舟六号","D":"神舟七号"},"explanation":"2003 年 10 月 15‑ 16 日，神舟五号载人飞船成功升空并安全着陆，中国成为世界上\n\n第三个独立掌握载人航天技术的国家；我国载人航天工程通过\"神舟\"系列飞船建起了天宫空\n\n间站，实现了从无人飞行到载人飞行、从一人一天到多人多天、从空间出舱到交会对接、从\n\n单船飞行到组合体稳定运行的跨越。\n\n同类对比‑ ‑ 我国重大科技成就\n\n‑ 神舟五号：载人飞船成功升空并安全着陆，中国成为世界上第三个独立掌握载人航天技术\n\n的国家；\n\n‑ \"拉索\"：全球海拔最高、规模最大、灵敏度最强的超高能伽马射线探测装置；\n\n‑ \"千眼天珠\"：全球最大综合孔径射电望远镜，由 313 台 6 米口径射电天线均匀排列而成。","clips":[]},{"n":102,"kind":"单项选择题","answer":"B","stem":"客家人聚族而居，被称为中国传统民居的瑰宝、体现宗族凝聚力的是(   )。","options":{"A":"开平碉楼","B":"福建土楼","C":"吊脚楼","D":"围龙屋"},"explanation":"客家人聚族而居，福建土楼被称为中国传统民居的瑰宝，体现了宗族凝聚力，被列入\n\n《世界遗产名录》。A 项开平碉楼在广东，C 项吊脚楼为土家族等民族的传统民居，D 项围龙\n\n屋是客家文化特色民居，被称为\"中国传统民居的瑰宝\"者为福建土楼，故不选。\n\n易混对比‑ ‑ 民居与地域\n\n‑ 福建土楼：中国传统民居的瑰宝，体现宗族凝聚力，列入《世界遗产名录》(福建)\n\n‑ 开平碉楼：华侨文化特色民居，列入《世界遗产名录》(广东)；\n\n‑ 围龙屋：客家特色民居建筑(广东)；\n\n‑ 吊脚楼：土家族、苗族依山而建的传统民居(湖南、贵州等)。","clips":[]},{"n":103,"kind":"单项选择题","answer":"C","stem":"\"一陵两家\"的陵寝结构为历代帝王陵墓所绝无仅有的是(       )。","options":{"A":"清东陵","B":"西夏王陵","C":"明显陵","D":"长陵"},"explanation":"明显陵位于湖北省钟祥市，是明世宗嘉靖皇帝的父亲恭睿献皇帝和母亲章圣皇太后的\n\n合葬墓，其\"一陵两冢\"的陵寝结构为历代帝王陵墓所绝无仅有。\n\n同类对比‑ ‑ 明代帝陵\n\n‑ 明显陵：位于湖北，嘉靖皇帝父母的合葬墓，\"一陵两冢\"结构为历代帝王陵墓所绝无仅有；\n\n‑ 明孝陵：在南京东郊紫金山，朱元璋与皇后马氏合葬，是中国明陵之首；\n\n‑ 明十三陵：在北京昌平天寿山南麓，环葬明代十三位皇帝，长陵位居陵区正中。","clips":[]},{"n":104,"kind":"单项选择题","answer":"A","stem":"新疆被誉为\"塞外江南\"的地方是(    )。","options":{"A":"伊犁谷地","B":"塔里木盆地","C":"吐鲁番盆地","D":"准噶尔盆地"},"explanation":"在天山东部和西部，还有被称为\"火洲\"的吐鲁番盆地和被誉为\"塞外江南\"的伊犁谷地。\n\nB 项塔里木盆地是中国最大的全封闭性内陆盆地，C 项吐鲁番盆地被称为\"火洲\"，D 项准噶\n\n尔盆地位于阿尔泰山与天山之间，三者均非\"塞外江南\"，故不选。\n\n易混对比‑ ‑ \"江南\"誉称\n\n‑ 新疆：伊犁谷地被誉为\"塞外江南\"；\n\n‑ 宁夏：宁夏平原素有\"塞上江南\"之称。","clips":[]},{"n":105,"kind":"单项选择题","answer":"C","stem":"单粮型浓香代表泸州老窖的核心酿酒原料是(        )。","options":{"A":"大米","B":"糯米","C":"高粱","D":"玉米"},"explanation":"泸州老窖特曲是单粮浓香型白酒，其核心酿造原料是高粱。A 为米香型酒的原料；BD\n\n为五粮液五种粮食原料中的两种。26 版教材新增考点：新增\"泸州老窖特曲是单粮浓香型白\n\n酒，其核心酿造原料是高粱\"的表述。\n\n易混对比‑ ‑ 白酒香型与代表名酒\n\n‑ 泸州老窖特曲：单粮浓香型白酒，核心酿造原料是高粱；\n\n‑ 五粮液：以糯米、大米、高粱、小麦、玉米五种粮食为原料酿制而得名；\n\n‑ 基本香型：白酒分为酱香型、浓香型、米香型、清香型四种基本香型，另有兼香型白酒。","clips":[]},{"n":106,"kind":"单项选择题","answer":"C","stem":"(    )有\"锦绣龙城\"的美誉。","options":{"A":"大同","B":"临汾","C":"太原","D":"运城"},"explanation":"隋末，太原留守李渊起兵反隋、建立唐朝，使得这里有了\"锦绣龙城\"的美誉。A 项大\n\n同、B 项临汾、D 项运城均为山西城市，但隋末李渊起兵反隋、有\"锦绣龙城\"美誉者为太原，\n\n故不选。\n\n同类对比‑ ‑ 山西名城古称(山西)\n\n‑ 太原：\"锦绣龙城\"，李渊起兵反隋建唐之地；\n\n‑ 大同：古称平城、云州、云中，曾为北魏京都、辽金陪都。","clips":[]},{"n":107,"kind":"单项选择题","answer":"A","stem":"由贵州省台江县\"六月六\"吃新节篮球赛发展而来，成为群众喜爱\"新节日\"的赛事是(   )。","options":{"A":"\"村 BA\"","B":"\"村超\"","C":"\"村晚\"","D":"\"村歌\""},"explanation":"由贵州省台江县\"六月六\"吃新节篮球赛发展而来的\"村 BA\"。B 项\"村超\"为榕江县乡村\n\n足球赛事，C 项\"村晚\"、D 项\"村歌\"与教材不符，由台江县\"六月六\"吃新节篮球赛发展而来\n\n者为\"村 BA\"，故不选。由榕江县民间足球发展而来的\"村超\"(乡村足球超级联赛)同样已成\n\n为群众喜爱的\"新节日\"。\n\n同类对比‑ ‑ 贵州\"村\"字号新节日(贵州)\n\n‑ \"村 BA\"：台江县\"六月六\"吃新节篮球赛发展而来(全国和美乡村篮球大赛)；\n\n‑ \"村超\"：榕江县民间足球发展而来(乡村足球超级联赛)。","clips":[]},{"n":108,"kind":"单项选择题","answer":"B","stem":"日本奈良市的唐招提寺是由中国唐代(        )和尚亲自建造的。","options":{"A":"玄奘","B":"鉴真","C":"空海","D":"最澄"},"explanation":"奈良市的唐招提寺是日本的佛教律宗的总寺院，是由中国唐代鉴真和尚亲自建造的，\n\n保留着中国唐代的建筑风格，现已被确定为日本国宝和世界文化遗产。A 玄奘设计建造的是\n\n西安大慈恩寺大雁塔；C 空海、D 最澄均为日本入唐学问僧，唐招提寺并非他们所建。\n\n同类对比‑ ‑ 唐招提寺与鉴真\n\n‑ 唐招提寺：日本佛教律宗的总寺院，位于奈良市；\n\n‑ 建造者：由中国唐代鉴真和尚亲自建造，保留着中国唐代的建筑风格；\n\n‑ 奈良：奈良市和中国古都长安关系密切。","clips":[]},{"n":109,"kind":"单项选择题","answer":"D","stem":"牛羊肉泡馍、腊汁肉夹馍、凉皮、锅盔等是(     )的风味小吃，闻名遐迩。","options":{"A":"新疆","B":"宁夏","C":"甘肃","D":"陕西"},"explanation":"以牛羊肉泡馍、腊汁肉夹馍、凉皮、锅盔等为代表的陕西风味小吃，闻名遐迩。\n\n易混对比‑ ‑ 风味小吃归属\n\n‑ 牛羊肉泡馍、腊汁肉夹馍、凉皮、锅盔：陕西风味小吃代表；\n\n‑ 狗不理包子：天津\"津门三绝\"之一(天津)；\n\n‑ 刀削面：山西面食代表(山西)。","clips":[]},{"n":110,"kind":"单项选择题","answer":"C","stem":"代表鲁菜、川菜、粤菜、淮扬菜的四个名菜是(     )。","options":{"A":"葱烧海参、鱼香肉丝、白切鸡、开水白菜","B":"糖醋鲤鱼、宫保鸡丁、九转大肠、松鼠鱼","C":"糖醋鲤鱼、麻婆豆腐、白切鸡、蟹粉狮子头","D":"佛跳墙、鱼香肉丝、烤乳猪、蟹粉狮子头"},"explanation":"糖醋鲤鱼属鲁菜，麻婆豆腐属川菜，白切鸡属粤菜，蟹粉狮子头属苏菜中的淮扬菜。\n\nABD 项中菜品的排列或所属菜系与题干顺序不符。26 版教材变动考点。\n\n同类对比‑ ‑ 中国四大菜系头牌菜\n\n‑ 鲁菜：葱烧海参、糖醋鲤鱼、九转大肠；\n\n‑ 粤菜：白切鸡、烧鹅、烤乳猪、佛跳墙；\n\n‑ 苏菜：蟹粉狮子头、松鼠鱼、大煮干丝、金陵盐水鸭、无锡酱排骨；\n\n‑ 川菜：鱼香肉丝、宫保鸡丁、麻婆豆腐、开水白菜等。","clips":[]},{"n":111,"kind":"单项选择题","answer":"D","stem":"黎族日常生活中独特的野炊方法是(    )。","options":{"A":"鱼茶腌制","B":"椰子船饭","C":"山兰酒酿制","D":"竹筒烧饭"},"explanation":"竹筒烧饭是黎族日常生活中独特的野炊方法。A 项鱼茶、B 项椰子船饭、C 项山兰酒\n\n均为黎族饮食，但黎族日常生活中独特的野炊方法为竹筒烧饭，故不选。","clips":[]},{"n":112,"kind":"单项选择题","answer":"B","stem":"目前世界上最高的双塔教堂，有两座哥特式尖塔的是(       )。","options":{"A":"巴黎圣母院","B":"科隆大教堂","C":"米兰杜奥莫教堂","D":"圣彼得大教堂"},"explanation":"科隆大教堂有两座哥特式尖塔，是目前世界上最高的双塔教堂，始建于 1248 年，竣\n\n工于 1880 年，现已成为科隆市的象征和游客向往的旅游胜地。\n\n同类对比‑ ‑ 科隆大教堂\n\n‑ 尖塔：有两座哥特式尖塔，是目前世界上最高的双塔教堂；\n\n‑ 始建与竣工：始建于 1248 年，竣工于 1880 年；\n\n‑ 地位：现已成为科隆市的象征。","clips":[]},{"n":113,"kind":"单项选择题","answer":"A","stem":"汉族主要源于(   )等部落联盟。","options":{"A":"黄炎、东夷","B":"匈奴、鲜卑","C":"契丹、女真","D":"蒙古、满洲"},"explanation":"汉族主要源于黄炎、东夷等部落联盟，同时吸取了周围荆蛮、百越、戎狄等部落联盟\n\n的成分而逐渐形成。\n\n同类对比‑ ‑ 汉族的形成\n\n‑ 主要源头：黄炎、东夷等部落联盟；\n\n‑ 融合成分：同时吸取了周围荆蛮、百越、戎狄等部落联盟的成分；\n\n‑ 形成：其先民经夏、商、周三代，至春秋战国时逐渐形成。","clips":[]},{"n":114,"kind":"单项选择题","answer":"A","stem":"维吾尔族、哈萨克族、回族等 14 个民族主要分布在我国(        )。","options":{"A":"西北地区","B":"北方和东北地区","C":"西南地区","D":"中南和东南地区"},"explanation":"维吾尔族、哈萨克族、回族等 14 个民族主要分布在西北地区。 B 项北方和东北地区\n\n主要分布有蒙古族、满族等 7 个民族； C 项西南地区主要分布有苗族、彝族、藏族等 25 个\n\n民族； D 项中南和东南地区主要分布有壮族、土家族等 9 个民族。 26 版教材新增考点。\n\n同类对比‑ ‑ 我国少数民族的分布\n\n‑ 西北地区：主要分布有维吾尔族、哈萨克族、回族等 14 个民族；\n\n‑ 西南地区：主要分布有苗族、彝族、藏族等 25 个民族；\n\n‑ 中南和东南地区：主要分布有壮族、土家族等 9 个民族；\n\n‑ 云南省：是我国少数民族分布最多的省份，全省世居少数民族达 25 个。","clips":[]},{"n":115,"kind":"单项选择题","answer":"C","stem":"下列属于潮州金漆木雕经典作品的是(      )。","options":{"A":"《弥勒佛》《寿星》","B":"《捉迷藏》《布袋和尚》","C":"《金漆木雕大神龛》《蟹篓》","D":"《百鸟朝凤》《清明上河图》"},"explanation":"潮州金漆木雕在雕刻完成后进行髹漆、贴金，形成金碧辉煌的效果，代表作品有《金\n\n漆木雕大神龛》《蟹篓》等。26 教材新增考点。\n\n同类对比‑ ‑ 中国著名木雕\n\n‑ 东阳木雕：产自\"木雕之乡\"浙江东阳，《百鸟朝凤》《清明上河图》是其精品；\n\n‑ 潮州金漆木雕：产自广东潮汕，最大特色是\"髹漆贴金\"，经典作品有《金漆木雕大神龛》\n\n《蟹篓》等；\n\n‑ 黄杨木雕：主要产自\"中国黄杨木雕之乡\"浙江温州乐清。","clips":[]},{"n":116,"kind":"单项选择题","answer":"A","stem":"土家族民歌《龙船调》源自湖北的(      )。","options":{"A":"利川市","B":"建始县","C":"恩施市","D":"宜昌市"},"explanation":"土家族民歌知名作品有《黄四姐》(源自湖北省恩施州建始县)、《龙船调》(源自湖北\n\n省利川市)、《六口茶》《门前一口堰》(源自湖北省恩施市)等。B 项建始县是《黄四姐》的\n\n发源地，C 项恩施市是《六口茶》《门前一口堰》发源地，D 项宜昌市非教材所载，《龙船调》\n\n源自利川市，故不选。\n\n同类对比‑ ‑ 土家族民歌(湖北)\n\n‑ 《龙船调》：源自利川市，被联合国教科文组织评为世界 25 首优秀民歌之一；\n\n‑ 《黄四姐》：源自恩施州建始县；\n\n‑ 《六口茶》《门前一口堰》：源自恩施市。","clips":[]},{"n":117,"kind":"单项选择题","answer":"C","stem":"被称为\"石窟鼻祖\"的是(    )。","options":{"A":"莫高窟","B":"麦积山石窟","C":"天梯山石窟","D":"云冈石窟"},"explanation":"\"石窟鼻祖\"‑ ‑ 天梯山石窟。A 项莫高窟在敦煌，B 项麦积山石窟在天水，D 项云冈\n\n石窟在大同，被称为\"石窟鼻祖\"者为天梯山石窟，故不选。\n\n易混对比‑ ‑ 甘肃石窟之最(甘肃)\n\n‑ 天梯山石窟：\"石窟鼻祖\"；\n\n‑ 麦积山石窟：世界文化遗产，被誉为\"东方雕塑陈列馆\"；\n\n‑ 莫高窟：在敦煌，\"世界艺术宝库\"。","clips":[]},{"n":118,"kind":"单项选择题","answer":"B","stem":"被称为\"面食之都\"，\"一面百吃\"的绝技独步天下的城市是(    )。","options":{"A":"西安市","B":"太原市","C":"兰州市","D":"郑州市"},"explanation":"太原被称为\"面食之都\"，\"一面百吃\"的绝技独步天下。A 项西安、C 项兰州、D 项郑\n\n州均为北方城市，但被称为\"面食之都\"者为太原，故不选。\n\n同类对比‑ ‑ 城市别称\n\n‑ 太原：\"面食之都\"，\"一面百吃\"独步天下；\n\n‑ 拉萨：\"日光城\"；\n\n‑ 海口：\"椰城\"；\n\n‑ 无锡：\"太湖明珠\"。","clips":[]},{"n":119,"kind":"单项选择题","answer":"C","stem":"市区温泉群占地 5 平方千米，有\"温泉城\"之称的城市是(   )。","options":{"A":"台北","B":"重庆","C":"福州","D":"昆明"},"explanation":"福州市区温泉群占地 5 平方千米，有\"温泉城\"之称。\n\n同类对比‑ ‑ 我国著名温泉\n\n‑ 福州：市区温泉群占地 5 平方千米，有\"温泉城\"之称；\n\n‑ 著名温泉：云南安宁温泉、腾冲温泉，陕西西安华清池温泉，台湾北投和草山温泉，广东\n\n从化温泉等；\n\n‑ 分布：台湾、广东、福建、云南、西藏等地温泉较多。","clips":[]},{"n":120,"kind":"单项选择题","answer":"B","stem":"享有\"西藏江南\"之称的是(    )。","options":{"A":"日喀则市","B":"林芝市","C":"昌都市","D":"山南市"},"explanation":"享有\"西藏江南\"之称的林芝市。A 项日喀则、C 项昌都、D 项山南均为西藏城市，但\n\n享有\"西藏江南\"之称者为林芝市，故不选。\n\n同类对比‑ ‑ 西藏城市美誉(西藏)\n\n‑ 拉萨：\"日光城\"，年日照时间 3000 小时以上；\n\n‑ 林芝：\"西藏江南\"\"雪域明珠\"，西藏最温暖湿润的地区。","clips":[]},{"n":121,"kind":"单项选择题","answer":"D","stem":"因山多白色大理石而得名，是中国唯一的大理岩峰林景观的风景名胜区是(         )。","options":{"A":"白洋淀","B":"娲皇宫景区","C":"野三坡","D":"白石山"},"explanation":"白石山风景区因山多白色大理石而得名，是中国唯一的大理岩峰林景观。 A 项白洋\n\n淀是中国海河平原上最大的湖泊，B 项娲皇宫为娲皇古迹，C 项野三坡以地质奇观著称，因\n\n山多白色大理石而得名、为中国唯一大理岩峰林景观者为白石山，故不选。\n\n易混对比‑ ‑ 河北\"三坡一淀\"名胜(河北)\n\n‑ 白石山：中国唯一的大理岩峰林景观；\n\n‑ 白洋淀：海河平原上最大的湖泊，素有\"华北明珠\"之称；\n\n‑ 野三坡：集雄山碧水、奇峡怪泉、文物古迹于一身；\n\n‑ 西柏坡：党中央解放全国的最后一个农村指挥所，七届二中全会在此召开。","clips":[]},{"n":122,"kind":"单项选择题","answer":"B","stem":"使周庄双桥驰名中外的油画《故乡的回忆》的作者是(       )。","options":{"A":"吴冠中","B":"陈逸飞","C":"徐悲鸿","D":"齐白石"},"explanation":"双桥由世德桥和永安桥相连而成，因陈逸飞油画《故乡的回忆》而驰名中外。 26 版\n\n教材新增考点。\n\n同类对比‑ ‑ 周庄古镇\n\n‑ 双桥：由世德桥和永安桥相连而成，因画家陈逸飞油画《故乡的回忆》而驰名中外，是周\n\n庄的标志；\n\n‑ 富安桥：始建于元代，是江南仅存的桥楼合壁建筑；\n\n‑ 美誉：著名画家吴冠中撰文\"黄山集中国山川之美，周庄集中国水乡之美\"。","clips":[]},{"n":123,"kind":"单项选择题","answer":"A","stem":"源于古西域\"杂戏\"的维吾尔族民间杂技、体育形式是(      )。","options":{"A":"达瓦孜","B":"赛乃姆","C":"麦西热甫","D":"鹰舞"},"explanation":"达瓦孜(走高绳)是维吾尔族民间的一种杂技、体育形式，源于古西域\"杂戏\"。 B 项\n\n赛乃姆、C 项麦西热甫均为维吾尔族歌舞民俗，D 项鹰舞是塔吉克族舞蹈，源于古西域\"杂戏\n\n\"的杂技、体育形式为达瓦孜，故不选。\n\n同类对比‑ ‑ 新疆民族歌舞\n\n‑ 达瓦孜：维吾尔族走高绳，源于古西域\"杂戏\"；\n\n‑ 赛乃姆舞、刀郎舞：维吾尔族舞蹈；\n\n‑ 鹰舞：塔吉克族舞蹈；\n\n‑ 沙吾尔登舞：蒙古族舞蹈。","clips":[]},{"n":124,"kind":"单项选择题","answer":"C","stem":"建成世界最大的赖氨酸生产基地，产能占全球 30%的是(     )。","options":{"A":"长春高新","B":"吉林化纤","C":"白城梅花","D":"通化东宝"},"explanation":"白城梅花建成世界最大的赖氨酸生产基地，产能占全球的 30%。A 项长春高新、B 项\n\n吉林化纤、D 项通化东宝均为吉林知名企业，但建成世界最大赖氨酸生产基地、产能占全球\n\n30%者为白城梅花，故不选。\n\n同类对比‑ ‑ 吉林产业名片(吉林)\n\n‑ 白城梅花：建成世界最大的赖氨酸生产基地，产能占全球 30%；\n\n‑ 医药健康产业：国家中药现代化科技产业基地、生物产业基地、医药出口基地和创制药物\n\n孵化基地。","clips":[]},{"n":125,"kind":"单项选择题","answer":"B","stem":"联合国旅游组织(UNTourism)总部设在(   )。","options":{"A":"美国纽约","B":"西班牙马德里","C":"法国巴黎","D":"英国伦敦"},"explanation":"联合国旅游组织(UN Tourism)总部在西班牙马德里。26 版教材改动：明确世界旅游\n\n组织 2021 年更名为联合国旅游组织(UN Tourism)。\n\n同类对比‑ ‑ 联合国旅游组织\n\n‑ 性质：联合国系统的政府间国际组织；\n\n‑ 总部：设在西班牙马德里；\n\n‑ 沿革：前身国际官方旅游宣传组织联盟 IUOTPO，1971 年正定世界旅游组织，2021 更名联\n\n合国旅游组织。","clips":[]},{"n":126,"kind":"单项选择题","answer":"D","stem":"著名的\"昭陵六骏\"图样设计师，人物画逼真传神的初唐画家是(        )。","options":{"A":"吴道子","B":"顾恺之","C":"展子虔","D":"阎立本"},"explanation":"初唐阎立本，著名的\"昭陵六骏\"图样设计师，其人物画逼真传神，时人誉为\"丹青神\n\n话\"，代表作《步辇图》《历代帝王图》。A 吴道子人称\"画圣\"；B 顾恺之是东晋画家；C 展子\n\n虔是隋朝画家，被认为是\"唐画之祖\"。\n\n易混对比‑ ‑ 中国古代著名画家\n\n‑ 阎立本：初唐，著名的\"昭陵六骏\"图样设计师，时人誉为\"丹青神话\"，代表作《步辇图》\n\n《历代帝王图》；\n\n‑ 顾恺之：东晋，擅长人物画，主张\"以形写神\"，代表作《女史箴图》《洛神赋图》；\n\n‑ 吴道子：中唐，人称\"画圣\"，有\"吴带当风\"之说，代表作《送子天王图》。","clips":[]},{"n":127,"kind":"单项选择题","answer":"D","stem":"中国第一部词集是西蜀派赵崇祚编成的(      )。","options":{"A":"《尊前集》","B":"《金奁集》","C":"《草堂诗余》","D":"《花间集》"},"explanation":"西蜀派赵崇祚编成中国第一部词集《花间集》。\n\n易混对比‑ ‑ 《花间集》与晚唐五代词\n\n‑ 《花间集》：西蜀派赵崇祚编成，是中国第一部词集；\n\n‑ 南唐派：李煜(南唐后主)的词作家喻户晓，亡国之后的作品哀婉凄凉、意境深远；\n\n‑ 李煜代表作：《虞美人·春花秋月何时了》《浪淘沙·帘外雨潺潺》《相见欢·林花谢了春\n\n红》等。","clips":[]},{"n":128,"kind":"单项选择题","answer":"A","stem":"\"大漠孤烟直，长河落日圆\"出自唐代王维的(        )。","options":{"A":"《使至塞上》","B":"《观猎》","C":"《终南山》","D":"《山居秋暝》"},"explanation":"\"大漠孤烟直，长河落日圆\"出自唐代王维《使至塞上》。\n\n易混对比‑ ‑ 王维诗句与名篇\n\n‑ \"大漠孤烟直，长河落日圆\"：出自唐代王维《使至塞上》；\n\n‑ 王维：擅长山水画，被誉为山水画\"南宗鼻祖\"，其画作\"诗中有画，画中有诗\"，被后世奉\n\n为文人画的始祖；\n\n‑ \"海内存知己，天涯若比邻\"：出自王勃《送杜少府之任蜀州》，是送别诗的名作。","clips":[]},{"n":129,"kind":"单项选择题","answer":"B","stem":"被誉为\"万国建筑博物城\"的是(   )。","options":{"A":"青岛市","B":"哈尔滨市","C":"上海市","D":"天津市"},"explanation":"哈尔滨市区保留了巴洛克式、拜占庭式、哥特式等一大批历史建筑，是一座欧陆风情\n\n浓郁的城市，被誉为\"万国建筑博物城\"。A 项青岛、C 项上海、D 项天津均有近代西式建筑\n\n群，但被誉为\"万国建筑博物城\"者为哈尔滨，故不选。哈尔滨素有\"冰城\"\"东方莫斯科\"\"东\n\n方小巴黎\"之美称，是享誉中外的冰雪艺术之都，被联合国授予亚洲唯一的\"世界音乐之城\"。\n\n易混对比‑ ‑ \"万国建筑\"\n\n‑ 哈尔滨：\"万国建筑博物城\"，市区保留巴洛克式、拜占庭式、哥特式等历史建筑(黑龙江)；\n\n‑ 上海外滩建筑群：\"万国建筑博览会\"之一，全长约 1.5 千米(上海)。","clips":[]},{"n":130,"kind":"单项选择题","answer":"D","stem":"被誉为\"江南第一宅\"的是南浔古镇的(     )。","options":{"A":"小莲庄","B":"嘉业堂藏书楼","C":"刘氏梯号","D":"张石铭旧宅"},"explanation":"张石铭旧宅又称\"懿德堂\"，占地 6500 平方米，五落四进 150 间房，中式厅堂与巴洛\n\n克式建筑被马头墙揽入一院，被誉为\"江南第一宅\"。A 项，小莲庄是南浔古镇\"四象\"之首刘\n\n镛的私家花园。B 项，南浔古镇的嘉业堂藏书楼是近代私家藏书楼。C 项，南浔古镇的刘氏\n\n梯号俗称\"红房子\"。26 版教材新增考点。\n\n易混对比‑ ‑ 南浔古镇名宅园林\n\n‑ 张石铭旧宅：又称\"懿德堂\"，被誉为\"江南第一宅\"；\n\n‑ 小莲庄：\"四象\"之首刘镛的私家花园，是南浔的标志性园林；\n\n‑ 嘉业堂藏书楼：中国近代规模最大、藏书最富的私家藏书楼之一；\n\n‑ 刘氏梯号：俗称\"红房子\"，是中西合璧的典范。","clips":[]},{"n":131,"kind":"多项选择题","answer":"ACE","stem":"以下组成粤菜的是(   )。","options":{"A":"客家菜","B":"孔府菜","C":"广府菜","D":"仿膳菜","E":"潮汕菜"},"explanation":"粤菜由广府(以广州菜为代表)、客家(以东江菜为代表)、潮汕(以潮州菜为代表)三种\n\n风味组成，以广府风味为代表。26 版教材改动：粤菜客家风味由\"又称东江风味，以惠州菜\n\n为代表\"改为\"以东江菜为代表\"； 广府、潮汕组成及以广府风味为代表不变。\n\n同类对比‑ ‑ 粤菜的组成\n\n‑ 组成：由广府(以广州菜为代表)、客家(以东江菜为代表)、潮汕(以潮州菜为代表)三种风\n\n味组成；\n\n‑ 代表：以广府风味为代表；\n\n‑ 头牌菜：白切鸡、烧鹅、烤乳猪、佛跳墙。","clips":[]},{"n":132,"kind":"多项选择题","answer":"BE","stem":"近年来，陕西提出\"成为传承中华文化的世界级旅游目的地\"发展目标，打造了(   )等引领时尚的旅游项目。","options":{"A":"\"长安三万里\"","B":"\"长安十二时辰\"","C":"\"盛唐密盒\"","D":"\"梦回大唐\"","E":"\"大唐不夜城\""},"explanation":"近年来，陕西提出\"成为传承中华文化的世界级旅游目的地\"等发展目标，打造了\"大\n\n唐不夜城\"\"长安十二时辰\"等引领时尚的旅游项目。\"大唐不夜城\"以盛唐文化为背景打造沉\n\n浸式夜游街区，\"长安十二时辰\"为沉浸式唐风市井生活街区。\n\n同类对比‑ ‑ 陕西文旅项目(陕西)\n\n‑ \"大唐不夜城\"：以盛唐文化为背景的沉浸式夜游街区；\n\n‑ \"长安十二时辰\"：沉浸式唐风市井生活街区；\n\n‑ 发展目标：成为传承中华文化的世界级旅游目的地。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ABDE","stem":"下列关于唐代\"南青北白\"制瓷格局的表述，正确的有(   )。","options":{"A":"南方以浙江越窑青瓷为代表","B":"北方以河北邢窑白瓷为代表","C":"南方以河北邢窑白瓷为代表","D":"越窑青瓷有\"类冰\"\"类玉\"之誉","E":"邢窑白瓷有\"类银\"\"类雪\"之誉"},"explanation":"唐代形成\"南青北白\"的制瓷格局：南方以浙江越窑青瓷为代表，有\"类冰\"\"类玉\"之誉；\n\n北方以河北邢窑白瓷为代表，有\"类银\"\"类雪\"之誉。26 教材新增考点。\n\n同类对比‑ ‑ 唐代\"南青北白\"制瓷格局\n\n‑ 格局：南方以浙江越窑青瓷为代表，北方以河北邢窑白瓷为代表；\n\n‑ 越窑青瓷：胎薄釉润、釉色青翠，陆羽《茶经》赞其\"类冰\"\"类玉\"；\n\n‑ 邢窑白瓷：胎细质坚、器形规整，有\"类银\"\"类雪\"之美誉。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ACE","stem":"\"台湾三宝\"是指(   )。","options":{"A":"米","B":"龙井茶","C":"糖","D":"普洱茶","E":"茶"},"explanation":"米、糖、茶是台湾著名的三大传统物产，被称为\"台湾三宝\"。B 项龙井茶为浙江名茶，\n\nD 项普洱茶为云南名茶，均非\"台湾三宝\"之列，故不选。台湾茶以乌龙茶最为著名，冻顶乌\n\n龙茶享誉海内外。\n\n易混对比‑ ‑ \"三宝\"名片\n\n‑ 台湾三宝：米、糖、茶；\n\n‑ 宁夏五宝：枸杞、甘草、贺兰石、滩羊皮、太西煤(宁夏)。","clips":[],"sourceNote":"试卷与解析的选项顺序不同，本题采用解析卷顺序。"},{"n":135,"kind":"多项选择题","answer":"BDE","stem":"山西汉族传统民俗活动丰富多彩，其中最具有特色的有(    )。","options":{"A":"年画","B":"剪纸","C":"皮影","D":"炕围画","E":"面塑"},"explanation":"山西汉族传统民俗活动丰富多彩，以剪纸、炕围画、面塑最具特色。A 项年画、C 项\n\n皮影均非教材所列山西最具特色的民俗活动，故不选。\n\n同类对比‑ ‑ 山西民俗工艺(山西)\n\n‑ 剪纸：广灵剪纸以刀刻染色工艺为核心，被誉为\"中华民间艺术一绝\"；\n\n‑ 面塑：闻喜花馍经 100 多道小工序，面团化作艺术品；\n\n‑ 炕围画：民间炕头装饰绘画。","clips":[]},{"n":136,"kind":"多项选择题","answer":"ABCE","stem":"吉林省是国家重点建设的相关产业基地有(   )。","options":{"A":"生物产业基地","B":"中药现代化科技产业基地","C":"医药出口基地","D":"石油化工基地","E":"创制药物孵化基地"},"explanation":"吉林省是国家重点建设的中药现代化科技产业基地、生物产业基地、医药出口基地和\n\n创制药物孵化基地，医药健康产业基础雄厚。D 项石油化工基地不在教材所列吉林省国家重\n\n点建设的相关产业基地之列，故不选。\n\n同类对比‑ ‑ 吉林医药产业(吉林)\n\n‑ 四大基地：中药现代化科技产业基地、生物产业基地、医药出口基地、创制药物孵化基地；\n\n‑ 白城梅花：世界最大的赖氨酸生产基地，产能占全球 30%。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ACE","stem":"敦煌壁画作为敦煌艺术的主要组成部分，其包括的石窟有(    )。","options":{"A":"西千佛洞","B":"麦积山石窟","C":"安西榆林窟","D":"龙门石窟","E":"敦煌莫高窟"},"explanation":"敦煌壁画作为敦煌艺术的主要组成部分，包括敦煌莫高窟、西千佛洞、安西榆林窟，\n\n共有石窟 552 个。 B 项麦积山石窟在天水，D 项龙门石窟在洛阳，均不属于敦煌石窟群，故\n\n不选。\n\n同类对比‑ ‑ 甘肃长城遗存(甘肃)\n\n‑ 嘉峪关：\"天下第一雄关\"；\n\n‑ 长城第一墩、阳关、玉门关、汉长城：河西走廊古长城遗存；\n\n‑ 甘肃长城：总长 3654 千米居全国第二，现存主要为战国秦、汉、明三代遗迹。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABCD","stem":"红军长征在四川留下了众多壮举，下列事件发生在四川的有(    )。","options":{"A":"四渡赤水","B":"彝海结盟","C":"抢渡安顺场","D":"飞夺泸定桥","E":"血战湘江"},"explanation":"四川还是红军长征四渡赤水、巧渡金沙江、彝海结盟、抢渡安顺场、飞夺泸定桥和过\n\n雪山草地的地方。 E 项血战湘江发生在广西境内，不在四川，故不选。\n\n同类对比‑ ‑ 长征重大事件(四川)\n\n‑ 四川：四渡赤水、巧渡金沙江、彝海结盟、抢渡安顺场、飞夺泸定桥、过雪山草地；\n\n‑ 血战湘江：发生在广西，非四川。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABCD","stem":"铸牢中华民族共同体意识的\"必然要求\"包括(    )。","options":{"A":"是维护各民族根本利益的必然要求","B":"是实现中华民族伟大复兴的必然要求","C":"是巩固和发展平等、团结、互助、和谐社会主义民族关系的必然要求","D":"是党的民族工作开创新局面的必然要求","E":"是加快少数民族地区经济发展的唯一手段"},"explanation":"铸牢中华民族共同体意识是维护各民族根本利益的必然要求，是实现中华民族伟大复\n\n兴的必然要求，是巩固和发展平等、团结、互助、和谐社会主义民族关系的必然要求，是党\n\n的民族工作开创新局面的必然要求。 E 说法错误。\n\n同类对比‑ ‑ 铸牢中华民族共同体意识的\"四个必然要求\"\n\n‑ 维护各民族根本利益的必然要求；\n\n‑ 实现中华民族伟大复兴的必然要求；\n\n‑ 巩固和发展平等、团结、互助、和谐社会主义民族关系的必然要求；\n\n‑ 党的民族工作开创新局面的必然要求。","clips":[]},{"n":140,"kind":"多项选择题","answer":"BCDE","stem":"下列关于净土宗的表述，正确的有(    )。","options":{"A":"是我国支派最多的佛教宗派","B":"以东晋慧远在庐山东林寺建立白莲社为发端","C":"实际创立者为唐代善导","D":"主张口念\"南无阿弥陀佛\"名号即可往生西方极乐世界","E":"修行方法简便，自中唐以后广泛流行，在民间影响较大"},"explanation":"净土宗以东晋慧远在庐山东林寺建立白莲社为发端，实际创立者为唐代善导； 净土\n\n宗主张口念\"南无阿弥陀佛\"名号即可往生西方极乐世界(教主阿弥陀佛，其左胁侍为观世音\n\n菩萨，右胁侍为大势至菩萨)，修行方法简便，故自中唐以后广泛流行，在民间影响较大。A\n\n我国支派最多的佛教宗派是禅宗，不是净土宗。\n\n易混对比‑ ‑ 佛教宗派辨析\n\n‑ 净土宗：以东晋慧远在庐山东林寺建立白莲社为发端，实际创立者为唐代善导；\n\n‑ 净土宗主张：口念\"南无阿弥陀佛\"名号即可往生西方极乐世界，修行方法简便；\n\n‑ 禅宗：我国支派最多的佛教宗派，也是中国佛教史上流传最久远的宗派。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ACDE","stem":"金沙江下游梯级电站包括(   )。","options":{"A":"向家坝水电站","B":"三峡水电站","C":"溪洛渡水电站","D":"乌东德水电站","E":"白鹤滩水电站"},"explanation":"仅四川省与云南省交界的金沙江下游河道，就已经建成乌东德、白鹤滩、溪洛渡、向\n\n家坝四大水电站。B 项三峡水电站位于长江干流湖北宜昌段，不在金沙江下游梯级电站之列，\n\n故不选。\n\n同类对比‑ ‑ 巨型水电站\n\n‑ 白鹤滩水电站：2022 年建成，安装 16 台 100 万千瓦机组，世界第二大水电站；\n\n‑ 乌东德、溪洛渡、向家坝：金沙江下游梯级电站；\n\n‑ 三峡水电站：装机容量 2250 万千瓦。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABCD","stem":"重庆四面山景区的\"四大景观\"是指(    )。","options":{"A":"异水","B":"奇山","C":"厚文","D":"红石","E":"幽谷"},"explanation":"四面山景区的\"奇山、异水、红石、厚文\"四大景观资源特色明显。E 项幽谷不在四面\n\n山景区\"四大景观\"之列，故不选。\n\n同类对比‑ ‑ 重庆景观名片(重庆)\n\n‑ 四面山：\"奇山、异水、红石、厚文\"四大景观，拥有\"丹霞赤壁‑ 瓮形围谷‑ 高山瀑布\"\n\n地质遗迹；\n\n‑ 金佛山：\"喀斯特桌山\"地貌世界遗产，\"生物基因库、中华药库\"；\n\n‑ 大足石刻：儒、释、道三教造像于一体，5 万多尊摩崖造像。","clips":[]},{"n":143,"kind":"多项选择题","answer":"CDE","stem":"下列关于长江的表述，正确的有(     )。","options":{"A":"全长 5464 千米","B":"注入黄海","C":"正源沱沱河发源于青藏高原唐古拉山主峰各拉丹冬雪山西南侧","D":"干流流经 11 个省级行政区","E":"自西向东注入东海"},"explanation":"长江正源沱沱河发源于青藏高原唐古拉山的主峰各拉丹冬雪山西南侧；干流流经 11\n\n个省级行政区，自西向东注入东海。A 全长 5464 千米的是黄河(长江全长 6300 多千米)；B\n\n长江注入东海，不是黄海。\n\n同类对比‑ ‑ 长江\n\n‑ 长度：全长 6300 多千米，是中国第一、世界第三长河；\n\n‑ 正源：沱沱河，发源于青藏高原唐古拉山的主峰各拉丹冬雪山西南侧；\n\n‑ 流经：干流流经 11 个省级行政区，自西向东奔入东海。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABCD","stem":"下列属于我国文化景观遗产的有(     )。","options":{"A":"庐山","B":"五台山","C":"杭州西湖","D":"红河哈尼梯田","E":"九寨沟"},"explanation":"我国文化景观遗产共 6 处：庐山、五台山、杭州西湖、红河哈尼梯田、左江花山岩画、\n\n普洱景迈山古茶林。 E 项九寨沟为世界自然遗产，非文化景观遗产，故不选。世界文化景\n\n观是指自然与人类的共同作品，\"文化景观\"属于\"文化遗产\"中的一个特殊类型，并不是单独\n\n的一类遗产。\n\n同类对比‑ ‑ 文化景观遗产\n\n‑ 6 处名单：庐山、五台山、杭州西湖、红河哈尼梯田、左江花山岩画、普洱景迈山古茶林；\n\n‑ 易错点：九寨沟为世界自然遗产，不属于文化景观遗产。","clips":[]},{"n":145,"kind":"多项选择题","answer":"CDE","stem":"五粮液以五种粮食为原料酿制而得名，这五种粮食是(   )。","options":{"A":"小米","B":"大麦","C":"糯米、大米","D":"高粱、小麦","E":"玉米"},"explanation":"五粮液以糯米、大米、高粱、小麦、玉米五种粮食为原料酿制而得名。A 小米、B 大\n\n麦均不在五粮之列。\n\n同类对比‑ ‑ 中国名酒与原料\n\n‑ 五粮液：以糯米、大米、高粱、小麦、玉米五种粮食为原料酿制而得名；\n\n‑ 泸州老窖特曲：单粮浓香型白酒，核心酿造原料是高粱；\n\n‑ 基本香型：白酒分为酱香型、浓香型、米香型、清香型四种基本香型，另有兼香型。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABCDE","stem":"我国主要气候类型有(     )。","options":{"A":"热带季风气候","B":"亚热带季风气候","C":"温带季风气候","D":"温带大陆性气候","E":"高原山地气候"},"explanation":"我国跨越多个温度带与干湿区，季风气候显著，主要气候类型有：热带季风气候、亚\n\n热带季风气候、温带季风气候、温带大陆性气候、高原山地气候。26 版教材新增考点。\n\n同类对比‑ ‑ 我国主要气候类型\n\n‑ 热带季风气候：分布于海南岛、雷州半岛、滇南、台南等地区；\n\n‑ 亚热带季风气候：分布于秦岭一淮河以南、青藏高原以东；\n\n‑ 其余：温带季风气候、温带大陆性气候、高原山地气候。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ACDE","stem":"关于汉族服饰与民居，下列说法正确的有(   )。","options":{"A":"汉族的服饰在式样上主要有上衣下裳和衣裳相连两种基本的形式","B":"大襟左衽是汉族服饰始终保留的鲜明特点","C":"北方以北京的四合院为主要代表","D":"南方以天井式瓦房居多","E":"闽赣粤地区的客家人居住大围楼"},"explanation":"汉族的服饰在式样上主要有上衣下裳和衣裳相连两种基本的形式，大襟右衽是其服装\n\n始终保留的鲜明特点。汉族的染织工艺，以其历史悠久、技术先进、制作精美而独步世界。\n\n民居是人们的生活空间。汉族人数众多、分布广泛，由于受各自所处的特殊地域环境的限制，\n\n呈现出不同的民居式样。北方以北京的四合院为主要代表，黄土高原上是错落有致的窑洞，\n\n南方以天井式瓦房居多，闽赣粤地区的客家人则是居住大围楼，另有徽派建筑、江南的水乡\n\n民居、川西平原的林盘建筑等，都具有鲜明的地域文化特征。 B 项\"大襟左衽\"有误，汉族\n\n服装始终保留的鲜明特点是大襟右衽。26 版教材把汉族民居代表中的\"上海的石库门\"改成\"\n\n川西平原的林盘建筑\"。\n\n易混对比‑ ‑ 汉族服饰与民居\n\n‑ 服饰：式样主要有上衣下裳和衣裳相连两种基本形式，大襟右衽是始终保留的鲜明特点；\n\n‑ 北方民居：以北京的四合院为主要代表，黄土高原上是窑洞；\n\n‑ 南方民居：以天井式瓦房居多，闽赣粤地区的客家人居住大围楼。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABC","stem":"下列神话传说中，属于海南十大经典神话传说的有(     )。","options":{"A":"《鹿回头》","B":"《大力神》","C":"《黎母神话》","D":"《阿诗玛》","E":"《创世纪》"},"explanation":"海南有《鹿回头》《大力神》《黎母神话》等十大经典神话传说。D 项《阿诗玛》为云\n\n南彝族叙事长诗，E 项《创世纪》为纳西族史诗，均非海南神话传说，故不选。\n\n易混对比‑ ‑ 少数民族经典文学\n\n‑ 《鹿回头》《大力神》《黎母神话》：海南十大经典神话传说(海南)；\n\n‑ 《创世纪》《东巴经》：纳西族长篇史诗与百科全书(云南)。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABCD","stem":"下列浙江民歌中，入选国家级非物质文化遗产代表性项目名录的有(    )。","options":{"A":"嘉善田歌","B":"畲族民歌","C":"海洋号子(舟山渔民号子)","D":"渔歌(嵊泗渔歌)","E":"《采茶舞曲》"},"explanation":"嘉善田歌、畲族民歌、海洋号子(舟山渔民号子)、海洋号子(象山渔民号子)、渔歌(嵊\n\n泗渔歌)等种类的民歌均入选国家级非物质文化遗产代表性项目名录。E 项《采茶舞曲》是\n\n浙江民歌家喻户晓的经典之作，但未列入该国家级非遗名录，易误选。\n\n易混对比‑ ‑ 民歌(浙江)\n\n‑ 《采茶舞曲》：浙江民歌家喻户晓的经典之作；\n\n‑ 《对鸟》：发源于温州乐清，以高亢嘹亮的甩腔闻名；\n\n‑ 入选国家级非遗名录：嘉善田歌、畲族民歌、海洋号子(舟山、象山渔民号子)、嵊泗渔歌；\n\n‑ 《采茶舞曲》未列入国家级非遗名录，注意区分。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABCE","stem":"下列景区中，属于甘肃省国家 5A 级旅游景区的有(   )。","options":{"A":"嘉峪关文物景区","B":"天水市麦积山景区","C":"张掖七彩丹霞旅游景区","D":"拉卜楞寺景区","E":"敦煌鸣沙山·月牙泉景区"},"explanation":"甘肃省现有国家 5A 级旅游景区 8 家：嘉峪关文物景区、平凉市崆峒山风景名胜区、\n\n天水市麦积山景区、酒泉市敦煌鸣沙山·月牙泉景区、张掖市七彩丹霞旅游景区、临夏州炳\n\n灵寺世界文化遗产旅游区、陇南市官鹅沟旅游景区、甘南州冶力关景区。D 项拉卜楞寺位于\n\n甘南州夏河县，是藏传佛教格鲁派六大宗主寺之一、全国重点文物保护单位，但景区等级为\n\n国家 4A 级，故不选。\n\n同类对比‑ ‑ 甘肃 5A 景区(甘肃)\n\n‑ 8 家名单：嘉峪关、崆峒山、麦积山、鸣沙山月牙泉、七彩丹霞、炳灵寺、官鹅沟、冶力\n\n关；\n\n‑ 易错点：拉卜楞寺是宗教文化胜地，不在 5A 名单之列。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABDE","stem":"甘肃是药材之乡，有\"甘肃五个宝，归芪黄参草\"之说，下列属于\"甘肃五个宝\"的有(   )。","options":{"A":"当归","B":"大黄","C":"三七","D":"党参","E":"甘草"},"explanation":"甘肃是药材之乡，药材品种繁多，有\"甘肃五个宝，归芪黄参草\"之说，岷县当归、红\n\n(黄)芪、大黄、党参、甘草品质优良。C 项三七为云南道地药材，非\"甘肃五个宝\"之列，故\n\n不选。\n\n易混对比‑ ‑ 药材之乡\n\n‑ 甘肃五个宝：当归、红(黄)芪、大黄、党参、甘草(\"归芪黄参草\")；\n\n‑ 三七：云南道地药材，文山三七著名；\n\n‑ 宁夏五宝：枸杞、甘草、贺兰石、滩羊皮、太西煤。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABDE","stem":"《中华人民共和国民族团结进步促进法》的立法目的包括(   )。","options":{"A":"推进中华民族共同体建设","B":"推动实现中华民族伟大复兴","C":"确立民族区域自治为我国根本政治制度","D":"促进民族团结进步","E":"铸牢中华民族共同体意识"},"explanation":"该法的立法目的是促进民族团结进步，铸牢中华民族共同体意识，推进中华民族共同\n\n体建设，推动实现中华民族伟大复兴。C 项表述有误，民族区域自治是我国的一项基本政治\n\n制度，不是根本政治制度。26 版教材新增考点。\n\n同类对比‑ ‑ 民族团结进步促进法\n\n‑ 通过与施行：2026 年 3 月 12 日由第十四届全国人民代表大会第四次会议通过，2026 年 7\n\n月 1 日起施行；\n\n‑ 立法目的：促进民族团结进步，铸牢中华民族共同体意识，推进中华民族共同体建设，推\n\n动实现中华民族伟大复兴；\n\n‑ 制度保障：进一步明确\"国家坚持和完善民族区域自治制度\"。","clips":[]},{"n":153,"kind":"多项选择题","answer":"AB","stem":"蜀绣的代表作有(    )。","options":{"A":"《芙蓉鲤鱼》","B":"《熊猫图》","C":"《猫》","D":"《水草鲤鱼》","E":"《百鸟朝凤》"},"explanation":"蜀绣的代表作有《蜀宫乐女演乐图》挂屏、《熊猫图》座屏和陈列在北京人民大会堂\n\n四川厅的巨幅作品《芙蓉鲤鱼》。《猫》‑ ‑ 苏绣；《百鸟朝凤》‑ ‑ 粤绣。\n\n[答题技巧]\n\n蜀绣：熊猫、芙蓉鲤鱼，再加一乐女。\n\n26 版教材改动：蜀绣代表作删除《水草鲤鱼》，《熊猫》规范为《熊猫图》。\n\n易混对比‑ ‑ 四大名绣代表作\n\n‑ 蜀绣：《蜀宫乐女演乐图》挂屏、《熊猫图》座屏、《芙蓉鲤鱼》；\n\n‑ 苏绣：以针法细腻、色彩清雅著称，有\"苏猫湘虎\"之说；\n\n‑ 湘绣：以狮、虎为代表题材，独门绝技为\"毛针\"；\n\n‑ 粤绣：《百鸟朝凤》是粤绣名作。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ABCE","stem":"下列关于清代官式彩画的说法，正确的有(    )。","options":{"A":"和玺彩画专用于宫殿、庙宇主殿，以龙凤纹为主","B":"旋子彩画多用于次要宫殿和官庙、王府建筑","C":"苏式彩画常见于园林、住宅","D":"苏式彩画地位最高","E":"和玺彩画分为金龙和玺、龙凤和玺等类型"},"explanation":"清代官式彩画分为和玺、旋子、苏式三级，和玺等级最高。苏式彩画内容生动但地位\n\n不高。26 版教材新增考点。\n\n易混对比‑ ‑ 清代官式彩画等级\n\n‑ 等级：清代官式彩画设为三级，地位由高到低分别是和玺彩画、旋子彩画和苏式彩画；\n\n‑ 和玺彩画：等级最高，以龙凤纹为主，分为金龙和玺、龙凤和玺等类型；\n\n‑ 苏式彩画：内容生动但地位不高，常见于园林、住宅。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ACDE","stem":"藏族对居住在不同地区的人有不同的称谓，下列对应正确的有(      )。","options":{"A":"阿里地区‑ \"兑巴\"","B":"前藏地区‑ \"安多娃\"","C":"西藏东境和四川西部‑ \"康巴\"","D":"后藏地区‑ \"藏巴\"","E":"前藏地区‑ \"卫巴\""},"explanation":"\"兑巴\"‑ ‑ 阿里地区；\"藏巴\"‑ ‑ 后藏地区；\"卫巴\"‑ ‑ 前藏地区；\"康巴\"‑ ‑ 西藏\n\n东境和四川西部； \"安多娃\"‑ ‑ 西藏北境、四川西北部、甘肃南部。B 项\"安多娃\"指居住\n\n在西藏北境、四川西北部、甘肃南部、青海地区的藏民，并非前藏地区，对应错误，故不选。\n\n易混对比‑ ‑ 藏族地区称谓\n\n‑ 兑巴：阿里地区；\n\n‑ 藏巴：后藏地区；\n\n‑ 卫巴：前藏地区；\n\n‑ 康巴：西藏东境和四川西部；\n\n‑ 安多娃：西藏北境、四川西北部、甘肃南部、青海地区。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABCE","stem":"关于八卦，说法正确的有(     )。","options":{"A":"八卦是 8 种符号，象征 8 种基本自然现象","B":"传说八卦是伏羲画出的","C":"八卦中乾代表天，坤代表地","D":"八卦中艮代表水，兑代表泽","E":"传说后来周文王又把八卦互相搭配变成六十四卦"},"explanation":"八卦最早记载于《周易》一书，传说伏羲氏\"仰则观象于天，俯则观法于地……于是\n\n始作八卦，以通神明之德\"。传说周文王曾悉心研究八卦，并推演出 64 个卦象。\n\n八卦包括\n\n乾(qián)代表天、坤(kūn)代表地；\n\n巽(xùn)代表风、震(zhèn)代表雷；\n\n坎(kǎn)代表水、离(lí)代表火；\n\n艮(gèn)代表山、兑(duì)代表泽。\n\n易混对比‑ ‑ 八卦及其象征\n\n‑ 起源：最早记载于《周易》，传说伏羲氏始作八卦，周文王推演出 64 个卦；\n\n‑ 八卦：乾代表天、坤代表地、巽代表风、震代表雷；\n\n‑ 对应：坎代表水、离代表火、艮代表山、兑代表泽。","clips":[]},{"n":157,"kind":"多项选择题","answer":"BCD","stem":"下列是绿茶的有(   )。","options":{"A":"武夷岩茶","B":"西湖龙井","C":"黄山毛峰","D":"峨眉竹叶青茶","E":"凤凰单枞"},"explanation":"绿茶的代表有杭州西湖龙井茶、太湖碧螺春茶、黄山毛峰茶、峨眉竹叶青茶。 武夷\n\n岩茶、凤凰单枞属于乌龙茶。26 版教材改动说明：绿茶代表品种新增峨眉竹叶青茶。\n\n易混对比‑ ‑ 茶类归属辨析\n\n‑ 绿茶：西湖龙井、太湖碧螺春、黄山毛峰、峨眉竹叶青茶最负盛名；\n\n‑ 乌龙茶：产地集中在福建、广东、台湾，名品有武夷岩茶、铁观音、凤凰单枞等；\n\n‑ 黄茶：著名品种有君山银针、蒙顶黄芽等。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ACD","stem":"关于新疆\"三山夹两盆\"，下列说法正确的有(   )。","options":{"A":"天山横亘中部，把新疆分为南疆和北疆","B":"北面是昆仑山，南面是阿尔泰山","C":"阿尔泰山和天山之间是准噶尔盆地","D":"天山和昆仑山之间是塔里木盆地","E":"准噶尔盆地是我国最大的全封闭性内陆盆地"},"explanation":"新疆的地貌可以概括为\"三山夹两盆\"。B 项应为北面是阿尔泰山、南面是昆仑山，方\n\n位颠倒；E 项我国最大的全封闭性内陆盆地是塔里木盆地，非准噶尔盆地，故不选。\n\n同类对比‑ ‑ 新疆\"三山夹两盆\"(新疆)\n\n‑ 阿尔泰山：北面；\n\n‑ 天山：横亘中部，把新疆分为南疆和北疆；\n\n‑ 昆仑山：南面；\n\n‑ 准噶尔盆地：阿尔泰山与天山之间；\n\n‑ 塔里木盆地：天山与昆仑山之间，中国最大的全封闭性内陆盆地。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABDE","stem":"中国古代宫殿布局的突出特点有(   )。","options":{"A":"中轴对称","B":"左祖右社","C":"面朝后市","D":"前朝后寝","E":"皇权至上"},"explanation":"ABDE 项正确。中国古代宫殿建筑的布局特点包括：中轴对称、左祖右社、前朝后寝、\n\n皇权至上。 26 版教材新增考点。\n\n易混对比‑ ‑ 中国古代宫殿布局\n\n‑ 中轴对称：中轴线上建筑高大华丽，轴侧建筑低小简单，体现皇权至高无上；\n\n‑ 左祖右社：宫殿左前方设祖庙(太庙)，右前方设社稷坛；\n\n‑ 前朝后寝：宫殿由前、后两部分组成，一墙之隔，\"前堂后室\"。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABCD","stem":"清代广东\"四大园林\"也称岭南\"四大园林\"，包括(     )。","options":{"A":"顺德清晖园","B":"东莞可园","C":"番禺余荫山房","D":"佛山梁园","E":"苏州拙政园"},"explanation":"清代广东\"四大园林\"也被称为岭南\"四大园林\"，分别是顺德清晖园、东莞可园、番禺\n\n余荫山房、佛山梁园。E 拙政园是苏州\"四大园林\"之一，不属于岭南园林。\n\n同类对比‑ ‑ 岭南四大园林\n\n‑ 清晖园：广东顺德；\n\n‑ 可园：广东东莞；\n\n‑ 余荫山房：广东番禺；\n\n‑ 梁园：广东佛山。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCD","stem":"白族姑娘头饰上\"风花雪月\"的寓意，下列对应正确的有(        )。","options":{"A":"艳丽的花饰‑ ‑ 上关花","B":"垂下的穗子‑ ‑ 下关风","C":"帽顶的白色‑ ‑ 苍山雪","D":"弯弯的造型‑ ‑ 洱海月","E":"艳丽的花饰‑ ‑ 下关花"},"explanation":"白族崇尚白色，在白族姑娘的头饰上，显示着\"风花雪月\"的寓意，垂下的穗子象征下\n\n关风，艳丽的花饰象征上关花，帽顶的白色代表苍山雪，弯弯的造型代表洱海月。E 项艳丽\n\n的花饰象征上关花而非\"下关花\"，对应错误，故不选。\n\n同类对比‑ ‑ 白族风情(云南)\n\n‑ 头饰\"风花雪月\"：穗子象征下关风、花饰象征上关花、帽顶白色代表苍山雪、弯弯造型代\n\n表洱海月；\n\n‑ \"三道茶\"：一苦、二甜、三回味，白族传统品茶艺术和待客礼仪。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABCDE","stem":"下列属于\"五胡\"的有(    )。","options":{"A":"匈奴","B":"鲜卑","C":"羯","D":"氐","E":"羌"},"explanation":"秦汉魏晋南北朝是中国统一的中央集权王朝建立和逐步发展时期，是秦汉政治制度向\n\n隋唐政治制度转型时期。 中国北方先后有匈奴、鲜卑、羯、氐、羌\"五胡\"进入中原，实现\n\n了与汉民族的互相融合；中国南方由于北方人口大规模向南迁徙，经济持续发展，为唐宋以\n\n后中国经济中心的南移奠定了坚实的基础。\n\n同类对比‑ ‑ \"五胡\"内迁\n\n‑ 五胡：匈奴、鲜卑、羯、氐、羌；\n\n‑ 时代：秦汉魏晋南北朝时期；\n\n‑ 影响：进入中原，实现了与汉民族的互相融合。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABCDE","stem":"下列说法正确的有(     )。","options":{"A":"竹子象征人品清逸和气节高尚","B":"紫薇象征高官厚禄","C":"石榴象征多子多福","D":"松柏象征坚强和长寿","E":"莲花象征洁净无瑕"},"explanation":"花木除了对山石景观起衬托作用外，又往往和园主人追求的精神境界有关。如竹子象\n\n征人品清逸、气节高尚；松柏象征坚强和长寿；莲花象征洁净无瑕；玉兰、牡丹、桂花象征\n\n荣华富贵；石榴象征多子多福；紫薇象征高官厚禄等。\n\n[答题技巧]\n\n竹子‑ ‑ 节节长高‑ ‑ 气节高尚；\n\n松柏‑ ‑ 迎客松活了很久‑ ‑ 坚强和长寿；\n\n莲花‑ ‑ 白莲洁净无瑕；\n\n玉兰、牡丹、桂花‑ ‑ \"母\"(牡)玉\"贵\"(桂)‑ ‑ \"母亲的玉镯很贵\"‑ ‑ 荣华富贵；\n\n石榴‑ ‑ 很多籽‑ ‑ 多子多福；\n\n紫薇‑ ‑ 紫色官纱帽‑ ‑ 高官厚禄。\n\n26 版教材改动：石榴的象征寓意由\"多子多孙\"改为\"多子多福\"。\n\n同类对比‑ ‑ 园林花木的象征意义\n\n‑ 竹子：象征人品清逸、气节高尚；\n\n‑ 松柏：象征坚强和长寿；莲花：象征洁净无瑕；\n\n‑ 玉兰、牡丹、桂花：象征荣华富贵；石榴：象征多子多福；紫薇：象征高官厚禄。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ACE","stem":"下列属于\"中国丹霞\"联合申报省份的有(    )。","options":{"A":"贵州","B":"广西","C":"湖南","D":"云南","E":"浙江"},"explanation":"\"中国丹霞\"由贵州、福建、湖南、广东、江西、浙江联合申报。 中国丹霞 6 省：黔\n\n闽湘粤赣浙‑ ‑ 贵州、福建、湖南、广东、江西、浙江。\n\n同类对比‑ ‑ \"中国丹霞\"6 省\n\n‑ 贵州赤水、福建泰宁、湖南崀山、广东丹霞山、江西龙虎山及龟峰、浙江江郎山；\n\n‑ 批准年代：2010 年。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ABCD","stem":"山东\"黄金海滨城市群\"包括的城市有(    )。","options":{"A":"青岛","B":"烟台","C":"威海","D":"日照","E":"济南"},"explanation":"青岛、烟台、威海、日照构成中国东部唯一的黄金海滨城市群。E 项济南为山东内陆\n\n省会城市，不临海，不在\"黄金海滨城市群\"之列，故不选。\n\n同类对比‑ ‑ 山东城市名片(山东)\n\n‑ 青岛：著名青岛啤酒产地，2008 年北京奥运会伙伴城市；\n\n‑ 烟台：\"人间仙境\"；\n\n‑ 威海：甲午海战之地、\"最适合人类居住的范例城市\"；\n\n‑ 日照：海滨城市。","clips":[]}]</script>
<script>

const questions=JSON.parse(document.getElementById('question-data').textContent);

const key='leidada-2026-paper8-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;

      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
</html>
