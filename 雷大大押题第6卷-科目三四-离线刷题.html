<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"错","stem":"生态旅游的核心特征是通过传感器网络实时采集景区环境、客流等数据。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，通过传感器网络实时采集景区环境、客流等数据是智慧旅游的特征，\n\n不是生态旅游的核心特征。生态旅游是指以可持续发展为理念，以保护生态环境为前提，以\n\n统筹人与自然和谐为准则，并依托良好的自然生态环境和独特的人文生态系统，采取生态友\n\n好方式开展的生态体验、生态教育、生态认知并获得身心愉悦的旅游方式。","clips":[]},{"n":2,"kind":"判断题","answer":"错","stem":"丹霞地貌因为在福建武夷山的丹霞山发现而被命名。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，丹霞地貌是在广东仁化县的丹霞山发现而被命名的（不是福建武夷山）。\n\n丹霞地貌：由中国学者于 1928 年在广东丹霞山正式命名，是唯一以我国地名命名、被国际\n\n地貌学会专门设立工作组独立研究的地貌类型。","clips":[]},{"n":3,"kind":"判断题","answer":"对","stem":"江苏古琴艺术在中国具有突出地位，先后形成常熟虞山琴派、扬州广陵琴派、南京金陵琴派等重要的地方性音乐流派。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。江苏古琴艺术在中国具有突出地位，先后形成常熟虞山琴派、扬州广\n\n陵琴派、南京金陵琴派等重要的地方性音乐流派。","clips":[]},{"n":4,"kind":"判断题","answer":"错","stem":"仰韶文化居民种植水稻，使用黑陶，修建干栏式建筑。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，种植粟、使用彩陶、修建半地穴式建筑的是仰韶文化（河姆渡文化种\n\n植水稻、使用黑陶、修建干栏式建筑）。代表性文化有北方黄河流域的仰韶文化和南方长江\n\n流域的河姆渡文化，距今 7000~5000 年。","clips":[]},{"n":5,"kind":"判断题","answer":"对","stem":"鱼尾狮坐落于新加坡河畔，高 8 米，是新加坡的标志。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。鱼尾狮坐落于新加坡河畔，高 8 米，是新加坡的标志。","clips":[]},{"n":6,"kind":"判断题","answer":"对","stem":"相传春秋战国时期，上海曾经是楚国春申君黄歇的封邑，故上海别称为“申”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。上海，简称“沪”，别称“虫”。相传春秋战国时期，上海曾经是楚国\n\n春申君黄歇的封邑，故上海别称为“虫”。","clips":[]},{"n":7,"kind":"判断题","answer":"错","stem":"山西因居太行山之东而得名，又因地处黄河之西，古称河东。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“居太行山之西”“地处黄河之东，古称河东”。山西因居太行山\n\n之西而得名，又因地处黄河之东，古称河东。简称“晋”，春秋战国之交，韩、赵、魏三分\n\n晋国，又称“三晋”。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"南朝祖冲之在世界上首次将圆周率精确到小数点后第 7 位。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。南朝祖冲之在世界上首次将圆周率精确到小数点后第 7 位，其子祖曜\n\n提出了计算球体体积的祖曜原理。26 版教材改动说明：“祖曜”更正为“祖曜”。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"新加坡是继纽约、伦敦、日本东京之后的第四大国际金融中心。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，新加坡是继纽约、伦敦、中国香港之后的第四大国际金融中心（不是\n\n日本东京之后），也是亚洲重要的航运和服务中心。","clips":[]},{"n":10,"kind":"判断题","answer":"对","stem":"1891 年，重庆成为中国最早对外开放的内陆通商口岸之一。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1891 年，重庆成为中国最早对外开放的内陆通商口岸之一。","clips":[]},{"n":11,"kind":"判断题","answer":"对","stem":"后母戊鼎是迄今世界上发现的最大的青铜器，其重达 832.84 公斤。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。商朝代表性器物是高达 133 厘米、重达 832.84 公斤的后母戊鼎，是\n\n迄今世界上发现的最大的青铜器。","clips":[]},{"n":12,"kind":"判断题","answer":"错","stem":"联合国旅游组织（UN Tourism）是联合国系统的政府间国际组织，总部设在法国巴黎。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，联合国旅游组织总部设在西班牙马德里（不是法国巴黎）。联合国旅\n\n游组织（UN Tourism）是联合国系统的政府间国际组织，总部位于西班牙马德里。26 版教\n\n材改动说明：“世界旅游组织（UNWTO）”改为“联合国旅游组织”，补充 2024 年更名、世界\n\n旅游日、新视觉标识和口号；会员口径更新为 160 个正式会员国、6 个准成员、2 个观察员。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"贵州全省建成公路桥梁超 2.8 万座，被称为“世界桥梁博物馆”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。贵州全省建成公路桥梁超 2.8 万座，被称为“世界桥梁博物馆”。","clips":[]},{"n":14,"kind":"判断题","answer":"对","stem":"一二·九运动标志着中国人民抗日救亡民主运动新高潮的到来。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。二·九运动揭露了日本吞并华北进而独占中国的阴谋，打击了国民党\n\n的妥协退让政策，极大地促进了中华民族的觉醒，标志着中国人民抗日救亡民主运动新高潮\n\n的到来。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"大本钟是法国巴黎的标志性建筑。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，大本钟是英国伦敦（不是法国巴黎）的标志性建筑之一。主要景点有\n\n白金汉宫、唐宁街 10 号、议会大厦、大英博物馆、圣保罗教堂、威斯敏斯特教堂、伦敦塔、\n\n伦敦塔桥、大本钟、温莎城堡、格林尼治天文台、中国城、海德公园等。","clips":[]},{"n":16,"kind":"判断题","answer":"对","stem":"富士山海拔 3776 米，是日本最高峰，被尊称为“圣岳”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。富士山是日本的最高峰，海拔 3776 米，被日本人尊称为“圣岳”，是\n\n世界著名火山及风景游览区，成为日本的象征。","clips":[]},{"n":17,"kind":"判断题","answer":"对","stem":"党的七大以“团结的大会、胜利的大会”载入史册。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。七大以“团结的大会、胜利的大会”载入史册。党的七大于 1945 年\n\n4 月 23 日至 6 月 11 日在延安举行，确定“以马克思列宁主义的理论与中国革命的实践之统\n\n一的思 想——毛泽东思想，作为自己一切工作的指针”。","clips":[]},{"n":18,"kind":"判断题","answer":"对","stem":"刘志丹、谢子长、习仲勋、吴岱峰等在陕甘交界地区创建了西北地区第一个革命根据地——陕甘边革命根据地。（ ）","options":{"对":"正确","错":"错误"},"explanation":"解析本题说法正确。刘志丹、谢子长、习仲勋、吴岱峰等在陕甘交界地区创建了西北\n\n地区第一个革命根据地——陕甘边革命根据地。","clips":[]},{"n":19,"kind":"判断题","answer":"错","stem":"《九章算术》标志着我国古典数学体系基本形成，其成书年代是西汉。（ ）","options":{"对":"正确","错":"错误"},"explanation":"解析本题说法错误，《九章算术》成书于东汉（不是西汉）。东汉时期的《九章算术》，\n\n提出了负数概念及正负数运算法则，标志着我国古代数学体系基本形成。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"吉林省查干湖多年来形成了独具渔猎特色的查干湖文化，查干湖冬捕已传承数千年。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"我国探月工程命名为“嫦娥工程”，于 2004 年启动。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2004 年我国启动探月工程，命名为“嫦娥工程”。已实现多次月球探\n\n测，其中嫦娥五号带回月壤 1731 克，嫦娥六号带回人类首份月背样品 1935.3 克。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"辽宁是我国东北老工业基地核心省份，是全国重要的装备制造、石化冶金、船舶海工产业基地。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。辽宁省是我国东北老工业基地核心省份，是全国重要的装备制造、石\n\n化冶金、船舶海工产业基地。","clips":[]},{"n":23,"kind":"判断题","answer":"对","stem":"按照题材划分，中国画可分为人物画、山水画和花鸟画等类型。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。如果按照题材划分，中国画可分为人物画、山水画和花鸟画等类型，\n\n有工笔、写意、水墨、勾勒等多种技法，注重神似不重形似，大多数作品用笔、墨、纸、砚\n\n绘制而成，加上题诗和装裱，构成充满诗情画意的精美艺术品。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"北京从辽代到清末建造了许多宏伟的宫廷建筑，是我国拥有帝王宫殿、庙坛和陵墓数量最多、内容最丰富的城市。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。北京有 870 年的建都史，从辽代到清末，北京建造了许多宏伟的宫廷\n\n建筑，是我国拥有帝王宫殿、庙坛和陵墓数量最多、内容最丰富的城市。","clips":[]},{"n":25,"kind":"判断题","answer":"对","stem":"作为中国南北气候分界线的秦岭山脉横贯陕西全省东西。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。作为中国南北气候分界线的秦岭山脉横贯全省东西。","clips":[]},{"n":26,"kind":"判断题","answer":"错","stem":"安徽清康熙六年（1667 年）设安徽布政使司，取辖区内“安庆”“六安”两地首字，正式定名为“安徽”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“取“安庆”“徽州”两地首字”。清康熙六年（1667 年）设安\n\n徽布政使司，取辖区内“安庆”“徽州”两地首字，正式定名为“安徽”。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"1970 年 7 月成昆铁路竣工运营，基本改写了蜀道难的历史。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1970 年 7 月成昆铁路竣工运营，基本改写了蜀道难的历史。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"1624 年荷兰殖民者侵占台湾南部，1626 年西班牙殖民者入侵台湾北部，1642 年荷兰取代西班牙占领台湾北部。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1624 年荷兰殖民者侵占台湾南部，1626 年西班牙殖民者入侵台湾北\n\n部，1642 年荷兰取代西班牙占领台湾北部。","clips":[]},{"n":29,"kind":"判断题","answer":"错","stem":"被誉为“天下第一行书”的书法作品是《祭侄文稿》。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，被誉为“天下第一行书”的是王羲之的《兰亭集序》（不是《祭侄文\n\n稿》）。行书以东晋王羲之成就最高，人称“书圣”，代表作《兰亭集序》被誉为“天下第一\n\n行书”。","clips":[]},{"n":30,"kind":"判断题","answer":"错","stem":"德天瀑布是我国水流量最大的瀑布。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，我国水流量最大的瀑布是壶口瀑布（不是德天瀑布）。德天瀑布是亚\n\n洲第一大跨国瀑布。","clips":[]},{"n":31,"kind":"判断题","answer":"对","stem":"北宋时，平民毕昇发明活字印刷术，使用胶泥制作单字，再排版印刷。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。北宋时，平民毕昇发明活字印刷术，使用胶泥制作单字，再排版印刷，\n\n效率大幅提升。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"在法国，接受礼物要当面打开，否则是无礼的表现。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。接受礼物时要当面打开，否则是无礼的表现。","clips":[]},{"n":33,"kind":"判断题","answer":"对","stem":"西藏还是国际河流分布最多的中国省区，亚洲著名的恒河、印度河、布拉马普特拉河、湄公河等河流的上源都在这里。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。西藏还是国际河流分布最多的中国省区，亚洲著名的恒河、印度河、\n\n布拉马普特拉河、湄公河等河流的上源都在这里。","clips":[]},{"n":34,"kind":"判断题","answer":"对","stem":"新疆全年日照时间平均 2600～3400 小时，居全国第 2 位，为特色优势农产品种植提供了良好的自然条件。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。新疆全年日照时间平均 2600～3400 小时，居全国第 2 位，为特色优\n\n势农产品种植提供了良好的自然条件。","clips":[]},{"n":35,"kind":"判断题","answer":"对","stem":"南宋宋慈著《洗冤录》，是中国第一部法医学专著。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。南宋宋慈著《洗冤录》，是中国第一部法医学专著。","clips":[]},{"n":36,"kind":"判断题","answer":"错","stem":"云南最高峰是位于玉龙雪山的扇子陡。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“梅里雪山最高峰卡瓦格博峰，海拔 6740 米，是云南最高山峰”。\n\n梅里雪山最高峰卡瓦格博峰海拔 6740 米，是云南最高山峰。","clips":[]},{"n":37,"kind":"判断题","answer":"对","stem":"福建共有 10 个项目入选《联合国教科文组织非遗名录》（名册），是全国唯一实现代表作名录、急需保护名录、优秀保护实践名册三个名录系列“大满贯”的省份。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。福建共有 10 个项目入选《联合国教科文组织非遗名录》（名册），是\n\n全国唯一实现代表作名录、急需保护名录、优秀保护实践名册三个名录系列“大满贯”的省\n\n份。","clips":[]},{"n":38,"kind":"判断题","answer":"对","stem":"“三湘”因湘江流经永州时与“潇水”、流经衡阳时与“蒸水”、入洞庭湖时与“沅水”相汇而得名，分别称“潇湘”“蒸湘”“沅湘”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。三湘”因湘江流经永州时与“潇水”、流经衡阳时与“蒸水”、入洞庭\n\n湖时与“沅水”相汇而得名，分别称“潇湘”“蒸湘”“沅湘”。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"新界中部的大帽山（957 米）是香港第一高峰。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。新界中部的大帽山（957 米）是香港第一高峰。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"12 世纪，铁木真统一蒙古诸部，建立大蒙古国，被尊为成吉思汗，蒙古族的名字由此而来，象征着“永恒之火”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。12 世纪，铁木真统一蒙古诸部，建立大蒙古国，被尊为成吉思汗，\n\n蒙古族的名字由此而来，象征着“永恒之火”。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"B","stem":"嫦娥六号带回的人类首份月背样品重（ ）。","options":{"A":"1731 克","B":"1935.3 克","C":"2000 克","D":"1500 克"},"explanation":"1731 克是嫦娥五号带回的月壤重量，A 项错误。嫦娥六号带回人类首份月背样品，重\n\n1935.3 克。","clips":[]},{"n":42,"kind":"单项选择题","answer":"C","stem":"拙政园请吴门画派的代表人物（ ）为其设计蓝图。","options":{"A":"仇英","B":"沈周","C":"文徽明","D":"唐寅"},"explanation":"王献臣曾请吴门画派的代表人物文徽明为其设计蓝图，形成以水为主、疏朗平淡、近\n\n乎自然的风景。","clips":[]},{"n":43,"kind":"单项选择题","answer":"B","stem":"1852 年，（ ）受命在湘组建湘军，镇压太平天国。","options":{"A":"左宗棠","B":"曾国藩","C":"李鸿章","D":"张之洞"},"explanation":"1852 年, 曾国藩受命在湘组建湘军, 镇压太平天国。左宗棠为湘军重要将领但非组\n\n建者, 李鸿章组建淮军, 张之洞为洋务派代表, 1852 年组建湘军者为曾国藩。","clips":[]},{"n":44,"kind":"单项选择题","answer":"A","stem":"标志着新民主主义革命伟大开端的是（ ）。","options":{"A":"五四运动","B":"中国共产党成立","C":"南昌起义","D":"辛亥革命"},"explanation":"五四运动是近代中国革命史上具有划时代意义的事件，标志着新民主主义革命的伟大\n\n开端。","clips":[]},{"n":45,"kind":"单项选择题","answer":"B","stem":"我国支派最多的佛教宗派是（ ）。","options":{"A":"律宗","B":"禅宗","C":"净土宗","D":"密宗"},"explanation":"禅宗是我国支派最多的佛教宗派，也是中国佛教史上流传最久远、对中国文化思想影\n\n响最广泛的宗派。","clips":[]},{"n":46,"kind":"单项选择题","answer":"D","stem":"1227 年蒙古灭西夏后，设（ ），始有宁夏之名。","options":{"A":"宁夏府","B":"西夏路","C":"灵州路","D":"宁夏路"},"explanation":"解析简称“宁”，首府银川市。1227 年蒙古灭西夏后，设宁夏路，始有宁夏之名。","clips":[]},{"n":47,"kind":"单项选择题","answer":"A","stem":"澳门鱼行醉龙节是澳门鲜鱼行独有的一项民间传统节庆活动，又称（ ）。","options":{"A":"澳门鱼行醉龙醒狮大会","B":"澳门醉龙巡游","C":"澳门鲜鱼行庙会","D":"澳门龙舟醉会"},"explanation":"澳门鱼行醉龙节是澳门鲜鱼行独有的一项民间传统节庆活动，又称澳门鱼行醉龙醒狮\n\n大会。","clips":[]},{"n":48,"kind":"单项选择题","answer":"D","stem":"壮族地区产量居全国首位的作物是（ ）。","options":{"A":"橡胶","B":"剑麻","C":"香蕉","D":"甘蔗"},"explanation":"壮族地区甘蔗产量居全国首位，南珠、三七、蛤是壮族地区最负盛名的特产。","clips":[]},{"n":49,"kind":"单项选择题","answer":"C","stem":"“布达拉”是梵语音译，又译作“普陀”，原指（ ）所居之岛。","options":{"A":"文殊菩萨","B":"释迦牟尼佛","C":"观世音菩萨","D":"阿弥陀佛"},"explanation":"布达拉宫位于西藏拉萨市的红山上，“布达拉”是梵语音译，又译作“普陀”，原指观\n\n世音菩萨所居之岛。","clips":[]},{"n":50,"kind":"单项选择题","answer":"C","stem":"1914 年在巴拿马国际博览会上一举夺得金奖的是天津的（ ）。","options":{"A":"“泥人张”彩塑","B":"杨柳青年画","C":"“魏记”风筝","D":"天津地毯"},"explanation":"1914 年，“魏记”风筝在巴拿马国际博览会上一举夺得金奖。“泥人张”彩塑、杨柳\n\n青年画、天津地毯同为天津名产，但 1914 年获巴拿马国际博览会金奖者为“魏记”风筝。","clips":[]},{"n":51,"kind":"单项选择题","answer":"A","stem":"唐朝出现了专门掌握绳墨绘制图样和施工的（ ）。","options":{"A":"都料匠","B":"梓人","C":"鲁班","D":"瓦匠"},"explanation":"唐朝在建筑技术方面，出现了木构架设计的标准，木构件的比例形式逐步趋向定型化，\n\n并出现了专门掌握绳墨绘制图样和施工的都料匠。","clips":[]},{"n":52,"kind":"单项选择题","answer":"D","stem":"主桥跨径居山区桥梁跨径世界第一、桥梁高度居世界第一，“横竖”都是世界第一的贵州大桥是（ ）。","options":{"A":"北盘江大桥","B":"坝陵河大桥","C":"鸭池河大桥","D":"花江峡谷大桥"},"explanation":"花江峡谷大桥全长 2890 米，主桥跨径 1420 米，桥面至水面垂直高度 626.01 米，主\n\n桥跨径居山区桥梁跨径世界第一、桥梁高度居世界第一，被称为“横竖”都是世界第一。一、\n\n桥梁高度居世界第一，被称为“横竖”都是世界第一。北盘江大桥、坝陵河大桥、鸭池河大\n\n桥均为贵州著名桥梁，但“横竖都是世界第一”者为花江峡谷大桥。","clips":[]},{"n":53,"kind":"单项选择题","answer":"C","stem":"新亚欧大陆桥又名“第二亚欧大陆桥”，是从（）到荷兰鹿特丹港的国际化铁路交通干线。","options":{"A":"山东省青岛市","B":"辽宁省大连市","C":"江苏省连云港市","D":"上海市"},"explanation":"新亚欧大陆桥又名“第二亚欧大陆桥”，是从江苏省连云港市到荷兰鹿特丹港的国际\n\n化铁路交通干线，国内由陇海铁路和兰新铁路组成，全长 10900 公里。新亚欧大陆桥东起江\n\n苏连云港，西抵荷兰鹿特丹，青岛、大连、上海均非其起点。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":54,"kind":"单项选择题","answer":"C","stem":"全国唯一的畲族自治县——景宁畲族自治县位于浙江省（）。","options":{"A":"温州市","B":"衢州市","C":"丽水市","D":"杭州市"},"explanation":"浙江省丽水市设有全国唯一的畲族自治县——景宁畲族自治县，畲民自称“山哈”，\n\n意为山里的客人。景宁畲族自治县隶属于丽水市，非温州、衢州、杭州所辖。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":55,"kind":"单项选择题","answer":"C","stem":"中国最早的马克思主义传播者是（ ）。","options":{"A":"鲁迅","B":"陈独秀","C":"李大钊","D":"毛泽东"},"explanation":"李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","clips":[]},{"n":56,"kind":"单项选择题","answer":"D","stem":"上海民族民间文化以（ ）为根、移民文化为脉、海派文化为魂。","options":{"A":"徽文化","B":"荆楚文化","C":"齐鲁文化","D":"江南文化（吴越文化）"},"explanation":"上海民族民间文化以江南文化（吴越文化）为根、移民文化为脉、海派文化为魂，兼\n\n具吴越传统与中西交融特质，开放包容、精致务实。上海民族民间文化以江南文化（吴越文\n\n化）为根，徽文化、齐鲁文化、荆楚文化均非上海文化之根。","clips":[]},{"n":57,"kind":"单项选择题","answer":"C","stem":"继北京之后，全国第二个拥有双 4F 机场的城市是（ ）。","options":{"A":"上海","B":"广州","C":"成都","D":"深圳"},"explanation":"成都市是继北京之后全国第二个拥有双 4F 机场的城市。","clips":[]},{"n":58,"kind":"单项选择题","answer":"C","stem":"隋开皇九年（589 年）将荆州江夏郡改称（ ），后来鄂州又成为治所，今湖北简称鄂即源于此。","options":{"A":"荆州","B":"江夏","C":"鄂州","D":"武昌"},"explanation":"隋开皇九年（589 年）将荆州江夏郡改称鄂州，治江夏，后来鄂州又成为治所，今湖\n\n北简称鄂即源于此。荆州、江夏为隋代以前的郡名，武昌为今湖北城市，湖北简称“鄂”源\n\n于隋代改称鄂州。","clips":[]},{"n":59,"kind":"单项选择题","answer":"B","stem":"土家人把是否善于（ ）作为衡量女子才德的标准。","options":{"A":"唱山歌","B":"哭嫁","C":"织锦","D":"摆手舞"},"explanation":"女子在出嫁前 7~20 天开始哭，哭嫁歌有“女哭娘”“姐哭妹”“骂媒人”等。开始是\n\n轻歌唱，越接近嫁期越悲伤。土家人把是否善于哭嫁作为衡量女子才德的标准。唱山歌、织\n\n锦均为土家族传统技艺，摆手舞为土家族传统舞蹈，土家人把是否善于哭嫁作为衡量女子才\n\n德的标准。","clips":[]},{"n":60,"kind":"单项选择题","answer":"C","stem":"绍兴加饭酒距今已有（ ）多年的酿造历史。","options":{"A":"1000","B":"1500","C":"2300","D":"3000"},"explanation":"解析古称“山阴甜酒”“越酒”，距今已有 2300 多年的酿造历史。具有色泽橙黄清澈、\n\n香气芬芳浓郁、滋味鲜甜醇厚、越陈越香、久藏不坏的特点。","clips":[]},{"n":61,"kind":"单项选择题","answer":"C","stem":"世界上海拔最高的湖泊是（ ）。","options":{"A":"色林错","B":"青海湖","C":"纳木错","D":"扎日南木错"},"explanation":"纳木错也是世界上海拔最高的湖泊。色林错、扎日南木错均为西藏大湖，青海湖为我\n\n国最大的内陆咸水湖，但世界上海拔最高的湖泊为纳木错。","clips":[]},{"n":62,"kind":"单项选择题","answer":"D","stem":"湖北土家族把丧事当作喜事办的独特丧葬习俗是（ ）。","options":{"A":"哭嫁","B":"赶年","C":"舍巴日","D":"跳丧"},"explanation":"湖北土家族风情除了独具特色的服饰和美食外，特别值得一提的是“跳丧”的习俗。\n\n是把丧事当作喜事办的独特丧葬习俗。哭嫁为土家族婚俗，赶年为土家族年俗，舍巴日为土\n\n家族祭祀节庆，“跳丧”才是其独特丧葬习俗。","clips":[]},{"n":63,"kind":"单项选择题","answer":"B","stem":"国民党一大事实上确立的三大政策是（ ）。","options":{"A":"联俄、联共、联蒋","B":"联俄、联共、扶助农工","C":"民族、民权、民生","D":"联美、联共、扶助农工"},"explanation":"1924 年 1 月，中国国民党第一次全国代表大会召开，重新解释三民主义，事实上确\n\n立联俄、联共、扶助农工三大政策，标志着第一次国共合作正式形成。","clips":[]},{"n":64,"kind":"单项选择题","answer":"B","stem":"以《清明上河图》最为知名的宋代画家是（ ）。","options":{"A":"王蒙","B":"张择端","C":"黄公望","D":"倪瓒"},"explanation":"宋代画家以张择端《清明上河图》最为知名。","clips":[]},{"n":65,"kind":"单项选择题","answer":"B","stem":"有“黄河之水天上来”之势，属于我国三大瀑布之一的是（ ）。","options":{"A":"黄果树瀑布","B":"壶口瀑布","C":"德天瀑布","D":"吊水楼瀑布"},"explanation":"峡谷下段有著名的壶口瀑布，有“黄河之水天上来”之势，是我国三大瀑布之一。","clips":[]},{"n":66,"kind":"单项选择题","answer":"B","stem":"中国古代使用时间最长、精确度最高的历法是（ ）。","options":{"A":"《甘石星经》","B":"《授时历》","C":"《太初历》","D":"《黄帝历》"},"explanation":"至元代郭守敬又制定《授时历》。《授时历》是中国古代使用时间最长、精确度最高的\n\n历法。","clips":[]},{"n":67,"kind":"单项选择题","answer":"D","stem":"南唐后主李煜的代表作有（ ）。","options":{"A":"《念奴娇·赤壁怀古》","B":"《水调歌头·明月几时有》","C":"《满江红》","D":"《虞美人·春花秋月何时了》"},"explanation":"李煜的代表作有《虞美人·春花秋月何时了》《浪淘沙·帘外雨潺潺》《相见欢·林花\n\n谢了春红》《相见欢·无言独上西楼》等。","clips":[]},{"n":68,"kind":"单项选择题","answer":"A","stem":"世界上海拔最高的大型湖泊，被称为“天湖”的是（ ）。","options":{"A":"纳木错","B":"鄱阳湖","C":"长白山天池","D":"青海湖"},"explanation":"解析 纳木错湖面海拔 4718 米，为世界上海拔最高的大型湖泊，也是目前中国第三大\n\n咸水湖。","clips":[]},{"n":69,"kind":"单项选择题","answer":"D","stem":"古代十二时辰中，子时对应的时间是（ ）。","options":{"A":"1 点-3 点","B":"21 点-23 点","C":"19 点-21 点","D":"23 点-1 点"},"explanation":"解析 方法是将一天分为 12 个时辰，对应十二地支，开始于子时（23—次日 1 点），\n\n结束于亥时（21~23 点），2 小时为一个时辰。","clips":[]},{"n":70,"kind":"单项选择题","answer":"B","stem":"中国共产党第二次全国代表大会举行的时间是（ ）。","options":{"A":"1921 年 7 月 23 日","B":"1922 年 7 月 16-23 日","C":"1923 年 6 月 12-20 日","D":"1925 年 1 月 11-22 日"},"explanation":"1922 年 7 月 16~23 日，中国共产党第二次全国代表大会在上海举行。","clips":[]},{"n":71,"kind":"单项选择题","answer":"C","stem":"宋代五大名窑之首是（ ）。","options":{"A":"哥窑","B":"定窑","C":"汝窑","D":"官窑"},"explanation":"汝窑瓷器釉色以天青为贵、粉青为上，天蓝和月白次之。宋代形成汝窑、官窑、哥窑、\n\n钧窑、定窑“五大名窑”，五窑中以“汝窑为魁”。26 版教材改动说明：汝窑条目 26 版整体\n\n改写——窑址明确为古汝州（今河南宝丰），改写香灰胎、开片、釉色等级（天青为贵、粉\n\n青为上，天蓝和月白次之）、宋徽宗时天青瓷烧造约 20 年等，保留玛瑙为釉及“似玉、非玉、\n\n而胜玉”评价；25 版“其釉色如雨过天晴，温润古朴”表述不再保留。","clips":[]},{"n":72,"kind":"单项选择题","answer":"D","stem":"1271 年就任蒙古帝国大汗、改国号为元的是（ ）。","options":{"A":"窝阔台","B":"蒙哥","C":"成吉思汗","D":"忽必烈"},"explanation":"1271 年，成吉思汗孙子忽必烈就任蒙古帝国大汗，改国号为元，元朝正式建立，定\n\n都大都（今北京）。","clips":[]},{"n":73,"kind":"单项选择题","answer":"A","stem":"贵州全省最高点、海拔 2900.6 米的山峰是（ ）。","options":{"A":"韭菜坪","B":"梵净山","C":"雷公山","D":"大娄山"},"explanation":"贵州简称“黔”或“贵”，省会贵阳市。全省最高点韭菜坪，海拔 2900.6 米。","clips":[]},{"n":74,"kind":"单项选择题","answer":"B","stem":"被誉为“天路”、结束了西藏没有铁路历史的铁路是（ ）。","options":{"A":"川藏铁路","B":"青藏铁路","C":"滇藏铁路","D":"拉林铁路"},"explanation":"被誉为“天路”的青藏铁路的通车结束了西藏没有铁路的历史，它全长 1956 公里，\n\n是世界上海拔最高、在冻土上路程最长的高原铁路。川藏铁路、滇藏铁路、拉林铁路均为进\n\n出藏铁路通道，但被誉为“天路”、结束西藏没有铁路历史者为青藏铁路。","clips":[]},{"n":75,"kind":"单项选择题","answer":"A","stem":"《尚书·禹贡》将天下分为“九州”，豫州位居九州之中，有（ ）之称。","options":{"A":"九州腹地、十省通衢","B":"八省通衢、天下之中","C":"五方杂处、九州之喉","D":"山河表里、四塞之固"},"explanation":"《尚书·禹贡》将天下分为“九州”，豫州位居九州之中，有“九州腹地、十省通衢”\n\n之称。","clips":[]},{"n":76,"kind":"单项选择题","answer":"B","stem":"四川省境内共有大小河流 1419 条，被誉为（）。","options":{"A":"万河之省","B":"千水之省","C":"水乡泽国","D":"鱼米之乡"},"explanation":"四川省境内共有大小河流 1419 条，被誉为“千水之省”。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":77,"kind":"单项选择题","answer":"C","stem":"有“京外名刹之首”美誉的是石家庄的（ ）。","options":{"A":"赵州桥","B":"秦皇古道","C":"隆兴寺","D":"苍岩山"},"explanation":"石家庄有被誉为“京外名刹之首”的隆兴寺。赵州桥为现存最早的敞肩石拱桥，秦皇\n\n古道为世界最早的古驿道，苍岩山为石家庄名山，但“京外名刹之首”指隆兴寺。","clips":[]},{"n":78,"kind":"单项选择题","answer":"A","stem":"下列口岸中，属于我国仅有的铁路、公路、输油气管道三位一体的国家一类口岸的是（ ）。","options":{"A":"阿拉山口口岸","B":"红其拉甫口岸","C":"巴克图口岸","D":"伊尔克什坦口岸"},"explanation":"阿拉山口口岸、霍尔果斯口岸是我国仅有的两个铁路、公路、输油气管道三位一体的\n\n国家一类口岸。","clips":[]},{"n":79,"kind":"单项选择题","answer":"B","stem":"被称为“中国戏曲之乡”的省份是（ ）。","options":{"A":"浙江省","B":"安徽省","C":"江苏省","D":"湖北省"},"explanation":"安徽被称为“中国戏曲之乡”，地方戏种现存 30 余种，影响较大的有黄梅戏、徽剧等。\n\n浙江越剧、江苏昆曲、湖北汉剧均为地方戏名称，“中国戏曲之乡”指的是安徽。","clips":[]},{"n":80,"kind":"单项选择题","answer":"D","stem":"唐天宝十四年（755 年）爆发“安史之乱”，太子李亨进入宁夏，在（ ）登基称帝，史称唐肃宗。","options":{"A":"银川","B":"中卫","C":"固原","D":"灵武"},"explanation":"唐天宝十四年（755 年）爆发了“安史之乱”，太子李亨进入宁夏，在灵武登基称帝，\n\n史称唐肃宗。","clips":[]},{"n":81,"kind":"单项选择题","answer":"D","stem":"（ ）基本属于亚热带高原季风型气候，立体气候特点显著，有“一山分四季，十里不同天”之说。","options":{"A":"四川","B":"广西","C":"贵州","D":"云南"},"explanation":"云南基本属于亚热带高原季风型气候，但受纬度差异和海拔垂直差异影响，立体气候\n\n特点显著，“一山分四季，十里不同天”，并且全省范围内同时具有寒、温、热（包括亚热带）\n\n三带气候。有“立体气候”特点的是云南，四川、广西、贵州的气候类型均与此不符。","clips":[]},{"n":82,"kind":"单项选择题","answer":"A","stem":"《史记》的作者是（ ）时期的司马迁。","options":{"A":"西汉","B":"东汉","C":"西晋","D":"唐朝"},"explanation":"西汉时期司马迁创作《史记》，首次采用“纪”“传”的方式，记叙了从传说中的黄帝\n\n到汉武帝时期 2000 多年的历史，是中国第一部纪传体通史，被鲁迅誉为“史家之绝唱，无\n\n韵之离骚”。","clips":[]},{"n":83,"kind":"单项选择题","answer":"B","stem":"全国独此一家、因用柳木炭条起线稿再扑抹印制而得名的年画是（ ）。","options":{"A":"杨柳青年画","B":"高密扑灰年画","C":"绵竹年画","D":"桃花坞年画"},"explanation":"高密扑灰年画全国独此一家，年画艺人用柳木炭条起线稿，再用画纸在线稿上扑抹印，\n\n一稿可扑数张，因有这一招，便有“扑灰”之名。到清末，发展成两个主要的流派：“老抹\n\n画”和“红货”。杨柳青年画产于天津，绵竹年画产于四川，桃花坞年画产于江苏苏州，高\n\n密扑灰年画为山东独有。","clips":[]},{"n":84,"kind":"单项选择题","answer":"C","stem":"中国现存最大的古代祭祀性建筑群是（ ）。","options":{"A":"地坛","B":"太庙","C":"天坛","D":"北京孔庙"},"explanation":"天坛位于东城区，是中国现存最大的古代祭祀性建筑群。地坛是明清帝王祭地之所，\n\n太庙为皇家祖庙，北京孔庙为祭祀孔子之所，均非最大的古代祭祀性建筑群。","clips":[]},{"n":85,"kind":"单项选择题","answer":"D","stem":"西班牙的“国粹”是（ ）。","options":{"A":"吉他","B":"海鲜饭","C":"弗拉门科舞蹈","D":"斗牛"},"explanation":"西班牙民风奔放热情，以斗牛、弗拉门戈舞蹈、吉他而闻名。斗牛是西班牙传统的民\n\n族文化，也是“国粹”。","clips":[]},{"n":86,"kind":"单项选择题","answer":"D","stem":"高达 2882 米、为河北省全省最高峰的是（ ）。","options":{"A":"雾灵山","B":"祖山","C":"驼梁","D":"小五台山"},"explanation":"在燕山和太行山山地中，小五台山高达 2882 米，为全省最高峰。","clips":[]},{"n":87,"kind":"单项选择题","answer":"B","stem":"被称为“世界上最大的四合院”的北京建筑是（ ）。","options":{"A":"雍和宫","B":"恭王府","C":"醇亲王府","D":"礼王府"},"explanation":"北京有世界上最大的皇宫——紫禁城、世界上最大的四合院——恭王府。","clips":[]},{"n":88,"kind":"单项选择题","answer":"D","stem":"清康熙十二年（1673 年），于船厂（今吉林市）建吉林城，史称“吉林乌拉”，满语译音意为（ ）。","options":{"A":"牧场","B":"平原","C":"森林","D":"沿江"},"explanation":"清康熙十二年（1673 年），于船厂（今吉林市）建吉林城，史称“吉林乌拉”（满语\n\n译音“沿江”之意），吉林由此得名。“吉林乌拉”为满语译音，意为“沿江”，非平原、森\n\n林、牧场之意。","clips":[]},{"n":89,"kind":"单项选择题","answer":"D","stem":"天津市现存最古老的一座建筑群，也是中国北方妈祖文化的研究中心和北方最大的妈祖庙是（ ）。","options":{"A":"吕祖堂","B":"玉皇阁","C":"大悲院","D":"天后宫"},"explanation":"天津天后宫是天津市现存最古老的一座建筑群，是中国北方妈祖文化的研究中心和北\n\n方最大的妈祖庙。玉皇阁、大悲院、吕祖堂均为天津道教或佛教建筑，与妈祖文化无关。","clips":[]},{"n":90,"kind":"单项选择题","answer":"B","stem":"“园林巧于因借”一语出自明代计成的（ ）。","options":{"A":"《长物志》","B":"《园冶》","C":"《闲情偶寄》","D":"《说园》"},"explanation":"《园冶》是明末出现的一部总结造园经验的著作。明代计成在《园冶》中指出，“园林\n\n巧于因借”。","clips":[]},{"n":91,"kind":"单项选择题","answer":"A","stem":"“江水并流而不交汇”的三江并流位于（ ）省。","options":{"A":"云南","B":"贵州","C":"西藏","D":"四川"},"explanation":"三江并流指金沙江、澜沧江和怒江这三条发源于青藏高原的大江在云南省境内自北向\n\n南并行奔流 170 多千米，穿越崇山峻岭，形成世界上罕见的“江水并流而不交汇”的奇特自\n\n然地理景观。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":92,"kind":"单项选择题","answer":"B","stem":"2024 年 12 月入选联合国教科文组织人类非物质文化遗产代表作名录的是（ ）。","options":{"A":"“端午节”","B":"“春节——中国人庆祝传统新年的社会实践”","C":"“中秋节”","D":"“元宵节”"},"explanation":"2024 年 12 月，中国申报的“春节——中国人庆祝传统新年的社会实践”入选联合国\n\n教科文组织人类非物质文化遗产代表作名录。“端午节”于 2009 年入选，“中秋节”“元宵节”\n\n未列入该名录。","clips":[]},{"n":93,"kind":"单项选择题","answer":"D","stem":"中国最早的农书是西汉晚期成书的（ ）。","options":{"A":"《齐民要术》","B":"《农书》","C":"《农政全书》","D":"《汜胜之书》"},"explanation":"解析中国最早的农书是西汉晚期成书的《汜胜之书》，记载黄河流域农业生产经验和\n\n耕作技术，包括选种、栽培、收获、贮藏等技术，对农作物“区种法”比较推崇。","clips":[]},{"n":94,"kind":"单项选择题","answer":"B","stem":"我国南方流传最广的民间木刻画，采用一版一色水印法的是（ ）。","options":{"A":"山东潍坊杨家埠年画","B":"苏州桃花坞年画","C":"四川绵竹年画","D":"天津杨柳青年画"},"explanation":"解析桃花坞年画以门画、中堂、条屏为主要形式，以木版雕刻、一版一色传统水印法\n\n印刷，色彩绚丽夺目，构图精巧，形象突出，主次分明，富于装饰性，形成了一种优美清秀、\n\n严密工整的独特风格，民间画坛称为“姑苏版”。","clips":[]},{"n":95,"kind":"单项选择题","answer":"C","stem":"古代帝王祭日、祭月的地点和时间分别是（ ）。","options":{"A":"南郊天坛，冬至日；北郊地坛，夏至日","B":"西郊月坛，夏至日；东郊日坛，冬至日","C":"东郊日坛，春分日；西郊月坛，秋分日","D":"东郊日坛，秋分日；西郊月坛，春分日"},"explanation":"祭日于东郊的日坛，时间在春分日。祭月于西郊的月坛，时间在秋分日。","clips":[]},{"n":96,"kind":"单项选择题","answer":"D","stem":"俗称“红教”的藏传佛教教派是（ ）。","options":{"A":"萨迦派","B":"噶举派","C":"格鲁派","D":"宁玛派"},"explanation":"宁玛派：因该派僧人穿戴红色袈裟、僧裙、僧帽，俗称红教。","clips":[]},{"n":97,"kind":"单项选择题","answer":"B","stem":"相传于农历五月初五投汨罗江殉国的爱国诗人是（ ）。","options":{"A":"李白","B":"屈原","C":"杜甫","D":"陆游"},"explanation":"端午节起源说法众多，其中以纪念战国时期楚国诗人屈原说影响最为广泛，相传屈原\n\n于农历五月初五投汨罗江殉国。","clips":[]},{"n":98,"kind":"单项选择题","answer":"A","stem":"我国现存最早的诗文总集是梁朝昭明太子萧统主编的（ ）。","options":{"A":"《文选》","B":"《文心雕龙》","C":"《乐府诗集》","D":"《玉台新咏》"},"explanation":"梁朝昭明太子萧统主编的《文选》，将文学与经、史、子区分开来，选录了前代 130\n\n位作家 500 多篇作品，我国现存最早的诗文总集。","clips":[]},{"n":99,"kind":"单项选择题","answer":"B","stem":"游客可以体验中、俄、朝三国交界处“一眼望三国、犬吠惊三疆”之意境的吉林景区是（ ）。","options":{"A":"图们","B":"防川","C":"三合","D":"南坪"},"explanation":"游客可以体验中、俄、朝三国交界处珲春防川“一眼望三国、犬吠惊三疆”之意境。\n\n图们、三合、南坪均为吉林边境口岸或景区，但“一眼望三国、犬吠惊三疆”说的是珲春防\n\n川。","clips":[]},{"n":100,"kind":"单项选择题","answer":"D","stem":"红茶多以产地命名，其中以（ ）尤为出众。","options":{"A":"西湖龙井、太湖碧螺春","B":"君山银针、蒙顶黄芽","C":"白毫银针、白牡丹","D":"安徽祁红、云南滇红"},"explanation":"红茶出现于清朝，用全发酵法制成，红叶红汤、香甜味醇，具有水果香气和醇厚的滋\n\n味，还具有耐泡的特点。红茶多以产地命名，以安徽祁红、云南滇红尤为出众。","clips":[]},{"n":101,"kind":"单项选择题","answer":"A","stem":"有着 100 多年运营历史，与香港电车、太平山山顶缆车齐名，是维多利亚港著名渡海交通工具的是（ ）。","options":{"A":"天星小轮","B":"喷射飞航","C":"港九小轮","D":"愉景湾航运"},"explanation":"有着 100 多年运营历史的天星小轮是维多利亚港的著名渡海交通工具，它与香港电车、\n\n太平山山顶缆车齐名，是拥有百年以上悠久历史的交通工具。喷射飞航、港九小轮、愉景湾\n\n航运均为香港海上交通工具，但拥有百年以上历史、与香港电车及太平山山顶缆车齐名者为\n\n天星小轮。","clips":[]},{"n":102,"kind":"单项选择题","answer":"A","stem":"粉彩瓷因颜色产生（ ）效果而得名。","options":{"A":"粉化","B":"结晶","C":"窑变","D":"开片"},"explanation":"解析粉彩瓷在烧好的胎釉上施含砷物的粉底，涂上颜料后用笔洗开，由于砷的乳蚀作\n\n用，其颜色产生粉化效果。","clips":[]},{"n":103,"kind":"单项选择题","answer":"D","stem":"彩虹袖是（ ）传统服饰中最典型的标志之一，互助县也由此赢得了“彩虹之乡”的美誉。","options":{"A":"青海藏族","B":"循化撒拉族","C":"门源回族","D":"互助土族"},"explanation":"解析彩虹袖是互助土族传统服饰中最典型的标志之一，互助县也由此赢得了“彩虹之\n\n乡”的美誉。藏族、撒拉族、回族均为青海世居少数民族，但“彩虹袖”为互助土族传统服\n\n饰标志。","clips":[]},{"n":104,"kind":"单项选择题","answer":"B","stem":"楚汉相争时，项羽曾将秦地分封给三个秦的降将，所以陕西又被称为（ ）。","options":{"A":"三晋","B":"三秦","C":"三辅","D":"三关"},"explanation":"楚汉相争时，项羽曾将秦地分封给三个秦的降将，所以陕西又被称为“三秦”。“三晋”\n\n指山西，“三辅”为汉代长安周边行政区，“三关”泛指北方关隘，陕西因项羽分封三秦王而\n\n称“三秦”。","clips":[]},{"n":105,"kind":"单项选择题","answer":"C","stem":"蒙古族最具代表性的乐器是（ ）。","options":{"A":"四胡","B":"火不思","C":"马头琴","D":"潮尔"},"explanation":"马头琴作为蒙古族最具代表性的乐器。四胡、火不思、潮尔均为蒙古族传统乐器，其\n\n中最具代表性的是马头琴。","clips":[]},{"n":106,"kind":"单项选择题","answer":"C","stem":"被联合国评为“象征 20 世纪人类征服自然的三大奇迹”之一的是（ ）。","options":{"A":"成渝铁路","B":"宝成铁路","C":"成昆铁路","D":"青藏铁路"},"explanation":"1970 年 7 月 1 日，全长 1096 公里的成昆铁路竣工运营。它与美国阿波罗宇宙飞船登\n\n月活动、苏联第一颗人造卫星一起被联合国评为“象征 20 世纪人类征服自然的三大奇迹”。","clips":[]},{"n":107,"kind":"单项选择题","answer":"C","stem":"距今 8000 年前的（ ）标志着农耕文化的初步形成，开启了中华民族的文明曙光。","options":{"A":"马家窑文化","B":"仰韶文化","C":"大地湾文化","D":"红山文化"},"explanation":"距今 8000 年前的大地湾文化标志着农耕文化的初步形成，开启了中华民族的文明曙\n\n光。马家窑文化、仰韶文化、红山文化均为新石器时代文化，标志农耕文化初步形成、开启\n\n中华民族文明曙光的是大地湾文化。","clips":[]},{"n":108,"kind":"单项选择题","answer":"D","stem":"“四个与共”的共同体理念属于（ ）的核心内容。","options":{"A":"民族团结进步创建","B":"社会主义核心价值观","C":"新时代爱国主义教育","D":"铸牢中华民族共同体意识"},"explanation":"铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死\n\n与共、命运与共的共同体理念，把铸牢中华民族共同体意识作为新时代党的民族工作和民族\n\n地区各项工作的主线。","clips":[]},{"n":109,"kind":"单项选择题","answer":"D","stem":"道教是土生土长的中国宗教，形成于（ ）。","options":{"A":"魏晋","B":"隋唐","C":"西汉","D":"东汉"},"explanation":"道教是土生土长的中国宗教，形成于东汉时期。据《后汉书·襄楷传》记载，东汉顺\n\n帝时（125~144 年），琅琊人宫崇上其师于吉于曲阳泉水上所得神书，号《太平清领书》，这\n\n就是道教最早的经典《太平经》，所传道教称为太平道，后来领导东汉黄巾起义的张角传授\n\n的就是这一教派。","clips":[]},{"n":110,"kind":"单项选择题","answer":"A","stem":"推动文化与旅游融合，是因为（ ）。","options":{"A":"文化是旅游的灵魂，旅游是文化的重要载体","B":"文化可以脱离旅游独立实现产业化","C":"旅游活动是纯经济行为，与文化无关","D":"文旅融合会削弱旅游产业的竞争力"},"explanation":"文化与旅游密不可分、相辅相成，文化是旅游的灵魂，旅游是文化的重要载体。","clips":[]},{"n":111,"kind":"单项选择题","answer":"A","stem":"五大连池药泉会（圣水节）在农历五月初五端午节前后举行，其核心内涵是（ ）。","options":{"A":"“敬天”“娱人”","B":"“祭祖”“祈福”","C":"“欢庆”“丰收”","D":"“驱邪”“避灾”"},"explanation":"五大连池药泉会（圣水节）为民俗节日，在农历五月初五端午节前后（夏历五月初四\n\n至初六 3 天）举行，是黑龙江省五大连池风景区内的达斡尔族、鄂伦春族、蒙古族、满族和\n\n汉族人民以“敬天”“娱人”为内容。五大连池药泉会（圣水节）以“敬天”“娱人”为内容，\n\n其余各项表述均非其内涵。","clips":[]},{"n":112,"kind":"单项选择题","answer":"D","stem":"中国目前保存最完整的皇家园林是（ ）。","options":{"A":"北海公园","B":"圆明园","C":"承德避暑山庄","D":"北京颐和园"},"explanation":"颐和园位于北京市海淀区，是中国目前保存最完整的皇家园林，其前身是“清漪园”。","clips":[]},{"n":113,"kind":"单项选择题","answer":"C","stem":"湘赣边界秋收起义爆发的日期是（ ）。","options":{"A":"1927 年 10 月 27 日","B":"1927 年 8 月 1 日","C":"1927 年 9 月 9 日","D":"1927 年 9 月 29 日"},"explanation":"解析以毛泽东为书记的中共湖南省委前敌委员会，将参加起义的各路武装 5000 余人\n\n统编为工农革命军第一师，于 9 月 9 日发动湘赣边界秋收起义。","clips":[]},{"n":114,"kind":"单项选择题","answer":"C","stem":"澳大利亚的首都是（ ）。","options":{"A":"悉尼","B":"墨尔本","C":"堪培拉","D":"布里斯班"},"explanation":"解析堪培拉是澳大利亚的首都，意思是“汇合之地”，1927 年联邦政府迁入此地，是\n\n个纯粹的政治中心，被誉为“太洋洲的花园城市”。","clips":[]},{"n":115,"kind":"单项选择题","answer":"A","stem":"世界上最南端的首都，有“风城”之称的是（ ）。","options":{"A":"惠灵顿","B":"堪培拉","C":"奥克兰","D":"基督城"},"explanation":"首都惠灵顿位于北岛的南端，是新西兰第二大城市，三面环山、一面临海，是世界上\n\n最南端的首都，有“风城”之称，与悉尼、墨尔本同为大洋洲的文化中心。","clips":[]},{"n":116,"kind":"单项选择题","answer":"A","stem":"下列湖泊中，属于构造湖的是（ ）。","options":{"A":"滇池","B":"镜泊湖","C":"草海","D":"杭州西湖"},"explanation":"构造湖：由地壳运动产生断裂凹陷经储水而成，如滇池、洱海、日月潭。","clips":[]},{"n":117,"kind":"单项选择题","answer":"D","stem":"台湾省汉族人口占 96%左右，大多是（ ）的移民，主要少数民族是高山族。","options":{"A":"浙江省和江西省","B":"广东省和浙江省","C":"福建省和江苏省","D":"福建省和广东省"},"explanation":"台湾省汉族人口占 96%左右，大多是福建省和广东省的移民，主要少数民族是高山族。","clips":[]},{"n":118,"kind":"单项选择题","answer":"B","stem":"中国共产党历史上生死攸关的转折点是（ ）。","options":{"A":"八七会议","B":"遵义会议","C":"瓦窑堡会议","D":"洛川会议"},"explanation":"遵义会议是党的历史上一个生死攸关的转折点，事实上确立了毛遂同志在党中央和红\n\n军的领导地位，开始确立以毛遂同志为主要代表的马克思主义正确路线在党中央的领导地位，\n\n开始形成以毛遂同志为核心的党的第一代中央领导集体，开启了党独立自主解决中国革命实\n\n际问题新阶段，在最危急关头挽救了党、挽救了红军、挽救了中国革命。","clips":[]},{"n":119,"kind":"单项选择题","answer":"A","stem":"标志着五言诗成熟的是班固的（ ）。","options":{"A":"《咏史诗》","B":"《燕歌行》","C":"《四愁诗》","D":"《古诗十九首》"},"explanation":"班固的《咏史诗》，标志着五言诗的成熟。","clips":[]},{"n":120,"kind":"单项选择题","answer":"C","stem":"1885 年，清政府划台湾为单一行省，为当时中国第 20 个行省，首任台湾巡抚是（）。","options":{"A":"沈葆桢","B":"丁日昌","C":"刘铭传","D":"邵友濂"},"explanation":"1885 年，清政府划台湾为单一行省，为当时中国第 20 个行省，首任台湾巡抚刘铭传。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":121,"kind":"单项选择题","answer":"C","stem":"南朝时，中国历史上首位由广东起家成就帝业的皇帝，也是南朝最后一个王朝“陈”的开国皇帝是（ ）。","options":{"A":"萧衍","B":"刘裕","C":"陈霸先","D":"赵佗"},"explanation":"南朝时，陈霸先是中国历史上首位由广东起家成就帝业的皇帝。也是南朝最后一个王\n\n朝“陈”的开国皇帝。萧衍为南朝梁开国皇帝，刘裕为南朝宋开国皇帝，赵佗为南越国建立\n\n者，均非由广东起家成就帝业者。","clips":[]},{"n":122,"kind":"单项选择题","answer":"B","stem":"（ ）是黎族独特的乐器。","options":{"A":"口弦","B":"鼻箫","C":"芦笙","D":"叮咚"},"explanation":"“竹竿舞”场面欢快热烈，鼻箫是黎族独特的乐器。","clips":[]},{"n":123,"kind":"单项选择题","answer":"C","stem":"有“中国情人节”之喻的农历节日是（ ）。","options":{"A":"重阳节","B":"元宵节","C":"七夕节","D":"中秋节"},"explanation":"农历七月初七，是牛郎织女鹊桥相会之日，有“中国情人节”之喻。","clips":[]},{"n":124,"kind":"单项选择题","answer":"A","stem":"明嘉靖十四年（1535 年），（ ）迁至澳门，澳门正式开埠并发展成为重要的对外贸易港口。","options":{"A":"广州市舶司","B":"泉州市舶司","C":"宁波市舶司","D":"杭州市舶司"},"explanation":"明嘉靖十四年（1535 年），广州市船司迁至澳门，澳门正式开埠并发展成为重要的对\n\n外贸易港口。","clips":[]},{"n":125,"kind":"单项选择题","answer":"B","stem":"明清科举考试中，乡试又称（ ）。","options":{"A":"“殿试”","B":"“秋闱”","C":"“春闱”","D":"“廷试”"},"explanation":"秋天在省城举行，叫“乡试”（又称“秋阅”），各府州的“生员”（或称“庠生”“秀\n\n才”）参加，考取者称为“举人”。","clips":[]},{"n":126,"kind":"单项选择题","answer":"C","stem":"西周建立后，取代杀人祭祀和殉葬的是（ ）。","options":{"A":"木俑","B":"石像","C":"陶俑","D":"纸人"},"explanation":"考古发现商朝有杀人祭祀和杀人殉葬的习俗，西周建立后这种现象才逐步消失，取而\n\n代之的是陶俑（人或六畜），体现出对生命的尊重。","clips":[]},{"n":127,"kind":"单项选择题","answer":"B","stem":"全国各地流传的“问我祖先在何处，山西洪洞大槐树”之说，与洪洞县（ ）门前的大槐树有关。","options":{"A":"广胜寺","B":"广济寺","C":"洪洞大槐树公园","D":"尧庙"},"explanation":"由于各地移民须在洪洞县广济壶门前的大槐树下办理手续后才能远行，因此大槐树成\n\n为移民的起点，全国各地流传的“问我祖先在何处，山西洪洞大槐树”的说法即由此而来。","clips":[]},{"n":128,"kind":"单项选择题","answer":"D","stem":"北京现存最古老的联拱石桥是（ ）。","options":{"A":"宝带桥","B":"洛阳桥","C":"赵州桥","D":"卢沟桥"},"explanation":"卢沟桥位于北京，是北京现存最古老的联拱石桥，“卢沟晓月”是“燕京八景”之一。","clips":[]},{"n":129,"kind":"单项选择题","answer":"A","stem":"“世界十绝风筝”之一、取材《白蛇传》的“灵芝”风筝出自（ ）。","options":{"A":"广东阳江","B":"山东潍坊","C":"北京","D":"天津"},"explanation":"1990 年，在第七届国际风筝会上，阳江市取材于民间传说《白蛇传》扎制而成的“灵\n\n芝”风筝，被评为“世界十绝风筝”之一。","clips":[]},{"n":130,"kind":"单项选择题","answer":"A","stem":"在大连被称为“海上石林”的是（）。","options":{"A":"金石滩","B":"棒棰岛","C":"老虎滩","D":"兴城海滨"},"explanation":"金石滩在大连以“满家滩，凉水湾，海参螃蟹成筐搬”而知名，滩上有数亿年前形成\n\n的海滨地貌与沉积岩石，被称为“海上石林”，后因这些石头“比金子还要贵重”，故改名为\n\n“金石滩”。老虎滩、棒岛、兴城海滨均为辽宁海滨景观，但被称为“海上石林”者为金石\n\n滩。\n\n三、多选题","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":131,"kind":"多项选择题","answer":"ABCD","stem":"白族的传统节日主要有（）。","options":{"A":"三月街","B":"绕三灵","C":"耍海节","D":"火把节","E":"泼水节"},"explanation":"解析白族的传统节日主要有三月街、绕三灵、耍海节、火把节等。E 项错误，泼水节\n\n为傣族传统节日，非白族节日。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":132,"kind":"多项选择题","answer":"ABCDE","stem":"古代察举制的察举科目有（ ）。","options":{"A":"秀才","B":"明经","C":"孝廉","D":"贤良","E":"方正"},"explanation":"本题各项表述均正确。察举制是地方官向中央举荐人才的制度，察举的科目有秀才、\n\n明经、孝廉、贤良、方正等。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ABCD","stem":"1959 年建成的“北京十大建筑”包括（ ）。","options":{"A":"人民大会堂","B":"中国人民革命军事博物馆","C":"民族文化宫","D":"北京火车站","E":"国家体育场（鸟巢）"},"explanation":"E 项错误，国家体育场（鸟巢）为 2008 年北京奥运会主体育场，不属于 1959 年建成\n\n的“北京十大建筑”。1959 年，为迎接中华人民共和国成立 10 周年建成的人民大会堂、中\n\n国历史博物馆与中国革命博物馆（两馆属同一建筑内，即今中国国家博物馆）、中国人民革\n\n命军事博物馆、民族文化宫、民族饭店、钓鱼台国宾馆、华侨大厦（曾拆除，现已重建）、\n\n北京火车站、全国农业展览馆和北京工人体育场 10 项大型建筑工程，被称为“北京十大建\n\n筑”。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ABCD","stem":"明清时期，康熙、雍正、乾隆三朝的重大史实有（ ）。","options":{"A":"康熙平定“三藩之乱”，统一台湾","B":"雍正实行“摊丁入亩”和“改土归流”","C":"乾隆平定新疆准噶尔部和大小和卓叛乱","D":"乾隆对西藏颁行《钦定藏内善后章程二十九条》","E":"雍正签订《尼布楚条约》"},"explanation":"E 项错误，《尼布楚条约》是康熙时期与沙俄签订的，不是雍正时期。康熙皇帝平定\n\n了平西王吴三桂、平南王尚可喜、靖南王耿精忠的“三藩之乱”，统一了台湾，与沙俄签订\n\n《尼布楚条约》，划定了中俄东部边界线，维护了国家主权。雍正皇帝实行“摊丁入亩”，将\n\n按人头征收的丁银摊入地税中征收，从此取消了人头税制度，促进了人口增长。","clips":[]},{"n":135,"kind":"多项选择题","answer":"ABC","stem":"按其麦芽汁的浓度，啤酒可分为（ ）。","options":{"A":"低浓度啤酒","B":"中浓度啤酒","C":"高浓度啤酒","D":"无醇啤酒","E":"黑啤"},"explanation":"D、E 项错误，按麦芽汁浓度啤酒只有低、中、高浓度三类，无醇啤酒、黑啤不属于\n\n该分类。按其麦芽汁的浓度，可分为低浓度啤酒（原麦汁浓度 6° - 8° ，酒精含量 2% 左\n\n右）、中浓度啤酒（原麦汁浓度 10° - 12° ，酒精含量 3.1% - 3.8% ）和高浓度啤酒（原\n\n麦汁浓度 14° - 20° ，酒精含量 4.9% - 5.6% ）。","clips":[]},{"n":136,"kind":"多项选择题","answer":"ABCD","stem":"八卦中代表“天、地、雷、风”的是（ ）。","options":{"A":"乾","B":"坤","C":"震","D":"巽","E":"坎"},"explanation":"乾代表天，坤代表地，震代表雷，巽代表风。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ACDE","stem":"台湾居民送礼禁忌中，忌送的物品有（ ）。","options":{"A":"粽子","B":"茶叶","C":"甜果","D":"扇子","E":"手帕"},"explanation":"台湾居民送礼禁忌如下：忌送粽子，因为台湾居民之家习惯包粽子。忌送甜果，甜果\n\n在台湾指年糕，是过年的常用祭品。忌送手帕，手帕是丧事完毕后主人送给吊丧者的礼物，\n\n寓意与死者永别。忌送扇子，台湾有“送扇，无期见”的俗语。B 项错误，茶叶不在台湾居\n\n民送礼禁忌之列。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABCD","stem":"关于徐家汇教堂，下列说法正确的有（ ）。","options":{"A":"是上海规模最大的哥特式教堂","B":"是中国第一座按西方建筑方式建造的天主教教堂","C":"现为天主教上海教区主教座堂","D":"曾被誉为“远东第一大教堂”","E":"是基督教新教教堂"},"explanation":"徐家汇教堂是上海规模最大的哥特式教堂，也是中国第一座按西方建筑方式建造的天\n\n主教教堂，现为天主教上海教区主教座堂，曾被誉为“远东第一大教堂”。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ABCD","stem":"广西少数民族舞蹈比较出名的有（ ）。","options":{"A":"扁担舞","B":"铜鼓舞","C":"绣球舞","D":"芦笙舞","E":"孔雀舞"},"explanation":"广西少数民族舞蹈比较出名的有“扁担舞、铜鼓舞、绣球舞、芦笙舞”等。E 项错误，\n\n孔雀舞为傣族舞蹈，非广西少数民族舞蹈。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ABCD","stem":"下列关于早期道教的说法，正确的有（ ）。","options":{"A":"领导东汉黄巾起义的张角传授的是太平道","B":"张陵在蜀中鹤鸣山传播五斗米道","C":"太平道和五斗米道即为早期的道教","D":"道教因老子宣扬“道”而奉老子为祖师爷","E":"早期道教形成于唐朝"},"explanation":"E 项错误，道教是土生土长的中国宗教，形成于东汉时期（不是唐朝）。与此同时，\n\n在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道教，因\n\n信徒入教必须交五斗米，故名“五斗米道”。太平道教和“五斗米道”即为早期的道教。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABC","stem":"我国第一个“五年计划”（1953—1957 年）的主持制定者有（ ）。","options":{"A":"周恩来","B":"陈云","C":"李富春","D":"邓小平","E":"刘少奇"},"explanation":"我国第一个“五年计划”（1953—1957 年）由周恩来、陈云、李富春主持制定，1955\n\n年 7 月经一届全国人大二次会议审议通过。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABCE","stem":"下列景区中，属于黑龙江省国家 5A 级旅游景区的有（ ）。","options":{"A":"哈尔滨市太阳岛景区","B":"黑河市五大连池景区","C":"牡丹江市镜泊湖景区","D":"中国雪乡景区","E":"大兴安岭地区北极村旅游景区"},"explanation":"黑龙江省国家 5A 级旅游景区包括：哈尔滨市太阳岛景区、黑河市五大连池景区、牡\n\n丹江市镜泊湖景区、伊春市林海奇石景区、大兴安岭地区北极村旅游景区、鸡西市虎头旅游\n\n景区、齐齐哈尔市扎龙生态旅游区。D 项中国雪乡景区位于牡丹江市海林市，虽为冰雪旅游\n\n名片，但为国家 4A 级旅游景区，并非 5A，故排除。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABCD","stem":"学校开展研学旅行要坚持的原则有（ ）。","options":{"A":"教育性","B":"实践性","C":"安全性","D":"公益性","E":"营利性"},"explanation":"学校开展研学旅行要坚持教育性、实践性、安全性和公益性原则，把研学旅行纳入教\n\n育教学计划，促进其与学校课程有机融合，逐步建立小学阶段以乡土乡情为主、初中阶段以\n\n县情市情为主、高中阶段以省情国情为主的课程体系。","clips":[]},{"n":145,"kind":"多项选择题","answer":"ABCD","stem":"景德镇瓷器以（）的独特风格声海内外。","options":{"A":"“白如玉”","B":"“明如镜”","C":"“薄如纸”","D":"“声如磬”","E":"“润如脂”"},"explanation":"E 项错误。景德镇瓷器造型优美、品种繁多、装饰丰富、风格独特，以“白如玉、明\n\n如镜、薄如纸、声如馨”的独特风格声海内外。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":146,"kind":"多项选择题","answer":"ABCD","stem":"海南的“吃”有四大特点，这四大特点是指（ ）。","options":{"A":"新鲜","B":"天然","C":"奇特","D":"丰富","E":"麻辣"},"explanation":"海南的“吃”有四大特点: 新鲜、天然、奇特、丰富。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ABCD","stem":"下列关于除夕食俗的表述，正确的有（ ）。","options":{"A":"北方有吃饺子的习俗，寓“更岁交子”之意","B":"南方多吃年糕，象征生活步步高","C":"家家团聚，吃团圆饭","D":"闭门团坐待旦，谓之守岁","E":"北方吃饺子，南方也吃饺子"},"explanation":"E 项错误，除夕北方地区有吃饺子的习俗，寓“更岁交子”之意，南方多吃年糕，象\n\n征生活步步高，并非南北方都吃饺子。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABCDE","stem":"下列关于美国的说法，正确的有（ ）。","options":{"A":"美国是世界第一大经济体","B":"国旗是星条旗，国花是玫瑰花","C":"纽约是美国最大的城市，也是联合国总部所在地","D":"自由女神像是法国送给美国独立 100 周年的礼物","E":"夏威夷拥有全世界最活跃的火山"},"explanation":"本题各项表述均正确。美国人口约 3.41 亿（截至 2025 年 2 月），作为世界第一大经\n\n济体，其劳动生产率、国内生产总值和对外贸易额均位居世界第一。国旗是星条旗，国花是\n\n玫瑰花。旅游景点主要有自由女神像、帝国大厦、时报广场、中央公园、联合国总部大楼、\n\n百老汇、华尔街、大都会博物馆等。拥有全世界最活跃的火山，是现代冲浪、草裙舞和夏威\n\n夷地方美食的发源地。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABC","stem":"列入《急需保护的非物质文化遗产名录》的中国项目有（ ）。","options":{"A":"维吾尔族麦西热甫","B":"中国水密舱壁帆船制作技艺","C":"中国木版活字印刷术","D":"赫哲族伊玛堪说唱","E":"福建木偶戏传承人培养计划"},"explanation":"2010 年 3 项：新疆维吾尔族麦西热甫、中国水密舱壁帆船制作技艺、中国木版活字\n\n印刷术。D 项错误，赫哲族伊玛堪说唱于 2011 年列入急需保护名录，2025 年已转入人类非\n\n物质文化遗产代表作名录；E 项错误，福建木偶戏传承人培养计划为优秀保护实践名册项目。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABCE","stem":"下列关于苏轼的说法，正确的有（ ）。","options":{"A":"号“东坡居士”","B":"《水调歌头·明月几时有》是其词作名篇","C":"《前赤壁赋》是其散文名篇","D":"是婉约派的代表人物","E":"“竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生”出自其《定风波》"},"explanation":"D 项错误，苏轼是豪放派代表人物（与辛弃疾并称），不是婉约派。苏轼（1037～1101\n\n年）：字子瞻，号东坡居士，眉山（今四川眉山市）人。宋词流派有以柳永、李清照为代表\n\n的婉约派，以苏轼、辛弃疾为代表的豪放派。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABC","stem":"陶瓷烧制是河南风物特产的核心名片，其三大传世瑰宝有（ ）。","options":{"A":"汝瓷","B":"钧瓷","C":"唐三彩","D":"青花瓷","E":"景泰蓝"},"explanation":"陶瓷烧制是河南风物特产的核心名片，拥有汝瓷、钧瓷、唐三彩三大传世瑰宝，更有\n\n登封窑、当阳峪绞胎瓷等众多特色窑艺。D 项错误，青花瓷以江西景德镇为代表；E 项错误，\n\n景泰蓝为北京传统工艺，均非河南三大传世瑰宝。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABCD","stem":"我国著名的云海景观有（ ）。","options":{"A":"黄山云海","B":"庐山云海","C":"峨眉云海","D":"衡山云海","E":"天山云海"},"explanation":"解析 E 项错误，我国著名的云海景观为黄山云海、庐山云海、峨眉云海、衡山云海，\n\n无“天山云海”。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ABC","stem":"下列关于山西汾酒、竹叶青酒的说法，正确的有（ ）。","options":{"A":"汾酒有 4000 多年的悠久历史，被誉为最早国酒","B":"竹叶青酒最早以黄酒加竹叶合酿而成，故名","C":"竹叶青酒现以汾酒为基酒，添加砂仁、紫檀、当归、陈皮等十余味名贵药材加工而成","D":"汾酒是最早以黄酒加竹叶合酿而成的酒","E":"竹叶青酒被誉为最早国酒，国之瑰宝"},"explanation":"汾酒有着 4000 多年的悠久历史，被誉为最早国酒，国之瑰宝。竹叶青酒是汾酒厂生\n\n产的另一品牌名酒，最早是以黄酒加竹叶合酿而成，故名，现以汾酒为基酒，添加砂仁，紫\n\n檀、当归、陈皮等十余味名贵药材加工而成。D 项错误，最早以黄酒加竹叶合酿而成的是竹\n\n叶青酒，非汾酒；E 项错误，被誉为“最早国酒，国之瑰宝”的是汾酒，均为张冠李戴。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ABC","stem":"下列属于我国世界文化与自然双重遗产的有（ ）。","options":{"A":"泰山","B":"黄山","C":"峨眉山及乐山大佛","D":"庐山","E":"九寨沟"},"explanation":"世界文化与自然双重遗产 4 项: 泰山、黄山、峨眉山及乐山大佛、武夷山。D 项庐山\n\n为世界文化景观, E 项九寨沟为世界自然遗产, 均非世界文化与自然双重遗产。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABCDE","stem":"兰州牛肉面的五大特点有（ ）。","options":{"A":"一清（汤清）","B":"二白（萝卜白）","C":"三红（辣子油红）","D":"四绿（香菜绿）","E":"五黄（面条黄亮）"},"explanation":"兰州牛肉面有一清（汤清）、二白（萝卜白）、三红（辣子油红）、四绿（香菜绿）、五\n\n黄（面条黄亮）五大特点。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABCD","stem":"下列属于我国著名超级工程之“最”的有（ ）。","options":{"A":"“云端上的高速”——雅西高速公路","B":"世界最复杂立交桥——重庆黄桶湾立交桥","C":"港珠澳大桥是世界上里程最长的跨海大桥","D":"三峡工程是迄今世界上最大的水利枢纽工程","E":"京张高铁是世界上第一条高铁"},"explanation":"E 项错误，世界上第一条高速铁路是京津城际铁路。此后，公路新建和改建工程在全\n\n国铺开，新工艺、新设备、新设计，新技术不断涌现，使我国的公路设计和施工技术很快赶\n\n上世界先进水平，涌现出“云端上的高速”——雅西高速公路，世界最复杂立交桥——重庆\n\n黄桶湾立交桥（又称盘龙立交桥），世界上里程最长、沉管隧道最长、施工难度最大、技术\n\n含量最高、投资金额最多的跨海大桥——港珠澳跨海大桥等著名工程。2003 年 11 月，三峡\n\n工程左岸首批 6 台机组投产发电，2006 年右岸电站进入机组安装阶段，2020 年 11 月三峡工\n\n程完成整体竣工验收。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABCD","stem":"下列寺庙中，素斋享有盛名的有（ ）。","options":{"A":"厦门南普陀寺","B":"杭州灵隐寺","C":"上海玉佛寺","D":"成都宝光寺","E":"扬州大明寺"},"explanation":"解析 E 项错误, 扬州大明寺素斋虽有名, 但教材所列“素斋享有盛名”的是厦门南普\n\n陀寺、杭州灵隐寺、上海玉佛寺、成都宝光寺、湖北武当山。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABCD","stem":"岭南文化主要有若干分支，下列属于岭南文化分支的有（ ）。","options":{"A":"广府文化","B":"客家文化","C":"潮州文化","D":"雷州文化","E":"妈祖文化"},"explanation":"岭南文化主要有广府文化、客家文化、潮州文化、雷州文化等分支。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABC","stem":"宁夏回族舞蹈中，主要的民间舞蹈有（ ）。","options":{"A":"宴席曲","B":"汤瓶舞","C":"踏脚舞","D":"安代舞","E":"孔雀舞"},"explanation":"解析在宁夏回族舞蹈中，主要有“宴席曲”“汤瓶舞”和“踏脚舞”三种民间舞蹈。D\n\n项错误，安代舞是蒙古族自娱性的传统民间舞蹈；E 项错误，孔雀舞为傣族舞蹈，均非宁夏\n\n回族民间舞蹈。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABCE","stem":"著名的南水北调中线工程以汉江中上游的丹江口水库为水源地，给（ ）提供了大量生活和生产用水。","options":{"A":"河南","B":"河北","C":"北京","D":"陕西","E":"天津"},"explanation":"著名的南水北调中线工程就以汉江中上游的丹江口水库为水源地，给河南、河北、北\n\n京、天津四省市提供了大量生活和生产用水。D 项错误，陕西不属于南水北调中线工程受水\n\n的四省市。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABC","stem":"下列工艺品中，属于甘肃特色工艺品的有（ ）。","options":{"A":"酒泉夜光杯","B":"洮砚","C":"庆阳香包","D":"蔚县剪纸","E":"苏绣"},"explanation":"特色工艺品酒泉夜光杯、洮砚（产于甘南藏族自治州卓尼县）、庆阳香包、兰州刻葫\n\n芦与卵石雕、保安腰刀，既是实用器也是艺术品。天水雕漆、临夏砖雕也精美绝伦。D 项蔚\n\n县剪纸为河北传统手工艺，E 项苏绣为江苏传统手工艺，均非甘肃特色工艺品。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABCD","stem":"下列作品与作者对应正确的有（ ）。","options":{"A":"《兰亭集序》——王羲之","B":"《岳阳楼记》——范仲淹","C":"《滕王阁序》——王勃","D":"《赤壁赋》——苏轼","E":"《桃花源记》——谢灵运"},"explanation":"E 项错误，《桃花源记》的作者是陶渊明，不是谢灵运。陶渊明的《桃花源记》《归去\n\n来兮辞》《饮酒诗》等。南朝时期的谢灵运和谢朓都爱山水，善诗文，世称谢灵运为“大谢”，\n\n谢朓为“小谢”。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABC","stem":"涪陵榨菜是中国对外出口的三大名菜之一，中国对外出口的三大名菜有（ ）。","options":{"A":"榨菜","B":"薇菜","C":"竹笋","D":"泡菜","E":"冬菜"},"explanation":"涪陵榨菜与法国酸黄瓜、德国甜酸甘蓝并称世界三大名腌菜，也是中国对外出口的三\n\n大名菜（榨菜、腌菜、竹笋）之一。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ABC","stem":"四川省河流的主体属于长江水系，下列属于其著名支流的有（）。","options":{"A":"金沙江","B":"雅砻江","C":"大渡河","D":"珠江","E":"乌江"},"explanation":"四川省河流的主体属于长江水系，有金沙江、雅砻江、大渡河、岷江、沱江、嘉陵江\n\n等著名支流。D 项珠江不流经四川；E 项乌江主要流经贵州、重庆，均非四川省河流的著名\n\n支流。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":165,"kind":"多项选择题","answer":"ABC","stem":"中国古典园林的特色有（ ）。","options":{"A":"顺应自然的指导思想","B":"诗情画意的艺术风格","C":"力求含蓄的造园手法","D":"对称规整的布局方式","E":"追求奢华的装饰风格"},"explanation":"D、E 项错误，中国古典园林的特色是顺应自然的指导思想、诗情画意的艺术风格、\n\n力求含蓄的造园手法，不采用对称规整的布局，也不追求奢华的装饰风格。","clips":[]}]</script>
<script>

const key='leidada-2026-paper6-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{

  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
</html>
