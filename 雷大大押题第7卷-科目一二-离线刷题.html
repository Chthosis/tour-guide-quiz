<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"错","stem":"根据《中华人民共和国宪法》的规定，婚姻、家庭、母亲和儿童受国家保护，禁止虐待老人、妇女、儿童和残疾人。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。宪法第 49 条规定了家庭美德——婚姻、家庭、母亲和儿童受国家保\n\n护，禁止破坏婚姻自由，禁止虐待老人、妇女和儿童。在“家庭美德”，“老人、妇女、儿童”\n\n符合对家庭角色的描述，“残疾人”错误。","clips":[]},{"n":2,"kind":"判断题","answer":"错","stem":"《民法典》规定，无权代理人以被代理人的名义订立合同，即使被代理人已经开始履行合同义务或者接受相对人履行的，该合同依然无效。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《民法典》第 503 条规定，无权代理人以被代理人的名义订立合同，\n\n被代理人已经开始履行合同义务或者接受相对人履行的，视为对合同的追认。此处，被代理\n\n人已经用行动表明接受了合同，也就是“默示”，此种情况合同相当于被追认，是有效的。\n\n故本题说法错误。","clips":[]},{"n":3,"kind":"判断题","answer":"对","stem":"导游因强迫游客消费，被“人肉搜索”，并在网上首次披露其婚姻状况、家庭背景等事实。该行为侵害了导游的隐私权。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《民法典》第 1032 条，自然人享有隐私权。任何组织或者个人不得\n\n以刺探、侵扰、泄露、公开等方式侵害他人的隐私权。","clips":[]},{"n":4,"kind":"判断题","answer":"错","stem":"《旅行社条例》规定，申请设立旅行社，经营国内旅游业务和入境旅游业务的，应当向县级以上旅游行政管理部门提交相关文件。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。是“向省、自治区、直辖市旅游行政管理部门提交相关文件”。故本\n\n题说法错误。","clips":[]},{"n":5,"kind":"判断题","answer":"对","stem":"经营者租赁他人柜台开展经营，应当以显著方式标明自身真实名称和标记。柜台场地出租者应当核验、更新、公示场内经营者信息供消费者查询。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。经营者租赁他人柜台或者场地提供商品或者服务，或者通过宣讲、\n\n抽奖、集中式体验等方式提供商品或者服务的，应当以显著方式标明其真实名称和标记。柜\n\n台、场地的出租者应当建立场内经营管理制度，核验、更新、公示经营者的相关信息，供消\n\n费者查询。（第 13 条）","clips":[]},{"n":6,"kind":"判断题","answer":"错","stem":"根据《旅游投诉处理办法》第 5 条的规定，需要立即制止、纠正旅游经营者的损害行为的，应当由旅游经营者住所地的旅游投诉处理机构管辖。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《旅游投诉处理办法》第 5 条第 2 款明确规定，需要立即制止、纠正\n\n旅游经营者的损害行为的，应当由旅游纠纷发生地旅游投诉处理机构管辖。","clips":[]},{"n":7,"kind":"判断题","answer":"对","stem":"《导游管理办法》规定，导游在执业过程中携带的电子导游证和导游身份标识，在旅游行政管理部门依法监督检查时需要出具；在旅游活动过程中，旅游者有权要求展示。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《导游管理办法》第 20 条，导游在执业过程中应当携带电子导游证、\n\n佩戴导游身份标识，并开启导游执业相关应用软件。旅游者有权要求导游展示电子导游证和\n\n导游身份标识。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"根据《安全生产法》，生产经营单位不得因从业人员拒绝违章指挥、强令冒险作业而降低其工资、福利等待遇或者解除与其订立的劳动合同。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。根据《安全生产法》第 54 条规定，生产经营单位不得因从业人员拒\n\n绝违章指挥、强令冒险作业而降低其工资、福利等待遇或者解除与其订立的劳动合同。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"根据《旅游投诉处理办法》的规定，旅游投诉处理机构接到投诉，应当在三个工作日以内决定是否受理。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《旅游投诉处理办法》第 14 条规定，旅游投诉处理机构接到投诉，\n\n应当在二个工作日以内决定是否受理。时限是“二个工作日”，而非“三个工作日”。","clips":[]},{"n":10,"kind":"判断题","answer":"错","stem":"根据《自然保护区条例》的规定，除国家级以外的其他自然保护区，列为地方级自然保护区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《自然保护区条例》第十二条：自然保护区分为国家级自然保护区和\n\n省级自然保护区。在国内外有典型意义、在科学上有重大国际影响或者有特殊科学研究价值\n\n的自然保护区，以及涉及国家海洋权益的自然保护区，列为国家级自然保护区。其他自然保\n\n护区列为省级自然保护区。","clips":[]},{"n":11,"kind":"判断题","answer":"错","stem":"根据《文物保护法》的规定，文物工作贯彻抢救为主、保护第一、合理利用、加强管理的方针。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。文物工作贯彻保护为主、抢救第一、合理利用、加强管理的方针。\n\n故本题说法错误。","clips":[]},{"n":12,"kind":"判断题","answer":"对","stem":"人民是依法治国的主体和力量源泉，人民代表大会制度是保证人民当家作主的根本政治制度。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":13,"kind":"判断题","answer":"错","stem":"依据习近平新时代中国特色社会主义思想相关理论，中国特色社会主义进入新时代，党面临的主要任务是实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程，朝着基本实现现代化的宏伟目标继续前进。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。文档原文：中国特色社会主义进入新时代。党面临的主要任务是，\n\n实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程，朝着实现中华民族伟大复\n\n兴的宏伟目标继续前进。“基本实现现代化”是 2035 年阶段性发展目标，正确表述是“实现\n\n中华民族伟大复兴”。","clips":[]},{"n":14,"kind":"判断题","answer":"错","stem":"《宗教事务条例》规定，各宗教坚持独立自主的原则，宗教团体、宗教院校、宗教活动场所和宗教事务不受外国势力的支配。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。前半句表述错误。应把独立自主改为独立自主自办。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"《港区国安法》规定，香港特别行政区负有维护国家安全的根本责任。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。根据《港区国安法》第 3 条第 1 款规定：“中央人民政府对香港特别\n\n行政区有关的国家安全事务负有根本责任。”因此，题干将“中央人民政府”误述为“香港\n\n特别行政区”，属于主体错误。虽然香港特区有维护国家安全的宪制责任（见第 10 条），但\n\n“根本责任”在中央，体现国家主权和安全事务的最高领导权属于中央人民政府。正确表述\n\n应为：“中央人民政府对香港特别行政区有关的国家安全事务负有根本责任。”","clips":[]},{"n":16,"kind":"判断题","answer":"对","stem":"根据《关于印发 2026 年版团队旅游合同(示范文本)的通知》，2026 年版团队旅游合同在原有文本基础上，新增《境内旅游组团社与地接社合同》和《研学旅游合同(示范文本)》。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。合同文本扩充为 6 套，新增《境内旅游组团社与地接社合同》《研学\n\n旅游合同（示范文本）》。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"2026 年是“十五五”开局之年，旅游大国建设首次写入国家五年规划。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“旅游强国建设”。旅游强国建设首次写入国家五年规划——2026\n\n年为“十五五”开局之年，提法出自 2026 年 5 月文旅部“5·19 中国旅游日”新闻发布会。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"2026 年 10 月 22 日，纪念中国工农红军长征胜利 100 周年大会在北京人民大会堂隆重举行，习近平出席大会并发表重要讲话。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“90 周年”。1936 年 10 月，红军三大主力在甘肃会宁、宁夏将\n\n台堡胜利会师，标志长征胜利结束。2026 年 10 月 22 日，纪念中国工农红军长征胜利 90 周\n\n年大会在北京人民大会堂隆重举行，中共中央总书记、国家主席、中央军委主席习近平出席\n\n大会并发表重要讲话。","clips":[]},{"n":19,"kind":"判断题","answer":"对","stem":"2026 年米兰—科尔蒂纳丹佩佐冬奥会上，中国代表团共获得 5 金 4 银 6 铜 15 枚奖牌，创我国境外参赛历史最好成绩。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。米兰冬奥会——2026 年 2 月 6 日至 22 日在意大利举行，中国代表\n\n团 5 金 4 银 6 铜共 15 枚奖牌，创境外参赛历史最好成绩。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"2026 年 11 月 12 日是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱孙中山先生诞辰 160 周年纪念日，全国政协届时举行隆重纪念活动。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2026 年 11 月 12 日是伟大的民族英雄、伟大的爱国主义者、中国民\n\n主革命的伟大先驱孙中山先生诞辰 160 周年纪念日，全国政协届时举行隆重纪念活动。香港\n\n特别行政区政府于 11 月 12 日上午在中环中山纪念公园举行官方纪念仪式，香港邮政同日发\n\n行特别邮票。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"热爱社会主义祖国是成为一名合格的中国导游的首要条件。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"安全检查不存在任何特殊的免检对象，不分男女、国籍和等级，均须接受安全检查。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":23,"kind":"判断题","answer":"对","stem":"国际旅游界对导游的重视程度极高，称其为“旅游业的灵魂”“旅行社的支柱”和“参观游览活动的导演”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。国际旅游界对导游的重视程度极高，称其为“旅游业的灵魂”“旅行\n\n社的支柱”和“参观游览活动的导演”。","clips":[]},{"n":24,"kind":"判断题","answer":"错","stem":"用餐结束后，地陪应严格按照团队人数、标准、饮用酒水数量等，直接付款或在结算单上签字。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。用餐结束后，地陪应严格按照实际用餐人数、标准、饮用酒水数量\n\n等核实餐厅开列的账单，直接付款或在结算单上签字。","clips":[]},{"n":25,"kind":"判断题","answer":"对","stem":"若旅游团抵达后直接前往游览点，核商日程可选择在机场或行车途中进行。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":26,"kind":"判断题","answer":"错","stem":"导游领队应兼具为游客提供服务与监督游客文明旅游两项职责。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。导游领队应兼具为游客提供服务，与引导游客文明旅游两项职责。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"旅行社制定团队旅游计划时，游客与导游总人数不得超过车辆核定乘员数。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":28,"kind":"判断题","answer":"错","stem":"导游带团时应当将长句转化为短句，把口语转化为书面语言，力求表达认真严谨。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。导游应当将长句转化为短句，把书面语转化为口语，从而使表达更\n\n为浅显明白。","clips":[]},{"n":29,"kind":"判断题","answer":"对","stem":"将同类但在规模、质量、风格、水平、面积等方面不同的事物或现象进行比较，是同类相异类比。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"“胡雪岩奉行采办务真的理念，老百姓都喜欢到胡庆余堂看病抓药，即使药方还没开，人的病就已经好了三分。”这段话采用的是超前类夸张的手法进行表达。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":31,"kind":"判断题","answer":"对","stem":"依据规定，导游执业时应携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":32,"kind":"判断题","answer":"错","stem":"政务团重视做事效率，时间安排紧凑，导游在接待安排中应提供快速高效的服务。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。商务旅游者重视做事效率，时间安排紧凑。导游在接待安排中应提\n\n供快速高效的服务。政务团严格按要求执行，确保每个环节都符合政务接待标准。","clips":[]},{"n":33,"kind":"判断题","answer":"对","stem":"导游带领研学团旅行时，应避免使用粗俗口头禅，多进行正面积极的引导，为学生树立良好的榜样。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"一旦发现客房有蟑螂、臭虫、老鼠，导游要立即要求饭店客房部门进行打扫，打扫完毕客人仍不满意，需要调换房间。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。一旦发现客房有蟑螂、臭虫、老鼠，旅游者提出换房，要立即满足，\n\n必要时调换饭店。","clips":[]},{"n":35,"kind":"判断题","answer":"错","stem":"若发现个别旅游者存在走私文物等可疑行为，导游要耐心劝阻，动之以理，晓之以情，确保旅游者的购买行为合法合规。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。若发现个别旅游者存在走私文物等可疑行为，导游必须立即向有关\n\n部门报告，确保旅游者的购买行为合法合规。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"旅游者要求亲友随团活动，在条件允许且不影响其他人的情况下，可满足旅游者要求，但事先要得到领队和旅游团其他成员的同意。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":37,"kind":"判断题","answer":"错","stem":"遭遇火灾时，导游首先应迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳楼。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。遭遇火灾时，导游首先应报警。","clips":[]},{"n":38,"kind":"判断题","answer":"错","stem":"如果遭遇海啸，不幸落水，要迅速脱掉身上衣服，否则衣服吸水会加速沉入水底。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。如果遭遇海啸，不幸落水，不能脱掉衣服，即使吸水变重。海水温\n\n度低，衣物可减缓体温流失（失温风险>负重风险）。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"笔记本电脑和平板电脑在飞机滑行、起飞或者降落等阶段禁止使用。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":40,"kind":"判断题","answer":"错","stem":"乘船旅行时，随身携带打火机数量应不超过 2 个。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。旅游乘船旅行时，携带打火机数量需要≤2 个。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"B","stem":"2026 年 3 月 12 日，十四届全国人大四次会议表决通过了关于（ ）的决议。","options":{"A":"《中华人民共和国国民经济和社会发展第十四个五年规划和 2035 年远景目标纲要》","B":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》","C":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》","D":"2026 年国民经济和社会发展计划"},"explanation":"2026 年 3 月 12 日，十四届全国人大四次会议表决通过关于国民经济和社会发展第\n\n十五个五年规划纲要的决议。“十五五”规划纲要共 7 万余字、18 篇 62 章，从党的二十届\n\n四中全会审议通过规划建议，到全国人大审查批准规划纲要，党的主张通过法定程序转化为\n\n国家意志。","clips":[]},{"n":42,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国宪法》的规定，中国人民政治协商会议是（ ）。","options":{"A":"国家权力机关","B":"中国共产党领导的多党合作和政治协商制度的重要组织形式","C":"国家行政机关","D":"国家司法机关"},"explanation":"宪法序言明确规定“中国共产党领导的多党合作和政治协商制度将长期存在和发展”，\n\n中国人民政治协商会议是这一制度的重要组织形式，发挥统一战线作用，在政治协商、民主\n\n监督、参政议政中具有重要功能。A 项错误，中国人民政治协商会议不是国家权力机关；C\n\n项错误，人民政协不是国家行政机关；D 项错误，人民政协不是国家司法机关。人民政协是\n\n中国共产党领导的多党合作和政治协商制度的重要组织形式，发挥统一战线作用。","clips":[]},{"n":43,"kind":"单项选择题","answer":"A","stem":"根据《中华人民共和国宪法》的规定，国有经济（全民所有制经济）在国民经济中的地位是（ ）。","options":{"A":"主导力量","B":"基础","C":"主体","D":"重要组成部分"},"explanation":"国有经济（全民所有制）是国民经济中的主导力量，国家保障国有经济的巩固和发\n\n展（第 7 条）。","clips":[]},{"n":44,"kind":"单项选择题","answer":"A","stem":"根据《中华人民共和国宪法》序言的规定，我国的历史使命是（ ）。","options":{"A":"实现中华民族伟大复兴","B":"全面建成小康社会","C":"实现现代化","D":"构建人类命运共同体"},"explanation":"宪法序言指出：把我国建设成为富强民主文明和谐美丽的社会主义现代化强国，实\n\n现中华民族伟大复兴。历史使命：实现中华民族伟大复兴。选项辨析：B 项错误，全面建成\n\n小康社会是阶段性发展目标；C 项错误，实现四个现代化是实现历史使命的具体路径和内容\n\n之一；D 项错误，构建人类命运共同体是对外交关系的描述。","clips":[]},{"n":45,"kind":"单项选择题","answer":"A","stem":"我国宪法规定，任何公民，非经人民检察院批准或者决定或者人民法院决定，并由（ ）执行，不受逮捕。","options":{"A":"公安机关","B":"所在地人民政府","C":"人民检察院","D":"人民法院"},"explanation":"任何公民，非经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，\n\n不受逮捕。","clips":[]},{"n":46,"kind":"单项选择题","answer":"B","stem":"《旅游法》共设 10 章 112 条，其中第（ ）章规定了旅游经营。","options":{"A":"5","B":"4","C":"3","D":"2"},"explanation":"《旅游法》共设 10 章 112 条，分为总则、旅游者、旅游规划和促进、旅游经营、旅\n\n游服务合同、旅游安全、旅游监督管理、旅游纠纷处理、法律责任、附则。","clips":[]},{"n":47,"kind":"单项选择题","answer":"D","stem":"根据《旅游法》的规定，利用公共资源建设的景区，不得通过增加另行收费项目等方式变相涨价；另行收费项目已收回投资成本的，（ ）。","options":{"A":"应当在涨价之前举行听证会","B":"应当实行政府定价","C":"应当免费开放","D":"应当相应降低价格或者取消收费"},"explanation":"《旅游法》第 43 条，利用公共资源建设的景区，不得通过增加另行收费项目等方式\n\n变相涨价；另行收费项目已收回投资成本的，应当相应降低价格或者取消收费。","clips":[]},{"n":48,"kind":"单项选择题","answer":"B","stem":"根据《旅游法》的规定，旅行社依照本法规定将包价旅游合同中的接待业务委托给地接社履行的，应当在包价旅游合同中载明（ ）的基本信息。","options":{"A":"委托社","B":"地接社","C":"委托社和地接社","D":"委托社或地接社"},"explanation":"《旅游法》第 60 条第 2 款规定：“旅行社依照本法规定将包价旅游合同中的接待业\n\n务委托给地接社履行，应当在包价旅游合同中载明地接社的基本信息。”因此，仅需载明地\n\n接社信息，而非委托社或两者皆载，故 B 项正确。","clips":[]},{"n":49,"kind":"单项选择题","answer":"B","stem":"根据《旅游法》的规定，旅游行程中解除合同的，旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程费用由（ ）承担。","options":{"A":"旅游者","B":"旅行社","C":"履约辅助人","D":"旅行社或者履行辅助人"},"explanation":"《旅游法》第 68 条规定：“旅游行程中解除合同的，旅行社应当协助旅游者返回出\n\n发地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程\n\n费用由旅行社承担。”因此，B 项正确。旅游者只与旅行社有合同关系，因此即使履行辅助\n\n人（如地接社、酒店、车队）有过错，也应先由旅行社对外承担返程费用，再向辅助人追偿。","clips":[]},{"n":50,"kind":"单项选择题","answer":"C","stem":"依法负担被监护人抚养费、赡养费、扶养费的父母、子女、配偶等，在被人民法院撤销监护人资格后，关于其应当如何履行相关义务的说法，正确的是（ ）。","options":{"A":"无需再履行任何义务","B":"只需在被监护人提出要求时履行","C":"应当继续履行负担的义务","D":"可以选择性地履行部分义务"},"explanation":"《民法典》第 37 条规定，依法负担被监护人抚养费、赡养费、扶养费的父母、子女、\n\n配偶等，被人民法院撤销监护人资格后，应当继续履行负担的义务。","clips":[]},{"n":51,"kind":"单项选择题","answer":"B","stem":"根据《民法典》的规定，下列关于委托合同的说法，正确的是（ ）。","options":{"A":"委托人无法概括委托受托人处理一切事务","B":"委托人可以委托受托人处理多项事务","C":"委托人应当预付处理委托事务的费用，不得要求受托人为处理委托事务垫付费用","D":"受托人在处理委托事务时可以转委托，但需要及时告知委托人"},"explanation":"《民法典》第 920 条规定，委托人可以特别委托受托人处理一项或者数项事务，也\n\n可以概括委托受托人处理一切事务。第 921 条委托人应当预付处理委托事务的费用。受托人\n\n为处理委托事务垫付的必要费用，委托人应当偿还该费用并支付利息。第 923 条受托人应当\n\n亲自处理委托事务。经委托人同意，受托人可以转委托。","clips":[]},{"n":52,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，以下关于自甘风险的说法，正确的是（ ）。","options":{"A":"参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任","B":"自甘风险参加的文体活动，因其他参加者的行为受到损害的，受害人可以请求其他参加者承担侵权责任","C":"自甘风险参加的文体活动，因其他参加者的故意行为受到损害的，受害人可以请求其他参加者承担侵权责任","D":"自甘风险参加的文体活动，因其他参加者的过失受到损害的，受害人可以请求其他参加者承担侵权责任"},"explanation":"《民法典》第 1176 条，自愿参加具有一定风险的文体活动，因其他参加者的行为受\n\n到损害的，受害人不得请求其他参加者承担侵权责任；但是，其他参加者对损害的发生有故\n\n意或者重大过失的除外。","clips":[]},{"n":53,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，下列关于民事行为能力的说法，正确的是（ ）。","options":{"A":"6 周岁以上的未成年人为限制民事行为能力人","B":"14 周岁以上的未成年人可以视为完全民事行为能力人","C":"不满 8 周岁的未成年人为无民事行为能力人","D":"16 周岁以上，以自己的收入作为主要生活来源为完全民事行为能力人"},"explanation":"A 项错误：6 周岁以上的未成年人为限制民事行为能力人。法律规定的限制民事行为\n\n能力人最低年龄是 8 周岁，不是 6 周岁。6 周岁以下属于无民事行为能力人。B 项错误：14\n\n周岁以上的未成年人可以视为完全民事行为能力人。“视为完全民事行为能力人”需要同时\n\n满足两个条件：1.年满 16 周岁；2.以自己的劳动收入为主要生活来源。14 周岁不满足年龄\n\n条件，也不能“视为完全”。C 项正确：不满 8 周岁的未成年人为无民事行为能力人。完全\n\n符合《民法典》第 20 条规定：不满 8 周岁的未成年人为无民事行为能力人。D 项错误：1.\n\n年满 16 周岁；2.以自己的劳动收入为主要生活来源。仅“视为”完全民事行为能力人。","clips":[]},{"n":54,"kind":"单项选择题","answer":"A","stem":"根据《民法典》的规定，下列民事法律行为无效的是（ ）。","options":{"A":"以虚假的意思表示实施的民事法律行为","B":"基于重大误解实施的民事法律行为","C":"以胁迫手段，使对方在违背真实意思的情况下实施的民事法律行为","D":"成立时显失公平的民事法律行为"},"explanation":"A 项正确：《民法典》第 146 条第 1 款规定：“行为人与相对人以虚假的意思表示实\n\n施的民事法律行为无效。”这是明确的无效事由。","clips":[]},{"n":55,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，以下关于合同转让和转移的说法，正确的是（ ）。","options":{"A":"合同的转让是合同内容的变更，合同的主体并不发生变化","B":"债务人将合同的义务全部或者部分转移给第三人的，应当通知债权人","C":"当事人一方经对方同意，可以将自己在合同中的权利和义务一并移转给第三人","D":"法人合并的，其权利和义务由原法人享有和承担"},"explanation":"《民法典》第 555 条规定：“当事人一方经对方同意，可以将自己在合同中的权利和\n\n义务一并转让给第三人。”故 C 项正确。","clips":[]},{"n":56,"kind":"单项选择题","answer":"C","stem":"根据《旅行社条例》及《旅游法》的规定，申请设立旅行社时，申请者如果租用营业用房的，租期应不少于（ ）。","options":{"A":"一个月","B":"三个月","C":"一年","D":"两年"},"explanation":"根据《旅行社条例》及《旅游法》规定，申请设立旅行社申请者拥有产权的营业用\n\n房，或者申请者租用的、租期不少于 1 年的营业用房。","clips":[]},{"n":57,"kind":"单项选择题","answer":"B","stem":"《旅游法》规定，旅游行程中解除合同的，旅行社应当协助旅游者返回出发地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程费用由（ ）。","options":{"A":"旅游者承担","B":"旅行社承担","C":"双方分担","D":"旅游者和旅行社协商承担"},"explanation":"《旅游法》第 68 条规定，旅游行程中解除合同的，旅行社应当协助旅游者返回出发\n\n地或者旅游者指定的合理地点。由于旅行社或者履行辅助人的原因导致合同解除的，返程费\n\n用由旅行社承担。","clips":[]},{"n":58,"kind":"单项选择题","answer":"D","stem":"在线旅游经营服务违法行为由实施违法行为的经营者住所地县级以上文化和旅游主管部门管辖。不能确定经营者住所地的，由经营者注册登记地或者备案地、（ ）县级以上文化和旅游主管部门管辖。","options":{"A":"损害行为发生地","B":"被投诉人所在地","C":"旅游合同签订地","D":"旅游合同履行地"},"explanation":"《在线旅游经营服务管理暂行规定》第 25 条规定，在线旅游经营服务违法行为由实\n\n施违法行为的经营者住所地县级以上文化和旅游主管部门管辖。不能确定经营者住所地的，\n\n由经营者注册登记地或者备案地、旅游合同履行地县级以上文化和旅游主管部门管辖。","clips":[]},{"n":59,"kind":"单项选择题","answer":"C","stem":"《文化和旅游市场信用管理规定》规定，旅行社因侵犯旅游者合法权益受到罚款以上行政处罚而被认定为严重失信主体的，自处罚之日起（ ）内不得申请出境旅游业务。","options":{"A":"5 年","B":"3 年","C":"2 年","D":"1 年"},"explanation":"旅行社因侵犯旅游者合法权益受到罚款以上行政处罚而被认定为严重失信主体的，\n\n自处罚之日起 2 年内不得申请出境旅游业务。第 19 条规定，文化和旅游主管部门对旅游市\n\n场严重失信主体实施下列管理措施：①适当提高抽查比例和频次，纳入重点监管对象；②将\n\n失信信息提供给有关部门查询，供其在相关行政管理、公共服务、评优评先等活动中参考使\n\n用；③将失信信息提供给各类市场主体查询，供其在市场活动中参考使用；④旅行社因被吊\n\n销旅行社业务经营许可证而被认定为严重失信主体的，其主要负责人 5 年内不得担任任何旅\n\n行社的主要负责人；⑤导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关\n\n管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起\n\n3 年内不得重新申请导游证或者从事旅行社业务；⑥旅行社因侵犯旅游者合法权益受到罚款\n\n以上行政处罚而被认定为严重失信主体的，自处罚之日起 2 年内不得申请出境旅游业务；⑦\n\n法律、行政法规和党中央、国务院政策文件规定的其他管理措施。","clips":[]},{"n":60,"kind":"单项选择题","answer":"C","stem":"根据《旅行社服务质量赔偿标准》的规定，甲旅行社未经旅游者同意，擅自将旅游者与乙旅行社的旅游者拼团，并由乙旅行社组团，则甲旅行社应当向旅游者支付旅游费用总额（ ）的违约金。","options":{"A":"15%","B":"20%","C":"25%","D":"30%"},"explanation":"《旅行社服务质量赔偿标准》第 5 条规定：“未经旅游者签字确认，旅行社擅自将旅\n\n游者转团、拼团的，旅行社应当向旅游者支付旅游费用总额 25%的违约金。”C 项正确：擅自\n\n拼团属于严重违约行为，直接损害旅游者对原旅行社的信任和服务预期，故设定 25%的较高\n\n违约金以示惩戒。","clips":[]},{"n":61,"kind":"单项选择题","answer":"D","stem":"《导游管理办法》规定，我国领队管理由资格准入制改为（ ）管理制度，旅游主管部门不再对领队从业进行行政审批。","options":{"A":"注册","B":"登记","C":"资格审查","D":"备案"},"explanation":"《导游管理办法》第 25 条规定，具备领队条件的导游从事领队业务，不再实行资格\n\n审批，改为由旅行社将符合条件的领队信息通过全国旅游监管服务信息系统向旅游主管部门\n\n“备案”。这意味着旅游主管部门不再进行事前审批，转为事后监管，体现了“放管服”改\n\n革精神。D 项正确：“备案”是现行法定管理制度，由旅行社履行报备义务。","clips":[]},{"n":62,"kind":"单项选择题","answer":"C","stem":"根据《导游管理办法》的规定，导游申请变更导游证信息，应当在变更发生的（ ）个工作日内，通过全国旅游监管服务信息系统提交相应材料。","options":{"A":"3","B":"5","C":"10","D":"15"},"explanation":"《导游管理办法》第 15 条第 1 款规定：“导游应当自下列情形发生之日起 10 个工作\n\n日内，通过全国旅游监管服务信息系统提交相应材料，申请变更导游证信息。”这是法定时\n\n限，逾期可能影响执业。C 项正确：完全符合“10 个工作日内”的法律规定。","clips":[]},{"n":63,"kind":"单项选择题","answer":"C","stem":"根据《导游管理办法》的规定，下列情形中，不得颁发导游证的是（ ）。","options":{"A":"因过失犯罪受过刑事处罚，且刑罚执行完毕未满 3 年的","B":"患有高血压","C":"被吊销导游证之日起未满 2 年的","D":"考取导游资格证的 17 岁公民，以自己的收入作为主要生活来源"},"explanation":"根据《导游管理办法》第 12 条规定，具有下列情形的，不予核发导游证：(1)无民\n\n事行为能力或者限制民事行为能力的；(2)患有甲类、乙类以及其他可能危害旅游者人身健\n\n康安全的传染性疾病的；(3)受过刑事处罚的，过失犯罪的除外；(4)被吊销导游证之日起未\n\n逾 3 年的。A 项过失犯罪，法律明确排除，可以发证。B 项高血压不属于传染性疾病，可以\n\n发证。C 项吊销导游证未满 2 年，属于法定不予发证情形，正确；D 项 17 周岁，以自己劳动\n\n收入为主要生活来源，《民法典》视为完全民事行为能力人，可以发证。","clips":[]},{"n":64,"kind":"单项选择题","answer":"B","stem":"《导游人员管理条例》规定，导游进行导游活动，（ ）的，由旅游行政部门责令改正，处 1000 元以上 3 万元以下的罚款；有违法所得的，并处没收违法所得。","options":{"A":"有损害国家利益和民族尊严的言行","B":"向旅游者兜售物品","C":"擅自变更接待计划","D":"未作明确说明和警示"},"explanation":"《导游人员管理条例》第 23 条，导游人员进行导游活动，向旅游者兜售物品、由旅\n\n游行政部门责令改正，处 1000 元以上 3 万元以下的罚款；有违法所得的，并处没收违法所\n\n得；情节严重的，由省、自治区、直辖市人民政府旅游行政部门吊销导游证并予以公告。","clips":[]},{"n":65,"kind":"单项选择题","answer":"D","stem":"经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权依法退货，经营者应当依法返还消费者支付的商品价款。如果退回的商品存在质量问题，则退回商品的运费由（ ）承担。","options":{"A":"经营者与消费者分担","B":"经营者或消费者承担","C":"消费者承担","D":"经营者承担"},"explanation":"《消费者权益保护法》第 25 条经营者采用网络、电视、电话、邮购等方式销售商品，\n\n消费者有权自收到商品之日起 7 日内退货，且无需说明理由，但下列商品除外：(1)消费者\n\n定作的；(2)鲜活易腐的；(3)在线下载或者消费者拆封的音像制品、计算机软件等数字化商\n\n品；(4)交付的报纸、期刊。消费者退货的商品应当完好。经营者应当自收到退回商品之日\n\n起 7 日内返还消费者支付的商品价款。退回商品的运费由消费者承担；经营者和消费者另有\n\n约定的，按照约定。本题题干说明“存在质量问题”，存在质量问题的话由经营者承担退回\n\n运费。做题时可结合生活实际进行。","clips":[]},{"n":66,"kind":"单项选择题","answer":"C","stem":"根据《治安管理处罚法》的规定，以下属于扰乱公共秩序的行为是（ ）。","options":{"A":"公共场所违反安全规定拒不改正","B":"在使用中的航空器上使用可能影响导航系统正常功能的工具，不听劝阻","C":"非法强登机动车，影响交通工具正常行驶的","D":"在铁路线路上放置障碍物或者故意向列车投掷物品"},"explanation":"根据《治安管理处罚法》的规定，其余三项属于“妨害公共安全的行为”。","clips":[]},{"n":67,"kind":"单项选择题","answer":"B","stem":"根据《旅游投诉处理办法》第 16 条的规定，对于情况复杂的投诉，被投诉人应当在接到通知之日起（ ）个工作日以内作出书面答复，提出事实、理由和答辩意见。","options":{"A":"3","B":"5","C":"7","D":"10"},"explanation":"《旅游投诉处理办法》第 16 条规定：“旅游投诉处理机构受理旅游投诉后，应当按\n\n照以下方式进行处理：(一)对于事实清楚的，应当立即调解并记录情况；(二)对于情况复杂\n\n的，应当填写《旅游投诉处理通知书》，与有关投诉材料副本一并送达被投诉人；被投诉人\n\n应当在接到通知之日起五个工作日以内作出书面答复，提出事实、理由和答辩意见。”","clips":[]},{"n":68,"kind":"单项选择题","answer":"B","stem":"《旅游投诉处理办法》规定，投诉人（ ）人以上，以同一事由投诉同一被投诉人的，为共同投诉。","options":{"A":"2 人","B":"4 人","C":"5 人","D":"10 人"},"explanation":"《旅游投诉处理办法》第 14 条规定，投诉人 4 人以上，以同一事由投诉同一被投诉\n\n人的，为共同投诉。","clips":[]},{"n":69,"kind":"单项选择题","answer":"A","stem":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，下列属于旅游经营者、旅游辅助服务者不予免责情形的是（ ）。","options":{"A":"旅游者自行安排旅游活动期间旅行社未做必要提示","B":"旅游者未履行如实告知义务的","C":"因不可抗力等客观原因导致旅游合同无法履行的","D":"旅游者擅自脱团的"},"explanation":"《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》第 19 条规定，旅\n\n游者在自行安排活动期间遭受人身损害、财产损失，旅游经营者未尽到必要的提示义务、救\n\n助义务，旅游者请求旅游经营者承担相应责任的，人民法院应予支持。","clips":[]},{"n":70,"kind":"单项选择题","answer":"B","stem":"旅游投诉的主体是（ ）。","options":{"A":"景区","B":"旅游者","C":"旅行社","D":"旅游行政管理机关"},"explanation":"旅游投诉的主体只能是旅游者。","clips":[]},{"n":71,"kind":"单项选择题","answer":"D","stem":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安全隐患的，应当（ ）。","options":{"A":"向有关部门投诉","B":"要求其承担相应责任","C":"报告旅游行政管理部门","D":"予以制止或者更换"},"explanation":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安\n\n全隐患的，应当予以制止或者更换。","clips":[]},{"n":72,"kind":"单项选择题","answer":"A","stem":"《旅游安全管理办法》规定，（ ）应当承担旅游安全的主体责任，加强安全管理，建立、健全安全管理制度，关注安全风险预警和提示，妥善应对旅游突发事件。","options":{"A":"旅游经营者","B":"旅游主管部门","C":"县级以上人民政府","D":"国务院"},"explanation":"《旅游安全管理办法》第 4 条规定，旅游经营者应当承担旅游安全的主体责任，加\n\n强安全管理，建立、健全安全管理制度，关注安全风险预警和提示，妥善应对旅游突发事件。","clips":[]},{"n":73,"kind":"单项选择题","answer":"B","stem":"依据《突发事件应对法》的规定，自然灾害、事故灾难或者公共卫生事件发生后，履行统一领导职责的人民政府可以采取下列应急处置措施（ ）。","options":{"A":"限制有关公共场所内的活动","B":"立即抢修被损坏的交通供热等公共设施","C":"加强对易受冲击的核心机关和单位的警卫","D":"对特定区域内的建筑物、交通工具等供应进行控制"},"explanation":"其余三项属于社会安全事件的应急处置措施。","clips":[]},{"n":74,"kind":"单项选择题","answer":"C","stem":"旅行社责任保险的赔偿责任承担者、被保险人和受益人分别是（ ）。","options":{"A":"旅行社、旅行社、旅行社","B":"保险公司、旅行社、旅游者","C":"保险公司、旅行社、旅行社","D":"旅行社、旅行社、旅游者"},"explanation":"旅行社责任保险主要包含以下 4 个特征：属于强制保险；是财产保险；投保人和被\n\n保险人是旅行社；保险人是保险公司，赔偿的承担者是承保的保险公司。","clips":[]},{"n":75,"kind":"单项选择题","answer":"A","stem":"根据《中华人民共和国民用航空法》的规定，承运人承认货物已经遗失，或者货物在应当到达之日起（ ）日后仍未到达的，收货人有权依据航空货物运输合同向承运人主张权利。","options":{"A":"7","B":"14","C":"21","D":"30"},"explanation":"第 124 条，承运人承认货物已经遗失，或者货物在应当到达之日起七日后仍未到达\n\n的，收货人有权依据航空货物运输合同向承运人主张权利。A 项正确，该期限为 7 日。B 项\n\n错误，14 日是货物发生损失后提出书面异议的期限。C 项错误，21 日是托运行李或者货物\n\n发生延误后提出异议的期限。D 项错误，30 日不符合法律规定。","clips":[]},{"n":76,"kind":"单项选择题","answer":"C","stem":"根据《出境入境管理法》的规定，冒用他人护照出境入境，情节严重的，（ ）。","options":{"A":"处 5 日以上 10 日以下拘留，可以并处 1000 元以上 5000 元以下罚款","B":"处 5 日以上 15 日以下拘留，可以并处 1000 元以上 5000 元以下罚款","C":"处 5 日以上 10 日以下拘留，可以并处 2000 元以上 1 万元以下罚款","D":"处 5 日以上 15 日以下拘留，可以并处 2000 元以上 1 万元以下罚款"},"explanation":"《出境入境管理法》第 71 条规定，有下列行为之一的，处 1000 元以上 5000 元以下\n\n罚款；情节严重的，处 5 日以上 10 日以下拘留，可以并处 2000 元以上 1 万元以下罚款：①\n\n持用伪造、变造、骗取的出境入境证件出境入境的；②冒用他人出境入境证件出境入境的；\n\n③逃避出境入境边防检查的；④以其他方式非法出境入境的。","clips":[]},{"n":77,"kind":"单项选择题","answer":"B","stem":"《娱乐场所管理条例》规定，娱乐场所改建、扩建营业场所或者变更场地、主要设施设备、投资人员，或者变更娱乐经营许可证载明的事项的，应当向原发证机关申请重新核发娱乐经营许可证，并向（ ）备案。","options":{"A":"人民政府","B":"公安部门","C":"市场监督管理部门","D":"文化主管部门"},"explanation":"本题考查娱乐场所重大变更后的备案机关。B 项正确：《娱乐场所管理条例》第 12\n\n条规定：“娱乐场所改建、扩建营业场所或者变更场地、主要设施设备、投资人员，或者变\n\n更娱乐经营许可证载明的事项的，应当向原发证机关申请重新核发娱乐经营许可证，并向公\n\n安部门备案；需要办理变更登记的，应当依法向工商行政管理部门办理变更登记。”变更涉\n\n及场所结构、人员、设备等，可能影响治安与消防，故须向公安报备。","clips":[]},{"n":78,"kind":"单项选择题","answer":"B","stem":"依据《娱乐场所管理办法》的规定，娱乐场所设立申请公示期为（ ）。","options":{"A":"5 日","B":"10 日","C":"15 日","D":"20 日"},"explanation":"本题考查娱乐场所设立的公示期限。B 项正确：《娱乐场所管理办法》第 12 条规定：\n\n“文化和旅游主管部门受理申请后，应当对设立场所的位置、周边环境、面积等进行实地检\n\n查。符合条件的，应当在设立场所、文化和旅游主管部门办公场所显著位置向社会公示 10\n\n日，并依法组织听证。”公示旨在听取周边利害关系人意见，保障公众参与权。","clips":[]},{"n":79,"kind":"单项选择题","answer":"A","stem":"根据《风景名胜区条例》的规定，在景物、设施上刻划、涂污或者乱扔垃圾的，条例规定的罚款金额为（ ）。","options":{"A":"50 元","B":"100 元","C":"500 元","D":"1000 元"},"explanation":"《风景名胜区条例》第四十四条：违反本条例的规定，在景物、设施上刻划、涂污\n\n或者在风景名胜区内乱扔垃圾的，由风景名胜区管理机构责令恢复原状或者采取其他补救措\n\n施，处 50 元的罚款；刻划、涂污或者以其他方式故意损坏国家保护的文物、名胜古迹的，\n\n按照治安管理处罚法的有关规定予以处罚；构成犯罪的，依法追究刑事责任。A 项正确，符\n\n合条例第四十四条处 50 元罚款的规定。B 项错误，100 元属于干扰数值，条例对该行为没有\n\n此处罚标准。C 项错误，500 元没有本条法律依据。D 项错误，1000 元是个人开荒、修坟立\n\n碑行为的处罚下限，依据条例第四十三条。","clips":[]},{"n":80,"kind":"单项选择题","answer":"B","stem":"博物馆举办陈列展览的，应当在陈列展览开始之日（ ）个工作日前，将陈列展览主题、展品说明、讲解词等向陈列展览举办地的文物主管部门或者其他有关部门备案。","options":{"A":"5","B":"10","C":"15","D":"30"},"explanation":"《博物馆条例》第 31 条规定，博物馆举办陈列展览的，应当在陈列展览开始之日\n\n10 个工作日前，将陈列展览主题、展品说明、讲解词等向陈列展览举办地的文物主管部门\n\n或者其他有关部门备案。","clips":[]},{"n":81,"kind":"单项选择题","answer":"A","stem":"不可移动文物根据（ ），可以分为全国重点、省级、市县级文物保护单位。","options":{"A":"历史、艺术和科学价值","B":"历史、艺术和文化价值","C":"观赏、文化和科学价值","D":"观赏、文化和历史价值"},"explanation":"《文物保护法》第 3 条规定，古文化遗址、古墓葬、古建筑、石窟寺、石刻、壁画、\n\n近代现代重要史迹和代表性建筑等不可移动文物，根据它们的历史、艺术、科学价值，可以\n\n分别确定为全国重点文物保护单位，省级文物保护单位，市、县级文物保护单位。","clips":[]},{"n":82,"kind":"单项选择题","answer":"C","stem":"中国特色社会主义最本质的特征是（ ）。","options":{"A":"人民民主专政","B":"坚持以人为本","C":"中国共产党领导","D":"集中统一领导"},"explanation":"全面加强党的领导，明确中国特色社会主义最本质的特征是中国共产党领导，中国\n\n特色社会主义制度的最大优势是中国共产党领导。","clips":[]},{"n":83,"kind":"单项选择题","answer":"C","stem":"依据习近平新时代中国特色社会主义思想相关理论，全面推进依法治国总目标是（ ）。","options":{"A":"推进国家治理体系和治理能力现代化","B":"完善以宪法为核心的社会主义道德规范体系","C":"建设中国特色社会主义法治体系、建设社会主义法治国家","D":"发展全过程人民民主，实现全体人民同步富裕"},"explanation":"明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法\n\n治国家。A 项错误，推进国家治理体系和治理能力现代化是全面深化改革总目标的组成部分，\n\n并非依法治国总目标。B 项错误，应当是完善以宪法为核心的中国特色社会主义法律体系，\n\n不是道德规范体系。C 项正确。D 项错误，要推动全体人民共同富裕，不是同步富裕，且不\n\n属于依法治国总目标。","clips":[]},{"n":84,"kind":"单项选择题","answer":"C","stem":"根据《英烈保护法》的规定，烈士纪念日是每年的（ ）。","options":{"A":"9 月 1 日","B":"9 月 15 日","C":"9 月 30 日","D":"10 月 30 日"},"explanation":"《英烈法》第 5 条规定，每年 9 月 30 日为烈士纪念日，国家在首都北京天安门广场\n\n人民英雄纪念碑前举行纪念仪式，缅怀英雄烈士。","clips":[]},{"n":85,"kind":"单项选择题","answer":"D","stem":"《港区国安法》规定，任何人组织、策划、实施或者参与实施（ ）之一的，不论是否使用武力或者以武力相威胁，即属犯分裂国家罪。","options":{"A":"以威胁旨在颠覆国家政权行为","B":"以武力旨在颠覆国家政权行为","C":"造成严重社会危害的恐怖活动","D":"旨在破坏国家统一行为"},"explanation":"《港区国安法》第 20 条对“分裂国家罪”的规定：任何人组织、策划、实施或者参\n\n与实施旨在分裂国家、破坏国家统一行为的，不论是否使用武力或者以武力相威胁，即属犯\n\n罪。","clips":[]},{"n":86,"kind":"单项选择题","answer":"B","stem":"坚持和完善社会主义基本经济制度，充分发挥（ ）在资源配置中的决定性作用。","options":{"A":"政府","B":"市场","C":"国家","D":"人民"},"explanation":"坚持市场主导。尊重人民首创精神，充分发挥市场在资源配置中的决定性作用。","clips":[]},{"n":87,"kind":"单项选择题","answer":"A","stem":"1974 年，经国务院批准，（ ）成立。","options":{"A":"中国旅行社","B":"中国国际旅行社","C":"中国青年旅行社","D":"华侨服务社"},"explanation":"1974 年 1 月 3 日：经国务院批准，中国旅行社成立，与华侨旅行社合署办公。","clips":[]},{"n":88,"kind":"单项选择题","answer":"B","stem":"地陪要注意游客安全，下列选项中说法正确的是（ ）。","options":{"A":"在景点导游讲解中，给游客留足自己活动的空间和时间","B":"地陪要与领队、全陪密切配合，随时清点人数","C":"为避免被盗窃，地陪要经常提醒游客把贵重物品拿出来清点","D":"地陪应提醒全陪时刻观察周围的环境和注意游客动向"},"explanation":"（1）观察环境与游客动向：在景点导游讲解中，地陪应时刻观察周围的环境和注意\n\n游客的动向。（2）清点人数（防走失）：为防止游客走失，地陪要与入境领队、全陪密切配\n\n合，随时清点人数。（3）提高警惕与安全提醒（防治安事件）：为防止游客发生意外事故，\n\n地陪还应注意和提醒游客在游览中提高警惕，防止小偷小摸等治安事件发生。","clips":[]},{"n":89,"kind":"单项选择题","answer":"A","stem":"旅行出现问题后，导游通过摆事实、讲道理、分清利弊得失，直至说服旅游者，这是（ ）的应用。","options":{"A":"正面引导法","B":"侧面迂回法","C":"间接暗示法","D":"替代方案法"},"explanation":"正面引导法：问题出现后，导游通过摆事实、讲道理、分清利弊得失，层层分析推\n\n进，直至说服旅游者。正面劝慰旅游者需要导游具备足够的耐心，善于从旅游者立场看待问\n\n题，同时配合旅行社做好因改变行程带来的一系列协调工作。","clips":[]},{"n":90,"kind":"单项选择题","answer":"A","stem":"在朱自清的《背影》中，作者通过使用“戴”“穿”“蹒跚走”等一系列动词，细腻地描绘出父爱，令人难以忘怀。这段描写是修辞生动性中（ ）的呈现。","options":{"A":"细节化","B":"情节化","C":"修辞化","D":"比拟化"},"explanation":"细节化：绘声绘色的语言能够让人有身临其境之感，将抽象的事物具体化，无形的\n\n事物有形化。要达到这一效果，导游需要善于运用动词来捕捉和放大细节。例如在朱自清的\n\n《背影》中，作者通过使用“戴”“穿”“蹒跚走”“探身”“攀”“缩”“微倾”等一系列动词，\n\n细腻地描绘出父亲穿过铁道、爬上月台的感人场景，父爱在文字中得到了生动地展现，令人\n\n难以忘怀。","clips":[]},{"n":91,"kind":"单项选择题","answer":"A","stem":"“这里的葡萄，一颗就有乒乓球那么大”，这是修辞方法中的（ ）手法的运用。","options":{"A":"夸张","B":"比拟","C":"比喻","D":"对比"},"explanation":"普通类夸张：又可细分为扩大夸张和缩小夸张。例如：“这里的葡萄，一颗就有乒乓\n\n球那么大”，通过扩大葡萄大小的夸张手法，生动形象地展现了当地葡萄的硕大，使游客在\n\n尚未亲身体验之前就能对当地葡萄的大小有深刻的了解。","clips":[]},{"n":92,"kind":"单项选择题","answer":"A","stem":"北京位于（ ）。","options":{"A":"东八区","B":"西八区","C":"东五区","D":"东九区"},"explanation":"北京位于东经 116°24′，划在东 8 区，该区的中央经线为东经 120°。","clips":[]},{"n":93,"kind":"单项选择题","answer":"D","stem":"托马斯·库克父子旅行社成立于（ ）。","options":{"A":"1841 年","B":"1845 年","C":"1846 年","D":"1865 年"},"explanation":"1865 年，旅行社的全球化发展更名为“托马斯·库克父子公司”，迁址至伦敦。","clips":[]},{"n":94,"kind":"单项选择题","answer":"C","stem":"1994 年，国家旅游局开始（ ）。","options":{"A":"组织导游资格证考试","B":"正式局成立","C":"开始将导游分为初级、中级、高级、特级四个等级","D":"开始允许中国公民自费出国旅行"},"explanation":"1994 年：国家旅游局设初级、中级、高级、特级四个等级。","clips":[]},{"n":95,"kind":"单项选择题","answer":"A","stem":"导游独立宣传和执行国家政策，独立执行旅游计划、组织活动，这是导游服务（ ）的特点体现。","options":{"A":"工作独立性强","B":"脑体高度结合","C":"客观情况复杂","D":"文化交流频繁"},"explanation":"独立性表现：独立宣传和执行国家政策；独立执行旅游计划、组织活动；独立、正\n\n确、及时处理问题。","clips":[]},{"n":96,"kind":"单项选择题","answer":"D","stem":"关于导游领队岗位的描述，内容正确的是（ ）。","options":{"A":"文化和旅游部对领队实行考试录取制","B":"领队在带领游客出境前，与旅行社签订临时劳动合同","C":"从事领队业务的人员，应当取得导游资格证","D":"旅行社委派的领队应当掌握相关旅游目的地国家语言或英语"},"explanation":"文化和旅游部对领队实行备案管理制。从事领队业务的人员，应当取得导游证，具\n\n有相应的学历、语言能力和旅游从业经历，并与委派其从事领队业务的取得出境旅游业务经\n\n营许可的旅行社订立劳动合同。旅行社委派的领队应当掌握相关旅游目的地国家（地区）语\n\n言或英语。","clips":[]},{"n":97,"kind":"单项选择题","answer":"B","stem":"中级、高级导游等级考核原则上采取笔试形式，每（ ）开展一次。","options":{"A":"1 年","B":"2 年","C":"3 年","D":"4 年"},"explanation":"中级、高级导游等级考核，原则上采取笔试形式，每 2 年开展一次。","clips":[]},{"n":98,"kind":"单项选择题","answer":"A","stem":"下列选项中，按照使用的语言划分的是（ ）。","options":{"A":"外语导游","B":"专职导游","C":"领队导游","D":"高级导游"},"explanation":"按照使用的语言划分，我国导游分为中文导游和外语导游。","clips":[]},{"n":99,"kind":"单项选择题","answer":"D","stem":"下列选项中，能够展示导游良好形象的内容是（ ）。","options":{"A":"带团头发被吹乱后，可以当众梳头，及时整理形象","B":"带团可以涂抹有色指甲油，但是不可以留长指甲","C":"带团女导游不可以化妆，更别说浓妆艳抹","D":"带团必要时可食用口香糖或茶叶来减少口腔异味"},"explanation":"头发清洁整齐：注意经常梳洗，不存有头屑，长短适宜，不梳怪异发型；头发被吹\n\n乱后，应及时梳理，但不可当众梳头，以免失礼；牙齿洁净：必要时可食用口香糖或茶叶来\n\n减少口腔异味；妆容适宜：女士为保持面容光泽，女士可施淡妆，但不要浓妆，不当众化妆\n\n或补妆；手部清洁：不涂抹有色指甲油。","clips":[]},{"n":100,"kind":"单项选择题","answer":"D","stem":"（ ）属于地陪导游熟悉接待计划的内容。","options":{"A":"核对日程安排","B":"与全陪联系","C":"了解不熟悉的参观旅游点","D":"了解旅游团成员基本情况"},"explanation":"熟悉接待计划：旅游团概况；旅游团成员基本情况；旅游线路和交通工具；交通票\n\n据。所以选择 D。","clips":[]},{"n":101,"kind":"单项选择题","answer":"B","stem":"关于导游旗的使用方法，正确的是（ ）。","options":{"A":"可以悬挂造型奇异的挂饰，以区别其他导游旗，引起游客注意","B":"使用导游旗时，应确保旗杆挺立，旗面位于旅游者易辨识的方位","C":"旅游团无论多少人都应该打导游旗带团","D":"暂不使用导游旗时，可以垫坐，但不能玩耍"},"explanation":"人流量大的景点，导游使用导游旗方便旅游者紧跟团队，避免走失；旅游者人数超\n\n过 10 人时应持导游旗，少于 10 人时可根据现场情况决定是否持旗；使用导游旗时，应确保\n\n旗杆挺立，旗面位于旅游者易辨识方位；暂不使用导游旗时，妥善放置，不应垫坐、玩耍等。","clips":[]},{"n":102,"kind":"单项选择题","answer":"A","stem":"地陪在面对入境领队或旅游者提出小的修改意见或增加新的游览项目时，应该（ ）。","options":{"A":"对“合理又可能”满足的项目，应予以安排","B":"对确有困难且无法满足的要求，婉转拒绝","C":"对需加收费用的项目，直接收取，并落实项目","D":"自己做决定是否同意，无需经过旅行社"},"explanation":"地陪应及时向旅行社反映；合理安排：对“合理又可能”满足的项目，应予以安排；\n\n费用说明：对需加收费用的项目，地陪要事先向入境领队（全陪）或旅游者讲明，按有关规\n\n定收取费用；对确有困难且无法满足的要求，地陪要详细解释、耐心说服。","clips":[],"sourceNote":"题面据解析卷补齐。"},{"n":103,"kind":"单项选择题","answer":"A","stem":"出境领队至少需提前（ ）抵达机场、车站、码头等出境口岸指定集合地点，等待游客集合出发。","options":{"A":"15 分钟","B":"45 分钟","C":"1 个小时","D":"2 个小时"},"explanation":"领队需至少提前 15 分钟抵达机场、车站、码头等出境口岸指定集合地点（行前说明\n\n会已通知）。","clips":[]},{"n":104,"kind":"单项选择题","answer":"B","stem":"游览区域对游客着装有要求的，导游领队应（ ）向游客说明，提醒准备。","options":{"A":"出发前","B":"提前一天","C":"抵达景点下车前","D":"进入景区后"},"explanation":"游览区域对游客着装有要求的（如教堂、寺庙、博物馆、皇宫等），导游领队应提前\n\n一天向游客说明，提醒准备。","clips":[]},{"n":105,"kind":"单项选择题","answer":"B","stem":"下列选项中，不属于全陪致欢迎词的内容是（ ）。","options":{"A":"代表组团社及个人向旅游者致欢迎词","B":"介绍行程涉及的下榻饭店、餐饮、游览景点等信息","C":"自我介绍、介绍地陪和司机","D":"对于入境团，需特别介绍中国概况"},"explanation":"全陪应代表组团社及个人向旅游者致欢迎词。热情的欢迎词有助于提升旅游者的满\n\n意度；欢迎词包括：问候语、欢迎语、介绍语（自我介绍、介绍地陪和司机）、恳请语（恳\n\n请大家支持、配合工作）、祝愿语；入境旅游者需特别介绍中国概况，涵盖历史、地理、文\n\n化、政治、经济、语言、民族、宗教等维度，借助数字技术讲好中国故事、传播中国声音。","clips":[]},{"n":106,"kind":"单项选择题","answer":"A","stem":"导游带团时，应采用（ ）的方法与游客交流。","options":{"A":"正视","B":"仰视","C":"俯视","D":"斜视"},"explanation":"与旅游者视线平齐，表理性、平等、坦诚，是导游目光语主要形式，体现平等友好\n\n相处诚意。","clips":[]},{"n":107,"kind":"单项选择题","answer":"C","stem":"在抗日战争纪念馆，导游讲述英雄事迹时，双手张开、微微颤抖，眼神坚定且充满敬意，这是导游运用的（ ）。","options":{"A":"象形手势语","B":"指示手势语","C":"情感手势语","D":"标准动作语"},"explanation":"导游表达讲解情感的手势语，用于表达强烈情感，感染力强。例如：在抗日战争纪\n\n念馆，导游讲述英雄事迹时，双手张开、微微颤抖，眼神坚定且充满敬意，示意当年战争的\n\n惨烈与英雄的伟大，让游客深刻感受到对先烈的崇敬之情。","clips":[]},{"n":108,"kind":"单项选择题","answer":"B","stem":"导游为突出或强调某些内容、加深旅游者印象而进行的停顿是（ ）。","options":{"A":"语法停顿","B":"逻辑停顿","C":"感情停顿","D":"生理停顿"},"explanation":"导游为突出或强调某些内容而进行的停顿，有助于加深旅游者印象，增强讲解的生\n\n动性。例如“秦始皇兵马俑是如何被偶然发现的呢？这一重大发现缘何被赞誉为世界第八大\n\n奇迹呢？”在这两个问句后，导游各做一次停顿，勾起旅游者好奇心，使其迫不及待地想要\n\n继续聆听下文。","clips":[]},{"n":109,"kind":"单项选择题","answer":"C","stem":"政务接待过程中，违反保密原则的选项是（ ）。","options":{"A":"不该看的不看","B":"不乱找人吐槽","C":"可以发朋友圈获赞","D":"不该问的不问"},"explanation":"导游在接待中要做到“四不”：不该看的不看，不该问的不问，不该听的不听，不该\n\n说的不说。不乱发朋友圈，不乱找人吐槽。","clips":[]},{"n":110,"kind":"单项选择题","answer":"D","stem":"对残疾人团队照顾恰当适宜的是（ ）。","options":{"A":"设法搞清楚残障原因","B":"多为残障游客拍照","C":"对残障者表现出重点关注","D":"提供帮助前，先征询残障旅游者意见"},"explanation":"提供帮助前，先征询残障旅游者意见，询问是否需要帮助及具体需求；不多问：相\n\n处过程中，避免表现得过于好奇。若残障旅游者未主动提及，导游不应擅自打听其残疾原因；\n\n未经同意，不可随意对残障旅游者拍照；勿对残障者表现出过分关注，尤其不应过度关注其\n\n残疾部位。","clips":[]},{"n":111,"kind":"单项选择题","answer":"A","stem":"关于游客特殊餐饮服务要求，导游处理正确的是（ ）。","options":{"A":"无论是事先约定，还是旅游者临时提出，导游都应积极想办法落实","B":"临时特殊餐饮需求，导游要立即上报旅行社等待指示","C":"明确告知旅游者新产生的餐费需自理，原餐费不退","D":"因主客观因素限制，无法满足的，导游婉转拒绝"},"explanation":"无论该特殊餐饮要求是旅游合同事先约定，还是旅游者临时提出，都应积极想办法\n\n落实，避免引发旅游者投诉；面对旅游者临时提出的特殊餐饮需求，导游应立刻联系餐馆，\n\n尽力安排；当导游已协助解决旅游者临时特殊餐饮需求时，要明确告知旅游者新产生的餐费\n\n需自理，原餐费则按照旅游合同的约定进行处理；如因主客观因素限制，暂时无法满足旅游\n\n者的特殊餐饮需求，导游要做好耐心细致的解释工作，争取旅游者的理解。","clips":[]},{"n":112,"kind":"单项选择题","answer":"C","stem":"旅游者要前往不健康的娱乐场所，导游操作正确的是（ ）。","options":{"A":"积极协助","B":"置身事外，不介入也不劝阻","C":"果断拒绝","D":"耐心劝阻"},"explanation":"果断拒绝并介绍中国的传统观念和道德风貌，严肃指出不健康的娱乐活动和不正常\n\n的夜生活在中国是明令禁止的，是违法行为，会受到法律的惩处。","clips":[]},{"n":113,"kind":"单项选择题","answer":"D","stem":"发生漏接事故以后，导游做法正确的是（ ）。","options":{"A":"应第一时间与全陪联系，争取尽快会面商量如何回复游客","B":"见面后，找到合适的理由，减少客人的投诉","C":"若因漏接导致旅游者产生额外费用，导游表示遗憾无法提供帮助","D":"通过提供热情周到的高质量服务，减轻漏接造成的不良影响"},"explanation":"知晓旅游者抵达后，导游应第一时间与其联系，争取尽快会面；见面后，导游首先\n\n需诚恳地向旅游者道歉，随后实事求是地说明情况，并力求获得旅游者的谅解；一方面，导\n\n游可通过提供热情周到的高质量服务，减轻漏接造成的不良影响；另一方面，若因漏接导致\n\n旅游者产生额外费用，导游应主动给予报销。如有必要，还可通过加菜、赠送本地特产等方\n\n式，给予旅游者物质补偿。","clips":[]},{"n":114,"kind":"单项选择题","answer":"C","stem":"当旅游者出现不当行为时，导游操作不当的是（ ）。","options":{"A":"发现不当行为，导游应立即制止，不回避、不躲闪","B":"严肃冷静地指出行为不当之处","C":"导游应立即汇报给旅行社","D":"如果事情性质严重，后果恶劣，要汇报给相关主管部门，配合调查"},"explanation":"发现不当行为，导游应立即制止，不回避、不躲闪；严肃冷静地指出行为不当之处，\n\n区分问题性质，提醒继续该行为的严重后果；若旅游者不听劝阻，导游应及时汇报给旅行社，\n\n并在协助下汇报给相关主管部门，配合调查。","clips":[]},{"n":115,"kind":"单项选择题","answer":"C","stem":"当旅游客车发生交通事故时，导游应该拨打（ ）报警。","options":{"A":"120","B":"119","C":"122","D":"110"},"explanation":"当旅游客车发生交通事故时，导游需冷静保护事故现场，避免其进一步破坏或污染，\n\n同时拨打或安排人员拨打 122 报警电话，待交警到达后，协助现场处置。","clips":[]},{"n":116,"kind":"单项选择题","answer":"C","stem":"当旅游者遭遇传染病疫情时，导游操作正确的是（ ）。","options":{"A":"第一时间向旅行社报告，不调整行程，争取将行程按计划走完","B":"经查旅游者确患传染病的，立即解除与旅行社合同关系","C":"如患者系外籍人士，我国令其提前出境的，协助患者办理相关离境手续","D":"如果有游客患病，请其自动离团，避免传染其她游客"},"explanation":"(1)立即暂停旅游活动，在第一时间向旅行社及其所在地、疫情发生地旅游主管部门\n\n报告，并及时向附近的疾病预防控制机构报告详细情况，配合开展旅游者防疫、安抚和宣传\n\n解释工作；(2)有关部门认为应对旅游者进行防疫检查的，立即将旅游者送至当地疾病预防\n\n控制机构或有关部门指定的其他场所；(3)经查旅游者确患传染病的，遵照当地有关疫情防\n\n控指引和要求，配合相关部门和单位做好旅游者隔离、密切接触者追踪或采取其他措施，并\n\n通知其亲属；(4)关注目的地疫情防控动态，宜根据疫情发展情况，按旅行社的安排，调整\n\n或变更旅游行程；(5)如患者系外籍人士，由我国公安机关令其提前出境的，协助患者办理\n\n相关离境手续。","clips":[]},{"n":117,"kind":"单项选择题","answer":"B","stem":"当旅游者在境内旅游期间遭遇自然灾害，导游操作正确的是（ ）。","options":{"A":"立即报警，在原地等待救援","B":"旅游者遭受人身损害的，引导旅游者开展自救和互救","C":"尽量不惊动旅行社，由导游个人独立处理","D":"稳定游客情绪，鼓励他们用意志克服困难，争取逃生"},"explanation":"及时报警并向旅行社报告，同时向旅游者预警，引导旅游者采取相应的安全防范措\n\n施，立刻带领旅游者撤离灾区；旅游者遭受人身损害的，根据现场的条件，引导旅游者开展\n\n自救和互救，防范二次伤害，等待救援；稳定旅游者情绪，及时将事件发生的时间、地点、\n\n原因、经过等情况报告旅行社和相关部门，取得指导和帮助。","clips":[]},{"n":118,"kind":"单项选择题","answer":"C","stem":"公务普通护照的发放对象是（ ）。","options":{"A":"我国党、政、军高级领导","B":"我国派驻国外的外交机构工作人员","C":"我国副县、副处级以下因公出国人员","D":"我国因私出国探亲、学习、就业的普通公民"},"explanation":"公务普通护照：发给我国各级政府部门副县、处级以下公务员和国有企事业单位因\n\n公出国人员等。","clips":[]},{"n":119,"kind":"单项选择题","answer":"C","stem":"我国的 L 字签证代表的是（ ）。","options":{"A":"外交签证","B":"礼遇签证","C":"旅游签证","D":"普通签证"},"explanation":"外国人来中国旅游时，需向中国驻外使、领馆申请旅游签证（L 字签证）。","clips":[]},{"n":120,"kind":"单项选择题","answer":"B","stem":"下列可以出境的物品有（ ）。","options":{"A":"伪造的货币及伪造的有价证券","B":"印刷品、胶卷、照片、唱片","C":"珍贵文物及其他禁止出境的文物","D":"带有危险性病菌、害虫及其他有害生物的动物"},"explanation":"列入禁止入境范围的所有物品；伪造的货币及伪造的有价证券；珍贵文物及其他禁\n\n止出境的文物；带有危险性病菌、害虫及其他有害生物的动物、植物及其产品。","clips":[]},{"n":121,"kind":"单项选择题","answer":"A","stem":"外国人出国携带金银限额标注正确的是（ ）。","options":{"A":"银质器皿 20 市两","B":"白银饰品 20 市两","C":"黄金饰品 2 市两","D":"黄金没有限额"},"explanation":"在境内的中国人、外国侨民和无国籍人出境定居，每人携带金银的限额为：黄金饰\n\n品 1 市两（31.25 克），白银饰品 10 市两（312.50 克），银质器皿 20 市两（625 克）。经海\n\n关查验符合规定限额的放行。","clips":[]},{"n":122,"kind":"单项选择题","answer":"C","stem":"东盟国家旅游团入境云南西双版纳免签时间为（ ）。","options":{"A":"24 小时","B":"72 小时","C":"144 小时","D":"240 小时"},"explanation":"东盟旅游团入境云南西双版纳免签：2025 年 2 月 10 日起，东盟国家持普通护照经\n\n我国境内旅行社组织接待，采取团进团出方式，可由西双版纳嘎洒国际机场口岸、磨憨铁路\n\n口岸、磨憨公路口岸免办签证入境出境，活动范围为云南省西双版纳傣族自治州行政区域，\n\n停留时间不超过 144 小时（6 天）。","clips":[]},{"n":123,"kind":"单项选择题","answer":"A","stem":"南方航空公司的标志是（ ）。","options":{"A":"木棉花与飞机尾翼","B":"凤凰","C":"飞翔的燕子","D":"三道 S"},"explanation":"南方航空：木棉花与飞机尾翼。","clips":[]},{"n":124,"kind":"单项选择题","answer":"B","stem":"不满两周岁但单独占座的孩子，其机票价格为（ ）。","options":{"A":"全价票","B":"全价票的 50%","C":"全价票的 20%","D":"成人正常票价的 10%"},"explanation":"不满两周岁应购买婴儿票，不单独占座；需占座则购买儿童票，儿童票基准价：全\n\n价票的 50%。","clips":[]},{"n":125,"kind":"单项选择题","answer":"D","stem":"下列对于动车组列车所有携带物品的尺寸描述，正确的是（ ）。","options":{"A":"每件物品长+宽+高之和≤160cm","B":"杆状物品≤200cm","C":"每件重量≤30kg","D":"所有物品尺寸均≤130cm"},"explanation":"普通列车：每件物品长+宽+高之和≤160cm·杆状物品≤200cm；动车组列车：所有\n\n物品尺寸均≤130cm·每件重量≤20kg。","clips":[]},{"n":126,"kind":"单项选择题","answer":"A","stem":"关于不宜登山人群，描述错误的一项是（ ）。","options":{"A":"青少年","B":"关节疾病者","C":"心脑血管疾病者","D":"体质衰弱的老年人"},"explanation":"不宜登山人群：登山属高强度耗氧运动，关节疾病患者、心脑血管疾病患者、体质\n\n衰弱的老年人及平时缺乏锻炼者均不宜前往高山景区。","clips":[]},{"n":127,"kind":"单项选择题","answer":"C","stem":"对于交通意外保险，描述正确的是（ ）。","options":{"A":"意外伤害保险范围，从持有效机票过安检到抵达目的港走出机场止","B":"廊桥和舷梯区域属于航空公司管理","C":"飞机中途停留、绕道飞行期间跟机行动的意外伤害，航空公司负责","D":"因民航延误旅客离机期间的意外伤害，航空公司负责"},"explanation":"航空旅客意外伤害保险期限起止：持有效机票过安检→抵达目的港走出航班舱门止\n\n（舷梯与廊桥区域除外）；飞机中途停留/绕道飞行期间跟机行动的意外伤害；因民航延误旅\n\n客离机期间的意外伤害。","clips":[]},{"n":128,"kind":"单项选择题","answer":"B","stem":"在饭店客房中比例最高、被大家称作“标准间”的是（ ）。","options":{"A":"单人间","B":"双床间","C":"大床间","D":"套房"},"explanation":"双床间：配备两张单人床，较受团体客人欢迎。由于在饭店客房中占比较高比例，\n\n也常被称为饭店的“标准间”。","clips":[]},{"n":129,"kind":"单项选择题","answer":"A","stem":"下列城市中，与北京一起看到日出的是（ ）。","options":{"A":"新加坡","B":"莫斯科","C":"夏威夷","D":"开普敦"},"explanation":"新加坡和北京一个时区，莫斯科比中国晚了 5 个小时，夏威夷比中国晚了 18 个小时，\n\n开普敦比中国晚了 6 个小时。","clips":[]},{"n":130,"kind":"单项选择题","answer":"B","stem":"1 升相当于（ ）英制加仑。","options":{"A":"0.5","B":"0.22","C":"1","D":"0.8"},"explanation":"1 升相当于 0.22 英制加仑。\n\n三、多选题","clips":[]},{"n":131,"kind":"多项选择题","answer":"CE","stem":"人民行使国家权力的机关是（ ）。","options":{"A":"全国人民政治协商会议","B":"地方各级人民政治协商会议","C":"全国人民代表大会","D":"中央及地方各级人民政府","E":"地方各级人民代表大会"},"explanation":"中华人民共和国的一切权力属于人民。人民行使国家权力的机关是全国人民代表大\n\n会和地方各级人民代表大会。","clips":[]},{"n":132,"kind":"多项选择题","answer":"BDE","stem":"根据《中华人民共和国宪法》关于财产保护制度的规定，下列说法正确的有（ ）。","options":{"A":"国家为了公共利益的需要，对公民私有财产征收或征用后应当给予赔偿","B":"社会主义公共财产神圣不可侵犯","C":"任何组织或者个人可以在合理范围内处置社会主义公共财产","D":"国家为了公共利益的需要，可以依法对土地实行征收或者征用并给予补偿","E":"国家为了公共利益的需要，可以依法对私有财产实行征收、征用并给予补偿"},"explanation":"《宪法》第 12 条规定，社会主义的公共财产神圣不可侵犯。国家保护社会主义的公\n\n共财产。禁止任何组织或者个人用任何手段侵占或者破坏国家的和集体的财产。《宪法》第\n\n10 条第 3 款规定，国家为了公共利益的需要，可以依照法律规定对土地实行征收或者征用\n\n并给予补偿。《宪法》第 13 条第 3 款规定，国家为了公共利益的需要，可以依照法律规定对\n\n公民的私有财产实行征收或者征用并给予补偿。选项辨析：A 错误：补偿适用于合法的征收、\n\n征用行为；赔偿针对国家机关违法行使职权造成损害的情形。宪法规定征收征用对应的是补\n\n偿而非赔偿，概念不能混淆。C 错误：《宪法》禁止任何组织或者个人侵占、破坏国家和集\n\n体公共财产，公共财产不允许组织或个人随意处置。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ABC","stem":"依据《中华人民共和国旅游法》，旅行社可以解除旅游服务合同的法定情形包括（ ）。","options":{"A":"患有传染性疾病、可能危害其他旅游者健康和安全的","B":"携带危害公共安全的物品且不同意交有关部门处理的","C":"从事违法或者违反社会公德活动的","D":"从事影响其他旅游者权益的活动，且不听劝阻、不能制止的","E":"法律、行政法规规定的其他情形"},"explanation":"《旅游法》第 66 条规定，旅游者有下列情形之一的，旅行社可以解除合同：①患有\n\n传染病等疾病，可能危害其他旅游者健康和安全的；②携带危害公共安全的物品且不同意交\n\n有关部门处理的；③从事违法或者违反社会公德的活动的；④从事严重影响其他旅游者权益\n\n的活动，且不听劝阻、不能制止的；⑤法律规定的其他情形。“从事影响其他旅游者权益的\n\n活动，且不听劝阻、不能制止的”应该是“严重”影响，表述不够完整。“法律、行政法规\n\n规定的其他情形”注意，是法律规定的其他情形。","clips":[]},{"n":134,"kind":"多项选择题","answer":"BD","stem":"旅游合同签订后，因目的地入境政策临时变更，导致某国际旅行社的出境旅游团无法成行。对此（ ）。","options":{"A":"旅行社应当承担违约责任，赔偿旅游者的各项损失","B":"旅行社不承担违约责任","C":"旅行社无权解除合同","D":"旅游者有权解除合同","E":"如果合同解除，组团社应该将旅游者未发生的费用退还"},"explanation":"《旅游法》第 67 条规定，因不可抗力或者旅行社、履行辅助人已尽合理注意义务仍\n\n不能避免的事件，影响旅游行程的，按照下列情形处理：(1)合同不能继续履行的，旅行社\n\n和旅游者均可以解除合同。合同不能完全履行的，旅行社经向旅游者作出说明，可以在合理\n\n范围内变更合同；旅游者不同意变更的，可以解除合同。(2)合同解除的，组团社应当在扣\n\n除已向地接社或者履行辅助人支付且不可退还的费用后，将余款退还旅游者；合同变更的，\n\n因此增加的费用由旅游者承担，减少的费用退还旅游者。","clips":[]},{"n":135,"kind":"多项选择题","answer":"AC","stem":"根据《民法典》的规定，提供格式条款一方（ ）的相应条款无效。","options":{"A":"不合理的减轻其责任","B":"加重对方责任","C":"排除对方主要权利","D":"限制对方主要权利","E":"免除其责任"},"explanation":"《民法典》第 497 条规定，有下列情形之一的，该格式条款无效：(1)具有本法第一\n\n编第六章第三节和本法第 506 条规定的无效情形；(2)提供格式条款一方不合理地免除或者\n\n减轻其责任、加重对方责任、限制对方主要权利；(3)提供格式条款一方排除对方主要权利。","clips":[]},{"n":136,"kind":"多项选择题","answer":"AE","stem":"根据《民法典》的规定，下列关于物件致人损害责任的说法，正确的是（ ）。","options":{"A":"建筑物、构筑物或者其他设施倒塌致人损害，由建设单位与施工单位承担连带责任","B":"抛掷物或坠物致人损害，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人或所有人给予补偿","C":"堆放物倒塌致人损害，堆放人不管有无过错，都应当承担侵权责任","D":"妨碍通行物致人损害，有关单位或者个人不能证明自己没有过错的，应当承担侵权责任","E":"林木折断致人损害，林木的所有人或者管理人不能证明自己没有过错的，应当承担侵权责任"},"explanation":"《民法典》第 1254 条，从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损\n\n害，难以确定具体侵权人的，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人\n\n给予补偿，所以“抛掷物或坠……”错误；第 1255 条，堆放物倒塌致人损害，堆放人不能\n\n证明自己没有过错的，应当承担侵权责任，所以“堆放物倒塌……”错误；第 1256 条，妨\n\n碍通行物致人损害，在公共道路上堆放、倾倒、遗撒妨碍通行的物品造成他人损害的，有关\n\n单位或者个人应当承担侵权责任，所以“妨碍通行物……”错误。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ABC","stem":"国内旅游因旅行社原因不能成行的，应提前 7 日（不含 7 日）通知旅游者，否则应向旅游者全额退还预付旅游费用，并向旅游者支付违约金。下列选项符合《旅行社服务质量赔偿标准》规定的是（ ）。","options":{"A":"出发前 3 日至 1 日，支付旅游费用总额 15%的违约金","B":"出发前 7 日（含 7 日）至 4 日，支付旅游费用总额 10%的违约金","C":"出发当日，支付旅游费用总额 20%的违约金","D":"出发当日，支付旅游费用总额 25%的违约金","E":"出发前 3 日至 1 日，支付旅游费用总额 20%的违约金"},"explanation":"国内旅游旅行社原因未能成行，应提前 7 天通知旅游者，当天通知：违约金是旅游\n\n费用总额的 20%，出发前 3 日至 1 日，出发前 7 日（含 7 日）至 4 日，分别按照 5%的差额递\n\n减。答题诀窍：掌握最大赔偿比例和递减规律。","clips":[]},{"n":138,"kind":"多项选择题","answer":"BC","stem":"《导游管理办法》规定，对（ ），所在地旅游主管部门应当撤销导游证。","options":{"A":"超过 3 个月未与任何旅行社订立劳动合同的","B":"申请人以欺骗、贿赂等不正当手段取得导游证的","C":"不具备申请资格或者不符合法定条件的申请人核发导游证的","D":"导游死亡的","E":"导游证有效期届满未申请换发导游证的"},"explanation":"有下列情形之一的，所在地旅游主管部门应当撤销导游证：(1)对不具备申请资格或\n\n者不符合法定条件的申请人核发导游证的；(2)申请人以欺骗、贿赂等不正当手段取得导游\n\n证的；(3)依法可以撤销导游证的其他情形。本题考查导游证“撤销”和“注销”的区别。\n\n总结如下：注销是自然而然发生的事情，比如“超过 3 个月未与任何旅行社订立劳动合同的”\n\n属于导游未能找到挂靠管理单位；“导游死亡的”是导游生命终结；“导游证有效期届满未申\n\n请换发导游证的”导游证因为到期而失效。这些情形无关对错，不涉及行政许可行为。而导\n\n游证“撤销”是旅游行政管理部门对行政许可行为的收回，这样的收回或者是申请人有错，\n\n或者是行政许可做出人有工作疏漏。","clips":[]},{"n":139,"kind":"多项选择题","answer":"BC","stem":"导游张某在带团时遭遇泥石流，情况紧急，但是张某不顾游客劝阻，也未向相关部门履行报告义务，执意继续前往旅游目的地。依据《导游管理办法》，由县级以上旅游主管部门对张某（ ）。","options":{"A":"没收违法所得","B":"并可以处 1000 元以下罚款","C":"责令改正","D":"暂扣或吊销导游证","E":"情节严重的，处 1000 元以上 5000 元以下罚款"},"explanation":"《导游管理办法》第 33 条规定，违反本办法规定，不依照本办法第 24 条规定采取\n\n相应措施的，由县级以上旅游主管部门责令改正，并可以处 1000 元以下罚款；情节严重的，\n\n可以处 1000 元以上 5000 元以下罚款。注意选项“情节严重的……”，是“可以处”。","clips":[]},{"n":140,"kind":"多项选择题","answer":"AC","stem":"根据《治安管理处罚法》正当防卫的规定，下列说法正确的有（ ）。","options":{"A":"为免受正在进行的不法侵害而采取的制止行为，造成损害的，不属于违反治安管理行为，不予处罚","B":"制止行为明显超过必要限度，造成较大损害的，依法给予处罚","C":"制止行为明显超过必要限度，情节较轻的，不予处罚","D":"治安案件中的防卫行为，适用刑法有关正当防卫的规定，不适用治安管理处罚法专门条款","E":"对于双方发生肢体冲突的案件，一般应当认定为互殴，不能认定正当防卫"},"explanation":"A 正确，符合新法第 19 条第一款。B 错误，防卫过当造成较大损害，应当处罚且“应\n\n当减轻”。C 正确，防卫过当、情节较轻，不予处罚。D 错误，新法区分互殴与正当防卫，不\n\n是一般都认定互殴，一方遭受不法侵害实施制止的，仍可成立正当防卫。E 错误，新《治安\n\n管理处罚法》专门设置正当防卫条款，治安案件优先适用本法本条规定，而非直接适用刑法\n\n正当防卫。","clips":[],"sourceNote":"试卷与解析的选项顺序不同，本题采用解析卷顺序。"},{"n":141,"kind":"多项选择题","answer":"ACD","stem":"依据《旅游投诉处理办法》，旅游投诉处理机构不予受理的情形有（ ）。","options":{"A":"人民法院已经受理的","B":"超过旅游合同签订之日起 90 天的","C":"投诉人与被投诉事项没有直接利害关系的","D":"旅游经营者认为旅游者在旅游过程中严重侵害其合法权益","E":"旅游投诉处理机构已经做出处理，但又出现新情况的"},"explanation":"《旅游投诉处理办法》第九条旅游投诉应当符合下列条件：（一）投诉人与投诉事项\n\n有直接利害关系；（二）有明确的被投诉人、具体的投诉请求。第十一条旅游投诉有下列情\n\n形之一的，不予受理：（一）不属于旅游投诉处理机构管辖范围的；（二）超过旅游合同履行\n\n期限届满之日九十日的；（三）人民法院、仲裁机构、其他行政管理部门、消费者组织或者\n\n人民调解组织等机构已经受理或者处理的；（四）旅游投诉处理机构已经作出处理，且没有\n\n新情况、新理由的；（五）不符合本办法第九条规定的受理条件的；（六）本办法规定情形之\n\n外的经济纠纷、劳动人事纠纷等其他纠纷。A 项正确，人民法院已经受理的，属于第十一条\n\n明确的不予受理情形。B 项错误，法定期限起算点是旅游合同履行期限届满之日，不是合同\n\n签订之日，该表述错误，不属于不予受理情形。C 项正确，投诉人与投诉事项没有直接利害\n\n关系，不满足第九条规定的受理条件，不予受理。D 项正确，旅游投诉的投诉人仅限旅游者，\n\n旅游经营者不能作为投诉人提起旅游投诉，该情形不予受理。E 项错误，已经作出处理，但\n\n出现新情况的，不属于不予受理情形；只有无新情况、新理由再次投诉才不予受理。","clips":[]},{"n":142,"kind":"多项选择题","answer":"BCD","stem":"依据《旅游安全管理办法》，旅游目的地安全风险提示级别为二级风险的，旅行社应当采取的措施包括（ ）。","options":{"A":"组织已在风险区域的旅游者撤离","B":"停止组团或者带团前往风险区域","C":"已在风险区域的，调整行程","D":"已在风险区域的，中止行程","E":"加强对旅游者的提示"},"explanation":"《旅游安全管理办法》第 18 条规定风险提示发布后的应对措施：四级风险：加强对\n\n旅游者的提示；三级风险：采取必要的安全防范措施；二级风险：停止组团或者带团前往风\n\n险区域；已在风险区域的，调整或者中止行程；一级风险：停止组团或者带团前往风险区域，\n\n组织已在风险区域的旅游者撤离。B 项正确：二级风险要求“停止组团或带团前往”。CD 项\n\n正确：已在风险区域的，应“调整或中止行程”。A 项错误：“组织撤离”是一级风险措施。\n\n二级风险尚未达到必须撤离的程度。E 项错误：“加强提示”是四级风险最低级别措施。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABCE","stem":"违反《中华人民共和国食品安全法》规定，县级以上人民政府有（ ）行为的，对直接负责的主管人员和其他直接责任人员给予记大过处分。","options":{"A":"缓报食品安全事故","B":"本行政区域内发生特别重大食品安全事故","C":"谎报食品安全事故","D":"本行政区域内连续发生较大食品安全事故","E":"瞒报食品安全事故"},"explanation":"《食品安全法》第 142 条规定，县级以上地方人民政府有下列行为之一的，对直接\n\n负责的主管人员和其他直接责任人员给予记大过处分；情节较重的，给予降级或者撤职处分；\n\n情节严重的，给予开除处分；造成严重后果的，其主要负责人还应当引咎辞职：对发生在本\n\n行政区域内的食品安全事故，未及时组织协调有关部门开展有效处置，造成不良影响或者损\n\n失；对本行政区域内涉及多环节的区域性食品安全问题，未及时组织整治，造成不良影响或\n\n者损失；隐瞒、谎报、缓报食品安全事故；本行政区域内发生特别重大食品安全事故，或者\n\n连续发生重大食品安全事故。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ACDE","stem":"习近平法治思想提出的全面依法治国要求包括（ ）。","options":{"A":"坚持依宪治国、依宪执政","B":"坚持以党的领导为中心","C":"坚持党对全面依法治国的领导","D":"坚持以人民为中心","E":"坚持中国特色社会主义法治道路"},"explanation":"答案选 ACDE。全面依法治国的要求包括坚持党对全面依法治国的领导、坚持以人民\n\n为中心、坚持中国特色社会主义法治道路、坚持依宪治国、依宪执政。B 项全面依法治国是\n\n坚持以人民为中心，不是以党的领导为中心，党的领导是根本保证。","clips":[]},{"n":145,"kind":"多项选择题","answer":"BCDE","stem":"《英雄烈士保护法》规定，禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神。英雄烈士的（ ）受法律保护。","options":{"A":"事迹","B":"姓名","C":"肖像","D":"名誉","E":"荣誉"},"explanation":"《英雄烈士保护法》第 22 条规定：“英雄烈士的姓名、肖像、名誉、荣誉受法律保\n\n护。”因此，正确选项是 BCDE。B 姓名：禁止擅自使用烈士姓名注册商标、命名商业场所；C\n\n肖像：禁止丑化、篡改烈士照片或画像；D 名誉：禁止散布谣言贬损烈士形象；E 荣誉：禁\n\n止否定烈士荣誉称号的正当性。举例：商家注册“董存瑞炸碉堡”商标，被依法宣告无效，\n\n即因侵害姓名与荣誉权。A 项错误：法律保护的是基于事迹产生的“精神”与“名誉”，而\n\n非“事迹”本身。歪曲事迹可能构成对名誉或精神的侵害，但“事迹”不作为独立保护客体。","clips":[]},{"n":146,"kind":"多项选择题","answer":"BDE","stem":"《民法典》规定，有下列（ ）情形之一的，当事人可以解除合同。","options":{"A":"因不可抗力致使合同变更","B":"在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务","C":"当事人一方迟延履行主要债务","D":"当事人一方有其他违约行为致使不能实现合同目的","E":"法律规定的其他情形"},"explanation":"《民法典》第 563 条，有下列情形之一的，当事人可以解除合同：(1)因不可抗力致\n\n使不能实现合同目的；(2)在履行期限届满前，当事人一方明确表示或者以自己的行为表明\n\n不履行主要债务；(3)当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；(4)\n\n当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；(5)法律规定的其他\n\n情形。A 错误：法条是“致使不能实现合同目的”，不是“致使合同变更”。B 正确：预期违\n\n约（明示/默示不履行主债务）。C 错误：只迟延履行主要债务还不够，必须加上经催告后合\n\n理期限仍不履行才可以解除。D 正确：根本违约，导致合同目的落空。E 正确：法条原文是\n\n法律规定的其他情形。","clips":[]},{"n":147,"kind":"多项选择题","answer":"BCDE","stem":"根据《国家旅游局关于旅游不文明行为记录管理暂行办法》的规定，下列表述错误的是（ ）。","options":{"A":"旅游经营者和旅游从业人员属于旅游不文明行为记录管理制度的纳入对象","B":"“旅游不文明行为记录”形成前应经“旅游不文明行为记录评审委员会”评审通过","C":"“旅游不文明行为记录”的记录期限实行动态管理","D":"“旅游不文明行为记录”形成后，当事人本人享有申辩的权利","E":"受到行政处罚的，“旅游不文明行为记录”的信息保存期限为 2 年至 4 年"},"explanation":"A 错误，注意：旅游经营者（企业）不在记录对象里，记录对象是游客+旅游从业人\n\n员（自然人）。该办法纳入的是游客、旅游从业人员（自然人），旅游经营者（企业主体）不\n\n属于该记录的纳入对象，所以 A 说法错误。B 正确，第 8 条：记录形成前，经评审委员会评\n\n审通过；C 正确，第 9 条：记录期限 1-5 年，实行动态管理；D 正确，第 11 条：记录形成后，\n\n送达本人，告知享有申辩权。E 正确，受到行政处罚的，“旅游不文明行为记录”的信息保\n\n存期限为 2-4 年。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABCE","stem":"关于导游的介绍礼仪，阐述正确的选项有（ ）。","options":{"A":"介绍一般可分为自我介绍、为他人做介绍及被人介绍三种","B":"应遵循“让长者、客人先知”的原则","C":"介绍时，应简洁清楚，不能含糊其词","D":"介绍他人时，可用手指指着对方，清晰明了","E":"导游被人介绍时，应面对旅游者，显示出想结识旅游者的诚意"},"explanation":"介绍一般可分为自我介绍、为他人做介绍及被人介绍三种；应遵循“让长者、客人\n\n先知”的原则；介绍时，应简洁清楚，不能含糊其词；介绍他人时，不可用手指指着对方，\n\n应有礼貌地以手掌示意；导游被人介绍时，应面对旅游者，显示出想结识旅游者的诚意。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABC","stem":"地陪导游送行前的工作包括（ ）。","options":{"A":"核对交通票据","B":"商定出发时间","C":"提醒注意事项","D":"集合登车","E":"与饭店结账"},"explanation":"地陪导游送行前的工作：核对交通票据；商定出发时间；提醒注意事项；及时归还\n\n证件。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABC","stem":"导游服务的原则有（ ）。","options":{"A":"游客为本原则","B":"规范化服务原则","C":"平等待客原则","D":"营销有别原则","E":"维护旅行社合法权益原则"},"explanation":"导游服务的原则：游客为本原则；规范化服务原则；平等待客原则；个性化服务原\n\n则；维护旅游者合法权益原则。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABC","stem":"地陪导游在接团前，应该做好的心理准备有（ ）。","options":{"A":"树立带好旅游团的自信","B":"准备面对艰苦复杂的工作","C":"准备可能面对抱怨和投诉","D":"旅游稽查的审核","E":"旅游景区的监督和检查"},"explanation":"地陪导游在接团前，应该做好的心理准备：树立带好旅游团的自信；准备面对艰苦\n\n复杂的工作；准备可能面对抱怨和投诉。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABDE","stem":"导游语言的基本要求包括（ ）。","options":{"A":"准确性","B":"通俗性","C":"复杂性","D":"清晰性","E":"生动性"},"explanation":"导游语言的基本要求包括：准确性；通俗性；清晰性；生动性。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ACD","stem":"导游领队带领游客进行进餐活动时，应该遵守的规则包括（ ）。","options":{"A":"有序就餐，避免高声喧哗干扰他人","B":"引导游客就餐时尽量多拿，避免多次往返餐台","C":"提醒游客自助餐区域的食物、饮料不能带离就餐区","D":"提醒游客正确使用公共餐具","E":"就餐环境对服装有特殊要求的，导游不需要提示游客"},"explanation":"1.导游领队应提醒游客注意用餐礼仪，有序就餐，避免高声喧哗干扰他人。2.导游\n\n领队应引导游客就餐时适量点用，避免浪费。3.导游领队应提醒游客自助餐区域的食物、饮\n\n料不能带离就餐区。4.集体就餐时，导游领队应提醒游客正确使用公共餐具。5.游客如需在\n\n就餐时抽烟，导游领队应指示游客到指定抽烟区域就座，如就餐区禁烟的，应遵守相关规则。\n\n6.就餐环境对服装有特殊要求的，导游领队应事先告知游客，以便游客准备。7.在公共交通\n\n工具或博物馆、展览馆、音乐厅等场所，应遵守相关规则，勿违规饮食。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ACD","stem":"地陪导游为游客提供餐饮服务应遵守的规则包括（ ）。","options":{"A":"在旅游团队用餐前，地陪需提前落实本团当天的用餐事宜","B":"到达餐厅以后，地陪引导游客入座以后就可以离开","C":"用餐过程中，地陪应巡视旅游团用餐情况 1—2 次","D":"若是风味餐，地陪还应进行必要的介绍，使旅游者了解风味餐的历史等","E":"如菜品中有异物必须要求餐厅负责人出面赔礼道歉并立即换菜"},"explanation":"在旅游团队用餐前，地陪需提前落实本团当天的用餐事宜；地陪应提前了解团队用\n\n餐位置，并向旅游者做出指引；进入餐厅后，向餐厅迎宾员告知团队的团号、旅行社名称以\n\n及人数等信息；引导旅游者落座后，督促服务员上茶水，介绍餐厅的相关设施，尤其是洗手\n\n间的位置，并向旅游者说明用餐的具体时间；用餐过程中，地陪应巡视旅游团用餐情况 1—\n\n2 次；针对旅游者在用餐中出现的问题和要求，如菜品中有异物（头发、虫子等），地陪要\n\n及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABCD","stem":"旅游团回国的入境手续包括（ ）。","options":{"A":"接受检验检疫","B":"领取托运行李","C":"接受入境边防检查","D":"接受海关检查","E":"接受财务检查"},"explanation":"旅游团回国的入境手续：接受检验检疫；领取托运行李；接受入境边防检查；接受\n\n海关检查。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ACDE","stem":"带领孩子旅行的“四不宜”原则是（ ）。","options":{"A":"不宜为讨好孩子而给其买食物、玩具等物品","B":"不宜密切关注孩子的动向，确保其始终处于安全环境中","C":"不宜过于关注孩子而冷落其他成员","D":"不宜单独带孩子外出活动","E":"不宜在孩子生病时直接提供药物给其服用"},"explanation":"“四不宜”原则：①不宜为讨好孩子而给其买食物、玩具等物品；②不宜过于关注\n\n孩子而冷落其他成员；③不宜单独带孩子外出活动；④不宜在孩子生病时直接提供药物给其\n\n服用。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABCE","stem":"游客要求中途退团，导游处置得当的是（ ）。","options":{"A":"合理退团，游客提出书面申请并签字，导游按照旅行社安排处理","B":"若外国旅游者持团体签证，协助办理分离签证手续","C":"额外产生的费用由旅游者自理","D":"不合理退团要求，导游告知一切费用自理，其余团费不退","E":"不合理退团要求，地陪、领队、全陪互相配合，耐心劝服继续随团"},"explanation":"不合理退团要求，导游告知一切费用自理，未使用费用按旅游合同约定处理，其余\n\n选项正确。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABD","stem":"为了防止误机事故的发生，导游应该做的预防工作有（ ）。","options":{"A":"仔细确认班（轮）次、日期、时间及地点","B":"统筹旅游行程，避免离开当天安排旅游者前往地域复杂或位置偏远景点","C":"送机（车、船）前安排自由活动","D":"提前与司机沟通交通情况，预留充足行车时间","E":"不要带领游客去不对外开放的地点旅游"},"explanation":"导游应仔细确认班（轮）次、日期、时间及地点。当地若有多个机场、火车站或码\n\n头，还需进一步确认具体位置；导游应统筹旅游行程，避免离开当天安排旅游者前往地域复\n\n杂或位置偏远景点，以及在送机（车、船）前安排自由活动；导游提前与司机沟通交通情况，\n\n预留充足行车时间。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ACDE","stem":"境内旅游过程中，导游发现旅游者走失后，应该（ ）。","options":{"A":"向其他旅游者了解情况","B":"立即报警","C":"及时向旅行社报告","D":"全陪安排旅游者随行亲朋共同寻找","E":"地陪带团继续游览"},"explanation":"1.了解情况与寻找：①向其他旅游者了解情况；②全陪安排旅游者随行亲朋/团队代\n\n表共同寻找；③联系景区、住宿经营者等可能有线索的接待者；④地陪带团继续游览。2.\n\n及时向旅行社报告。3.联系饭店。4.报警/报案。","clips":[]},{"n":160,"kind":"多项选择题","answer":"CDE","stem":"发现旅游者中暑，导游可采取的措施有（ ）。","options":{"A":"移至阴凉通风处，意识清醒者平躺干爽休息","B":"失去意识者坐姿休息，支撑头与肩部","C":"症状轻微可扇风散热，面色潮红发烧时用凉水擦拭身体降温","D":"解开患者衣领，放松裤带","E":"患者病症重，处理后症状未改善，及时送医"},"explanation":"①移至阴凉通风处，意识清醒者坐姿休息，支撑头与肩部；失去意识者平躺干爽位\n\n置，解开衣领，放松裤带；②症状轻微可扇风散热，面色潮红发烧时用凉水擦拭身体降温；\n\n③症状未缓解，征询旅游者或亲友意见，服用自带防暑药物，进一步观察；④患者病症重，\n\n经处理后症状未改善，及时送往医院进一步治疗。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCE","stem":"将溺水旅游者救上岸后昏迷，导游应该（ ）。","options":{"A":"立即拨打 120，在接线人员的指导下，进行科学救护","B":"将溺水者仰卧置于地上，把头部置于侧位，以便水从口中流出","C":"迅速清理掉溺水者口鼻内的堵塞物，使其保持呼吸道畅通","D":"若发现溺水者尚有心跳，就应立即采用心肺复苏术进行施救","E":"快速判断是否还有呼吸"},"explanation":"立即拨打 120 是较好的办法。一方面可让救护车尽早赶到，另一方面可通过 120 接\n\n线人员的指导，进行科学救护，避免溺水者遭受二次伤害；将失去知觉的溺水者仰卧置于地\n\n上，把头部置于侧位，以便水从口中流出；迅速清理掉溺水者口鼻内的堵塞物，使其保持呼\n\n吸道畅通；可将手掌平放在溺水者胸腹部上方作为参照，侧脸俯身观察胸腹部是否有起伏，\n\n时间约为 5-10 秒；若发现溺水者已经没有呼吸心跳，就应立即采用心肺复苏术进行施救。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABCE","stem":"导游带团旅行过程中发生了泥石流，作为导游人员应该（ ）。","options":{"A":"若看到河床中正常流水断流或水流突然增大并伴有较多的柴草树木，要带领游客迅速撤离危险地域","B":"撤离时切勿与泥石流同向奔跑，而应迅速向两侧逃生","C":"不要停留在凹坡处，要尽可能加快向两侧高坡撤离","D":"如果时间来不及，要攀爬到树上躲避","E":"脱离险境后，选择平整的高地集合队伍，发送求救信息等待救援"},"explanation":"泥石流前兆：若观察到河（沟）床中正常流水断流或水流突然增大并伴有较多的柴\n\n草树木，听到沟谷内传来类似火车轰鸣声或闷雷声，这表明沟谷上游可能已发生山洪泥石流。\n\n一旦发现有泥石流或山体滑坡迹象时，切勿与其同向奔跑，而应迅速向两侧逃生，即逃跑方\n\n向要与泥石流或山体滑坡方向成垂直方向，并且不要停留在凹坡处，要尽可能加快逃跑速度。\n\n若遭遇泥石流，可就近选择林木密集地带逃生，但不要攀爬到树上躲避。无论是遭遇泥石流\n\n还是山体滑坡，都应尽可能选择平整的高地集合队伍，然后发送求救信息并等待专业救援力\n\n量到达。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABCDE","stem":"旅途中不得不在雨中行走时，导游应注意的事项有（ ）。","options":{"A":"当路面有积水情况不明时，不可轻易踏足","B":"对于必经之路，要做好充分的探路工作，避免跌入窨井、地坑、沟渠等地","C":"尽量避开电线杆、路灯等含金属物体，防止因积水导电引发触电事故","D":"避开危险物体离临时搭建物、危旧墙体、高层建筑物确保行进路线安全","E":"当发现上游来水突然变得浑浊且水位快速上涨时，迅速引导旅游者向安全区域转移"},"explanation":"本题各选项均为雨中行走时导游应注意的事项。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ACDE","stem":"民航局对于携带充电宝的规定，正确的是（ ）。","options":{"A":"充电宝必须是旅客个人自用携带","B":"功率>100Wh 且≤160Wh，无须经航空公司批准","C":"严禁在托运行李中携带","D":"严禁携带无 3C 标识或标识不清的充电宝","E":"严禁在飞行过程中使用充电宝充电"},"explanation":"充电宝必须是旅客个人自用携带；额定能量限制：≤100Wh；无须批准；>100Wh 且\n\n≤160Wh；经航空公司批准后可携带；附加限制：每名旅客携带总数不得超过 2 个；严禁携\n\n带无 3C 标识或标识不清的充电宝；严禁在飞行过程中使用充电宝充电。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ABDE","stem":"避免高原反应发生的预防工作有（ ）。","options":{"A":"禁止急速行走、跑步、体力劳动","B":"忌暴饮暴食、饮酒、吸烟","C":"每日补充 6000 毫升液体","D":"佩戴防紫外线遮阳镜","E":"提前服用抗高反药（红景天/高原康/高原安）"},"explanation":"禁止急速行走、跑步、体力劳动；忌暴饮暴食、饮酒、吸烟；每日补充 2000-3000\n\n毫升液体，佩戴防紫外线遮阳镜；提前服用抗高反药（红景天/高原康/高原安）。","clips":[]}]</script>
<script>

const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;

    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
</html>
