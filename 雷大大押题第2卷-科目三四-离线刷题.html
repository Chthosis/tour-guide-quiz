<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"对","stem":"春节活动从腊月二十三过小年开始，直到正月十五元宵节结束。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。春节起源于原始社会的腊祭。春节活动从腊月二十三过小年开始，经过除夕、春节，直到正月十五元宵节结束。正月十五为每年第一个望月，称为上元节，也称元宵节，是春节活动的高潮和结束。","clips":[]},{"n":2,"kind":"判断题","answer":"错","stem":"红茶出现于明朝，用全发酵法制成。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“明朝”错误。红茶出现于滇期，用全发酵法制成。制作关键是渥红（发酵）以促进酶活性，使多酚类充分氧化。红茶多以产地命名，以安徽祁红、云南滇红尤为出众。","clips":[]},{"n":3,"kind":"判断题","answer":"对","stem":"《论语》《孟子》和从《礼记》中抽出的《大学》《中庸》，合称“四书”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《论语》《孟子》和从《礼记》中抽出的《大学》《中庸》，合称“四书”。朱熹著《四书集注》后来成为科举考试标准的范本，答案不能背离朱子的注解。","clips":[]},{"n":4,"kind":"判断题","answer":"对","stem":"明清科举考试内容以儒学“四书五经”为主，格式限定为八股文。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。明清科举考试内容以儒学“四书五经”为主，格式限定为八股文。明清科举考试制度固定，一般每三年举行一次，每次两轮。发榜时用黄纸书写，故称金榜题名。","clips":[]},{"n":5,"kind":"判断题","answer":"错","stem":"扬州个园园主特别爱荷，园内荷花成林，故取“月映荷成千个字”之句命名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“爱荷”错误。扬州个园园主特别爱竹，园内翠竹成林，故取清袁枚“月映竹成千个字”之句命名。个园小巧玲珑，以假山堆叠精巧著名，采取分峰叠石的手法，运用笋石、湖石、黄石、宣石表现春、夏、秋、冬四季景色，号称“四季假山”。","clips":[]},{"n":6,"kind":"判断题","answer":"错","stem":"《营造法式》是南宋政府颁行的各种建筑工程的“规范”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“南宋”错误。《营造法式》是北宋政府为了管理宫室、坛庙、官署、府第等建筑工程，于北宋崇宁二年（1103 年）颁行的，是各种建筑的设计、结构、用料和施工的“规范”。","clips":[]},{"n":7,"kind":"判断题","answer":"对","stem":"舫是仿造舟船造型的建筑，常建于水际或池中。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。舫是仿造舟船造型的建筑，常建于水际或池中。","clips":[]},{"n":8,"kind":"判断题","answer":"错","stem":"孔子伦理思想可以概括为“仁”和“义”两个字。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“义”错误。孔子伦理思想可以概括为两个字：“仁”和“礼”。","clips":[]},{"n":9,"kind":"判断题","answer":"对","stem":"汉字是记录汉语的符号，属表意文字。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。汉族的语言简称汉语，属汉藏语系，是世界上历时最悠久、最丰富的语言之一。汉字是记录汉语的符号，属表意文字。","clips":[]},{"n":10,"kind":"判断题","answer":"对","stem":"曹丕的《燕歌行》是我国现存最早的文人创作的完整七言诗。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。诗歌代表作《燕歌行》，是我国现存最早的文人创作的完整七言诗，《典论·论文》是我国文学史上第一篇文学批评著作。通篇七言，被认为是我国现存第一首文人创作的七言诗，标志着七言诗的形成。","clips":[]},{"n":11,"kind":"判断题","answer":"错","stem":"《诗经》的表现手法归纳为风、雅、颂。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《诗经》的表现手法归纳为赋、比、兴。《诗经》按音乐的特点分为风、雅、颂三部分。风是民间歌谣，雅为朝廷诗乐，颂为宗庙祭祀乐歌。","clips":[]},{"n":12,"kind":"判断题","answer":"对","stem":"绍兴加饭酒和龙岩沉缸酒为黄酒。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。黄酒，也称为米酒。绍兴加饭酒古称“山阴甜酒”“越酒”，距今已有 2300 多年的酿造历史。龙岩沉缸酒的酿造集我国黄酒酿造的各项传统精湛技术于一身。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"中国人民政治协商会议第一届全体会议确定五星红旗为国旗。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。中国人民政治协商会议第一届全体会议确定北平为中华人民共和国首都，改名为北京；决定采用公元纪年；以《义勇军进行曲》为代国歌；国旗为五星红旗。","clips":[]},{"n":14,"kind":"判断题","answer":"对","stem":"蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经文。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经文。","clips":[]},{"n":15,"kind":"判断题","answer":"对","stem":"东汉张芝擅今草，唐朝张旭和怀素擅狂草，三人均有“草圣”之誉。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。草书名家有东汉张芝，擅今草，唐朝张旭和怀素，擅狂草，三人均有“草圣”之誉。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"李白和杜甫被誉为诗史上的“双子星座”，杜甫被世人称为“诗仙”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“诗仙”错误。李白诗歌雄奇峭丽、豪放飘逸，凝聚着盛唐的时代精神，世人称其为“诗仙”。杜甫有“诗圣”之称。杜甫诗歌深有“诗史”之誉。李白和杜甫被誉为诗史上的“双子星座”，合称“李杜”。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"明代徐光启所著的《农政全书》是中国古代最早的农书。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“最早的农书”错误。中国最早的农书是西汉晚期成书的《汜胜之书》。明时，徐光启著《农政全书》，是中国古代农学著作的集大成者。《汜胜之书》《齐民要术》《农书》《农政全书》被誉为中国古代“四大农书”。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"银发旅游者多在国庆、春节黄金周等旅游旺季集中出行，热衷惊险刺激的探险项目。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为淡季出行。银发旅游者多在旅游的淡季出行，具有慢节奏（偏好深度体验而非走马观花）、高安全性（注重医疗保障和无障碍设施）、强社交性（青睐团体活动和代际同游）、重情怀（热衷文化怀旧等主题）、性价比导向等特点。","clips":[]},{"n":19,"kind":"判断题","answer":"错","stem":"道教的早期流派之一“五斗米道”由张角创立。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“张角”错误。在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道教，因信徒入教必须交五斗米，故名“五斗米道”。领导东汉黄巾起义的张角传授的为太平道。太平道教和“五斗米道”即为早期的道教。","clips":[]},{"n":20,"kind":"判断题","answer":"错","stem":"华山以雄伟著称，主峰玉皇顶海拔 1532.7 米。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“华山”错误。泰山以雄伟著称。主峰玉皇顶海拔 1532.7 米。华山壁立千仞，以险峻著称，自古以来就有“华山天下险”“奇险天下第一山”等说法。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"浙江海岸线总长居全国首位，是全国岛屿最多的省份。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。浙江海域面积 26 万平方千米，海岸线总长 6715 千米，居全国首位；面积大于 500 平方米的海岛有 2878 个，是全国岛屿最多的省份。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"1839 年，林则徐虎门销烟成了第一次鸦片战争的导火线。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1839 年虎门销烟成了第一次鸦片战争的导火线；1856 年英国借口“亚罗号”事件袭击广州城，第二次鸦片战争爆发。","clips":[]},{"n":23,"kind":"判断题","answer":"错","stem":"泼水节是白族的传统节日。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，错在“白族”。泼水节是傣族人民送旧迎新的传统节日，又称“浴佛节”；白族的传统节日主要有三月街、绕三灵、耍海节、火把节等。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"武汉别称“江城”，形似一只自西向东的彩蝶，被誉为中国经济地理的“心脏”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。武汉简称“汉”，别称“江城”；武汉文化具有浓郁的楚文化特色，是“高山流水遇知音”故事的发生地，其汉剧有“京剧之母”的美誉。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"民居、祠堂和桥梁被誉为“徽派古建三绝”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“桥梁”应改为“牌坊”。民居、祠堂和牌坊被誉为“徽派古建三绝”，粉墙、黛瓦、马头墙是徽派建筑的重要特征。","clips":[]},{"n":26,"kind":"判断题","answer":"对","stem":"佛山卫浴、陶瓷的全国市场占有率位居第一。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。广东经济发展水平稳居全国首位，2025 年 GDP 达 14.5847 万亿元，连续 37 年位居全国第一；佛山卫浴、陶瓷的全国市场占有率位居第一。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"龙门石窟始建于北魏孝文帝时期，被誉为“中国石刻艺术的最高峰”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。龙门石窟是世界文化遗产、中国三大石窟之一，始凿于北魏孝文帝时期，其中奉先寺卢舍那大佛高 17.14 米，是唐代石刻艺术的巅峰之作。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"山东寿光是国务院命名的“中国蔬菜之乡”，是中国最大的蔬菜生产基地和批发市场。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。山东寿光是全国冬暖式蔬菜大棚的发源地，也是中国最大的蔬菜生产基地和批发市场。","clips":[]},{"n":29,"kind":"判断题","answer":"错","stem":"西藏是中国人口最多、密度最大的省区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，错在“最多、密度最大”。西藏是中国人口最少、密度最小的省区；全区面积 120.28 万平方公里，约占中国总面积的八分之一，仅次于新疆维吾尔自治区。","clips":[]},{"n":30,"kind":"判断题","answer":"错","stem":"1931 年 11 月 7 日，中华苏维埃共和国在井冈山宣告中国第一个红色中央政权成立。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“井冈山”应改为“瑞金”。1931 年 11 月 7 日，中华苏维埃共和国在瑞金宣告中国第一个红色中央政权成立；中华苏维埃共和国临时中央政府设在瑞金，故瑞金有“红都”之称。井冈山：中国革命的摇篮；南昌：人民军队的摇篮；瑞金：共和国的摇篮，有“红都”之称；安源：工人运动的摇篮。","clips":[]},{"n":31,"kind":"判断题","answer":"错","stem":"道教名山武当山的最高峰是神农顶。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，错在“武当山”。最高峰神农顶海拔 3105 米的是号称“华中屋脊”的神农架；武当山是道教名山，著名习俗是“朝武当”。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"樟树的四特酒，被周恩来总理赞誉为“清、香、醇、纯”，四特酒由此而得名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。江西中药产业历史悠久，拥有樟树千年南国药都，在中国四大传统中药炮制流派中，江西“樟帮”“建昌帮”占据其二，在海内外影响深远。","clips":[]},{"n":33,"kind":"判断题","answer":"对","stem":"1927 年 10 月，建立了中国第一个农村苏维埃政权——海丰、陆丰县苏维埃政府。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1927 年 10 月，建立了中国第一个农村苏维埃政权——海丰、陆丰县苏维埃政府。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"孔庙是世界上规模最大的家族古墓群。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“孔庙”应改为“孔林”。孔庙被誉为“天下第一庙”；孔府号称“天下第一家”；孔林是世界上规模最大的家族古墓群。注意“三孔”各自的誉称不要混淆。","clips":[]},{"n":35,"kind":"判断题","answer":"错","stem":"乐山大佛是世界上现存最高的一尊石刻释迦牟尼坐像。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“释迦牟尼”应改为“弥勒佛”。乐山大佛是世界现存最高的一尊石刻弥勒佛坐像，开凿于唐朝中期开元年间，通高 71 米，“山是一尊佛，佛是一座山”。","clips":[]},{"n":36,"kind":"判断题","answer":"错","stem":"景德镇陶瓷始于唐，拥有 2000 多年的冶陶史，被誉为“世界瓷都”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“始于唐”应改为“始于汉”。景德镇陶瓷始于汉，拥有 2000 多年的冶陶史、1000 多年的官窑史和 600 多年的御窑史，被誉为“世界瓷都”。","clips":[]},{"n":37,"kind":"判断题","answer":"错","stem":"殷墟出土的甲骨文是中国最早的文字。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“最早的文字”应改为“最早的成熟文字”。甲骨文是中国最早的成熟文字，迄今出土约 15 万片；殷墟距今 3300 余年，是中国首个有文献可考、并为甲骨文和考古证实的古代都城遗址，还出土了后母戊鼎等重器。","clips":[]},{"n":38,"kind":"判断题","answer":"错","stem":"云南昆明至老挝万象的中老铁路是中国第一条国际铁路。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“中老铁路”应改为“滇越铁路”。云南昆明至越南河内的滇越铁路是中国第一条国际铁路；2021 年 12 月 3 日，昆明到万象的中老铁路正式通车。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"天津始于隋朝大运河的开通，史称“三会海口”，是天津的发祥地。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。天津始于隋朝大运河的开通，史称“三会海口”，是天津的发祥地。明永乐二年（1404 年）朱棣设立天津卫，天津由此得名。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"截至目前，我国共有 85 家国家级旅游度假区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。截至 2025 年 7 月，我国共有 85 家国家级旅游度假区。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"D","stem":"紧压茶主要以（ ）为原料，也称边销茶。","options":{"A":"白茶或黄茶","B":"乌龙茶或花茶","C":"普洱茶或铁观音","D":"黑茶或红茶或绿茶"},"explanation":"紧压茶主要以黑茶或红茶或绿茶为原料，也称边销茶。再加工茶类有压制成型的紧压茶和鲜花窨制的花茶。花茶出现于宋代，以精制后的茶叶和鲜花为原料，经过窨花工艺制成。A 项，白茶、黄茶与 B 项乌龙茶均属六大类毛茶，B 项花茶则与紧压茶同属再加工茶类，均非紧压茶原料。C 项，普洱茶为黑茶名品、铁观音为乌龙茶名品，该组合并非紧压茶原料。","clips":[]},{"n":42,"kind":"单项选择题","answer":"C","stem":"我国第一部文学理论专著是南朝刘勰的（ ）。","options":{"A":"《文赋》","B":"《诗品》","C":"《文心雕龙》","D":"《典论·论文》"},"explanation":"刘勰的《文心雕龙》，我国第一部文学理论专著。D 项，《典论·论文》是我国文学史上第一篇文学批评著作。其作者为曹丕。","clips":[]},{"n":43,"kind":"单项选择题","answer":"B","stem":"中国古代最大的一座帝王陵墓是（ ）。","options":{"A":"汉茂陵","B":"秦始皇陵","C":"唐乾陵","D":"明孝陵"},"explanation":"秦始皇陵是中国历史上第一个皇帝赢政的陵墓，位于陕西省西安市临潼区骊山脚下，是中国古代最大的一座帝王陵墓，也是世界上最大的一座陵墓。被誉为“世界第八大奇迹”。A 项，汉茂陵是汉武帝刘彻的陵墓，是西汉帝王陵中规模最大的一座，并非中国古代最大的帝王陵墓。CD 项，唐乾陵、明孝陵的规模均不及秦始皇陵。","clips":[]},{"n":44,"kind":"单项选择题","answer":"C","stem":"元明清三代汉地佛教的局面是（ ）。","options":{"A":"禅宗一枝独秀","B":"佛教全面衰退","C":"“家家观世音，户户阿弥陀”","D":"八大宗派并立"},"explanation":"元明清三代，汉地精英佛教停滞衰退，而大众佛教取得长足发展，出现“家家观世音，户户阿弥陀”的局面。A 项，禅宗是我国支派最多的佛教宗派，也是中国佛教史上流传最久远、对中国文化思想影响最广泛的宗派，但元明清三代并非禅宗一枝独秀。B 项，元明清三代停滞衰退的是汉地精英佛教，大众佛教取得长足发展，“全面衰退”说法片面。D 项，隋唐两代是中国佛教的创造阶段和鼎盛时期，主要宗派并立是隋唐局面，非元明清三代局面。","clips":[]},{"n":45,"kind":"单项选择题","answer":"B","stem":"中国最早的书法作品是商朝的（ ）。","options":{"A":"石鼓文","B":"甲骨文和金文","C":"小篆和隶书","D":"楷书和行书"},"explanation":"中国最早的书法作品是商朝甲骨文和金文，分别镌刻在甲骨和青铜器上。秦丞相李斯创制小篆，实现了字体统一。","clips":[]},{"n":46,"kind":"单项选择题","answer":"D","stem":"“建安七子”中成就最高，与曹植并称为“曹王”的是（ ）。","options":{"A":"陈琳","B":"刘桢","C":"孔融","D":"王粲"},"explanation":"建安七子成就最高的是王粲，与曹植并称为“曹王”，主要代表作是《七哀诗》和《登楼赋》。ABC 项，陈琳、刘桢、孔融均为建安七子成员，但成就最高、与曹植并称“曹王”的是王粲。","clips":[]},{"n":47,"kind":"单项选择题","answer":"B","stem":"世界最大的鸟类公园——裕廊鸟类公园位于（ ）。","options":{"A":"泰国曼谷","B":"新加坡","C":"马来西亚吉隆坡","D":"印度尼西亚雅加达"},"explanation":"裕廊鸟类公园是世界最大的鸟类公园。裕廊鸟类公园位于新加坡。","clips":[]},{"n":48,"kind":"单项选择题","answer":"D","stem":"泰山岱庙的天殿殿同北京故宫太和殿、（ ）并称中国古代三大宫殿式建筑。","options":{"A":"沈阳故宫崇政殿","B":"承德避暑山庄澹泊敬诚殿","C":"拉萨布达拉宫红宫","D":"曲阜孔庙大成殿"},"explanation":"天殿殿同北京故宫太和殿、曲阜孔庙大成殿并称中国古代三大宫殿式建筑。岱庙旧称“东岳庙”，又叫泰庙，主祀“东岳泰山之神”，也是古代帝王来泰山封禅告祭时居住和举行大典的地方，与北京故宫、山东曲阜三孔、河北承德避暑山庄并称我国四大古建筑群。ABC项，沈阳故宫崇政殿、承德避暑山庄澹泊敬诚殿、拉萨布达拉宫红宫均不在“三大宫殿式建筑”之列。","clips":[]},{"n":49,"kind":"单项选择题","answer":"D","stem":"啤酒按麦芽汁的浓度，可分为（ ）。","options":{"A":"红啤、黑啤两类","B":"生啤、熟啤两类","C":"有醇、无醇两类","D":"低浓度、中浓度、高浓度三类"},"explanation":"按其麦芽汁的浓度，可分为低浓度啤酒（原麦汁浓度 6°- 8°，酒精含量 2%左右）、中浓度啤酒（原麦汁浓度 10°- 12°，酒精含量 3.1%- 3.8%）和高浓度啤酒（原麦汁浓度14°- 20°，酒精含量 4.9%- 5.6%）。中国最著名的啤酒是青岛啤酒，系山东青岛啤酒厂出品。","clips":[]},{"n":50,"kind":"单项选择题","answer":"D","stem":"中国面积最大的内陆盆地是（ ）。","options":{"A":"四川盆地","B":"柴达木盆地","C":"准噶尔盆地","D":"塔里木盆地"},"explanation":"塔里木盆地位于中国新疆南部，是中国面积最大的内陆盆地。盆地北缘的塔里木河是我国最大的内陆河。ABC 项，中国四大盆地分别是塔里木盆地、准噶尔盆地、四川盆地和柴达木盆地，其中面积最大的内陆盆地是塔里木盆地。","clips":[]},{"n":51,"kind":"单项选择题","answer":"C","stem":"下列湖泊中，属于河成湖的是（ ）。","options":{"A":"月牙泉","B":"千岛湖","C":"鄱阳湖","D":"五大连池"},"explanation":"河成湖是由于河流摆动而形成的湖泊，如鄱阳湖、洞庭湖等。A 项，月牙泉属风成湖：沙漠中低于潜水面的丘间洼地，经其四周沙丘渗流汇集而成，如敦煌的月牙泉。B 项，千岛湖属人工湖：由人工修筑的蓄水区域，如千岛湖。D 项，五大连池属火山堰塞湖。","clips":[]},{"n":52,"kind":"单项选择题","answer":"C","stem":"除夕北方地区有吃饺子的习俗，寓（ ）之意。","options":{"A":"“步步高”","B":"“团团圆圆”","C":"“更岁交子”","D":"“年年有余”"},"explanation":"北方地区有吃饺子的习俗，寓“更岁交子”之意，南方多吃年糕，象征生活步步高。","clips":[]},{"n":53,"kind":"单项选择题","answer":"B","stem":"恒山悬空寺始建于（ ），距地面高约 50 米。","options":{"A":"东汉","B":"北魏","C":"唐代","D":"宋代"},"explanation":"悬空寺为恒山人文景观之最，始建于北魏，距地面高约 50 米，其建筑特色可以概括为“查、悬、巧”三个字。徐霞客称悬空寺为“天下巨观”，三教殿内，释迦牟尼、老子、孔子共居一室，在我国寺庙建筑中别具一格。ACD 项，东汉、唐代、宋代均与悬空寺始建年代不符。","clips":[]},{"n":54,"kind":"单项选择题","answer":"B","stem":"下列高原中，被称为“世界屋脊”的是（ ）。","options":{"A":"黄土高原","B":"青藏高原","C":"云贵高原","D":"内蒙古高原"},"explanation":"青藏高原是中国最大、世界海拔最高的高原，被称为“世界屋脊”“地球第三极”。","clips":[]},{"n":55,"kind":"单项选择题","answer":"D","stem":"成为埃及的象征、世界八大奇迹之一的是（ ）。","options":{"A":"亚历山大灯塔","B":"巴比伦空中花园","C":"罗德岛太阳神巨像","D":"胡夫金字塔和狮身人面像"},"explanation":"金字塔在埃及共发现 96 座，最大的是开罗郊区吉萨的三座金字塔，是胡夫、哈夫拉和孟考拉祖孙三代的陵墓，其中最有名的是胡夫金字塔和狮身人面像，成为世界八大奇迹之一，也是埃及的象征。卢克索是世界上最大的露天博物馆，有“宫殿之城”的美誉。","clips":[]},{"n":56,"kind":"单项选择题","answer":"D","stem":"伊斯兰教内部的神秘主义派别是（ ）。","options":{"A":"逊尼派","B":"什叶派","C":"哈瓦利吉派","D":"苏菲派"},"explanation":"苏菲派是伊斯兰教内部的神秘主义派别。A 项，逊尼派是伊斯兰教中人数最多的一派，中国穆斯林大多属于逊尼派。B 项，什叶派是伊斯兰教中人数较少的一派，中国新疆塔吉克族穆斯林属于什叶派。","clips":[]},{"n":57,"kind":"单项选择题","answer":"A","stem":"每年举办“国际风筝节”、被称为“风筝的故乡”的城市是（ ）。","options":{"A":"潍坊","B":"阳江","C":"北京","D":"天津"},"explanation":"1984 年起，潍坊每年都举办“国际风筝节”。现在潍坊成为世界风筝文化交流的中心，被世界各国人民称为“风筝的故乡”。B 项，阳江于 1993 年被国家体委授予“全国风筝之乡”，与“风筝的故乡”所指不同。","clips":[]},{"n":58,"kind":"单项选择题","answer":"A","stem":"若按桥梁的结构及外观形式分，古桥的基本类型不包括（ ）。","options":{"A":"立交桥","B":"梁桥","C":"浮桥","D":"索桥"},"explanation":"若以桥梁的结构及外观形式分，主要有梁桥、浮桥、索桥、拱桥 4 种基本类型。拱桥是古桥中最富有生命力的一种桥型。A 项立交桥是现代道路交叉工程，不在其列。","clips":[]},{"n":59,"kind":"单项选择题","answer":"A","stem":"西安事变发生于（ ）。","options":{"A":"1936 年 12 月 12 日","B":"1937 年 12 月 12 日","C":"1936 年 10 月 10 日","D":"1935 年 12 月 12 日"},"explanation":"1936 年 12 月 12 日，张学良、杨虎城在西安扣留蒋介石，并向全国通电，提出停止内战、一致对外等八项主张。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":60,"kind":"单项选择题","answer":"B","stem":"蛋壳黑陶高柄杯“黑如漆、亮如镜、薄如纸、硬如瓷”，被考古界誉为（ ）。","options":{"A":"“黑陶之王”","B":"“四千年前地球文明最精致之制作”","C":"“史前陶文化之母”","D":"“东方陶魂”"},"explanation":"蛋壳黑陶高柄杯，其“黑如漆、亮如镜、薄如纸、硬如瓷”，堪称史前陶文化高超技艺的典型代表，被考古界誉为“四千年前地球文明最精致之制作”。龙山文化蛋壳黑陶是山东龙山文化特有的标志性陶器，也是我国古代制陶艺术的巅峰之作。","clips":[]},{"n":61,"kind":"单项选择题","answer":"D","stem":"泰国的首都是（ ）。","options":{"A":"芭堤雅","B":"清迈","C":"普吉","D":"曼谷"},"explanation":"泰国首都是曼谷。曼谷被誉为“佛教之都”，是“世界佛教联谊会”总部所在地。也是世界上佛寺最多的地方。A 项，芭堤雅已成为“海滩度假天堂”的代名词，素以阳光、沙滩、海鲜名扬世界；B 项，清迈有“北方玫瑰”之称；C 项，普吉是泰国著名海岛。","clips":[]},{"n":62,"kind":"单项选择题","answer":"A","stem":"扬州个园的命名与（ ）有关。","options":{"A":"竹","B":"兰","C":"菊","D":"梅"},"explanation":"扬州个园园主特别爱竹，园内翠竹成林，故取清袁枚“月映竹成千个字”之句命名。个园小巧玲珑，以假山堆叠精巧著名，采取分峰叠石的手法，运用笋石、湖石、黄石、宣石表现春、夏、秋、冬四季景色，号称“四季假山”。","clips":[]},{"n":63,"kind":"单项选择题","answer":"B","stem":"苏州玉雕以“小、巧、灵、精”出彩，其工匠善雕琢（ ）。","options":{"A":"大型山子","B":"中小件","C":"巨型摆件","D":"建筑构件"},"explanation":"苏州工匠善雕琢中小件，以“小、巧、灵、精”出彩。苏州玉雕历宋、元、明、清数代，均作为贡品进献皇室。ACD 项，大型山子、巨型摆件、建筑构件均非苏州玉雕所长；扬州玉雕尤以“山子雕”及“链子活”技艺独具一格。","clips":[]},{"n":64,"kind":"单项选择题","answer":"D","stem":"佛光是当阳光照在云雾表面，经过（ ）作用形成的一种特殊自然景观。","options":{"A":"折射和全反射","B":"直射和散射","C":"吸收和透射","D":"衍射和漫反射"},"explanation":"佛光是当阳光照在云雾表面，经过衍射和漫反射作用形成的一种特殊自然景观。峨眉山佛光出现次数最多，因峨眉山有海拔高、多云雾，且湿度大、风速小等有利条件，故佛光有“峨眉宝光”“金顶祥光”之誉。A 项，愿景也称海市或海市蜃楼。愿景成因是气温在垂直方向剧烈变化，使空气密度在垂向上出现显著差异，从而产生光线折射和全反射现象，折射和全反射是愿景的成因，而非佛光的成因。BC 项，直射和散射、吸收和透射均与佛光成因不符。","clips":[]},{"n":65,"kind":"单项选择题","answer":"A","stem":"采纳董仲舒建议，实行“罢黜百家，独尊儒术”的是（ ）。","options":{"A":"汉武帝","B":"汉景帝","C":"汉高祖","D":"汉文帝"},"explanation":"汉武帝时实行“罢黜百家，独尊儒术”。经他改革后的儒学顺应了汉武帝希望加强中央集权的愿望，汉武帝“罢黜百家，独尊儒术”，儒学从此成为中国正统思想。汉武帝派张骞出使西域，开通了陆上丝绸之路。","clips":[]},{"n":66,"kind":"单项选择题","answer":"C","stem":"贴春联、挂年画起源于古代的（ ）。","options":{"A":"剪纸","B":"灯笼","C":"桃符","D":"门神画"},"explanation":"贴春联、挂年画起源于古代的挑符。","clips":[]},{"n":67,"kind":"单项选择题","answer":"C","stem":"中国现存规模最大、保存最完整的古代城垣是（ ）城墙。","options":{"A":"丽江古城","B":"南京古城","C":"西安古城","D":"平遥古城"},"explanation":"西安古城城墙是中国现存规模最大、保存最完整的古代城垣。现存的著名古代城池有江苏南京古城、陕西西安古城、山西平遥古城和云南丽江古城等。B 项，南京古城聚宝门规模最大，是我国现存最大、最为完整的堡垒瓮城，在城垣建筑史上占有重要地位，但现存规模最大、保存最完整的古代城垣是西安古城城墙。AD 项，丽江古城、平遥古城均为现存著名古代城池，但规模与保存完整度不及西安古城城墙。","clips":[]},{"n":68,"kind":"单项选择题","answer":"C","stem":"结束近 300 年南北分裂局面、定都大兴（今西安）的朝代是（ ）。","options":{"A":"北宋","B":"西晋","C":"隋朝","D":"唐朝"},"explanation":"杨坚建立的隋朝，定都大兴（今西安），结束了魏晋南北朝以来 300 多年南北方长期分裂的局面。创立了三省六部制度和科举制度，修建了以洛阳为中心的大运河，沟通了南北交通，对后代政治制度和经济发展影响巨大。ABD 项，北宋、西晋、唐朝均不符合“结束近300 年南北分裂局面、定都大兴”的题干表述。","clips":[]},{"n":69,"kind":"单项选择题","answer":"B","stem":"有“匡庐奇秀甲天下”之誉的是（ ）。","options":{"A":"黄山","B":"庐山","C":"雁荡山","D":"三清山"},"explanation":"庐山风景秀丽，文化内涵深厚，素有“匡庐奇秀甲天下”之誉。","clips":[]},{"n":70,"kind":"单项选择题","answer":"A","stem":"“两弹一星”中的“两弹”是指（ ）。","options":{"A":"核弹、导弹","B":"导弹、氢弹","C":"原子弹、人造卫星","D":"原子弹、氢弹"},"explanation":"“两弹一星”指核弹、导弹、人造卫星。1964 年 10 月 16 日成功爆炸我国第一颗原子弹；1966 年 10 月 27 日，我国自行研制的东风二号核导弹试爆成功，标志着“两弹”成功结合，中国有了可用于实战的核导弹。1967 年 6 月 17 日，我国第一颗氢弹空爆试验成功；1970 年 4 月 24 日，我国用长征一号运载火箭成功发射第一颗人造卫星“东方红一号”。BD项，原子弹、氢弹均属核弹范畴；C 项，人造卫星是“两弹一星”中的“一星”。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":71,"kind":"单项选择题","answer":"B","stem":"有“沙峰、鸣沙、湖泊、奇泉、古庙”“五奇”之称的是（ ）。","options":{"A":"古尔班通古特沙漠","B":"巴丹吉林沙漠","C":"腾格里沙漠","D":"塔克拉玛干沙漠"},"explanation":"巴丹吉林沙漠是中国第三大沙漠，沙峰、鸣沙、湖泊、奇泉、古庙被称为“沙漠五奇”。巴丹吉林沙漠中已探明的湖泊有 144 个，俗称“沙漠干涸”。ACD 项，我国的四大沙漠分别是指塔克拉玛干沙漠、古尔班通古特沙漠、巴丹吉林沙漠、腾格里沙漠，“沙漠五奇”所指为巴丹吉林沙漠。","clips":[]},{"n":72,"kind":"单项选择题","answer":"B","stem":"汉族的语言简称汉语，属（ ）。","options":{"A":"印欧语系","B":"汉藏语系","C":"阿尔泰语系","D":"南亚语系"},"explanation":"汉族的语言简称汉语，属汉藏语系，是世界上历时最悠久、最丰富的语言之一。汉字是记录汉语的符号，属表意文字。ACD 项，印欧语系、阿尔泰语系、南亚语系均非汉语所属语系。","clips":[]},{"n":73,"kind":"单项选择题","answer":"C","stem":"重阳“九九”与“久久”谐音，有祝愿（ ）的含义。","options":{"A":"金榜题名","B":"早生贵子","C":"长久长寿","D":"五谷丰登"},"explanation":"九九重阳，又与“久久”谐音，有祝愿长久长寿的含义，1989 年，我国把每年的重\n\n阳节定为老人节，成为尊老、爱老、敬老、助老的节日，赋予了传统节日时代的新意。ABD项，金榜题名、早生贵子、五谷丰登均非“九九”与“久久”谐音的寓意。","clips":[]},{"n":74,"kind":"单项选择题","answer":"B","stem":"唐代曾经记载用硫黄、硝石和木炭制造火药的是（ ）。","options":{"A":"葛洪","B":"孙思邈","C":"沈括","D":"宋应星"},"explanation":"唐代孙思邈曾经记载用硫黄、硝石和木炭制造火药，唐末火药就开始用于军事，宋代甚至出现“霹雳炮”“震天炮”等火器。A 项，葛洪是东晋道士；C 项，北宋科学家沈括还发现了磁偏角现象；D 项，明朝宋应星著《天工开物》，外国学者称它为“中国 17 世纪的工艺百科全书”。三者均非唐代记载制造火药之人。","clips":[]},{"n":75,"kind":"单项选择题","answer":"B","stem":"世界上最大的丹顶鹤繁殖地是（ ）。","options":{"A":"四川卧龙自然保护区","B":"黑龙江扎龙自然保护区","C":"青海湖鸟岛","D":"西双版纳野象谷"},"explanation":"黑龙江扎龙主要保护对象为丹顶鹤等珍禽及湿地生态系统。湿地总面积为 21 万公顷，位居亚洲第二、世界第四，也是世界最大的芦苇湿地，1992 年被列入“国际重要湿地名录”。为众多水鸟尤其是丹顶鹤提供了栖息繁殖的优良环境，是世界上最大的丹顶鹤繁殖地。A 项，卧龙自然保护区以“熊猫之乡”“宝贵的生物基因库”“天然动植物园”享誉中外，以保护大熊猫等珍稀动物为主；C 项，青海湖鸟岛是我国重要的鸟类自然保护区。","clips":[]},{"n":76,"kind":"单项选择题","answer":"A","stem":"北京香山红叶种植最多的树种是（ ）。","options":{"A":"黄栌树","B":"火炬树","C":"乌桕","D":"红枫"},"explanation":"北京香山红叶种植面积最大的黄栌树近 10 万株。每年的 10 月中旬到 11 月上旬是观赏红叶的最好季节。BCD 项，火炬树、乌桕、红枫均非香山红叶种植面积最大的树种。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":77,"kind":"单项选择题","answer":"A","stem":"有“中华之魂”盛誉、长城入海的端头部分是（ ）。","options":{"A":"老龙头长城","B":"嘉峪关","C":"居庸关","D":"八达岭长城"},"explanation":"老龙头长城是长城入海的端头部分，有“中华之魂”的盛誉。BC 项，嘉峪关、居庸关均为长城著名关隘；D 项，八达岭长城位于北京西北，是明长城中保存最完好、最具代表性的一段。长城入海的端头部分是老龙头。","clips":[]},{"n":78,"kind":"单项选择题","answer":"C","stem":"研学旅行的主体是（ ）。","options":{"A":"家长","B":"旅行社","C":"学生","D":"教师"},"explanation":"学生是研学旅游的主体。研学旅行是学校教育的一部分。研学旅行最核心的属性是教育性。ABD 项，家长、旅行社、教师均非研学旅行的主体。","clips":[]},{"n":79,"kind":"单项选择题","answer":"A","stem":"佛教开始传入中国的标志史称（ ）。","options":{"A":"“伊存授经”","B":"“白马驮经”","C":"“法显西行”","D":"“永平求法”"},"explanation":"西汉哀帝元寿元年（公元前 2 年），大月氏王使臣伊存向中国博士弟子景卢口授《浮屠经》，佛教开始传入中国。史称这一佛教初传历史标志为“伊存授经”。","clips":[]},{"n":80,"kind":"单项选择题","answer":"B","stem":"我国“天宫”空间站是通过（ ）系列飞船逐步建成的。","options":{"A":"嫦娥","B":"神舟","C":"天问","D":"墨子"},"explanation":"我国载人航天工程通过“神舟”系列飞船建起了天宫空间站，实现了从无人飞行到载人飞行，从一人一天到多人多天，从空间出舱到交会对接，从单船飞行到组合体稳定运行的跨越。A 项，“嫦娥工程”是我国探月工程；C 项，“天问一号”是火星探测器；D 项，“墨子号”是量子科学实验卫星。三者均与建设“天宫”空间站无关。","clips":[]},{"n":81,"kind":"单项选择题","answer":"B","stem":"被誉为山水画“南京鼻祖”，被后世奉为文人画始祖的是（ ）。","options":{"A":"倪瓒","B":"王维","C":"展子虔","D":"黄公望"},"explanation":"王维，擅长山水画，被誉为山水画“南京鼻祖”，又因其画作中往往透出文人士大夫超然、闲适的情怀，“遗中有画，画中有诗”，被后世奉为文人画的始祖，惜无真迹留传下来。C 项，隋朝展子虔被认为是“唐画之祖”；AD 项，倪瓒、黄公望均为元代“元四家”成员。三者均非“南京鼻祖”、文人画始祖。","clips":[]},{"n":82,"kind":"单项选择题","answer":"C","stem":"江南三大奇石之冠是（ ）。","options":{"A":"杭州竹素园给云峰","B":"苏州环秀山庄假山","C":"上海豫园玉玲珑","D":"苏州留园冠云峰"},"explanation":"太湖石“玉玲珑”为“江南三大奇石”之冠。“江南三大奇石”：上海豫园玉玲珑、苏州留园冠云峰、杭州竹素园给云峰。","clips":[]},{"n":83,"kind":"单项选择题","answer":"A","stem":"中国现存最大的盔顶建筑是（ ）。","options":{"A":"岳阳楼","B":"黄鹤楼","C":"滕王阁","D":"蓬莱阁"},"explanation":"岳阳楼屋顶为四坡盔顶，屋面上凸下凹，为中国现存最大盔顶建筑。岳阳楼自古有“洞庭天下水，岳阳天下楼”之誉，北宋范仲淹脍炙人口的《岳阳楼记》更使岳阳楼著称于世。BCD 项，黄鹤楼、滕王阁、蓬莱阁均非中国现存最大盔顶建筑。","clips":[]},{"n":84,"kind":"单项选择题","answer":"C","stem":"1958 年通车、后来被改造成中国第一条电气化铁路的是（ ）。","options":{"A":"鹰厦铁路","B":"成渝铁路","C":"宝成铁路","D":"成昆铁路"},"explanation":"1958 年宝鸡到成都铁路通车，“蜀道难”被突破。这条铁路后来被改造成中国第一\n\n条电气化铁路。B 项，新中国成立后建成的第一条铁路是成渝铁路，全长 505 公里，连通成都和重庆，1950 年开始建设，1952 年 7 月 1 日建成通车，但并非第一条电气化铁路。AD 项，鹰厦铁路、成昆铁路均不符合题干表述；1970 年 7 月 1 日，全长 1096 公里的成昆铁路竣工运营。","clips":[]},{"n":85,"kind":"单项选择题","answer":"A","stem":"“海内存知己，天涯若比邻”的作者是（ ）。","options":{"A":"王勃","B":"杨炯","C":"卢照邻","D":"骆宾王"},"explanation":"王勃的代表作有《滕王阁序》和《送杜少府之任蜀州》，留下“落霞与孤鹜齐飞，秋水共长天一色”“海内存知己，天涯若比邻”等名句。BCD 项，杨炯、卢照邻、骆宾王与王勃并称“初唐四杰”，但“海内存知己，天涯若比邻”出自王勃《送杜少府之任蜀州》。","clips":[]},{"n":86,"kind":"单项选择题","answer":"A","stem":"清代广东“四大园林”中保存原貌最好的是（ ）。","options":{"A":"番禺余荫山房","B":"佛山梁园","C":"顺德清晖园","D":"东莞可园"},"explanation":"余荫山房是广东“四大园林”中保存原貌最好的古典园林。清代广东“四大园林”也被称为岭南“四大园林”，分别是顺德清晖园、东莞可园、番禺余荫山房、佛山梁园。BCD项，佛山梁园、顺德清晖园、东莞可园均为广东“四大园林”之一，但保存原貌最好的是番禺余荫山房。","clips":[]},{"n":87,"kind":"单项选择题","answer":"C","stem":"澳门沙仔区新濠天地酒店内最具代表性的舞台剧是（ ）。","options":{"A":"《印象·刘三姐》","B":"《宋城千古情》","C":"《水舞间》","D":"《大宋·东京梦华》"},"explanation":"沙仔区的澳门新濠天地酒店内有一个最具代表性的舞台剧——《水舞间》。","clips":[]},{"n":88,"kind":"单项选择题","answer":"A","stem":"藏族人民一年中最重要、最隆重的节日是（ ）。","options":{"A":"藏历年","B":"雪顿节","C":"望果节","D":"沐浴节"},"explanation":"藏历年相当于汉族的春节，是藏族人民一年中最重要、最隆重的节日；雪顿节意为“酸奶盛筵”，望果节是庆丰收的节日。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":89,"kind":"单项选择题","answer":"B","stem":"四川省第一条高速公路是 1995 年建成的（ ）。","options":{"A":"成雅高速公路","B":"成渝高速公路","C":"成绵高速公路","D":"成乐高速公路"},"explanation":"四川省第一条高速公路是 1995 年建成的成渝高速公路，里程 337.5 公里；雅西高速则被称为“云端上的高速公路”。","clips":[]},{"n":90,"kind":"单项选择题","answer":"C","stem":"世界现存最高的一尊石刻弥勒佛坐像——乐山大佛，通高（ ）。","options":{"A":"48 米","B":"61 米","C":"71 米","D":"88 米"},"explanation":"乐山大佛通高 71 米，位于岷江、青衣江和大渡河三江汇流的凌云山上。","clips":[]},{"n":91,"kind":"单项选择题","answer":"A","stem":"香港香火最旺、也是香港唯一可以举行道教婚礼的宫观是（ ）。","options":{"A":"黄大仙祠","B":"文武庙","C":"天后庙","D":"车公庙"},"explanation":"黄大仙祠又名番色园，是一座宏伟的中国式道教寺庙，是香港香火最旺的地方。","clips":[]},{"n":92,"kind":"单项选择题","answer":"C","stem":"欣赏阿里山日出的最佳地点是（ ）。","options":{"A":"日月潭","B":"玉山","C":"祝山","D":"阳明山"},"explanation":"著名的阿里山日出四季出现位置与时间皆不同，祝山是欣赏日出的最佳地点。","clips":[]},{"n":93,"kind":"单项选择题","answer":"D","stem":"壮族地区最负盛名的特产是（ ）。","options":{"A":"桂圆、荔枝、菠萝","B":"罗汉果、田七、肉桂","C":"珍珠、玛瑙、翡翠","D":"南珠、三七、蛤"},"explanation":"南珠、三七、蛤是壮族地区最负盛名的特产；博白县是广西桂圆肉的主要产区，素有“桂圆肉之乡”的称誉。","clips":[]},{"n":94,"kind":"单项选择题","answer":"B","stem":"郑和第一次下西洋的首航日 7 月 11 日被定为（ ）。","options":{"A":"中国海洋日","B":"中国航海日","C":"世界海事日","D":"郑和文化节"},"explanation":"郑和是云南昆阳州（今昆明市晋宁区）人，七下西洋完成了人类历史上伟大的壮举，其第一次下西洋的首航日 7 月 11 日被定为中国航海日。","clips":[]},{"n":95,"kind":"单项选择题","answer":"C","stem":"我国海拔最高的民用机场是（ ）。","options":{"A":"拉萨贡嘎国际机场","B":"昌都邦达机场","C":"稻城亚丁机场","D":"九寨黄龙机场"},"explanation":"稻城亚丁机场海拔 4411 米，是我国海拔最高的民用机场。西藏机场均为高高原机场，注意区分。","clips":[]},{"n":96,"kind":"单项选择题","answer":"D","stem":"台湾本岛南北最长达 394 千米，东西最宽为（ ），呈纺锤形。","options":{"A":"180 千米","B":"220 千米","C":"394 千米","D":"144 千米"},"explanation":"台湾本岛南北最长达 394 千米，东西最宽为 144 千米，呈纺锤形；台湾地区陆地总面积 3.6 万平方千米。","clips":[]},{"n":97,"kind":"单项选择题","answer":"A","stem":"我国面积最大的湿地类型国家级自然保护区是（ ）。","options":{"A":"青海省三江源国家级自然保护区","B":"四川若尔盖湿地保护区","C":"黑龙江扎龙自然保护区","D":"内蒙古额尔古纳湿地保护区"},"explanation":"青海省三江源国家级自然保护区是我国面积最大的湿地类型国家级自然保护区。","clips":[]},{"n":98,"kind":"单项选择题","answer":"B","stem":"甘肃地形呈狭长状，最窄处仅（ ）。","options":{"A":"15 公里","B":"25 公里","C":"50 公里","D":"80 公里"},"explanation":"甘肃地形呈狭长状，东西长 1655 公里，南北宽 530 公里，最窄处仅 25 公里。","clips":[]},{"n":99,"kind":"单项选择题","answer":"D","stem":"中国最长的内陆河是（ ）。","options":{"A":"额尔齐斯河","B":"伊犁河","C":"黑河","D":"塔里木河"},"explanation":"中国最长的内陆河——塔里木河，长 2100 公里；中国最大的沙漠——塔克拉玛干沙漠（33.76 万平方公里）；中国最大的内陆淡水湖——博斯腾湖。","clips":[]},{"n":100,"kind":"单项选择题","answer":"A","stem":"全国最大的内河港是（ ）。","options":{"A":"重庆果园港","B":"武汉阳逻港","C":"南京港","D":"苏州港"},"explanation":"全国最大的内河港果园港建成投用，2025 年全市港口货运量达到 2.4 亿吨，位居西部第一。","clips":[]},{"n":101,"kind":"单项选择题","answer":"B","stem":"下列瀑布中，被称为“中国第一瀑”的是（ ）。","options":{"A":"壶口瀑布","B":"黄果树瀑布","C":"德天瀑布","D":"蛟龙瀑布"},"explanation":"黄果树瀑布誉满天下，被称为“中国第一瀑”。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":102,"kind":"单项选择题","answer":"C","stem":"成都除“蓉城”之外，还有（ ）等别称。","options":{"A":"“山城”“雾都”","B":"“羊城”“花城”","C":"“龟城”“锦官城”","D":"“泉城”“面塑之都”"},"explanation":"成都还有“龟城”“锦官城”“蓉城”等别称，被誉为“雪山下的公园城市”“一座来了就不想走的城市”。","clips":[]},{"n":103,"kind":"单项选择题","answer":"D","stem":"为昆明滇池大观楼题写“天下第一长联”、被后人尊称为“联圣”的是（ ）。","options":{"A":"杨慎","B":"袁枚","C":"赵藩","D":"孙髯翁"},"explanation":"孙髯翁为昆明滇池大观楼题天下第一长联，被后人尊称为联圣。","clips":[]},{"n":104,"kind":"单项选择题","answer":"A","stem":"我国台湾省最大的港口是（ ）。","options":{"A":"高雄港","B":"基隆港","C":"台中港","D":"花莲港"},"explanation":"高雄港是台湾省最大的港口、世界第十五大港口；台北桃园国际机场是台湾省最大、最繁忙的机场。","clips":[]},{"n":105,"kind":"单项选择题","answer":"B","stem":"苗族民间最大的祭祀活动是（ ）。","options":{"A":"姊妹节","B":"祭鼓节","C":"芦笙节","D":"跳花节"},"explanation":"祭鼓节是苗族民间最大的祭祀活动。苗族主要信仰本民族长期形成的原始宗教，包括自然崇拜、图腾崇拜、祖先崇拜、鬼神崇拜。D 项跳花节是苗族传统节日，易误选。","clips":[]},{"n":106,"kind":"单项选择题","answer":"C","stem":"香港岛的最高点是（ ），登临的最佳时间为黄昏。","options":{"A":"大帽山","B":"狮子山","C":"太平山","D":"嘉顿山"},"explanation":"太平山也称扯旗山，海拔 552 米，是香港岛的最高点。登太平山的最佳时间是黄昏，既能观赏白天的城市景观，又可静待夜幕低垂时整个城市瞬间变幻的一刻。","clips":[]},{"n":107,"kind":"单项选择题","answer":"D","stem":"“三亚”因（ ）得名，是中国最南部的热带滨海旅游城市。","options":{"A":"三亚湾","B":"三亚山","C":"三亚岭","D":"三亚河"},"explanation":"“三亚”因三亚河（古名临川水）得名；三亚又称“鹿城”，享有“东方夏威夷”的美誉，是全国较长寿地区（平均寿命超过 80 岁）。","clips":[]},{"n":108,"kind":"单项选择题","answer":"A","stem":"澳门三大古刹中最古老者是（ ）。","options":{"A":"妈阁庙","B":"普济禅院","C":"莲峰庙","D":"妈阁庙和普济禅院并列"},"explanation":"妈阁庙现为澳门三大古刹中最古老者。","clips":[]},{"n":109,"kind":"单项选择题","answer":"B","stem":"黎族最盛大的民间传统节日、也是青年男女自由交往的日子是（ ）。","options":{"A":"“六月六”","B":"“三月三”","C":"“盘王节”","D":"“火把节”"},"explanation":"黎族大多数节日与汉族相同，“三月三”是最盛大的民间传统节日，也是青年男女自\n\n由交往的日子。C 项盘王节是瑶族传统节日，D 项火把节是彝族传统节日，均易误选。","clips":[]},{"n":110,"kind":"单项选择题","answer":"C","stem":"陕北民歌最常见的形式是（ ）。","options":{"A":"花儿","B":"山曲","C":"信天游","D":"爬山调"},"explanation":"陕北民歌以信天游最常见，其曲调悠长高亢、韵律和美，名曲《兰花花》《山丹丹开花红艳艳》几乎家喻户晓。","clips":[]},{"n":111,"kind":"单项选择题","answer":"D","stem":"青海湖是我国最大的（ ）。","options":{"A":"淡水湖","B":"人工湖","C":"火山口湖","D":"内陆咸水湖"},"explanation":"青海湖是我国最大的内陆咸水湖，柴达木盆地以“聚宝盆”著称于世。","clips":[]},{"n":112,"kind":"单项选择题","answer":"A","stem":"彝族人民最盛大的节日——火把节的时间是（ ）。","options":{"A":"农历六月二十四","B":"农历正月十五","C":"农历五月十五","D":"农历八月十五"},"explanation":"农历六月二十四是彝族人民最盛大的节日——火把节。彝族有自己的语言、文字和历法，崇拜自然和神灵，祭司称为“毕摩”。","clips":[]},{"n":113,"kind":"单项选择题","answer":"C","stem":"陕西境内的最高点是（ ）。","options":{"A":"五台山","B":"小五台山","C":"太白山拔仙台","D":"神农架神农顶"},"explanation":"陕西境内最高点为太白山拔仙台，海拔 3771.2 米。","clips":[]},{"n":114,"kind":"单项选择题","answer":"B","stem":"我国台湾省最大、最繁忙的机场是（ ）。","options":{"A":"台北松山机场","B":"台北桃园国际机场","C":"高雄小港机场","D":"台中清泉岗机场"},"explanation":"台北桃园国际机场是台湾省最大、最繁忙的机场；高雄港是台湾省最大的港口、世界第十五大港口。","clips":[]},{"n":115,"kind":"单项选择题","answer":"D","stem":"藏族最普遍的礼节是（ ）。","options":{"A":"敬酥油茶","B":"鞠躬","C":"合十礼","D":"献哈达"},"explanation":"献哈达是藏族最普遍的礼节，婚丧、节庆、乔迁、拜会尊长、朝拜佛像、送别远行等都有献哈达的习惯。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":116,"kind":"单项选择题","answer":"A","stem":"拥有两千多年养马历史、世界上最大的马场是（ ）。","options":{"A":"山丹军马场","B":"伊犁昭苏马场","C":"呼伦贝尔马场","D":"坝上草原马场"},"explanation":"位于张掖山丹县的山丹军马场是世界上最大的马场，拥有两千多年养马历史；甘肃养马历史悠久，自汉至今一直是我国养马业的重地。","clips":[]},{"n":117,"kind":"单项选择题","answer":"B","stem":"世界上最大最古老、保存得最完好的生土建筑城市是（ ）。","options":{"A":"楼兰故城遗址","B":"交河故城遗址","C":"高昌故城","D":"北庭故城"},"explanation":"交河故城遗址是世界上最大最古老、保存得最完好的生土建筑城市，唐西域最高军政机构安西都护府最早就设在交河故城。","clips":[]},{"n":118,"kind":"单项选择题","answer":"C","stem":"台湾本岛唯一的热带地区，被称为“台湾的天涯海角”的是（ ）。","options":{"A":"野柳公园","B":"玉山","C":"垦丁公园","D":"阳明山"},"explanation":"垦丁公园是台湾本岛唯一的热带地区，终年气温和暖，也是台湾省唯一拥有海域和陆地的公园，被称为台湾的天涯海角。B 项玉山、D 项阳明山均为台湾著名山岳，易误选。","clips":[]},{"n":119,"kind":"单项选择题","answer":"A","stem":"被众多游客称为“此生必驾公路”和“最美天山路”的是（ ）。","options":{"A":"独库公路","B":"伊昭公路","C":"塔里木沙漠公路","D":"赛果高速"},"explanation":"自驾独库公路能够感受“一日历四季，十里不同天”的独特体验，被众多游客称为“此生必驾公路”和“最美天山路”。","clips":[]},{"n":120,"kind":"单项选择题","answer":"C","stem":"香港众岛屿中面积最大的岛屿是（ ）。","options":{"A":"香港岛","B":"南丫岛","C":"大屿山","D":"青马岛"},"explanation":"香港众岛屿以大屿山面积最大，其次是香港岛；香港岛以南的鸭脚洲则是全球人口最稠密的岛屿之一。","clips":[]},{"n":121,"kind":"单项选择题","answer":"D","stem":"中国第一条国际铁路是（ ）。","options":{"A":"成昆铁路","B":"中老铁路","C":"湘黔铁路","D":"滇越铁路"},"explanation":"云南昆明至越南河内的滇越铁路是中国第一条国际铁路。","clips":[]},{"n":122,"kind":"单项选择题","answer":"C","stem":"我国台湾省长期居全球第一位的产业领域是（ ）。","options":{"A":"石化产业","B":"精密机械","C":"晶圆代工产业","D":"纺织业"},"explanation":"台湾省拥有全球最密集的半导体产业集群，尤其在晶圆代工产业领域长期居全球第一位，有台积电、日月光、联发科、富士康、华硕等一批企业。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":123,"kind":"单项选择题","answer":"D","stem":"重庆云雾山全年雾日多达（ ）天，堪称“世界之最”。","options":{"A":"164 天","B":"240 天","C":"304 天","D":"204 天"},"explanation":"重庆云雾山全年雾日多达 204 天，堪称“世界之最”。","clips":[]},{"n":124,"kind":"单项选择题","answer":"A","stem":"世界最大的室内卧佛位于甘肃（ ）。","options":{"A":"张掖大佛寺","B":"武威大佛寺","C":"天水大佛寺","D":"兰州大佛寺"},"explanation":"张掖大佛寺有世界最大的室内卧佛；“九色香巴拉”天堂之地指甘南藏族自治州。","clips":[]},{"n":125,"kind":"单项选择题","answer":"B","stem":"到澳门旅游最理想的季节是（ ）。","options":{"A":"春季（3~5 月）","B":"秋季（9~11 月）","C":"夏季（6~8 月）","D":"冬季（12~2 月）"},"explanation":"秋季（9~11 月）阳光充足、气候温和且湿度较低，是到澳门旅游的最理想的季节。","clips":[]},{"n":126,"kind":"单项选择题","answer":"C","stem":"我国第一条跨国原油管道是（ ）。","options":{"A":"中俄原油管道","B":"中缅油气管道","C":"中哈原油管道","D":"中亚天然气管道"},"explanation":"中哈原油管道是我国第一条跨国原油管道，也是连接里海油田到中国内陆的重要能源通道。","clips":[]},{"n":127,"kind":"单项选择题","answer":"D","stem":"宁夏枸杞以（ ）所产为最佳，被列入《中国药典》。","options":{"A":"银川","B":"固原","C":"中卫","D":"中宁"},"explanation":"宁夏是枸杞的原产地，是世界上品质最好、种植时间最长的地方，其中又以中宁所产为最佳；中宁枸杞被列入《中国药典》，远销 58 国。","clips":[]},{"n":128,"kind":"单项选择题","answer":"A","stem":"澳门的区花是（ ）。","options":{"A":"莲花","B":"紫荆花","C":"白玉兰","D":"菊花"},"explanation":"澳门区的区花是莲花，金莲花广场的大型雕塑“盛世莲花”是中央人民政府为庆祝澳门回归而赠送的；紫荆花是香港区花，易误选。","clips":[]},{"n":129,"kind":"单项选择题","answer":"B","stem":"中国第一条采用自主研发的北斗卫星导航系统、设计速度 350 公里/小时的智能化高速铁路是（ ）。","options":{"A":"京沪高铁","B":"京张客运专线","C":"京津城际","D":"京广高铁"},"explanation":"京张客运专线是中国第一条采用自主研发的北斗卫星导航系统、设计速度 350 公里/小时的智能化高速铁路，也是世界上第一条最高设计速度 350 公里/小时的高寒、大风沙高速铁路。","clips":[]},{"n":130,"kind":"单项选择题","answer":"B","stem":"国家 5A 级旅游景区数量最多的省市是（ ）。","options":{"A":"福建","B":"江苏","C":"天津","D":"浙江"},"explanation":"江苏省国家 5A 级旅游景区数量位居全国第一、浙江第二。\n\n三、多选题","clips":[]},{"n":131,"kind":"多项选择题","answer":"AB","stem":"中国古典园林叠山的石材主要有两种，其用途对应正确的有（ ）。","options":{"A":"黄石——用于假山的基础部分，称叠脚","B":"太湖石——置于假山上部，称收顶","C":"黄石——置于假山上部","D":"太湖石——用于假山的基础部分","E":"两种石材用途相同"},"explanation":"叠山石材主要有两种：一是黄石，因其质地坚硬，不易受风雨的侵蚀，用于假山的基础部分，称叠脚。二是太湖石，因其具有皱、瘦、漏、透四大特点，置于假山的上部，供游人玩赏品味，称收顶。CD 项把两种石材的用途颠倒了；E 项，两种石材的用途并不相同。","clips":[]},{"n":132,"kind":"多项选择题","answer":"AB","stem":"兼香型酒以（ ）为代表。","options":{"A":"贵州遵义董酒","B":"陕西西凤酒","C":"贵州茅台酒","D":"山西汾酒","E":"桂林三花酒"},"explanation":"兼香型酒指具有两种以上主体香型的白酒，具有一酒多香的风格，又称为复香型和混合香型酒。以贵州遵义董酒、陕西西凤酒为代表。C 项，贵州茅台酒是酱香型酒的典型代表；D 项，山西杏花村汾酒是清香型酒的代表；E 项，桂林三花酒属于米香型酒的代表。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ABCD","stem":"中国“四大名锦”包括（ ）。","options":{"A":"南京云锦","B":"四川蜀锦","C":"苏州宋锦","D":"广西壮锦","E":"杭州织锦"},"explanation":"在中国众多锦中，南京云锦、四川蜀锦、苏州宋锦、广西壮锦并称“四大名锦”，分别代表宫廷皇家、汉唐丝路、文人雅士和少数民族四大文化体系。云锦因锦面色彩斑斓、美若云霞而得名，被专家称为“中国古代织锦工艺史上最后一座里程碑”。E 项，杭州织锦不在“四大名锦”之列。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ABC","stem":"我国三大瀑布风景区是（ ）。","options":{"A":"黄果树瀑布风景区","B":"壶口瀑布风景区","C":"吊水楼瀑布风景区","D":"德天瀑布风景区","E":"诺日朗瀑布风景区"},"explanation":"黄果树瀑布风景区、壶口瀑布风景区和吊水楼瀑布风景区是我国的三大瀑布风景区。D 项，德天瀑布为亚洲第一大跨国瀑布；E 项，诺日朗瀑布是大型钙华瀑布，瀑面最宽达 300多米，是我国最宽的瀑布，二者均不在三大瀑布风景区之列。","clips":[]},{"n":135,"kind":"多项选择题","answer":"ABC","stem":"中国佛教包容的三大体系是（ ）。","options":{"A":"北传佛教","B":"南传佛教","C":"藏传佛教","D":"汉传佛教","E":"上座部佛教"},"explanation":"中国佛教包容了北传佛教、南传佛教和藏传佛教三大体系。可以说，佛教诞生在印度，发展在中国。D 项，北传佛教亦称汉语系佛教，汉传佛教即北传佛教；E 项，南传佛教以小乘佛教（上座部佛教）为主，上座部佛教即南传佛教。","clips":[]},{"n":136,"kind":"多项选择题","answer":"BCD","stem":"从 2008 年起成为全国性法定节日的有（ ）。","options":{"A":"七夕节","B":"清明节","C":"端午节","D":"中秋节","E":"元宵节"},"explanation":"根据国务院令，从 2008 年 1 月 1 日起，除春节外，清明节、端午节、中秋节等传统节日也成为全国性法定节日。AE 项，七夕节、元宵节不在 2008 年起新增的全国性法定节日之列。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ABC","stem":"巴金的“爱情三部曲”包括（ ）。","options":{"A":"《雾》","B":"《雨》","C":"《电》","D":"《家》","E":"《春》"},"explanation":"巴金于 1929 年发表第一部长篇小说《灭亡》，随后有长篇小说“爱情三部曲”（《雾》《雨》《电》）和“激流三部曲”（《家》《春》《秋》）。DE 项，《家》《春》属“激流三部曲”，而非“爱情三部曲”。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":138,"kind":"多项选择题","answer":"ABC","stem":"汉字发展演变的规律可以概括为（ ）。","options":{"A":"笔画的线条化","B":"字形的符号化","C":"结构的规范化","D":"字体的拼音化","E":"书写的随意化"},"explanation":"汉字发展演变的规律可以概括为以下三个方面：笔画的线条化、字形的符号化、结构的规范化。DE 项，“字体的拼音化”“书写的随意化”不在汉字发展演变规律之列。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABCD","stem":"下列关于古田会议的表述，正确的有（ ）。","options":{"A":"1929 年 12 月 28-29 日在福建省上杭县古田召开","B":"选举毛泽东为新的中共红四军前敌委员会书记","C":"根据中央九月来信精神，通过毛泽东起草的古田会议决议","D":"确立了思想建党、政治建军的原则","E":"是中国共产党历史上生死攸关的转折点"},"explanation":"1929 年 12 月 28-29 日，红四军党的第九次代表大会在福建省上杭县古田召开，即古田会议。古田会议选举产生了新的中共红四军前敌委员会，毛泽东当选为书记。古田会议根据中央九月来信精神，通过毛泽东起草的古田会议决议，确立了思想建党、政治建军的原则。古田会议决议是中国共产党和红军建设的纲领性文献，是党和人民军队建设史上的重要里程碑。E 项，遵义会议是党的历史上一个生死攸关的转折点。","clips":[]},{"n":140,"kind":"多项选择题","answer":"AB","stem":"新石器时代前期母系氏族社会的代表性文化有（ ）。","options":{"A":"仰韶文化","B":"河姆渡文化","C":"龙山文化","D":"良渚文化","E":"红山文化"},"explanation":"新石器时代前期——母系氏族社会代表性文化有北方黄河流域的仰韶文化和南方长江流域的河姆渡文化，距今 7000-5000 年。CD 项，新石器时代后期——父系氏族社会代表性文化是北方黄河流域的龙山文化和南方长江流域的良渚文化，属父系氏族社会；E 项，红山文化不在母系氏族社会代表性文化之列。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ABCD","stem":"被称为“化石植物”的有（ ）。","options":{"A":"水杉","B":"银杉","C":"珙桐","D":"银杏","E":"松树"},"explanation":"水杉、银杉、珙桐、银杏等，被称为“化石植物”。E 项，松、竹、梅被誉为岁寒三友，松树不在“化石植物”之列。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":142,"kind":"多项选择题","answer":"ABC","stem":"巴黎的三大地标是（ ）。","options":{"A":"巴黎圣母院","B":"凯旋门","C":"埃菲尔铁塔","D":"卢浮宫","E":"凡尔赛宫"},"explanation":"巴黎圣母院、凯旋门和埃菲尔铁塔是巴黎的三大地标。埃菲尔铁塔是一座建于 1889年的镂空结构铁塔，是世界上第一座钢铁结构的高塔，也是巴黎最高的建筑物，成为巴黎和法国的象征。D 项，卢浮宫始建于 1204 年，是法国最大的王宫建筑，也是世界上最大、最古老、最著名的博物馆之一，但不在巴黎三大地标之列；E 项，凡尔赛宫也不在三大地标之列。","clips":[]},{"n":143,"kind":"多项选择题","answer":"AB","stem":"春秋战国时期沟通长江与黄河水系的工程有（ ）。","options":{"A":"邗沟","B":"鸿沟","C":"都江堰","D":"郑国渠","E":"灵渠"},"explanation":"春秋时期吴开凿邗沟，沟通了长江和淮河；战国时期魏开凿鸿沟，沟通了黄河和淮河。这两大工程打通了长江到黄河的水上交通航道，促进了中国南北方交通的发展，并成为\n\n隋代大运河的雏形。CD 项，秦在关中修建郑国渠，在蜀郡修建都江堰，主要用于农业灌溉，并非沟通长江与黄河水系的工程；E 项，灵渠首次沟通长江（湘江）与珠江（漓江）两大水系，沟通的是长江与珠江水系。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABCD","stem":"金沙江下游梯级水电开发工程建成的四座梯级水电站是（ ）。","options":{"A":"乌东德","B":"白鹤滩","C":"溪洛渡","D":"向家坝","E":"龙羊峡"},"explanation":"金沙江下游梯级水电开发工程共建成乌东德、白鹤滩、溪洛渡、向家坝四座梯级水电站，总装机容量相当于两个三峡工程，是我国西电东送项目的重要支撑。E 项，龙羊峡水电站位于黄河上游，不在金沙江下游梯级水电站之列。","clips":[]},{"n":145,"kind":"多项选择题","answer":"ABCD","stem":"从塔的造型看，主要类型有（ ）。","options":{"A":"楼阁式塔","B":"密檐式塔","C":"覆钵式塔","D":"金刚宝座塔","E":"经幢式塔"},"explanation":"从塔的造型看，主要有楼阁式塔、密檐式塔、覆钵式塔、金刚宝座塔等。楼阁式塔为数众多、历史最久，形式也最为壮观。E 项，经幢式塔不在塔的主要类型之列。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABCDE","stem":"关于明清科举考试，下列说法正确的有（ ）。","options":{"A":"一般每三年举行一次，每次两轮","B":"乡试又称“秋闹”，考取者称为“举人”","C":"会试又称“春闹”，由礼部主持","D":"殿试排名分三等，称“三甲”","E":"一甲前三名分别称状元、榜眼、探花"},"explanation":"明清科举考试制度固定，一般每三年举行一次，每次两轮。秋天在省城举行，叫“乡试”（又称“秋闹”），各府州的“生员”（或称“庠生”“秀才”）参加，考取者称为“举人”。次年春天在京师举行，叫“会试”（又称“春闹”），由礼部主持，举人才有资格参加考试，考中者称为“贡士”。排名分三等，称“三甲”，一甲取前三名，分别称为“状元”“榜眼”“探花”，赐予“进士及第”称号；二甲和三甲人数较多，分别赐予“进士出身”和“同进\n\n士出身”称号。考生如果能够在两轮三次考试中都获得第一名，即“乡试”第一名“解元”“会试”第一名“会元”“殿试”第一名“状元”，史称“连中三元”。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ABCD","stem":"下列关于新西兰的表述，正确的有（ ）。","options":{"A":"“世界边缘的国家”","B":"是世界上最大的鹿茸生产国和出口国","C":"羊肉、奶制品和粗羊毛的出口值皆为世界第一","D":"惠灵顿是世界上最南端的首都","E":"基督城是新西兰的“探险之都”"},"explanation":"新西兰，被誉为“世界边缘的国家”。是世界上最年轻的移民国家之一，也是个高度发达的资本主义国家，是世界上最大的鹿茸生产国和出口国，羊肉、奶制品和粗羊毛的出口值皆为世界第一。惠灵顿是世界上最南端的首都，有“风城”之称。E 项，基督城是英国之外最像英国的城市，也是进入南极的门户；新西兰的“探险之都”是皇后镇。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABC","stem":"天津独乐寺以“三绝”享誉中外，这“三绝”包括（ ）。","options":{"A":"古建","B":"泥塑","C":"壁画","D":"石刻","E":"砖雕"},"explanation":"独乐寺以古建、泥塑、壁画“三绝”享誉中外。D 项石刻不在“三绝”之列。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABCD","stem":"下列关于苏州的说法，正确的有（ ）。","options":{"A":"拥有两千余年建城史","B":"是大运河沿线城市中唯一以古城概念申遗的城市","C":"保持着“水陆并行、河街相邻”的双棋盘格局","D":"有“人间天堂”的美誉","E":"古称金陵"},"explanation":"苏州古称姑苏、平江，平江、山塘历史街区分别被评为中国历史文化名街和中国最受欢迎的旅游历史文化名街。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABCD","stem":"湖南红色旅游最具代表性的红色研学精品线路有（ ）等。","options":{"A":"“我的韶山行”","B":"“领袖元帅”","C":"“不忘初心，传承长征精神”","D":"“一粒种子改变世界”","E":"“重走长征路”"},"explanation":"湖南以“十步之内，必有芳草”的红色底蕴，构建起以韶山为核心、红三角为极核的红色旅游格局。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABCD","stem":"被称为西藏饮食“四宝”的是（ ）。","options":{"A":"酥油","B":"茶叶","C":"糌粑","D":"牛羊肉","E":"青稞"},"explanation":"酥油茶是藏族人民不可缺少的饮料，青稞酒度数较低，是喜庆过节所必备。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABC","stem":"黑龙江著名冰雪旅游项目有（ ）。","options":{"A":"哈尔滨冰雪大世界游园会","B":"牡丹江雪乡","C":"漠河北极村冰雪游","D":"亚布力滑雪场","E":"太阳岛雪博会"},"explanation":"著名冰雪旅游项目有哈尔滨冰雪大世界游园会、牡丹江雪乡和漠河北极村冰雪游等。D 项亚布力滑雪场驰名中外，属滑雪资源（与冰雪大世界、雪乡并称黑龙江“最早开发利用冰雪资源”的代表），题目问“旅游项目”时以教材列举的“冰雪大世界、雪乡、漠河北极村冰雪游”为准确答案；注意亚布力滑雪场位于尚志市，属滑雪区域范畴。","clips":[]},{"n":153,"kind":"多项选择题","answer":"AB","stem":"河南的寻根祭祖盛典有（ ）。","options":{"A":"淮阳太昊伏羲祭典","B":"新郑黄帝拜祖祭典","C":"洛阳牡丹文化节","D":"开封菊花文化节","E":"开封清明文化节"},"explanation":"河南有淮阳太昊伏羲祭典、新郑黄帝拜祖祭典等寻根祭祖盛典，体现“老家河南”根亲文化。","clips":[]},{"n":154,"kind":"多项选择题","answer":"AB","stem":"根据发音谐音，香港人最受欢迎的数字有（ ）。","options":{"A":"“3”“8”（与粤语“升”“发”谐音）","B":"“6”“9”（与“禄”“久”谐音）","C":"“4”","D":"“7”","E":"“5”"},"explanation":"“3”“8”与粤语“升”“发”谐音，“6”“9”与“禄”“久”谐音，最受欢迎；忌讳“4”。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABC","stem":"下列省级单位中，（ ）联合申报了世界文化非物质文化遗产中国桑丝技艺。","options":{"A":"浙江省","B":"四川省","C":"江苏省","D":"湖南省","E":"福建省"},"explanation":"中国传统桑蚕丝技艺由浙江、江苏、四川三省联合申报。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABCD","stem":"下列大院中，属于山西晋中大院民俗文化组成部分的有（ ）。","options":{"A":"祁县乔家大院","B":"祁县渠家大院","C":"灵石王家大院","D":"太谷三多堂","E":"太谷曹家大院"},"explanation":"因拍摄《大红灯笼高高挂》而闻名的祁县乔家大院，加上祁县渠家大院、灵石王家大院、太谷三多堂等，共同组成山西晋中的大院民俗文化。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABCD","stem":"下列安徽特色物产对应正确的有（ ）。","options":{"A":"歙县——枇杷之乡","B":"宁国市——山核桃之乡","C":"砀山——酥梨之乡","D":"祁门——红茶之乡","E":"泾县——宣纸之乡"},"explanation":"歙县有上千年的枇杷种植史；宁国市是“山核桃之乡”；砀山是“酥梨之乡”；祁门是“红茶之乡”。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABCD","stem":"广西民族风情旅游不可不看的“四绝”是（ ）。","options":{"A":"壮族的歌","B":"瑶族的舞","C":"苗族的节","D":"侗族的楼和桥","E":"汉族的节"},"explanation":"“壮族的歌、瑶族的舞、苗族的节、侗族的楼和桥”并称广西民族风情旅游“四绝”。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABCDE","stem":"被誉为“甘肃十大特色美食”的有（ ）等。","options":{"A":"兰州清汤牛肉面","B":"羊肉泡馍","C":"陇西腊肉","D":"静宁烧鸡","E":"酿皮子"},"explanation":"本题全部正确。甘肃十大特色美食还有浆水面、臊子面、手抓羊肉、靖远羊羔肉、藏包等。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABCD","stem":"北京地方菜的经典名菜有（ ）。","options":{"A":"北京烤鸭","B":"涮羊肉","C":"老北京烤肉","D":"京酱肉丝","E":"北京炸酱面"},"explanation":"北京烤鸭、涮羊肉、老北京烤肉、京酱肉丝是北京地方菜的经典名菜。富华斋馋饼铺、稻香村、百年义利、大顺斋等都是北京的知名食品品牌。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCDE","stem":"上海聚焦“五个中心”建设，“五个中心”是指（ ）。","options":{"A":"国际经济中心","B":"金融中心","C":"贸易中心","D":"航运中心","E":"科技创新中心"},"explanation":"“五个中心”即国际经济中心、金融中心、贸易中心、航运中心、科技创新中心。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":162,"kind":"多项选择题","answer":"ABCD","stem":"下列关于海口的说法，正确的有（ ）。","options":{"A":"别称“椰城”","B":"“海口”一名最早出现在宋代","C":"是海南省省会","D":"已有 900 多年的历史","E":"有“鹿城”之称"},"explanation":"海口别称“椰城”，“海口”一名最早出现在宋代，已有 900 多年的历史，是海南省省会。E 项错误，“鹿城”是三亚的别称。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABCD","stem":"下列关于福建交通的说法，正确的有（ ）。","options":{"A":"所有设区市实现高速铁路环线贯通","B":"全国第一个市市通高铁的省份","C":"开通全国首条“冰上丝绸之路”福州港至欧洲快速航线","D":"拥有厦门港、福州港、湄洲湾 3 个亿吨大港","E":"陆地海岸线长度居全国第一"},"explanation":"福建所有设区市实现高速铁路环线贯通，是全国第一个市市通高铁的省份；开通全国首条“冰上丝绸之路”福州港经北极至欧洲快速航线；拥有厦门港、福州港、湄洲湾 3个亿吨大港。E 项错误，福建陆地海岸线长度位居全国第二。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ABC","stem":"曲阜“三孔”是指（ ）。","options":{"A":"孔庙","B":"孔府","C":"孔林","D":"孔桥","E":"孔桥"},"explanation":"曲阜“三孔”指孔庙、孔府、孔林，是世界文化遗产。","clips":[]},{"n":165,"kind":"多项选择题","answer":"BD","stem":"下列属于吉林世界遗产的有（ ）。","options":{"A":"沈阳故宫","B":"长城（吉林段）","C":"元上都遗址","D":"中国高句丽王城、王陵及贵族墓葬","E":"九寨沟"},"explanation":"吉林文化遗产 2 项：长城（吉林段）、中国高句丽王城、王陵及贵族墓葬。沈阳故宫位于辽宁，元上都遗址位于内蒙古，九寨沟为四川世界自然遗产。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper2-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
