<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"对","stem":"根据《中华人民共和国宪法》的规定，居民委员会、村民委员会是基层群众性自治组织，不属于国家机关。","options":{"对":"正确","错":"错误"},"explanation":"城市和农村按居民居住地区设立的居民委员会或村民委员会是基层群众性自治组织，\n\n并非国家机关。","clips":[]},{"n":2,"kind":"判断题","answer":"错","stem":"雷大大景区内 3 个游览场所的门票分别为 30 元、20 元、10 元，雷大大景区拟将门票合并出售。依据《中华人民共和国旅游法》，合并后的价格不得高于 60 元，景区没有正当理由不得拒绝游客购买单项票。","options":{"对":"正确","错":"错误"},"explanation":"将不同景区的门票或者同一景区内不同游览场所的门票合并出售的，合并后的价格不\n\n得高于各单项门票的价格之和，且旅游者有权选择购买其中的单项票。本题错在“景区没有\n\n正当理由不得拒绝游客购买单项票”，游客采用何种购买方式，是游客“自主选择权”的体\n\n现，景区不存在“理由”，无论正当还是不正当。","clips":[]},{"n":3,"kind":"判断题","answer":"错","stem":"基于重大误解实施的民事法律行为，属于人民法院认定的无效民事法律行为。","options":{"对":"正确","错":"错误"},"explanation":"《民法典》第 147 条规定，基于重大误解实施的民事法律行为，行为人有权请求人民\n\n法院或者仲裁机构予以撤销。此处属于“可撤销”而不是“无效”。","clips":[]},{"n":4,"kind":"判断题","answer":"对","stem":"《文化和旅游市场信用管理规定》规定，旅游市场从业人员包括市场主体的法定代表人、主要负责人、实际控制人以及导游等有关人员。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":5,"kind":"判断题","answer":"错","stem":"违反治安管理行为的追究时效，应当从违法行为发生之日起计算。","options":{"对":"正确","错":"错误"},"explanation":"依据第 25 条，追究时效一般从违反治安管理行为发生之日起计算；但行为有连续或\n\n者继续状态的，从行为终了之日起计算。题干“应当从违法行为发生之日起计算”表述错误。","clips":[]},{"n":6,"kind":"判断题","answer":"对","stem":"根据《旅游投诉处理办法》第 15 条的规定，旅游投诉处理机构处理旅游投诉，除本办法另有规定外，实行调解制度。","options":{"对":"正确","错":"错误"},"explanation":"《旅游投诉处理办法》第 15 条明确规定，旅游投诉处理机构处理旅游投诉，除本办法\n\n另有规定外，实行调解制度。","clips":[]},{"n":7,"kind":"判断题","answer":"错","stem":"根据《旅游法》的规定，旅游经营者应当对所有为旅游者提供服务的从业人员开展经常性应急救助技能培训。","options":{"对":"正确","错":"错误"},"explanation":"根据《旅游法》第 79 条第 2 款规定，旅游经营者应当对导游、领队等开展经常性应\n\n急救助技能培训。该项培训只对“直接服务人员”。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"旅行社责任保险是财产保险。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。旅行社责任保险主要包含以下 4 个特征：属于强制保险；是财产保险；\n\n投保人和被保险人是旅行社；保险人是保险公司，赔偿的承担者是承保的保险公司。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"根据《铁路法》的规定，铁路运输中，旅客根据自愿申请办理保价运输的，应当按照保价额赔偿。","options":{"对":"正确","错":"错误"},"explanation":"根据《铁路法》第 17 条第 1 项规定：“托运人或者旅客根据自愿申请办理保价运输的，\n\n按照实际损失赔偿，但最高不超过保价额。”","clips":[]},{"n":10,"kind":"判断题","answer":"错","stem":"根据《风景名胜区条例》，风景名胜区规划分为总体规划、专项规划、详细规划三类。","options":{"对":"正确","错":"错误"},"explanation":"《风景名胜区条例》第十二条：风景名胜区规划分为总体规划和详细规划。风景名胜\n\n区规划只分为总体规划和详细规划两类；专项规划属于总体规划的组成内容，不是独立的规\n\n划类型，故判断为错。","clips":[]},{"n":11,"kind":"判断题","answer":"错","stem":"依据《博物馆条例》，博物馆从事文物等藏品的商业经营活动，不得违反办馆宗旨，不得损害观众利益。","options":{"对":"正确","错":"错误"},"explanation":"博物馆不得从事文物等藏品的商业经营活动。博物馆从事其他商业经营活动，不得违\n\n反办馆宗旨，不得损害观众利益。且根据《文物保护法》，可以从事文物买卖的单位是文物\n\n商店和经营文物拍卖的拍卖企业。","clips":[]},{"n":12,"kind":"判断题","answer":"错","stem":"党的二十大报告指出，创新性是马克思主义的本质属性，党的理论是来自人民、为了人民、造福人民的理论，人民的创造性实践是理论创新的不竭源泉。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。“创新性”应改为“人民性”。党的二十大报告指出，必须坚持人民至\n\n上。人民性是马克思主义的本质属性，党的理论是来自人民、为了人民、造福人民的理论，\n\n人民的创造性实践是理论创新的不竭源泉。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"依据习近平生态文明思想，良好生态环境是最普惠的民生福祉。","options":{"对":"正确","错":"错误"},"explanation":"坚持良好生态环境是最普惠的民生福祉。该表述与原文完全一致，故本题正确。","clips":[]},{"n":14,"kind":"判断题","answer":"错","stem":"升挂国旗时，应当举行升旗仪式。举行升旗仪式时，可以奏唱国歌。","options":{"对":"正确","错":"错误"},"explanation":"本题表述错误。《国旗法》规定，升挂国旗时，可以举行升旗仪式。举行升旗仪式时，\n\n应当奏唱国歌。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"《英烈法》规定，禁止歪曲、丑化、亵渎、否定英雄烈士事迹和精神，英雄烈士的姓名、肖像、名誉、事迹受法律保护。","options":{"对":"正确","错":"错误"},"explanation":"要保护的是：姓名、肖像、名誉、荣誉；要弘扬的是：事迹、精神。","clips":[]},{"n":16,"kind":"判断题","answer":"对","stem":"《旅游强国建设“十五五”规划》是我国首部以“旅游强国”命名的国家级五年专项规划。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。这是我国首部以“旅游强国”命名的国家级五年专项规划。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"在法国巴黎召开的联合国教科文组织执行局第 224 届会议上，我国浙江常山和四川四姑娘山顺利通过会议审议，正式成为世界地质公园。至此，我国世界地质公园增至 52 处，分布在 24 个省(区、市)及香港特别行政区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“51 处”。在法国巴黎召开的联合国教科文组织执行局第 224 届\n\n会议上，我国浙江常山和四川四姑娘山顺利通过会议审议，正式成为世界地质公园。至此，\n\n我国世界地质公园增至 51 处，分布在 24 个省(区､市)及香港特别行政区。","clips":[]},{"n":18,"kind":"判断题","answer":"对","stem":"2026 年 7 月 8 日，2025 年度国家科学技术奖揭晓，中国科学院物理研究所陈立泉院士和中国电子科技集团有限公司贲德院士获国家最高科学技术奖。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2026 年 7 月 8 日，2025 年度国家科学技术奖揭晓，共评选出 258 个\n\n项目和 11 名科技专家，中国科学院物理研究所陈立泉院士和中国电子科技集团有限公司贲\n\n德院士获国家最高科学技术奖。","clips":[]},{"n":19,"kind":"判断题","answer":"对","stem":"2026 年 7 月 10 日，长征十号乙运载火箭在海南商业航天发射场发射升空，将卫星顺利送入预定轨道后，一子级垂直返回，在海上回收平台通过网系捕获方式成功回收。此次任务是我国首次成功实施运载火箭一子级可控回收，同时也是全球首次运载火箭网系回收，标志着我国在重复使用火箭技术领域取得历史性突破。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2026 年 7 月 10 日 12 时 15 分，长征十号乙运载火箭在海南商业航天\n\n发射场发射升空，将卫星顺利送入预定轨道，火箭一二级分离约 6 分钟后，一子级垂直返回，\n\n在海上回收平台通过网系捕获方式成功回收，发射及一子级回收任务取得圆满成功。此次任\n\n务是我国首次成功实施运载火箭一子级可控回收，同时也是全球首次运载火箭网系回收，标\n\n志着我国在重复使用火箭技术领域取得历史性突破，将为加快提升我国进出空间能力奠定坚\n\n实基础。长征十号乙运载火箭成为我国首型成功实施回收的重复使用运载火箭。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"美国东部时间 2026 年 9 月 27 日晨，中国大熊猫“平平”“福双”搭乘包机抵达美国亚特兰大国际机场。根据中美双方安排，这对大熊猫将在亚特兰大动物园开启为期 10 年的旅居生活。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":21,"kind":"判断题","answer":"错","stem":"导游服务是单纯的脑力劳动，既需要丰富的知识，还需要扎实的讲解功底。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。导游服务不是单纯的脑力劳动，是脑体高度结合的劳动，既需要丰富\n\n的知识还需要扎实的讲解功底，也需要强健的体魄，长时间站立、行走。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"导游是旅游活动的核心和引领者，在整个旅游服务工作中，导游服务扮演着主导者的角色。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。导游服务是旅游服务中最具代表性的服务，起着纽带作用、标志作用、\n\n扩散作用和反馈作用，是旅游活动的核心和引领者，在整个旅游服务工作中扮演着主导者的\n\n角色。","clips":[]},{"n":23,"kind":"判断题","answer":"错","stem":"具有初级中学、中等专业学校或以上学历，身体健康，具有适应导游需要的基本知识和语言表达能力的中华人民共和国公民，就可以参加导游资格考试。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。具有高级中学、中等专业学校或以上学历，身体健康，具有适应导游\n\n需要的基本知识和语言表达能力的中华人民共和国公民，可以参加导游资格考试。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"接待计划是组团社委托有关地接社组织落实旅游团活动的契约性文件。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"当汽车高速行驶时，禁止导游在车内讲解。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。当汽车高速行驶时，禁止导游在车内站立讲解。","clips":[]},{"n":26,"kind":"判断题","answer":"错","stem":"领队应在不迟于出团前 3 日与参团旅游者取得联系，再次提醒注意事项并请旅游者回复确认。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。领队应在不迟于出团前 1 日与参团旅游者取得联系，再次提醒旅游者\n\n团队集合时间与地点、出入境及海关注意事项、公共交通工具行李要求、所需携带证件资料、\n\n根据目的地气候备齐物品等重要事项，并请旅游者回复确认。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"当游客的观点与自己的不同时，只要不涉及大原则问题，也不要立即反驳否定，要学会包容，求同存异。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"用凝练精辟的词语提炼景点突出特征的讲解方法是画龙点睛法。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。画龙点睛法是指用凝练精辟的词语提炼景点突出特征。","clips":[]},{"n":29,"kind":"判断题","answer":"对","stem":"旅游过程中，旅游者提出变更合同的要求时，导游应婉拒，特殊情况请示旅行社核定。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"导游带团时，应提前半天与饭店确认用房数、告知入住时间，让饭店提前排房号并告知导游，再与旅游者确认。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。导游应提前半天与饭店确认用房数、告知入住时间，让饭店提前排房\n\n号并告知导游，再与旅游者确认。","clips":[]},{"n":31,"kind":"判断题","answer":"错","stem":"导游带领亲子团游玩时，重点考虑家长的特殊需求，兼顾孩子的需求。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。导游要充分理解亲子团的特性，服务时兼顾孩子和父母的需求。在接\n\n待流程和服务上，重点考虑孩子的特殊需求。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"导游应提前了解政务接待的规律和特点，将“精细、周到、圆满与美好”的理念融入接待环节。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。导游应提前了解政务接待的规律和特点，将\"精细、周到、圆满与美\n\n好\"的理念融入接待环节，确保政务接待的规范性和专业性。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"个别旅游者要求前往不健康娱乐场所，导游要耐心劝阻，正面引导。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。面对个别旅游者要求前往不健康娱乐场所的情况：果断拒绝并介绍中\n\n国的传统观念和道德风貌，严肃指出不健康的娱乐活动和不正常的夜生活在中国是明令禁止\n\n的，是违法行为，会受到法律的惩处。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"如果游客不合理退团，导游告知退团后一切费用自理，且未使用费用不退。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。如果游客不合理退团，导游告知退团后一切费用自理，未使用费用按\n\n旅游合同约定或协商处理。","clips":[]},{"n":35,"kind":"判断题","answer":"对","stem":"当发生接待纠纷时，导游在处理问题时讲求有理、有利、有节，稳定旅游者情绪，引导旅游者理性维权。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。当发生接待纠纷时，导游在处理问题时要讲求有理、有利、有节，稳\n\n定旅游者情绪，引导旅游者理性维权。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"根据世界气象组织规定，当热带气旋中心持续风速达到 12 级及以上时，便被定义为台风。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。根据世界气象组织规定，当热带气旋中心附近持续风速达到 12 级及\n\n以上时，便被定义为台风。","clips":[]},{"n":37,"kind":"判断题","answer":"对","stem":"若在野外活动时遭遇雷电，应迅速回到旅游客车躲避。客车对雷电有较好的屏蔽作用。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。若在野外活动时遭遇雷电，应迅速回到旅游客车躲避。客车对雷电有\n\n较好的屏蔽作用。","clips":[]},{"n":38,"kind":"判断题","answer":"错","stem":"我国的外交护照是由人民政府外事部门颁发的。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。我国的外交护照是由外交部颁发的。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"普通列车每位旅客可以携带物品，每件物品长、宽、高之和小于等于 160 厘米，杆状物品小于等于 200 厘米。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。普通列车每位旅客可免费携带物品每件长+宽+高之和小于等于 160\n\n厘米，杆状物品小于等于 200 厘米，超过规定尺寸需办理托运。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"外籍及台湾旅客须持西藏外事办/文化和旅游部/商务厅批文，或内地司局级单位出具的许可证明购票，才可以进入西藏。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。外籍及台湾旅客须持西藏外事办/文化和旅游部/商务厅批文，或内地\n\n司局级单位出具的许可证明购票。","clips":[]},{"n":41,"kind":"单项选择题","answer":"A","stem":"2026 年 5 月 19 日是第 16 个中国旅游日，本届中国旅游日的主题是( )。","options":{"A":"乐享品质旅游，共赴美好山河","B":"畅游美丽中国，共享幸福旅程","C":"乐享文旅生活，共赏锦绣山河","D":"品质美好生活，畅游祖国山河"},"explanation":"2026 年 5 月 19 日是第 16 个中国旅游日，主题为“乐享品质旅游，共赴美好山河”，\n\n主会场设在广东省广州市。","clips":[]},{"n":42,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国宪法》的规定，中国特色社会主义最本质的特征是( )。","options":{"A":"人民当家作主","B":"中国共产党领导","C":"人民民主专政","D":"生产资料社会主义公有制"},"explanation":"宪法第 1 条第 2 款明确规定：“中国共产党领导是中国特色社会主义最本质的特征。”\n\nA 项错误，人民当家作主是人民主权原则的核心内容，而非中国特色社会主义最本质的特征；\n\nC 项错误，人民民主专政是我国的国家性质(国体)，属于国体表述；D 项错误，生产资料社\n\n会主义公有制是社会主义经济制度的基础，并非最本质特征。","clips":[]},{"n":43,"kind":"单项选择题","answer":"B","stem":"《宪法》规定，( )是我国的国体。","options":{"A":"人民代表大会制度","B":"人民民主专政","C":"政治协商制度","D":"工农联盟"},"explanation":"《宪法》第 1 条规定，中华人民共和国是工人阶级领导的、以工农联盟为基础的人民\n\n民主专政的社会主义国家。因此，人民民主专政是我国的国体。","clips":[]},{"n":44,"kind":"单项选择题","answer":"B","stem":"根据《旅游法》的规定，旅行社依照本法规定将包价旅游合同中的接待业务委托给地接社履行的，应当在包价旅游合同中载明( )的基本信息。","options":{"A":"委托社","B":"地接社","C":"委托社和地接社","D":"委托社或地接社"},"explanation":"《旅游法》第 60 条，旅行社依照本法规定将包价旅游合同中的接待业务委托给地接社\n\n履行的，应当在包价旅游合同中载明地接社的基本信息。","clips":[]},{"n":45,"kind":"单项选择题","answer":"A","stem":"国家倡导健康、文明、环保的旅游方式，支持和鼓励( )开展旅游公益宣传。","options":{"A":"各类社会机构","B":"各类社会团体","C":"旅游行业组织","D":"全媒体"},"explanation":"《旅游法》第 5 条：国家倡导健康、文明、环保的旅游方式，支持和鼓励各类社会机\n\n构开展旅游公益宣传，对促进旅游业发展做出突出贡献的单位和个人给予奖励。","clips":[]},{"n":46,"kind":"单项选择题","answer":"C","stem":"李某在带团中，因旅游者不参加其安排的另行付费项目而拒不履行合同。旅行社具备履行条件，经旅游者要求李某仍拒绝履行合同，造成旅游者人身损害、滞留的严重后果。对此，旅行社除了依法承担违约责任外，旅游者还可以要求旅行社( )。","options":{"A":"返还旅游费用","B":"旅游费用两倍的赔偿金","C":"旅游费用 1 倍以上 3 倍以下的赔偿金","D":"尚未发生费用 1 倍以上 3 倍以下的赔偿金"},"explanation":"《旅游法》第 70 条，旅行社不履行包价旅游合同义务或者履行合同义务不符合约定的，\n\n应当依法承担继续履行、采取补救措施或者赔偿损失等违约责任；造成旅游者人身损害、财\n\n产损失的，应当依法承担赔偿责任。旅行社具备履行条件，经旅游者要求仍拒绝履行合同，\n\n造成旅游者人身损害、滞留等严重后果的，旅游者还可以要求旅行社支付旅游费用 1 倍以上\n\n3 倍以下的赔偿金。","clips":[]},{"n":47,"kind":"单项选择题","answer":"B","stem":"《旅游法》规定，国家鼓励和支持发展( )和培训，提高旅游从业人员素质。","options":{"A":"导游继续学习","B":"旅游职业教育","C":"导游等级提升","D":"旅游高等教育"},"explanation":"《旅游法》第 27 条，国家鼓励和支持发展旅游职业教育和培训，提高旅游从业人员素\n\n质。","clips":[]},{"n":48,"kind":"单项选择题","answer":"A","stem":"《民法典》规定，当事人可以约定一方向对方给付定金作为债权的担保，定金的数额由当事人约定，但是不得超过主合同标的额的( )。","options":{"A":"20%","B":"15%","C":"10%","D":"5%"},"explanation":"《民法典》第 586 条，定金的数额由当事人约定；但是不得超过主合同标的额的 20%，\n\n超过部分不产生定金的效力。","clips":[]},{"n":49,"kind":"单项选择题","answer":"C","stem":"无民事行为能力或者限制民事行为能力的成年人，由下列有监护能力的人按顺序担任监护人，排在第一位的是( )。","options":{"A":"父母","B":"子女","C":"配偶","D":"其他近亲属"},"explanation":"《民法典》第 28 条无民事行为能力或者限制民事行为能力的成年人，由下列有监护能\n\n力的人按顺序担任监护人：(一)配偶；(二)父母、子女；(三)其他近亲属；(四)其他愿意担\n\n任监护人的个人或者组织，但是须经被监护人住所地的居民委员会、村民委员会或者民政部\n\n门同意。","clips":[]},{"n":50,"kind":"单项选择题","answer":"B","stem":"《民法典》规定，自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人( )请求其他参加者承担侵权责任；但是，其他参加者对损害的发生有故意或者重大过失的除外。","options":{"A":"可以","B":"不得","C":"应当","D":"有权"},"explanation":"《民法典》第 1176 条规定，自愿参加具有一定风险的文体活动，因其他参加者的行为\n\n受到损害的，受害人不得请求其他参加者承担侵权责任；但是，其他参加者对损害的发生有\n\n故意或者重大过失的除外。","clips":[]},{"n":51,"kind":"单项选择题","answer":"A","stem":"依据《中华人民共和国民法典》第 142 条的规定，有相对人的意思表示的解释，应当按照所使用的词句，结合相关条款、行为的性质和目的、习惯以及( )原则，确定意思表示的含义。","options":{"A":"诚信","B":"平等","C":"合理","D":"公平"},"explanation":"《民法典》第 142 条规定，有相对人的意思表示的解释，应当按照所使用的词句，结\n\n合相关条款、行为的性质和目的、习惯以及诚信原则，确定意思表示的含义。","clips":[]},{"n":52,"kind":"单项选择题","answer":"B","stem":"《民法典》规定，对格式条款有两种以上解释的，应当( )。","options":{"A":"按照通常理解予以解释","B":"作出不利于提供格式条款一方的解释","C":"采用非格式条款","D":"按双方约定予以解释"},"explanation":"《民法典》第 498 条规定，对格式条款的理解发生争议的，应当按照通常理解予以解\n\n释。对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释。格式条款和\n\n非格式条款不一致的，应当采用非格式条款。","clips":[]},{"n":53,"kind":"单项选择题","answer":"B","stem":"根据《民法典》的规定，侵害他人财产的，财产损失按照( )或者其他合理方式计算。","options":{"A":"侵害发生时的市场价格","B":"损失发生时的市场价格","C":"侵害发生时的政府指导价","D":"损失发生时的政府指导价"},"explanation":"《民法典》第 1184 条，侵害他人财产的，财产损失按照损失发生时的市场价格或者其\n\n他合理方式计算。","clips":[]},{"n":54,"kind":"单项选择题","answer":"D","stem":"根据《民法典》的规定，以下( )属于无效的民事法律行为。","options":{"A":"第三人实施欺诈，使一方在违背真实意思的情况下实施的民事法律行为","B":"欺诈手段实施的民事法律行为","C":"胁迫手段实施的民事法律行为","D":"违背公序良俗的民事法律行为"},"explanation":"“第三人欺诈、欺诈手段、胁迫手段”实施的民事法律行为，均属于可撤销的民事法\n\n律行为。","clips":[]},{"n":55,"kind":"单项选择题","answer":"D","stem":"旅游客车在正常行驶中，突然从道路上跑出来一只宠物犬。由于事发突然，驾驶员紧急变向，冲到道路另一侧，造成车内部分游客受伤。事实证明，宠物犬距离旅游车还有一段距离。对游客的损失应当承担责任的是( )。","options":{"A":"汽车驾驶员和宠物犬的主人","B":"汽车驾驶员","C":"宠物犬的主人","D":"组织旅游活动的旅行社和宠物犬的主人"},"explanation":"根据《民法典》第 182 条，因紧急避险造成损害的，由引起险情发生的人承担民事责\n\n任。故宠物犬主人需要承担责任。紧急避险采取措施不当或者超过必要的限度，造成不应有\n\n的损害的，紧急避险人应当承担适当的责任。本题属于汽车驾驶员紧急避险采取措施不当的\n\n情形，故应适当承担责任。旅游汽车驾驶员属于旅行社的雇员，由旅行社承担替代责任，故\n\n由旅行社和宠物犬的主人共同承担责任。","clips":[]},{"n":56,"kind":"单项选择题","answer":"A","stem":"《旅行社条例》规定，允许旅行社向银行寻求信用支持，即以银行担保的形式交纳质量保证金。根据规定，担保期限不得少于( )；担保期届满前( )内，续办担保手续。","options":{"A":"1 年，3 个工作日","B":"2 年，1 个月","C":"1 年，1 个月","D":"2 年，3 个工作日"},"explanation":"为了降低旅行社经营成本、避免资金闲置，《旅行社条例》还允许旅行社向银行寻求\n\n信用支持，即银行担保；担保期限不得少于 1 年；担保期届满前 3 个工作日内，续办担保手\n\n续。","clips":[]},{"n":57,"kind":"单项选择题","answer":"D","stem":"旅行社设立分社的，应当自设立登记之日起 3 个工作日内，向( )。","options":{"A":"分社所在地的工商行政管理部门备案","B":"设立社所在地的工商行政管理部门备案","C":"设立社所在地的旅游行政管理部门办理设立登记","D":"分社所在地的旅游行政管理部门备案"},"explanation":"旅行社设立分社的，应当向分社所在地的工商行政管理部门办理设立登记，并自设立\n\n登记之日起 3 个工作日内向分社所在地的旅游行政管理部门备案。","clips":[]},{"n":58,"kind":"单项选择题","answer":"B","stem":"在线旅游经营者违反有关规定，为以不合理低价组织的旅游活动提供交易机会的，由县级以上文化和旅游主管部门责令改正，给予警告，可以并处( )罚款。","options":{"A":"1 万元以上 3 万元以下","B":"3 万元以下","C":"1 万元以上 10 万元以下","D":"1 万元以下"},"explanation":"《在线旅游经营服务管理暂行规定》第 36 条规定，在线旅游经营者违反本规定第 18\n\n条规定，为以不合理低价组织的旅游活动提供交易机会的，由县级以上文化和旅游主管部门\n\n责令改正，给予警告，可并处 3 万元以下罚款。","clips":[]},{"n":59,"kind":"单项选择题","answer":"C","stem":"《文化和旅游市场信用管理规定》规定，( )内第 3 次认定为轻微失信主体的，应当认定为严重失信主体。","options":{"A":"36 个月","B":"24 个月","C":"12 个月","D":"6 个月"},"explanation":"12 个月内第 3 次认定为轻微失信主体的，应当认定为严重失信主体。文化和旅游市\n\n场主体和从业人员有下列情形之一的，应当认定为轻微失信主体：①存在“捂票炒票”、虚\n\n假宣传、未履行相关义务、违反公序良俗等行为，造成不良社会影响的；②因故意或者重大\n\n过失严重损害旅游者合法权益，但尚不符合严重失信主体认定情形的；③在旅游经营活动中\n\n存在安全隐患，未在指定期限内整改完毕的；④拒不配合投诉处置、执法检查，拒不履行行\n\n政处罚决定，造成不良社会影响的；⑤12 个月内受到文化和旅游主管部门两次较大数额罚\n\n款行政处罚，造成不良社会影响的；⑥其他应当认定为轻微失信主体的情形。","clips":[]},{"n":60,"kind":"单项选择题","answer":"C","stem":"某旅行社经营范围包括国内旅游业务、入境旅游业务和出境旅游业务，并设有 2 家经营国内旅游业务和入境旅游业务的分公司、1 家经营出境旅游业务的分公司，以及两家经营对应业务的服务网点。则该旅行社应当向其旅游服务质量保证金账户共存入( )。","options":{"A":"140 万元","B":"150 万元","C":"180 万元","D":"210 万元"},"explanation":"经营入境旅游业务和国内旅游业务的旅行社，需要交纳 20 万元质量保证金，经营出\n\n境旅游业务的旅行社，需要交纳 120 万元，经营入境旅游业务和国内旅游业务，同时还经营\n\n出境旅游业务的旅行社，应交纳 140 万元。每设立一个经营国内旅游业务和入境旅游业务的\n\n分社，应当向其质量保证金账户增存 5 万元；每设立一个经营出境旅游业务的分社，应当向\n\n其质量保证金账户增存 30 万元。服务网点无需增加质量保证金。120 万+20 万+2*5 万+30\n\n万=180 万。","clips":[]},{"n":61,"kind":"单项选择题","answer":"D","stem":"雷大大旅行社与旅游者卢女士签订境内旅游合同，约定 2026 年 10 月 10 日出发。出发当日，雷大大旅行社告知卢女士，由于飞机舱位不足不能成行。根据《旅行社服务质量赔偿标准》的规定，旅行社应当按照旅游费用总额的( )向卢女士承担违约金。","options":{"A":"5%","B":"10%","C":"15%","D":"20%"},"explanation":"《旅行社服务质量赔偿标准》第 4 条规定，旅行社与旅游者订立合同或收取旅游者预\n\n付旅游费用后，因旅行社原因不能成行的，旅行社应在合理期限内通知旅游者，否则按下列\n\n标准承担赔偿责任：出发当日，支付旅游费用总额 20%的违约金。","clips":[]},{"n":62,"kind":"单项选择题","answer":"B","stem":"导游员老王在组织旅游者前往机场时，由于路途遭遇交通事故，未能乘坐行程单上预先安排的航班。根据《旅行社服务质量赔偿标准》的规定，雷大大旅行社应当赔偿游客的直接经济损失，并支付( )违约金。","options":{"A":"旅游费用总额的 20%","B":"直接经济损失的 20%","C":"直接经济损失的 30%","D":"旅游费用总额的 30%"},"explanation":"因旅行社原因未乘坐公共交通工具的。旅行社应赔偿旅游者的直接经济损失，并支付\n\n直接经济损失 20%的违约金。","clips":[]},{"n":63,"kind":"单项选择题","answer":"C","stem":"根据《导游管理办法》的规定，导游以欺骗、贿赂等不正当手段取得导游人员资格证、导游证，申请人在( )内不得再次申请导游执业许可。","options":{"A":"1 年","B":"2 年","C":"3 年","D":"5 年"},"explanation":"《导游管理办法》第 34 条，导游以欺骗、贿赂等不正当手段取得导游人员资格证、导\n\n游证，申请人在 3 年内不得再次申请导游执业许可。","clips":[]},{"n":64,"kind":"单项选择题","answer":"A","stem":"根据《导游管理办法》的规定，导游违反法律法规规定，以下( )情形可由县级以上旅游主管部门责令改正，并可以处 1000 元以下罚款。","options":{"A":"未申请变更导游证信息的","B":"导游以欺骗、贿赂等不正当手段取得导游证","C":"导游出借导游人员资格证","D":"导游擅自委托他人代为提供导游服务"},"explanation":"《导游管理办法》第 33 条规定，违反本办法规定，导游有下列行为的，由县级以上旅\n\n游主管部门责令改正，并可以处 1000 元以下罚款；情节严重的，可以处 1000 元以上 5000\n\n元以下罚款：未按期报告信息变更情况的；未申请变更导游证信息的；未更换导游身份标识\n\n的；不依照本办法第二十四条规定采取相应措施的；未按规定参加旅游主管部门组织的培训\n\n的；向负责监督检查的旅游主管部门隐瞒有关情况、提供虚假材料或者拒绝提供反映其活动\n\n情况的真实材料的；在导游服务星级评价中提供虚假材料的。以欺骗、贿赂等不正当手段取\n\n得导游人员资格证、导游证，除依法撤销相关证件外，可以由所在地旅游主管部门处 1000\n\n元以上 5000 元以下罚款；申请人在 3 年内不得再次申请导游执业许可。出租、出借导游人\n\n员资格证，擅自委托他人代为提供导游服务，由县级以上旅游主管部门责令改正，并可以处\n\n2000 元以上 1 万元以下罚款。","clips":[]},{"n":65,"kind":"单项选择题","answer":"B","stem":"《导游人员管理条例》规定，各级旅游主管部门应当积极组织开展导游培训，每年累计培训时间不得少于( )小时。","options":{"A":"48","B":"24","C":"12","D":"4"},"explanation":"各级旅游主管部门应当积极组织开展导游培训，培训内容应当包括政策法规、安全生\n\n产、突发事件应对和文明服务等，培训方式可以包括培训班、专题讲座和网络在线培训等，\n\n每年累计培训时间不得少于 24 小时。培训不得向参加人员收取费用。","clips":[]},{"n":66,"kind":"单项选择题","answer":"D","stem":"依据《导游人员管理条例》，具有高级中学、中等专业学校或者以上学历，身体健康，具有适应( )的基本知识和语言表达能力的中华人民共和国公民，可以参加导游人员资格考试。","options":{"A":"社会需要","B":"旅游者需要","C":"旅游业发展需要","D":"导游需要"},"explanation":"国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如下：(1)\n\n中华人民共和国公民；(2)具有高级中学、中等专业学校或者以上学历；(3)身体健康；(4)\n\n具有适应导游需要的基本知识和语言表达能力。","clips":[]},{"n":67,"kind":"单项选择题","answer":"D","stem":"下列关于规范导游专座的说法，正确的是( )。","options":{"A":"导游专座应当设置在旅游大巴驾驶员后第一排乘客座椅靠通道侧位置","B":"已设置折叠座椅的旅游大巴可以在合理范围内继续供导游使用","C":"导游应自觉系好安全带，不得站立讲解","D":"旅游大巴在旅游服务过程中，应当配备印有“导游专座”字样的座套"},"explanation":"导游专座的位置应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置；折\n\n叠座椅的旅游大巴已经不允许使用；导游应当在旅游车辆“导游专座”就座。","clips":[]},{"n":68,"kind":"单项选择题","answer":"C","stem":"依据《中华人民共和国消费者权益保护法实施条例》，有关行政部门受理消费者投诉，消费者与经营者同意调解的，应当在受理之日起( )日内调解完毕，鉴定、检测时间不计入该期限。","options":{"A":"30","B":"45","C":"60","D":"90"},"explanation":"有关行政部门受理投诉后，消费者和经营者同意调解的，有关行政部门应当依据职责\n\n及时调解，并在受理之日起 60 日内调解完毕；调解不成的应当终止调解。调解过程中需要\n\n鉴定、检测的，鉴定、检测时间不计算在 60 日内。","clips":[]},{"n":69,"kind":"单项选择题","answer":"D","stem":"依据《中华人民共和国消费者权益保护法》，向消费者提供消费信息和咨询服务，提高消费者维护自身合法权益的能力，引导文明、健康、节约资源和保护环境的消费方式，( )。","options":{"A":"既是消费者协会的权利也是其义务","B":"是消费者协会承担的社会责任","C":"是消费者协会的法定权力","D":"是消费者协会履行的公益性职责"},"explanation":"《中华人民共和国消费者权益保护法》第 37 条规定了消费者协会履行的 8 条公益性职\n\n责。","clips":[]},{"n":70,"kind":"单项选择题","answer":"C","stem":"下列造成严重社会不良影响的行为中，属于旅游不文明行为记录对象的是( )。","options":{"A":"因侵害旅游者合法权益，被吊销旅游业务经营许可证的旅行社","B":"过错而导致在文化遗产上刻画涂污的 12 岁孩子的父母","C":"不尊重旅游目的地的风俗禁忌的导游","D":"违约造成游客严重滞留的某旅行社"},"explanation":"旅游不文明行为记录的是旅游者和旅游从业人员的不文明行为。“因侵害旅游者合法\n\n权益……”“违约造成……”两选项属于文化市场主体和从业人员认定为严重失信主体的情\n\n形；“过错而导致……”因监护人存在重大过错导致被监护人发生旅游不文明行为，将监护\n\n人纳入“旅游不文明行为记录”，此处“过错”不是重大过错。","clips":[]},{"n":71,"kind":"单项选择题","answer":"D","stem":"与一般纠纷相比，下列属于旅游纠纷特点的是( )。","options":{"A":"旅游纠纷的法律关系单一，仅涵盖合同、侵权等民事关系","B":"旅游消费所涉的金额一般较大","C":"旅游纠纷的双方地位平等","D":"旅游纠纷的内容广泛多样，涉及住宿、餐饮、购物、安全、卫生、交通、保险等诸多方面"},"explanation":"旅游纠纷的特点包括：(1)法律关系复杂，涵盖民事、行政和刑事法律关系；(2)内容\n\n广泛多样，除了与旅游合同、旅游服务等有关外，还会涉及住宿、餐饮、购物、安全、卫生、\n\n交通、保险等诸多方面；(3)旅游消费所涉的金额一般较小；(4)双方地位不平等，旅游纠纷\n\n风险防范成本高、旅游者维权难度大，旅游者的弱者地位较为明显。A 错在“法律关系单一、\n\n仅涵盖民事”；B 错在“金额一般较大”；C 错在“双方地位平等”。","clips":[]},{"n":72,"kind":"单项选择题","answer":"C","stem":"旅游经营者提供服务时有欺诈行为，旅游者请求旅游经营者按接受服务费用的( )承担惩罚性赔偿责任的，人民法院应予支持。","options":{"A":"同额","B":"5 倍","C":"3 倍","D":"2 倍"},"explanation":"《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》(2020 修正)第十五\n\n条第 2 款：旅游经营者提供服务时有欺诈行为，旅游者依据消费者权益保护法第五十五条第\n\n一款规定请求旅游经营者承担惩罚性赔偿责任的，人民法院应予支持。《消费者权益保护法》\n\n第 55 条第 1 款：欺诈，增加赔偿金额为价款或服务费三倍，不足 500 元按 500 元。","clips":[]},{"n":73,"kind":"单项选择题","answer":"D","stem":"根据《旅游投诉处理办法》的规定，下列符合旅游投诉受理条件的情形有( )。","options":{"A":"人民法院已经受理的","B":"投诉人与投诉事项有直接或间接利害关系","C":"社会调解机构已经处理的","D":"超过旅游合同履行期限届 30 天的"},"explanation":"A 项错误：人民法院已经受理的，属于不予受理情形。B 项错误：受理要求是直接利\n\n害关系，间接利害关系不符合条件。C 项错误：社会调解机构已经处理的，属于不予受理情\n\n形。D 项正确：法定最长投诉时限是合同履行期限届满 90 日，届满 30 日尚未超期，符合受\n\n理时限要求。《旅游投诉处理办法》第九条旅游投诉应当符合下列条件：(一)投诉人与投诉\n\n事项有直接利害关系；(二)有明确的被投诉人、具体的投诉请求。第十一条旅游投诉有下列\n\n情形之一的，不予受理：(一)不属于旅游投诉处理机构管辖范围的；(二)超过旅游合同履行\n\n期限届满之日九十日的；(三)人民法院、仲裁机构、其他行政管理部门、消费者组织或者人\n\n民调解组织等机构已经受理或者处理的；(四)旅游投诉处理机构已经作出处理，且没有新情\n\n况、新理由的；(五)不符合本办法第九条规定的受理条件的；(六)本办法规定情形之外的经\n\n济纠纷、劳动人事纠纷等其他纠纷。","clips":[]},{"n":74,"kind":"单项选择题","answer":"A","stem":"根据《旅游投诉处理办法》第 23 条的规定，旅游投诉调解不成的，旅游投诉处理机构应当( )。","options":{"A":"终止调解，制作《旅游投诉终止调解书》","B":"直接移送人民法院处理","C":"协调双方继续调解","D":"直接移送仲裁机构仲裁"},"explanation":"《旅游投诉处理办法》第 23 条规定：“调解不成的，应当终止调解，制作《旅游投诉\n\n终止调解书》，并以适当方式告知投诉人与被投诉人。调解不成或者达成调解协议后没有执\n\n行的，投诉人可以按照有关法律、法规的规定，向仲裁机构申请仲裁或者向人民法院提起诉\n\n讼。”调解须以双方自愿为基础，机构不得强制调解；仲裁须以仲裁协议为前提，诉讼由投\n\n诉人自行提起，旅游投诉处理机构无权直接移送。","clips":[]},{"n":75,"kind":"单项选择题","answer":"C","stem":"根据《安全生产法》，从业人员发现直接危及人身安全的紧急情况时，以下行为合法的是( )。","options":{"A":"应当继续作业，不得擅自停止","B":"应立即报告，等待指示后再行动","C":"有权停止作业或在采取应急措施后撤离","D":"应先告知主管领导，然后撤离"},"explanation":"根据《安全生产法》第 55 条规定，从业人员在发现直接危及人身安全的紧急情况时，\n\n有权停止作业或者在采取可能的应急措施后撤离作业场所。","clips":[]},{"n":76,"kind":"单项选择题","answer":"C","stem":"依据《旅行社责任保险管理办法》的规定，旅行社投保责任险后，在( )的保险期限内，如果发生投保范围内的赔偿责任，由承保的保险公司承担。","options":{"A":"3 个月","B":"6 个月","C":"1 年","D":"2 年"},"explanation":"旅行社投保责任险后，在 1 年的保险期限内，如果发生投保范围内的赔偿责任，由承\n\n保的保险公司承担。","clips":[]},{"n":77,"kind":"单项选择题","answer":"B","stem":"当旅游目的地风险提示为四级时，旅行社应当( )。","options":{"A":"采取必要的安全防范措施","B":"加强对旅游者的提示","C":"停止组带团前往风险区域","D":"调整或者中止行程"},"explanation":"风险提示发布后，旅行社应当根据风险级别采取下列措施：(1)四级风险的，加强对\n\n旅游者的提示；(2)三级风险的，采取必要的安全防范措施；(3)二级风险的，停止组团或者\n\n带团前往风险区域；已在风险区域的，调整或者中止行程；(4)一级风险的，停止组团或者\n\n带团前往风险区域，组织已在风险区域的旅游者撤离。","clips":[]},{"n":78,"kind":"单项选择题","answer":"B","stem":"根据《出入境管理法》的规定，外国人从事与签证不相符的活动，可以处( )。","options":{"A":"遣送回国","B":"限期出境","C":"限期离境","D":"驱逐出境"},"explanation":"《出境入境管理法》第 81 条第 1 款规定：“外国人从事与停留居留事由不相符的活动，\n\n或者有其他违反中国法律、法规规定，不适宜在中国境内继续停留居留情形的，可以处限期\n\n出境。”因此，正确选项是 B。限期出境是对此类违法行为的法定处罚措施，给予外国人一\n\n定期限主动离境。","clips":[]},{"n":79,"kind":"单项选择题","answer":"B","stem":"《旅馆业治安管理办法》规定，旅馆对旅客遗留的物品，应当妥为保管，设法归还原主或揭示招领，经招领( )后无人认领的，登记造册，送当地公安机关按拾遗物品处理。","options":{"A":"1 个月","B":"3 个月","C":"6 个月","D":"12 个月"},"explanation":"《旅馆业治安管理办法》第 8 条规定，旅馆对旅客遗留的物品，应当妥为保管，设法\n\n归还原主或揭示招领；经招领 3 个月后无人认领的，要登记造册，送当地公安机关按拾遗物\n\n品处理，对违禁物品和可疑物品，应当及时报告公安机关处理。","clips":[]},{"n":80,"kind":"单项选择题","answer":"C","stem":"依据《娱乐场所管理条例》，娱乐场所营业时间为每日上午 8 点到( )。","options":{"A":"次日凌晨零点","B":"次日凌晨 1 点","C":"次日凌晨 2 点","D":"次日凌晨 3 点"},"explanation":"《娱乐场所管理条例》第 28 条规定，每日凌晨 2 时至上午 8 时，娱乐场所不得营业。","clips":[]},{"n":81,"kind":"单项选择题","answer":"C","stem":"根据《自然保护区条例》的规定，自然保护区受损自然生态系统的修复应当坚持( )。","options":{"A":"人工修复为主","B":"科技助力为主","C":"自然恢复为主","D":"迁地保护为主"},"explanation":"《自然保护区条例》第二十五条:自然保护区区域内受损自然生态系统修复、生态廊道\n\n连通、重要栖息地恢复等应当坚持自然恢复为主；确有必要开展种群调控、树种更新等人工\n\n修复活动的，应当充分听取有关方面意见，按照有关规定制定科学合理的修复方案并依法实\n\n施。A 项错误，人工修复只是在确有必要时作为补充手段，并非修复工作的主导原则，依据\n\n条例第二十五条。B 项错误，条例规定的是自然恢复为主，没有“科技助力为主”的表述，\n\n属于干扰项。C 项正确，与条例第二十五条“坚持自然恢复为主”的规定一致。D 项错误，\n\n迁地保护是针对珍稀濒危物种的救助保护方式，不是生态系统修复原则，依据条例第二十五\n\n条。","clips":[]},{"n":82,"kind":"单项选择题","answer":"B","stem":"根据《风景名胜区条例》的规定，国家级风景名胜区的总体规划由下列( )组织编制。","options":{"A":"国务院林业草原主管部门","B":"省、自治区、直辖市人民政府林业草原主管部门","C":"省级人民政府","D":"县级人民政府"},"explanation":"《风景名胜区条例》第十六条:国家级风景名胜区规划由省、自治区、直辖市人民政府\n\n林业草原主管部门组织编制。省级风景名胜区规划由县级人民政府组织编制。","clips":[]},{"n":83,"kind":"单项选择题","answer":"B","stem":"党的二十大报告指出，坚持和发展马克思主义，必须同( )相结合。只有植根本国、本民族历史文化沃土，马克思主义真理之树才能根深叶茂。","options":{"A":"中国式现代化","B":"中华优秀传统文化","C":"马列主义","D":"马克思主义"},"explanation":"坚持和发展马克思主义，必须同中华优秀传统文化相结合。只有植根本国、本民族历\n\n史文化沃土，马克思主义真理之树才能根深叶茂。","clips":[]},{"n":84,"kind":"单项选择题","answer":"D","stem":"我们确立和坚持( )在意识形态领域指导地位的根本制度。","options":{"A":"习近平新时代中国特色社会主义思想","B":"中华优秀传统文化","C":"毛泽东思想","D":"马克思主义"},"explanation":"党的二十大报告指出，我们确立和坚持马克思主义在意识形态领域指导地位的根本制\n\n度。","clips":[]},{"n":85,"kind":"单项选择题","answer":"A","stem":"《港区国安法》规定，任何人组织、策划、实施或者参与实施( )行为之一的，即属犯颠覆国家政权罪。","options":{"A":"以武力旨在颠覆国家政权行为","B":"分裂国家的行为","C":"造成严重社会危害的恐怖活动","D":"破坏国家统一行为"},"explanation":"《港区国安法》第 22 条对“颠覆国家政权罪”的规定，任何人组织、策划、实施或者\n\n参与实施以武力、威胁使用武力或者其他非法手段旨在颠覆国家政权行为之一的，即属犯罪。","clips":[]},{"n":86,"kind":"单项选择题","answer":"A","stem":"依据文化和旅游部《旅游强国建设“十五五”规划》，规划指出，旅游业日益成为( )。","options":{"A":"新兴的战略性支柱产业和具有显著时代特征的民生产业、幸福产业","B":"国民经济的支柱产业和基础性产业","C":"现代服务业的龙头产业和先导性产业","D":"战略性新兴产业和国民经济主导产业"},"explanation":"旅游业日益成为新兴的战略性支柱产业和具有显著时代特征的民生产业、幸福产业。\n\nA 项正确，与规划原文对旅游业产业地位的定位完全一致，故 A 正确。","clips":[]},{"n":87,"kind":"单项选择题","answer":"A","stem":"( )是指实施旅游接待计划，在境内旅游目的地为旅游者提供导游服务的人员。","options":{"A":"地陪","B":"全陪","C":"领队","D":"计调"},"explanation":"地陪是指实施旅游接待计划，在境内旅游目的地为旅游者提供导游服务的人员。","clips":[]},{"n":88,"kind":"单项选择题","answer":"C","stem":"如果旅游车在行程中遇到大雨，导游老王应该提醒司机( )。","options":{"A":"尽量在雨中抓紧赶路，找到安全的停车地点","B":"因特殊情况不得不冒雨行进，当路面有积水且情况不明时，快速通过不要逗留","C":"尽量避开电线杆、路灯等含金属物体，防止因积水导电引发触电事故","D":"当发现上游来水突然变得浑浊且水位快速上涨时，呆在车里，避免被水冲走"},"explanation":"(1)避免雨中赶路：尽量不在雨中赶路，减少不必要的风险；(2)做好探路工作：若因\n\n特殊情况不得不冒雨行进，要特别注意沿途可能存在的安全隐患。当路面有积水且情况不明\n\n时，不可轻易踏足，要先利用树枝、木棍等工具进行探路，判断积水深度和地面状况；(3)\n\n避开危险物体：尽量避开电线杆、路灯等含金属物体，防止因积水导电引发触电事故；(4)\n\n警惕山洪或泥石流：当发现上游来水突然变得浑浊且水位快速上涨时，要高度警惕山洪或泥\n\n石流的发生，迅速引导旅游者向高地或指定安全区域转移。","clips":[]},{"n":89,"kind":"单项选择题","answer":"B","stem":"世界上第一家商业性旅行社成立于( )年。","options":{"A":"1841","B":"1845","C":"1846","D":"1865"},"explanation":"1845 在莱斯特创办了世界上第一家商业性旅行社。","clips":[]},{"n":90,"kind":"单项选择题","answer":"A","stem":"1927 年，中国第一家旅行社(中国旅行社)的创始人是( )。","options":{"A":"陈光甫","B":"托马斯·库克","C":"顾拜旦","D":"李建武"},"explanation":"1927 年 6 月：旅游部独立更名为“中国旅行社”，标志中国近代旅游企业化，陈光甫\n\n被尊为“中国近代旅游业的创始人”。","clips":[]},{"n":91,"kind":"单项选择题","answer":"B","stem":"( )年起，国家开始举办导游资格考试。","options":{"A":"1988","B":"1989","C":"1994","D":"1999"},"explanation":"1989 年：举行全国导游资格考试(每年一次)。","clips":[]},{"n":92,"kind":"单项选择题","answer":"C","stem":"导游能够及时准确反馈旅游者意见，帮助旅行社和旅游行政部门了解需求，及时发现和解决问题，提升服务水平与竞争力，这是导游( )的集中体现。","options":{"A":"纽带作用","B":"标志作用","C":"反馈作用","D":"扩散作用"},"explanation":"反馈作用：1.收集反馈信息•及时准确反馈旅游者意见/建议/要求(涉及行程合理性、\n\n住宿舒适度、餐饮满意度等)至相关部门；2.促进质量提升•帮助旅行社和旅游行政部门了解\n\n需求，针对性提升服务质量和满意度；3.强化行业监管•加强旅游行业自我监督和管理，及\n\n时发现解决问题，提升服务水平与竞争力，导游需积极收集传递信息，推动行业健康发展。","clips":[]},{"n":93,"kind":"单项选择题","answer":"C","stem":"下列选项中，按照就业方式划分的是( )。","options":{"A":"领队","B":"中文导游","C":"专职导游","D":"高级导游"},"explanation":"按照就业方式划分：旅行社专职导游和旅行社兼职导游。","clips":[]},{"n":94,"kind":"单项选择题","answer":"C","stem":"在工作场合尤其要注意礼貌，一般接打电话不超过( )。","options":{"A":"1 分钟","B":"2 分钟","C":"3 分钟","D":"5 分钟"},"explanation":"通话时间以短为佳、宁短勿长，一般限定在 3 分钟之内。","clips":[]},{"n":95,"kind":"单项选择题","answer":"D","stem":"下列选项中，对于握手顺序描述正确的是( )。","options":{"A":"平辈之间，男士为了尊重女士，应先伸手","B":"晚辈见到长辈，应率先伸出双手握手","C":"若与多人握手，顺序是先长辈后晚辈，先客人后主人，先上级后下级，先女士后男士","D":"宾主之间，作为主人，对到来的客人，先伸出手握手"},"explanation":"一般讲究“尊者决定”；即待女士、长辈、职位高者伸出手之后，男士、晚辈、职位\n\n低者方可伸手去呼应；平辈之间，应主动握手；宾主之间，作为主人，对到来的客人，不论\n\n男女、长幼，均应先伸出手去，表示热烈欢迎；若一个人要与许多人握手，顺序是：先长辈\n\n后晚辈，先主人后客人，先上级后下级，先女士后男士。","clips":[]},{"n":96,"kind":"单项选择题","answer":"B","stem":"导游应该选择中性色或者饱和度低的着装，例如( )。","options":{"A":"黑、白、蓝","B":"黑、白、灰","C":"红、白、蓝","D":"绿、蓝、灰"},"explanation":"导游着装主色调可选择中性色(黑、白、灰、藏青等)或低饱和度颜色。","clips":[]},{"n":97,"kind":"单项选择题","answer":"A","stem":"地陪导游在接团前，应该做好的心理准备有( )。","options":{"A":"准备面对艰苦复杂的工作","B":"准备面对司机的挑刺","C":"准备面对组团社的问责","D":"准备面对旅游局的检查"},"explanation":"心理准备：树立带好旅游团的自信；准备面对艰苦复杂的工作；准备可能面对抱怨和\n\n投诉。","clips":[]},{"n":98,"kind":"单项选择题","answer":"C","stem":"旅游团抵达前，地陪应与司机联系，确保提前( )抵达接站地点。","options":{"A":"10 分钟","B":"20 分钟","C":"30 分钟","D":"60 分钟"},"explanation":"地陪应与司机联系，确保提前 30 分钟抵达接站地点。","clips":[]},{"n":99,"kind":"单项选择题","answer":"D","stem":"下列选项中，不属于离店服务内容的是( )。","options":{"A":"提醒注意事项","B":"办理退房手续","C":"集合登车","D":"商定出发时间"},"explanation":"离店服务：提醒注意事项；办理退房手续；集合登车。","clips":[]},{"n":100,"kind":"单项选择题","answer":"D","stem":"下列选项中，地陪导游为游客提供餐饮服务正确的一项是( )。","options":{"A":"在用自助餐时，提醒游客多拿少次，避免游客排队","B":"用餐过程中，地陪不应去巡视，避免打扰游客用餐","C":"地陪应严格按照团队人数、标准、饮用酒水数量等核实餐厅开列的账单","D":"用餐中如菜品中有异物(头发、虫子等)，地陪要及时向餐厅反映并立即换菜"},"explanation":"巡视次数：用餐过程中，地陪应巡视旅游团用餐情况 1—2 次；引导文明用餐：引导\n\n旅游者文明用餐、使用公筷公勺。在用自助餐时，倡导旅游者“厉行节约，反对浪费”；异\n\n物问题处理：针对旅游者在用餐中出现的问题和要求，如菜品中有异物(头发、虫子等)，地\n\n陪要及时向餐厅反映并立即换菜，必要时要求餐厅负责人出面赔礼道歉并给予适当补偿；用\n\n餐结束后，地陪应严格按照实际用餐人数、标准、饮用酒水数量等核实餐厅开列的账单，直\n\n接付款或在结算单上签字。","clips":[]},{"n":101,"kind":"单项选择题","answer":"D","stem":"全陪为游客提供入住饭店服务，内容正确的是( )。","options":{"A":"全陪直接提供团名、团队名单表给饭店","B":"拿到房卡后，全陪根据准备好的分房名单分发房卡","C":"请领队告知客人将贵重物品存放在饭店前台或房内保险柜中","D":"如单位组团出游，请旅游团的相关负责人分配住房"},"explanation":"协助地陪导游向饭店前台提供团名、团队名单表、旅游者证件、旅游团住房要求等，\n\n快速办理入住手续。拿到房卡后，全陪要协助领队根据准备好的分房名单分发房卡；提醒游\n\n客住店期间注意安全，将贵重物品存放在饭店前台或房内保险柜中；单位组团：则请旅游团\n\n的相关负责人分配住房。","clips":[]},{"n":102,"kind":"单项选择题","answer":"C","stem":"境内迎接旅游团，全陪应该提前( )到达组团社与游客事先约定的集合地点，手举社旗等候游客的到来。","options":{"A":"10 分钟","B":"20 分钟","C":"30 分钟","D":"40 分钟"},"explanation":"境内迎接旅游团，全陪应该提前 30 分钟到达组团社与游客事先约定的集合地点，手\n\n举社旗等候游客的到来。","clips":[]},{"n":103,"kind":"单项选择题","answer":"C","stem":"在红色旅游景点参观时，可以用“英勇无畏”形容革命斗士，用“冥顽不灵”形容敌对分子，而不能反过来使用。这是导游语言准确性中( )的体现。","options":{"A":"思想观点准确","B":"讲解内容准确","C":"遣词造句准确","D":"语音语调准确"},"explanation":"遣词造句准确：词语感情色彩使用准确。例如在红色旅游景点参观时，可以用“英勇\n\n无畏”形容革命斗士，而用“冥顽不灵”形容敌对分子，而不能反过来使用。","clips":[]},{"n":104,"kind":"单项选择题","answer":"A","stem":"2011 年 6 月 24 日，中国“杭州西湖文化景观”被正式列入《世界遗产名录》。世界遗产委员会认为：“杭州西湖文化景观是文化景观的一个杰出典范，极为清晰地展现了中国景观的美学思想，对中国乃至世界的园林设计影响深远。”这段导游词是修饰化引用中的( )。","options":{"A":"明引","B":"暗引","C":"意引","D":"他引"},"explanation":"明引直接引用原文，并在原文基础上加上引号，其特点是出处明确，具有较强的说服\n\n力。题干中：在介绍西湖的讲解词中，引用了联合国教科文组织的评价，增加了表达的信服\n\n度。","clips":[]},{"n":105,"kind":"单项选择题","answer":"D","stem":"关于救生衣的存放和标识，描述正确的是( )。","options":{"A":"儿童救生衣的外面应有明显耐久的“儿童专用”字样，内侧不需要","B":"为应急需要，救生衣应直接暴露在室外环境，方便取拿","C":"集中存放时，儿童救生衣应与成人救生衣放置在一起","D":"儿童救生衣的存放位置应清楚标明“儿童救生衣”字样"},"explanation":"救生衣应以明显耐久的字迹标明其型号、制造厂名、制造编号、制造年月及检验单位\n\n的标志；儿童救生衣的内外两面，均应有明显耐久的“儿童专用”字样；救生衣存放位置有\n\n明显和永久性的标示，儿童救生衣的存放位置应清楚标明“儿童救生衣”字样；救生衣存放\n\n在甲板等露天开敞处所时应置于救生衣柜等装置中，不可直接暴露在室外环境；客舱内应存\n\n放与乘客等额数量的救生衣；集中存放时儿童救生衣应与成人救生衣分开放置。","clips":[]},{"n":106,"kind":"单项选择题","answer":"D","stem":"三峡工程是世界上施工期最长、建筑规模最大的水利工程；三峡水电站是世界上最大的水电站；三峡工程泄洪闸是世界上泄洪能力最强的泄洪闸；三峡工程对外专用公路是国内工程项目最齐全的公路。这段话是导游讲解方法中突出重点法的( )。","options":{"A":"突出独特之处","B":"突出有代表性部分","C":"突出旅游者感兴趣的内容","D":"突出“最”“第一”"},"explanation":"突出“最”“第一”。举例：三峡工程是世界上施工期最长、建筑规模最大的水利工程；\n\n三峡水电站是世界上最大的水电站；三峡工程泄洪闸是世界上泄洪能力最强的泄洪闸；三峡\n\n工程对外专用公路是国内工程项目最齐全的公路。","clips":[]},{"n":107,"kind":"单项选择题","answer":"B","stem":"导游在讲解中借题发挥，不仅要介绍景物，更要借助景物引发情感，升华精神。这是导游在讲解中运用了( )。","options":{"A":"虚实结合法","B":"触景生情法","C":"画龙点睛法","D":"制造悬念法"},"explanation":"触景生情法是导游在讲解中见物生情、借题发挥的方法。其核心在于“生情”，导游\n\n不仅要介绍景物，更要借助景物引发情感，升华精神，让旅游者感受到景中有情、情中有景。","clips":[]},{"n":108,"kind":"单项选择题","answer":"C","stem":"导游老王带团临近结束时，可以采用( )的方法，影响旅游者对导游的看法。","options":{"A":"首因效应","B":"保持效应","C":"近因效应","D":"尾端效应"},"explanation":"与首因效应相对，心理学领域还有近因效应，指在人际交往中，印象形成主要取决于\n\n后来出现的部分，即最后印象。","clips":[]},{"n":109,"kind":"单项选择题","answer":"B","stem":"下列对游客景区游览消防安全注意事项的描述，正确的一项是( )。","options":{"A":"如果在草木繁盛的区域进行烧烤，事后要进行彻底灭火","B":"不违规燃放烟花爆竹","C":"可以施放氢气球，但是孔明灯不可以","D":"可以携带火种上山，但是非必要不使用"},"explanation":"游览景区、公共文化场馆、文物保护单位等场所时，严格遵守消防及各类安全管理规\n\n定；不在草木繁盛、树叶堆积等易燃物聚集地或有防火提示的地方吸烟、烧烤或者使用明火；\n\n不违规燃放烟花爆竹，不施放孔明灯、氢气球；户外活动注意防火避灾，不带火种上山。","clips":[]},{"n":110,"kind":"单项选择题","answer":"C","stem":"导游领队对游客进行合理引导时，操作正确的是( )。","options":{"A":"关注游客的行为，随时对他们不当的行为进行批评教育","B":"对未成年人较多的团队，侧重对孩子的引导，避免发生不文明行为","C":"对无出境记录游客，应特别提醒旅游目的地风俗禁忌和礼仪习惯","D":"对游客的提出的批评和意见，采用拖延法处理"},"explanation":"导游领队应有维护文明旅游的主动性和自觉性，关注游客的言行举止，在适当时机对\n\n游客进行相应提醒、警示、劝告；对未成年人较多的团队，应侧重对家长的引导，并需特别\n\n关注未成年人特点，避免损坏公物、喧哗吵闹等不文明现象发生；对无出境记录游客，应特\n\n别提醒旅游目的地风俗禁忌和礼仪习惯，以及出入海关、边防(移民局)的注意事项，提前告\n\n知和提醒；对游客的正确批评和合理意见，导游领队应认真听取，虚心接受。","clips":[]},{"n":111,"kind":"单项选择题","answer":"B","stem":"古代，无数能工巧匠汇聚于此，在崇山峻岭间，一块块巨大的石砖被艰难搬运，那段城墙，就像一位岁月的老人，默默诉说着当年劳动人民不屈不挠的抗争故事，他们为了抵御外敌，付出无数心血，才筑起了这雄伟壮观、横亘万里的长城，它见证了历史风云变幻，承载着中华民族坚韧不拔的精神。这段话采用了( )的讲解，引人入胜。","options":{"A":"细节化","B":"情节化","C":"比喻化","D":"夸张化"},"explanation":"情节化：将平淡无奇的内容故事化，可以大幅提升导游语言的生动性。在讲述故事时，\n\n可以适当设置层层推进的逻辑关系和环环相扣的悬念，营造出引人入胜的情节。","clips":[]},{"n":112,"kind":"单项选择题","answer":"D","stem":"下列对地陪和领队协作的描述，错误的一项是( )。","options":{"A":"尊重领队，遇事多磋商","B":"赞赏领队，调动积极性","C":"关心领队，建立工作友谊","D":"指导领队，做好分内事务"},"explanation":"地陪和领队协作：尊重领队，遇事多磋商；赞赏领队，调动积极性；关心领队，建立\n\n工作友谊；提醒领队，做好分内事务。","clips":[]},{"n":113,"kind":"单项选择题","answer":"B","stem":"关于变更交通工具类型的描述，正确的是( )。","options":{"A":"旅游者因乘坐舒适程度问题要求更换交通工具，通常要积极配合，尽量协调","B":"如仅更换交通工具等级，在有余票的情况下，可帮助更换","C":"更换交通工具等级，若有余票，无需联系旅行社，导游自行帮助更换即可","D":"更换交通方式所产生的损失费用以及新交通方式的全部费用旅行社和游客各承担一半"},"explanation":"1.要求更换交通工具类型和出行时间。一般情况不能答应更换：除非在自然灾害、误\n\n车(机、船)等特殊情况下，一般都不能答应更换。旅途中票务预订、退换较为烦琐，短时间\n\n内很难满足。更换出行时间：与上述处理方式相同。2.要求提高交通工具等级：如提高舱位、\n\n座位等级等。有余票时可帮忙更换：导游应首先与接待社计调部门联系，若有所要求等级的\n\n舱位、座位余票可帮忙更换，但须告知该旅游者差价及相关费用自理。","clips":[]},{"n":114,"kind":"单项选择题","answer":"B","stem":"旅游者中暑，导游可采用的措施有( )。","options":{"A":"失去意识者避免平躺，应采取坐姿休息","B":"症状轻微可扇风散热，面色潮红发烧时用凉水擦拭身体降温","C":"患者病症重，经处理后送回酒店休息","D":"服用导游自备的解暑药"},"explanation":"1.转到阴凉环境：移至阴凉通风处，意识清醒者坐姿休息，支撑头与肩部；失去意识\n\n者平躺干爽位置，解开衣领，放松裤带；2.进行物理降温：症状轻微可扇风散热，面色潮红\n\n发烧时用凉水擦拭身体降温；3.采取药物治疗：症状未缓解，征询旅游者或亲友意见，服用\n\n自带防暑药物，进一步观察；4.及时送医治疗：患者病症重，经处理后症状未改善，及时送\n\n往医院进一步治疗。","clips":[]},{"n":115,"kind":"单项选择题","answer":"D","stem":"为了避免游客发生伤病，导游操作正确的是( )。","options":{"A":"身体不佳者，建议中途退团","B":"多提醒旅游者注意饮食卫生，可以多吃当地美食，但是路边摊要适当吃","C":"安排合理游览线路和节奏，避免过度劳累，不要安排夜晚娱乐活动","D":"对风险环境或行为，及时明确警示旅游者"},"explanation":"1.关注旅游者健康状况，旅游过程中，随时观察旅游者健康，身体不佳者建议及时休\n\n息或就医，早发现早处理隐患。2.安排游览活动应劳逸结合，根据旅游者身体、精神状态，\n\n安排合理游览线路和节奏，避免过度劳累，夜晚娱乐活动不宜过长过晚；3.安全警示应及时\n\n明确，对风险环境或行为，及时明确警示旅游者，如禁止危险拍照、嬉闹等。登高涉险项目\n\n建议量力而行，老幼群体避免参与危险项目。4.提醒旅游者注意饮食卫生，多提醒旅游者注\n\n意饮食卫生，不暴饮暴食，多喝开水或矿泉水，食用洗净或去皮水果，不吃路边摊；5.做好\n\n天气变化的提醒工作，及时提醒旅游者天气变化，做好应对措施，如暑天防中暑、冬天保暖、\n\n晴天防晒、雨天带雨具。","clips":[]},{"n":116,"kind":"单项选择题","answer":"B","stem":"溺水者昏迷后被救上岸，导游操作正确的一项是( )。","options":{"A":"将失去知觉的溺水者背卧置于地上，头部置于侧位，以便水从口中流出","B":"迅速清理掉溺水者口鼻内的堵塞物，使其保持呼吸道畅通","C":"可将手掌平放在溺水者胸腹部上方侧脸俯身观察胸腹部是否有起伏，时间约为 10‑ 20 秒","D":"立即拨打 120 等待医护人员到来，不要对溺水者做任何救护，避免发生二次伤害"},"explanation":"(1)立即拨打 120，若施救人员没有经过专业急救培训，但救人刻不容缓，此时立即\n\n拨打 120 是较好的办法。一方面可让救护车尽早赶到，另一方面可通过 120 接线人员的指导，\n\n进行科学救护，避免溺水者遭受二次伤害；(2)清除溺水者口鼻处异物，将失去知觉的溺水\n\n者仰卧置于地上，把头部置于侧位，以便水可以从口中流出。同时，迅速清理掉溺水者口鼻\n\n内的堵塞物，使其保持呼吸道畅通；(3)快速判断是否还有呼吸，可将手掌平放在溺水者胸\n\n腹部上方作为参照，侧脸俯身观察胸腹部是否有起伏，时间约为 5‑ 10 秒；(4)采用心肺复\n\n苏术救护，若发现溺水者已经没有呼吸心跳，就应立即采用心肺复苏术进行施救。若现场人\n\n员无人能做，导游可继续拨打 120 请教心肺复苏术的操作方法，尽可能为溺水者赢得抢救的\n\n宝贵时间。","clips":[]},{"n":117,"kind":"单项选择题","answer":"D","stem":"当旅游客车发生交通事故时，导游应该( )。","options":{"A":"首先将事故上报给旅行社，等待旅行社指示","B":"拨打 110 报警电话，等待警察到来处理","C":"安抚全体旅游者情绪，停止旅游行程","D":"立即展开抢救，优先救助伤员"},"explanation":"1.立即组织抢救，事故发生第一时间，立即展开抢救，优先救助伤员。对重伤者，应\n\n即刻拨打 120，并在 120 指导下进行科学急救；2.保护现场并立即报案，导游需冷静保护事\n\n故现场，避免其进一步破坏或污染，同时拨打或安排人员拨打 122 报警电话，待交警到达后，\n\n协助现场处置；3.迅速上报旅行社，及时将事故情况上报旅行社，按旅行社建议与安排处理\n\n现场问题；4.做好安抚工作，安抚全体旅游者情绪，根据事故情况和旅游者意愿，合理调整\n\n后续行程。","clips":[]},{"n":118,"kind":"单项选择题","answer":"D","stem":"自 2015 年 7 月 1 日起，大陆居民往来台湾通行证的有效期为( )。","options":{"A":"1 年","B":"3 年","C":"5 年","D":"10 年"},"explanation":"自 2015 年 7 月 1 日起，大陆居民往来台湾通行证的有效期由原来的 5 年调整为 10\n\n年。","clips":[]},{"n":119,"kind":"单项选择题","answer":"A","stem":"外交部全球领事保护与服务应急热线电话是( )。","options":{"A":"12308","B":"12301","C":"12345","D":"12395"},"explanation":"外交部全球领事保护与服务应急热线:+86‑ 10‑ 12308(24 小时)。","clips":[]},{"n":120,"kind":"单项选择题","answer":"C","stem":"下列人员中，可以走绿色通道的是( )。","options":{"A":"因私出国的中国公民","B":"不知道如何选择通道的人员","C":"持有礼遇签证的人员","D":"持普通公务护照出境的中国公民"},"explanation":"绿色通道(“免税通道”或“无申报通道”)：携带无须向海关申报物品的旅游者以及\n\n持有外交签证或礼遇签证的人员，可选择“绿色通道”通关，但需向海关出示本人证件和按\n\n规定填写申报单据。","clips":[]},{"n":121,"kind":"单项选择题","answer":"D","stem":"一名 17 周岁的英国游客，可以携带烟酒的上限是( )。","options":{"A":"香烟 200 支或雪茄 10 支或烟丝 250 克","B":"香烟 40 支或雪茄 2 支或烟丝 40 克","C":"12 度以上酒精饮料 1 瓶","D":"香烟 400 支或雪茄 20 支烟丝 500 克"},"explanation":"其他入境旅客：香烟 400 支或雪茄 20 支或烟丝 500 克；12 度以上酒精饮料:≤1.5\n\n升。","clips":[]},{"n":122,"kind":"单项选择题","answer":"C","stem":"中国南方航空公司的英文代码是( )。","options":{"A":"CA","B":"MU","C":"CZ","D":"SD"},"explanation":"中国南方航空股份有限公司(CZ)。","clips":[]},{"n":123,"kind":"单项选择题","answer":"A","stem":"对于城际列车字母表示正确的一项是( )。","options":{"A":"C","B":"D","C":"Z","D":"K"},"explanation":"C 字头——城际动车组列车(城市群短途通勤专线)。","clips":[]},{"n":124,"kind":"单项选择题","answer":"C","stem":"一对德国夫妇带着不满 2 周岁的三胞胎来中国旅行。如果成人机票价格为 1000 元人民币，这个家庭共需要支付( )元购买机票。","options":{"A":"2300","B":"2500","C":"2700","D":"3100"},"explanation":"每名成人 1000 元，共计 2000 元，一名成年人可以携带一名不满 2 周岁的婴儿买婴儿\n\n票，2 人携带 2 名婴儿，合计 200 元，其中一名婴儿需要买儿童票，500 元，所以家庭共计\n\n支付 2000+200+500=2700 元。","clips":[]},{"n":125,"kind":"单项选择题","answer":"C","stem":"为了避免发生高原反应，导游告知游客应( )。","options":{"A":"坚持每天洗澡，早睡早起","B":"每天至少补水 6000 毫升","C":"如发生失眠，可以适当服安全助眠药物","D":"禁止在高原上跑步，但是可以通过疾走锻炼身体"},"explanation":"少洗或不洗澡；每天至少补水 4000 毫升；禁止:疾速行走、跑步、体力劳动。\n\n2026 导游资格证冲刺提升卷三｜政策与法律法规+导游业务（续）","clips":[]},{"n":126,"kind":"单项选择题","answer":"D","stem":"下列人群中，不适宜泡温泉的人群是( )。","options":{"A":"糖尿病患者","B":"饮酒客人","C":"有高血压或心脑血管病的病人","D":"癌症、白血病患者"},"explanation":"不适宜泡温泉的情形：癌症、白血病患者不宜泡温泉(刺激新陈代谢加速身体虚弱)；\n\n皮肤伤口/溃烂/真菌感染(足癣、湿疹)、过敏性皮肤病患者不宜(防伤口恶化或荨麻疹)；女\n\n性生理期及其前后、怀孕初期/末期不宜；睡眠不足、熬夜、营养不良、大病初愈等疲惫状\n\n态不宜(防脑部缺血或休克)。","clips":[]},{"n":127,"kind":"单项选择题","answer":"D","stem":"对于开展研学旅游之前的注意事项，描述错误的是( )。","options":{"A":"导游应协助活动学校制定研学旅行安全应急预案","B":"导游应配合活动学校成立安全工作组","C":"导游应召开研学旅行活动行前说明会","D":"导游应提前熟悉研学旅行活动的地点，但无需进行实地勘查"},"explanation":"导游应提前熟悉研学旅行活动的地点，进行实地勘查，制定安全合理的活动路线和方\n\n案，以确保活动安全。","clips":[]},{"n":128,"kind":"单项选择题","answer":"C","stem":"下列情形中，旅行社不能免责的是( )。","options":{"A":"因游客自身疾病导致损失或损害","B":"因游客个人过错导致的人身伤亡、财物损失及衍生费用","C":"游客签约时已声明且旅行社接受需照顾的情形，工作人员未尽到照顾义务","D":"游客自行终止旅游行程发生的人身、财物损害"},"explanation":"旅行社免责情形：\n\n情形一：游客自身健康问题：游客应确保自身身体条件适合旅游活动，因自身疾病导致损失\n\n或损害，旅行社不担责，例外：游客签约时已声明且旅行社接受需照顾的情形，而旅行社及\n\n其工作人员未尽到照顾义务除外；\n\n情形二：游客未履行安全义务：游客参加活动时需服从导游或领队安排，注意自身及随行未\n\n成年人安全，妥善保管财物，因游客个人过错导致的人身伤亡、财物损失及衍生费用，旅行\n\n社不承担责任；\n\n情形三：游客自行脱离行程：游客自行终止旅游行程或未参加约定活动自行行动时发生的人\n\n身、财物损害，旅行社不担责。","clips":[]},{"n":129,"kind":"单项选择题","answer":"A","stem":"海南离岛免税政策，是指对年满( )的国内外旅客实行限值、限量、限品种免进口税购物的税收优惠政策。","options":{"A":"16 周岁","B":"17 周岁","C":"18 周岁","D":"20 周岁"},"explanation":"海南离岛免税政策是指对乘飞机、火车、轮船离岛(不包括离境)年满 16 周岁的国内\n\n外旅客实行限值、限量、限品种免进口税购物，在实施离岛免税政策的免税商店内或经批准\n\n的网上销售窗口付款，在机场、火车站、港口码头指定区域提货离岛的税收优惠政策。","clips":[]},{"n":130,"kind":"单项选择题","answer":"B","stem":"从莫斯科当地时间 20 点起飞的客机，飞行 8 个小时以后落地北京，此时北京时间为( )。","options":{"A":"次日上午 8 时","B":"次日上午 9 时","C":"次日上午 10 时","D":"次日上午 11 时"},"explanation":"莫斯科比北京晚了 5 个小时，因此起飞时北京为次日凌晨 1 点，飞行 8 个小时，就是\n\n上午 9 时。","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABCD","stem":"根据《中华人民共和国宪法》的规定，我国宪法确立的基本原则包括( )。","options":{"A":"党的领导原则","B":"人民主权原则","C":"法治原则","D":"民主集中制原则","E":"三权分立原则"},"explanation":"我国宪法确立了四项基本原则，它们相互联系、有机统一，构成国家治理体系的制度\n\n基石，即党的领导原则、人民主权原则、法治原则、民主集中制原则。E 项错误，三权分立\n\n是西方资本主义国家的政权组织原则，我国宪法确立的是民主集中制原则，不实行三权分立。","clips":[]},{"n":132,"kind":"多项选择题","answer":"ACD","stem":"《宪法》规定，公民在( )的情况下，有从国家和社会获得物质帮助的权利。","options":{"A":"年老","B":"未成年","C":"疾病","D":"丧失劳动能力","E":"残疾"},"explanation":"《宪法》在公民的物质帮助权中规定：公民在年老、疾病或者丧失劳动能力的情况下，\n\n有从国家和社会获得物质帮助的权利。","clips":[]},{"n":133,"kind":"多项选择题","answer":"CD","stem":"根据《旅游法》的规定，当旅游者数量可能达到最大承载量时，以下说法正确的是( )。","options":{"A":"景区应当提前公告，并及时向当地人民政府报告","B":"如未依法采取措施，由旅游主管部门责令改正","C":"景区和当地人民政府应当及时采取疏导、分流等措施","D":"景区是流量控制的主体","E":"公示并相应减少收费"},"explanation":"“景区应当提前公告，并及时向当地人民政府报告”应把“及时”改为“同时”。《旅\n\n游法》第 45 条，旅游者数量可能达到最大承载量时，景区应当提前公告并同时向当地人民\n\n政府报告，景区和当地人民政府应当及时采取疏导、分流等措施。第 105 条，景区在旅游者\n\n数量可能达到最大承载量时，未依照本法规定公告或者未向当地人民政府报告，未及时采取\n\n疏导、分流等措施，或者超过最大承载量接待旅游者的，由景区主管部门责令改正，情节严\n\n重的，责令停业整顿一个月至六个月。","clips":[]},{"n":134,"kind":"多项选择题","answer":"AB","stem":"根据《旅游法》的规定，由于不可抗力或者旅行社、履行辅助人已尽合理注意义务仍不能避免的事件导致旅游者滞留时，关于相关费用和责任的承担，以下说法正确的是( )。","options":{"A":"在发生危及旅游者人身、财产安全的情况下，旅行社应当采取相应的安全措施，因此支出的费用，由旅行社与旅游者分担","B":"在造成旅游者滞留的情况下，旅行社应当采取相应的安置措施，因此增加的食宿费用，由旅游者自行承担","C":"在造成旅游者滞留的情况下，旅行社应当采取相应的安置措施，因此增加的食宿费用，由双方分担","D":"在发生危及旅游者人身、财产安全的情况下，旅行社应当采取相应的安全措施，因此支出的费用，由旅游者承担","E":"增加的返程费用，由旅游者承担"},"explanation":"《旅游法》第 67 条第 3 项和第 4 项分别做了相应的规定。即在发生危及旅游者人身、\n\n财产安全的情况下，旅行社应当采取相应的安全措施，因此支出的费用，由旅行社与旅游者\n\n分担；在造成旅游者滞留的情况下，旅行社应当采取相应的安置措施，因此增加的食宿费用，\n\n由旅游者承担；增加的返程费用，由旅行社与旅游者分担。在此情况下造成的滞留，增加的\n\n食宿费用，由旅游者承担；在此情况下造成滞留，返程费用本身就包含在旅游行程费用中，\n\n因此应由旅行社承担，而增加的返程费用，则由双方分担。","clips":[]},{"n":135,"kind":"多项选择题","answer":"ABCD","stem":"根据《民法典》的规定，当合同约定不明确，且无法通过协议补充或者其他方式确定时，正确的规定是( )。","options":{"A":"质量要求不明确的，首先按照国家强制性标准履行","B":"履行地点不明确，给付货币的，在接受货币一方所在地履行","C":"履行地点不明确，交付不动产的，在不动产所在地履行","D":"履行期限不明确的，债务人可以随时履行","E":"价款不明确的，按照合同订立地的市场价格履行"},"explanation":"“价款不明确的……”错误，价款或者报酬不明确的，按照订立合同时履行地的市场\n\n价格履行。","clips":[]},{"n":136,"kind":"多项选择题","answer":"AE","stem":"下列关于旅行社违反《中华人民共和国旅游法》需要承担法律责任的表述，正确的是( )。","options":{"A":"进行虚假宣传，违法所得 5 万元以上的，并处违法所得 1 倍以上 5 倍以下罚款","B":"向不合格的供应商订购产品和服务的，并处 1 万元以上 10 万元以下罚款","C":"要求导游垫付费用情节严重的，责令停业整顿或者吊销营业执照","D":"未按照规定投保旅行社责任保险的，责令停业整顿","E":"未向临时聘用的导游支付导游服务费用的，并处 5000 元以上 5 万元以下罚款"},"explanation":"“向不合格的供应商订购产品和服务的”“未按照规定投保旅行社责任保险的”由旅游\n\n主管部门或者有关部门责令改正，没收违法所得，并处 5000 元以上 5 万元以下罚款；违法\n\n所得 5 万元以上的，并处违法所得 1 倍以上 5 倍以下罚款；情节严重的，责令停业整顿或者\n\n吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处 2000 元以上\n\n2 万元以下罚款。","clips":[]},{"n":137,"kind":"多项选择题","answer":"CDE","stem":"依据《导游人员管理条例》，导游人员可以调整或者变更接待计划的是( )。","options":{"A":"在征得旅行社同意后","B":"在向旅游主管部门备案后","C":"在遇有可能危及旅游者人身安全的紧急情形时","D":"在引导旅游者旅行、游览过程中","E":"在征得多数旅游者同意后"},"explanation":"《导游人员管理条例》第 13 条规定，导游人员在引导旅游者旅行、游览过程中，遇有\n\n可能危及旅游者人身安全的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接待\n\n计划，但是应当立即报告旅行社。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABD","stem":"根据《旅游法》的规定，旅行社应当与其聘用的导游依法( )。","options":{"A":"订立劳动合同","B":"支付劳动报酬","C":"全额支付导游服务费","D":"缴纳社会保险费用","E":"提供企业福利"},"explanation":"《旅游法》第 38 条规定，旅行社应当与其聘用的导游依法订立劳动合同，支付劳动报\n\n酬，缴纳社会保险费用。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ACE","stem":"依据《中华人民共和国消费者权益保护法实施条例》，关于无理由退货的规定，下列说法正确的有( )。","options":{"A":"经营者应当以显著方式标注不适用无理由退货的商品","B":"可将不适用无理由退货设置为消费者默认同意的选项","C":"消费者查验商品，合理调试，未破坏原有品质、功能、外观的，经营者应当退货","D":"消费者打开商品包装，则无法适用于无理由退货","E":"未经消费者确认，经营者不得拒绝无理由退货"},"explanation":"A 项正确：经营者应当以显著方式对不适用无理由退货的商品进行标注，符合法条规\n\n定。B 项错误：条例明确禁止将不适用无理由退货设置为消费者默认同意的选项，该项与法\n\n律规定相悖。C 项正确：消费者基于查验需要打开商品包装，或者为确认商品品质、功能进\n\n行合理调试，不影响商品原有品质、功能和外观的，经营者应当予以退货。D 项错误。E 项\n\n正确：未经消费者确认，经营者不得拒绝无理由退货，符合法条规定。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ABCDE","stem":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，以下情形中旅游经营者需要承担赔偿责任的是( )。","options":{"A":"旅游经营者对旅游辅助服务者未尽谨慎选择义务","B":"旅游经营者、旅游辅助服务者未尽到安全保障义务，造成旅游者财产损失","C":"旅游经营者擅自将其旅游业务转让给其他旅游经营者，旅游者在旅游过程中遭受损害","D":"旅游经营者准许他人挂靠其名下从事旅游业务，造成旅游者人身损害","E":"旅游公司大巴车延误，导致旅游合同不能按约履行"},"explanation":"《最高院关于审理旅游纠纷案件的规定》第 18 条规定，因飞机、火车、班轮、城际客\n\n运班车等公共客运交通工具延误，导致合同不能按照约定履行，旅游者请求旅游经营者退还\n\n未实际发生的费用的，人民法院应予支持。“旅游公司大巴车延误，……”，旅游公司大巴车\n\n不是“公共交通工具”，它属于旅游公司的履行辅助人，因此旅游经营者需要承担责任。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ACDE","stem":"《旅游安全管理办法》规定，根据旅游突发事件的( )，一般将旅游突发事件分为四个等级。","options":{"A":"性质","B":"类别","C":"危害程度","D":"造成或者可能造成的影响","E":"可控性"},"explanation":"《旅游安全管理办法》第 39 条第 2 款规定，根据旅游突发事件的性质、危害程度、可\n\n控性以及造成或者可能造成的影响，旅游突发事件一般分为特别重大、重大、较大和一般四\n\n级。","clips":[]},{"n":142,"kind":"多项选择题","answer":"AE","stem":"依据《中华人民共和国食品安全法》，县级以上地方人民政府隐瞒、谎报、缓报食品安全事故的，对相关责任人的处罚是( )。","options":{"A":"情节较重的，给予降级或者撤职处分","B":"情节严重的，其主要负责人还应当引咎辞职","C":"对直接负责的主管人员给予记过处分","D":"对其他直接责任人员给予记过处分","E":"情节严重的，给予开除处分"},"explanation":"“情节严重的，其主要负责人还应当引咎辞职”错误，是“造成严重后果的”；“对直\n\n接负责的主管人员给予记过处分”“对其他直接责任人员给予记过处分”两项“记过处分”\n\n错误，是“记大过”。县级以上地方人民政府有下列行为之一的，对直接负责的主管人员和\n\n其他直接责任人员给予记大过处分；情节较重的，给予降级或者撤职处分；情节严重的给予\n\n开除处分；造成严重后果的，其主要负责人还应当引咎辞职：(1)对发生在本行政区域内的\n\n食品安全事故，未及时组织协调有关部门开展有效处置，造成不良影响或者损失；(2)对本\n\n行政区域内涉及多环节的区域性食品安全问题，未及时组织整治，造成不良影响或者损失；\n\n(3)隐瞒、谎报、缓报食品安全事故；(4)本行政区域内发生特别重大食品安全事故，或者连\n\n续发生重大食品安全事故。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ACDE","stem":"根据《风景名胜区条例》的规定，风景名胜区总体规划应当包含( )。","options":{"A":"风景资源评价","B":"重大建设工程方案","C":"游客容量","D":"开发利用强度","E":"禁止和限制开发的范围"},"explanation":"《风景名胜区条例》第十三条：风景名胜区总体规划应当包括下列内容：(一)风景资\n\n源评价；(二)生态资源保护措施、重大建设项目布局、开发利用强度；(三)风景名胜区的功\n\n能结构和空间布局；(四)禁止开发和限制开发的范围；(五)风景名胜区的游客容量；(六)\n\n有关专项规划。ACDE 选项：符合法条规定，故正确。B 选项：重大建设工程方案，法条表述\n\n为“重大建设项目布局”，总体规划不包含工程方案，故错误。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ACE","stem":"依据习近平新时代中国特色社会主义思想相关理论，下列属于“十四个坚持”基本方略的有( )。","options":{"A":"坚持总体国家安全观","B":"以中国式现代化推进中华民族伟大复兴","C":"坚持推动构建人类命运共同体","D":"把制度建设贯穿党的各项建设之中","E":"坚持人与自然和谐共生"},"explanation":"“十四个坚持”——新时代坚持和发展中国特色社会主义的基本方略。其中第 9 条：\n\n坚持人与自然和谐共生；第 10 条：坚持总体国家安全观；第 13 条：坚持推动构建人类命运\n\n共同体。“十个明确”第 2 点：以中国式现代化推进中华民族伟大复兴；“十个明确”第 10\n\n点：把制度建设贯穿其中，深入推进反腐败斗争。A 项正确，坚持总体国家安全观是“十四\n\n个坚持”第 10 条。B 项错误，以中国式现代化推进中华民族伟大复兴属于“十个明确”，不\n\n属于“十四个坚持”。C 项正确，坚持推动构建人类命运共同体是“十四个坚持”第 13 条。\n\nD 项错误，把制度建设贯穿其中出自“十个明确”第 10 点，不属于“十四个坚持”。E 项正\n\n确，坚持人与自然和谐共生是“十四个坚持”第 9 条。","clips":[]},{"n":145,"kind":"多项选择题","answer":"ACDE","stem":"严格公正司法，需要健全( )各司其职、相互配合、相互制约的体制机制。","options":{"A":"司法行政机关","B":"政府机关","C":"公安机关","D":"检察机关","E":"审判机关"},"explanation":"答案选 ACDE。要健全公安机关、检察机关、审判机关、司法行政机关各司其职、相\n\n互配合、相互制约的体制机制。B 项政府机关属于行政机关，不属于该司法权力分工制约体\n\n系内的专门机关。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ACD","stem":"关于人民英雄纪念碑，以下说法正确的是( )。","options":{"A":"人民英雄纪念碑及其名称、碑题、碑文、浮雕、图形、标志等受法律保护","B":"每年的国庆节，国家在人民英雄纪念碑前举行纪念仪式","C":"是国家和人民纪念、缅怀英雄烈士的永久性纪念设施","D":"长期以来是革命传统教育和爱国主义教育的重要场所","E":"展现了自抗日战争以来中国人民浴血奋斗的艰辛历程"},"explanation":"选项“展现了自抗日战争…”错误，人民英雄纪念碑，展现了自鸦片战争以来中国人\n\n民浴血奋斗的艰辛历程。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ADE","stem":"根据《食品安全法》的规定，县级以上人民政府食品安全监督管理部门接到食品安全事故报告后，应当立即会同有关部门进行调查处理，并采取( )措施。","options":{"A":"开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员","B":"对导致食品安全事故的食品及其原料进行清洗消毒","C":"对疑似被污染的食品及其原料，责令食品生产经营者召回","D":"封存被污染的食品相关产品","E":"做好信息发布工作"},"explanation":"“对导致食品安全事故的食品及其原料进行清洗消毒”说法有误，正确的表达是“封\n\n存可能导致食品安全事故的食品及其原料”；“对疑似被污染……”，正确的表达是“对确认\n\n属于被污染的食品及其原料”。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABC","stem":"导游服务的范围包括( )。","options":{"A":"向导服务","B":"讲解服务","C":"旅行生活服务","D":"销售服务","E":"调研服务"},"explanation":"导游服务的范围：向导服务；讲解服务；旅行生活服务。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABC","stem":"地陪导游的主要职责有( )。","options":{"A":"接受导游任务，引导文明旅游","B":"进行导游讲解，传播中国文化","C":"安排旅游事宜，保护旅游者安全","D":"联络工作","E":"宣传、调研工作"},"explanation":"接受导游任务，引导文明旅游；进行导游讲解，传播中国文化；安排旅游事宜，保护\n\n旅游者安全；反映意见要求，安排相关活动；解答旅游者问询，处理相关问题。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABE","stem":"地陪和领队(全陪)核对、商定行程时出现问题，地陪导游应该( )。","options":{"A":"领队或旅游者提出小的修改意见或增加新的游览项目时，地陪应及时向旅行社反映","B":"修改意见或增加新的游览项目需要费用时，地陪要事先讲明，按有关规定收取费用","C":"增加新的游览项目确有困难且无法满足的要求时，导游婉言拒绝","D":"部分旅游者提出的要求与原行程不符且涉及接待规格，导游尽量帮助解决","E":"确有特殊理由且由入境领队(全陪)提出，地陪必须请示旅行社，视情况而定"},"explanation":"入境领队(全陪)或旅游者提出小的修改意见或增加新的游览项目时： 及时反映：地\n\n陪应及时向旅行社反映；合理安排：对“合理又可能”满足的项目，应予以安排；费用说明：\n\n对需加收费用的项目，地陪要事先向入境领队(全陪)或旅游者讲明，按有关规定收取费用；\n\n耐心解释：对确有困难且无法满足的要求，地陪要详细解释、耐心说服；入境领队(全陪)\n\n或旅游者提出的要求与原行程不符且涉及接待规格时： 婉言拒绝：一般应婉言拒绝，说明\n\n这涉及变更旅游合同，需要双方协商；特殊处理：如确有特殊理由且由入境领队(全陪)提出，\n\n地陪必须请示旅行社，视情况而定。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABCD","stem":"下列选项中，属于地陪导游为游客提供的购物服务内容的有( )。","options":{"A":"地陪严格依据旅游合同或接待计划中规定的购物次数、购物场所和停留时间","B":"禁止擅自增加购物次数或延长停留时间","C":"不得向旅游者兜售任何物品","D":"严禁以不正当手段强迫或变相强迫旅游者参与购物活动","E":"对于不愿参加购物活动的旅游者，令其自由活动"},"explanation":"《中华人民共和国旅游法》《导游管理办法》《导游服务规范》等法律法规明确规定导\n\n游的购物服务行为。地陪应严格依据旅游合同或接待计划中规定的购物次数、购物场所和停\n\n留时间，有序组织旅游者进行购物活动，禁止擅自增加购物次数或延长停留时间，不得向旅\n\n游者兜售任何物品；严禁以殴打、弃置、限制活动自由、恐吓、侮辱、咒骂等不正当手段强\n\n迫或变相强迫旅游者参与购物活动，同时不得接受购物场所经营者以回扣、佣金、人头费或\n\n奖励费等名义给予的不正当利益；对于不愿参加购物活动的旅游者，地陪应妥善安排其行程，\n\n例如安排其就近参观其他景点或在环境适宜的地点休息等候，以确保所有旅游者都能在舒心\n\n的氛围中度过购物时段。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABC","stem":"地陪导游带领游客抵达景区后、进入景区前，操作正确的是( )。","options":{"A":"下车前，地陪提醒旅游者记住车型、颜色、标志、车牌号、停车地点和开车时间","B":"若景点下车和上车地点不同，特别提醒上车地点","C":"下车后，引导旅游者至景点示意图前，讲解游览线路","D":"讲解时，做到“导”“游”结合，集中与分散相宜，劳逸结合","E":"根据旅游者文化程度、理解能力和地域差异调整讲解方式"},"explanation":"抵达景点后的服务进入景区前：(1)车辆信息：抵达景点后，下车前，地陪提醒旅游\n\n者记住车型、颜色、标志、车牌号、停车地点和开车时间。(2)特殊地点：若景点下车和上\n\n车地点不同，特别提醒上车地点。(3)示意图前讲解：下车后，引导旅游者至景点示意图前，\n\n讲解游览线路，交代注意事项，强调人身财产安全、预防走失，讲清停留时间、集合时间和\n\n地点。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ABCD","stem":"全陪导游的末站服务内容有( )。","options":{"A":"全陪要与地陪、领队提前落实离站交通票据","B":"提醒妥善保管随身携带的证件和贵重物品","C":"与地陪结清费用，保管好票据","D":"做好回头客营销工作","E":"处理好客人遗留问题"},"explanation":"E 项，处理好客人遗留问题属于后续服务。其他选项描述正确。","clips":[]},{"n":154,"kind":"多项选择题","answer":"BDE","stem":"领队带领游客文明旅游，在酒店住宿期间应该做到( )。","options":{"A":"提醒游客在饭店抽烟，不要出去后再抽","B":"尊重服务人员，服务人员问好时要友善回应","C":"应引导游客增加一次性物品的使用，干净卫生","D":"提醒游客在客房区域举止文明","E":"提醒游客在客房内消费的，应在离店前主动声明并付费"},"explanation":"1.导游领队应提醒游客尊重服务人员，服务人员问好时要友善回应。2.导游领队应指\n\n引游客爱护和正确使用住宿场所设施设备，注意维护客房和公用空间的整洁卫生，提醒游客\n\n不在酒店禁烟区域抽烟。3.导游领队应引导游客减少一次性物品的使用，减少环境污染，节\n\n水节电。4.导游领队应提醒游客在客房区域举止文明，如在走廊等公共区域衣着得体，出入\n\n房间应轻关房门，不吵闹喧哗，宜调小电视音量，以免打扰其他客人休息。5.导游领队应提\n\n醒游客在客房内消费的，应在离店前主动声明并付费。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABC","stem":"下列内容中，属于同类相异类比的选项是( )。","options":{"A":"在风格上，将颐和园与凡尔赛宫花园进行比较","B":"在规模上，将唐代长安城与罗马帝国的首都君士坦丁堡相比","C":"在价值上，将秦始皇陵地宫宝藏与古埃及第十八朝法老图坦卡蒙陵墓的宝藏相比","D":"将北京的王府井比作日本东京的银座、美国纽约的第五大街","E":"讲到梁山伯和祝英台的故事时，可以将其称为“中国的罗密欧和朱丽叶”"},"explanation":"将同类但在规模、质量、风格等方面不同的事物或现象进行比较，加深旅游者印象。\n\n举例：在风格上，将颐和园与凡尔赛宫花园进行比较，它们都是皇家园林，都在市郊，但它\n\n们在风格上迥然不同；同样，在规模上，将唐代长安城与罗马帝国的首都君士坦丁堡相比；\n\n在价值上，将秦始皇陵地宫宝藏与古埃及第十八朝法老图坦卡蒙陵墓的宝藏相比。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABDE","stem":"根据《旅行社安全规范》，导游应协助旅行社在招徕环节完成的安全准备工作包括( )。","options":{"A":"要求旅游者提供与旅游活动相关的个人健康信息，并以书面形式予以确认","B":"对旅游线路和旅游项目风险等安全事宜做出明示","C":"调查了解游客经济实力，是否能够满足出国旅游需求","D":"应建议旅游者购买个人旅游意外保险，以防范旅游过程中的各类风险","E":"提醒旅游者出发前带齐旅游行程中必要的证件和物品"},"explanation":"根据《旅行社安全规范》(LB/T028‑ 2013)，导游应协助旅行社在招徕环节完成以下\n\n安全准备：(1)健康信息确认：应要求旅游者提供与旅游活动相关的个人健康信息，并以书\n\n面形式予以确认。(2)风险提示告知：对旅游线路和旅游项目风险等安全事宜做出明示，包\n\n括：·对旅游行程和活动的身体素质要求作出提示；·明示某些疾病患者可能的风险；·对身\n\n体素质可能不宜参加某些旅游活动的报名者做出提示、警示或劝阻；·恶劣天气或者不可抗\n\n力事件对旅游行程安全可能构成的威胁。(3)保险建议：应建议旅游者购买个人旅游意外保\n\n险，以防范旅游过程中的各类风险。(4)证件与物品提醒：提醒旅游者出发前带齐旅游行程\n\n中必要的证件和物品。","clips":[]},{"n":157,"kind":"多项选择题","answer":"AB","stem":"关于增加计划外景点的操作，正确的是( )。","options":{"A":"全体旅游者要求增加景点，首先征得领队或全陪的同意，并做好全体旅游者签名记录","B":"全体旅游者要求增加景点，及时将相关情况报告旅行社，按照旅行社提供的标准收取增加景点的费用","C":"由于是新增旅游景点，导游将游客送至景点即可","D":"若有少数旅游者不参与该新增景点游览，导游让游客自由活动","E":"个别旅游者要求增加景点，导游婉言拒绝"},"explanation":"首先征得领队或全陪的同意，并做好全体旅游者签名记录，以确保后续操作有据可依；\n\n及时将相关情况报告旅行社，按照旅行社提供的标准收取增加景点的费用，并将收据妥善交\n\n给旅游者或领队，保障费用收取的规范性与透明度；导游应全程带领旅游者开展活动，并提\n\n供相应的讲解服务以及安全保障，确保旅游者的游览体验与安全；若有少数旅游者不参与该\n\n新增景点游览，导游应妥善安排好这部分旅游者的活动，充分保障他们的合法权益，避免其\n\n权益受损。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABDE","stem":"发生漏接事故以后，导游应该( )。","options":{"A":"导游应沉着冷静，设法弥补，并及时向旅行社报告","B":"尽快与旅游者会合","C":"诚恳地向旅游者道歉，并说明不是因为个人原因漏接的","D":"提供热情周到的高质量服务，减轻漏接造成的不良影响","E":"若因漏接导致旅游者产生额外费用，导游应主动给予报销"},"explanation":"导游应沉着冷静，设法弥补，并及时向旅行社报告，依据旅行社给出的意见，结合实\n\n际情况灵活处理；1.尽快与旅游者会合：知晓旅游者抵达后，导游应第一时间与其联系，争\n\n取尽快会面；2.道歉并说明情况：见面后，导游首先需诚恳地向旅游者道歉，随后实事求是\n\n地说明情况，并力求获得旅游者的谅解；3.积极采取弥补措施：一方面，导游可通过提供热\n\n情周到的高质量服务，减轻漏接造成的不良影响；另一方面，若因漏接导致旅游者产生额外\n\n费用，导游应主动给予报销。如有必要，还可通过加菜、赠送本地特产等方式，给予旅游者\n\n物质补偿。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABC","stem":"在旅游过程中为了避免游客走失，导游应( )。","options":{"A":"提醒旅游者记住导游电话、旅行社名称、旅游车标志与车号等信息","B":"游览时提醒不要走散，自由活动时确保老人和孩子身边有照顾者","C":"到景点后，利用导览图介绍景点线路、集合信息","D":"地陪、全陪或领队做好断后工作","E":"要经常催促、警示喜欢拍照的游客跟上队伍"},"explanation":"1.做好提醒工作，在旅游初期，提醒旅游者记住导游联系电话、旅行社名称、旅游车\n\n标志与车号等基本信息；游览时提醒不要走散，自由活动时确保老人和孩子身边有照顾者，\n\n并讲清集合时间与地点；提醒旅游者走散后不要乱跑，及时联系导游或亲友；2.提前告知旅\n\n游安排，提前告知旅游者行程安排，强调易走失场合；到景点后，利用导览图介绍景点线路、\n\n集合信息等；3.关注旅游者动向，导游密切配合，地陪讲解时，全陪或领队做好断后工作；\n\n关注旅游者动向，及时提醒只顾拍照等个人行为的旅游者跟上队伍，重点关注老人、孩子及\n\n行为散漫者；养成清点人数习惯，发现有人不在及时寻找；4.提供精彩讲解，导游以精彩讲\n\n解吸引旅游者，通过高超技巧和趣味内容，防止走失。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABCE","stem":"旅途中行李丢失会非常影响游客的心情，导游应该( )，避免此类事件发生。","options":{"A":"多做提醒工作","B":"在行李箱上贴醒目粘贴纸或挂姓名电话行李牌，防止错拿","C":"搬运行李时，务必清点件数，尤其在交接过程中要细致","D":"锁好行李箱，防止拉链松开导致行李被压坏","E":"当车上无人时，导游应提醒司机锁好车窗门"},"explanation":"(1)多做提醒工作，在酒店办理入住、用餐、离店等环节，旅游者可能因行色匆忙忘\n\n记携带行李。导游需在上下车、出入酒店等场景随时提醒。(2)做上醒目标记，在行李箱上\n\n贴醒目粘贴纸或挂姓名电话行李牌，便于快速识别、防止错拿。(3)做好行李清点，导游协\n\n助搬运行李时，务必清点件数，尤其在交接过程中要细致。(4)提醒司机锁好行李舱和门窗，\n\n当车上无人时，导游应提醒司机锁好车窗门，并和司机确认放置行李的车厢已上锁。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCDE","stem":"当旅游者遭遇传染病疫情时，导游处理得当的选项是( )。","options":{"A":"立即暂停旅游活动，第一时间向旅行社及其所在地、疫情发生地旅游主管部门报告","B":"认为应进行防疫检查的，立即将旅游者送至当地疾病预防控制机构","C":"配合相关部门和单位做好旅游者隔离、密切接触者追踪或采取其他措施","D":"根据疫情发展情况，按旅行社的安排，调整或变更旅游行程","E":"如患者系外籍人士，由我国公安机关令其提前出境的，协助患者办理相关离境手续"},"explanation":"(1)立即暂停旅游活动，在第一时间向旅行社及其所在地、疫情发生地旅游主管部门\n\n报告，并及时向附近的疾病预防控制机构报告详细情况，配合开展旅游者防疫、安抚和宣传\n\n解释工作；(2)有关部门认为应对旅游者进行防疫检查的，立即将旅游者送至当地疾病预防\n\n控制机构或有关部门指定的其他场所；(3)经查旅游者确患传染病的，遵照当地有关疫情防\n\n控指引和要求，配合相关部门和单位做好旅游者隔离、密切接触者追踪或采取其他措施，并\n\n通知其亲属；(4)关注目的地疫情防控动态，宜根据疫情发展情况，按旅行社的安排，调整\n\n或变更旅游行程；(5)如患者系外籍人士，由我国公安机关令其提前出境的，协助患者办理\n\n相关离境手续。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABD","stem":"带团期间遭遇台风，导游应该( )。","options":{"A":"导游应密切关注台风动向，为合理调整行程提供依据","B":"若在徒步游览景点时遭遇台风，切勿在广告牌、大树等附近躲避风雨","C":"如身处室内，可坐在窗户附近观测台风大小","D":"当身处室内遇到台风，迅速关好门窗，用胶布在玻璃上贴成“米”字形","E":"根据经验判断台风，通常二三十分钟之后，台风就会过去"},"explanation":"关注台风动态：导游应密切关注台风动向，实时了解最新气象信息，为合理调整行程\n\n提供依据； 徒步景点应对：若在徒步游览景点时遭遇台风，切勿在临时建筑物、广告牌、\n\n铁塔、大树等附近躲避风雨，也不得靠近或触摸倒在路上的电线，以防触电危险。应迅速寻\n\n找房屋等室内空间进行躲避；关闭门窗：当身处室内或及时回到室内时，要迅速关好门窗，\n\n并用胶布在窗户玻璃上贴成“米”字形； 当台风骤然停止时，并不意味着台风已经远离。\n\n通常二三十分钟之后，狂风暴雨还会突然再次来袭，所以此时千万不可掉以轻心，仍要保持\n\n警惕并做好防护措施。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABE","stem":"海岛旅游期间，( )可以科学合理地规避海啸。","options":{"A":"若海岛有地震震感，提醒旅游者避免前往海边游玩，做好防海啸准备","B":"发现潮汐出现突然反常涨落，立即组织旅游者撤离至地势较高的地方","C":"当海水异常退去时，可少量捡拾鱼虾，然后迅速撤离","D":"如果在乘船时遇到海啸，要让船只迅速靠岸，游客弃船逃生","E":"导游需关注新闻中的地震报道以及当地发布的海啸预警信息"},"explanation":"1.留意地震信息，地震是海啸发生的最明显前兆，导游需关注新闻中的地震报道以及\n\n当地发布的海啸预警信息。若现场有震感，应提醒旅游者避免前往海边游玩，并做好防海啸\n\n准备。需注意，海啸有时会在地震发生几小时后抵达距离震源上千公里的地方，因此不能放\n\n松警惕。2.关注潮汐状况，一旦发现潮汐出现突然反常涨落，海平面显著下降或有巨浪袭来，\n\n且有大量水泡冒出时，应立即组织旅游者撤离至陆地地势较高的地方。当海啸前海水异常退\n\n去时，往往会将大量鱼虾等海生动物留在浅滩，形成壮观场面，但此时万不可去捡拾鱼虾或\n\n看热闹，应迅速离开海岸，因为这很可能是海啸即将来袭的危险信号。3.海上船只避免返回\n\n港湾，海啸在海港中会引发巨大落差和湍流，十分危险。船主应在海啸到达前，将船只驶向\n\n开阔海面，此时深海区相较于海岸更为安全。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ACE","stem":"关于铁路退票规则表述正确的是( )。","options":{"A":"不晚于开车前 30 分钟可在 12306.cn 网站上办理","B":"距开车不足 1 小时，须持购票证件至窗口办理","C":"开车前 8 天(含 8 天)以上退票的，不收退票费","D":"团体票(20 人以上同行程)退改签需不晚于开车前 24 小时","E":"每张车票仅允许改签 1 次"},"explanation":"团体票(20 人以上同行程)退改签需不晚于开车前 48 小时；改签限制：每张车票仅允\n\n许改签 1 次，已取纸质票须在窗口办理；开车前 8 天(含 8 天)以上退票的，不收退票费；未\n\n换取纸质票且不晚于开车前 30 分钟：可在 12306.cn 网站上办理；已取票或距开车不足 30\n\n分钟：须持购票证件至窗口办理。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ABE","stem":"关于我国离境退税的政策描述正确的选项是( )。","options":{"A":"在我国境内连续居住少于或等于 183 天的外国人和港澳台同胞可以享受离境退税政策","B":"境外旅客本人在退税商店购买且符合退税条件的个人物品享受离境退税政策","C":"同人同日同店购物大于或者等于 500 元人民币","D":"退税金额在 10000 元人民币以上就必须转账","E":"购买日距离境日必须小于或者等于 90 天"},"explanation":"在我国境内连续居住≤183 天的外国人和港澳台同胞；境外旅客本人在退税商店购买\n\n且符合退税条件的个人物品；同人同日同店购物≥200 元人民币；购买日距离境日≤90 天；\n\n大于 20000 元银行转账。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper3-subject12-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
