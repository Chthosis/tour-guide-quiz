<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"对","stem":"依据《中华人民共和国宪法》的规定，劳动既是公民的权利，也是公民的义务。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《宪法》第 42 条规定，中华人民共和国公民有劳动的权利和义务。","clips":[]},{"n":2,"kind":"判断题","answer":"对","stem":"根据《中华人民共和国宪法》的规定，公民必须遵守公共秩序，尊重社会公德。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。宪法第 3 条规定公民必须遵守公共秩序，尊重社会公德。在这里\"必\n\n须\"体现出宪法的法律地位，强调\"根本性、无条件\"义务。","clips":[]},{"n":3,"kind":"判断题","answer":"对","stem":"依据《民法典》，法律、行政法规规定或者当事人约定采用特定形式的，应当采用特定形式。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。民事法律行为可以采用书面形式、口头形式或者其他形式；法律、行\n\n政法规规定或者当事人约定采用特定形式的，应当采用特定形式。","clips":[]},{"n":4,"kind":"判断题","answer":"对","stem":"根据《民法典》的规定，当事人应当遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、 协助、保密等义务。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":5,"kind":"判断题","answer":"错","stem":"《旅行社条例》规定，旅行社每设立一个经营国内旅游业务和入境业务的分社，应当向其注册资本 账户增存 5 万元。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。错在注册资本账户。每设立 1 个经营国内旅游业务和入境旅游业务的\n\n分社，应当向其质量保证金账户增存 5 万元；每设立 1 个经营出境旅游业务的分社，应当向\n\n其质量保证金账户增存 30 万元。无须增加注册资金。","clips":[]},{"n":6,"kind":"判断题","answer":"错","stem":"对于滋扰跟踪他人的行为，仅可以由人民法院责令行为人禁止接触被侵害人。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《中华人民共和国治安管理处罚法》第五十条第二款，有前款第五项\n\n规定的滋扰、纠缠、跟踪行为的，除依照前款规定给予处罚外，经公安机关负责人批准，可\n\n以责令其一定期限内禁止接触被侵害人。对违反禁止接触规定的，处五日以上十日以下拘留，\n\n可以并处一千元以下罚款。本题说法错在\"仅可以由人民法院\"。","clips":[]},{"n":7,"kind":"判断题","answer":"错","stem":"根据《旅游投诉处理办法》第 5 条的规定，旅游投诉应当由旅游经营者住所地的县级以上旅游投诉处 理机构管辖。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《旅游投诉处理办法》第 5 条规定:\"旅游投诉由旅游经营者住所地、\n\n旅游合同签订地或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。\"旅游经营者住所地、\n\n旅游合同签订地、旅游纠纷发生地三个地点的机构均有管辖权，投诉人可择一选择，并不是\n\n\"应当\"由旅游经营者住所地的县级以上旅游投诉处理机构管辖。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"《旅游安全管理办法》规定，省级旅游主管部门应当于每月 5 日前，将本地区上月发生的较大旅游突 发事件报文化和旅游部备案。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。省级旅游主管部门应当于每月 5 日前，将本地区上月发生的较大旅游\n\n突发事件报文化和旅游部备案，内容应当包括突发事件发生的时间、地点、原因及事件类型\n\n和伤亡人数等。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"根据《中华人民共和国民用航空法》的规定，实施危害民用航空安全或者扰乱民用航空秩序的行 为，构成违反治安管理行为的，由公安机关依法追究刑事责任。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。第 255 条，违反本法规定，实施危害民用航空安全或者扰乱民用航空\n\n秩序的行为，构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，\n\n依法追究刑事责任。","clips":[]},{"n":10,"kind":"判断题","answer":"对","stem":"根据《自然保护区条例》的规定，在核心保护区内开展法律规定以外的活动，造成生态破坏的， 令限期修复，处 100 万元以上 500 万元以下罚款。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《自然保护区条例》第四十条:在自然保护区核心保护区内开展本条例\n\n第二十六条规定以外的活动的，由县级以上人民政府林业草原、自然资源、生态环境、水行\n\n政、农业农村等有关部门按照职责分工责令停止违法行为，没收违法所得，可以处 10 万元\n\n以下的罚款；属于违法修筑设施或者进行工程建设的，责令限期拆除、恢复原状，处 10 万\n\n元以上 100 万元以下的罚款；造成生态破坏的，责令限期修复或者采取其他补救措施，处\n\n100 万元以上 500 万元以下的罚款。该表述中\"造成生态破坏\"的罚款为\"100 万元以上 500\n\n万元以下罚款\"，故判断为对。","clips":[]},{"n":11,"kind":"判断题","answer":"错","stem":"《保护世界文化和自然遗产公约》规定，本公约缔约国领土内的文化遗产和自然遗产的确定、保 护、保存、展出和遗传后代，主要是缔约国共同的责任。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。本公约缔约国领土内的文化遗产和自然遗产的确定、保护、保存、展\n\n出和遗传后代，主要是有关国家的责任。故本题后半句说法错误。","clips":[]},{"n":12,"kind":"判断题","answer":"对","stem":"人民是历史的创造者，是决定党和国家前途命运的根本力量。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\"十四个坚持\"中的坚持以人民为中心明确指出人民的这一地位。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"全面从严治党必须以党章为根本遵循，把党的政治建设摆在首位。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。全面从严治党必须以党章为根本遵循，把党的政治建设摆在首位。","clips":[]},{"n":14,"kind":"判断题","answer":"对","stem":"根据《关于印发 2026 年版团队旅游合同(示范文本)的通知》，因地接社、履行辅助人违约，旅游 者既可以向组团社主张权利，也可以直接向地接社、履行辅助人追责。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2026 年版合同拓宽了维权路径，旅游者既可以告组团社，也可直接\n\n向地接社、履行辅助人追责。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"《港区国安法》规定，驻香港特别行政区维护国家安全公署的经费由香港特区政府保障。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《港区国安法》第 51 条规定:\"驻香港特别行政区维护国家安全公署的\n\n经费由中央财政保障。该规定确保驻港国安公署独立行使职权，不受地方财政制约，体现中\n\n央对香港国家安全事务的直接责任和统一领导。经费由中央保障，有利于保障执法的权威性、\n\n独立性和高效性，防止外部干预。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"根据《国旗法》的规定，升挂国旗时，可以举行升旗仪式。举行升旗仪式时，可以奏唱国歌。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。根据《国旗法》规定:\"升挂国旗时，可以举行升旗仪式。举行升旗仪\n\n式时，应当奏唱国歌。在国旗升起的过程中，在场人员应当面向国旗肃立，行注目礼或者按\n\n照规定要求敬礼，不得有损害国旗尊严的行为。\"由此可见，升挂国旗\"不一定\"要举行升旗\n\n仪式，只有在举行升旗仪式时才\"应当\"奏唱国歌，而非\"可以\"。原题中\"可以奏唱国歌\"错误：\n\n将\"强制性义务\"降为\"可选行为\"。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"米兰冬残奥会上，中国代表团以 15 金 13 银 16 铜的成绩位居金牌榜第一、奖牌榜第二。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为\"金牌榜、奖牌榜双第一\"。米兰冬残奥会‑ 2026 年 3 月举行，\n\n中国代表团 15 金 13 银 16 铜，金牌榜、奖牌榜双榜首，创境外参赛最佳战绩。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"2026 年 7 月 1 日上午，庆祝中国共产党成立 105 周年大会在北京人民大会堂隆重举行，习近平向 6 名 \"七一勋章\"获得者颁授勋章并发表重要讲话。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为\"8 名\"。2026 年 7 月 1 日上午 10 时，庆祝中国共产党成立 105\n\n周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平向\n\n\"七一勋章\"获得者颁授勋章并发表重要讲话，大会还对全国优秀共产党员、全国优秀党务工\n\n作者和全国先进基层党组织进行了表彰。习近平在讲话中深刻阐述了中国共产党之所以能够\n\n在 105 年奋斗中不断铸就辉煌的\"优秀特质\"。\"七一勋章\"颁授‑ ‑ 2026 年 7 月 1 日授 8 名：\n\n马善祥、王於昌、李连成、吾哈斯·苏来曼、吴亚琴、陈俊武、赵亚夫、钟掘；\"七一勋章\n\n\"2017 年设立，2021 年首次颁授。","clips":[]},{"n":19,"kind":"判断题","answer":"错","stem":"2026 年 9 月 19 日至 10 月 4 日在日本举行的第二十届亚洲运动会上，中国体育代表团获得 143 枚金 牌，位居金牌榜首位。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为\"169 枚\"。第二十届亚运会(爱知·名古屋亚运会)上，中国代表\n\n团以 169 金 89 银 83 铜共 341 枚奖牌收官，位居金牌榜、奖牌榜首位，超越 2006 年多哈亚\n\n运会的 165 金，创造境外参加亚运会最佳战绩。143 枚为赛期网络流传的失实数据。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"截至 2026 年 7 月底，我国光伏发电装机容量达 12.86 亿千瓦，首次超过煤电，成为我国装机规模最 大的单一电源类型。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。国家能源局 2026 年 9 月 1 日发布数据：截至 2026 年 7 月底，全国光\n\n伏发电装机容量达到 12.86 亿千瓦，同期煤电装机 12.85 亿千瓦，光伏装机规模首次超过煤\n\n电，成为我国装机规模最大的单一电源类型，改变了长期以来以煤电作为第一大电源的格局。\n\n此前，2026 年上半年煤电发电量占全国总发电量比重首次降至 50%以下。","clips":[]},{"n":21,"kind":"判断题","answer":"错","stem":"世界上第一次商业性旅游活动是从莱斯特到利物浦团体消遣性旅游。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。世界上第一次商业性旅游活动是包租火车组织 570 人从莱斯特到拉夫\n\n巴勒参加禁酒大会。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"初级、中级导游在获得相应表彰奖励 2 年内，可以通过激励晋升的方式申请晋升一个导游等级。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":23,"kind":"判断题","answer":"对","stem":"导游旗形状以长方形或三角形为宜，字迹清晰、易辨识，无违背公良俗的文字、符号或图案。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":24,"kind":"判断题","answer":"错","stem":"地陪带领客人入住饭店时，要迅速收齐旅游者证件，快速办理入住登记手续。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。请入境领队或全陪收齐旅游者证件，然后旅游者名单表一并交给饭店\n\n前台，讲明团队名称、订房单位，快速办理入住登记手续。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"对于从事违法活动的游客，不劝阻、不能制止的，导游可与其解除旅游合同。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。对于从事违法或违反社会公德活动的游客，或从事严重影响其他游客\n\n权益的活动，不听劝阻、不能制止的，根据旅行社的指示，导游领队可代表旅行社与其解除\n\n旅游合同。","clips":[]},{"n":26,"kind":"判断题","answer":"对","stem":"在导游工作中，口头语言是导游语言的主体，而书面语言则能够起到辅助作用。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"进行登山运动时，需要携带足量饮用水、高热量食物、基础急救药品及防晒用品。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"用于呈现庄重、严肃、平淡、冷静等情感状态的时候，适宜采用平直调。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":29,"kind":"判断题","answer":"错","stem":"导游带领游客参观长江三峡时，宜采用概述法为游客进行讲解。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。导游带领游客参观长江三峡时，宜采用分段讲解法为游客进行讲解。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"导游带团过程中，乘坐交通工具通常是先下后上。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":31,"kind":"判断题","answer":"对","stem":"带亲子团的导游应多采用有情节的故事、启发式和提问式讲解，满足不同年龄段成员的要求。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"变数较大是商务团的一大特点，需要导游有很强的灵活应对能力，随时应对旅游行程的变更。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"外国旅游者为团体签证时，须协助其去当地公安机构出入境管理部门办理分离团队签证或延长个人 旅华签证手续，费用由旅行社与游客各半。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。外国旅游者为团体签证时，须协助其去当地公安机构出入境管理部门\n\n办理分离团队签证或延长个人旅华签证手续，费用由游客自理。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"因游客个别要求没有得到满足，游客经劝说执意退团的，所剩余的费用一律不退。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。因游客个别要求没有得到满足，游客经劝说执意退团的，所剩余的费\n\n用按照合同规定处理。","clips":[]},{"n":35,"kind":"判断题","answer":"错","stem":"旅游者在购买文物古玩时务必妥善保管好发票，并注意擦除古玩上的火漆印。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。告知旅游者在购买文物古玩时务必妥善保管好发票，并注意保留古玩\n\n上的火漆印。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"面色青紫肿胀、眼球结膜充血、口鼻内充满泡沫等杂物，这是溺水的症状表现。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":37,"kind":"判断题","answer":"错","stem":"若在野外活动时遭遇雷电，因客车对雷电有较强的导电作用，因此导游应迅速带领游客离开客车躲 避。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。若在野外活动时遭遇雷电，应迅速回到旅游客车躲避。客车对雷电有\n\n较好的屏蔽作用。","clips":[]},{"n":38,"kind":"判断题","answer":"对","stem":"按照国际惯例，持有联程机票且在 24 小时内不出机场直接过境的人员一般免办签证。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":39,"kind":"判断题","answer":"错","stem":"由于航司原因造成航班取消或者延误，旅客退票需要收取一定比例的退票费。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。由于航司原因造成航班取消或者延误，承运人或者代理人必须免费处\n\n理。","clips":[]},{"n":40,"kind":"判断题","answer":"错","stem":"除有 3C 认证以外，严禁其他游客携带额定能量大于 160Wh 的充电宝上飞机。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。严禁携带额定能量>160Wh 的充电宝。","clips":[]},{"n":41,"kind":"单项选择题","answer":"C","stem":"2026 年 11 月 18 日至 19 日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议，其 主题是(    )。","options":{"A":"共促繁荣，共赢未来","B":"开放·互通·协同","C":"建设亚太共同体，促进共同繁荣","D":"打造有效、包容、共同的解决方案"},"explanation":"2026 年 APEC 第三十三次领导人非正式会议主题为\"建设亚太共同体，促进共同繁荣\"，\n\n三大优先合作领域为\"开放、创新、合作\"。这是中国继 2001 年上海、2014 年北京之后第三\n\n次担任 APEC 东道主。","clips":[]},{"n":42,"kind":"单项选择题","answer":"A","stem":"根据《中华人民共和国宪法》第 10 条的规定，土地的使用权(       )。","options":{"A":"可以依照法律规定转让","B":"一律不得转让","C":"可以由公民自由转让","D":"只能由国家统一使用"},"explanation":"使用转让：土地的使用可以依照法律规定转让。B 项错误，宪法第 10 条规定土地的\n\n使用可以依照法律规定转让，\"一律不得转让\"与宪法规定相；C 项错误，土地的使用权须\"\n\n依照法律规定\"转让，并非可自由转让；D 项错误，土地的使用权可以依法转让，并非只能\n\n由国家统一使用。","clips":[]},{"n":43,"kind":"单项选择题","answer":"A","stem":"根据《中华人民共和国宪法》的规定，作为精神文明建设核心、国家倡导的是(             )。","options":{"A":"社会主义核心价值观","B":"个人主义价值观","C":"功利主义价值观","D":"自由主义价值观"},"explanation":"宪法第 24 条第 2 款明确：\"国家倡导社会主义核心价值观……\"。灵魂引领：社会主\n\n义核心价值观是精神文明建设的核心。B 项错误，个人主义是宪法第 24 条第 2 款明确反对\n\n的腐朽思想，不是国家倡导的价值观；C 项错误，功利主义不属于社会主义核心价值观；D\n\n项错误，自由主义思想属于国家反对的腐朽思想范畴。","clips":[]},{"n":44,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国宪法》的规定，人民主权原则中\"直接参与\"的实现形式是(            )。","options":{"A":"通过选举人大代表行使国家权力","B":"人民依照法律规定，通过各种途径和形式，管理国家事务、经济文化事业和社会事务","C":"通过人民政协进行民主监督","D":"通过新闻舆论进行监督"},"explanation":"直接参与：人民依照法律规定，通过各种途径和形式，管理国家事务、经济文化事业\n\n和社会事务。 A 项错误，通过选举人大代表行使国家权力属于代议民主，不是直接参与； C\n\n项错误，通过人民政协进行民主监督是政协的重要功能，不是宪法规定的直接参与形式； D\n\n项错误，新闻舆论监督属于监督方式，不属于直接参与的实现形式。","clips":[]},{"n":45,"kind":"单项选择题","answer":"B","stem":"宪法规定，(   )并享有政治权利的，具有选举权和被选举权。","options":{"A":"凡是满 18 周岁的中华人民共和国人民","B":"凡是满 18 周岁的中华人民共和国公民","C":"16 周岁以上以自己的收入为主要生活来源的中华人民共和国公民","D":"16 周岁以上以自己的收入为主要生活来源的中华人民共和国人民"},"explanation":"宪法第 34 条规定：中华人民共和国年满 18 周岁的公民，不分民族、种族、性别、职\n\n业、家庭出身、宗教信仰、教育程度、财产状况、居住期限，都有选举权和被选举权，但是\n\n依照法律被剥夺政治权利的人除外。","clips":[]},{"n":46,"kind":"单项选择题","answer":"A","stem":"根据我国宪法关于公民基本权利的规定，下列说法正确的是(    )。","options":{"A":"我国公民在年老、疾病或者丧失劳动能力时有获得物质帮助的权利","B":"国家和社会保障军人的生活","C":"我国公民有信仰宗教与公开传教的自由","D":"我国公民有任意休息的权利"},"explanation":"国家和社会保障\"残废\"军人的生活；公民有宗教信仰自由，没有\"公开传教\"自由；\"\n\n公民有任意休息的权利\"错误，劳动者有休息的权利。","clips":[]},{"n":47,"kind":"单项选择题","answer":"C","stem":"我国宪法规定，除因国家安全或者追查刑事犯罪的需要，由(    )依照法律规定的程序对通信进行 检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","options":{"A":"人民法院","B":"人民政府","C":"检察机关","D":"监察机关"},"explanation":"除因国家安全或者追查刑事犯罪的需要，由公安机关或者检察机关依照法律规定的程\n\n序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","clips":[]},{"n":48,"kind":"单项选择题","answer":"B","stem":"景区不符合本法规定的开放条件而接待旅游者的，根据《旅游法》的规定，以下说法正确的是 (    )。","options":{"A":"由旅游行政管理部门责令停业整顿直至符合开放条件","B":"罚款 2 万元以上 20 万元以下","C":"情节严重的，两年内不再接受其开放申请","D":"对直接负责的主管人员，处 2000 元以上 2 万元以下罚款"},"explanation":"《旅游法》第 105 条景区不符合本法规定的开放条件而接旅游者的，由景区主管部门\n\n责令停业整顿直至符合开放条件，并处 2 万元以上 20 万元以下罚款。","clips":[]},{"n":49,"kind":"单项选择题","answer":"C","stem":"根据《旅游法》的规定，因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托 其他旅行社履行合同。组团社、旅游者、受委托的旅行社之间存在(          )关系。","options":{"A":"受委托的旅行社对旅游者承担责任，组团社对受委托的旅行社承担责任","B":"组团社、受委托的旅行社对旅游者均承担责任","C":"组团社对旅游者承担责任，受委托的旅行社对组团社承担责任","D":"旅游者对受委托的旅行社承担责任，组团社对旅游者承担责任"},"explanation":"《旅游法》第 63 条第 2 款规定：\"因未达到约定人数不能出团的，组团社经征得旅游\n\n者书面同意，可以委托其他旅行社履行合同。组团社对旅游者承担责任，受委托的旅行社对\n\n组团社承担责任。\" 因此，正确选项是 C，该规定确立了\"责任分层\"机制。组团社作为合同\n\n主体，始终对旅游者负责；受委托的旅行社(地接社或接替社)仅对组团社负责，形成\"对外\n\n一对内\"双层责任结构。","clips":[]},{"n":50,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，以下关于合同转让和转移的说法正确的是(      )。","options":{"A":"合同的转让是合同内容的变更，合同的主体并不发生变化","B":"债务人将合同的义务全部或者部分转移给第三人的，应当通知债权人","C":"当事人一方经对方同意，可以将自己在合同中的权利和义务一并移转给第三人","D":"法人合并的，其权利和义务由原法人享有和承担"},"explanation":"《民法典》规定，合同的转让是合同主体的变更；《民法典》第 551 条规定，债务人将\n\n债务的全部或者部分转移给第三人的，应当经债权人同意；《民法典》第 555 条规定，当事\n\n人一方经对方同意，可以将自己在合同中的权利和义务一并转让给第三人；《民法典》第 67\n\n条规定，法人合并的，其权利和义务由合并后的法人享有和承担。","clips":[]},{"n":51,"kind":"单项选择题","answer":"A","stem":"根据《民法典》的规定，处理民事纠纷，应当依照法律；法律没有规定的，可以(   )。","options":{"A":"适用习惯，但是不得违背公序良俗","B":"适用社会公德，但不得损害社会公共利益","C":"适用地方政策","D":"适用行业管理"},"explanation":"《民法典》第 10 条规定：\"处理民事纠纷，应当依照法律；法律没有规定的，可以适\n\n用习惯，但是不得违背公序良俗。\"因此，A 项正确。","clips":[]},{"n":52,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，民法调整的是平等主体之间的(   )。","options":{"A":"人身关系","B":"财产关系","C":"人身关系和财产关系","D":"人身关系或财产关系"},"explanation":"《民法典》第 2 条规定：\"民法调整平等主体的自然人、法人和非法人组织之间的人身\n\n关系和财产关系。\"因此， C 项正确。","clips":[]},{"n":53,"kind":"单项选择题","answer":"A","stem":"依据《民法典》，限制民事行为能力人实施民事法律行为由其法定代理人代理或者经其法定代理人 同意、追认。但是，可以独立实施纯获利益的民事法律行为或者与其智力、(   )相适应的民事法律行为。","options":{"A":"精神健康状况","B":"身体健康状况","C":"身体和精神健康状况","D":"身体或者精神健康状况"},"explanation":"《民法典》第 22 条规定：\"可以独立实施纯获利益的民事法律行为或者与其智力、精\n\n神健康状况相适应的民事法律行为。\"因此，A 项正确。","clips":[]},{"n":54,"kind":"单项选择题","answer":"B","stem":"根据《民法典》的规定，当事人就有关合同的内容对质量要求不明确的，如果不能达成补充协议， 则首先按照(   )履行。","options":{"A":"行业标准","B":"交易习惯","C":"强制性国家标准","D":"推荐性国家标准"},"explanation":"解决约定不明的顺序是：1 协议补充→2 合同条款或交易习惯→3 第 511 条法定标准。\n\n故\"交易习惯\"是第二步，优先于第 511 条的\"强制性国家标准\"。《民法典》第 510 条规定：\"\n\n不能达成补充协议的，按照合同相关条款或者交易习惯确定。\"第 511 条是在\"依据前条规定\n\n仍不能确定\"时的进一步规则，B 项正确。","clips":[]},{"n":55,"kind":"单项选择题","answer":"A","stem":"根据《民法典》相关规定，以下关于用人责任的说法中正确的是(    )。","options":{"A":"劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵 权责任","B":"用人单位的工作人员因执行工作任务造成他人损害的，由工作人员承担侵权责任","C":"个人之间形成劳务关系，提供劳务一方因劳务造成他人损害的，由提供劳务一方承担侵权责任","D":"提供劳务一方因劳务受到损害的，由接受劳务的一方承担赔偿责任"},"explanation":"《民法典》第 1191 条第 1 款规定：\"用人单位的工作人员因执行工作任务造成他人损\n\n害的，由用人单位承担侵权责任。\"第 2 款规定：\"劳务派遣期间，被派遣的工作人员因执行\n\n工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；劳务派遣单位有过错\n\n的，承担相应的责任。\"A 项正确。B 项错误：责任主体错误。工作人员执行任务时的侵权行\n\n为，由用人单位承担替代责任。C 项错误：根据《民法典》第 1192 条第 1 款，个人劳务中，\n\n提供劳务一方因劳务造成他人损害的，由接受劳务一方承担侵权责任。D 项错误：根据《民\n\n法典》第 1192 条第 1 款，提供劳务一方因劳务受到损害的，根据双方过错承担相应责任，\n\n非接受方\"承担赔偿责任\"。","clips":[]},{"n":56,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，无民事行为能力人造成他人损害，监护人将监护职责委托给他人的， (    )。","options":{"A":"受托人应当承担侵权责任","B":"监护人有过错的，承担相应的责任","C":"监护人应当承担侵权责任；受托人有过错的，承担相应的责任","D":"受托人应当承担侵权责任；监护人有过错的，承担相应的责任"},"explanation":"《民法典》第 1189 条规定：\"无民事行为能力人、限制民事行为能力人造成他人损害，\n\n监护人将监护职责委托给他人的，监护人应当承担侵权责任；受托人有过错的，承担相应的\n\n责任。\"监护责任不因委托而免除。C 项正确：监护人承担主要责任，受托人仅在有过错时\n\n承担相应责任。","clips":[]},{"n":57,"kind":"单项选择题","answer":"D","stem":"根据《旅游法》的规定，在旅游者自行安排活动期间，旅行社未尽到安全提示、救助义务的，应当 对旅游者的人身损害、财产损失承担(    )。","options":{"A":"连带责任","B":"补充责任","C":"过错责任","D":"相应责任"},"explanation":"《旅游法》第 70 条规定，在旅游者自行安排活动期间，旅行社未尽到安全提示、救助\n\n义务的，应当对旅游者的人身损害、财产损失承担相应责任。","clips":[]},{"n":58,"kind":"单项选择题","answer":"A","stem":"某旅行社组织、接待旅游者，未经同意安排另行付费旅游项目的，旅游者有权在旅游行程结束后 (    )内，要求旅行社退还另行付费项目的费用。","options":{"A":"30 日","B":"60 日","C":"30 个工作日","D":"60 个工作日"},"explanation":"《中华人民共和国旅游法》第 35 条规定，旅行社不得以不合理的低价组织旅游活动，\n\n诱骗旅游者，并通过安排购物或者另行付费旅游项目获取回扣等不正当利益。旅行社组织、\n\n接待旅游者，不得指定具体购物场所，不得安排另行付费旅游项目。但是，经双方协商一致\n\n或者旅游者要求，且不影响其他旅游者行程安排的除外。发生违反前两款规定情形的，旅游\n\n者有在旅游行程结束后 30 日内，要求旅行社为其办理退货并先行垫付退货货款，或者退还\n\n另行付费旅游项目的费用。","clips":[]},{"n":59,"kind":"单项选择题","answer":"D","stem":"在线旅游经营者应当保障旅游者的正当评价权，下列说法正确的是(   )。","options":{"A":"为增加社会影响，可以替代旅游者对本企业做出评价","B":"删除法律禁止传输的评价信息的，应当报有关部门备案","C":"为维护企业正面形象、可以屏蔽旅游者对其产品和服务的部分负面评价","D":"删除法规禁止发布的评价信息的，应当在后台记录和保存"},"explanation":"《在线旅游经营服务管理暂行规定》第 13 条，在线旅游经营者应当保障旅游者的正当\n\n评价权，不得擅自屏蔽、删除旅游者对其产品和服务的评价，不得误导、引诱、代替或者强\n\n制旅游者做出评价，对旅游者做出的评价应当保存并向社会公开。在线旅游经营者删除法律、\n\n法规禁止发布或者传输的评价信息的，应当在后台记录和保存。","clips":[]},{"n":60,"kind":"单项选择题","answer":"B","stem":"《文化和旅游市场信用管理规定》规定，导游、领队因被吊销导游证而被认定为严重失信主体的， 旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起(    )内 不得重新申请导游证或者从事旅行社业务。","options":{"A":"5 年","B":"3 年","C":"2 年","D":"1 年"},"explanation":"导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行\n\n社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起 3 年内不得重新\n\n申请导游证或者从事旅行社业务。第 19 条规定，文化和旅游主管部门对旅游市场严重失信\n\n主体实施下列管理措施：(1)适当提高抽查比例和频次，纳入重点监管对象；(2)将失信信息\n\n提供给有关部门查询，供其在相关行政管理、公共服务、评优评先等活动中参考使用；(3)\n\n将失信信息提供给各类市场主体查询，供其在市场活动中参考使用；(4)旅行社因被吊销旅\n\n行社业务经营许可证而被认定为严重失信主体的，其主要负责人 5 年内不得担任任何旅行社\n\n的主要负责人；(5)导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管\n\n理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起 3\n\n年内不得重新申请导游证或者从事旅行社业务；(6)旅行社因侵犯旅游者合法权益受到罚款\n\n以上行政处罚而被认定为严重失信主体的，自处罚之日起 2 年内不得申请出境旅游业务；(7)\n\n法律、行政法规和党中央、国务院政策文件规定的其他管理措施。","clips":[]},{"n":61,"kind":"单项选择题","answer":"D","stem":"导游在带团过程中强迫旅游者进购物店购物三次，根据《旅行社服务质量赔偿标准》的规定，旅行 社应当按照旅游费用总额的(        )向旅游者支付违约金。","options":{"A":"10%","B":"30%","C":"40%","D":"60%"},"explanation":"《旅行社服务质量赔偿标准》第 10 条规定：\"强迫或者变相强迫旅游者购物的，每次\n\n按照旅游费用总额的 20%向旅游者支付违约金。D 项正确：强迫购物三次，每次 20%，累计\n\n60%。该规定体现对屡次强迫行为的叠加处罚。","clips":[]},{"n":62,"kind":"单项选择题","answer":"C","stem":"旅行社委派导游为旅游团提供服务，该导游未取得导游证。对此，由旅游主管部门依据《旅游 法》，对该旅行社责令改正，没收违法所得，并处(         )罚款。","options":{"A":"1000 元以上 1 万元以下","B":"2000 元以上 2 万元以下","C":"5000 元以上 5 万元以下","D":"2 万元以上 20 万元以下"},"explanation":"《旅游法》第 96 条规定：\"旅行社违反本法规定，有下列行为之一的，由旅游主管部\n\n门责令改正，没收违法所得，并处 5000 元以上 5 万元以下罚款；情节严重的，责令停业整\n\n顿或者吊销旅行社业务经营许可证；对直接负责的主管人员和其他直接责任人员，处 2000\n\n元以上 2 万元以下罚款：(1)未按照规定为出境或者入境团队旅游安排领队或者导游全程陪\n\n同的；(2)安排未取得导游证的人员提供导游或者领队服务的；(3)未向临时聘用的导游支付\n\n导游服务费用的；(4)要求导游垫付或者向导游收取费用的。C 项正确：法律明确规定罚款\n\n幅度为 5000 元以上 5 万元以下。","clips":[]},{"n":63,"kind":"单项选择题","answer":"B","stem":"《旅游法》规定，导游、领队违反本法规定，(       )的，由旅游主管部门责令改正，没收违法所 得，处 1000 元以上 1 万元以下罚款，予以公告。","options":{"A":"向旅游者兜售物品","B":"未取得导游证而从事导游活动","C":"向旅游者索取小费","D":"私自承揽业务"},"explanation":"《旅游法》第 102 条规定，导游、领队违反本法规定，未取得导游证或者不具备领队\n\n条件而从事导游、领队活动，由旅游主管部门责令改正，没收违法所得，处 1000 元以上 1\n\n万元以下罚款，予以公告。","clips":[]},{"n":64,"kind":"单项选择题","answer":"C","stem":"导游员季某在提供旅游服务的过程中，多次暗示游客付小费给自己，根据《旅游法》的规定，以下 表述正确的是(        )。","options":{"A":"由旅游主管部门没收违法所得","B":"处 1000 元以上 3 万元以下罚款","C":"情节严重的，并暂扣导游证","D":"情节严重的，吊销导游证并予以公告"},"explanation":"《旅游法》第 102 条，向旅游者索取小费的，由旅游主管部门责令退还，处 1000 元以\n\n上 1 万元以下罚款；情节严重的，并暂扣或者吊销导游证。","clips":[]},{"n":65,"kind":"单项选择题","answer":"C","stem":"根据《导游管理办法》的规定，所在地旅游主管部门应当自旅行社或旅游行业组织核实导游证变 更信息之日起(        )内予以审核确认。","options":{"A":"3 个工作日","B":"3 日","C":"5 个工作日","D":"5 日"},"explanation":"《导游管理办法》第 15 条规定，旅行社或者旅游行业组织应当自收到申请之日起 3\n\n个工作日内对信息变更情况进行核实。所在地旅游主管部门应当自旅行社或者旅游行业组织\n\n核实信息之日起 5 个工作日内予以审核确认。该时限保障了信息变更的行政效率。","clips":[]},{"n":66,"kind":"单项选择题","answer":"B","stem":"根据《导游管理办法》的规定，申请人以欺骗、贿赂等不当手取得导游证的，导游证应给予 (   )。","options":{"A":"暂扣","B":"撤销","C":"注销","D":"吊销"},"explanation":"《导游管理办法》第 16 条规定，有下列情形之一的，所在地旅游主管部门应当撤销导\n\n游证：1 对不具备申请资格或者不符合法定条件的申请人核发导游证的；2 申请人以欺骗、\n\n贿赂等不正当手段取得导游证的；3 依法可以撤销导游证的其他情形。因此，B 项\"撤销\"是\n\n唯一正确答案。","clips":[]},{"n":67,"kind":"单项选择题","answer":"C","stem":"根据《导游人员管理条例》，下列不属于参加导游人员资格考试应具备条件的是(   )。","options":{"A":"中华人民共和国公民且身体健康","B":"具有高中、中专或者以上学历","C":"具有完全民事行为能力","D":"具有导游职业需要的基本知识和语言表达能力"},"explanation":"本题考查导游资格考试的报考条件，注意\"不属于\"的反向提问。《导游人员管理条例》\n\n第 3 条规定，国家实行全国统一的导游人员资格考试制度，参加导游人员资格考试的条件如\n\n下：(1)中华人民共和国公民；(2)具有高级中学、中等专业学校或者以上学历；(3)身体健\n\n康；(4)具有适应导游需要的基本知识和语言表达能力。C 项\"具有完全民事行为能力\"虽为\n\n常理，但法律未将其列为报考条件，故为正确答案。错误原因：将\"执业行为能力\"与\"考试\n\n资格\"混淆。考试阶段不强制要求完全民事行为能力，但申领导游证时需具备。","clips":[]},{"n":68,"kind":"单项选择题","answer":"B","stem":"依据《治安管理处罚法》的规定，在航空器上使用可能影响导航系统正常功能的器具、工具，不听 劝阻的，处(        )。","options":{"A":"警告或者 500 元以下罚款","B":"5 日以下拘留或者 1000 元以下罚款","C":"5 日以上 10 日以下拘留","D":"10 日以上 15 日以下拘留"},"explanation":"依据第 40 条，在航空器上使用可能影响导航系统正常功能的器具、工具，不听劝阻\n\n的，处 5 日以下拘留或者 1000 元以下罚款。A 项错误：该行为没有警告或者 500 元以下罚\n\n款的档次。B 项正确：符合法条关于该行为的处罚规定。C 项错误：5 日以上 10 日以下拘留\n\n是损坏其他交通工具设施情节较重或者公共场所违反安全规定情节较重的档次。D 项错误：\n\n10 日以上 15 日以下拘留适用于盗窃、损坏航空设施或者强行进入航空器驾驶舱等更重的行\n\n为。","clips":[]},{"n":69,"kind":"单项选择题","answer":"D","stem":"《中华人民共和国消费者权益保护法》规定，对损害消费者合法权益的行为，通过大众媒体予以揭 露、批评是消费者协会应(       )。","options":{"A":"履行的约定义务","B":"承担的社会责任","C":"具有的法定权力","D":"履行的公益性职责"},"explanation":"《中华人民共和国消费者权益保护法》第 37 条规定了消费者协会履行的 8 条公益性职\n\n责。","clips":[]},{"n":70,"kind":"单项选择题","answer":"C","stem":"根据《旅游法》的规定，下列关于旅游者与旅游经营者发生纠纷时的解决途径中，正确的是 (   )。","options":{"A":"可以与旅游投诉受理机构协商","B":"提请人民法院进行仲裁","C":"向消费者协会申请调解","D":"向旅游投诉受理机构申请复议"},"explanation":"《旅游法》第 92 规定，旅游者与旅游经营者发生纠纷，可以通过下列途径解决：(1)\n\n双方协商；(2)向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；(3)根据与旅\n\n游经营者达成的仲裁协议提请仲裁机构仲裁；(4)向人民法院提起诉讼。","clips":[]},{"n":71,"kind":"单项选择题","answer":"C","stem":"根据《旅游投诉处理办法》的规定，旅游投诉处理结束后，旅游投诉处理机构应当妥善保管相关材 料，保管期限不低于(     )。","options":{"A":"1 年","B":"2 年","C":"3 年","D":"5 年"},"explanation":"《旅游投诉处理办法》第 8 条规定：\"旅游投诉处理结束后，旅游投诉处理机构应当妥\n\n善保管相关材料，保管期限不低于三年。\"","clips":[]},{"n":72,"kind":"单项选择题","answer":"B","stem":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安全隐患的，应当 (   )。","options":{"A":"向有关部门投诉","B":"予以制止或者更换","C":"拒绝向其支付接待报酬","D":"报告旅游行政管理部门"},"explanation":"旅行社及其从业人员发现履行辅助人提供的服务不符合法律、法规规定或者存在安全\n\n隐患的，应当予以制止或者更换。","clips":[]},{"n":73,"kind":"单项选择题","answer":"B","stem":"根据《旅游投诉处理办法》的规定，下列关于旅游投诉的说法正确的是(   )。","options":{"A":"处理旅游者与旅游经营者之间、旅游经营者内部的争议","B":"由文化和旅游主管部门或者其所属承担旅游投诉处理职能的组织处理","C":"对发生的行政争议进行调解","D":"对旅游经营者的犯罪行为依法处理"},"explanation":"《旅游投诉处理办法》第二条本办法所称旅游投诉，是旅游者认为旅游经营者损害其\n\n合法权益，请求文化和旅游主管部门或者其所属承担旅游投诉处理职能的组织(以下称\"旅游\n\n投诉处理机构\")，对双方发生的旅游纠纷进行处理的行为。A 项错误：旅游投诉仅处理旅游\n\n者与旅游经营者之间的旅游纠纷，不处理旅游经营者内部争议。B 项正确：旅游投诉由文化\n\n和旅游主管部门或者其所属承担旅游投诉处理职能的组织(旅游投诉处理机构处理。C 项错\n\n误：旅游投诉处理的是旅游者和旅游经营者之间的旅游民事纠纷，不是行政争议。D 项错误：\n\n犯罪行为不属于旅游投诉受理范围，应当移送司法机关处理。","clips":[]},{"n":74,"kind":"单项选择题","answer":"A","stem":"以下属于社会安全事件的应急处置措施的是(   )。","options":{"A":"限制有关公共场所内的活动","B":"迅速控制危险源，标明危险区域","C":"立即抢修被损坏的交通等公共设施","D":"采取防止发生次生、衍生事件的必要措施"},"explanation":"其余三项属于自然灾害、事故灾难或者公共卫生事件的应急处置措施。","clips":[]},{"n":75,"kind":"单项选择题","answer":"C","stem":"《旅游安全管理办法》规定，(   )应当承担旅游安全的主体责任。","options":{"A":"县级以上人民政府","B":"所在地旅游行政管理部门","C":"旅游经营者","D":"县级以上人民政府有关部门"},"explanation":"《旅游安全管理办法》第 4 条规定，旅游经营者应当承担旅游安全的主体责任。","clips":[]},{"n":76,"kind":"单项选择题","answer":"D","stem":"根据《旅行社责任保险管理办法》的规定，旅行社责任保险的保险责任，应旅行社组织旅 游活动中依法对受旅行社委派并为旅游者提供服务的导游或者领队人员的(    )承担的赔偿责任。","options":{"A":"人身伤亡和财产损失","B":"人身伤亡或财产损失","C":"财产损失","D":"人身伤亡"},"explanation":"《旅行社责任保险管理办法》第 4 条规定，保险责任包括对导游或领队人员的\"人身伤\n\n亡\"承担的赔偿责任，不包括财产损失。因此，正确选项是 D。仅保障人身安全，体现对从\n\n业人员的基本保护。","clips":[]},{"n":77,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国民用航空法》的规定，关于旅客人身伤亡的赔偿责任，下列说法正确的是 (      )。","options":{"A":"承运人对超过赔偿责任限额的损害承担全部责任","B":"赔偿责任限按照造成损害的事故发生时我国参加的相关国际民用航空公约确定","C":"赔偿责任限额由承运人和旅客协商确定","D":"承运人对全部损失都必须承担赔偿责任"},"explanation":"《中华人民共和国民用航空法》第 134 条：对于依据本法第一百二十八条规定所产生\n\n的赔偿责任，按照造成损害的事故发生时我国参加的相关国际民用航空公约规定的赔偿责任\n\n限额确定。对于超过前款规定的赔偿责任限额的损害，承运人证明有下列情形之一的，不承\n\n担赔偿责任：(一)损失不是由于承运人或者其受雇人、代理人的过错造成；(二)损失完全是\n\n由第三人的过错造成。A 项错误，对于超过赔偿责任限额的损害，承运人满足法定举证条件\n\n即可免责，不需要一律承担全部责任。B 项正确，针对第 128 条旅客人身伤亡的赔偿责任限\n\n额，依照事故发生时我国参加的相关国际民用航空公约确定。C 项错误，赔偿责任限额是法\n\n定标准，不能由承运人和旅客协商确定。D 项错误，存在法定免责情形，承运人并非对所有\n\n损失都必须承担赔偿责任。","clips":[]},{"n":78,"kind":"单项选择题","answer":"C","stem":"根据《出境入境管理法》的规定，冒用他人出境入境证件出境入境的，处 1000 元以上(   )以下 罚款。","options":{"A":"2000 元","B":"3000 元","C":"5000 元","D":"1 万元"},"explanation":"《出境入境管理法》第 71 条规定，有下列行为之一的，处 1000 元以上 5000 元以下罚\n\n款；情节严重的，处 5 日以上 10 日以下拘留，可以并处 2000 元以上 1 万元以下罚款：(1)\n\n持用伪造、变造、骗取的出境入境证件出境入境；(2)冒用他人出境入境证件出境入境；(3)\n\n逃避出境入境边防检查；(4)以其他方式非法出境入境。","clips":[]},{"n":79,"kind":"单项选择题","answer":"C","stem":"根据《风景名胜区条例》的规定，申请设立省级风景名胜区，提出申请的主体是(         )。","options":{"A":"省级人民政府","B":"省林草主管部门","C":"县级人民政府","D":"风景名胜区管理机构"},"explanation":"《风景名胜区条例》第十条：设立省级风景名胜区，由县级人民政府提出申请，省、\n\n自治区、直辖市人民政府林业草原主管部门会同其他有关部门组织论证，提出审查意见，报\n\n省、自治区、直辖市人民政府批准公布。 A 项错误，省级人民政府负责批准公布省级风景\n\n名胜区，不是申请主体，依据条例第十条。 B 项错误，省林草主管部门负责会同有关部门\n\n组织论证、提出审查意见，不提出设立申请，依据条例第十条。 C 项正确，符合条例第十\n\n条\"设立省级风景名胜区，由县级人民政府提出申请\"的规定。 D 项错误，在申请设立风景\n\n名胜区阶段，风景名胜区管理机构尚未设立，不可能作为申请主体。","clips":[]},{"n":80,"kind":"单项选择题","answer":"D","stem":"在(     )期间，博物馆应当开放。","options":{"A":"国家法定节假日","B":"学校寒暑假","C":"休息日","D":"国家法定节假日和学校寒暑假"},"explanation":"《博物馆条例》第 29 条规定，博物馆应当向公众公告具体开放时间。在国家法定节假\n\n日和学校寒暑假期间，博物馆应当开放。","clips":[]},{"n":81,"kind":"单项选择题","answer":"C","stem":"中国特色社会主义事业的战略布局是(     )。","options":{"A":"\"五位一体\"","B":"\"两个结合\"","C":"\"四个全面\"","D":"\"十个明确\""},"explanation":"答案选 C。中国特色社会主义事业总体布局是\"五位一体\"，战略布局是\"四个全面\"。","clips":[]},{"n":82,"kind":"单项选择题","answer":"A","stem":"一个国家、一个民族发展中更基本、更深沉、更持久的力量是(       )。","options":{"A":"文化自信","B":"理论自信","C":"制度自信","D":"道路自信"},"explanation":"答案选 A。文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量。","clips":[]},{"n":83,"kind":"单项选择题","answer":"A","stem":"《中华人民共和国文物保护法》规定，(   )文物中的孤品和易损品，禁止出境展览。","options":{"A":"一级","B":"二级","C":"三级","D":"珍贵"},"explanation":"《文物保护法》第 62 条，一级文物中的孤品和易损品，禁止出境展览。","clips":[]},{"n":84,"kind":"单项选择题","answer":"A","stem":"依据习近平外交思想，习近平外交思想的核心理念是(      )。","options":{"A":"构建人类命运共同体","B":"共建\"一带一路\"","C":"和平共处五项原则","D":"推动全球治理体系变革"},"explanation":"文档原文：构建人类命运共同体是习近平外交思想的核心理念，以建设持久和平、普\n\n遍安全、共同繁荣、开放包容、清洁美丽的世界为努力目标。A 项正确，构建人类命运共同\n\n体是习近平外交思想的核心理念，故 A 正确。B 项错误，共建\"一带一路\"是外交思想\"十个\n\n坚持\"中\"坚持共商共建共享为原则\"推动的内容，不是核心理念，故 B 错误。C 项错误，和\n\n平共处五项原则是我国对外关系的重要原则，但不是习近平外交思想的核心理念，故 C 错误。\n\nD 项错误，推动全球治理体系变革源于\"坚持公平正义为理念引领全球治理体系改革\"，不是\n\n核心理念，故 D 错误。","clips":[]},{"n":85,"kind":"单项选择题","answer":"A","stem":"根据《港区国安法》第 25 条的规定，组织、领导恐怖活动组织的，即属犯罪，处无期徒刑或者 (    )年以上有期徒刑，并处没收财产。","options":{"A":"10","B":"15","C":"20","D":"25"},"explanation":"《港区国安法》第 25 条规定，组织、领导恐怖活动组织的，即属犯罪，处无期徒刑或\n\n者 10 年以上有期徒刑，并处没收财产。","clips":[]},{"n":86,"kind":"单项选择题","answer":"B","stem":"教育行政部门应当以(   )为重点，将英雄烈士事迹和精神纳入国民教育内容。","options":{"A":"中学生","B":"青少年学生","C":"国家机关工作人员","D":"基层群众组织"},"explanation":"《英烈法》第 17 条规定，教育行政部门应当以青少年学生为重点，将英雄烈士事迹和\n\n精神的宣传教育纳入国民教育体系。","clips":[]},{"n":87,"kind":"单项选择题","answer":"B","stem":"我国第一家经营国际旅游业务的全国性旅行社是(   )。","options":{"A":"华侨服务社","B":"中国国际旅行社","C":"中国旅行社","D":"中国青年国际旅行社"},"explanation":"中国国际旅行社国务院直属外事接待单位，暂代政府管理旅游业之职，成为我国第一\n\n家经营国际旅游业务的全国性旅行社。","clips":[]},{"n":88,"kind":"单项选择题","answer":"C","stem":"(   )年，《导游人员等级考核评定管理办法(试行)》将导游纵向分成初级、中级、高级、特级四 个级别。","options":{"A":"1994 年","B":"2001 年","C":"2005 年","D":"2013 年"},"explanation":"2005 年《导游人员等级考核评定管理办法(试行)》，将导游分成初级导游、中级导游、\n\n高级导游、特级导游四个级别。","clips":[]},{"n":89,"kind":"单项选择题","answer":"D","stem":"(   )年，新版《导游等级考核管理办法》开始施行。","options":{"A":"2013 年","B":"2021 年","C":"2024 年","D":"2025 年"},"explanation":"2025 年 3 月 1 日：新版《导游等级考核管理办法》开始施行。","clips":[]},{"n":90,"kind":"单项选择题","answer":"A","stem":"在导游服务中居于核心和灵魂内容的是(          )。","options":{"A":"讲解服务","B":"旅行生活服务","C":"向导服务","D":"增值服务"},"explanation":"导游服务的灵魂、核心内容是讲解服务。","clips":[]},{"n":91,"kind":"单项选择题","answer":"C","stem":"下列情形中可以颁发导游证的是(       )。","options":{"A":"无民事行为能力或限制民事行为能力","B":"患有传染性疾病的","C":"过失犯罪","D":"被吊销导游证之日起未逾被 3 年的"},"explanation":"有以下情形之一的，不得颁发导游证：1 无民事行为能力或限制民事行为能力的；2\n\n患有传染性疾病的；3 受过刑事处罚的(过失犯罪除外)；4 被吊销导游证之日起未逾 3 年的。","clips":[]},{"n":92,"kind":"单项选择题","answer":"B","stem":"着装的 TPO 原则中，P 代表了(   )。","options":{"A":"时间","B":"地点","C":"场合","D":"素质"},"explanation":"遵循 TPO 原则：Time(时间)、Place(地点)、Occasion(场合)，导游在着装时，要注\n\n意时间、地点、场合并与之相适应。","clips":[]},{"n":93,"kind":"单项选择题","answer":"D","stem":"下列对地陪的主要职责描述错误的是(          )。","options":{"A":"安排旅游活动","B":"进行导游讲解","C":"维护旅游者安全","D":"做好联络工作"},"explanation":"地陪的主要职责：安排旅游活动；做好接待工作；进行导游讲解；维护旅游者安全；\n\n处理相关问题。","clips":[]},{"n":94,"kind":"单项选择题","answer":"B","stem":"旅游行业的核心价值观是(   )。","options":{"A":"爱岗敬业，自尊自强","B":"游客为本，服务至诚","C":"团结服从，勤研善思","D":"耐心细致，宾客至上"},"explanation":"\"游客为本，服务至诚\"作为旅游行业的服务理念，是社会主义核心价值观在旅游行业\n\n的延伸和具体化。","clips":[]},{"n":95,"kind":"单项选择题","answer":"B","stem":"机场通知航班延迟一个小时抵达，你作为导游应该(    )。","options":{"A":"迅速调整旅游接待计划","B":"在机场继续等候旅游团","C":"自行打车返回家中","D":"告知全陪抵达后通知自己"},"explanation":"若所接航班(车次、船次)晚点且推迟时间不长，地陪可留在接站地点继续等旅游团；\n\n若推迟时间较长，应立即向地接社有关部门报告，听从安排。","clips":[]},{"n":96,"kind":"单项选择题","answer":"C","stem":"当入境旅游者提出关于行程小的修改意见或者加游项目时，导游应该向(      )反映。","options":{"A":"领队","B":"组团社","C":"地接社","D":"景区"},"explanation":"及时反映：地陪应及时向旅行社反映。","clips":[]},{"n":97,"kind":"单项选择题","answer":"A","stem":"离团前一天，地陪需要将核对无误的交通票据移交给(    )。","options":{"A":"全陪","B":"领队","C":"团长","D":"游客本人"},"explanation":"旅游团离开的前一天，地陪应认真核实旅游团离开的机(车、船)票相关信息，包括团\n\n名、代号、人数、全陪姓名、去向、航班(车次、船次)、起飞(开车、起航)时间(需对计划\n\n时间、时刻表时间、票面时间、问询时间进行四核实)、离开的机场(车站、码头)等，并将\n\n核实无误的票据移交给全陪。","clips":[]},{"n":98,"kind":"单项选择题","answer":"B","stem":"通常情况下，处理飞机延误、火车晚点、晕机(车、船)、途中饮食不适等问题的是(       )。","options":{"A":"地陪","B":"全陪","C":"领队","D":"团长"},"explanation":"全陪常见问题应对：处理飞机延误、火车晚点、晕机(车、船)、途中饮食不适等问题。\n\n例如飞机延误时，应及时与航空公司进行沟通，安排旅游者休息。","clips":[]},{"n":99,"kind":"单项选择题","answer":"D","stem":"领队带领游客旅行过程中，对另行付费旅游项目处理得当的是(     )。","options":{"A":"在游览过程中，领队可以自己安排另行付费旅游项目","B":"如旅游者要求安排另行付费旅游项目，领队积极配合，以游客为主","C":"在另行付费旅游项目实施前，领队与旅游者双方口头同意即可","D":"如当地导游擅自安排另行付费旅游项目，领队应及时制止"},"explanation":"在游览过程中，领队不应擅自安排另行付费旅游项目；如旅游者要求安排另行付费旅\n\n游项目，领队应在行程计划中\"自由活动\"时段内组织实施且不影响其他旅游者行程安排；在\n\n另行付费旅游项目实施前，领队应要求旅游者签订旅行社规定制式的书面协议；如当地导游\n\n擅自安排另行付费旅游项目，领队应及时制止。","clips":[]},{"n":100,"kind":"单项选择题","answer":"D","stem":"下列选项中，导游领队带领游客进行娱乐活动时操作错误的是(   )。","options":{"A":"提示游客观赏演艺、比赛类活动时遵守秩序","B":"根据要求使用摄像摄影设备，慎用闪光灯","C":"提示游客听从工作人员指挥，注意安全，爱护环境","D":"保持购物场所秩序，不哄抢喧哗，试吃试用商品应征得同意"},"explanation":"D 选项不是娱乐活动时的要求，是购物时的要求。","clips":[]},{"n":101,"kind":"单项选择题","answer":"C","stem":"\"乱石穿空，惊涛拍岸，卷起千堆雪\"，词中以\"雪\"比喻浪花，别开生面。这句话采用了(   ) 的修辞方法。","options":{"A":"明喻","B":"暗喻","C":"借喻","D":"恰喻"},"explanation":"\"乱石穿空，惊涛拍岸，卷起千堆雪\"，词中以\"雪\"借喻浪花，别开生面。","clips":[]},{"n":102,"kind":"单项选择题","answer":"D","stem":"杭州西湖晴雨两宜，晴天来西湖，我们可以感受到\"水光激滟晴方好\"的浓艳美；而如果雨天到 西湖，则可以领略到\"山色空蒙雨亦奇\"的素雅美。这段话采用了引用手法中的(    )。","options":{"A":"明引","B":"意引","C":"情引","D":"暗引"},"explanation":"指把别人的话语融入自己的话语中，而不注明出处。这样既能修饰自己的语言，还能\n\n增添一定的感染力。","clips":[]},{"n":103,"kind":"单项选择题","answer":"B","stem":"事情发生后，导游采用\"兜圈子\"的方式对旅游者进行劝慰，这叫做劝慰技巧中的(   )。","options":{"A":"正面引导法","B":"侧面迂回法","C":"间接暗示法","D":"生理停顿法"},"explanation":"侧面迂回法：事情发生后，导游不直接对旅游者进行劝慰，而是采用旁敲侧击的劝慰\n\n方法，即侧面迂回法，也称 \"兜圈子\"。这种方法可避免伤害旅游者的自尊心，给对方留足\n\n面子，同时从侧面提醒对方改正不足。","clips":[]},{"n":104,"kind":"单项选择题","answer":"B","stem":"导游讲话时，目光似看非看地望向全体旅游者，营造\"我心有你\"的氛围。这是导游运用了 (    )。","options":{"A":"环视法","B":"虚视法","C":"俯视法","D":"点视法"},"explanation":"虚视法：导游讲话时，目光似看非看地望向全体旅游者，营造\"我心有你\"的氛围。","clips":[]},{"n":105,"kind":"单项选择题","answer":"A","stem":"当旅游者提出需求后，导游可暂时不予面答复，搁置一段时间，等旅游者的需求欲消退后，达 到拒绝的目的。这是导游采用的(     )。","options":{"A":"拖延时间法","B":"婉转拒绝法","C":"替代方案法","D":"正面回绝法"},"explanation":"当旅游者提出需求后，导游可暂时不予正面答复，搁置一段时间，等旅游者的需求欲\n\n消退后，达到拒绝的目的。 拖延法是一种消极的做法，需谨慎使用。","clips":[]},{"n":106,"kind":"单项选择题","answer":"C","stem":"神女峰位于巫峡的北岸，海拔为 860 米，高约 6 米，远看就像是一位亭亭玉立的少女，故被称为神 女峰。传说巫山神女名叫瑶姬，是炎帝的女儿，可惜还未出嫁就去世。瑶姬死后，她的魂魄在早晨化身为云，在 傍晚化身为雨，时常缭绕在神女峰上。战国末期，楚怀王巡游到巫山，梦见一女子，便心生爱慕，下令在巫山临 江一侧修建楼阁，取名朝云，以示怀念。这件事由于被辞赋家宋玉写进了《高唐赋》，因而得以流传后世。这段讲 解导游采用的是(   )。","options":{"A":"分段讲解法","B":"制造悬念法","C":"虚实结合法","D":"妙用数字法"},"explanation":"\"虚\"包括民间故事、神话传说等，\"实\"指景观的具体形象、真实历史等。","clips":[]},{"n":107,"kind":"单项选择题","answer":"A","stem":"政务团讲解的要求是(    )。","options":{"A":"\"精\"\"要\"","B":"\"精\"\"活\"","C":"\"活\"\"逗\"","D":"\"严\"\"稳\""},"explanation":"讲解是政务接待中导游的主要任务。政务团的讲解要\"精\"\"要\"。\"精\"指内容精确，每\n\n字每句都要经得起推敲；讲法精练，避免拖泥带水或模棱两可。\"要\"就是只讲要求内的范围，\n\n内容要符合对象需要。","clips":[],"sourceNote":"试卷与解析的部分选项文字不同。此处保留试卷选项，两卷正确选项一致。"},{"n":108,"kind":"单项选择题","answer":"D","stem":"导游在接待研学团时，做法正确的是(   )。","options":{"A":"导游要按普通旅游团的方式为学生服务","B":"讲解是导游的核心工作，因此带研学团导游要侧重在讲解","C":"导游不是正式老师，不用关注言行举止对学生产生影响","D":"在带研学团期间，导游须始终牢记\"安全第一\""},"explanation":"导游不能按普通旅游团的方式操作，应将自己定位为校外实践老师，提前掌握必要的\n\n教育知识和教学方法；讲解是导游的核心工作，但开展研究性指导是研学旅游指导师应具备\n\n的技能；虽然导游在研学旅游中不是校内的正式老师，但言行举止对学生产生影响；在带研\n\n学团期间，导游须始终牢记\"安全第一\"。","clips":[]},{"n":109,"kind":"单项选择题","answer":"A","stem":"导游专座的位置在(    )。","options":{"A":"客运车辆前乘客门侧第一排乘客座椅靠通道侧","B":"客运车辆前司机侧第一排乘客座椅靠通道侧","C":"客运车辆前乘客门侧第一排乘客座椅靠窗户侧","D":"客运车辆前司机侧第一排乘客座椅靠窗户侧"},"explanation":"\"导游专座\"应设置在旅游客运车辆前乘客门侧第一排乘客座椅靠通道侧位置。","clips":[]},{"n":110,"kind":"单项选择题","answer":"B","stem":"对于游客提出推迟用餐的要求，导游操作正确的是(       )。","options":{"A":"婉转拒绝","B":"若全团提出推迟但是需要产生费用时，导游告知费用客人自理","C":"若个别旅游者执意推迟用餐，导游告知其餐费不退","D":"游客至上，按照客人要求处理"},"explanation":"劝说随团用餐：耐心向旅游者说明团队餐馆用餐的时间规定，劝说其随团用餐；全团\n\n同意推迟用餐的处理：若全团旅游者都同意推迟用餐，导游应联系餐厅，尽量协调推迟用餐。\n\n若推迟用餐会产生相关费用(如境外超时服务费用等)，导游应告知旅游者相应费用自理；个\n\n别旅游者执意推迟用餐的处理：若只是个别旅游者执意推迟用餐，导游应带领全团按原计划\n\n正常用餐，同时协助个别旅游者后续联系餐馆安排点餐，并告知其不随团用餐的费用自理，\n\n原餐费按照旅游合同约定处理。","clips":[]},{"n":111,"kind":"单项选择题","answer":"B","stem":"当游客提出更换计划内文娱活动时，导游操作正确的是(          )。","options":{"A":"坚决拒绝，表示行程不方便更改","B":"若全团提出，与接待社计调部门联系，尽可能调换","C":"若部分游客提出，则耐心劝说放弃","D":"若分路参与地点在同一线路上，只能为多数旅游者提供方便"},"explanation":"全团游客提出更换时：与接待社计调部门联系，尽可能调换，但不要在未联系妥当之\n\n前许诺；如接待社无法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，\n\n请其谅解。部分旅游者提出更换时：处理方法同上。若决定分路参与文娱活动，两个文娱活\n\n动地点在同一线路上，应与司机商量，尽量为少数旅游者提供方便，送他们到目的地；若不\n\n同路，则应为他们安排车辆，但车费自理。","clips":[]},{"n":112,"kind":"单项选择题","answer":"C","stem":"旅游者被伤后，导游处理错误的是(   )。","options":{"A":"立即提醒旅游者迅速离开现场，防止再次被咬","B":"记下事发地环境及毒虫样貌","C":"被蜜蜂刺伤，先检查并拔除毒刺，用酸性水冲洗","D":"若病情加重，尽快送医或拨打急救电话，避免耽误治疗"},"explanation":"被蜜蜂等刺伤，先检查并拔除毒刺，用洁净清水冲洗伤口，有条件用肥皂水冲洗，减\n\n少毒素扩散。","clips":[]},{"n":113,"kind":"单项选择题","answer":"A","stem":"下列选项中，(   )是造成误机的主观原因。","options":{"A":"行程安排不当","B":"途中遭遇交通事故","C":"自然灾害","D":"恶劣天气"},"explanation":"主观原因：在接待过程中，导游因行程安排不当致旅游者无法按时抵达机场(车站、\n\n码头)、未认真核对票据而弄错时间或地点等由人为因素造成的事故，均属主观原因，是预\n\n防的重点。","clips":[]},{"n":114,"kind":"单项选择题","answer":"A","stem":"当交通事故发生以后，导游第一时间应该(      )。","options":{"A":"立即展开抢救","B":"冷静拨打 120","C":"向旅行社汇报","D":"保护现场"},"explanation":"事故发生第一时间，立即展开抢救，优先救助伤员。","clips":[]},{"n":115,"kind":"单项选择题","answer":"C","stem":"发生食物中毒以后，导游处理不当的是(      )。","options":{"A":"立即与当地医疗机构联系救助事宜，并设法催吐","B":"对食品进行留样，取得旅游者呕吐物的样本","C":"将旅游者送至医疗急救机构或医院进行救治，来证明旅行社没有责任","D":"向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾控机构报告"},"explanation":"(1)立即与当地医疗机构联系救助事宜，并设法催吐，同时对食品进行留样，取得旅\n\n游者呕吐物的样本；(2)将旅游者送医疗急救机构或医院进行救治，并保留相关证据；(3)\n\n及时向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾病预防控制机构报告，反\n\n映旅游者食物中毒的详细情况。","clips":[]},{"n":116,"kind":"单项选择题","answer":"B","stem":"24 小时内降水量为 50.0‑ 99.9 毫米的是(   )。","options":{"A":"强降雨","B":"暴雨","C":"大暴雨","D":"特大暴雨"},"explanation":"依据 24 小时内降水量来划分暴雨等级，包括暴雨(50.0‑ 99.9 毫米)。","clips":[]},{"n":117,"kind":"单项选择题","answer":"A","stem":"59 国人员持普通护照，从海南所有对外开放口岸免签入境出境，停留时间为(      )。","options":{"A":"30 天","B":"72 小时","C":"144 小时","D":"240 小时"},"explanation":"59 国人员持普通护照，因旅游、商贸、访问、探亲、就医、会展、体育竞技等期来\n\n华事由(工作、学习事由除外)，从海南所有对外开放口岸免签入境出境，活动范围限海南省\n\n行政区域内，停留不超 30 天。","clips":[],"sourceNote":"试卷与解析的选项顺序不同，本题采用解析卷顺序。"},{"n":118,"kind":"单项选择题","answer":"D","stem":"下列人员中，可以免税携带酒精饮料的是(           )。","options":{"A":"8 岁男孩","B":"短期多次往返港澳的旅客","C":"16 周岁的香港旅客","D":"19 周岁的俄罗斯人"},"explanation":"不满 18 周岁的未成年人，不适用免税携带烟酒的规定；短期多次往返港澳旅客不准\n\n免税带 12 度以上的酒精饮料。","clips":[]},{"n":119,"kind":"单项选择题","answer":"C","stem":"游客携带中药材、中成药出境的限额，表述正确的是(            )。","options":{"A":"前往国外的，总值限人民币 1000 元","B":"前往港澳地区的，总值限人民币 800 元","C":"前往国外的，总值限人民币 300 元","D":"前往港澳地区的，总值限人民币 200 元"},"explanation":"游客携带中药材、中成药出境，前往国外的，总值限人民币 300 元；前往港澳地区的，\n\n总值限人民币 150 元。","clips":[]},{"n":120,"kind":"单项选择题","answer":"A","stem":"不明海关规定或不知如何选择通道的旅客，应选择(            )通关。","options":{"A":"红色通道","B":"绿色通道","C":"礼遇通道","D":"外交通道"},"explanation":"不明海关规定或不知如何选择通道的旅客，应选择红色通道通关。","clips":[]},{"n":121,"kind":"单项选择题","answer":"B","stem":"东方航空公司的标志主体是(      )。","options":{"A":"凤凰","B":"飞翔的燕子","C":"木棉花和飞机尾翼","D":"大鹏金翅鸟"},"explanation":"东方航空：飞翔的燕子。","clips":[]},{"n":122,"kind":"单项选择题","answer":"A","stem":"下列选项中，字母和列车对应正确的是(    )。","options":{"A":"G 字头‑ 高速铁路列车","B":"D 字头‑ 城际列车","C":"T 字头‑ ‑ 快速旅客列车","D":"K 字头‑ ‑ 普通旅客列车"},"explanation":"G 字头‑ ‑ 高速铁路列车；D 字头‑ ‑ 动车组列车；T 字头‑ ‑ 特快旅客列车；K 字头\n\n‑ ‑ 快速旅客列车。","clips":[]},{"n":123,"kind":"单项选择题","answer":"A","stem":"下列物品中，既不可以随身携带也不可以托运的是(     )。","options":{"A":"管制器具","B":"菜刀","C":"手术刀","D":"斧头"},"explanation":"菜刀、手术刀、斧头都可以托运，但是管制刀具不可以托运也不可以随身携带。","clips":[]},{"n":124,"kind":"单项选择题","answer":"A","stem":"开车前 48 小时至 8 天内改签至 8 天后车次，且在改签后 8 天前退票，铁路收取(   )的退票费。","options":{"A":"5%","B":"10%","C":"20%","D":"50%"},"explanation":"开车前 48 小时至 8 天内改签至 8 天后车次，且在改签后 8 天前退票，仍收 5%退票费。","clips":[]},{"n":125,"kind":"单项选择题","answer":"D","stem":"下列症状不是高原反应的是(   )。","options":{"A":"头痛加剧、频繁呕吐","B":"嘴唇和指甲床呈青紫色","C":"咳嗽带痰，有粉红色或泡沫状痰液","D":"身体温度上升至 38 度以上"},"explanation":"身体温度上升至 38 度以上，是中暑的反应。","clips":[]},{"n":126,"kind":"单项选择题","answer":"C","stem":"中国加入(   )意味着人民币真正身于全球主要货币之列。","options":{"A":"WTA","B":"IMF","C":"SDR","D":"UNWTO"},"explanation":"中国加入 SDR 意味着人民币真正跻身于全球主要货币之列。","clips":[]},{"n":127,"kind":"单项选择题","answer":"A","stem":"当神州北极漠河迎来我国的第一缕阳光的时候，(     )已经进入了新的一天。","options":{"A":"惠灵顿","B":"新加坡","C":"莫斯科","D":"夏威夷"},"explanation":"惠灵顿是新西兰首都，因此比中国快了 4 个小时。","clips":[]},{"n":128,"kind":"单项选择题","answer":"A","stem":"今天哈尔滨温度为 10 摄氏度，折合成华氏温度为(   )。","options":{"A":"50 华氏度","B":"154 华氏度","C":"100 华氏度","D":"126 华氏度"},"explanation":"华氏度=摄氏度×9÷5+32。","clips":[],"sourceNote":"试卷与解析的选项顺序不同，本题采用解析卷顺序。"},{"n":129,"kind":"单项选择题","answer":"C","stem":"雷大大要送给老王一枚 3 克拉钻戒，3 克拉钻戒的重量是(    )。","options":{"A":"0.2 克","B":"0.5 克","C":"0.6 克","D":"1 克"},"explanation":"1 克拉=0.2 克，所以答案选 C。","clips":[]},{"n":130,"kind":"单项选择题","answer":"B","stem":"心脑血管病人每次泡温泉时间不能超过(    )。","options":{"A":"10 分钟","B":"20 分钟","C":"30 分钟","D":"40 分钟"},"explanation":"高血压/心脑血管疾病患者，规则服药或医生允许后浸泡，每次≤20 分钟。","clips":[]},{"n":131,"kind":"多项选择题","answer":"BCD","stem":"根据《中华人民共和国宪法》的规定，下列属于我国基本政治制度的有(      )。","options":{"A":"人民代表大会制度","B":"中国共产党领导的多党合作和政治协商制度","C":"民族区域自治制度","D":"基层群众自治制度","E":"经济特区制度"},"explanation":"我国宪法确立了三项基本政治制度：中国共产党领导的多党合作和政治协商制度、民\n\n族区域自治制度、基层群众自治制度。人民代表大会制度是我国的根本政治制度，不属于基\n\n本政治制度。 A 项错误，人民代表大会制度是我国的根本政治制度，不属于基本政治制度；\n\nE 项错误，经济特区制度是经济管理方面的制度安排，不属于政治制度范畴。","clips":[]},{"n":132,"kind":"多项选择题","answer":"ABC","stem":"根据《中华人民共和国宪法》关于财产保护制度的规定，下列说法正确的有(         )。","options":{"A":"社会主义公共财产神圣不可侵犯","B":"国家为了公共利益的需要，可以依法对土地实行征收或者征用并给予补偿","C":"国家为了公共利益的需要，可以依法对私有财产实行征收、征用并给予补偿","D":"国家可以对公民的私有财产无偿征用","E":"社会主义公共财产可以被任何组织或个人任意处置"},"explanation":"社会主义公共财产神圣不可侵犯(第 12 条)；公民合法的私有财产不受侵犯(第 13 条)。\n\n国家因公共利益需要，可依法对土地或私有财产实行征收、征用并给予补偿(第 10 条、第\n\n13 条)。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ACDE","stem":"根据《中华人民共和国宪法》的规定，下列土地属于集体所有的有(   )。","options":{"A":"农村和城市郊区的土地(法律规定属于国家所有的除外)","B":"城市土地","C":"自留地","D":"自留山","E":"宅基地"},"explanation":"农村和城市郊区的土地，除法律规定属于国家所有的以外，属于集体所有；宅基地和\n\n自留地、自留山，也属于集体所有（第 10 条）。B 项错误，城市土地属于国家所有（第 10\n\n条），不属于集体所有。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ACD","stem":"《旅游法》明确规定，在旅游活动中依照法律、法规和有关规定享受便利和优惠的旅游者包括 (       )。","options":{"A":"残疾人","B":"教师","C":"未成年人","D":"老年人","E":"军人"},"explanation":"《旅游法》第 11 条规定，残疾人、老年人、未成年人等旅游者在旅游活动中依照法律、\n\n法规和有关规定享受便利和优惠。","clips":[]},{"n":135,"kind":"多项选择题","answer":"BDE","stem":"按照《旅游法》的规定，国务院和县级以上地方人民政府应当根据实际情况安排资金，加强 (    )。","options":{"A":"旅游市场竞争力","B":"旅游基础设施建设","C":"旅游服务质量提升","D":"旅游公共服务","E":"旅游形象推广"},"explanation":"《旅游法》第 24 条，国务院和县级以上地方人民政府应当根据实际情况安排资金，加\n\n强旅游基础设施建设、旅游公共服务和旅游形象推广。","clips":[]},{"n":136,"kind":"多项选择题","answer":"BCD","stem":"下列选项中，属于可撤销的民事法律行为的有(   )。","options":{"A":"基于误解实施的民事法律行为","B":"因一方欺诈，当事人在违背真实意思的情况下实施的民事法律行为","C":"因第三人胁迫，当事人在违背真实意思的情况下实施的民事法律行为","D":"一方利用对方处于危困状态，致使成立时显失公平的民事法律行为","E":"行为人与相对人恶意串通，损害他人合法权益的民事法律行为"},"explanation":"依据《民法典》第 147‑ 151 条规定，可撤销的民事法律行为包括：\n\n1 基于重大误解实施的民事法律行为；\n\n2 因一方或者第三人的欺诈、胁迫，当事人在违背真实意思的情况下实施的民事法律行为；\n\n3 一方利用对方处于危困状态、缺乏判断能力等情形，致使成立时显失公平的民事法律行为。\n\n\"基于误解实施的民事法律行为\"错误，应当是重大误解。\n\n\"行为人与相对人恶意串通……\"属于无效的民事法律行为，故错误。\n\n其余选项描述正确。","clips":[]},{"n":137,"kind":"多项选择题","answer":"DE","stem":"张某在某动物园喂食鸵鸟时，因李某挑衅并激怒鸵鸟，造成张某被咬伤。下列关于张某权利的描 述，正确的是(     )。","options":{"A":"张某只能向李某请求赔偿","B":"张某只能向动物园请求赔偿","C":"张某可以向动物园和李某请求共同赔偿","D":"张某可以向动物园请求赔偿，也可以向李某请求赔偿","E":"动物园赔偿张某后，有权向李某追偿"},"explanation":"《民法典》第 1250 条规定，因第三人的过错致使动物造成他人损害的，被侵权人可以\n\n向动物饲养人或者管理人请求赔偿，也可以向第三人请求赔偿。动物饲养人或者管理人赔偿\n\n后，有权向第三人追偿。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABCE","stem":"《中华人民共和国民法典》规定，(    )的，当事人可以解除合同。","options":{"A":"在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务","B":"因不可抗力致使不能实现合同目的","C":"当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的","D":"债权人转让债权，未通知债务人","E":"当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行"},"explanation":"\"债权人转让债权，未通知债务人\"是合同转让的情形。即便债权人转让债权，未通知\n\n债务人，产生的后果是转让无效，并不会导致合同解除。\n\n其余选项描述正确。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABD","stem":"某旅行社导游韩某以限制活动自由的方式，强迫旅游者参加购物活动，根据《旅游法》的规定， 韩某受到的处罚是(      )。","options":{"A":"没收违法所得","B":"处 2000 元以上 2 万元以下罚款","C":"责令退还","D":"并暂扣或者吊销导游证","E":"情节严重的，吊销导游证并予以公告"},"explanation":"《旅游法》第 98 条，获取购物场所、另行付费旅游项目等相关经营者以回扣、佣金、\n\n人头费或者奖励费等名义给予的不正当利益，没收违法所得，处 2000 元以上 2 万元以下罚\n\n款，并暂扣或者吊销导游证。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ACDE","stem":"导游员小张在带团前往欧洲旅游时，旅游团集体遭到抢劫。根据《旅行社条例》的规定，此时小 张应当向(    )报告。","options":{"A":"旅游行政管理部门","B":"公安机关","C":"相关驻外机构","D":"当地警方","E":"中国驻该国使领馆"},"explanation":"《旅行社条例》第 39 条规定，发生危及旅游者人身安全的情形的，旅行社及其委派的\n\n导游人员、领队人员应当采取必要的处置措施并及时报告旅游行政管理部门；\n\n在境外发生的，还应当及时报告中华人民共和国驻该国使领馆、相关驻外机构、当地警方。","clips":[]},{"n":141,"kind":"多项选择题","answer":"BDE","stem":"导游张某在带团过程中，利用旅游大巴车返程的时间向旅游者兜售物品，根据《导游人员管理条 例》的规定，张某应当受到的处罚是(      )。","options":{"A":"由市场监督管理部门责令改正","B":"处 1000 元以上 3 万元以下的罚款","C":"有违法所得的，责令退还","D":"情节严重的，由相关部门吊销导游证并予以公告","E":"对其所在的旅行社给予警告直至责令停业整顿"},"explanation":"《导游人员管理条例》第 23 条，导游人员进行导游活动，向旅游者兜售物品或者购买\n\n旅游者的物品的，或者以明示或者暗示的方式向旅游者索要小费的，由旅游行政部门责令改\n\n正，处 1000 元以上 3 万元以下的罚款；有违法所得的，并处没收违法所得；情节严重的，\n\n由省、自治区、直辖市人民政府旅游行政部门吊销导游证并予以公告；对委派该导游人员的\n\n旅行社给予警告直至责令停业整顿。\n\n\"由市场监督管理部门责令改正\"错误，是\"旅游行政部门\"；\n\n\"有违法所得的，责令退还\"错误，是\"有违法所得的，并处没收违法所得\"。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ACD","stem":"依据《导游管理办法》，导游应当自下列(     )情形发生之日起 10 个工作日内，通过全国旅游监 服务信息系统提交相应材料，申请变更导游证信息。","options":{"A":"姓名、身份证号、导游等级和语种等信息发生变化的","B":"与旅行社订立的劳动合同解除后，在 3 个月内未与其他旅行社订立劳动合同的","C":"在旅游行业组织取消注册后，3 个月内在其他旅游行业组织注册的","D":"经常执业地区发生变化的","E":"与导游签订旅游合同的旅行社地址发生变化的"},"explanation":"《导游管理办法》第 15 条规定，导游应当自下列情形发生之日起 10 个工作日内，通\n\n过全国旅游监管服务信息系统提交相应材料，申请变更导游证信息：姓名、身份证号、导游\n\n等级和语种等信息发生变化的； 与旅行社订立的劳动合同解除、终止或者在旅游行业组织\n\n取消注册后，在 3 个月内与其他旅行社订立劳动合同或者在其他旅游行业组织注册的；经常\n\n执业地区发生变化的； 其他导游身份信息发生变化的。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABC","stem":"根据《旅游投诉处理办法》第 13 条的规定，关于共同投诉，下列说法正确的有(     )。","options":{"A":"投诉人四人以上，以同一事由投诉同一被投诉人的，为共同投诉","B":"共同投诉可以由投诉人推选一至三名代表人进行投诉","C":"代表人参加旅游投诉处理机构处理投诉过程的行为，对全体投诉人发生效力","D":"代表人变更、放弃投诉请求或者进行和解，应当经多数投诉人同意","E":"共同投诉应当由投诉人推选一至三名代表人进行投诉"},"explanation":"《旅游投诉处理办法》第 13 条规定：\"投诉人四人以上，以同一事由投诉同一被投诉\n\n人的，为共同投诉。共同投诉可以由投诉人推选一至三名代表人进行投诉。代表人参加旅游\n\n投诉处理机构处理投诉过程的行为，对全体投诉人发生效力，但代表人变更、放弃投诉请求\n\n或者进行和解，应当经全体投诉人同意。\"A、B、C 正确。\n\nD 错误：是\"应当经全体投诉人同意\"；\n\nE 错误：是\"可以\"不是\"应当\"。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABC","stem":"旅行社违反《旅游安全管理办法》的规定，(      )，由旅游主管部门给予警告，可并处2000 元以下 罚款；情节严重的，处 2000 元以上 10000 元以下罚款。","options":{"A":"不按要求制作安全信息卡","B":"未将安全信息卡交由旅游者","C":"未告知旅游者相关信息","D":"未制止旅游者的的非法、不安全行为","E":"旅游主管部门及其工作人员违反相关法律、法规及本办法规定，玩忽职守，未履行安全管理职责的"},"explanation":"《旅游安全管理办法》第 34 条规定，旅行社未制止履行辅助人的非法、不安全服务行\n\n为，或者未更换履行辅助人的，旅游主管部门给予警告，可并处 2000 元以下罚款；情节严\n\n重的，处 2000 元以上 10000 元以下罚款。\n\n第 35 条规定，不按要求制作安全信息卡，未将安全信息卡交由旅游者，或者未告知旅游者\n\n相关信息的，旅游主管部门给予警告，可并处 2000 元以下罚款；情节严重的，处 2000 元以\n\n上 10000 元以下罚款。\n\n选项\"旅游主管部门及其工作人员……\"惩罚措施有误。\n\n《旅游安全管理办法》第 38 条规定，旅游主管部门及其工作人员违反相关法律、法规及本\n\n办法规定，玩忽职守，未履行安全管理职责的，由有关部门责令改正，对直接负责的主管人\n\n员和其他直接责任人员依法给予处分。","clips":[]},{"n":145,"kind":"多项选择题","answer":"BD","stem":"依据《旅游投诉处理办法》，下列关于旅游投诉一般处理程序的表述，正确的是(       )。","options":{"A":"被投诉人应当在接到通知之日起 10 日内做出书面答复","B":"投诉人和被投诉人应当对自己的投诉或者答辩提供证据","C":"鉴定、检测的时间计入投诉处理时间","D":"旅游投诉处理机构受理投诉后，应当及时向被投诉人送达《旅游投诉处理通知书》以及投诉材料副本","E":"旅游投诉处理机构应当在受理旅游投诉之日起 60 个工作日内作出处理"},"explanation":"《旅游投诉处理办法》第十五条对于情况复杂的，应当填写《旅游投诉处理通知书》，\n\n与有关投诉材料副本一并送达被投诉人；被投诉人应当在接到通知之日起五个工作日内作出\n\n书面答复，提出事实、理由和答辩意见。\n\n投诉人和被投诉人应当对自己的投诉或者答辩提供证据。旅游投诉处理机构应当对双方当事\n\n人提出的事实、理由及证据进行审查。\n\n第二十三条旅游投诉处理机构应当在受理旅游投诉之日起六十日以内，作出处理。\n\nA 项错误：被投诉人答复期限为接到通知之日起 5 个工作日，不是 10 日。\n\nB 项正确：投诉人和被投诉人负有举证义务，应当对自己的主张提供证据。C 项错误：新法\n\n规定鉴定，检测时间不计入投诉处理期限。\n\nD 项正确：情况复杂的投诉，需要向被投诉人送达《旅游投诉处理通知书》及投诉材料副本。\n\nE 项错误：法定期限是 60 日(自然日)，不是 60 个工作日。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABDE","stem":"根据《娱乐场所管理条例》的规定，以下(     )情形下，情节严重的，由公安部门责令停业整顿 1 个月至 3 个月。","options":{"A":"包厢、包间的设置以及门窗的使用不符合本条例规定的","B":"未按照本条例规定安装闭路电视监控设备的","C":"违反娱乐场所内禁止娱乐活动规定","D":"以现金、有价证券作为奖品的，且情节严重","E":"回购奖品的，且情节严重"},"explanation":"选项\"违反娱乐场所内禁止娱乐活动规定\"由县级公安部门没收违法所得和非法财物，\n\n责令停业整顿 3 个月至 6 个月。","clips":[]},{"n":147,"kind":"多项选择题","answer":"BCDE","stem":"习近平新时代中国特色社会主义思想的历史地位和重大意义包括(   )。","options":{"A":"相对于理论意义，更具有实践指导意义","B":"是当代中国马克思主义、二十一世纪马克思主义","C":"是中华文化和中国精神的时代精华","D":"实现了马克思主义中国化新的飞跃","E":"是新时代新征程全党全国各族人民的行动指南"},"explanation":"答案选 BCDE。\n\n这一思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精\n\n华，实现了马克思主义中国化新的飞跃，也是新时代新征程全党全国各族人民的行动指南。\n\nA 项该思想兼具重大理论意义与实践指导意义，表述错误。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABC","stem":"导游服务的纽带作用主要体现在(   )。","options":{"A":"沟通上下","B":"连接内外","C":"协调左右","D":"串联古今","E":"跨越中西"},"explanation":"导游服务是旅游接待服务的核心和纽带，在旅游服务各环节之间发挥着关键的沟通、\n\n联络及协调功能：沟通上下；连接内外；协调左右。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABDE","stem":"关于握手礼仪的描述，正确的是(   )。","options":{"A":"握手一定要伸右手，伸左手是不礼貌的","B":"握手的时间以三至五秒为宜","C":"无论男女握手力度平等","D":"如果手上戴有手套，应当先将手套去掉","E":"男士同女士握手时，一般只轻握对方的手指部分"},"explanation":"握手礼仪：握手一定要伸右手，伸左手是不礼貌的；握手的时间以三至五秒为宜；力\n\n度适中：用力大小也应适度。对男子可以稍重些，对女子则应轻柔；如果手上戴有手套，应\n\n当先将手套去掉；男士同女士握手时，一般只轻握对方的手指部分。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABD","stem":"地陪导游的离店服务工作包括(   )。","options":{"A":"提醒注意事项","B":"办理退房手续","C":"致欢送词","D":"集合登车","E":"商定出发时间"},"explanation":"离店服务工作：提醒注意事项；办理退房手续；集合登车。\n\n致欢送词、商定出发时间属于送行服务。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ACD","stem":"计划外的文娱活动，导游处理得当的是(     )。","options":{"A":"地陪应准确告知演出时间、地点和票价等信息","B":"导游需要协助其购票","C":"一般情况下不陪同前往","D":"若游客想观看不健康的文娱节目地陪应明确拒绝","E":"对于入境旅游者，地陪需做好剧情介绍及必要的翻译工作"},"explanation":"(1)提供准确信息(可协助购票，一般不陪同)：对于旅游者自行要求观看的计划外文\n\n娱节目，地陪应准确告知演出时间、地点和票价等信息，必要时可协助其购票，但一般情况\n\n下不陪同前往。(2)拒绝不健康活动(法律引导)：若旅游者欲观看不健康的文娱节目或参与\n\n不正常的夜生活活动，地陪应明确拒绝，并向其阐述我国相关法律法规，引导旅游者文明旅\n\n游。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABC","stem":"全陪在带团过程中，照顾患病旅游者应该做到(       )。","options":{"A":"若旅游团中有游客出现晕机(车、船)症状，应给予重点照顾","B":"若游客在飞机上突发重病，通过飞机上的广播系统在乘客中寻找医生进行初步急救","C":"设法通知下一站相关方面提前落实车辆","D":"通知相关亲属前往医院即可","E":"后续费用全陪与游客协商"},"explanation":"照顾患病旅游者：若旅游团中有游客出现晕机(车、船)症状，全陪应予重点照顾。若\n\n游客突发重病，全陪应：在飞机(列车、轮船)乘务员的协助下；通过飞机(列车、轮船)上的\n\n广播系统在乘客中寻找医生进行初步急救；设法通知下一站相关方面提前落实车辆。\n\nD 协助亲属配合前往医院，E 是根据合同规定处理，不是全陪跟客人协商。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ABCD","stem":"导游领队引导游客文明旅游的主要内容有(    )。","options":{"A":"法律法规","B":"风俗禁忌","C":"绿色环保","D":"礼仪规范","E":"购买特产"},"explanation":"主要内容：法律法规；风俗禁忌；绿色环保；礼仪规范；诚信善意。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ABDE","stem":"在导游口头语言表达中，常用的停顿可分为(    )。","options":{"A":"语法停顿","B":"逻辑停顿","C":"层次停顿","D":"感情停顿","E":"生理停顿"},"explanation":"常用的停顿可分为：语法停顿；逻辑停顿；感情停顿；生理停顿。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ACDE","stem":"地陪(全陪)与领队之间的协作，应该遵循的原则有(         )。","options":{"A":"尊重领队，遇事多磋商","B":"推崇领队，积极为领队服务","C":"赞赏领队，调动积极性","D":"关心领队，建立工作友谊","E":"提醒领队，做好分内事务"},"explanation":"地陪(全陪)与领队之间的协作：尊重领队，遇事多磋商；赞赏领队，调动积极性；关\n\n心领队，建立工作友谊；提醒领队，做好分内事务。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABCE","stem":"导游对于游客提出调换房间的要求，处理正确的是(          )。","options":{"A":"客房清洁的问题，导游应迅速要求饭店客房部门进行打扫、消毒、整理","B":"客房有蟑螂、臭虫、老鼠等，导游立即进行房间调换","C":"调换朝向或楼层，不涉及房间价格且饭店有空房时适当予以满足","D":"住高于合同约定标准的房间，导游婉转拒绝","E":"提出住单间需求，需说明谁提出谁付费"},"explanation":"客房清洁或设施问题：导游应迅速要求饭店客房部门进行打扫、消毒、整理或修理工\n\n作；客房有蟑螂、臭虫、老鼠等，旅游者提出换房，应立即满足；调换另一朝向或另一楼层\n\n的同一标准客房，不涉及房间价格且饭店有空房时：与饭店客房部联系，适当予以满足，住\n\n高于合同约定标准的房间，饭店有空房时：予以满足，但须告知旅游者高于合同标准的房间\n\n费用与原房间费用的差价由其自理。无法安排时：做好解释工作。住单间需求：先请领队调\n\n解或内部调整；若调解不成，饭店如有空房，可满足其要求，但须事先说明房费由旅游者自\n\n理(一般由提出方付房费)。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABD","stem":"关于境内行李丢失处理，导游应该(   )。","options":{"A":"查明丢失行李运输区间，协助旅游者办理报失手续","B":"若当时没有找到，应与承运人保持联系，督促承运人查找丢失行李","C":"在查找丢失行李期间，导游为游客购买生活必需品","D":"可以确认责任者的，协助旅游者向责任方索赔","E":"难以确认责任者的，导游无需继续关注"},"explanation":"查明丢失行李或行李损坏的运输区间，协助旅游者办理报失或报损登记手续；将旅游\n\n者后续旅游行程安排告知承运人，同时在旅游过程中，应与承运人保持联系与沟通，督促承\n\n运人及时查找丢失行李；若非运输期间丢失行李的，参照\"丢失证件或物品\"处理；在查找丢\n\n失行李期间，协助旅游者购置生活必需品，提示其保留发票等购货凭证，并协助旅游者处理\n\n索赔事宜；可以确认责任者的，协助旅游者向责任方索赔，并办理相关事宜；难以确认责任\n\n者的，协助旅游者开具有关证明，以便向保险公司申请办理理赔事宜，并视情况向有关部门\n\n报告。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABE","stem":"作为导游，如何预防游客发生晕机现象?(     )","options":{"A":"避免过度疲劳","B":"宜吃清淡食物，但是要吃饱","C":"旅游客车应坐前排，游船应坐最后排舱位","D":"可以通过阅读书籍或者报刊，防止眩晕","E":"乘坐交通工具前 30 分钟，服用抗晕药物减轻症状"},"explanation":"1.避免过度疲劳\n\n安排行程避免强度过高，提醒旅游者充分休息，保持精神饱满\n\n2.注意饮食禁忌\n\n不喝酒，不吃高蛋白、高脂食品，宜吃清淡食物，且不过饱\n\n3.坐到更平稳的位置\n\n旅游客车坐前排，游船坐中间靠后舱位，飞机坐机舱前部\n\n4.乘坐期间宜闭目养神\n\n避免长时间阅读或看近处快速移动景物，以防眩晕\n\n5.提前服用抗晕药物\n\n乘坐交通工具前 30 分钟，服用抗晕药物减轻症状","clips":[]},{"n":159,"kind":"多项选择题","answer":"ACDE","stem":"为了避免旅游者在旅途中发生伤病，导游应该(       )。","options":{"A":"随时观察旅游者健康，身体不佳者建议及时休息或就医","B":"如果有生病的迹象，导游可以把自己的药物给游客服用","C":"避免过度劳累，夜晚娱乐活动不宜过长过晚","D":"登高涉险项目建议量力而行，老幼群体避免参与危险项目","E":"不暴饮暴食，多喝开水或矿泉水，不吃路边摊"},"explanation":"旅游过程中，随时观察旅游者健康，身体不佳者建议及时休息或就医，早发现早处理\n\n隐患；根据旅游者身体、精神状态，安排合理游览线路和节奏，避免过度劳累，夜晚娱乐活\n\n动不宜过长过晚；对风险环境或行为，及时明确警示旅游者，如禁止危险拍照、打闹等。登\n\n高涉险项目建议量力而行，老幼群体避免参与危险项目。多提醒旅游者注意饮食卫生，不暴\n\n饮暴食，多喝开水或矿泉水，食用洗净或去皮水果，不吃路边摊。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABCE","stem":"遭遇火灾时，导游应该(   )。","options":{"A":"迅速拨打 119 报警，同时简明扼要地将情况上报旅行社","B":"迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳楼","C":"应尽快找毛巾沾湿并捂住口鼻，身体尽量贴近地面行走","D":"若身上着火，迅速奔跑到安全区域，再扑火","E":"大火已封闭逃生通道，则退回室内，用湿被褥塞住门缝，等待救援"},"explanation":"发现火情后，导游应迅速拨打 119 报警，同时简明扼要地将情况上报旅行社；导游应\n\n迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳楼；导游应引导旅游者就地开\n\n展自救：如提醒大家不要贪恋财物，迅速逃生； 若楼道出现浓烟，应尽快找毛巾沾湿并捂\n\n住口鼻，身体尽量贴近地面行走；\n\n若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗；若大火已封闭逃生通道，则应\n\n立即退回室内，用湿被褥塞住门缝，并向窗外发出求救信号，等待救援。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCD","stem":"游客不幸落水后，导游正确引导溺水者自救的方法有(         )。","options":{"A":"保持镇定，节省体力","B":"放松身体，保持仰位","C":"若遇呛水，咳嗽调整","D":"若遇抽筋，张手扳腿","E":"看见他人，呼喊求救"},"explanation":"溺水者自救方法：保持镇定，节省体力；放松身体，保持仰位；若遇呛水，咳嗽调整；\n\n若遇抽筋，张手扳腿。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABDE","stem":"遭遇地震以后，正确的躲避方式有(   )。","options":{"A":"躲到坚固的柜台、桌椅、书桌等旁边或下面","B":"选择立柱旁边、内承重墙的墙根、墙角等位置相对较为安全","C":"尽量靠近吊灯、电扇等悬挂物","D":"远离玻璃门窗、橱窗、高大不稳或摆放易碎品的货架等","E":"躲避时蹲下，蜷曲身体，降低身体重心，将额头置于膝盖间"},"explanation":"C 选项务必避开吊灯、电扇等悬挂物，以及玻璃门窗、橱窗、高大不稳或摆放易碎品\n\n的货架等可能发生物体倒或坠落的危险区域。其余都对。","clips":[]},{"n":163,"kind":"多项选择题","answer":"CDE","stem":"我国签证类型分为(   )。","options":{"A":"港澳签证","B":"台湾签证","C":"外交签证","D":"公务签证","E":"礼遇签证"},"explanation":"外交签证；公务签证；礼遇签证；普通签证。","clips":[]},{"n":164,"kind":"多项选择题","answer":"CD","stem":"关于铁路携带限量物品的描述，正确的是(     )。","options":{"A":"酒精浓度 24%≤浓度≤70%可以携带，但是总重量要少于 2000 毫升","B":"两瓶香水每瓶 50 毫升可以随身携带","C":"空气清洗剂单件容量≤150 毫升","D":"安全火柴≤2 盒","E":"打火机≤3 个"},"explanation":"酒精浓度 24%≤浓度≤70%可以携带，但是总重量要少于 3000 毫升；每瓶香水 50 毫\n\n升，限带 1 件；打火机≤2 个。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ABC","stem":"下列哪些情况，旅行社可以免责?(   )。","options":{"A":"游客因自身疾病导致损失或损害，旅行社不担责","B":"游客因游客个人过错导致的人身伤亡、财物损失及衍生费用，旅行社不承担责任","C":"游客者自行终止旅游行程或未参加约定活动自行行动时发生的人身、财物损害，旅行社不担责","D":"游客已声明且旅行社接受游客需照顾的情形，而工作人员未尽到照顾义务除外","E":"旅行社行程线路设计有问题"},"explanation":"游客参加活动时需服从导游或领队安排，注意自身及随行未成年人安全，妥善保管财\n\n物。因游客个人过错导致的人身伤亡、财物损失及衍生费用，旅行社不承担责任；游客因自\n\n身疾病导致损失或损害，旅行社不担责；游客自行终止旅游行程或未参加约定活动自行行动\n\n时发生的人身、财物损害，旅行社不担责。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper8-subject12-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retrySequence=[], retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    if(Array.isArray(state.retrySequence))retrySequence=[...new Set(state.retrySequence)].filter(n=>questions.some(q=>q.n===n));
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,retrySequence,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  const list=wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
  const rank=new Map(retrySequence.map((n,i)=>[n,i]));
  return list.sort((a,b)=>(rank.get(a.n)??Infinity)-(rank.get(b.n)??Infinity));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
    retrySequence=[];
  }
  if(!list.length)return;
  if(!retrySequence.length){
    for(let i=list.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [list[i],list[j]]=[list[j],list[i]];
    }
    retrySequence=list.map(q=>q.n);
  }
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  retrySequence=[];
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
