<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"对","stem":"墨家代表人物墨子主张“兼爱”“非攻”“尚同”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。墨家代表人物:墨子(名翟,著作叫《墨子》),主张“兼爱”“非攻”\n\n“尚同”。","clips":[]},{"n":2,"kind":"判断题","answer":"对","stem":"苏州宝带桥建于唐代，是我国孔数最多的联拱石桥。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。苏州宝带桥建于唐代,是我国孔数最多的联拱石桥。","clips":[]},{"n":3,"kind":"判断题","answer":"错","stem":"“建安七子”中成就最高的是刘桢，与曹植并称为“曹王”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,“刘桢”错误。建安七子成就最高的是王粲,与曹植并称为“曹王”,\n\n主要代表作是《七哀诗》和《登楼赋》。“建安七子”指孔融、陈琳、王粲、徐幹、阮瑀、\n\n应瑒、刘桢七人。","clips":[]},{"n":4,"kind":"判断题","answer":"对","stem":"祭月、赏月活动始于周代，北宋始定为中秋节。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。祭月、赏月活动始于周代,北宋始定为中秋节,南宋成为普遍的活动,\n\n明清以来盛行不衰。中秋节的时间在每年阴历八月十五,恰值三秋之中,故名。在中国人心目\n\n中,中秋节是象征团圆的传统节日。","clips":[]},{"n":5,"kind":"判断题","answer":"对","stem":"三湾改编从组织上确立了党对军队的领导。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1927 年 9 月 29 日,秋收起义军到达江西永新县三湾村时,在毛泽东的\n\n领导下进行了改编,史称三湾改编。三湾改编建立党的各级组织和党代表制度,党的支部建在\n\n连上,班、排有小组,连以上设党代表,营、团设党委;成立各级士兵委员会,实行民主制度,\n\n在政治上官兵平等。三湾改编从组织上确立了党对军队的领导,是建设无产阶级领导的新型\n\n人民军队的重要开端。","clips":[]},{"n":6,"kind":"判断题","answer":"对","stem":"中国最早的书法作品是商朝甲骨文和金文，分别镌刻在甲骨和青铜器上。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。中国最早的书法作品是商朝甲骨文和金文,分别镌刻在甲骨和青铜器\n\n上。秦丞相李斯创制小篆,实现了字体统一。","clips":[]},{"n":7,"kind":"判断题","answer":"对","stem":"春秋时楚国最早修筑长城数百里，称“方城”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。春秋时楚国最早修筑长城数百里,称“方城”。 汉长城规模最大,东\n\n起辽东,西迄蒲昌海(今新疆罗布泊),长 1 万千米。长城是中国古代规模最宏大的防御工程。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"嘉峪关是明长城西端的起点，有“天下第一雄关”的美名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。嘉峪关是明朝万里长城西端的终点,建于明洪武年间,是目前保存最完\n\n整的一座城关,有“天下第一雄关”的美名,也是丝绸之路上的重要一站。明长城东端的重要\n\n关隘是山海关。","clips":[]},{"n":9,"kind":"判断题","answer":"对","stem":"西晋王叔和著《脉经》，是我国最早的脉学著作。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。西晋王叔和著《脉经》,是我国最早的脉学著作;西晋皇甫谧著《针灸\n\n甲乙经》,是我国第一部针灸学著作。","clips":[]},{"n":10,"kind":"判断题","answer":"对","stem":"传说中国最早的历法是《黄帝历》。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。传说中国最早的历法是《黄帝历》。《授时历》是中国古代使用时间\n\n最长、精确度最高的历法。","clips":[]},{"n":11,"kind":"判断题","answer":"错","stem":"1970 年 4 月 24 日，我国用长征二号运载火箭成功发射了第一颗人造卫星“东方红一号”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,“长征二号”错误。1970 年 4 月 24 日,我国用长征一号运载火箭成功\n\n发射第一颗人造卫星“东方红一号”,成为继苏联、美国、法国、日本之后,世界第五个能独\n\n立发射人造地球卫星的国家。","clips":[]},{"n":12,"kind":"判断题","answer":"对","stem":"孙武著有《孙子兵法》，孙膑著有《孙膑兵法》，二人都是兵家代表人物。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。兵家关心的是“知己与知彼”“强与弱”“多与寡”“攻与守”的辩\n\n证关系,代表人物有春秋时期吴国将军孙武和战国时期齐国将军孙膑。孙武著有《孙子兵法》,\n\n孙膑著有《孙膑兵法》。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"“连中三元”指在乡试、会试、殿试中均获得第一名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。考生如果能够在两轮三次考试中都获得第一名,即“乡试”第一名“解\n\n元”、“会试”第一名“会元”、“殿试”第一名 “状元”,史称“连中三元”。","clips":[]},{"n":14,"kind":"判断题","answer":"错","stem":"法国的国花是玫瑰。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,“玫瑰”错误。法国的国花是香根鸢尾花。英国国花是玫瑰。法国还\n\n是世界著名的三大烹饪王国之一。","clips":[]},{"n":15,"kind":"判断题","answer":"对","stem":"中国佛教包容了北传佛教、南传佛教和藏传佛教三大体系。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。中国佛教包容了北传佛教、南传佛教和藏传佛教三大体系,世界上完\n\n整的佛教在中国,世界上完整的佛教经典也在中国。可以说,佛教诞生在印度,发展在中国。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"中国古典园林的精华集中在北方。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,“北方”错误。中国现存著名古典园林多是明、清两代的遗物。中国\n\n古典园林的精华集中在江南。现存著名皇家园林:北京颐和园、北海公园,河北承德避暑山庄\n\n等。","clips":[]},{"n":17,"kind":"判断题","answer":"对","stem":"王士性“无时不游，无地不游，无官不游”，被誉为中国人文地理学的开山鼻祖。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。明代出现两位大旅行家,一是王士性,二是徐霞客。王士性“无时不游,\n\n无地不游,无官不游”。被誉为中国人文地理学的开山鼻祖,代表作《广志绎》是一部很有价\n\n值的人文地理学著作。徐霞客真名徐弘祖,号霞客,著《徐霞客游记》。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"日食只发生于望日，月食只发生于朔日。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,日食、月食的发生时间说反了。日食是月球遮掩太阳的一种天象。只\n\n有朔日,地球才可能位于月球的背日方向,因之日食只发生于朔日。月食是地球遮掩太阳后,\n\n月球因没有可被反射的阳光而失去光明的一种天象。只有望日,月球才可能位于地球的背日\n\n方向。因之月食只发生于望日。","clips":[]},{"n":19,"kind":"判断题","answer":"错","stem":"“一国两制”构想最早是为解决香港问题而提出的。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,“香港问题”错误。1982 年,邓小平首次提出“一个国家,两种制度”\n\n的概念。“一国两制”构想最早是为解决台湾问题而提出的。","clips":[]},{"n":20,"kind":"判断题","answer":"错","stem":"鄱阳湖是我国第一大内陆湖泊，也是我国最大的淡水湖。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,“第一大内陆湖泊”错误。青海湖是我国第一大内陆湖泊,也是我国最\n\n大的咸水湖。青海湖鸟岛是我国重要的鸟类自然保护区。鄱阳湖是我国最大的淡水湖。由于\n\n东南季风带来大量水蒸气,鄱阳湖形成了“泽国芳草碧,梅黄烟雨中”景观。被称为“白鹤世\n\n界”“珍禽王国”。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"北京成为世界上第一个举办过夏季奥运会和冬季奥运会的城市，被称为\"双奥之城\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。随着 2022 年第 24 届冬季奥运会和冬残奥会的顺利举办,北京成为世\n\n界上第一个举办过夏季奥运会和冬季奥运会的城市,被称为\"双奥之城\"。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"额尔古纳湿地被誉为\"亚洲第一湿地\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。额尔古纳湿地是中国保持原状态最完好、面积较大的湿地,被誉为\"\n\n亚洲第一湿地\",是观鸟和体验湿地生态的绝佳场所。","clips":[]},{"n":23,"kind":"判断题","answer":"错","stem":"吉林省是东北地区唯一既沿海又沿边的省份。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,应为\"辽宁省\"。 辽宁省位于中国东北地区的南部,南临黄海、渤海,\n\n东与朝鲜一江之隔,与日本、韩国隔海相望,是东北地区唯一的既沿海又沿边的省份。","clips":[]},{"n":24,"kind":"判断题","answer":"错","stem":"山海关素有\"万里长城，金山独秀\"的美誉。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,错在\"山海关\"。素有\"万里长城,金山独秀\"美誉的是金山岭长城;山海\n\n关素有\"两京锁钥无双地,万里长城第一关\"的盛誉。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"清福陵因墓主人辈分最高，被称为盛京三陵中\"三陵之首\"，是清王朝的关外第一陵。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,\"福陵\"应改为\"永陵\"。清永陵因建筑年代远在清朝定都北京之前,且墓\n\n主人辈分又高,因此称\"三陵之首\",是清王朝的关外第一陵;清福陵是清太祖努尔哈赤和孝慈\n\n高皇后叶赫那拉氏的陵墓。","clips":[]},{"n":26,"kind":"判断题","answer":"对","stem":"伯夷、叔齐的《采薇歌》是辽宁最早有文字记载的文学作品。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。辽宁的文学创作古已有之,伯夷、叔齐的《采薇歌》是辽宁最早有文\n\n字记载的文学作品。","clips":[]},{"n":27,"kind":"判断题","answer":"错","stem":"山西全省大部分地区海拔在 1500 米以上，被誉为\"中华水塔\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,\"中华水塔\"应改为\"华北水塔\"。山西被誉为\"华北水塔\";全省大部分地\n\n区海拔在 1500 米以上,山地、丘陵面积占全省总面积的 80.1%。","clips":[]},{"n":28,"kind":"判断题","answer":"错","stem":"承德避暑山庄及周围寺庙是中国现存规模较大、保存最完整的皇家园林。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。中国现存规模较大、保存最完整的皇家园林是北京颐和园。承德避暑\n\n山庄及周围寺庙是中国现存最大的皇家宫苑和皇家寺庙建筑群。","clips":[]},{"n":29,"kind":"判断题","answer":"错","stem":"吉林市是吉林省第一大城市，是全国唯一与省同名的城市。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,应改为“第二大城市”。吉林市是全国唯一与省同名的城市。吉林市\n\n是吉林省第二大城市,素以\"北国江城\"而闻名,有\"雾凇之都滑雪天堂\"的美誉。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"长春净月潭国家级森林公园为亚洲最大的森林氧吧。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。长春净月潭国家级森林公园潭水涟漪,林茂风疏,为亚洲最大的森林氧\n\n吧。","clips":[]},{"n":31,"kind":"判断题","answer":"对","stem":"上海国际电影节创办于 1993 年，是中国唯一获国际电影制片人协会认证的国际 A 类电影节。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。上海国际电影节创办于 1993 年,是中国唯一获国际电影制片人协会认\n\n证的国际 A 类电影节;创办于 1986 年、中国第一个国际性电视节的是上海电视节。","clips":[]},{"n":32,"kind":"判断题","answer":"错","stem":"新疆是中国位置最北、纬度最高的省区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,应改为“黑龙江省”。黑龙江省简称\"黑\",省会哈尔滨,是中国位置最\n\n北、纬度最高的省份,地貌特征为\"五山一水一草三分田\"。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"五台山叶斗峰是华北最高峰，有\"华中屋脊\"之称。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,应改为“华北屋脊”。五台山叶斗峰海拔 3061 米,是华北最高峰,有\"\n\n华北屋脊\"之称。点评:台顶方位属细节考点。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"那达慕大会是蒙古族最重要的节日之一，每年春季举办。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,\"春季\"应改为\"夏季\"。那达慕大会是蒙古族最重要的节日之一,每年夏\n\n季举办,集合了体育竞技和文化娱乐,包括赛马、摔跤、射箭等项目。","clips":[]},{"n":35,"kind":"判断题","answer":"对","stem":"赵州桥是现存最早的敞肩石拱桥。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。石家庄全市有 6 个联合国认定的\"千年古县\",有世界最早的古驿道—\n\n—秦皇古道,有现存最早的敞肩石拱桥\"天下第一桥\"赵州桥,有被誉为\"京外名刹之首\"的隆\n\n兴寺,有\"中国古建筑博物馆\"之称的国家历史文化名城正定。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"浙江之名源自钱塘江，钱塘江是浙江省内第一大江，又称\"之江\"。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。浙江省简称\"浙\",浙江之名源自浙江省境内的钱塘江;钱塘江是浙江省\n\n内第一大江,又称\"之江\"。","clips":[]},{"n":37,"kind":"判断题","answer":"对","stem":"普陀山以\"海天佛国\"\"南海圣境\"著称于世。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。号称\"东南第一山\"的是雁荡山;普陀山以\"海天佛国\"\"南海圣境\"著称\n\n于世。","clips":[]},{"n":38,"kind":"判断题","answer":"对","stem":"江苏是中国地势最低的省份，绝大部分地区海拔在 50 米以下。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。江苏是中国地势最低的一个省份,绝大部分地区海拔 50 米以下,平原\n\n面积占陆地面积的 86.90%。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"2025 年上海港集装箱吞吐量连续 16 年位居全球第一。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。上海港是世界级枢纽港,2025 年全年完成港口货物吞吐量 88538.18\n\n万吨,集装箱吞吐量 5506.25 万国际标准箱,连续 16 年位居全球第一。","clips":[]},{"n":40,"kind":"判断题","answer":"错","stem":"截至目前，文化和旅游部共确定了 368 处国家 5A 级旅游景区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误,应为\"358 处\"。截至目前,文化和旅游部共确定了 358 处国家 5A 级旅\n\n游景区(含恢复的乔家大院、陕西山西共有的黄河壶口瀑布算 1 处)。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"B","stem":"苏州园林中,( )以建筑布置精巧、奇石众多而著称。","options":{"A":"网师园","B":"留园","C":"拙政园","D":"沧浪亭"},"explanation":"留园以建筑布置精巧、奇石众多而著称。河北承德避暑山庄、北京颐和园、江苏苏州\n\n拙政园与留园,被称为我国“四大园林”。\n\nA 项网师园蕴含浓郁的隐逸气息,是以少胜多的典范,被誉为“苏州园林小园极则”。\n\nC 项拙政园是苏州现存最大的古典园林,也是苏州园林的代表作,全园以水为中心。\n\nD 项沧浪亭代表宋代艺术风格(苏州的沧浪亭、狮子林、拙政园和留园分别代表宋、元、明、\n\n清四个朝代的艺术风格)。","clips":[]},{"n":42,"kind":"单项选择题","answer":"D","stem":"1927 年领导湘赣边界秋收起义的是( )。","options":{"A":"刘少奇","B":"周恩来","C":"朱德","D":"毛泽东"},"explanation":"1927 年 9 月 9 日,湘赣边界秋收起义爆发。秋收起义从进攻大城市转向进攻农村,是\n\n中国革命具有决定意义的新起点。八七会议后,毛泽东以中央特派员身份到湖南传达八七会\n\n议精神,改组省委,领导了秋收起义。B 项周恩来、C 项朱德参与领导的是南昌起义。","clips":[]},{"n":43,"kind":"单项选择题","answer":"C","stem":"宋词婉约派的代表人物是( )。","options":{"A":"王安石、欧阳修","B":"陆游、范成大","C":"柳永、李清照","D":"苏轼、辛弃疾"},"explanation":"宋词流派有以柳永、李清照为代表的婉约派,以苏轼、辛弃疾为代表的豪放派。D 项\n\n苏轼、辛弃疾为豪放派代表。A 项王安石、欧阳修名列“唐宋八大家”,B 项陆游、范成大以\n\n诗歌创作著称,均非婉约派代表。","clips":[]},{"n":44,"kind":"单项选择题","answer":"D","stem":"新石器时代后期，北方黄河流域父系氏族社会的代表性文化是( )。","options":{"A":"红山文化","B":"仰韶文化","C":"河姆渡文化","D":"龙山文化"},"explanation":"新石器时代后期——父系氏族社会代表性文化是北方黄河流域的龙山文化和南方长江\n\n流域的良渚文化,距今 5000‑ 4000 年。使用快轮制造陶器、出现城址是这一时期重要的文化\n\n特征。龙山文化轮制的黑陶薄如蛋壳,十分精良。B 项仰韶文化是北方黄河流域母系氏族社\n\n会代表性文化,C 项河姆渡文化是南方长江流域母系氏族社会代表性文化,均属新石器时代\n\n前期(距今 7000—5000 年)。","clips":[]},{"n":45,"kind":"单项选择题","answer":"B","stem":"确定了土地革命和武装反抗国民党反动派总方针的会议是( )。","options":{"A":"中共三大","B":"八七会议","C":"古田会议","D":"遵义会议"},"explanation":"八七会议着重批评了大革命后期以陈独秀为代表的右倾机会主义错误,确定了土地革\n\n命和武装反抗国民党反动派的总方针。八七会议是由大革命失败到土地革命战争兴起的历史\n\n性转变。A 项中共三大 1923 年 6 月在广州举行;C 项古田会议确立了思想建党、政治建军的\n\n原则;D 项遵义会议是党的历史上一个生死攸关的转折点。","clips":[]},{"n":46,"kind":"单项选择题","answer":"B","stem":"采用“种蛎固基法”、由蔡襄主持建造的桥梁是( )。","options":{"A":"赵州桥","B":"洛阳桥","C":"宝带桥","D":"湘子桥"},"explanation":"泉州洛阳桥又名万安桥,是我国古代著名的梁式石桥。桥为当年郡守蔡襄主持建造,\n\n工程十分艰难。为使桥基和桥墩石胶结牢固,采用了“种蛎固基法”,独具匠心,为我国古代\n\n重要的科学创新。A 项赵州桥(安济桥)建于隋开皇年间,由工匠李春设计建造,是世界上现存\n\n最大的敞肩桥。C 项苏州宝带桥建于唐代,是我国孔数最多的联拱石桥。D 项潮州湘子桥又称\n\n广济桥,初建于宋代,是我国第一座启闭式桥梁。","clips":[]},{"n":47,"kind":"单项选择题","answer":"A","stem":"彩画的使用有严格的等级规定，级别由高到低依次是( )。","options":{"A":"和玺彩画、旋子彩画、苏式彩画","B":"旋子彩画、和玺彩画、苏式彩画","C":"苏式彩画、旋子彩画、和玺彩画","D":"和玺彩画、苏式彩画、旋子彩画"},"explanation":"彩画的使用有严格的等级规定,级别由高到低分为和玺彩画、旋子彩画、苏式彩画三\n\n种。明代规定,庶民民居不得饰彩画。","clips":[]},{"n":48,"kind":"单项选择题","answer":"C","stem":"世界上最寒冷的首都是( )。","options":{"A":"雷克雅未克","B":"莫斯科","C":"渥太华","D":"赫尔辛基"},"explanation":"渥太华是加拿大的首都,位于安大略省东南部,是世界上最寒冷的首都。国会大厦是渥\n\n太华最著名的标志性建筑,也是加拿大的象征。","clips":[]},{"n":49,"kind":"单项选择题","answer":"C","stem":"世界上最大的展示极地海洋动物及极地体验的场馆——极地馆，位于( )。","options":{"A":"上海海昌海洋公园","B":"珠海长隆海洋王国","C":"大连老虎滩海洋馆","D":"青岛海底世界"},"explanation":"大连老虎滩海洋馆有世界最大的展示极地海洋动物及极地体验的场馆——极地馆,还\n\n有亚洲最大以展示珊瑚礁生物群为主的大型海洋生物馆——珊瑚馆。","clips":[]},{"n":50,"kind":"单项选择题","answer":"C","stem":"唐代著名行书作品《祭侄文稿》的作者是( )。","options":{"A":"赵孟頫","B":"欧阳询","C":"颜真卿","D":"柳公权"},"explanation":"唐颜真卿的《祭侄文稿》也是著名的行书作品。行书以东晋王羲之成就最高,人称“书\n\n圣”,代表作《兰亭集序》被誉为“天下第一行书”。唐朝欧阳询、颜真卿、柳公权与元朝\n\n赵孟頫,合称“楷书四大家”;A 项赵孟頫为元朝人;B 项欧阳询、D 项柳公权均为唐代楷书名\n\n家,非《祭侄文稿》作者。","clips":[]},{"n":51,"kind":"单项选择题","answer":"D","stem":"西安大雁塔是由( )设计建造的仿印度窣堵波式佛塔。","options":{"A":"法显","B":"慧能","C":"鉴真","D":"玄奘"},"explanation":"西安大雁塔被视为古都西安的象征,是由玄奘设计建造的仿印度窣堵波式佛塔。C 项\n\n鉴真为唐代东渡日本的高僧,日本奈良的唐招提寺即由其主持建造;A 项法显、B 项慧能与西\n\n安大雁塔无关。","clips":[]},{"n":52,"kind":"单项选择题","answer":"D","stem":"“落霞与孤鹜齐飞，秋水共长天一色”出自王勃的( )。","options":{"A":"《岳阳楼记》","B":"《赤壁赋》","C":"《兰亭集序》","D":"《滕王阁序》"},"explanation":"滕王阁载誉古今,是与王勃《滕王阁序》分不开的,其经典语句“落霞与孤鹜齐飞,秋\n\n水共长天一色”广为流传。A 项《岳阳楼记》作者是范仲淹;B 项《赤壁赋》作者是苏轼;C\n\n项《兰亭集序》作者是王羲之。","clips":[]},{"n":53,"kind":"单项选择题","answer":"A","stem":"世界上第一部由国家颁布的药典是唐朝的( )。","options":{"A":"《唐本草》","B":"《千金方》","C":"《本草纲目》","D":"《神农本草经》"},"explanation":"唐朝由政府颁定《唐本草》,是世界上第一部由国家颁布的药典。东汉《神农本草经》,\n\n是我国第一部药物学著作;明朝李时珍著《本草纲目》,是集中国古代药物学大成的巨著,被\n\n誉为“东方药学巨典”。B 项《千金方》是唐朝名医孙思邈所著,被誉为“东方医学圣典”;D\n\n项《神农本草经》是东汉我国第一部药物学著作;C 项《本草纲目》为明朝李时珍所著。","clips":[]},{"n":54,"kind":"单项选择题","answer":"A","stem":"东晋顾恺之主张“以形写神”，其代表作是( )。","options":{"A":"《女史箴图》《洛神赋图》","B":"《步辇图》《历代帝王图》","C":"《游春图》","D":"《清明上河图》"},"explanation":"东晋顾恺之,擅长人物画,主张“以形写神”,代表作《女史箴图》《洛神赋图》;B 项\n\n《步辇图》《历代帝王图》是初唐阎立本的代表作。C 项《游春图》是隋朝展子虔的代表作,\n\n是现存最早的卷轴画。D 项《清明上河图》是宋代张择端的作品。","clips":[]},{"n":55,"kind":"单项选择题","answer":"A","stem":"日本有 108 个活火山，是地震多发国，被称为( )。","options":{"A":"“火山、地震之国”","B":"“枫叶之国”","C":"“骑在羊背上的国家”","D":"“冰城”"},"explanation":"日本国土将近 70%为山地,69%的陆地面积为森林覆盖,有 108 个活火山,是地震多发国,\n\n被称为“火山、地震之国”。B 项“枫叶之国”指加拿大;C 项“骑在羊背上的国家”指澳大\n\n利亚;D 项“冰城”指哈尔滨。","clips":[]},{"n":56,"kind":"单项选择题","answer":"C","stem":"北京故宫的清朝玉雕《大禹治水玉山》是用整块( )雕琢而成的。","options":{"A":"岫玉","B":"独山玉","C":"和田玉","D":"蓝田玉"},"explanation":"北京故宫的清朝玉雕《大禹治水玉山》就是用整块和田玉雕琢而成的。一般所称中国\n\n“四大名玉”是指新疆的和田玉、辽宁岫岩县的岫玉、河南南阳的独山玉、陕西蓝田的蓝田\n\n玉。被称为羊脂玉的白玉,为和田玉中最佳品。A 项岫玉产于辽宁岫岩县、B 项独山玉产于河\n\n南南阳、D 项蓝田玉产于陕西蓝田,均非该玉山用料。","clips":[]},{"n":57,"kind":"单项选择题","answer":"A","stem":"我国探月工程“嫦娥工程”中，首次实现月球采样返回的是( )。","options":{"A":"嫦娥五号","B":"嫦娥六号","C":"嫦娥三号","D":"嫦娥四号"},"explanation":"2004 年我国启动探月工程(命名为“嫦娥工程”),其中嫦娥五号带回月壤 1731 克,实\n\n现了我国首次月球采样返回。 嫦娥六号带回人类首份月背样品 1935.3 克。","clips":[]},{"n":58,"kind":"单项选择题","answer":"C","stem":"鱼尾狮是( )的标志。","options":{"A":"泰国","B":"菲律宾","C":"新加坡","D":"马来西亚"},"explanation":"鱼尾狮坐落于新加坡河畔,高 8 米,是新加坡的标志。新加坡别称“狮城”,是世界上\n\n最袖珍的国家之一。整个国家也即是一座城市,有“花园城市”的美誉。","clips":[]},{"n":59,"kind":"单项选择题","answer":"C","stem":"汉族服装始终保留的鲜明特点是( )。","options":{"A":"对襟中开","B":"圆领窄袖","C":"大襟右衽","D":"大襟左衽"},"explanation":"汉族的服饰在式样上主要有上衣下裳和衣裳相连两种基本的形式,大襟右衽是其服装\n\n始终保留的鲜明特点。 汉族的染织工艺,以其历史悠久、技术先进、制作精美而独步世界。","clips":[]},{"n":60,"kind":"单项选择题","answer":"B","stem":"重阳节的应景食品是( )。","options":{"A":"粽子","B":"重阳糕","C":"汤圆","D":"月饼"},"explanation":"重阳节的习俗主要有登高、插茱萸、饮菊花酒等,应景食品是重阳糕。江南地区,持蟹\n\n赏菊也是重阳节的美事。A 项粽子、C 项汤圆、D 项月饼分别为端午节、元宵节、中秋节的\n\n应景食品。","clips":[]},{"n":61,"kind":"单项选择题","answer":"C","stem":"元宵耍灯起源于( )。","options":{"A":"宋代","B":"明代","C":"汉代","D":"唐代"},"explanation":"元宵耍灯起源于汉代,每到元宵节,很多地方都要举行灯展。正月十五为每年第一个望\n\n月,称为上元节,也称元宵节,是春节活动的高潮和结束。","clips":[]},{"n":62,"kind":"单项选择题","answer":"C","stem":"花岗岩低山或丘陵地貌受球状风化作用，常形成巨大的( )造型。","options":{"A":"“石林”","B":"石瀑","C":"“石蛋”","D":"石笋"},"explanation":"花岗岩低山或者丘陵,其特点是:高度小,起伏和缓,岩石表面受到球状风化作用,浑圆\n\n多姿,形成巨大的“石蛋”造型或浑圆多姿的巨石兀立形态。厦门鼓浪屿万石山、浙江普陀\n\n山、海南岛天涯海角等景区属于典型的花岗岩低山或名丘地貌。A 项“石林”属地表喀斯特\n\n景观;D 项“石笋”属地下喀斯特洞穴景观;B 项“石瀑”非花岗岩球状风化造型。","clips":[]},{"n":63,"kind":"单项选择题","answer":"D","stem":"历史上基督教有( )中国之说。","options":{"A":"五传","B":"二传","C":"三传","D":"四传"},"explanation":"历史上有基督教四传中国之说。道教是土生土长的中国宗教,形成于东汉时期。","clips":[]},{"n":64,"kind":"单项选择题","answer":"D","stem":"被誉为“地球绿洲”“动植物基因库”的是( )。","options":{"A":"五台山","B":"普陀山","C":"九华山","D":"梵净山"},"explanation":"梵净山被誉为“地球绿洲”“动植物基因库”“人类的宝贵遗产”,拥有以黔金丝猴\n\n等为代表的珍稀野生动植物及原生森林生态系统。梵净山得名于“梵天净土”,是西南地区\n\n佛教名山。A 项五台山、B 项普陀山、C 项九华山均为佛教名山,但无“地球绿洲”“动植物\n\n基因库”之称。","clips":[]},{"n":65,"kind":"单项选择题","answer":"B","stem":"迄今世界上最大的水利枢纽工程是( )。","options":{"A":"葛洲坝水利工程","B":"三峡水利工程","C":"小浪底水利工程","D":"三门峡水利工程"},"explanation":"三峡水利工程全称“长江三峡水利枢纽工程”,位于湖北省宜昌市夷陵区三斗坪镇,\n\n是我国治理、开发和保护长江的关键性骨干工程,也是迄今世界上最大的水利枢纽工程。可\n\n实现防洪、发电和航运三大效益。A 项葛洲坝水利工程是三线建设的伟大成果之一;C 项小浪\n\n底、D 项三门峡均非世界最大水利枢纽工程。","clips":[]},{"n":66,"kind":"单项选择题","answer":"B","stem":"马尔代夫的旅游业特色模式是( )。","options":{"A":"“一岛一农场”","B":"“一岛一度假村酒店”","C":"“一岛一赌场”","D":"“一岛一寺庙”"},"explanation":"马尔代夫的旅游业是第一支柱产业,与船运业、渔业并列为三大经济支柱,特色模式为\n\n“一岛一度假村酒店”。马累是马尔代夫的首都,面积约 1.96 平方千米,是世界上最小的首\n\n都之一。","clips":[]},{"n":67,"kind":"单项选择题","answer":"A","stem":"韩国的首都是( )。","options":{"A":"首尔","B":"仁川","C":"大邱","D":"釜山"},"explanation":"首尔是韩国首都,韩国金融和商业中心,也是“世界经济实力最强的城市”之一。D 项\n\n釜山是韩国第二大城市和最大的港口城市,也是世界第五大集装箱港。","clips":[]},{"n":68,"kind":"单项选择题","answer":"A","stem":"古代帝王改年号称为( )。","options":{"A":"改元","B":"建元","C":"纪元","D":"纪年"},"explanation":"改年号叫改元。改年号后新的年号从元年开始重新计数。西汉武帝时开始采用年号纪\n\n年,如汉武帝将即位的第一年(公元前 140 年)称为建元元年。B 项“建元”是汉武帝即位后\n\n第一个年号的名称,不是改年号的称谓。","clips":[]},{"n":69,"kind":"单项选择题","answer":"A","stem":"下列三线建设成果中，位于贵州的是( )。","options":{"A":"六盘水煤炭工业基地","B":"东风汽车公司","C":"酒泉卫星发射中心","D":"攀枝花钢铁基地"},"explanation":"四川攀枝花钢铁基地、湖北东风汽车公司、甘肃酒泉卫星发射中心、贵州六盘水煤炭\n\n工业基地以及著名的葛洲坝水利工程,都是三线建设的伟大成果。B 项东风汽车公司位于湖\n\n北,C 项酒泉卫星发射中心位于甘肃,D 项攀枝花钢铁基地位于四川。","clips":[]},{"n":70,"kind":"单项选择题","answer":"C","stem":"长江干流所经省级行政区总共有( )个。","options":{"A":"9","B":"10","C":"11","D":"12"},"explanation":"长江干流所经省级行政区总共有 11 个,自西至东依次为青海、四川、西藏、云南、重\n\n庆、湖北、湖南、江西、安徽、江苏和上海,奔入东海。","clips":[]},{"n":71,"kind":"单项选择题","answer":"D","stem":"欧洲最大的海港、荷兰第二大城市是( )。","options":{"A":"海牙","B":"乌得勒支","C":"阿姆斯特丹","D":"鹿特丹"},"explanation":"鹿特丹是荷兰第二大城市、欧洲最大的海港。","clips":[]},{"n":72,"kind":"单项选择题","answer":"D","stem":"至今保存着中国最早人工种植七株茶树的皇茶园位于( )。","options":{"A":"浙江省杭州市狮峰山","B":"福建省武夷山市","C":"云南省普洱市","D":"四川省名山县蒙顶山"},"explanation":"西汉时期开始茶叶种植,四川省名山县蒙顶山的皇茶园,至今保存着中国最早人工种植\n\n的七株茶树。","clips":[]},{"n":73,"kind":"单项选择题","answer":"A","stem":"以浙江越窑青瓷和河北邢窑白瓷为代表的隋唐瓷业，史称( )。","options":{"A":"“南青北白”","B":"“东青西白”","C":"“南红北白”","D":"“南白北青”"},"explanation":"隋唐时期陶瓷业进入了迅猛发展的阶段,形成了以浙江越窑为代表的青瓷和以河北邢\n\n窑为代表的白瓷两大瓷窑系统,一般以 “南青北白”概称之。","clips":[]},{"n":74,"kind":"单项选择题","answer":"B","stem":"“左祖右社”中，“右社”指的是宫殿右前方设的( )。","options":{"A":"太庙","B":"社稷坛","C":"天坛","D":"地坛"},"explanation":"“右社”——在宫殿右前方设社稷坛,社为土地神,稷为谷物神,社稷坛是帝王祭祀土\n\n地神、谷物神的地方。 “左祖”——在宫殿左前方设祖庙,是帝王祭祀祖先的地方,因为是\n\n天子的祖庙,故称太庙。A 项太庙是“左祖”;C 项天坛是祭天场所,D 项地坛是祭地场所。","clips":[]},{"n":75,"kind":"单项选择题","answer":"B","stem":"西双版纳野象谷是我国最大的( )聚集地。","options":{"A":"丹顶鹤","B":"亚洲象","C":"大熊猫","D":"金丝猴"},"explanation":"西双版纳野象谷是我国最大的亚洲象聚集地。D 项金丝猴以梵净山黔金丝猴为代表;A\n\n项丹顶鹤、C 项大熊猫与西双版纳野象谷无关。","clips":[]},{"n":76,"kind":"单项选择题","answer":"A","stem":"粤菜对( )的烹制有独到之处。","options":{"A":"蛇","B":"鼠","C":"猫","D":"狗"},"explanation":"广东各地对鱼虾、禽畜、野味烹制均有专长,尤其对“蛇”的制作有独到之处。粤菜\n\n历来以选料广博奇杂、菜肴新颖奇异而闻名全国,其口味清淡,重汤菜。粤菜由广府、客家、\n\n潮汕三种风味组成,以广府风味为代表。","clips":[]},{"n":77,"kind":"单项选择题","answer":"C","stem":"新中国成立后建成的第一条铁路是( )。","options":{"A":"青藏铁路","B":"宝成铁路","C":"成渝铁路","D":"成昆铁路"},"explanation":"新中国成立后建成的第一条铁路是成渝铁路,全长 505 公里,连通成都和重庆,1950 年\n\n开始建设,1952 年 7 月 1 日建成通车,填补了西南地区铁路建设的空白。A 项青藏铁路、B 项\n\n宝成铁路、D 项成昆铁路建成均晚于成渝铁路。","clips":[]},{"n":78,"kind":"单项选择题","answer":"B","stem":"东汉时期，改进造纸法，造出“蔡侯纸”的是( )。","options":{"A":"沈括","B":"蔡伦","C":"毕昇","D":"张衡"},"explanation":"造纸术萌芽于西汉,东汉时期,宦官蔡伦改进造纸法,造出质地细腻、便于书写的“蔡\n\n侯纸”。目前所能见到的最早的印刷品,是唐代印制的《金刚经》(868 年),叫雕版印刷。C\n\n项毕昇是北宋平民,发明活字印刷术;A 项沈括是北宋科学家,编撰《梦溪笔谈》;D 项张衡为\n\n东汉科学家,与造纸术无关。","clips":[]},{"n":79,"kind":"单项选择题","answer":"B","stem":"元明清三代被指定为皇室御用贡品，用于龙袍、凤衣及宫廷装饰的是( )。","options":{"A":"壮锦","B":"云锦","C":"蜀锦","D":"宋锦"},"explanation":"元明清三代,云锦被指定为皇室御用贡品,用于龙袍、凤衣及宫廷装饰,三朝相继在南\n\n京设官办织造局。云锦因锦面色彩斑斓、美若云霞而得名,被专家称为“中国古代织锦工艺\n\n史上最后一座里程碑”。在中国众多锦中,南京云锦、四川蜀锦、苏州宋锦、广西壮锦并称\n\n“四大名锦”,分别代表宫廷皇家、汉唐丝路、文人雅士和少数民族四大文化体系。A 项壮\n\n锦代表少数民族文化体系、C 项蜀锦代表汉唐丝路、D 项宋锦代表文人雅士,均非元明清皇室\n\n御用贡品。","clips":[]},{"n":80,"kind":"单项选择题","answer":"D","stem":"被誉为“外交酒”的是( )。","options":{"A":"山西汾酒","B":"五粮液","C":"桂林三花酒","D":"贵州茅台酒"},"explanation":"贵州茅台酒是酱香型酒的典型代表,还是许多重大外事活动的见证者,因而被誉为“外\n\n交酒”。 A 项山西汾酒是清香型酒的代表;B 项五粮液酒是浓香型酒的代表;C 项桂林三花酒\n\n是米香型酒的代表。","clips":[]},{"n":81,"kind":"单项选择题","answer":"B","stem":"东汉擅今草、被尊为“草圣”的书法家是( )。","options":{"A":"王羲之","B":"张芝","C":"张旭","D":"怀素"},"explanation":"草书名家有东汉张芝,擅今草;唐朝张旭和怀素,擅狂草,三人均有“草圣”之誉。A 项\n\n王羲之是东晋行书大家,被尊为“书圣”;C 项张旭、D 项怀素是唐朝狂草名家,非东汉人。","clips":[]},{"n":82,"kind":"单项选择题","answer":"A","stem":"曾有“尺瓶寸盂视为无上之品，茗瓯酒盏叹为不世之珍”之说的是( )。","options":{"A":"雨点釉瓷","B":"青花瓷","C":"粉彩瓷","D":"玲珑瓷"},"explanation":"雨点釉瓷又名油滴瓷,曾有“尺瓶寸盂视为无上之品,茗瓯酒盏叹为不世之珍”之说。\n\nB 项青花瓷、C 项粉彩瓷、D 项玲珑瓷与颜色釉瓷并称为景德镇四大传统名瓷,均无此说。","clips":[]},{"n":83,"kind":"单项选择题","answer":"D","stem":"中国共产党第一次全国代表大会最后一天会议转移到( )的游船上举行。","options":{"A":"江西鄱阳湖","B":"湖北东湖","C":"江苏太湖","D":"浙江嘉兴南湖"},"explanation":"1921 年 7 月 23 日,中国共产党第一次全国代表大会在上海法租界望志路 106 号(今兴\n\n业路 76 号)召开。因法租界巡捕搜查会议地点,中共一大最后一天会议转移到浙江嘉兴南湖\n\n的游船上举行。","clips":[]},{"n":84,"kind":"单项选择题","answer":"B","stem":"“四象”中代表东方的是( )。","options":{"A":"朱雀","B":"青龙","C":"玄武","D":"白虎"},"explanation":"“四象”:东方青龙、北方玄武、西方白虎、南方朱雀。A 项朱雀代表南方,C 项玄武\n\n代表北方,D 项白虎代表西方。","clips":[]},{"n":85,"kind":"单项选择题","answer":"D","stem":"中国现存年代最早、规模最大的藏传佛塔是( )。","options":{"A":"嵩岳寺塔","B":"真觉寺塔","C":"崇圣寺三塔","D":"妙应寺白塔"},"explanation":"妙应寺白塔是中国现存年代最早、规模最大的藏传佛塔,位于北京。A 项河南登封嵩\n\n岳寺塔、C 项崇圣寺三塔均为密檐式塔;B 项北京真觉寺塔以精美的雕刻艺术而著称,三者均\n\n非藏传佛塔。","clips":[]},{"n":86,"kind":"单项选择题","answer":"A","stem":"现代保存下来的中国古典园林大多属于( )。","options":{"A":"明清时期","B":"秦汉时期","C":"元朝","D":"唐宋时期"},"explanation":"现代保存下来的园林大多属于明清时期,这些园林充分表现了中国古典园林的独特风\n\n格和高超的造园技术。 魏晋南北朝时期是中国园林发展的转折点。唐宋时期园林达到成熟\n\n阶段,明清时期,园林艺术进入精深发展阶段。D 项唐宋时期园林达到成熟阶段,但并非现存\n\n园林的主要所属时期。","clips":[]},{"n":87,"kind":"单项选择题","answer":"A","stem":"福建省人口最多的少数民族是( )。","options":{"A":"畲族","B":"回族","C":"满族","D":"蒙古族"},"explanation":"福建畲族人口占全国畲族人口的 57%,福建省畲族人口全国最多,是全国回族发祥地之\n\n一。畲族婚俗最大的特点是\"俗不离歌\",婚礼上有\"男拜女不拜\"仪式。","clips":[]},{"n":88,"kind":"单项选择题","answer":"B","stem":"被称为\"华中屋脊\"的是( )。","options":{"A":"衡山","B":"神农架","C":"大巴山","D":"大别山"},"explanation":"号称\"华中屋脊\"和\"绿色宝库\"的神农架是重要的自然保护区,最高峰神农顶海拔 3105\n\n米,\"野人之谜\"更令人关注。A 项衡山有\"五岳独秀\"之称(湖南),C 项大巴山、D 项大别山均\n\n为我国著名山地,均易误选。","clips":[]},{"n":89,"kind":"单项选择题","answer":"C","stem":"大连船舶重工研制的中国第一艘航空母舰是( )。","options":{"A":"\"山东舰\"","B":"\"福建舰\"","C":"\"辽宁舰\"","D":"\"广东舰\""},"explanation":"大连船舶重工研制出中国第一艘航空母舰\"辽宁舰\"、第一艘全国产航空母舰\"山东舰\",\n\n大船集团建造了全球首艘安装风帆装置的 30.8 万吨超大型原油船\"凯力轮\"。A 项\"山东舰\"\n\n亦由大连船舶重工研制,但它是第一艘全国产航空母舰,并非中国第一艘。","clips":[]},{"n":90,"kind":"单项选择题","answer":"D","stem":"被称为\"东南第一山\"的是( )。","options":{"A":"雪窦山","B":"莫干山","C":"江郎山","D":"雁荡山"},"explanation":"浙江省境内有号称\"东南第一山\"的雁荡山风景名胜区。雪窦山、莫干山、江郎山均为\n\n浙江名山,易误选。","clips":[]},{"n":91,"kind":"单项选择题","answer":"A","stem":"浙江全省最大的人工湖泊是( )。","options":{"A":"千岛湖","B":"洞庭湖","C":"鄱阳湖","D":"太湖"},"explanation":"千岛湖是新安江水电站建成后形成的全省最大人工湖泊。浙江有杭州西湖、绍兴东湖、\n\n嘉兴南湖、宁波东钱湖四大名湖。B 项洞庭湖位于湖南,C 项鄱阳湖位于江西,D 项太湖位于\n\n江苏,均为天然湖泊,非浙江人工湖。","clips":[]},{"n":92,"kind":"单项选择题","answer":"B","stem":"中国北方最大的民宅戏楼是( )。","options":{"A":"乔家大院戏楼","B":"石府戏楼","C":"恭王府戏楼","D":"颐和园戏楼"},"explanation":"天津杨柳青博物馆(石家大院)有\"华北第一宅\"之称,大院内的石府戏楼是中国北方最\n\n大的民宅戏楼。","clips":[]},{"n":93,"kind":"单项选择题","answer":"C","stem":"素有\"华北明珠\"之称，且为中国海河平原上最大湖泊的是( )。","options":{"A":"衡水湖","B":"官厅水库","C":"白洋淀","D":"潘家口水库"},"explanation":"白洋淀因电影《小兵张嘎》而驰名中外,是中国海河平原上最大的湖泊,水产资源丰富,\n\n并以大面积的芦苇荡和千亩连片的荷花淀而闻名,素有\"华北明珠\"之称。","clips":[]},{"n":94,"kind":"单项选择题","answer":"D","stem":"我国北方地区最好的深水不冻港是( )。","options":{"A":"天津港","B":"营口港","C":"秦皇岛港","D":"大连港"},"explanation":"大连港是我国北方地区最好的深水不冻港。A 项天津港是世界等级最高、中国最大的\n\n人工深水港,C 项秦皇岛港是不冻不淤的天然良港(河北),易误选。","clips":[]},{"n":95,"kind":"单项选择题","answer":"A","stem":"北京最早见于文献的名称是( )。","options":{"A":"蓟","B":"幽州","C":"燕京","D":"大都"},"explanation":"北京最早见于文献的名称叫\"蓟\"。1267 年蒙古大汗忽必烈下令在中都城的东北郊筑\n\n建新城,1285 年元大都新城全部建成,这便是意大利旅行家马可·波罗在游记中称为\"世界莫\n\n能与比\"的元大都。B 项幽州、C 项燕京、D 项大都均为北京历史名称,但最早见于文献的名\n\n称是\"蓟\"。","clips":[]},{"n":96,"kind":"单项选择题","answer":"B","stem":"被誉为\"中华第一关\"的是( )。","options":{"A":"山海关","B":"雁门关","C":"嘉峪关","D":"八达岭长城"},"explanation":"雁门关被誉为\"中华第一关\"(山西)。\"天下第一关\"指山海关(河北),\"天下第一雄关\"\n\n指嘉峪关(甘肃),\"北门锁钥\"指八达岭长城(北京),均易误选。","clips":[]},{"n":97,"kind":"单项选择题","answer":"C","stem":"上海境内最高点是( )。","options":{"A":"佘山","B":"崇明岛","C":"大金山","D":"天马山"},"explanation":"大金山为上海境内最高点,海拔 103.4 米。A 项佘山、D 项天马山均为上海境内山丘,B\n\n项崇明岛是中国第三大岛,均非上海境内最高点。","clips":[]},{"n":98,"kind":"单项选择题","answer":"D","stem":"西泠印社以\"保存金石，研究印学，兼及书画\"为宗旨，其第一任社长是( )。","options":{"A":"齐白石","B":"徐悲鸿","C":"张大千","D":"吴昌硕"},"explanation":"西泠印社吴昌硕为第一任社长,是国际上历史最悠久、成就最高、影响最广的篆刻艺\n\n术团体,有\"天下第一名社\"之誉。A 项齐白石、B 项徐悲鸿、C 项张大千均为近现代书画名家,\n\n与西泠印社第一任社长无关。","clips":[]},{"n":99,"kind":"单项选择题","answer":"B","stem":"下列哪项是江苏最高峰( )。","options":{"A":"黄山莲花峰","B":"连云港云台山玉女峰","C":"浙江黄茅尖","D":"陕西太白山拔仙台"},"explanation":"连云港云台山玉女峰为江苏最高峰,海拔 624.4 米。黄山莲花峰、黄茅尖、太白山拔\n\n仙台均为外省名山,易误选。","clips":[]},{"n":100,"kind":"单项选择题","answer":"D","stem":"土家族无论什么盛大聚会都要跳的最著名舞蹈是( )。","options":{"A":"长鼓舞","B":"铜鼓舞","C":"芦笙舞","D":"摆手舞"},"explanation":"\"摆手舞\"是最著名的土家舞蹈,是与祭祀祖先、祈求丰收相联系的,无论什么盛大的聚\n\n会都要跳。A 项长鼓舞为瑶族盛行舞蹈(广西金秀),B 项铜鼓舞、C 项芦笙舞均为少数民族舞\n\n蹈而非土家族舞蹈。","clips":[]},{"n":101,"kind":"单项选择题","answer":"A","stem":"明清时期晋商建立的中国第一家票号是( )。","options":{"A":"日昇昌","B":"蔚泰厚","C":"协同庆","D":"百川通"},"explanation":"明清时期,晋商成为国内势力最雄厚的商帮,晋商建立了中国第一家票号——日昇昌。\n\n著名的平遥古城、乔家大院都与晋商的鼎盛息息相关。","clips":[]},{"n":102,"kind":"单项选择题","answer":"D","stem":"福建全省第一大岛是( )。","options":{"A":"东山岛","B":"厦门岛","C":"金门岛","D":"平潭岛"},"explanation":"平潭岛为福建全省第一大岛。平潭岛(海坛岛)也是全国第五大岛、福建全省第一大岛。","clips":[]},{"n":103,"kind":"单项选择题","answer":"A","stem":"上海历史最悠久、规模最大的佛教寺院是( )。","options":{"A":"龙华寺","B":"静安寺","C":"玉佛寺","D":"宝山寺"},"explanation":"龙华寺位于上海市徐汇区龙华街道,是上海历史最悠久、规模最大的佛教寺院,有\"江\n\n南千年名刹\"之誉。寺前的龙华塔是上海保存最完整的宋代古塔,被誉为申城\"宝塔之冠\"。","clips":[]},{"n":104,"kind":"单项选择题","answer":"B","stem":"有\"京东第一山\"之誉的是( )。","options":{"A":"千山","B":"盘山","C":"医巫闾山","D":"凤凰山"},"explanation":"盘山风景名胜区位于天津市蓟州区,有\"京东第一山\"之誉。千山有\"东北明珠\"之称(辽\n\n宁),易误选。","clips":[]},{"n":105,"kind":"单项选择题","answer":"C","stem":"中国黄(渤)海候鸟栖息地(第一期)位于江苏省( )。","options":{"A":"南通市","B":"连云港市","C":"盐城市","D":"扬州市"},"explanation":"中国黄(渤)海候鸟栖息地(第一期)位于江苏省盐城市,是濒危物种最多、受威胁程度\n\n最高的东亚—澳大利西亚候鸟迁徙路线上的关键枢纽。","clips":[]},{"n":106,"kind":"单项选择题","answer":"D","stem":"天津\"津门三绝\"不包括( )。","options":{"A":"狗不理包子","B":"十八街麻花","C":"耳朵眼炸糕","D":"杨柳青年画"},"explanation":"津门三绝是狗不理包子、十八街麻花、耳朵眼炸糕;杨柳青年画是天津特色民间艺术,\n\n但不属于\"津门三绝\"。","clips":[]},{"n":107,"kind":"单项选择题","answer":"B","stem":"中国持续最久、规模最大的民俗灯会是( )。","options":{"A":"自贡灯会","B":"南京秦淮灯会","C":"豫园灯会","D":"哈尔滨冰灯"},"explanation":"南京秦淮灯会始于南朝,盛于明清,是中国持续最久、规模最大的民俗灯会。 夫子庙\n\n—秦淮风光带是国家 5A 级旅游景区。","clips":[]},{"n":108,"kind":"单项选择题","answer":"C","stem":"国家速滑馆是世界上第一座采用( )制冰的大道速滑馆，碳排放趋近于零。","options":{"A":"液氨制冷系统","B":"氟利昂循环系统","C":"二氧化碳跨临界直冷系统","D":"干冰降温系统"},"explanation":"国家速滑馆是世界上第一座采用二氧化碳跨临界直冷系统制冰的大道速滑馆,碳排放\n\n趋近于零,拥有亚洲最大的全冰面设计。","clips":[]},{"n":109,"kind":"单项选择题","answer":"A","stem":"别称\"鹏城\"、中国第一个全部城镇化的城市是( )。","options":{"A":"深圳","B":"广州","C":"珠海","D":"东莞"},"explanation":"深圳简称\"深\",别称\"鹏城\",1979 年成立深圳市,1980 年成为中国第一个经济特区,是\n\n中国第一个全部城镇化的城市;深圳电子信息制造业规模已占全国规模的 1/6。","clips":[]},{"n":110,"kind":"单项选择题","answer":"B","stem":"因建筑时间最久远、保存最完整而被誉为\"天下第一庙\"的是( )。","options":{"A":"孔府","B":"孔庙","C":"孔林","D":"岱庙"},"explanation":"孔庙以\"建筑时间最久远、保存最完整\"被誉为\"天下第一庙\";孔府号称\"天下第一家\";\n\n孔林是世界上规模最大、延续时间最久、墓葬最多、保存最完整的家族古墓群。","clips":[]},{"n":111,"kind":"单项选择题","answer":"C","stem":"吉林省当之无愧的第一支柱产业是( )。","options":{"A":"石油化工","B":"医药健康","C":"现代汽车及零部件产业","D":"农产品加工"},"explanation":"吉林省是全国汽车工业六大产业集聚区之一,汽车工业增加值占全省工业总量的 1/4\n\n以上,是当之无愧的第一支柱产业。长春市素有\"北国春城\"\"东方底特律\"的美誉。","clips":[]},{"n":112,"kind":"单项选择题","answer":"D","stem":"浙江丽水景宁畲族自治县是全国唯一的畲族自治县，畲民自称\"山哈\"，意为( )。","options":{"A":"\"山中凤凰\"","B":"\"山地之王\"","C":"\"大树之子\"","D":"\"山里的客人\""},"explanation":"畲民自称\"山哈\",意为山里的客人。《高皇歌》是一部反映畲族祖先英雄事迹的民族\n\n史诗。","clips":[]},{"n":113,"kind":"单项选择题","answer":"B","stem":"下列哪项是安徽最高山峰( )。","options":{"A":"四川贡嘎山","B":"黄山莲花峰","C":"广西猫儿山","D":"山东泰山"},"explanation":"安徽最高山峰为黄山莲花峰,海拔 1864 米。贡嘎山、猫儿山、泰山均为我国著名高峰,\n\n易误选。A 项贡嘎山为四川最高峰,C 项猫儿山为华南第一高峰(广西),D 项泰山位于山东,均\n\n非安徽最高山峰。","clips":[]},{"n":114,"kind":"单项选择题","answer":"C","stem":"素有\"北国江城\"\"雾凇之都滑雪天堂\"美誉的是( )。","options":{"A":"长春市","B":"哈尔滨市","C":"吉林市","D":"沈阳市"},"explanation":"吉林市是吉林省第二大城市、全国唯一与省同名的城市,素以\"北国江城\"而闻名,有\"\n\n雾凇之都滑雪天堂\"的美誉,拥有以雾凇岛为核心的\"九大雾凇观赏带\"。A 项长春市素有\"北\n\n国春城\"\"东方底特律\"之誉,B 项哈尔滨市素有\"冰城\"之称,D 项沈阳市为辽宁省会,素以\"北\n\n国江城\"闻名的是吉林市。","clips":[]},{"n":115,"kind":"单项选择题","answer":"A","stem":"北京最大的过境河流，历史上曾有\"小黄河\"\"无定河\"之称的是( )。","options":{"A":"永定河","B":"潮白河","C":"北运河","D":"大清河"},"explanation":"永定河是北京最大的过境河流,历史上曾有\"小黄河\"\"无定河\"之称。B 项潮白河、C\n\n项北运河、D 项大清河均为北京五大水系河流,但北京最大的过境河流是永定河。","clips":[]},{"n":116,"kind":"单项选择题","answer":"B","stem":"被誉为\"中国曲艺史活化石\"、中国规模最大的露天曲艺集会是( )。","options":{"A":"天津天后宫庙会","B":"宝丰马街书会","C":"吴桥杂技节","D":"开封菊花文化节"},"explanation":"宝丰马街书会是中国规模最大的露天曲艺集会,被誉为\"中国曲艺史活化石\"。驻马店\n\n确山打铁花素有\"民间焰火之最\"的美誉。","clips":[]},{"n":117,"kind":"单项选择题","answer":"C","stem":"国内最古老的木结构楼阁是( )。","options":{"A":"晋祠圣母殿","B":"应县木塔","C":"独乐寺观音阁","D":"悬空寺"},"explanation":"天津独乐寺有国内最古老的木结构楼阁——观音阁;还有现存最早的庑殿顶山门、国\n\n内现存规模最大的乾隆御笔碑刻和辽代白塔等。","clips":[]},{"n":118,"kind":"单项选择题","answer":"D","stem":"中国八大古都之一、史谓\"天地之中\"的河南城市是( )。","options":{"A":"洛阳","B":"开封","C":"安阳","D":"郑州"},"explanation":"郑州是中国八大古都之一,史谓\"天地之中\",别称商都、绿城;《只有河南·戏剧幻城》、\n\n建业电影小镇等新晋文旅地标新颖出圈。A 项洛阳为十三朝古都,B 项开封为八朝古都,C 项\n\n安阳为殷墟所在地、中国八大古都之一,但史谓\"天地之中\"的是郑州。","clips":[]},{"n":119,"kind":"单项选择题","answer":"A","stem":"代表广西文化艺术最高水平、享誉国内外的民间歌舞剧是( )。","options":{"A":"《刘三姐》","B":"《印象·刘三姐》","C":"《八桂大歌》","D":"《壮锦》"},"explanation":"代表广西文化艺术最高水平的民间歌舞剧《刘三姐》享誉国内外。《印象·刘三姐》\n\n是大型山水实景演出,注意区分。B 项《印象·刘三姐》是大型山水实景演出,不是民间歌舞\n\n剧,易误选。","clips":[]},{"n":120,"kind":"单项选择题","answer":"C","stem":"中国第一、世界第三高楼是( )。","options":{"A":"东方明珠广播电视塔","B":"环球金融中心","C":"上海中心大厦","D":"金茂大厦"},"explanation":"上海中心大厦是中国第一、世界第三高楼,高 623 米,共 127 层,拥有世界最快的电梯\n\n之一,速度可达 18 米/秒。A 项东方明珠高 468 米,易误选。","clips":[]},{"n":121,"kind":"单项选择题","answer":"D","stem":"被誉为\"世界稻源\"和\"远古中华第一村\"的是( )。","options":{"A":"跨湖桥遗址","B":"河姆渡遗址","C":"良渚遗址","D":"上山遗址"},"explanation":"上山遗址被誉为\"世界稻源\"和\"远古中华第一村\",是中国最早的稻作农业和村落形态\n\n遗址。B 项河姆渡文化反映了母系氏族社会的繁荣,C 项良渚古城遗址被认为是 5000 年前的\n\n区域性权力中心,易误选。","clips":[]},{"n":122,"kind":"单项选择题","answer":"A","stem":"我国长江中游地区发现的最早最具代表性的新石器时代大型聚落遗址是( )。","options":{"A":"屈家岭文化遗址","B":"河姆渡遗址","C":"半坡遗址","D":"三星堆遗址"},"explanation":"屈家岭文化遗址距今 4500~5300 年,是我国长江中游地区发现的最早最具代表性的新\n\n石器时代大型聚落遗址,是楚文化发展的基础,是荆楚文明高度发展之源。B 项河姆渡遗址位\n\n于浙江,C 项半坡遗址位于陕西西安,D 项三星堆遗址位于四川,均不在长江中游,均易误选。","clips":[]},{"n":123,"kind":"单项选择题","answer":"C","stem":"被誉为\"中华第一龙\"的红山文化\"玉龙\"，出土于内蒙古( )。","options":{"A":"呼和浩特","B":"包头","C":"赤峰","D":"通辽"},"explanation":"红山文化出土的\"玉龙\"是中国现今发现较早期的龙的形象之一,被誉为\"中华第一龙\"。\n\n赤峰也因此被称作\"玉龙的故乡\"。红山文化距今 6500~5000 年,因发现于赤峰市红山而得名。\n\nA 项呼和浩特、B 项包头、D 项通辽均为内蒙古城市,但红山文化因发现于赤峰市红山而得名。","clips":[]},{"n":124,"kind":"单项选择题","answer":"A","stem":"土家族村寨每年最隆重的集体祭祀是( )。","options":{"A":"祭土王","B":"祭祖先","C":"祭山神","D":"祭灶神"},"explanation":"土家人尊奉祖先,崇拜鬼神,相信兆头,敬奉土王神,\"祭土王\"是土家族村寨每年最隆重\n\n的集体祭祀。","clips":[]},{"n":125,"kind":"单项选择题","answer":"B","stem":"江西古有\"吴头楚尾，粤户闽庭\"之称，其别称是( )。","options":{"A":"\"江右大地\"","B":"\"赣鄱大地\"","C":"\"豫章故郡\"","D":"\"江南西府\""},"explanation":"江西因唐玄宗设江南西道而得省名,又因赣江而简称\"赣\",别称\"赣鄱大地\"。江西作为\n\n明确的行政区域建制始于汉高祖初年(约前 202 年),时设豫章郡。","clips":[]},{"n":126,"kind":"单项选择题","answer":"C","stem":"中国最大的古代文化艺术博物馆是( )，其文物收藏总数超过 186 万件。","options":{"A":"国家博物馆","B":"首都博物馆","C":"故宫博物院","D":"中国国家图书馆"},"explanation":"故宫博物院是中国最大的古代文化艺术博物馆,其文物收藏极其丰富,总数超过 186\n\n万件。北京故宫是中国明、清两代的皇家宫殿,旧称紫禁城,位于北京中轴线的中心。","clips":[]},{"n":127,"kind":"单项选择题","answer":"D","stem":"世界上最大的稀土矿山——白云鄂博矿山位于内蒙古( )。","options":{"A":"赤峰市","B":"鄂尔多斯市","C":"通辽市","D":"包头市"},"explanation":"包头市作为\"世界稀土之都\",其白云鄂博矿山是世界上最大的稀土矿山。A 项赤峰市\n\n出产巴林石,B 项鄂尔多斯市煤炭资源丰富,均非\"世界稀土之都\"。","clips":[]},{"n":128,"kind":"单项选择题","answer":"A","stem":"潍坊风筝主要有 3 种基本造型，其中以( )最突出。","options":{"A":"龙头蜈蚣","B":"沙燕","C":"蝴蝶","D":"鹰"},"explanation":"潍坊风筝主要有串、硬翅和筒形 3 种基本造型,其中以龙头蜈蚣最突出,赢得了\"风筝\n\n艺术,潍坊第一\"的美誉,潍坊已成为国际风筝节的固定举办地。","clips":[]},{"n":129,"kind":"单项选择题","answer":"B","stem":"山海关是明长城唯一与( )相交会的地方。","options":{"A":"黄河","B":"渤海","C":"长江","D":"燕山"},"explanation":"山海关建于明长城东端,是明长城唯一与大海相交会的地方,全国唯一同时汇聚山地、\n\n平原、滨海长城形态的关城,被誉为\"天然的长城博物馆\"。","clips":[]},{"n":130,"kind":"单项选择题","answer":"C","stem":"色泽乌润、汤色红亮、芳香浓郁，产于安徽祁门的是( )。","options":{"A":"黄山毛峰","B":"太平猴魁","C":"祁门红茶","D":"六安瓜片"},"explanation":"祁门红茶色泽乌润,汤色红亮,芳香浓郁。黄山毛峰产自黄山高海拔地区,外形细秀;\n\n太平猴魁以挺秀外形著称;六安瓜片以清香口感著称,均为中国著名高品质茶叶。\n\n三、多选题","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABC","stem":"中国人民解放军战略决战的“三大战役”是( )。","options":{"A":"辽沈战役","B":"淮海战役","C":"平津战役","D":"渡江战役","E":"济南战役"},"explanation":"1948 年 9 月 12 日至 1949 年 1 月 31 日,中国人民解放军同国民党军进行战略决战,先\n\n后发动了辽沈战役、淮海战役和平津战役, 史称“三大战役”。D 项渡江战役、E 项济南战\n\n役不属于“三大战役”。","clips":[]},{"n":132,"kind":"多项选择题","answer":"AB","stem":"再加工茶类有( )。","options":{"A":"紧压茶","B":"花茶","C":"绿茶","D":"红茶","E":"乌龙茶"},"explanation":"再加工茶类有压制成型的紧压茶和鲜花窨制的花茶。紧压茶主要以黑茶或红茶或绿茶\n\n为原料,也称边销茶。花茶出现于宋代,以精制后的茶叶和鲜花为原料,经过窨花工艺制成。C\n\n项绿茶、D 项红茶、E 项乌龙茶(青茶)均属按初加工方式划分的六大类毛茶,不是再加工茶类。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ABCD","stem":"文房四宝之首包括( )。","options":{"A":"湖笔","B":"徽墨","C":"宣纸","D":"端砚","E":"歙砚"},"explanation":"笔、墨、纸、砚素称文房四宝,湖笔、徽墨、宣纸、端砚,被称为文房四宝之首。E 项\n\n歙砚与端砚、洮河砚、澄泥砚并称中国四大名砚,但不是“文房四宝之首”。","clips":[]},{"n":134,"kind":"多项选择题","answer":"AB","stem":"我国可以欣赏到极光景观的地区有( )。","options":{"A":"黑龙江漠河","B":"新疆阿勒泰","C":"海南三亚","D":"西藏拉萨","E":"内蒙古呼伦贝尔"},"explanation":"我国黑龙江漠河和新疆阿勒泰都可以欣赏到极光景观。极光出现在高纬度地区的夜\n\n空,C 项海南三亚、D 项西藏拉萨、E 项内蒙古呼伦贝尔纬度较低,均无法观赏极光。","clips":[]},{"n":135,"kind":"多项选择题","answer":"AB","stem":"我国喀斯特地貌分布最集中的地区是( )。","options":{"A":"广西","B":"云贵高原","C":"青藏高原","D":"黄土高原","E":"内蒙古高原"},"explanation":"中国是世界上喀斯特地貌分布最广泛、发育最充分、类型最齐全的国家,中国南方喀\n\n斯特(一期、二期)被列入世界自然遗产名录,以广西、云贵高原最为集中。C 项青藏高原、D\n\n项黄土高原、E 项内蒙古高原均非我国喀斯特地貌集中分布区。","clips":[]},{"n":136,"kind":"多项选择题","answer":"AB","stem":"金元以来，全国道教形成的两大教派是( )。","options":{"A":"全真道","B":"正一道","C":"太平道","D":"五斗米道","E":"南天师道"},"explanation":"金元以来至今,全国道教形成全真道与正一道两大教派。全真道在修行方法上重内丹\n\n修炼、不尚符箓;正一道集符箓派之大成,以行符箓为主要特征。 C 项太平道、D 项五斗米道\n\n均为早期的道教。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ABC","stem":"廊按结构形式可分为( )。","options":{"A":"双面空廊","B":"单面空廊","C":"复廊","D":"爬山廊","E":"水廊"},"explanation":"廊按结构形式可分为双面空廊、单面空廊、复廊等。按廊的总体造型及其与地形、环\n\n境的关系可分为直廊、曲廊、爬山廊、水廊、桥廊等。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABC","stem":"古代“为尊者讳”，下列属于避讳的例子有( )。","options":{"A":"汉高祖刘邦时，凡“邦”字一律改称“国”","B":"唐太宗李世民时，观世音被迫称为“观音”","C":"康熙名玄烨，玄武门只能叫“元武门”或“神武门”","D":"避秦始皇嬴政讳，改“正月”为“端月”","E":"避汉文帝刘恒讳，改“姮娥”为“嫦娥”"},"explanation":"皇帝或孔子等圣人的名字,常人更不能用,要“避讳”,一般是“改字”或“缺笔”。\n\n教材所载避讳例子即 ABC 三项:汉高祖刘邦时,凡“邦”字一律改称“国”;唐太宗李世民时,\n\n观世音也被迫称为“观音”;康熙名玄烨,玄武门都只能叫“元武门”或“神武门”。DE 两\n\n项非教材所载避讳例证。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABCD","stem":"下列澳大利亚城市与其称号对应正确的有( )。","options":{"A":"悉尼——“南半球的纽约”","B":"墨尔本——“澳大利亚的伦敦”","C":"堪培拉——“大洋洲的花园城市”","D":"悉尼是澳大利亚华侨和华人聚居最多的地区","E":"堪培拉是澳大利亚最大的城市"},"explanation":"悉尼是澳大利亚第一大城市,有“南半球的纽约”之称,悉尼是澳大利亚华侨和华人聚\n\n居最多的地区。墨尔本是澳大利亚最具有欧洲韵味的城市,被称为“澳大利亚的伦敦”。堪\n\n培拉是纯粹的政治中心,被誉为“大洋洲的花园城市”。E 项错误——澳大利亚最大的城市\n\n是悉尼,不是堪培拉。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ABCD","stem":"被誉为我国传统“四大名绣”的是( )。","options":{"A":"苏绣","B":"湘绣","C":"粤绣","D":"蜀绣","E":"京绣"},"explanation":"苏州苏绣、湖南湘绣、广东粤绣、四川蜀绣被誉为我国传统四大名绣。苏绣、湘绣、\n\n粤绣、蜀绣并称四大名绣。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ABCD","stem":"下列关于唐代诗歌的表述，正确的有( )。","options":{"A":"李白世人称其为“诗仙”","B":"杜甫有“诗圣”之称，其诗歌深有“诗史”之誉","C":"李白和杜甫合称“李杜”，被誉为诗史上的“双子星座”","D":"晚唐杜牧和李商隐合称“小李杜”","E":"王维被世人称为“诗佛”，是唐代最杰出的浪漫主义诗人"},"explanation":"李白和杜甫被誉为诗史上的“双子星座”,合称“李杜”。李白诗歌雄奇峭丽、豪放\n\n飘逸,世人称其为“诗仙”;杜甫有“诗圣”之称,其诗歌深有“诗史”之誉。晚唐代表诗人\n\n是杜牧和李商隐。杜牧擅长七绝,李商隐工于七律,后世将二人合称为“小李杜”。E 项错误\n\n——唐代最杰出的浪漫主义诗人是李白,而非王维。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABC","stem":"《诗经》的组成部分包括( )。","options":{"A":"风","B":"雅","C":"颂","D":"赋","E":"比"},"explanation":"我国第一部诗歌总集《诗经》产生于春秋时期,《诗经》按音乐的特点分为风、雅、\n\n颂三部分。 《诗经》的表现手法归纳为赋、比、兴。D 项赋、E 项比是《诗经》的表现手法,\n\n不是其组成部分。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABCD","stem":"五四运动孕育的伟大五四精神的主要内容包括( )。","options":{"A":"爱国","B":"进步","C":"民主","D":"科学","E":"自由"},"explanation":"五四运动孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神,其核心是爱\n\n国主义精神。五四运动是近代中国革命史上具有划时代意义的事件,标志着新民主主义革命\n\n的伟大开端。E 项“自由”不属于五四精神的主要内容。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABCDE","stem":"下列关于各地剪纸特色的表述，正确的有( )。","options":{"A":"蔚县剪纸：不是“剪”而是“刻”","B":"扬州剪纸：与国画“白描”手法异曲同工","C":"山西剪纸：粗犷、雄壮","D":"陕西剪纸：古拙、粗犷的造型","E":"佛山剪纸：金碧辉煌的艺术风格"},"explanation":"蔚县剪纸不是“剪”，而是“刻”。\n\n扬州剪纸作品一般以素色为主，其表现手法和中国画“白描”手法有异曲同工之妙。\n\n山西剪纸风格粗犷、雄壮，陕西剪纸造型古拙、粗犷，佛山剪纸风格金碧辉煌，使用铜箔、\n\n银箔。\n\n2009 年，中国剪纸入选《联合国教科文组织人类非物质文化遗产代表作名录》。","clips":[]},{"n":145,"kind":"多项选择题","answer":"ABCD","stem":"中医通过“四诊”的方法辨证施治，四诊指( )。","options":{"A":"望","B":"闻","C":"问","D":"切","E":"灸"},"explanation":"中医以阴阳五行作为理论基础，将人体看成气、形、神的统一体，通过望、闻、问、\n\n切“四诊”的方法辨证施治。 E 项“灸”不属于“四诊”。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABC","stem":"我国现存最早的木结构建筑实物包括( )。","options":{"A":"五台县南禅寺大殿","B":"佛光寺东大殿","C":"芮城县广仁王庙正殿","D":"应县木塔","E":"晋祠圣母殿"},"explanation":"我国现存最早的木结构建筑实物：山西省唐代所建的五台县南禅寺大殿、佛光寺东大\n\n殿和芮城县广仁王庙正殿。\n\nD 项应县木塔是我国现存最古、最高的木结构大塔，但建于辽代，晚于上述唐代建筑；E 项\n\n晋祠圣母殿为宋代建筑。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ABCDE","stem":"我国古代著名的数学成就有( )。","options":{"A":"西汉《周髀算经》提出勾股定理","B":"东汉《九章算术》提出负数概念及正负数运算法则","C":"魏晋刘徽注《九章算术》","D":"南朝祖冲之将圆周率精确到小数点后第 7 位","E":"宋元时期珠算开始广泛使用"},"explanation":"西汉《周髀算经》作为我国最早的数学著作，已经涉及复杂分数运算和开平方的方法，\n\n并提出了勾股定理。\n\n东汉时期的《九章算术》，提出了负数概念及正负数运算法则，标志着我国古代数学体系基\n\n本形成。\n\n魏晋时期数学家刘徽注《九章算术》，解决了求圆的面积和圆柱、圆锥体积的方法。\n\n南朝祖冲之在世界上首次将圆周率精确到小数点后第 7 位。\n\n宋元时期，珠算开始在中国广泛使用。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABCD","stem":"北京简称\"京\"，是全国的( )。","options":{"A":"政治中心","B":"文化中心","C":"国际交往中心","D":"科技创新中心","E":"交通中心"},"explanation":"北京简称\"京\"，是首都，全国的政治中心、文化中心、国际交往中心、科技创新中心，\n\n是世界著名古都和现代化国际城市。 E 项\"交通中心\"不属于北京作为全国中心城市的定位，\n\n故不选。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABCD","stem":"下列民族中，属于云南特有民族的有( )。","options":{"A":"哈尼族、白族","B":"傣族","C":"傈僳族、纳西族","D":"独龙族","E":"藏族"},"explanation":"云南 15 个特有民族包括哈尼族、白族、傣族、傈僳族、纳西族、独龙族等。\n\nE 项藏族不是云南特有民族，故不选。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABC","stem":"\"三地三摇篮\"中的\"三摇篮\"是指( )。","options":{"A":"新中国汽车工业的摇篮","B":"新中国电影事业的摇篮","C":"中国人民航空事业的摇篮","D":"中国近代工业的摇篮","E":"中国航天事业的摇篮"},"explanation":"\"三摇篮\"即新中国汽车工业的摇篮、新中国电影事业的摇篮、中国人民航空事业的摇\n\n篮。\n\n长春电影制片厂是中国电影的摇篮。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABC","stem":"并称为\"山东三大秧歌\"的有( )。","options":{"A":"鼓子秧歌","B":"胶州秧歌","C":"海阳秧歌","D":"地秧歌","E":"东北大秧歌"},"explanation":"鼓子秧歌、胶州秧歌、海阳秧歌并称为\"山东三大秧歌\"。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABCD","stem":"下列关于唐宋时期四川的说法，正确的有( )。","options":{"A":"唐代四川经济发达，有\"扬一益二\"之称","B":"北宋时在成都产生了世界上最早的纸币——交子","C":"杜甫三分之二的作品创作于巴蜀地区","D":"四川产生了汉赋作家司马相如","E":"交子产生于北宋的洛阳"},"explanation":"唐代四川经济发达，有\"扬一益二\"之称；北宋时在成都产生了世界上最早的纸币——\n\n交子；杜甫三分之二的作品创作于巴蜀地区；四川产生了汉赋作家司马相如。\n\n四川还诞生了唐朝诗人陈子昂、\"诗仙\"李白、北宋文坛巨匠苏洵、苏轼、苏辙等著名文人。\n\nE 错误，交子产生于成都。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ABC","stem":"新疆\"三山夹两盆\"中的\"三山\"是指( )。","options":{"A":"阿尔泰山","B":"天山","C":"昆仑山","D":"祁连山","E":"阿尔金山"},"explanation":"新疆\"三山夹两盆\"，三山指阿尔泰山、天山、昆仑山；两盆指准噶尔盆地和塔里木盆\n\n地。\n\nD 项祁连山、E 项阿尔金山均不属于新疆\"三山夹两盆\"中的\"三山\"，故不选。","clips":[]},{"n":154,"kind":"多项选择题","answer":"AD","stem":"“丝绸之路:长安——天山廊道的路网”由中国与( )跨国申报。","options":{"A":"哈萨克斯坦","B":"乌兹别克斯坦","C":"巴基斯坦","D":"吉尔吉斯斯坦","E":"塔吉克斯坦"},"explanation":"“丝绸之路：长安——天山廊道的路网(跨国遗产)”由河南、陕西、甘肃、新疆联合\n\n申报，中国与哈萨克斯坦、吉尔吉斯斯坦跨国申报。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABCD","stem":"福建是下列( )茶类的发源地。","options":{"A":"乌龙茶","B":"红茶","C":"白茶","D":"茉莉花茶","E":"绿茶"},"explanation":"福建是乌龙茶、红茶、白茶、茉莉花茶的发源地，除绿茶外均是福建首创。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABC","stem":"河北省有三大地貌单元，包括( )。","options":{"A":"坝上高原","B":"燕山和太行山山地","C":"河北平原","D":"内蒙古高原","E":"黄土高原"},"explanation":"河北省有坝上高原、燕山和太行山山地、河北平原三大地貌单元，是全国唯一兼有高\n\n原、山地、丘陵、平原、湖泊和海滨的省份。\n\nD 项内蒙古高原不在河北地貌单元之列。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABCD","stem":"浙江四大名湖包括( )。","options":{"A":"杭州西湖","B":"绍兴东湖","C":"嘉兴南湖","D":"宁波东钱湖","E":"千岛湖"},"explanation":"浙江有杭州西湖、绍兴东湖、嘉兴南湖、宁波东钱湖四大名湖。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABCDE","stem":"陕西著名的民间工艺品有( )等。","options":{"A":"蓝田玉雕、陕北剪纸","B":"凤翔泥塑","C":"秦腔脸谱","D":"户县农民画","E":"榆林柳编"},"explanation":"陕西著名的民间工艺品还有彩绘泥塑、木版年画、扎染、挂线木偶、戏人泥拓片、仿\n\n秦俑、仿唐三彩、仿铜车马等。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABCD","stem":"黑龙江滑雪资源主要集中在四大区域，包括( )。","options":{"A":"哈尔滨市","B":"伊春市","C":"牡丹江市","D":"大兴安岭地区","E":"黑河市"},"explanation":"黑龙江滑雪资源主要集中在哈尔滨市、伊春市、牡丹江市和大兴安岭地区四大区域。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABCD","stem":"下列属于贵州少数民族著名节日的有( )。","options":{"A":"苗族\"姊妹节\"","B":"侗族\"歌酒节\"","C":"布依族\"查白歌节\"","D":"彝族\"火把节\"","E":"壮族\"三月三\""},"explanation":"此外还有苗族\"四月八\"\"龙舟节\"\"芦笙节\"，水族\"端节\"\"卯节\"，土家族和仡佬族的\"\n\n吃新节\"等。\n\nE 项壮族\"三月三\"是广西壮族盛大的传统歌节，不属于贵州少数民族著名节日，故不选。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCD","stem":"江西最具代表性的名茶\"四绿一红\"包括( )。","options":{"A":"庐山云雾茶","B":"狗牯脑茶","C":"婺源绿茶、浮梁绿茶","D":"修水宁红茶","E":"铁观音"},"explanation":"\"四绿一红\"即庐山云雾茶、狗牯脑茶、婺源绿茶、浮梁绿茶和修水宁红茶。\n\nE 项铁观音是福建安溪名茶，易误选。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABC","stem":"下列关于天津港的说法，正确的有( )。","options":{"A":"世界等级最高的人工深水港","B":"中国最大的人工深水港","C":"吞吐量居世界第四","D":"吞吐量居世界第一","E":"我国最大的天然良港是天津港"},"explanation":"天津港是世界等级最高、中国最大的人工深水港，目前已是吞吐量世界第四的综合性\n\n港口。 D 项错误；E 项错误，我国著名的天然良港是秦皇岛港(河北)。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABE","stem":"粤剧被列为联合国教科文组织人类非物质文化遗产代表作名录，是由( )联合申报。","options":{"A":"广东","B":"香港","C":"台湾","D":"浙江","E":"澳门"},"explanation":"2009 年 10 月 2 日，由广东、香港和澳门联合申报，粤剧被列为联合国教科文组织人\n\n类非物质文化遗产代表作名录。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ABCD","stem":"香港的四大\"支柱行业\"包括( )。","options":{"A":"金融服务业","B":"旅游业","C":"贸易及物流业","D":"专业及工商业支援服务业","E":"房地产业"},"explanation":"香港是重要的国际金融、贸易、航运中心和国际创新科技中心，也是全球最自由经济\n\n体和最具竞争力的城市之一。\n\nE 项房地产业不属于香港四大\"支柱行业\"，故不选。","clips":[]},{"n":165,"kind":"多项选择题","answer":"BC","stem":"下列属于广东世界遗产的有( )。","options":{"A":"龙门石窟","B":"开平碉楼与古村落","C":"中国丹霞(广东丹霞山)","D":"鼓浪屿","E":"左江花山岩画"},"explanation":"广东文化遗产 1 项：开平碉楼与古村落；自然遗产 1 项：中国丹霞(广东丹霞山)。\n\n龙门石窟位于河南，鼓浪屿位于福建，左江花山岩画位于广西。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper1-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
