ontenteditable]:focus{outline:2px solid #90a7a4;outline-offset:5px}.memory-card,.heading,.original,.question,.answer,.note{break-inside:avoid;page-break-inside:avoid}@media(max-width:600px){body{padding:18px 12px 32px}.sheet{padding:28px 23px}.heading{gap:10px;flex-wrap:wrap}h1{font-size:23px}.question{font-size:17px}.answer{font-size:18px}.memory{gap:7px}.memory-card{padding:15px 9px}.keyword{font-size:15px}.status{margin-left:0;width:100%}}@page{size:A4;margin:18mm 17mm}@media print{:root,html,body{background:#fff;margin:0;padding:0}.toolbar,.help{display:none!important}.sheet{max-width:none;width:100%;padding:0;border:0;box-shadow:none;border-radius:0;break-inside:avoid;page-break-inside:avoid}h1{font-size:22pt}.original{font-size:10pt}.question{font-size:13pt}.answer{font-size:14pt}.keyword{font-size:13pt}.meaning{font-size:10pt}.note{font-size:9pt}.memory{grid-template-columns:repeat(3,minmax(0,1fr))}.memory-card,.tag{print-color-adjust:exact;-webkit-print-color-adjust:exact}[contenteditable]{outline:none!important}.sheet.oversize{break-inside:auto;page-break-inside:auto}}

<script>const cards=[{"group": 0, "n": 1, "q": "导游服务能力中的技术能力要求有哪些?", "match": null, "answer": "语言能力；接待操作能力；信息技术应用能力。", "answer_en": "A tour guide needs three types of technical skills: language skills, tour reception and operation skills, and information technology skills."}, {"group": 0, "n": 2, "q": "导游的语言能力要求有哪些?", "match": null, "answer": "(1)应具备良好的语言表达能力，能熟练运用相应语种提供导游服务；\n(2)应有使用礼貌语言的意识，能合理使用体态语言；\n(3)能熟练掌握讲解语言的技巧，做到正确、清楚、生动、灵活。", "answer_en": "First, a tour guide should have good communication skills and be able to provide services fluently in the required language.\nSecond, the guide should use polite language and appropriate body language.\nThird, the guide should master guiding and interpretation skills, and give accurate, clear, lively and flexible explanations."}, {"group": 0, "n": 3, "q": "导游的接待操作能力要求有哪些?", "match": null, "answer": "(1)具备独立工作的能力，能代表旅行社履行合同义务，完成旅游接待任务；\n(2)具备人际交往能力，身心健康，能与旅游者相处融洽，善于协调、处理与相关接待者、旅游者之间的关系；\n(3)具备引导旅游者文明旅游的能力，做到引导旅游者节约资源，保护生态环境；\n(4)具备旅游突发事件防范和应急处置能力，做到按要求进行安全提示和监督。", "answer_en": "First, the guide should be able to work independently, fulfill the travel agency's contractual obligations and carry out the tour plan.\nSecond, the guide should be physically and mentally healthy, get along well with tourists and coordinate with all service providers.\nThird, the guide should encourage responsible tourism, saving resources and protecting the environment.\nFinally, the guide should be able to prevent and handle emergencies, give safety reminders and supervise safety as required."}, {"group": 0, "n": 4, "q": "导游的信息技术应用能力要求有哪些?", "match": null, "answer": "(1)应熟练掌握移动通信终端与导游服务相关应用软件的使用方法，包括社交、通信、移动办公等软件；\n(2)能够协助旅游者通过移动互联网进行产品预订、定位导航、信息咨询、服务评价等活动。", "answer_en": "First, the guide should be familiar with mobile devices and apps used for tour services, including social media, communication and mobile office apps.\nSecond, the guide should help tourists use the mobile internet to make bookings, find locations, get information and leave service reviews."}, {"group": 0, "n": 5, "q": "导游应掌握哪些业务知识?", "match": null, "answer": "(1)掌握旅游客源地和旅游目的地的相关知识，包括法律法规常识、时事政治、经济、社会状况、历史、地理、文化和民族民俗知识以及心理学、美学知识；\n(2)掌握旅行常识，包括旅行证件知识、领事保护知识、客货运知识、机票政策、海关及移民管理机关规定和必备的应急医疗常识等；\n(3)还应了解创意策划知识，包括旅游产品策划、线路设计方面的专业知识。", "answer_en": "First, the guide should know about the tourists' places of origin and the destinations, including their laws, current affairs, economy, society, history, geography, culture and folk customs, as well as psychology and aesthetics.\nSecond, the guide should have practical travel knowledge, such as travel documents, consular protection, passenger and goods transport, airline ticket policies, customs and immigration rules, and basic first aid.\nThird, the guide should know about creative planning, including tourism product planning and itinerary design."}, {"group": 0, "n": 6, "q": "导游服务接待的准备工作包括哪些?", "match": {"rank": "部分对应", "en": "What articles should the local guide get ready for conducting a tourist group?", "zh": "地陪上团前应准备好哪些物品？", "source": "广东·服务规范 Q32 · 第 35 页", "answer_en": "Before setting out to meet the group, the local guide should get the following things ready for use in conducting the group: adequate copies of tourist maps or brochures and admission tickets according to the number of people in the group, vouchers or cash for payments for meals or other expenses, tour plan of the group, tour guide’s identity certificate, sign board and flag of his travel service and so on.", "answer_zh": "上团前，按照人数领取导游图、门票、用餐结算单和费用，带好接待计划、导游证 IC 卡、本社社牌、导游旗、接站牌等必备物品。"}, "answer": "熟悉接待计划；做好物品与资料的准备；做好相关知识准备；做好与相关接待者的联络沟通准备。", "answer_en": "The guide should make four preparations: familiarize themselves with the tour plan, prepare the necessary materials and supplies, review relevant knowledge, and contact and coordinate with the service providers."}, {"group": 0, "n": 7, "q": "接待旅游者之前，全陪导游应做好哪些联络沟通工作?", "match": null, "answer": "(1)与地接社联系，核对旅游接待计划，了解接待工作安排情况；\n(2)与旅游者联系，取得联系方式，提醒出发时间、地点等旅游行程注意事项；\n(3)与旅游客车司机联系，确定会面时间和车辆停放位置。", "answer_en": "First, contact the local travel agency to check the tour plan and confirm the service arrangements.\nSecond, contact the tourists, obtain their contact details, and remind them of the departure time, meeting place and other important information.\nThird, contact the driver to confirm the meeting time and where the coach will be parked."}, {"group": 0, "n": 8, "q": "接待旅游者之前，地陪导游应做好哪些联络沟通工作?", "match": {"rank": "部分对应", "en": "What must the local guide do before setting out to meet the tourist group in order that the tour bus for the group may be properly arranged?", "zh": "地陪在接团前应如何落实旅游车辆？", "source": "广东·服务规范 Q31 · 第 34 页", "answer_en": "In order to make sure that the tour bus for the group is properly arranged, the local guide must:\n(1) Call the tour bus company to inquire about the model and number of the bus and the name and telephone number of the driver, and then …\n(2) Get in touch with the driver to decide when and where they shall meet and, at the same time, tell the driver the itinerary and sight-seeing program of the group.", "answer_zh": "（1）与车队联系，确认车型、车牌号和司机姓名及电话；\n（2）与司机确定接头地点并告知活动日程和具体时间安排。"}, "answer": "(1)落实旅游者的交通、食宿、票务、活动等事宜；\n(2)确认旅游者所乘交通工具及其确切抵达时间；\n(3)与旅游客车司机联系，确定会面时间和车辆停放位置。", "answer_en": "First, confirm the arrangements for transportation, accommodation, meals, tickets and activities.\nSecond, confirm the tourists' means of transport and exact arrival time.\nThird, contact the driver to confirm the meeting time and where the coach will be parked."}, {"group": 0, "n": 9, "q": "导游在出发与迎接旅游者时应做好哪些工作?", "match": null, "answer": "(1)携带电子导游证，佩戴导游身份标识，开启导游执业相关应用软件；\n(2)提前到达旅游者出发、迎接地点，持旅行社标识迎候，致欢迎词，介绍本次旅游行程，提示文明旅游等注意事项。", "answer_en": "First, carry the electronic tour guide license, wear the guide identification badge, and open the required tour guide apps.\nSecond, arrive at the departure or meeting point ahead of time and greet the tourists with a travel agency sign.\nGive a welcome speech, introduce the itinerary, and remind the tourists to travel responsibly and follow other important instructions."}, {"group": 0, "n": 10, "q": "欢迎词一般包括哪些内容?", "match": {"rank": "高度对应", "en": "Try to make a welcome speech to a tourist group in the name of a local guide.", "zh": "试以地陪的身份对旅行团致一段规范的欢迎辞。", "source": "广东·服务规范 Q05 · 第 21 页", "answer_en": "The following points should be included:\n(1) According the tourists a welcome for their visit to your city on behalf of your travel service, the driver and yourself;\n(2) Introducing yourself and the travel service you work for;\n(3) Introducing the driver;\n(4) Expressing your willingness and desire to render good services to the tourists;\n(5) Wishing the tourists a pleasant stay in your city.\nReference Example:\nA Local Guide’s Welcome Speech (For Reference)\nGood morning, ladies and Gentlemen: Welcome to Guangzhou! My name is … Our driver’s name is … I work for Guangzhou China International Travel Service, and we two have the pleasure of being your guides during your stay in Guangzhou (or we are very glad to be with you during your visit to our city). I expect that this is the first trip to Guangzhou for most of you. We’ll do our best to make your stay here enjoyable, restful and comfortable, so please feel free to let us know whatever complaints you may have about our work or the hotel service, or whatever, so we can improve in good time. We look forward to your cooperation. Wish you enjoy your tour in our city and have fun.", "answer_zh": "要求包括以下内容：\n（1）代表所在接待社、司机及本人欢迎客人的光临；\n（2）介绍自己的姓名及所属单位；\n（3）介绍司机；\n（4）表示提供优质服务的诚挚愿望；\n（5）预祝游客旅游愉快。\n参考示例: 地陪欢迎词 (仅供参考)\n女士们,先生们: 早上好! 欢迎来到广州，我的名字是 xxx, 我们的司机的名字是 xxx。我是中国国际旅行社广州分社的导游, 在你们逗留期间我们俩很荣幸做你们的导游(或我们非常高兴在你们访问我们的城市期间能与你们在一起)。我估计这次是你们的大多数人第一次广州到广州来吧。在你们逗留广州期间我们会尽力让你们在这里过得愉快、休闲与舒适。因此如有任何关于我们工作或酒店服务等方面的不满意,请不要介意告诉我们。这样我们便可以及时改进。我们期待着你们的合作。愿你们享受这里的旅游，同时玩得开心。"}, "answer": "(1)代表所在旅行社、本人和司机欢迎旅游者到本地观光游览；\n(2)介绍本人和司机的姓名及所属旅行社；\n(3)表示努力为旅游者提供服务的诚挚愿望和希望得到合作的意愿；\n(4)预祝大家旅游愉快顺利。", "answer_en": "A welcome speech normally includes four parts.\nFirst, welcome the tourists on behalf of the travel agency, the driver and the guide.\nSecond, introduce the guide, the driver and the travel agency.\nThird, express a sincere wish to provide good service and ask for the tourists' cooperation.\nFinally, wish them a pleasant and smooth trip."}, {"group": 0, "n": 11, "q": "全陪导游接到旅游者出发时应做好哪些工作?", "match": null, "answer": "(1)礼貌地清点人数，引导旅游者乘坐约定的交通工具；\n(2)发放本次旅游行程的相关资料和物资等；\n(3)与地陪导游确认迎接旅游者的时间和地点。", "answer_en": "First, count the tourists politely and guide them onto the agreed means of transport.\nSecond, hand out the materials and supplies needed for the trip.\nThird, confirm the meeting time and place with the local guide."}, {"group": 0, "n": 12, "q": "旅游者抵达时，地陪导游应做好哪些工作?", "match": {"rank": "部分对应", "en": "While meeting an inbound group in the airport or train station, how can the local guide make sure that the group he is meeting is the very one he should meet?", "zh": "接待入境团的地陪在机场或车站接团时，应如何确认某一团队是否是自己应接的团？", "source": "广东·服务规范 Q04 · 第 20 页", "answer_en": "The local guide must make certain that:\n(1) The local guide must ask the tourists what country they come from and inquire of them about the names of their tour escort and their national guide, the name of the travel service in their own country and the name of the tour organizer travel service in China.\n(2) If the group has neither escort nor national guide, he must inquire of the tourists their nationality, the name or code of the group, and the number of people and the main itinerary of the group.", "answer_zh": "（1）应问清该团来自哪个国家（地区）、客源地组团社和国内组团社的名称、领队和全陪的姓名等；\n（2）如该团没有领队和全陪，地陪应与该团成员核对团名、团号、国别及游客人数、姓名并核实其主要行程。"}, "answer": "(1)及时与全陪导游或旅游者接洽，确认应接的旅游者，核实人数，提醒旅游者检查并带齐行李；\n(2)引导旅游者前往旅游客车停车地点，在车门旁迎候旅游者；\n(3)开车前礼貌地清点人数，并进行安全提示；\n(4)行车途中，做好途中讲解，内容主要包括本地概况、沿途主要景观、相关注意事项等。", "answer_en": "First, meet the national guide or the tourists, confirm the right group, count the tourists and remind them to collect all their luggage.\nSecond, lead them to the coach and welcome them at the door.\nThird, count the tourists politely and give safety reminders before departure.\nFinally, on the way, introduce the local area, the main sights along the route and other important information."}, {"group": 0, "n": 13, "q": "旅游过程中，乘坐交通工具时，导游应做好哪些工作?", "match": {"rank": "高度对应", "en": "What should the national guides do when the group is traveling long distance (by plane, train or ship)?", "zh": "团队乘坐长途交通工具（机、车、船）时，全陪应做好哪些工作？", "source": "广东·服务规范 Q38 · 第 36 页", "answer_en": "(1) When the group is traveling long distance by plane, train or ship, the national guides must try to seek help from the crews of the plane, the train, and the ship，working together to ensure that the tourists will be taken good care of and will stay safe from danger.\n(2) They should also remind the tourists to watch the safety of their own persons and their personal belongings.\n(3) They must have their meals and recreational activities properly arranged and make sure that they can have a good rest on board.\n(4) Keep safely the baggage checks and other documents such as plane tickets, train tickets and boat tickets, and hand them to the local guide when arriving at the next destination;\n(5) When traveling on train, he should help the tour escort to distribute in advance the compartments and berths to the group members", "answer_zh": "（1）乘飞机（火车、轮船）时，全陪要积极争取民航、铁路、航运部门工作人员的支持，共同做好安全保卫、生活服务工作；\n（2）在运行中，全陪应提醒游客注意人身和物品的安全；\n（3）组织好娱乐活动，安排照顾好游客的饮食和休息；\n（4）保管好行李托运单和飞机、车、船票等单据，抵达下站时将其交予地陪；\n（5）乘火车旅行时，应事先请领队分配好包房、卧铺铺位。"}, "answer": "(1)提醒旅游者乘坐礼仪规范和安全注意事项；\n(2)协助旅游者办妥登机(车、船)票、安检和行李托运等相关手续，提醒旅游者不要携带违禁物品；\n(3)听从乘务人员的安排，协助照顾旅游者的旅途生活，及时提醒旅游者如厕；\n(4)告知旅游者旅游客车的标志、车号、停车地点和开车时间，引导旅游者有序乘坐，提醒旅游者系好安全带；\n(5)在“导游专座”就座；\n(6)旅游者有需要时，提供必要的帮助或协助；\n(7)旅游客车在高速公路或危险路段行驶时，导游不应站立讲解。", "answer_en": "First, remind tourists of proper travel etiquette and safety precautions.\nSecond, help them with tickets, security checks and baggage check-in, and remind them not to carry prohibited items.\nThird, follow the instructions of the crew, look after the tourists and remind them to use the restroom when needed.\nFourth, tell them the coach identification, vehicle number, parking location and departure time. Help them board in order and remind them to fasten their seat belts.\nFifth, sit in the designated guide's seat and offer help when needed.\nFinally, do not stand to give commentary when the coach is on a highway or a dangerous road."}, {"group": 0, "n": 14, "q": "旅游者抵达饭店时，全陪导游应如何协助办理住店手续?", "match": {"rank": "高度对应", "en": "What is the national guide required to do when the group has arrived in the hotel?", "zh": "在旅行团抵达酒店时，全陪有哪些工作要做？", "source": "广东·服务规范 Q24 · 第 30 页", "answer_en": "(1) When the group has arrived in the hotel, the national guide must take an active part in the work of checking in at the hotel.\n(2) While the responsibility of assigning rooms to the group members is usually undertaken by the tour escort, the national guide must keep a rooming list of the group. He should also exchange room numbers with the tour escort so that they may reach each other in case of need.\n(3) When the tourists have got their room numbers, the national guide should show them the way to their rooms.\n(4) If the local guide is not staying in the hotel for the night, the national guide must take full responsibility of taking care of the group.\n(5) In addition, the national guide should note down the telephone number of the hotel reception and must inquire of the local guide about the way of getting in touch with him in case of emergency.", "answer_zh": "（1）积极主动地协助领队办理旅游团的入住手续；\n（2）请领队分配住房，全陪要掌握住房分配名单，并与领队互通房号以便联系；\n（3）热情引导游客进入房间；\n（4）如地陪不住酒店，全陪要负起全责，照顾好旅行团；\n（5）掌握酒店前台的电话号码以及与地陪联系的办法，以备必要时联系。"}, "answer": "全陪导游应提前做好分房方案，旅游者抵达饭店后，全陪导游应当：\n(1)按照分房方案协助旅游者办理入住登记手续；\n(2)掌握地陪导游和旅游者的房间号，并告知自己的房间号。", "answer_en": "First, prepare a rooming list in advance.\nWhen the group arrives, help the tourists check in according to the rooming list.\nThen, obtain the room numbers of the local guide and the tourists, and let them know your own room number."}, {"group": 0, "n": 15, "q": "旅游者抵达饭店时，地陪导游应如何协助办理住店手续?", "match": {"rank": "高度对应", "en": "What should the local guide tell the tourists when the group is going to check in at the hotel?", "zh": "地陪在旅行团入住饭店时，应向游客交代什么？", "source": "广东·服务规范 Q13 · 第 25 页", "answer_en": "When the group is going to check in at the hotel, the local guide should tell the tourists where they can change their money, how to find the place for entertainment and the locations of the stores, public toilets and the Chinese and Western-food restaurants and so on. In addition, he should also make the tourists acquainted with matters deserving their attention while staying in the hotel.", "answer_zh": "地陪应向全团介绍酒店内的外币兑换处、中西餐厅、娱乐场所、商场、公共洗手间等设施的位置，并讲清入住的注意事项。"}, "answer": "地陪导游应与饭店保持有效沟通和联系，提前落实住宿安排，旅游者抵达饭店时：\n(1)告知旅游者饭店名称、位置、基本设施和周边设施，饭店住店手续、有关服务项目、收费标准和注意事项，饭店内就餐形式、地点、时间和注意事项，当天或次日游览活动的安排和集合的时间、地点；\n(2)若留宿饭店，将房间号告知全陪导游，并掌握全陪导游和旅游者的房间号；\n(3)根据需要安排次日的叫早服务。", "answer_en": "First, keep in contact with the hotel and confirm the accommodation arrangements in advance.\nOn arrival, tell the tourists the hotel's name, location, facilities and nearby facilities. Explain the check-in procedures, available services, charges and important reminders. Tell them about meal type, location, time and important reminders and the itinerary, meeting time and place.\nIf staying at the hotel, exchange room numbers with the national guide and obtain the tourists' room numbers.\nFinally, arrange a wake-up call for the next morning if needed."}, {"group": 0, "n": 16, "q": "旅游者离开饭店当天，导游应做好哪些工作?", "match": {"rank": "高度对应", "en": "What should the local guide do when the group is going to leave the hotel?", "zh": "旅行团离开当地饭店前，地陪要做好哪些工作？", "source": "广东·服务规范 Q16 · 第 26 页", "answer_en": "(1) When the group is about to leave the hotel, the local guide must collect all the heavy bags of the tourists for consignment if they have any. And, together with the tour escort, the national guide and the luggage man, he should check the number of pieces and the packing condition of the luggage at an appointed time.\n(2) Under normal conditions, he should go through the check-out formalities before 12:00 noon.\n(3) Before the group leaves, he should remind the tourists to pay the hotel bills and return the keys to the reception desk in case they should forget. When the tourists are all seated in the bus, he should carefully count the number of people and remind the tourists to check and make sure that they have nothing left behind in the hotel.", "answer_zh": "（1）集中交运行李。如旅行团有行李须交付托运，地陪要按商定好的时间与领队、全陪、行李员一起清点行李并检查行李的包扎情况。\n（2）办理退房手续。如无特殊情况，地陪应在中午 12 点前办理退房手续;\n（3）集合登车。离开饭店前，地陪要询问游客与饭店的帐目是否结清，请游客将房间钥匙交回服务台；集合游客上车，等游客入座后，要仔细清点实到人数，提醒游客检查有无遗漏物品。"}, "answer": "地陪导游应当：\n(1)协助旅游者办理退房手续、结清有关自费项目费用；\n(2)提醒旅游者携带证件和行李等个人物品。同时，全陪导游应协助地陪导游做好以上工作。", "answer_en": "The local guide should help the tourists check out and settle any extra charges. Remind them to take their travel documents, luggage and other personal belongings.\nThe national guide should assist the local guide with these tasks."}, {"group": 0, "n": 17, "q": "旅游者就餐时，地陪导游应做好哪些服务?", "match": {"rank": "高度对应", "en": "What should the local guide do before, during and after meals in order that meals for the group could be properly arranged?", "zh": "地陪在团队用餐前、用餐时和用餐后要做好哪些工作？", "source": "广东·服务规范 Q14 · 第 25 页", "answer_en": "(1) Before meals, the local guide must check such things as place, time, number of diners and per capita price for the meals and particular requests of the tourists, and try to make sure that all these have been properly arranged.\n(2) When the tourists are having their meals, the local guide should go, once or twice, around the dining- room to answer questions of the tourists and to supervise the service of the restaurant.\n(3) After meals, the local guide must settle the bills strictly in accordance with the fixed per capita charge and the actual number of diners.", "answer_zh": "（1）用餐前，地陪要提前对用餐地点、时间、人数、标准、特殊要求等逐一核实并确认；\n（2）用餐时，地陪应巡视团队的用餐情况一两次，解答游客在用餐中提出的问题，并监督、检查餐厅的服务质量;\n（3）用餐后，地陪要严格按实际用餐人数、标准与餐厅结账。"}, "answer": "(1)提前与餐厅联系，核实订餐情况；\n(2)简单介绍餐厅和菜肴特色；\n(3)引导旅游者到餐厅入座并介绍有关设施；\n(4)引导旅游者文明用餐、使用公筷公勺，提倡“厉行节约，反对浪费”;\n(5)关注用餐情况，解答旅游者在用餐过程中的提问，解决出现的问题。", "answer_en": "First, contact the restaurant in advance and confirm the meal arrangements.\nSecond, briefly introduce the restaurant and its local dishes, guide the tourists to their seats and introduce the facilities.\nThird, encourage good dining manners, the use of serving chopsticks and spoons, and avoiding food waste.\nFinally, check how the meal is going, answer questions and deal with any problems."}, {"group": 0, "n": 18, "q": "在旅游者旅游的过程中，全陪导游应提供哪些服务?", "match": {"rank": "部分对应", "en": "What role does a national guide play in the tour activities, and what are his responsibilities?", "zh": "全陪在旅行团的旅游活动中充当什么角色？承担什么责任?", "source": "广东·服务规范 Q22 · 第 29 页", "answer_en": "The national guide is the representative of the tour organizer travel service. He must join the group throughout journey and take part in all its activities. His duty is to make the whole trip of the group well connected between destination cities along the route of the journey, to supervise the service of the local travel companies to ensure that the set itinerary for the group will be carried into effect, and to coordinate and harmonize the relations between the tour escort, the local guide and the driver.", "answer_zh": "全陪是组团社的代表，应自始至终参与旅游团队的全程活动，负责旅行团行程中各环节的衔接，监督接待计划的实施，协调领队、地陪、司机等接待人员之间的关系。"}, "answer": "(1)与当地保持有效沟通，全面落实旅游接待计划，并监督当地服务适时到位，如遇现场难以解决的问题，及时请示组团社；\n(2)适时向地接社和地陪导游提出相应的建议和意见；\n(3)在乘坐交通工具向异地行进途中，适时组织健康的文化娱乐活动或专题讲解。", "answer_en": "First, keep in contact with the local travel agency, make sure the tour plan is carried out and supervise the quality and timeliness of local services. If a problem cannot be solved on the spot, report it to the organizing travel agency and ask for instructions.\nSecond, give suggestions to the local travel agency and the local guide when necessary.\nThird, during travel between destinations, organize suitable recreational activities or give special-topic commentary."}, {"group": 0, "n": 19, "q": "在旅游者旅游的过程中，地陪导游应提供哪些服务?", "match": {"rank": "部分对应", "en": "What should the local guide do when the group is on the way to a tourist attraction?", "zh": "在旅行团前往景点参观的途中，地陪应做些什么？", "source": "广东·服务规范 Q33 · 第 35 页", "answer_en": "When the group is on the way to the tourist resort for sight-seeing, the local guide should …\n(1) Announce to the tourists the sight-seeing program of the day;\n(2) Take occasion to make the tourists acquainted with the sights passed by; and ...\n(3) Give them a general description of the place they are going to visit.", "answer_zh": "（1）重述当日的活动安排;\n（2）做好沿途风光导游;\n（3）扼要介绍景点的情况。"}, "answer": "(1)提前到达集合地点，督促司机做好出发前的各项准备工作；\n(2)旅游者出发前清点人数；\n(3)向旅游者告知当日天气情况和旅游行程安排；\n(4)在抵达旅游目的地前，向旅游者介绍本地的风土人情、自然和人文景观及旅游目的地的概况；\n(5)在抵达旅游目的地时，告知旅游者在旅游目的地的停留时间，参观游览结束后的集合时间和地点及游览过程中的注意事项；\n(6)在旅游目的地游览过程中，讲解旅游目的地的历史背景、特色、地位和价值等内容；\n(7)在返程途中，询问旅游者对当日活动安排的意见，回答旅游者的提问，并预报次日的旅游行程、出发时间及其他相关事项。", "answer_en": "First, arrive at the meeting point ahead of time and make sure the driver is ready. Count the tourists before departure and tell them the weather and the day's itinerary.\nSecond, on the way, introduce local customs, natural and cultural sights, and the destination.\nThird, on arrival, tell the tourists how long they will stay, the meeting time and place, and important safety reminders.\nFourth, during the visit, explain the site's history, features, importance and value.\nFinally, on the way back, ask for feedback, answer questions and introduce the next day's itinerary, departure time and other arrangements."}, {"group": 0, "n": 20, "q": "旅游者进行购物活动时，导游应提供哪些服务?", "match": {"rank": "部分对应", "en": "In what ways must the national guide supervise the shopping arrangements for the group and how should he help the tourists to do shopping?", "zh": "全陪在旅行团购物时，应如何发挥监督与指导作用？", "source": "广东·服务规范 Q23 · 第 29–30 页", "answer_en": "(1) If the local guide has arranged too many times for the group to do shopping and if shopping has taken up too much of the time for sightseeing, the national guide must advise the local guide against the arrangements.\n(2) When the tourists are shopping, the national guide should advise them to examine the price and quality of the articles they are thinking of buying so that they should not buy any inferior goods or fake products.\n(3) When some foreign tourists have bought something valuable, especially antiques, the national guide should remind them to keep the receipts for Customs examination. For purchase of ready-prepared Chinese medicines or Chinese medicinal materials, he should tell them the relevant regulations of the Chinese Customs.", "answer_zh": "（1）如地陪安排购物次数过多或延长购物时间，全陪要及时交涉；\n（2）购物时，要提醒游客注意商品的质量和价格，谨防假货或以次充好；\n（3）入境团游客购买贵重物品特别是文物时，要提醒其保管好发票以备出海关时查验；在他们购买中成药、中药材时，要向其讲清中国海关的有关规定。"}, "answer": "导游应严格按照旅游合同的约定安排购物活动，不应向旅游者兜售物品或诱导、欺骗、强迫、变相强迫旅游者购物。购物时，导游应：\n(1)向旅游者客观介绍当地特色商品的主要品种和特色；\n(2)提醒旅游者不应购买、携带违禁物品；\n(3)必要时，向旅游者提供购物过程中所需要的服务，包括翻译、介绍托运手续等。", "answer_en": "Arrange shopping strictly according to the tour contract. Never sell goods directly to tourists or induce, deceive or force them into shopping, directly or indirectly.\nIntroduce the main types and features of local products objectively. Remind tourists not to buy or carry prohibited items.\nProvide help when needed, such as interpreting and explaining shipping procedures."}, {"group": 0, "n": 21, "q": "旅游者参加旅游合同约定的文化娱乐活动时，导游应该提供哪些服务?", "match": {"rank": "高度对应", "en": "What is the right way for the local guide to deal with the recreational activity that is included or excluded in the group’s scheduled program?", "zh": "地陪应怎样安排好旅游团计划内和计划外的文娱活动？", "source": "广东·服务规范 Q15 · 第 26 页", "answer_en": "(1) If the activity is included in the group’s itinerary, the local guide is duty-bound to accompany the tourists to attend it and make them acquainted with the performance.\n(2) If it is not included in the group’s itinerary, for instance, if the tourists ask to watch a theatrical performance at their own expense, the local guide can help them with such things as buying admission tickets or hiring a taxi but usually he has no occasion to keep them company.\n(3) When the group is staying in a large place of recreation, the local guide should advise the tourists against separating themselves from the group. He must also keep an eye on the movement of the tourists and the condition of the surroundings so as to be prepared for any contingency.", "answer_zh": "（1）如果是计划内的文娱节目，地陪应陪同前往，并介绍情况;\n（2）如果是计划外的文娱活动（如游客提出自费观看文娱演出或参加某种娱乐活动），地陪一般应予以协助，但通常不陪同前往；\n（3）当游客要去大型娱乐场所活动时，地陪应提醒游客不要走散，并留意其动向和周围的环境，以防不测。"}, "answer": "(1)陪同前往并简要介绍文化娱乐活动内容和特点；\n(2)按时组织旅游者入场，倡导旅游者文明参与活动；\n(3)告知旅游者活动结束后的集合时间和地点；\n(4)提醒旅游者在文化娱乐活动场所注意人身和财物安全，并采取必要的防范措施；\n(5)活动结束时提醒旅游者不要遗留物品并有序退场。", "answer_en": "First, accompany the tourists and briefly introduce the activity and its features.\nSecond, organize entry on time and encourage proper behavior.\nThird, tell them the meeting time and place after the activity.\nRemind them to look after their personal safety and belongings, and take necessary precautions.\nFinally, remind them not to leave anything behind and help them exit in order."}, {"group": 0, "n": 22, "q": "欢送词一般包括哪些内容?", "match": {"rank": "高度对应", "en": "Try to make a farewell speech to the tourists in the name of a national guide.", "zh": "试以全陪的身份对旅行团致一段欢送辞。", "source": "广东·服务规范 Q27 · 第 32 页", "answer_en": "The following points should be included in the speech:\n(1) Reviewing the trip of the group and giving your thanks to the tourists for their cooperation.\n(2) Expressing your friendliness to the tourists and your reluctance and regret to part with them.\n(3) Inviting suggestions and opinions from the tourists.\n(4) Offering apologies to the tourists if things on the tour were not going smoothly or if the tourists are not satisfied with the service they have received.\n(5) Expressing your good wishes to the tourists\nReference Example:\nA National Guide’s Farewell Speech (For Reference):\nLadies and Gentlemen: Your visit to China is now coming to an end. In the last 10 days, you have climbed up on the Great Wall, which is one of the eight wonders of the world and was once said to be the only man-made object on earth man could see from the moon; you have visited the home of the Ming and Qing emperors - the Forbidden City in Beijing; you have reviewed the guards of honor of the Qin emperor in Xi’an, I mean the 6000 terracotta figures of soldiers and horses dating back over 2000 years; you have feasted your eyes on the beautiful karst scenery in Guilin, and you have just tasted the best Chinese food in Guangzhou… Anyway, you have got an idea of how China looks like. But China is a big country with a vast territory of 9.6 million square kilometers, with a population of 1.3 billion and a recorded history of nearly 5000 years. A 10-day visit to China, as a Chinese idiom goes, is just like a hurried journey of dragonflies, skimming the surface of the water looking for food. Therefore, you should come again if you want to get a better understanding of the country. I look forward to seeing you again in China in the near future. However, I know it is time you went home and rejoined your family. On this occasion before your immediate departure, I should say I’ve got a very nice group of very nice people and it’s been my pleasure staying with you over the last 10 days. I understand that the tour may be not a satisfaction to you all and our work leaves much to be desired, so any comments or complaints from you will be much appreciated. Friends, yours has been such a nice group that I hate to say good-bye to you and so I say “See you again!” Take care everybody and I wish you a pleasant journey home!", "answer_zh": "要求包括以下内容：\n（1）回顾旅游活动，感谢大家的合作；\n（2）表达友谊和惜别之情；\n（3）诚恳征求游客对接待工作的意见和建议；\n（4）若旅游活动中有不顺利或旅游服务有不尽如人意之处，导游人员可借此机会再次向游客赔礼道歉；\n（5）表达美好的祝愿。\n参考范例: 全陪告别词 (仅供参考):\n女士们,先生们: 你访问中国现在即将结束。在过去 10 天里,你们登上了长城, 万里长城是世界八大奇迹之一,据说曾经是从月球上能看到的地球上唯一的人造物体。你们访问了明朝和清朝皇帝的家——北京紫禁城; 你们检阅了秦始皇帝在西安的仪仗队,我的意思是那追溯到 2000 多年前的 6000 多秦兵马俑；那美丽的桂林喀斯特风景令你们一饱眼福；你们刚刚还在广州品尝了最好的中国菜…...。总之,我想中国是怎么一个样子你们已经有了一定的了解。但是,中国是一个大国,地域辽阔，有着 960 万平方公里国土,人口 13 亿,承载了近 5000 年的历史。为期 10 天的访问中国就像中国的成语--“蜻蜓点水”。因此, 如果你们能够再来你们将会对这个国家有更好的理解。我期待着在不久的将来在中国再次见到您。然而,我知道这该是你们回家与家人团聚的时间了。在你们即将离开的时刻,我应该说我接待了一个很好的团和一群很好的人。这是我的荣幸和你们一起度过了过去的 10 天。我知道这次旅游不能令你们所有人都满意你，我们的工作还有很多不尽如人意的地方,所以你们对我们如有任何的意见或投诉，我们将会不胜感激。朋友们,你们是这么好的一个团,我真的很不想与你们说再见,所以我只能说“再见到你!”大家保重, 祝你们归途愉快!"}, "answer": "(1)回顾旅游者在本地的旅游活动；\n(2)对领队、全陪导游和旅游者的合作表示感谢；\n(3)表达友谊和惜别之情；\n(4)诚恳地征求旅游者对接待工作的意见和建议；\n(5)对服务的不足之处表示歉意；\n(6)表达美好祝愿，欢迎再度光临。", "answer_en": "A farewell speech normally includes six parts.\nFirst, review the group's local tour.\nSecond, thank the tour escort, the national guide and the tourists for their cooperation.\nThird, express friendship and regret at parting.\nFourth, sincerely ask for their comments and suggestions.\nFifth, apologize for any shortcomings in the service.\nFinally, offer best wishes and welcome them to visit again."}, {"group": 0, "n": 23, "q": "离站送客时，地陪导游应该做好哪些工作?", "match": {"rank": "部分对应", "en": "What should the national guide do when the group is going to leave a city for the next destination?", "zh": "在旅行团离开各地时，全陪应做好哪些工作？", "source": "广东·服务规范 Q39 · 第 37 页", "answer_en": "(1) When the group’s visit to a city is coming to an end, the national guide should consult the local guide to make sure that transport tickets for the next destination are confirmed and…\n(2) Help the local guide and the tour escort with the necessary procedures for leaving the city.\n(3) In the meantime, he must keep and take care of the transport tickets and luggage claiming tags of the group.", "answer_zh": "（1）提前提醒地陪落实离站的交通票据及离站的准确时间。\n（2）协助领队和地陪办理离站事宜。\n（3）妥善保管票证。"}, "answer": "(1)致欢送词，并征求旅游者对旅游接待服务的意见；\n(2)提前确认落实联程、返程交通票据，以确保旅游者能按时启程；\n(3)带领旅游者提前抵达机场(火车站、码头);\n(4)协助旅游者办妥登机(车、船)票、安检和行李托运等相关手续。", "answer_en": "First, give a farewell speech and ask the tourists for feedback on the tour service.\nSecond, confirm onward and return tickets in advance so that they can leave on time.\nThird, take them to the airport, railway station or port ahead of time.\nFinally, help them with their tickets, security checks and baggage check-in."}, {"group": 0, "n": 24, "q": "导游服务工作完成后，导游应做好哪些总结工作?", "match": null, "answer": "(1)做好工作总结，若接待过程中发生重大事故，详细报告事件经过和处理结果，提交相关证明材料；\n(2)按照财务规定结清有关账目；\n(3)归还所借旅行社的物品。", "answer_en": "First, prepare a tour report. If a serious accident occurred, record the incident and how it was handled in detail, and submit the relevant supporting documents.\nSecond, settle all accounts according to financial rules.\nFinally, return anything borrowed from the travel agency."}, {"group": 0, "n": 25, "q": "接待入境旅游者的导游除应按照导游服务要求提供相应服务外，还应向旅游者提供哪些服务?", "match": null, "answer": "(1)介绍旅游行程的主要内容、中国概况，说明外币兑换手续，时差和天气情况等，并提示相关注意事项，包括中国关于宗教活动应当在宗教活动场所进行等相关法律法规规定、旅游行程安全、文明旅游、风俗习惯、购物退税等；\n(2)说明中国海关的有关规定，介绍办理出境手续的程序，包括行李托运的要求等，必要时可协助旅游者办理离境通关手续。", "answer_en": "First, introduce the itinerary and give an overview of China. Explain currency exchange, the time difference and the weather.\nRemind tourists of relevant Chinese laws and regulations, such as rules on places of religious activity, travel safety, responsible tourism, local customs and tax refunds for shopping.\nSecond, explain Chinese customs regulations and departure procedures, including baggage check-in requirements. Help tourists with departure formalities if needed."}, {"group": 0, "n": 26, "q": "导游处理突发事件和常见问题应遵循什么原则?", "match": null, "answer": "(1)以人为本，救援第一：以保障旅游者生命安全和身体健康为根本目的，尽一切可能为旅游者提供或协助提供救援、救助服务；\n(2)及时报告，加强沟通：立即向旅行社报告突发事件或问题发生情况，请求指示，并保持信息畅通，以便及时沟通与联系，情况紧急或发生重大、特别重大旅游突发事件时，依法直接向有关部门报告；\n(3)依法依约，合理可能：依照法律法规或合同约定处理突发事件和常见问题，并满足旅游者合理且可能实现的要求。", "answer_en": "There are three basic principles.\nFirst, put people and rescue first. Protect tourists' lives and health, and provide or arrange rescue and assistance as far as possible.\nSecond, report promptly and keep in contact. Report the situation to the travel agency immediately, ask for instructions and maintain communication. In urgent or major emergencies, report directly to the relevant authorities as required by law.\nThird, handle the situation according to laws and the tour contract, and meet tourists' reasonable requests whenever possible."}, {"group": 0, "n": 27, "q": "接待有儿童的旅游团，应注意哪些接待技巧?", "match": null, "answer": "(1)重视儿童的安全；注意儿童的收费标准；\n(2)对儿童多给予关照；\n(3)掌握“四不宜”原则，即不宜为讨好儿童而给其买食物、玩具，不宜突出儿童而冷落其他旅游者，不宜单独带儿童外出活动，不宜建议家长给儿童服药，更不能将自己携带的药品给儿童服用。", "answer_en": "First, pay special attention to children's safety and the applicable rates for children.\nSecond, give children extra care.\nThird, remember the four things to avoid: do not buy food or toys just to please a child; do not neglect other tourists by giving a child too much attention; do not take a child out alone; and do not advise parents to give children medication, and never give children medication from your own supply."}, {"group": 0, "n": 28, "q": "接待老年旅游者，应注意哪些接待技巧?", "match": null, "answer": "(1)妥善安排行程；做好提醒工作；\n(2)注意放慢节奏，讲解也应适当放慢速度，加大音量；耐心解答问题；\n(3)预防旅游者走失，反复多次提醒；\n(4)尊重旅游者意愿，对不愿过多接受特别照顾的旅游者，注意照顾方式。", "answer_en": "First, arrange the itinerary properly and give necessary reminders.\nSecond, slow down the pace of the tour, speak more slowly and clearly, raise your voice as needed, and answer questions patiently.\nThird, give repeated reminders to prevent elderly tourists from getting lost.\nFinally, respect their wishes and provide help in a considerate way, especially if they do not want too much special attention."}, {"group": 0, "n": 29, "q": "接待有残障人士的旅游团，应注意哪些接待技巧?", "match": null, "answer": "(1)应尊重和关心残障旅游者，把对他们的关心和照顾做得不露痕迹，既要热情，又不能给他们带去压力或伤害他们的自尊心；\n(2)要适时、恰当地照顾他们，如安排线路时不走或尽量少走台阶，安排客房和餐厅时尽量选择一楼方便进出等；\n(3)注意区别不同类型的残障旅游者，结合听觉障碍、视觉障碍和肢体残障旅游者的不同特点提供针对性接待服务。", "answer_en": "First, respect and care for tourists with disabilities. Offer help discreetly without putting pressure on them or hurting their dignity.\nSecond, provide suitable assistance, such as choosing routes with fewer steps and accessible rooms and restaurants on the ground floor.\nThird, adapt the service to different needs, including hearing, visual and physical disabilities."}, {"group": 0, "n": 30, "q": "导游应如何做好服务质量改进?", "match": null, "answer": "(1)导游应主动了解旅游者和聘用导游单位的评价结果，对服务中存在的质量问题、旅游者的投诉与意见建议，分析原因，及时整改；\n(2)导游应不断总结、交流带团经验，参加继续教育培训学习，提高自己的业务知识和操作技能，通过学习考核和实操锻炼获得更高的职业等级。", "answer_en": "First, actively seek feedback from tourists and the employing travel agency. Analyze the causes of service problems and complaints, and make improvements promptly.\nSecond, review and share tour-leading experience, attend continuing education and training, improve professional knowledge and practical skills, and work toward a higher professional grade."}, {"group": 0, "n": 31, "q": "导游旗形状及尺寸有什么规定?在提供导游服务过程中，导游应如何使用导游旗?", "match": null, "answer": "(1)导游旗形状以长方形或三角形为宜，旗面宽高尺寸以 45cm×30cm 或60cm×40cm 为宜，颜色应鲜艳醒目，材质易于飘扬，旗面应印制旅行社名称、标志或产品名称，字迹清晰、易辨识，无违背公序良俗的文字、符号或图案；\n(2)导游服务过程中，当旅游者人数超过10人时应持导游旗，旅游者人数少于10人时可根据现场情况决定是否持导游旗。导游在使用导游旗时，应保持旗杆直立，旗面位于旅游者易辨识的方位；暂不使用导游旗时，需妥善放置，不应垫坐、玩耍等。", "answer_en": "A tour guide flag should preferably be rectangular or triangular, measuring 45 by 30 centimeters or 60 by 40 centimeters. It should be bright, easy to see and made of material that flies easily. The travel agency's name, logo or product name should be clearly printed on it, without offensive words, symbols or images.\nThe guide should carry the flag when there are more than ten tourists. For a group of fewer than ten, the guide can decide according to the situation.\nKeep the flagpole upright and the flag visible to the group. When not in use, store it properly and never sit on it or play with it."}, {"group": 0, "n": 32, "q": "导游在执业过程中应携带哪些证件?《中华人民共和国旅游法》就导游收取小费和旅游者购物方面是如何规定的?", "match": null, "answer": "(1)导游在执业过程中应当携带电子导游证、佩戴导游身份标识，并开启导游执业相关应用软件；\n(2)导游应当严格执行旅游行程安排，不得擅自变更旅游行程或者中止服务活动，不得向旅游者索取小费，不得诱导、欺骗、强迫或者变相强迫旅游者购物或者参加另行付费旅游项目。", "answer_en": "First, carry the electronic tour guide license, wear the guide identification badge, and open the required tour guide apps.\nSecond, strictly follow the tour itinerary. Do not change it or stop services without authorization.\nNever ask tourists for tips, or induce, deceive or force them, directly or indirectly, to shop or take part in separately charged activities."}, {"group": 1, "n": 1, "q": "导游到达高铁站接团时，发现旅游者早已等候多时。请问导游应如何处理?", "match": {"rank": "高度对应", "en": "Supposing that, when you get to the train station, the tourist group you are to meet has been waiting there for a long time; the tourists are very unhappy about waiting and the tour escort also blame you for being late. What would you do in this case if you were the local guide of the group?", "zh": "当你抵达车站时，你要接的旅行团已在车站外等候多时，客人非常不高兴，领队也埋怨你漏接。作为地陪，你应如何处理？", "source": "广东·应变能力 Q15 · 第 46 页", "answer_en": "(1) In this case, I must make an apology to the tour escort, the national guide and all the tourists for my coming late.\n(2) I must tell them the true reason why I was delayed and assure them of my sincerity to do a good job for the group.\n(3) To make amends for my error, I should make full use of the time to fulfill the sightseeing program so as to get understandings from the tourists.\n(4) And, if necessary, I should give them a substantial compensation.", "answer_zh": "（1）应及时向领队、全陪及客人赔礼道歉；\n（2）实事求是地说明情况，表明自己要做好导游工作的诚意；\n（3）采取弥补措施，圆满完成接待计划，取得游客的谅解；\n（4）必要时，酌情给予游客一定的物质补偿。"}, "answer": "找到旅游团后，导游应当：\n(1)道歉并说明情况。导游首先应诚恳地向旅游者表示歉意，然后实事求是地说明情况，争取旅游者的原谅；\n(2)积极采取弥补措施。一方面，导游可以通过提供热情周到的高质量服务，弥补旅游者等候多时的不良影响；另一方面，必要时可以通过加菜、送本地特产等形式，给予一些物质上的补偿。", "answer_en": "First, sincerely apologize to the tourists, explain the situation honestly and ask for their understanding.\nSecond, provide warm and attentive service to make up for the delay. If necessary, arrange suitable compensation, such as an extra dish or a local specialty gift."}, {"group": 1, "n": 2, "q": "旅游团在某地游览时，由于受恶劣天气的影响，不得不提前结束当地的行程。请问导游应如何处理?", "match": {"rank": "部分对应", "en": "As the road to the tourist resort is impassable, a tourist group has to cancel its one-day tour to the attraction and this has made the tourists feel quite unhappy. How can the local guide solve this problem?", "zh": "因道路不通，旅行团被迫取消前往某地的一天行程。客人非常沮丧，地陪应怎样处理？", "source": "广东·应变能力 Q14 · 第 46 页", "answer_en": "(1) The local guide must arrange another activity as a substitute.\n(2) He should try his best to arouse people’s interest in the new arrangement with his eloquent and interesting speech.\n(3) He should ask the national guide to report the matter to the tour organizer travel service for a final decision.", "answer_zh": "（1）要安排另一活动替代；\n（2）要以精彩的介绍、新奇的内容和最佳的安排激起游客的游兴；\n（3）请全陪报告组团社并作出决定。"}, "answer": "(1)第一时间将现场情况汇报给旅行社；\n(2)将旅行社的处理建议告知旅游者，征询大家意见，直至双方协调完毕；\n(3)安抚好旅游者情绪，提供更细致的服务；\n(4)提醒各方协同做好变更后的信息变更通知。", "answer_en": "First, report the situation to the travel agency immediately and ask for instructions.\nSecond, explain the agency's proposed solution to the tourists, ask for their opinions and help reach an agreement.\nThird, reassure the tourists and provide more attentive service.\nFinally, make sure all parties are informed of the changes."}, {"group": 1, "n": 3, "q": "地陪导游送团的途中遇到交通堵塞，导致到达机场时飞机已经起飞。 请问地陪导游这时该如何处理?", "match": {"rank": "高度对应", "en": "What must the tour guide do in case the group has failed to catch the flight?", "zh": "一旦旅行团发生误机事故，导游人员应如何处理？", "source": "广东·应变能力 Q17 · 第 47 页", "answer_en": "In case the group has lost the flight, the tour guide must do the following:\n(1) He must report the matter immediately to the leaders of his travel service to ask for help.\n(2) He must consult the airline and try to arrange another flight for the group to leave at an earliest possible time.\n(3) He must have the meals, hotel accommodations and sightseeing well arranged for the tourists while they are detained so as to relieve them from anxiety.\n(4) Then, he must inform the travel service in the next destination city so that they may alter the tour program for the group accordingly.\n(5) And, of course, he must make an apology to the tourists for the mishap.\n(6) Finally, he must write out a report to find out the cause of the event and to ascertain where the responsibility lies so that the wrong-doer should answer for the losses incurred.", "answer_zh": "（1）导游人员应立即向旅行社领导及有关部门报告,请求协助；\n（2）尽快与机场联系，安排游客尽快离开本站；\n（3）稳定游客的情绪，安排好食宿、游览等事宜；\n（4）及时通知下一站，对日程作相应的调整；\n（5）向游客赔礼道歉；\n（6）写出事故报告，查清事故原因和责任，责任者应承担经济损失。"}, "answer": "对于已成事故，地陪导游应：\n(1)立即向旅行社领导及有关部门报告并请求协助；\n(2)地陪导游和旅行社应尽快与航空公司联系，争取让旅游团乘最近班次的航班离开本站，必要时改乘其他交通工具前往下一站；\n(3)稳定旅游团的情绪，安排好在当地滞留期间的食宿、游览等事宜；\n(4)视延误的时间，及时通知下一站的地接社，对日程做相应的调整；\n(5)向旅游者赔礼道歉，求得谅解；\n(6)写出事故报告，查清事故的原因和责任，相关责任者应承担经济损失并受到相应处分。", "answer_en": "First, report the situation to the travel agency and relevant authorities immediately and ask for help.\nSecond, contact the airline with the travel agency to arrange the next available flight, or alternative transport if necessary.\nThird, reassure the tourists and arrange their meals, accommodation and activities during the delay.\nInform the local travel agency at the next destination and adjust the itinerary. Apologize sincerely and ask for the tourists' understanding.\nFinally, write an accident report, clarify the cause and responsibility, and make clear that those responsible should bear the financial losses and face appropriate disciplinary action."}, {"group": 1, "n": 4, "q": "中国公民出境旅游时不慎丢失了护照，领队应该如何处理?", "match": {"rank": "部分对应", "en": "What should the local guide do if an American Chinese (a Chinese national residing in the United States) lost his passport while the group is sightseeing in Guangzhou?", "zh": "某旅行团在广州游览时，团里一位美国华侨不慎丢失了自己的证件，经多方寻找仍无下落。 作为地陪，你应当如何协助他补办护照和签证？", "source": "广东·应变能力 Q19 · 第 49 页", "answer_en": "In this case, the local guide must help him apply for a new Chinese passport and a new visa to the United States.\n(1) To apply for a new Chinese passport, the tourist must first get his photos ready for use.\n(2) And the local guide must get a certificate of loss from his travel service.\n(3) With the certificate of loss from the travel service, the tourist must go personally to the Public Security Bureau of Guangdong Province to report the loss and apply for a new Chinese passport.\n(4) Then, with the new passport, the tourist should apply to the American Consulate in Guangzhou for an entry visa to the United States.", "answer_zh": "（1）让失主准备照片；\n（2）请当地接待社开具遗失证明；\n（3）失主持遗失证明到广东省公安厅报失并申请补办中国护照；\n（4）持新护照到广州美国领事馆办理进入美国的签证。"}, "answer": "(1)稳定旅游者情绪，详细了解丢失情况，协助寻找，同时报告旅行社；\n(2)协助旅游者向当地警方报失，在取得丢失证明后向中国驻当地使领馆或政府派出机构等有关证件办理部门申请新证件，办理相关离境手续。", "answer_en": "First, reassure the tourist, find out what happened, help look for the passport and report the situation to the travel agency.\nSecond, help the tourist report the loss to the local police and obtain a loss certificate. Then, help them apply for replacement travel documents at the Chinese embassy, consulate or other competent authority, and complete the departure formalities."}, {"group": 1, "n": 5, "q": "旅游者不慎丢失物品，导游应当如何协助处理?", "match": null, "answer": "(1)应稳定旅游者情绪，详细了解丢失情况，协助寻找，同时报告旅行社；\n(2)如果是旅游者在境内丢失物品，由旅行社开具丢失证明，导游应协助旅游者向公安机关报失，开具物品遗失证明，以备向保险公司申请办理理赔事宜；\n(3)如果是旅游者在境外丢失物品，由当地旅行社开具丢失证明，领队协助旅游者向当地警方报失，开具物品遗失证明，以备离境时海关查验或向保险公司申请办理理赔事宜。", "answer_en": "First, reassure the tourist, find out what happened, help look for the missing item and report the situation to the travel agency.\nIf the item is lost in China, the travel agency should issue proof of loss. Help the tourist report it to the local police and obtain a loss certificate for the insurance claim.\nIf lost abroad, the local travel agency should issue proof of loss. The tour escort should help the tourist report it to the local police and obtain a loss certificate for customs checks or an insurance claim."}, {"group": 1, "n": 6, "q": "旅游者抵达机场后发现托运的行李丢失，导游应当如何处理?", "match": {"rank": "高度对应", "en": "When a foreign tourist group arrived in the airport in China, a tourist in the group discovered that his luggage was missing. What should the local guide do to help him?", "zh": "一位外国游客的行李在来华途中丢失，在到达我国机场时才发觉。地陪应如何协助他处理此事？", "source": "广东·应变能力 Q21 · 第 50 页", "answer_en": "(1) In this case, the local guide should take the tourist to the Lost Luggage Registration Office of the airport to report and register the loss.\n(2) While the group is visiting the local city, the local guide should often telephone the airport to inquire about the result of their search for the luggage.\n(3) When the luggage is not found for the moment, the local guide should help the tourist to buy his daily necessities.\n(4) If eventually they give it up for lost, the local guide should help the tourist to claim compensation from the airline.", "answer_zh": "（1）带失主到机场失物登记处，办理行李丢失和认领手续；\n（2）在本地游览期间，地陪要不时打电话询问寻找行李情况；\n（3）一时找不回行李，要协助失主购置必要的生活用品；\n（4）若行李确实丢失，应协助失主向有关航空公司索赔。"}, "answer": "(1)查明丢失行李的运输区间，协助旅游者办理报失登记手续；\n(2)将旅游者后续旅游行程安排告知航空公司，同时在旅游过程中，应与航空公司保持联系与沟通，督促及时查找丢失行李；\n(3)在查找丢失行李期间，协助旅游者购置生活必需品，提示其保留发票等购货凭证，并协助旅游者处理索赔事宜；\n(4)可以确认责任者的，协助旅游者向责任方索赔，并办理相关事宜，难以确认责任者的，协助旅游者开具有关证明，以便向保险公司申请办理理赔事宜，并视情况向有关部门报告。", "answer_en": "First, find out on which part of the journey the luggage went missing and help the tourist file a lost baggage report.\nSecond, inform the airline of the tourist's onward itinerary, stay in contact and follow up on the search.\nThird, help the tourist buy essential items, remind them to keep receipts, and assist with compensation claims.\nFinally, if the responsible party is known, help the tourist claim compensation from them. Otherwise, help obtain supporting documents for an insurance claim and report the situation to the relevant authorities if necessary."}, {"group": 1, "n": 7, "q": "旅游者在境内走失，导游应如何处理?", "match": {"rank": "高度对应", "en": "What should the tour guides do when they discovered that an old man in the group is missing while they sightseeing in a tourist resort?", "zh": "某旅行团在景点游览时，发现少了一个老年游客，导游人员应如何处理？", "source": "广东·应变能力 Q01 · 第 39 页", "answer_en": "(1) In this case, the tour guides should first try to find out when and where he was missing and then the national guide and the tour escort should look for him separately, while the rest of the group should follow the local guide to proceed with the tour.\n(2) If they failed to find him, they should apply to the nearby police station and the management of the tourist resort for help.\n(3) In the meantime, they should call up the hotel to find out if the man has been back there.\n(4) If not, they should phone to report the case to the local travel service and…\n(5) They should get prepared to deal with possible problems arising from the event.\n(6) Finally, they should write out a report on the event.", "answer_zh": "（1）了解情况，迅速寻找。一般是全陪、领队分头寻找，地陪带领其他游客继续游览。\n（2）向当地派出所和景点管理部门求助；\n（3）与饭店联系，询问该游客是否已回饭店；\n（4）向旅行社报告；\n（5）做好善后工作；\n（6）写出事故报告。"}, "answer": "发现旅游者走失，导游应：\n(1)向其他旅游者了解情况，并由全陪导游安排旅游者随行亲朋或团队代表与其共同寻找旅游者，同时与景区、住宿经营者等可能有线索的相关接待者联系，地陪导游带团继续游览；\n(2)及时向旅行社报告，反映旅游者走失详细情况，取得指导与帮助，并通知走失旅游者家属；\n(3)走失24小时仍未找到的，立即向走失地公安机关报案，寻求帮助；\n(4)旅游者是老年人、未成年人、残疾人等特殊人群的，立即报警。", "answer_en": "First, find out when and where the tourist went missing. The national guide should search with relatives or group representatives and contact the scenic area, hotel and other service providers. The local guide should look after the rest of the group.\nSecond, report the situation to the travel agency promptly, ask for guidance and help, and notify the tourist's family.\nThird, if the tourist is still missing after 24 hours, report the case to the local police; report immediately if the missing person is elderly, a minor or has a disability.", "answer_en_note": "江苏原文含24小时报案的表述；现实中不应因等待24小时而延误求助，尤其在人员可能有危险时。"}, {"group": 1, "n": 8, "q": "旅游者在境外走失，导游应如何处理?", "match": null, "answer": "(1)了解情况，迅速寻找，并通过相关移动应用软件进行活动区域定位；\n(2)及时向旅行社报告，反映旅游者走失详细情况，取得指导与帮助；\n(3)与饭店联系，以便当事人自行回到饭店时告知领队；\n(4)必要时，领队可要求地陪导游向当地警方报案；\n(5)向中国驻当地使领馆或政府派出机构报告，在其指导下全力做好旅游者走失的应对处置工作。", "answer_en": "First, find out when and where the tourist went missing, search promptly and use available mobile location services where appropriate.\nSecond, report the situation to the travel agency promptly and ask for guidance and help.\nThird, contact the hotel so that it can inform the tour escort if the tourist returns.\nIf necessary, ask the local guide to report the case to the local police.\nFinally, report the situation to the Chinese embassy, consulate or relevant government representative and follow their guidance."}, {"group": 1, "n": 9, "q": "旅游者在旅游途中晕车，导游应如何处理?", "match": {"rank": "部分对应", "en": "What should the national guide do to take care of the tourists who are liable to carsick, airsick or seasick?", "zh": "全陪对旅行团中会晕车、晕机或晕船的客人，应作何关照？", "source": "广东·应变能力 Q23 · 第 51 页", "answer_en": "(1) To take good care of the tourists who are liable to carsickness, airsickness or seasickness, the national guide should warn them not to eat too much before traveling. He should remind them to take a right dose of carsickness preventive, but must warn them of the contraindications of the drug because many carsickness preventives are harmful to health, especially for glaucoma sufferers.\n(2) When assigning seats on the bus or plane, those at less shaky positions should be reserved for them.\n(3) When the group is traveling long distance by plane or train, the national guide should ask the attendants to help look after them.", "answer_zh": "（1）提醒晕车、晕机、晕船者，旅行前要不饱食并服用适当药物（最好是使用自备药，并提醒游客留意药品的禁忌，许多晕车药均不适合青光眼患者）；\n（2）尽可能安排其坐在较为平衡的座位上；\n（3）长途旅行中游客晕机（车、船），导游人员可请乘务员协助照顾。"}, "answer": "(1)提醒旅游者，可以通过与人聊天、听喜欢的音乐、欣赏远处风光等方式转移注意力；\n(2)如果旅游者乘坐的位置晃动比较厉害，应及时协调到相对平稳的位置，并设法通风透气以呼吸到新鲜空气；\n(3)将风油精、清凉油少许涂抹于太阳穴等位置，以提升精神；\n(4)准备好应急袋，可以是身边方便找到的食品袋、塑料袋等，并备好纸巾或湿纸巾，方便清理个人卫生；\n(5)如果旅游者晕车表现严重时，可以请司机酌情尽快找地方停车，让旅游者下车缓解症状，再视情况处理。", "answer_en": "First, help the tourist distract themselves by chatting, listening to music or looking into the distance.\nSecond, help them move to a more stable seat and get some fresh air. Offer a familiar cooling balm if they wish to use it safely.\nThird, prepare a bag and tissues or wet wipes.\nIf the symptoms are severe, ask the driver to stop in a safe place as soon as possible, let the tourist take a break and assess the situation.", "answer_en_note": "口述稿以非药物缓解及安全停车为主，风油精/清凉油仅在游客愿意且适合其使用时考虑。"}, {"group": 1, "n": 10, "q": "旅游者在旅途中患病，导游应如何处理?", "match": {"rank": "部分对应", "en": "What should the tour guide do if someone in the group intends to give up the sightseeing tour and stay behind in the hotel for a rest because he is not feeling well?", "zh": "游客因身体不适，想单独留在饭店休息而不随团活动时，怎么办?", "source": "广东·应变能力 Q35 · 第 56 页", "answer_en": "When someone in the group is sick and is not able to join the group for sightseeing,\n(1) The tour guide should let him stay behind in the hotel for a rest. He should not urge him to join the group for sightseeing.\n(2) He should reserve a lunch for him in the hotel restaurant or arrange a room service for him if necessary.\n(3) He should tell the tourist the way of getting in touch with the doctor in the hotel and …\n(4) Ask the hotel house-keeper to help take care of him\n(5) When back from sightseeing, the tour guide should go to see him and inquire after his health so as to show concern for him.", "answer_zh": "（1）请其自便，不勉强其随团活动；\n（2）通知餐厅安排午餐，必要时为其提供送餐服务；\n（3）告知客人饭店医务室的联系办法；\n（4）告知房间服务员注意照顾客人；\n（5）游览回来后，应去询问该客人情况，以示关心。"}, "answer": "(1)及时了解情况，劝其及早就医并多休息，不要强行游览；\n(2)不应擅自给患者用药；\n(3)如有需要，应陪同患者前往医院就诊，并按规定履行报告义务，同时协助旅游者向保险公司办理理赔事宜。", "answer_en": "First, find out the tourist's condition promptly. Encourage them to seek medical care and rest instead of continuing the tour.\nSecond, do not give medication on your own.\nIf necessary, accompany the tourist to the hospital, report the situation as required and help them with an insurance claim."}, {"group": 1, "n": 11, "q": "旅游者在旅途中突患重病，紧急送往医院抢救。在抢救的过程中， 导游应当如何处理?", "match": {"rank": "部分对应", "en": "What would the tour guide do in case a tourist in the group suddenly has a heart attack?", "zh": "旅行团中有一个客人心脏病发作，地陪应如何处理？", "source": "广东·应变能力 Q03 · 第 40 页", "answer_en": "(1) If the tourist is surely suffering from heart attack, the tour guide should immediately help him lie down on his back with his head cushioned to rise a bit, and ask his family member to feed him with the first-aid medicine he has brought with him so that his condition may improve.\n(2) Then, the tour guide should call an ambulance to help or take the patient to the nearby hospital for treatment.\n(3) In the meantime, he should ask the local travel service to send someone to help.\n(4) When rescue treatment is in process, the local guide should ask the patient’s family member to stay in the hospital.\n(5) While the patient is staying in the hospital, the local guide should often come to visit. If the patient is a member of a foreign group, he should help him with such things as separating his visa from the group’s collective visa, going through the formalities for leaving the hospital after his recovery and booking his home- bound transport ticket etc.\n(6) Also, he must make good arrangements for sightseeing for the rest of the group.", "answer_zh": "（1）若证实是心脏病发作，应让病人就地平躺，头略高；让其家人取出备用药品让病人服用，以舒缓病情；\n（2）马上叫救护车，或送病人到最近的医院；\n（3）通知旅行社派人协助；\n（4）医院抢救时，导游人员应要求病人亲属在场；\n（5）地陪要不时去医院探望，若患者是入境团的客人，应帮助其办理分离签证、预订回国交通票证等事宜；\n（6）地陪应安排好团队其他游客的活动。"}, "answer": "(1)详细记录患者患病前后的症状和治疗情况，尽量保留相关诊断治疗证明副本，患者亲友同团的，要求其在场；\n(2)随时向旅行社反映情况并及时通知或提请旅行社通知患者亲属；\n(3)如患者系外籍人士，协助患者通知其所在国驻华使领馆；\n(4)妥善安排好其他旅游者的活动，地陪导游带团继续游览。", "answer_en": "First, record the patient's symptoms and treatment in detail, keep copies of relevant medical certificates, and ask relatives or friends in the group to be present.\nSecond, keep the travel agency informed and notify the patient's family as soon as possible.\nIf the patient is a foreign national, help notify their country's embassy or consulate in China.\nFinally, arrange activities for the rest of the group. The local guide can continue the tour."}, {"group": 1, "n": 12, "q": "旅游者在旅途中意外身亡，导游应如何处理?", "match": null, "answer": "(1)导游应立即向旅行社报告，由地接社按照国家有关规定做好善后工作，同时应稳定其他旅游者情绪，并继续做好其他旅游者的接待工作；\n(2)旅游者非正常死亡的，导游应注意保护现场，并及时向当地公安机关报案；\n(3)旅游者死亡发生在境外的，领队应及时向当地警方报案，同时向中国驻当地使领馆或政府派出机构报告，并按旅行社的安排处理相关事宜；\n(4)导游应协助旅游者家属向保险公司办理理赔事宜。", "answer_en": "First, report the situation to the travel agency immediately. The local travel agency should handle the aftermath according to regulations. Reassure the other tourists and continue providing services to them.\nIf the death is unnatural, protect the scene and report it to the local police promptly.\nIf it occurs abroad, the tour escort should report it to the local police and the Chinese embassy, consulate or relevant government representative, and follow the travel agency's instructions.\nFinally, help the family with the insurance claim."}, {"group": 1, "n": 13, "q": "在旅游的过程中，发现有旅游者感染传染病疫情时，导游应如何处理?", "match": {"rank": "高度对应", "en": "What should the tour guide do if someone in the group is suspected of suffering from an infectious disease?", "zh": "某旅行团中有一游客患有传染病，导游员应如何处理?", "source": "广东·应变能力 Q02 · 第 39 页", "answer_en": "(1) In this case, the tour guide must first try to find out the details of the patient’s condition.\n(2) And then, he should report the case to the local travel service and then to the quarantine and epidemic prevention departments.\n(3) If they consider it necessary to do epidemiological examination, the tour guide should talk over the matter with the tour leader and persuade the patient to have his health checked and his blood serum tested.\n(4) If the patient is proved to be infected with contagious disease, he must be isolated for treatment or other measures will be taken according to the requirements of the departments concerned.\n(5) If the patient is a foreigner, he would be required to leave the country ahead of schedule. In this case, the tour guide must help him with the exit formalities.\n(6) After the event, the tour guide should submit a written report to departments concerned, stating clear the details of the case and measures taken.", "answer_zh": "（1）详细了解客人提供的情况及弄清患者的健康情况；\n（2）向旅行社领导及当地防疫、卫生检疫机关汇报；\n（3）如有关部门认为应对其进行防疫检查，应经领队和患者本人同意后，送患者到当地防疫站进行血清检验和检查；\n（4）如查实确患传染病，应遵照有关部门意见进行隔离或采取其它措施；\n（5）如患者是国外游客，应向患者及领队说明，按我国规定患者需提前出境，并帮其办理有关手续；\n（6）将详细情况及处理经过以书面形式向有关方面汇报。"}, "answer": "(1)立即暂停旅游活动，在第一时间向旅行社及其所在地、疫情发生地旅游主管部门报告，并及时向附近的疾病预防控制机构报告详细情况，配合开展旅游者防疫、安抚和宣传解释工作；\n(2)有关部门认为应对旅游者进行防疫检查的，立即将旅游者送至当地疾病预防控制机构或有关部门指定的其他场所；\n(3)经查旅游者确患传染病的，遵照当地有关疫情防控指引和要求，配合相关部门和单位做好旅游者隔离、密切接触者追踪或采取其他措施，并通知其亲属；\n(4)关注目的地疫情防控动态，根据疫情发展情况，按旅行社的安排，调整或变更旅游行程；\n(5)如患者系外籍人士，由我国公安机关令其提前出境的，协助患者办理相关离境手续；\n(6)传染病疫情发生在境外的，领队应及时向中国驻当地使领馆或政府派出机构报告，并在其指导下，全力做好传染病疫情应对处置工作。", "answer_en": "First, suspend the tour and promptly report the situation to the travel agency, the tourism authorities in both locations and the local disease control agency. Cooperate with their response, reassure tourists and explain the situation.\nIf an examination is required, help the tourist reach the designated medical or disease control facility.\nIf the disease is confirmed, follow local public health instructions, cooperate with isolation, contact tracing and other required measures, and notify the patient's family.\nKeep informed of local developments and adjust the itinerary according to the travel agency's instructions.\nIf a foreign tourist is ordered to leave China early, help with departure formalities. If the incident occurs abroad, report it to the Chinese embassy, consulate or relevant government representative, and follow their guidance."}, {"group": 1, "n": 14, "q": "乘车前往景区游览的途中突发交通事故，导游未受重伤，应当如何处理?", "match": {"rank": "高度对应", "en": "Supposing the tour bus of a group turned over and three people were seriously injured and several were slightly wounded. What would you do in this case if you were the tour guide of the group?", "zh": "旅游车不慎翻侧，造成 3 人重伤，多人轻伤。如果你是该团的导游人员，你会采取什么措施处理？", "source": "广东·应变能力 Q29 · 第 53 页", "answer_en": "(1) At this critical moment of life and death, I must lose no time in arranging first-aid treatments for the wounded.\n(2) I must keep the accident scene intact and call departments concerned for help.\n(3) At the same time, I should report the accident to the local travel service and…\n(4) Try to placate the tourists of the group.\n(5) Finally, I should write out a report about the accident.", "answer_zh": "（1）立即组织抢救；\n（2）保护现场，立即报案；\n（3）迅速向旅行社汇报；\n（4）安抚全团游客情绪；\n（5）写出事故的书面报告。"}, "answer": "(1)立即组织抢救。在事故发生的第一时间，应立即展开抢救工作，优先救助伤员。对于受伤比较严重的，应立即拨打120求助，并在120 的指导下，展开力所能及的科学急救；\n(2)保护现场并立即报案。导游应冷静保护事故现场，避免进一步破坏或污染。同时，立即拨打或安排人员拨打交通事故报警电话122,等交警抵达后，协助进行现场处置；\n(3)迅速上报旅行社。将事故情况上报旅行社，听取旅行社的安排，妥善处理现场问题；\n(4)做好安抚工作。对全体旅游者做好安抚工作，并根据事故整体情况和旅游者意愿，调整好后续的行程安排。", "answer_en": "First, put safety and rescue first. Call 120 for seriously injured tourists in China and provide first aid within your ability under emergency personnel's guidance.\nSecond, protect the scene, call 122 or arrange for someone to report the traffic accident, and cooperate with the traffic police.\nThird, report the situation to the travel agency promptly and follow its instructions.\nFinally, reassure the tourists and adjust the remaining itinerary according to the situation and their wishes."}, {"group": 1, "n": 15, "q": "入住酒店期间遭遇火灾，不能立刻离开火灾现场，导游应如何引导旅游者开展自救?", "match": {"rank": "高度对应", "en": "Supposing the hotel suddenly caught fire and the fire scene is 2 stories below the floor where a tourist group is staying. In these circumstances, how should the tour guide of the group direct the tourists to save themselves?", "zh": "饭店突然发生火灾，火场就在旅行团入住客房的下面两层，导游员应如何引导客人自救？", "source": "广东·应变能力 Q06 · 第 42 页", "answer_en": "At this critical moment, the tour guide must keep calm to make a sober judgment of the situation. The basic point of first importance is that, in case of fire, people must not try to escape by taking the elevator and in no case should they leap down from high up the building.\n(1) If people caught fire on their clothes, they can roll on the floor or slap their bodies with heavy clothing to put out the fire.\n(2) When people must pass through dense smoke areas, they must wrap their bodies and cover their mouths and noses with wet clothes and creep forward along the walls.\n(3) If the room door is blocked by fire and people cannot run away, they must stop up the chinks of the door with soaked clothes or beddings and splash water to lower the temperature.\n(4) At the same time, they must wave colorful clothes out of the window to call for help.", "answer_zh": "千万不能让游客搭乘电梯或随意跳楼逃生，导游人员要镇定地判断火情，引导大家自救：\n（1）若身上着火，可就地打滚或用厚重衣物压灭火苗；\n（2）必须穿过浓烟时，用浸湿的衣物披裹身体，捂住口鼻，贴近地面顺墙爬行；\n（3）大火封门无法逃出时，可用浸湿的衣物、被褥堵塞门缝并泼水降温，等待救援；\n（4）摇动色彩鲜艳的衣物呼唤救援人员。"}, "answer": "(1)提醒旅游者不要贪恋财物，应迅速逃生，不要搭乘电梯或慌乱跳楼；\n(2)迅速戴上防烟工具或用湿毛巾捂住口鼻，同时身体重心尽量下移，贴近地面逃生；\n(3)若身上着火，不可奔跑，应就地打滚将火苗压灭，或用厚重衣物压住火苗；\n(4)若大火已经封闭逃生通道，则应立即返回室内，用浸湿的衣物、被褥堵塞门缝或泼水降温，向窗外摇动色彩鲜艳的衣物等方式发出求救信号，等待救援。", "answer_en": "First, tell the tourists to leave their belongings behind, evacuate if there is a safe exit, and never use the elevator or jump from a height.\nSecond, protect themselves from smoke and stay low while escaping.\nIf clothes catch fire, stop, drop and roll, or smother the flames with a heavy garment.\nIf the escape route is blocked, stay in a safe room, keep the door closed, seal gaps if possible, call emergency services, signal from the window with bright-colored clothing, and wait for rescue."}, {"group": 1, "n": 16, "q": "旅游团在某餐厅用餐后，多名旅游者出现头痛、头晕、恶心、呕吐等症状时，导游应当如何处理?", "match": {"rank": "高度对应", "en": "What should the tour guide do if, by any chance, the tourists are poisoned by food?", "zh": "旅行团发生食物中毒事故时，导游人员应如何处理？", "source": "广东·应变能力 Q07 · 第 42 页", "answer_en": "In case the tourists suffer food-poisoning …\n(1) The tour guide should tell the tourists to drink plenty of water and try to make them vomit so as to eliminate the toxins from their intestines.\n(2) Then, he must take them immediately to the hospital for emergency treatment and ask the doctor for a medical certificate.\n(3) In the meantime, he should report the case to the local travel service to fix responsibility on the restaurant.", "answer_zh": "（1）设法为中毒者催吐并让其多喝水排解毒性；\n（2）尽快将患者送医院抢救，请医生开具诊断证明；\n（3）报告地接社，追究餐厅责任。"}, "answer": "当多名旅游者发生相同症状时，导游应：\n(1)立即与当地医疗机构联系救助事宜，并设法催吐，同时对食品进行留样，取得旅游者呕吐物的样本；\n(2)将旅游者送至医疗急救机构或医院进行救治，并保留相关证据；\n(3)及时向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾病预防控制机构报告，反映旅游者的详细情况。", "answer_en": "First, suspect food poisoning when several tourists develop similar symptoms. Contact emergency medical services immediately and follow their instructions. Do not induce vomiting on your own. Preserve food samples or other evidence for the authorities.\nSecond, help the affected tourists obtain emergency medical treatment and keep relevant records.\nFinally, report the details promptly to the travel agency, the tourism authorities in both locations and the disease control agency.", "answer_en_note": "江苏原文有“设法催吐”，英文口述稿改为先联系医疗机构并遵循专业人员指示，不自行催吐。"}, {"group": 1, "n": 17, "q": "在山区旅游时，突遇泥石流或山体滑坡，导游应采取哪些紧急措施?", "match": null, "answer": "(1)引导旅游者逃生。不能在凹坡处停留，而应抛掉一切重物，迅速向山坡上坚固的高地或连片的石坡撤离。若是遭遇泥石流，可以就近选择林木密集地带逃生，但不要攀爬到树上躲避；若是遭遇山体滑坡，不要躲到有滚石和大量堆积物的山坡下方，无法继续逃避时，迅速抱住身边的树木等固定物体；\n(2)把握好逃生方向。切勿与泥石流或山体滑坡同向奔跑，而要两侧逃生，即逃跑线路与泥石流或山体滑坡成垂直方向；\n(3)等待救援。尽可能寻找平整高地集合队伍，然后发送求救信息等待救援。", "answer_en": "First, guide the tourists away from the danger zone. Leave heavy belongings behind, avoid low-lying areas and move to stable higher ground, following local emergency instructions.\nSecond, move to the side, away from the path of the mudflow or landslide, instead of running along its direction. Avoid areas below unstable slopes or falling rocks.\nFinally, gather the tourists at a safe location, contact rescue services and wait for rescue.", "answer_en_note": "英文口述稿概括为撤离危险区域、横向避险并遵从现场应急指引，不将教材中的地形判断当作普适操作。"}, {"group": 1, "n": 18, "q": "被洪水围困时，导游应如何带领旅游者进行自救?", "match": null, "answer": "(1)迅速转移所有人到地势高处等待救援，如山坡、高地、牢固的高层建筑等场所暂避；\n(2)尽快与救援部门取得联系，报告所在的方位和险情，耐心等待救援；\n(3)避开危险区域。不要接近或碰触电线杆、高压线铁塔，远离有电线掉落的水域，防止触电；不要爬到泥墙或危墙上，防止坍塌。不要轻易下水，以免遭受危险；\n(4)借助漂浮物逃生。被洪水围困且没有救援时，应保持冷静，设法收集或抓住身边的固定物与漂浮物，如门板、木头、塑料泡沫等，寻找机会逃生，在没有漂浮物傍身的情况下，切不可下水游泳转移，以防被洪水冲走。", "answer_en": "First, move everyone to safe higher ground, such as a hill or a sturdy high building.\nSecond, contact rescue services as soon as possible, report the location and situation, and wait for rescue.\nThird, avoid dangerous areas, especially fallen power lines, unstable walls and floodwater. Do not enter or swim through floodwater.\nIf trapped, stay calm, use a stable object or available flotation aid if needed to remain safe, and wait for rescue.", "answer_en_note": "英文口述稿强调避开洪水、等待专业救援，不自行涉水或游泳转移。"}, {"group": 1, "n": 19, "q": "旅游者与酒店工作人员发生纠纷，导游应如何处理?", "match": null, "answer": "(1)遵循旅游合同，防止矛盾扩大化，处理问题讲求有理、有利、有节，稳定旅游者情绪，引导旅游者理性维权；\n(2)做好书面记录，保存书证、物证、电子数据等证据；\n(3)及时向旅行社报告，反映接待纠纷的详细情况，并按旅行社要求采取必要的措施；\n(4)尽量保障后续旅游行程的执行，维护旅游者和旅行社的合法权益。", "answer_en": "First, follow the tour contract, prevent the dispute from escalating, reassure the tourist and help them protect their rights in a reasonable way.\nSecond, make a written record and preserve documents, physical evidence and electronic records.\nThird, report the situation to the travel agency promptly, explain the details and follow its instructions.\nFinally, try to keep the remaining itinerary on track and protect the lawful rights of both the tourists and the travel agency."}, {"group": 1, "n": 20, "q": "当旅游者遭遇社会骚乱等群体性事件时，导游应如何处理?", "match": null, "answer": "(1)立即向旅行社报告，反映旅游者遭遇群体性事件的详细情况，并向旅游者预警，引导旅游者采取相应的安全防范措施，同时配合现场警务人员指挥，组织旅游者有序撤离事发区域，若无警务人员现场指挥，立刻带领旅游者撤离事发区域；\n(2)旅游者人身、财物受到威胁的，根据现场条件，引导旅游者开展自救和互救，并及时带领旅游者脱离险境，全力保护旅游者的人身和财物安全；\n(3)稳定旅游者情绪，视情况变更或取消旅游行程，取消旅游行程的，协助旅游者返回出发地或旅游者指定的合理地点；\n(4)事件发生在境外的，领队应及时向中国驻当地使领馆或政府派出机构报告，并在其指导下，将旅游者妥善转移至安全区域，全力做好群体性事件的应对处置工作。", "answer_en": "First, report the situation to the travel agency immediately and warn the tourists. Follow police instructions and move the group away from danger in an orderly way.\nSecond, protect the tourists' personal safety and belongings, help anyone in danger, and take the group to a safe place.\nThird, reassure the tourists and adjust or cancel the itinerary as needed. If canceled, help them return to their departure point or another reasonable destination.\nIf abroad, report the situation to the Chinese embassy, consulate or relevant government representative and follow their guidance."}, {"group": 1, "n": 21, "q": "旅游过程中，发现游客有不尊重当地文化习俗的不当行为时，导游应如何处理?", "match": null, "answer": "当旅游者出现不当行为时，导游应当及时干预以维护旅游秩序，具体来说：\n(1)立即制止不当行为。发现有旅游者做出一些不当的行为，导游应当立即制止，不回避、不躲闪，要直面出现的问题；\n(2)指出其问题所在。导游应严肃并冷静地指出旅游者行为的不当之处，区分问题性质，并提醒其如果继续该行为可能会出现的严重后果；\n(3)及时报告相关部门。如旅游者不听导游劝阻和提醒，依然我行我素，导游就应及时将其不当行为汇报给旅行社，并在旅行社的协助之下，再汇报给相关主管部门，配合主管部门做好调查。", "answer_en": "First, intervene promptly and stop the inappropriate behavior to maintain order.\nSecond, calmly and firmly explain what is wrong, why the local custom should be respected and what consequences may follow.\nIf the tourist refuses to listen, report the situation to the travel agency promptly. With its help, report it to the relevant authorities and cooperate with their investigation."}, {"group": 1, "n": 22, "q": "旅游者由于宗教信仰、生活习惯、身体状况等原因，对餐饮有特殊要求，提出换餐，地陪导游应如何处理?", "match": null, "answer": "(1)如果所提要求在旅游协议中有明文规定的，地接社须早作安排，地陪导游在接团前应检查餐厅的落实情况，抵达餐厅时再次确定，不折不扣地兑现；\n(2)如果是旅游团抵达后提出的，需视情况而定：一般情况下地陪导游应与餐厅联系，在可能的情况下尽量满足；如确有困难，地陪导游应向旅游者说明情况，可协助其自行解决，并告知餐费自理，原餐费根据旅游合同约定处理。", "answer_en": "If the special meal requirement is specified in the tour contract, the local travel agency should arrange it in advance. The local guide should check with the restaurant before the group arrives and confirm the arrangement again on arrival.\nIf the request is made later, contact the restaurant and meet the request whenever possible. If it cannot be met, explain the situation patiently and help the tourist make alternative arrangements.\nTell them that the alternative meal is at their own expense and that the original meal charge will be handled according to the tour contract."}, {"group": 1, "n": 23, "q": "境外旅游团的旅游者，由于口味习惯等原因要求将中餐换成西餐， 地陪导游应如何处理?", "match": {"rank": "部分对应", "en": "The tourists of a group requested some time before meal that the Western-food meal reserved for them should be changed to Chinese food. What should the local guide do in answer to their request?", "zh": "旅游团的客人临时提出将原订西餐换成中餐，地陪应怎样处理？", "source": "广东·应变能力 Q08 · 第 43 页", "note": "注意：广东为西餐换中餐，江苏为中餐换西餐。", "answer_en": "(1) If their request (for substitution of Chinese food for Western food) was made 3 hours before the meal, the local guide should approach the restaurant and try to meet their requirement as far as possible.\n(2) If they asked for the change just before the meal, the local guide usually could refuse but must tell them why it could not be changed.\n(3) If they still insisted in making the change, the local guide could suggest that they order the meal themselves at their own expense.\n(4) Their request for additional dishes and beverage (in excess of the set price) could be granted provided they agreed to cover the extra charge.", "answer_zh": "（1）如游客在用餐前 3 小时提出换餐要求，地陪要尽量与餐厅联系，按有关规定办理；\n（2）若在接近用餐时才提出换餐，则一般不予接受，但导游人员应做好解释工作；\n（3）若游客坚持换餐，导游人员可建议他们自己点菜，费用自理；\n（4）游客要求加菜、加饮料等，应予以满足，但费用自理。"}, "answer": "(1)如果在用餐前3小时提出换餐要求，地陪导游应尽量与餐厅联系换餐，但需事先说明，如能换妥，差价由其自付；如计划中的供餐单位不具备供应西餐的能力，可考虑更换餐厅。\n(2)如果旅游者在接近用餐时提出换餐，应视情况而定：若餐厅有此服务，地陪导游应协助解决；若无此项服务，一般不应接受其要求，但应做好解释工作；若旅游者仍坚持换餐，可建议其点菜或协助其联系其他餐厅，费用自理，原餐费根据旅游合同的约定处理。", "answer_en": "If the request is made at least three hours before the meal, contact the restaurant and try to meet the request. Explain in advance that any extra cost is at the tourist's own expense. If the restaurant cannot serve Western food, consider another restaurant.\nIf the request is made shortly before the meal, help if the restaurant can meet it. Otherwise, explain the situation patiently.\nIf the tourist still insists, help them order separately or find another restaurant. The alternative meal is at their own expense, and the original meal charge will be handled according to the tour contract."}, {"group": 1, "n": 24, "q": "旅游者要求单独用餐，地陪导游应当如何处理?", "match": {"rank": "高度对应", "en": "What can the tour guide do if a couple of husband and wife in the group asked to have their meal in their hotel room?", "zh": "旅游团中，一对夫妇要求在客房自行用餐，导游人员怎样处置？", "source": "广东·应变能力 Q34 · 第 56 页", "answer_en": "(1) In this case the tour guide can ask the tour escort to help persuade them to have their meal with the group.\n(2) If they still insist in having their meal in their room, the tour guide can tell them that they can order a room service with the hotel restaurant at their own expense and that the service charge they have paid for the tour is not to be refunded.", "answer_zh": "（1）导游人员要耐心解释，并请领队劝其与团队一起用餐；\n（2）如游客仍坚持要在客房自行用餐，导游人员可告知其直接与餐厅联系送餐，但餐费自理，而且不能退还综合服务费。"}, "answer": "(1)如果是因为旅游团内部的矛盾或其他原因，个别旅游者要求单独用餐的，地陪导游要耐心解释，并请全陪导游或领队出面调解，如果旅游者坚持，导游可以协助与餐厅联系，但是餐费自理，并告知原餐费根据旅游合同约定处理；\n(2)如果旅游者因外出购物、看望亲友或疲劳等原因不能随团用餐的，导游在了解情况后，对旅游者第一时间予以关照，同意其要求，并告知原餐费根据旅游合同约定处理；\n(3)导游还应及时通知餐厅减少用餐人数。", "answer_en": "First, find out why the tourist wants to eat separately. If there is a disagreement within the group, explain the situation patiently and ask the national guide or tour escort to mediate.\nIf the tourist still insists, help them contact the restaurant. The separate meal is at their own expense, and the original meal charge will be handled according to the tour contract.\nIf they cannot join the group meal because of shopping, visiting relatives or tiredness, show concern and agree to the request.\nFinally, inform the restaurant promptly to adjust the number of diners."}, {"group": 1, "n": 25, "q": "住普通房的旅游者要求更换景观房，导游应如何处理?", "match": null, "answer": "(1)导游应与饭店联系，如有空房，可以满足，并告知景观房的费用与原标准不同，增加的费用旅游者需自理；\n(2)如饭店无法安排，请领队或者全陪导游在旅游团内互相调剂，如无法满足旅游者要求，导游应耐心做好解释工作。", "answer_en": "First, contact the hotel and check if a room with a view is available. Meet the request if possible, and explain that any extra cost is at the tourist's own expense.\nIf the hotel cannot arrange it, ask the tour escort or national guide to help rearrange rooms within the group. If the request still cannot be met, explain the situation patiently."}, {"group": 1, "n": 26, "q": "旅游者提出要调换入住的饭店，导游应当如何处理?", "match": null, "answer": "(1)导游应做好说服工作，告知旅游者所下榻的饭店是旅游合同约定的，一般不予更换；\n(2)如果旅行社实际安排的饭店低于旅游合同标准的，应向旅游者表示歉意，同时立即报告旅行社，请求迅速调整；\n(3)对不顾合同约定执意要求调换饭店的个别旅游者，应请领队或全陪导游出面劝其服从团队安排；\n(4)如旅游者不听劝阻，执意要求调换饭店，导游应协助该旅游者，但应告知原住宿费用不退，新产生的住宿费用自理；\n(5)如有其他特殊理由(情况),报告旅行社，听从旅行社安排。", "answer_en": "First, explain patiently that the hotel was agreed upon in the tour contract and normally cannot be changed.\nIf the hotel is below the agreed standard, apologize, report the situation to the travel agency immediately and ask for a quick replacement.\nIf a tourist insists on changing hotels, ask the national guide or tour escort to persuade them to follow the group arrangements.\nIf they still insist, provide assistance and explain that the original hotel charge will not be refunded and the new cost is at their own expense.\nFor any special circumstances, report the situation to the travel agency and follow its instructions."}, {"group": 1, "n": 27, "q": "旅游者要求在自由活动时单独外出购物，导游应如何处理?", "match": null, "answer": "(1)导游要给予力所能及的帮助，当好购物参谋，如建议他去哪家商场或购物街，帮忙联系出租车或网约车、对于外国旅游者可写中文便条等；\n(2)但在旅游团离开本地当天，旅游者单独外出购物的要求，导游应进行劝阻，以防发生误机(车、船)事故。", "answer_en": "First, provide help wherever possible. Recommend suitable shops or shopping streets, help arrange a taxi or ride-hailing service, and write a note in Chinese for foreign tourists if needed.\nHowever, on the day of departure, advise them not to go shopping alone, so that they do not miss their flight, train or ship."}, {"group": 1, "n": 28, "q": "旅游者要求自费观看文娱节目，导游应如何处理?", "match": {"rank": "部分对应", "en": "What is the right way for the local guide to deal with the recreational activity that is included or excluded in the group’s scheduled program?", "zh": "地陪应怎样安排好旅游团计划内和计划外的文娱活动？", "source": "广东·服务规范 Q15 · 第 26 页", "answer_en": "(1) If the activity is included in the group’s itinerary, the local guide is duty-bound to accompany the tourists to attend it and make them acquainted with the performance.\n(2) If it is not included in the group’s itinerary, for instance, if the tourists ask to watch a theatrical performance at their own expense, the local guide can help them with such things as buying admission tickets or hiring a taxi but usually he has no occasion to keep them company.\n(3) When the group is staying in a large place of recreation, the local guide should advise the tourists against separating themselves from the group. He must also keep an eye on the movement of the tourists and the condition of the surroundings so as to be prepared for any contingency.", "answer_zh": "（1）如果是计划内的文娱节目，地陪应陪同前往，并介绍情况;\n（2）如果是计划外的文娱活动（如游客提出自费观看文娱演出或参加某种娱乐活动），地陪一般应予以协助，但通常不陪同前往；\n（3）当游客要去大型娱乐场所活动时，地陪应提醒游客不要走散，并留意其动向和周围的环境，以防不测。"}, "answer": "(1)在时间允许的情况下，导游应积极协助。\n(2)如果是全团统一要求，导游应征得领队或全陪导游同意，让旅游者提出书面申请并签名，继而请示旅行社，由计调人员或导游本人联系落实购票，增加的全部费用由旅游者自理，导游按规范做好服务工作；对无法满足的要求，耐心解释。\n(3)如果是个别旅游者要求，导游协助旅游者订票；向其讲清时间和地点，强调安全等注意事项，为其联系车辆，并互留联系方式；告知旅游者活动的票款、交通等费用均由其自理现付；对无法满足的要求，耐心解释。\n(4)若时间不允许，导游也应做好耐心解释工作。", "answer_en": "If time permits, help the tourists meet their request.\nIf the whole group makes the request, obtain approval from the tour escort or national guide, ask for a signed written request and report it to the travel agency. Help arrange tickets and provide the necessary service. Explain that all extra expenses are at their own cost.\nIf an individual makes the request, help arrange tickets and transport, explain the time, place and safety precautions, and exchange contact details. They must pay the costs themselves.\nIf the request cannot be met or there is not enough time, explain the situation patiently."}, {"group": 1, "n": 29, "q": "旅游者到达目的地后，提出想让自己在当地的亲友随团活动，导游应如何处理?", "match": null, "answer": "(1)在条件允许(如车上有空位，不影响其他人)的情况下，可满足旅游者的要求，但事先要征得领队和旅游团其他成员的同意；\n(2)导游协助旅游者办理参团手续，交付相应的费用；\n(3)导游对旅游者随团活动的亲友应热心服务，一视同仁，并根据情况给予照顾；\n(4)如果旅游者亲友不办理手续、不交纳费用就直接随团活动，导游应礼貌地向旅游者及亲友解释旅行社的规定，并做好解释工作。", "answer_en": "If conditions permit, for example if there are spare seats and the arrangement will not affect others, try to meet the request. First, obtain the consent of the tour escort and the other group members.\nSecond, help the relatives or friends complete the formalities for joining the group and pay the required fees.\nThird, welcome them warmly and treat them equally with the other tourists.\nIf they try to join without completing the formalities or paying, explain the travel agency's rules politely."}, {"group": 1, "n": 30, "q": "某旅游者因家中有事需要提前离开旅游团，导游应当怎么做?", "match": {"rank": "高度对应", "en": "What should the tour guide do if a foreign tourist in the group insists that, for a certain reason, he must stop traveling and leave China for home ahead of schedule?", "zh": "有一外国游客，因有要事要求提前离团回国，导游员应如何处理？", "source": "广东·应变能力 Q36 · 第 56–57 页", "answer_en": "(1) Usually, such request of the tourists should be granted, but the unused part of the service charge included in the travel fare will not be refunded or will be partly refunded according to the stipulations of the tourist agreement. The tour guide must immediately report the matter to people concerned in the local travel service, who will consult the domestic tour organizer travel service.\n(2) With the consent of the domestic tour organizer travel service, the tour guide should help the tourist with such things as separating his visa from the group’s collective visa, booking his home-bound transport ticket and going through other formalities for leaving the group. All the expense incurred from these must be borne by the tourist himself.", "answer_zh": "（1）导游员应马上将游客的要求向旅行社汇报，经接待社与组团社协商后，可满足其要求；至于未享受的综合服务费，按旅游协议书规定可部分退还或不予退还；\n（2）导游员还要协助该游客重订交通票，办理分离签证及其他离团手续，所需费用由游客自理。"}, "answer": "(1)由旅游者提出退团书面申请并签名，经地接社与组团社协商后可予以满足，导游协助办理有关中途退团事宜，如退房、重订交通票等；\n(2)如外国旅游者入境是团体签证，要协助其办理分离签证手续；\n(3)所产生的费用由旅游者自理，未使用的旅游费用按照旅游者与旅行社签订的旅游合同约定协商处理。", "answer_en":
