"First, ask the tourist to submit and sign a written request to leave the group early. Report it to the local travel agency, which should consult the organizing travel agency.\nSecond, once agreed, help the tourist with the necessary procedures, such as checking out and rebooking transport. For a foreign tourist on a group visa, help arrange a separate visa if required.\nFinally, explain that any extra expenses are at the tourist's own cost and any unused tour fees will be handled according to the tour contract."}, {"group": 2, "n": 1, "q": "简述孙中山的生平（主要功绩）。", "answer": "孙中山本名孙文，号逸仙，1866年11月12日出生于广东香山（今中山市）翠亨村，早年求学海外，1892年毕业于香港西医书院，曾一度在澳门、广州等地行医，后弃医从政，于1905年在日本创立中国同盟会，提出了“民族、民权、民生”的三民主义学说。1911辛亥革命爆发，孙先生被推举为中华民国临时大总统，于1912年1月1日在南京宣誓就职，同年4月1日卸任。1915年与宋庆龄结婚，1919年将中华革命党改组为中国国民党，1924年创办了黄埔军校，1925年3月12日在北京去世，享年59岁。", "source": "2026江苏面试问答题及景点讲解要求 · 第 19 页"}, {"group": 2, "n": 2, "q": "中山陵的设计平面图有什么意义？", "answer": "中山陵的平面为“警钟形”，寓意警钟长鸣，唤起民众之意。", "source": "2026江苏面试问答题及景点讲解要求 · 第 19 页"}, {"group": 2, "n": 3, "q": "简述吕彦直的生平。", "answer": "吕彦直，祖籍安徽滁州，1894年出生于天津。早年在清华学堂毕业后，到美国康奈尔大学深造，得到美国著名建筑师茂菲的指导，回国后在上海开设了“彦记建筑事务所”。中山陵公开征求陵墓设计图时，31岁的吕彦直大胆报名应征，他设计的警钟形图案被一致评为首奖，之后吕彦直被聘为中山陵建筑师。由于呕心沥血日夜操劳，在工程即将竣工之际，遗憾地离开了人世，年仅35岁。除中山陵之外，吕彦直还设计了广州中山纪念堂和中山纪念碑。", "source": "2026江苏面试问答题及景点讲解要求 · 第 20 页"}, {"group": 2, "n": 4, "q": "中山陵是何时动工，何时完工的？", "answer": "中山陵于1926年1月15日破土动工，1931年年底完工，1932年1月25日正式验收，全部工程历时六年。", "source": "2026江苏面试问答题及景点讲解要求 · 第 20 页"}, {"group": 2, "n": 5, "q": "中山陵的墓址是如何选定的？", "answer": "孙中山先生生前就选定南京的紫金山为自己身后的归宿地。早在1912年曾与朋友在紫金山打猎，他看到这里前拥平川、背负青山、气势雄伟，便笑对左右说，“待我他日辞世后，愿向国民乞此一土，以安置躯壳尔。”先生临终前又再次嘱咐左右说：“吾死之后，可葬于南京紫金山，因南京为临时政府成立之地，所以不忘辛亥革命也。”指出了孙中山选择南京紫金山的根本原因。先生去世后，为尊重其遗愿，宋庆龄、孙科和葬事筹备处成员三登紫金山实地察看，确定了中山陵最终墓址。", "source": "2026江苏面试问答题及景点讲解要求 · 第 20 页"}, {"group": 2, "n": 6, "q": "中山陵的设计方案是如何确定的？", "answer": "中山陵是一项具有历史意义的重大工程，陵墓设计图案至关重要，最好的办法是举行一次设计竞赛，从中选出最佳图案，葬事筹备处决定实行悬奖的办法征求陵墓设计图案，公开登报，向全世界的建筑师和美术家广泛征求设计图。最终著名建筑师吕彦直设计的图案被一致评为首奖。", "source": "2026江苏面试问答题及景点讲解要求 · 第 20 页"}, {"group": 2, "n": 7, "q": "简述中山陵的三期工程。", "answer": "第一期工程于1926年1月15日动工，1929年春完工，包括祭堂、墓室、平台、石阶、围墙及石坡等；第二期工程于1927年11月开工，1929年春完工，包括水沟、石阶、护壁、挖土、填土等工程；第三期工程于1929年8月开工，1931年年底完工，工程包括牌坊、陵门、碑亭、围卫、卫士室等。", "source": "2026江苏面试问答题及景点讲解要求 · 第 20 页"}, {"group": 2, "n": 8, "q": "简述博爱坊上“博爱”二字的出处与含义。", "answer": "“博爱”出自唐代韩愈《原道》中的“博爱之谓仁”一语，中山先生毕生以伟大的博爱精神致力于资产阶级民主革命，为民族的独立自由奋斗不息，可以说“博爱”二字正是对他一生的高度概括和最好写照。", "source": "2026江苏面试问答题及景点讲解要求 · 第 20–21 页"}, {"group": 2, "n": 9, "q": "解释“天下为公”的出处。", "answer": "语出《礼记•礼运》：“大道之行也，天下为公。”天下为公是与“家天下”对立的思想，三民主义中“民权”所阐发的也正是这种思想。", "source": "2026江苏面试问答题及景点讲解要求 · 第 21 页"}, {"group": 2, "n": 10, "q": "简述碑亭中石碑的规格，以及石碑上所刻的内容。", "answer": "碑亭中的石碑高8.1米，宽4米，正面刻嵌金楷书“中国国民党葬总理孙先生于此中华民国十八年六月一日”。背面没有题写任何文字。", "source": "2026江苏面试问答题及景点讲解要求 · 第 21 页"}, {"group": 2, "n": 11, "q": "请问碑亭中石碑的背面为何没有铭文？", "answer": "据史载，当初讨论立碑时，铭文、墓志铭等花了两年时间也没写出来。大家都认为中山先生的思想功绩是文字所无法概括的，于是索性不写铭文。", "source": "2026江苏面试问答题及景点讲解要求 · 第 21 页"}, {"group": 2, "n": 12, "q": "碑亭到祭堂之间的平台上有些什么物品？", "answer": "第五层平台上有一对大铜鼎，上面刻有“奉安大典”四个篆字，是当时上海特别市政府捐赠的，大鼎壁上留有两个弹孔，据说是日军攻打南京时被炮弹击穿的；在第六层平台两侧，有一对青石狮，这是福建著名雕刻家蒋源成的第三代传人蒋文子设计制作；在最高一层平台两侧有一对仿古石鼎，是由孙先生的儿子孙科所赠。", "source": "2026江苏面试问答题及景点讲解要求 · 第 21 页"}, {"group": 2, "n": 13, "q": "请简述祭堂的建筑特色。", "answer": "祭堂现通称灵堂，是一座融中西建筑风格的宫殿式建筑，长30米、宽25米、高29米，外壁用香港花岗石建造，堂顶是中国传统的重檐歇山式，上覆蓝色琉璃瓦。", "source": "2026江苏面试问答题及景点讲解要求 · 第 21 页"}, {"group": 2, "n": 14, "q": "祭堂正中孙中山坐像底座四周六块浮雕的具体内容分别是什么？", "answer": "分别截取了孙先生从事革命活动的6个片段：正面一幅为“如抱赤子”，孙中山先生正在精心地为一个患病的幼儿治病；东面两幅是“出国宣传”和“商讨革命”，表现了孙中山先生早年奔走革命和创建同盟会的情形；背面一幅为“国会授印”，再现了辛亥革命后，议会向孙中山授大总统印的场面；西面两幅是“振聋发聩”，表现中山先生为唤起民众，向群众宣传革命的道理；另一幅是“讨袁护国”，内容是孙中山发表演说，号召人民讨伐倒行逆施的袁世凯。", "source": "2026江苏面试问答题及景点讲解要求 · 第 21 页"}, {"group": 2, "n": 15, "q": "祭堂内东西两侧护壁上分别是什么内容？", "answer": "东西两侧护壁上镌刻孙中山先生手书《建国大纲》全文。", "source": "2026江苏面试问答题及景点讲解要求 · 第 22 页"}, {"group": 2, "n": 16, "q": "墓室有几道门？分别刻有什么内容？", "answer": "墓室有二道门，第一道门门额上镌刻孙中山先生手书“浩气长存”四字，这四字原是孙中山为黄花岗烈士所题书的。第二道门上刻有“孙中山先生之墓”七个篆字，是张静江先生所书。", "source": "2026江苏面试问答题及景点讲解要求 · 第 22 页"}, {"group": 2, "n": 17, "q": "简述墓室内墓穴。", "answer": "孙中山先生的遗体，用一具美国制造的铜棺盛殓，安葬在墓圹下5米深的长方形墓穴内。墓穴用花岗石铺底，四周砌隔墙。铜棺棺盖上盖有国徽，前后两端的底侧，有铁质的横栓，供抬棺之用，棺盖的边上，还有开关棺盖的木旋。", "source": "2026江苏面试问答题及景点讲解要求 · 第 22 页"}, {"group": 2, "n": 18, "q": "三民主义的具体内容是什么？", "answer": "三民主义是孙中山先生所倡导的民主革命纲领。由民族主义、民权主义和民生主义构成，简称“三民主义”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 22 页"}, {"group": 2, "n": 19, "q": "五权宪法的具体内容是什么？", "answer": "五权宪法指的是“行政、立法、司法、监察、考试”五权分立的宪政体制。", "source": "2026江苏面试问答题及景点讲解要求 · 第 22 页"}, {"group": 2, "n": 20, "q": "孙中山先生临终前口述的三份遗嘱分别是什么？", "answer": "《遗嘱》《家事遗嘱》《致苏联遗书》，在这三份遗嘱里，他仍鼓励自己的同志努力国民革命，完成自己未竟的事业；对自己的伴侣安排妥当；最后号召党内的同志要联合苏联。", "source": "2026江苏面试问答题及景点讲解要求 · 第 22 页"}, {"group": 3, "n": 1, "q": "太湖鼋头渚风景区始建园林的时间及历史沿革是怎样的？", "answer": "鼋头渚园林始建于1916年。此后，众多社会名流与达官贵人纷纷在此营建私家花园和别墅，其中包括横云山庄、广福寺、陶朱阁、太湖别墅、陈园（若圃）、郑园等。中华人民共和国成立后，这些私家园林大多由政府接管，并合并成为“鼋头渚公园”。20世纪80年代起，景区展开大规模扩建，新增诸多景点，面积扩展至500公顷，如今已成为国家5A级旅游景区，成为太湖之滨的璀璨明珠。", "source": "2026江苏面试问答题及景点讲解要求 · 第 23 页"}, {"group": 3, "n": 2, "q": "著名诗人郭沫若对鼋头渚有何赞美之词？", "answer": "郭沫若以诗句“太湖佳绝处，毕竟在鼋头”盛赞鼋头渚，它生动地体现了鼋头渚的绝美风光在文人墨客心中的崇高地位。", "source": "2026江苏面试问答题及景点讲解要求 · 第 23 页"}, {"group": 3, "n": 3, "q": "鼋头渚的“渚”作何解释？其名称由来是什么？", "answer": "在地理概念中，湖中三面临水、一面连接陆地的半岛被称为“渚”。鼋头渚位于太湖西北岸，是一个横卧的半岛，因有巨石突出湖中，形状恰似神龟昂首，故而得名，此名称形象地描绘出其独特的地貌特征。", "source": "2026江苏面试问答题及景点讲解要求 · 第 23 页"}, {"group": 3, "n": 4, "q": "请简要介绍太湖。", "answer": "太湖是中国五大淡水湖之一，地处富饶的沪、宁、杭三角地中心，跨越江苏、浙江两省，北临无锡，南濒湖州，西依宜兴，东近苏州。太湖南缘恰为江浙两省分界线，整个湖面归属江苏省管辖。湖区岛屿众多，号称有48岛、72峰，湖光与山色相互辉映，素有“太湖天下秀”的美誉，自然风光美不胜收。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24 页"}, {"group": 3, "n": 5, "q": "太湖秀美的特色体现在哪些方面？", "answer": "太湖的美具有多面性。其一为典雅，这源于其丰富的文物古迹；其二是丰腴，不仅物产资源丰富，淡水鱼种类繁多，而且自然景观饱满；其三是浩渺，湖水浅而宽广，烟波浩渺，水天一色，远处山脉若隐若现；其四为清秀，巧妙融合自然景观与人文景观，两者相得益彰，共同营造出独特的美感。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24 页"}, {"group": 3, "n": 6, "q": "太湖有哪些别称？请说出中国的五大淡水湖。", "answer": "太湖的别称有震泽、笠泽、具区、五湖等。中国的五大淡水湖分别是江西的鄱阳湖、湖南的洞庭湖、江苏的太湖和洪泽湖以及安徽的巢湖，它们在我国的水资源和生态系统中都占据着重要地位。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24 页"}, {"group": 3, "n": 7, "q": "请介绍一下无锡人杰苑。", "answer": "无锡人杰苑坐落于鹿顶山麓的樱花林间，由人杰馆、雕塑像、演示厅等部分组成。这里集中展示了60多位无锡杰出先贤的生平事迹与卓越成就，集文化展示与教育功能于一体，成为富有特色的“梁溪山水客厅”和彰显无锡文化底蕴的“无锡文化名片”，是游客了解无锡人文历史的重要窗口。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24 页"}, {"group": 3, "n": 8, "q": "请简要介绍梅梁湖。", "answer": "梅梁湖南靠马山，北依龙山、大箕山、小箕山，中间分布着三山。东有湖东十二渚，西有湖西十八湾，中部矗立着充山、鹿顶宝界等山峰。山水相互交融，风景层次丰富，极具观赏性。每逢春季，太湖水在此处会呈现出神奇的景象，春涛仿若古梅在水面绽放，美妙绝伦。后人依据此典故，将鼋头渚到拖山、马山的太湖水域命名为“梅梁湖”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24 页"}, {"group": 3, "n": 9, "q": "如何解释“利涉”“问津”？", "answer": "在早期，游人前往鼋头渚需乘坐渡船。“利涉”在古文中有顺利渡河、舟楫的意思，而“问津”则出自《论语》中的“子路问津”，意为询问渡口、探寻打听。在1934年以前，鼋头渚只通水路，所以在此泊舟，穿过门楼，可一起开启探寻鼋头渚的山水之旅。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24 页"}, {"group": 3, "n": 10, "q": "“凤穿牡丹”照壁有何作用？", "answer": "“凤穿牡丹”照壁具有双重作用。一方面，蕴含着祝福大家富贵祥和的美好寓意；另一方面，从园林建筑的专业角度来看，它起到了“障景”的作用，避免背后的景色被一览无余，从而增添了园林景观的层次感与含蓄美，提升了整体的观赏性。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24 页"}, {"group": 3, "n": 11, "q": "长春桥为何在有限的范围内建成高耸的拱形桥？", "answer": "长春桥是仿照北京颐和园内的玉带桥建造而成。由于其跨度较小，较高的桥拱能够与在平静水面的倒影完美结合，形成线条优美的浑圆造型。而且，这种高耸的桥型设计使得樱花长堤更显舒展流畅，樱花分布错落有致，同时还增强了与对岸大箕山、小箕山之间的空间层次感，丰富了景观效果。", "source": "2026江苏面试问答题及景点讲解要求 · 第 24–25 页"}, {"group": 3, "n": 12, "q": "“藕花深处”景名出自何处？请背诵李清照的《如梦令》。", "answer": "“藕花深处”这一景名源自南宋女词人李清照的《如梦令》：“常记溪亭日暮，沉醉不知归路。兴尽晚回舟，误入藕花深处。争渡、争渡，惊起一滩鸥鹭。”此词生动地描绘了词人游玩时的有趣经历，也为景点增添了浓厚的文化氛围。", "source": "2026江苏面试问答题及景点讲解要求 · 第 25 页"}, {"group": 3, "n": 13, "q": "“鼋头渚”“鼋渚春涛”景名刻石分别由谁书写？", "answer": "“鼋头渚”景名刻石是清末“梁溪七子”之一的秦敦世所书，其书法笔力刚劲，为景点增添了文化韵味；“鼋渚春涛”刻石出自我国历史上最后一位状元刘春霖之手，字体飘逸洒脱，与景点的自然风光相得益彰。", "source": "2026江苏面试问答题及景点讲解要求 · 第 25 页"}, {"group": 3, "n": 14, "q": "如何理解摩崖石刻“包孕吴越”的内涵？", "answer": "“包孕吴越”由清末无锡县令廖纶题写，是太湖风景区内极具艺术功力的摩崖石刻。这四个字不仅涵盖了太湖横跨江浙两省的地理特征，还深刻点明了几千年来吴越文化作为中华文明重要组成部分所散发的璀璨光辉，更以生动的比喻赞美了太湖如同母亲一般，用其博大的胸怀滋养哺育了太湖流域的儿女，体现了太湖在地域文化和生态上的重要意义。", "source": "2026江苏面试问答题及景点讲解要求 · 第 25 页"}, {"group": 3, "n": 15, "q": "鼋头渚欣赏太湖美景的最佳地点在哪里？请背诵澄澜堂的著名楹联并说明作者。", "answer": "（1）澄澜堂是观赏太湖美景的绝佳之处。登上澄澜堂，极目远眺，太湖的壮丽景色尽收眼底，能够让游客全方位领略太湖的美。\n（2）澄澜堂的著名楹联为“山横马迹，渚峙鼋头，尽纳湖光开绿野；雨卷珠帘，云飞画栋，此间风景胜洪都”。此联由陈夔龙撰写，对仗工整，用词精妙，生动地描绘出鼋头渚的山水风光和独特韵味。", "source": "2026江苏面试问答题及景点讲解要求 · 第 25 页"}, {"group": 3, "n": 16, "q": "太湖鼋头渚风景区作为太湖观赏植物园，每年举办哪些花事节日？", "answer": "鼋头渚不仅自然风光秀丽，还是花卉品鉴的好去处。每年景区都会举办“樱花节”“兰花节”“花菖蒲节”等丰富多彩的花事节日。在这些节日期间，景区内繁花似锦，吸引众多游客前来观赏，成为当地重要的文化旅游活动。", "source": "2026江苏面试问答题及景点讲解要求 · 第 25 页"}, {"group": 3, "n": 17, "q": "请解释一下“明高忠宪公濯足处”刻石。", "answer": "“高忠宪公”指的是明末东林党重要领袖之一的高攀龙。“忠宪”是崇祯皇帝追封给他的谥号。高攀龙时常到鼋头渚湖滩洗脚，取意于“沧浪之水浊兮，可以濯我足”，以此表达他避世隐居、知足常乐的心境，此处刻石便是对这一历史典故的纪念。", "source": "2026江苏面试问答题及景点讲解要求 · 第 25 页"}, {"group": 3, "n": 18, "q": "为什么说樱花谷是国内最大的樱花专类园？", "answer": "樱花谷位于鼋头渚景区鹿顶山北麓，与中日樱花友谊林相邻且融为一体。园内种植了近百种樱花，数量多达3万余株，涵盖早樱和晚樱两个主要种类。凭借丰富的樱花品种和庞大的种植规模，樱花谷成为国内最大的樱花专类园。每年3月初至4月下旬，从早樱到晚樱依次盛开，鼋头渚也因此享有“中华第一赏樱胜地”的美誉，吸引着大量游客前来观赏。", "source": "2026江苏面试问答题及景点讲解要求 · 第 25–26 页"}, {"group": 3, "n": 19, "q": "广福寺内珍藏的镇寺三宝分别是什么？", "answer": "广福寺内的镇寺三宝分别是鸵鸟蛋、北宋古画《百鸟图》以及明末抗清义士杨紫渊的铁鞭。", "source": "2026江苏面试问答题及景点讲解要求 · 第 26 页"}, {"group": 3, "n": 20, "q": "我国唯一的兰花种植资源保护研究中心位于何处？", "answer": "我国唯一的兰花种植资源保护研究中心是江南兰苑，它坐落于鼋头渚景区南犊山庄北麓。江南兰苑是以栽培和观赏兰花为主的专类园林，园内收集了传统国兰品种500多个，洋兰品种100多个，并已成功栽培兰花品种400多个，其规模在全国首屈一指，在兰花种植资源保护和研究方面发挥着重要作用。", "source": "2026江苏面试问答题及景点讲解要求 · 第 26 页"}, {"group": 4, "n": 1, "q": "为什么苏州园林中都建有石舫？", "answer": "（1）水是园林四要素之一，以水上石舫建筑丰富园林的建筑形式；\n（2）苏州地处江南，以船代车是生活的必需，石舫的出现是对江南生活的艺术凝练；\n（3）苏州园林多为文人园林，石舫代言了庄子的“不系舟”，表达了古代文士对于潇洒自由生活的向往。", "source": "2026江苏面试问答题及景点讲解要求 · 第 34 页"}, {"group": 4, "n": 2, "q": "苏州古典园林中哪几处长廊最有代表性？", "answer": "（1）拙政园水廊；\n（2）留园爬山廊；\n（3）沧浪亭复廊。", "source": "2026江苏面试问答题及景点讲解要求 · 第 34 页"}, {"group": 4, "n": 3, "q": "拙政园最有特色的水廊在哪一部分？介绍该廊的主要特点。", "answer": "水廊在拙政园西部花园。特点：\n（1）几乎贴水而建，起伏轻缓，一波三折，从别有洞天处至倒影楼一路而来，高低错落，一波未平，一波又起，好像一湾湖水荡漾开的层层涟漪；\n（2）站在倒影楼回望水廊，倒影落在水面，轻柔曼妙，有唐诗“绿树荫浓夏日长，楼台倒影入池塘”描写的情景美；\n（3）淡化了水廊东侧粉墙过于单板生硬的线条，增强了“小河弯弯”的自然美。", "source": "2026江苏面试问答题及景点讲解要求 · 第 34–35 页"}, {"group": 4, "n": 4, "q": "卅六鸳鸯馆、十八曼陀罗花馆为当年园主听曲之处，请介绍该馆适合听曲的建构特征。", "answer": "（1）船篷满轩顶，起到了反射声波，扩音的作用；\n（2）四周建有四个耳房，可作演员化装的后台；\n（3）旧时南北厅堂充作舞台时，南面地面下的地龙，起到扩音作用，北面厅堂架在水上，也有渡曲扩音的作用。", "source": "2026江苏面试问答题及景点讲解要求 · 第 35 页"}, {"group": 4, "n": 5, "q": "名为“与谁同坐”的建筑，俗称什么？如此设计有哪些寓意和特点？", "answer": "该建筑是座亭，形同一把半敞开的扇子，台凳、匾额、窗户皆为扇形，所以俗称“扇亭”。设计寓意和特点：\n（1）因地制宜，亭子处在西部花园水湾的凸出部分，靠山面水，前敞后合，“扇形”顺应后窄前宽的地形要求；\n（2）妙趣谐音，扇亭与笠亭巧妙组成一把完整的扇子，因“扇”与“善”同音，表达了园林主人“处世与人为善”的心境和原则；\n（3）园主张履谦的祖上曾在山东济南府以制扇为业，他在补园修建扇亭的第三层含义，就是教导张家后人不忘制扇起家的先祖。", "source": "2026江苏面试问答题及景点讲解要求 · 第 35 页"}, {"group": 4, "n": 6, "q": "简述明式家具的特点。", "answer": "明式家具诞生于明代，是苏州家具制作的工艺流派，又称苏作家具。特点如下：\n（1）简，造型简洁利落符合人体工学原理，线条优美流畅是明式家具最优美的艺术语言；\n（2）朴，气韵浑厚，质朴隽永；\n（3）精，制作精益求精，代言了苏作工艺精工细作的特点；\n（4）雅，风格儒雅，不落俗套具有很高的文化内涵和艺术格调。", "source": "2026江苏面试问答题及景点讲解要求 · 第 35 页"}, {"group": 4, "n": 7, "q": "拙政园中部有副对联很贴切地表达“水的灵动，山的沉稳”，请说出这副对联。", "answer": "梧竹幽居：爽借清风明借月，动观流水静观山。", "source": "2026江苏面试问答题及景点讲解要求 · 第 35 页"}, {"group": 4, "n": 8, "q": "植物是园林中最为鲜活的元素，拙政园的古树花木冠各园之首，举出四个以上景点名称，并与植物相对应。", "answer": "芙蓉榭（荷花）、枇杷园（枇杷）、海棠春坞（海棠）、听雨轩（芭蕉）、待霜亭（橘子）、远香堂（荷花）、玉兰堂（白玉兰）、十八曼陀罗花馆（山茶）、秫香馆（水稻）、倚玉轩（竹子）等。", "source": "2026江苏面试问答题及景点讲解要求 · 第 35 页"}, {"group": 4, "n": 9, "q": "拙政园中以荷命名的建筑有哪些，它们都对应哪些诗词？（至少两个）", "answer": "远香堂宋代周敦颐《爱莲说》“香远亦清，亭亭净植”；留听阁——唐代李商隐《宿骆氏亭寄怀崔雍崔衮》“秋阴不散霜飞晚，留得枯荷听雨声”；香洲——唐代徐元固《棹歌行》“影入桃花浪，香飘杜若洲”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 35–36 页"}, {"group": 4, "n": 10, "q": "荷风四面亭的对联有哪些特点？", "answer": "四壁荷花三面柳，半潭秋水一房山。上联句是仿济南大明湖历下亭刘凤诰所撰名联“四面荷花三面柳，一城山色半城湖”而作，下联句出自唐代诗人李洞《山居喜友人见访》“看待诗人无别物，半潭秋水一房山”。对联点景切题，暗含四三二一的数字，以山水花木代言四季流转，对仗工整的独特语言，点题驻足于此，四季有景可观，四处有景可赏。", "source": "2026江苏面试问答题及景点讲解要求 · 第 36 页"}, {"group": 4, "n": 11, "q": "拙政园采用了许多园林构景手法，请举例说明（至少4处）。", "answer": "缀云峰的点景、抑景；芙蓉榭的框景；复廊花窗的漏景；中部花园的北寺塔的借景；远香堂南面黄石假山的障景等。", "source": "2026江苏面试问答题及景点讲解要求 · 第 36 页"}, {"group": 4, "n": 12, "q": "作为江南园林的杰出代表，拙政园将江南生活做了高度艺术凝练，请说出园中两组“小桥流水人家”的艺术构景。", "answer": "（1）站在梧竹幽居，通过圆洞门往南看，海棠春坞的花窗绿影，明代石桥“倚虹桥”与桥下碧水悠悠组成了“小桥流水人家”的温馨场景；\n（2）站在荷风四面亭眺望，临水而立的香洲、跨水的小飞虹，以及架在水面上的小沧浪组成了绝妙的水巷生活场景，一幅“小桥流水人家”的诗意情景跃然眼前。", "source": "2026江苏面试问答题及景点讲解要求 · 第 36 页"}, {"group": 4, "n": 13, "q": "拙政园被誉为后世园林之范本，其构景有独到之处。请说出园林中的几处“独一无二”。", "answer": "（1）小沧浪和小飞虹组成了我国园林中独一无二的水院，小沧浪两侧分别为得真亭和松风水阁，与对面的小飞虹这四个风格迥异的建筑把拙政园一隅的水围成了安静的水院，可抚琴，可观水，可听松风；\n（2）西部花园鸳鸯厅建筑，鸳鸯厅曾大量涌现在清同治、光绪年间的苏州，是具有极高辨识度的吴地建筑形式，同时鸳鸯厅四角设四耳房，显然借鉴了北方建筑的形式，这栋南北合璧的建筑，在中国古典园林中堪称孤例。", "source": "2026江苏面试问答题及景点讲解要求 · 第 36 页"}, {"group": 4, "n": 14, "q": "拙政园中部花园理水艺术被称为“一池三岛”，请问它源自哪里？说出与之对应的园林构景。", "answer": "“一池三岛”来自中国“蓬莱仙岛”的神话传说。传说东海之上有三座仙岛，分别名为：方丈、蓬莱、瀛洲。拙政园以园中之水比作东海，布局大小不一的岛屿象征海中岛屿。三座岛屿有亭以作分别：待霜亭、雪香云蔚亭、荷风四面亭。“一池三岛”分隔布局大园山水，岛屿间以曲桥相连，园林形成浅滩清流，山环水绕的境界。园林艺术称之为“大园理水宜散”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 36–37 页"}, {"group": 4, "n": 15, "q": "简述拙政园建园年代、名字取典由来。", "answer": "（1）拙政园始建于明正德四年（1509年），距今已有500多年历史；\n（2）明御史王献臣是拙政园的第一位园主，他因官场失意还乡后建造此园，取晋代潘岳《闲居赋》序文中“筑室种树，灌园鬻蔬……以供朝夕之膳……此亦拙者之为政也”句意命名，园名中的“拙”字蕴含着“绝不趋炎媚俗”的傲世情怀，且“拙”与“巧”相对，意喻君子不投机取巧，不偷奸耍滑，不趋炎附势，以石赤不夺的心性和情怀，弃仕途，离纷争，不计荣辱，不求功利，守拙回归田园，享受林泉之乐。", "source": "2026江苏面试问答题及景点讲解要求 · 第 37 页"}, {"group": 4, "n": 16, "q": "1961年3月4日，国务院颁布《文物保护暂行条例》，发布首批全国重点文物保护单位名单，共180个单位。其中仅有四家单位是古典园林，被专家誉为“中国四大名园”。请问，“中国四大名园”是哪四处园林？", "answer": "编号74苏州拙政园（明、清），江苏省苏州市；编号75北京颐和园（清），北京市海淀区；编号76承德避暑山庄（清），河北省承德市；编号77苏州留园（清），江苏省苏州市。", "source": "2026江苏面试问答题及景点讲解要求 · 第 37 页"}, {"group": 4, "n": 17, "q": "苏州共有9座古典园林分别在1997年、2000年入选世界文化遗产项目。请问，分别是哪些园林？", "answer": "1997年作为世界文化遗产苏州古典园林典型例证入选的是：拙政园、留园、网师园、环秀山庄（4座）；2000年作为世界遗产古典园林扩展项目入选的是：沧浪亭、狮子林、艺圃、耦园、退思园（5座）。", "source": "2026江苏面试问答题及景点讲解要求 · 第 37 页"}, {"group": 4, "n": 18, "q": "列举四个以上与拙政园有关的著名历史人物。", "answer": "明书画家文徵明、明书画家王心一、太平天国忠王李秀成、晚清政治家李鸿章、晚清吴县商业巨贾张履谦、昆曲传习所创办人张紫东等。", "source": "2026江苏面试问答题及景点讲解要求 · 第 37 页"}, {"group": 4, "n": 19, "q": "补园鸳鸯厅南北厅堂“卅六鸳鸯馆”“十八曼陀罗花馆”是谁题写？有何特殊之处？", "answer": "题写卅六鸳鸯馆和十八曼陀罗花馆两块匾额的，分别是苏州清末两位状元洪钧和陆润庠。苏州话中“洪、陆”与“红、绿”两字读音相同，苏州人因此戏称两位状元为“红绿状元”。这两位状元都是园主张履谦的至交。能同时请来两位状元为同一建筑题匾，在苏州可算绝无仅有。", "source": "2026江苏面试问答题及景点讲解要求 · 第 37–38 页"}, {"group": 4, "n": 20, "q": "何为吴门画派？有何特点？", "answer": "吴门画派是明代中叶以来，苏州最重要的最具影响力的艺术画派，也是中国艺术有记载以来，延续时间最长、师承人数最多的艺术画派。代表人物为沈周、文徵明、唐寅、仇英。此画派首创了“庭院画”，如文徵明的《王氏拙政园记》、仇英的《辋川图》等；独创了“写景画”，如沈周的《吴中山水全景图》等。", "source": "2026江苏面试问答题及景点讲解要求 · 第 38 页"}, {"group": 5, "n": 1, "q": "花果山自古就有什么美誉？", "answer": "“东海第一胜境”“海内灵山”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 42 页"}, {"group": 5, "n": 2, "q": "花果山山门以西郁林观石刻中以唐隶宋篆两块石刻最为珍贵，堪称我国书法艺术史林中的勒刻瑰宝，请问唐隶宋篆名称分别是什么？", "answer": "唐隶宋篆名称分别是：唐隶《东海县郁林观东岩壁纪》，宋篆《祖无择三言诗勒》。", "source": "2026江苏面试问答题及景点讲解要求 · 第 42 页"}, {"group": 5, "n": 3, "q": "吴承恩自号是什么？", "answer": "吴承恩自号“射阳山人”“射阳居士”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 42–43 页"}, {"group": 5, "n": 4, "q": "请简述花果山三元宫的历史及特点。", "answer": "花果山的主庙叫三元宫，发迹于唐，重建于宋，敕赐和扩建于明，兴盛于清，是一座颇具影响力的寺庙。三元宫的特点是：道佛合一。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 5, "q": "花果山茶道“双绝”指的是什么？", "answer": "用花果山“惠心泉”的水泡云雾茶，是花果山茶道中的“双绝”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 6, "q": "水帘洞岩壁四周的石刻非常珍贵，请简述左上方“印心石屋”四字的来历。", "answer": "“印心石屋”四字是道光皇帝的手书。陶澍（太子少保、兵部尚书、两江总督）于道光十二年（1832年）奉命来海州改革盐政，成效卓著，因此皇帝给予他亲书室名的殊荣。三年后他又以钦差大臣身份再次来海州巡视盐政改革成效，并发起云台山庙宇的修缮工作。为纪念他的功绩，当地人将御书“印心石屋”移刻于水帘洞旁。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 7, "q": "花果山云雾茶的工艺特征和品质特征是什么？", "answer": "（1）花果山云雾茶的工艺特征：一级茶全以一芽一叶为原料，炒1斤干茶需6万-7万个芽头；\n（2）花果山云雾茶的品质特征：形似眉状，润绿显毫，香高持久，滋味鲜浓。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 8, "q": "简述花果山阿育王塔的特点。", "answer": "花果山阿育王塔特点有五个：一是历史悠久，有近千年的历史；二是根深蒂固，经历过郯城1668年8.5级大地震的洗礼，至今不歪不斜；三是塔形壮丽；四是既能看又能登，游客有登临的机会；五是有动人的神话传说。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 9, "q": "多宝佛塔命名的由来？", "answer": "据《法华经》记载，多宝佛是东方宝净世界的教主，亦称多宝如来，安置多宝如来之塔，称为多宝佛塔。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 10, "q": "花果山四大山珍指的是什么？", "answer": "花果山四大山珍指的是：云雾茶、葛藤粉、银杏、板栗。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 11, "q": "花果山仙人桥上回文诗的正确读法是什么？", "answer": "花果山仙人桥上回文诗的读法：聚仙桥上得逍遥，上得逍遥瑞气飘，瑞气飘香花结彩，香花结彩聚仙桥。", "source": "2026江苏面试问答题及景点讲解要求 · 第 43 页"}, {"group": 5, "n": 12, "q": "花果山上的“神”字是世界上最大的单体汉字摩崖石刻，1996年入选吉尼斯世界之最纪录，该“神”字有多大？选用了谁的手迹？", "answer": "花果山的“神”字长39.40米，宽15.80米，深0.6米。选用唐代大书法家怀素和尚草书“神”字手迹，放大后镌刻于此。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44 页"}, {"group": 5, "n": 13, "q": "《西游记》中叙述了七十二洞，请说出七十二洞的成因，并列举几个著名的洞名。", "answer": "花果山七十二洞是千万年前猛烈的造山运动留下的痕迹，许多巨大石块交叉垒叠，形成了气势雄浑的自然洞穴。著名的洞穴如海天洞、二仙洞、法龙洞、万佛洞、朝阳洞、啸云洞、莲花洞等。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44 页"}, {"group": 5, "n": 14, "q": "花果山七十二洞中最大的洞是哪一个？请说出“照海”的出处？", "answer": "花果山七十二洞中最大的一个洞是“海天洞”。“照海”二字取自宋苏东坡写海州石棚山“倚天照海花无数”的诗句。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44 页"}, {"group": 5, "n": 15, "q": "花果山最高峰是哪座山峰？海拔多少米？其最精彩的两个景观是什么？", "answer": "花果山最高峰玉女峰，海拔624.4米，是江苏省的最高峰。其最精彩的两个景观是：海上日出和云台铺海。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44 页"}, {"group": 5, "n": 16, "q": "花果山九龙桥又名万寿桥，坐落在琵琶岭下多条山涧汇集的九龙口，是前往三元宫的必经之路。九龙桥在明代“云台三十六景”和清代“云台二十四景”中分别称之为什么？", "answer": "明代“云台三十六景”称九龙桥为“长桥飞瀑”，清代“云台二十四景”中称之为“九涧争流”和“九桥喷雪”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44 页"}, {"group": 5, "n": 17, "q": "花果山山门何时建成？简述花果山山门的造型图案特色。", "answer": "花果山山门建成于1996年7月1日。门上方为孙悟空的头像，背衬圆形图案，象征功德圆满，终成正果。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44 页"}, {"group": 5, "n": 18, "q": "简单描述水帘洞的自然特色。", "answer": "水帘洞是一处天然裂隙洞穴，洞口有如“心”字，降水通过洞穴上方的裂隙渗流形成瀑布。山洞内冬暖夏凉。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44 页"}, {"group": 5, "n": 19, "q": "1993年6月国家邮电部发行四大名竹的《竹子》邮票，一套四张，其第二张就是连云港花果山的“金镶玉竹”。请说出金镶玉竹的特别之处。", "answer": "金镶玉竹是全国四大名竹之一，汇金玉两色于一体，“金”“玉”交替，犹如绿玉镶嵌在黄金之中，美丽淡雅。这种名贵珍稀之竹是连云港的独有品种，在云台山已生长繁殖了上千年。2003年连云港市正式将金镶玉竹确定为市竹。", "source": "2026江苏面试问答题及景点讲解要求 · 第 44–45 页"}, {"group": 5, "n": 20, "q": "花果山上有一块巨石，上面刻有“环瀛仰镜”四个，是谁书写的？这四个字的意思是什么？", "answer": "书写“环瀛仰镜”的是清代道人李瑞清，他是我国著名书画家张大千的启蒙老师。“环瀛”指环绕瀛洲仙岛的大海，泛指普天下，“仰镜”比喻为仰面朝上的明镜，意指抬头望着天上镜子般的明月，“环瀛仰镜”意指全天下人都敬仰。", "source": "2026江苏面试问答题及景点讲解要求 · 第 45 页"}, {"group": 6, "n": 1, "q": "周恩来纪念馆什么时候开始对外开放？", "answer": "1992年1月6日。", "source": "2026江苏面试问答题及景点讲解要求 · 第 46 页"}, {"group": 6, "n": 2, "q": "周恩来纪念馆是哪一年被评为国家5A级旅游景区的？", "answer": "2015年10月。", "source": "2026江苏面试问答题及景点讲解要求 · 第 46 页"}, {"group": 6, "n": 3, "q": "在南北八百米长的中轴线上依次有哪些建筑？", "answer": "瞻台、主馆、生平业绩陈列馆、铜像广场以及仿北京中南海西花厅。", "source": "2026江苏面试问答题及景点讲解要求 · 第 46 页"}, {"group": 6, "n": 4, "q": "法国巴黎塞纳河左岸有一家咖啡馆曾以接待过政治文化艺术界名人而闻名全球，这家咖啡馆叫什么？", "answer": "花神咖啡馆。", "source": "2026江苏面试问答题及景点讲解要求 · 第 46 页"}, {"group": 6, "n": 5, "q": "瞻台由廊亭和两旁16米高的剑碑组成，剑碑为什么中间是空的？", "answer": "剑碑外框内空，无形胜似有形，寓含周恩来一生什么也没给自己留下，但他的伟大精神却如永恒挺立的丰碑，永远矗立在人民心中。", "source": "2026江苏面试问答题及景点讲解要求 · 第 46 页"}, {"group": 6, "n": 6, "q": "主馆两侧对称的石雕小品有什么寓意？", "answer": "两个蜡烛台，这是东方人祭奠先人的传统做法，这两座烛台也象征周恩来一生为民，像蜡烛一样燃烧了自己照亮了别人。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 7, "q": "周恩来纪念馆主馆总高度是26米、台阶有51级，26和51各有什么特殊含义？", "answer": "26米是为了纪念周恩来担任总理职务的时间达到了26年之久，51级台阶的设计是寓含周恩来在51岁时开始担任新中国政务院总理的职务。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 8, "q": "周恩来汉白玉坐姿塑像的形象含义是什么？", "answer": "塑像中的周恩来左手扶膝右手握卷，端坐在一块岩石上，目光炯炯地凝视着前方，仿佛在思索着祖国的今天和明天，运筹着共和国的四化大业。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 9, "q": "附馆与方形牌楼组成图案是什么？有何纪念意义？", "answer": "附馆和方形牌楼组成了“八一”图案，是为了纪念周恩来曾领导了著名的“八一”南昌起义。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 10, "q": "铜像广场中总理的铜像总高度是多少？", "answer": "高7.8米。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 11, "q": "总理的铜像为什么是双手叉腰的？", "answer": "取材于他60多岁时和工人农民亲切交谈时，双手叉腰，面带微笑。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 12, "q": "仿北京中南海西花厅的建筑风格是什么？", "answer": "清代风格的北方仿古园林四合院。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 13, "q": "仿西花厅前客厅中堂的国画《朝晖》作者是谁？", "answer": "白雪石和李延声。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 14, "q": "仿西花厅前客厅迎宾插屏上的毛泽东手迹内容是什么？", "answer": "努力为全中国人民和全世界人民服务。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 15, "q": "周恩来在前客厅会见外宾时，他同外宾的座位是怎样安排的？", "answer": "一般周恩来坐在东边主人位置上，西边是主要客人的客席座位，会见时如需翻译，就在后边加上两把椅子和一只小茶几就行了。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47 页"}, {"group": 6, "n": 16, "q": "仿西花厅前客厅一共有五间房间，有哪些领导人和周恩来在最西边的房间用过餐？（列举两位）", "answer": "越南的胡志明主席、柬埔寨的西哈努克亲王。", "source": "2026江苏面试问答题及景点讲解要求 · 第 47–48 页"}, {"group": 6, "n": 17, "q": "周恩来办公桌上原来在绿色幕布上有双层玻璃板，现在只剩下幕布的原因是什么？", "answer": "因为周恩来长期伏案办公，他衣服的肘部、胸部等部位经常会被磨坏，所以他就让人拿掉了玻璃台板，只放一块绿色的台布。", "source": "2026江苏面试问答题及景点讲解要求 · 第 48 页"}, {"group": 6, "n": 18, "q": "周恩来办公桌旁边的三部电话机为什么分不同的颜色？", "answer": "三部电话中红色话机是和毛泽东办公室直通的，另外两部均是与外线相连。", "source": "2026江苏面试问答题及景点讲解要求 · 第 48 页"}, {"group": 6, "n": 19, "q": "周恩来卫士值班室小黑板西边信号灯牌上十个灯光管的作用是什么？", "answer": "号码的接线分别接到前客厅、办公室、乒乓球室、卧室等。周恩来在这些室内活动时若需要卫士前去，只要一按电钮，表示那个房间号码的灯就亮了，卫士就可准确无误地赶到那个房间。", "source": "2026江苏面试问答题及景点讲解要求 · 第 48 页"}, {"group": 6, "n": 20, "q": "后客厅中堂墙上的《腊梅》画是谁送的？有什么意义？", "answer": "是何香凝在1950年8月8日送给周恩来和邓颖超的银婚纪念日的礼物。", "source": "2026江苏面试问答题及景点讲解要求 · 第 48 页"}, {"group": 6, "n": 21, "q": "周恩来床头的照片哪年拍摄于何地？叫什么名字？", "answer": "1949年10月，在颐和园石舫拍摄，叫“展望未来”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 48 页"}, {"group": 7, "n": 1, "q": "瘦西湖名称的由来？", "answer": "“瘦西湖”原名保障湖，清初扬州文人吴绮在《扬州鼓吹词序》中记载：“城北一水通平山堂，名瘦西湖，本名保障湖。”由书中记载，可见瘦西湖在清初便已得名，大概意思是因为其水道弯曲狭长，并地处扬州城的西北郊，故称为“瘦西湖”。清乾隆年间钱塘诗人汪沆游历扬州，将保障湖与杭州西湖作比较，并赋诗：“垂杨不断接残芜，雁齿虹桥俨画图。也是销金一锅子，故应唤作瘦西湖。”从此瘦西湖之名广为流传。", "source": "2026江苏面试问答题及景点讲解要求 · 第 52–53 页"}, {"group": 7, "n": 2, "q": "瘦西湖经历代开发，在清乾隆年间鼎盛时达到怎样的规模？", "answer": "瘦西湖发展到清代，因康熙和乾隆的屡次“南巡”，盐商竞相争地构园，形成了“两堤花柳全依水，一路楼台直到山”的盛况，有二十四景著称于世。", "source": "2026江苏面试问答题及景点讲解要求 · 第 53 页"}, {"group": 7, "n": 3, "q": "瘦西湖作为中国湖上园林的杰出代表，其最大特点是什么？", "answer": "瘦西湖以其悠久的历史、丰富的人文景观、秀丽典雅的自然风韵、相互因借的艺术手法，融南秀北雄于一体的建筑风格，成为中国湖上园林的杰出代表。", "source": "2026江苏面试问答题及景点讲解要求 · 第 53 页"}, {"group": 7, "n": 4, "q": "请谈谈听鹂馆的出典。", "answer": "“听鹂”取自唐代冯贽的《云仙杂记》：“戴颗春携双柑斗酒，人问何之？曰‘往听黄鹂声’。”后来，“听鹂”就成为春游的代名词。", "source": "2026江苏面试问答题及景点讲解要求 · 第 53 页"}, {"group": 7, "n": 5, "q": "请简要介绍徐园听鹂馆前的铁镬。", "answer": "根据《铁镬碑记》记载，这是南北朝萧梁时期的遗物。镬，是中国最古老的器具之一。古人称，有足曰鼎，无足曰镬。镬在中国文化史中曾经扮演过多种角色，它曾经是礼器、盛器、佛器、刑具，在北方它还是消防工具。而扬州地处长江中下游，水患频发，因此古人铸铁镬倒扣在靠近堤坝的湖底，以镇水驱邪。这两只铁镬，每只重约三吨，至今保存完好，可见当年扬州冶炼技术的发达。", "source": "2026江苏面试问答题及景点讲解要求 · 第 53 页"}, {"group": 7, "n": 6, "q": "小金山山顶风亭的楹联采用了哪种特殊的格式？", "answer": "小金山山顶风亭楹联：“风月无边，到此胸怀何似；亭台依旧，羡他烟水全收。”采用了藏头联的格式，巧妙地将“风”“亭”二字藏于联首。", "source": "2026江苏面试问答题及景点讲解要求 · 第 53 页"}, {"group": 7, "n": 7, "q": "请说出小金山庭院中钟乳石盆景的来历及特点。", "answer": "此石为北宋花石纲遗物，形态上不同于一般钟乳石的柱状，而是呈船形。整体北高南低，像山川起伏，中间有水道蜿蜒，造型奇特，是天然形成的一块奇特盆景。", "source": "2026江苏面试问答题及景点讲解要求 · 第 53 页"}, {"group": 7, "n": 8, "q": "为什么说瘦西湖是没有“视觉污染”的景区？", "answer": "瘦西湖位于扬州城市中央，全程十多华里的河道周边几乎看不到任何现代化建筑的痕迹，有着完美的天际线和自然的水岸线，完整地保存了自然和谐的韵味。这在全国大型湖上园林里实属罕见。", "source": "2026江苏面试问答题及景点讲解要求 · 第 53 页"}, {"group": 7, "n": 9, "q": "请简述“枯木逢春”。", "answer": "“枯木逢春”是瘦西湖里的一处园林小品，主体高达6米，为市区唐代银杏遭受雷击后脱落的残片，经防腐处理后移植于瘦西湖，在旁边又栽一株凌霄攀附而上，每到春夏之际，凌霄绿叶繁花，好似古树复活，故此得名。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54 页"}, {"group": 7, "n": 10, "q": "请说说钓鱼台的建筑特点。", "answer": "钓鱼台是园林框景艺术的佳作，随着观赏角度的变化，西面的圆门成正圆，五亭桥横卧波光；南门的圆门呈椭圆，白塔直入云霄，两个最具城市代表性的建筑出现在同一幅画面当中，设计堪称绝妙。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54 页"}, {"group": 7, "n": 11, "q": "为什么五亭桥又叫莲花桥？", "answer": "五亭桥因建于莲花埂新河之上，又因五亭相聚，形似盛开的莲花，故又称莲花桥。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54 页"}, {"group": 7, "n": 12, "q": "以五亭桥为例，简述瘦西湖南秀北雄的建筑风格。", "answer": "五亭桥的五亭造型典雅秀丽，具有南方建筑的特点；桥基宽大厚实，具有北方建筑的风格。大小不同的券拱，使直线与曲线的搭配刚柔并济，在表现北方建筑稳重大方的同时，又体现南方建筑的玲珑剔透。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54 页"}, {"group": 7, "n": 13, "q": "园林建筑专家对扬州白塔有什么评价？", "answer": "著名建筑家陈从周在《园林谈丛》中说“扬州白塔比例秀匀，玉立亭亭，晴云临水，有别于北海塔的厚重工稳”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54 页"}, {"group": 7, "n": 14, "q": "白塔有哪些象征性的数字？", "answer": "塔座是砖雕的束腰须弥座，八角四面，每面三龛，龛内砖雕十二生肖像，象征一年十二个月，一天十二个时辰。五十三级台阶象征着善财童子五十三参。十三层相轮象征着佛教的十三天。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54 页"}, {"group": 7, "n": 15, "q": "请说说牡丹与芍药的区别。", "answer": "芍药是扬州市花之一，它外形酷似牡丹，两者相比较，可以从四个方面加以区分：看秆茎，牡丹的茎为木质，芍药的茎为草质；看花型，牡丹的花都是独朵顶生花型大，芍药的花则是一朵或数朵顶生并腋生，花型比牡丹小；看叶子，牡丹叶子上表面绿色中略带黄，芍药叶上下均为绿色，且较为浓密；看开花期，牡丹在暮春三月开花，芍药在春末夏初开花。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54 页"}, {"group": 7, "n": 16, "q": "请简述四相簪花的故事。", "answer": "北宋时，扬州太守韩琦发现花园里开了四朵特别的芍药花，花为紫红色，中间围有黄色的花蕊，类似官服的腰带，于是邀请了王珪、王安石、陈升之喝酒簪花，巧的是后来四人先后都做了宰相。这个品种的芍药后来被称为“金带围”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 54–55 页"}, {"group": 7, "n": 17, "q": "请简要介绍熙春台。", "answer": "熙春台是二十四桥区域主体建筑，“熙春”一词源自老子《道德经》中的“众人熙熙，如春登台”。该组建筑碧瓦朱甍，台上有楼，颇显皇家建筑的华美气概，前方有近2000平方米的平台，显示出“横可跃马，纵可方轨”之势。", "source": "2026江苏面试问答题及景点讲解要求 · 第 55 页"}, {"group": 7, "n": 18, "q": "请谈谈二十四桥常见的三种说法。", "answer": "关于二十四桥，常被提及的主要有三种说法：一是泛指唐代扬州桥多，历史上的扬州是座水城，水多，船多，自然桥也多；二是实指扬州过去有二十四座桥，其理由是，北宋科学家沈括所著《梦溪笔谈•补笔谈》有所记载；三是确指，即二十四桥特指一桥。清代李斗在《扬州画舫录》中说道：“廿四桥即吴家砖桥，一名红药桥，在熙春台后。”另有《重修扬州府志》卷十七中记道：此桥为隋炀帝月夜同宫女二十四人吹箫于桥上得名。", "source": "2026江苏面试问答题及景点讲解要求 · 第 55 页"}, {"group": 7, "n": 19, "q": "请简述“扬州八怪”。", "answer": "扬州八怪，是清康熙中期至乾隆末年活跃于扬州地区的一批风格相近的书画家总称，美术史上也常称其为“扬州画派”。扬州八怪较为公认的指金农、郑燮、黄慎、李鲤、李方膺、汪士慎、罗聘、高翔八人，其他被称为“扬州八怪”的还包括华、闵贞、高凤翰、李勉、陈撰、边寿民、杨法等。他们大多清高狂放，往往借书画抒发心胸志向、表达真情实感。其画风异于正统，不落俗套，因此称作“扬州八怪”。", "source": "2026江苏面试问答题及景点讲解要求 · 第 55 页"}, {"group": 7, "n": 20, "q": "请简单介绍扬派盆景历史及其特征。", "answer": "扬派盆景技艺始于唐宋，形成于元明，成熟于清代，享誉于当代，是中国盆景“五大流派”之一。它融“诗、书、画、技”为一体，堪称中国盆景艺术代表作。其“层次分明，严整平稳”的风格和“一寸三弯”的剪扎技巧，至今仍然是区别于其他各派盆景的最显著特征。2008年，盆景技艺（扬派盆景技艺）被列入《国家级非物质文化遗产名录》。", "source": "2026江苏面试问答题及景点讲解要求 · 第 55 页"}]; const names=["服务规范", "应变能力", "中山陵", "鼋头渚", "拙政园", "花果山", "周恩来纪念馆", "瘦西湖"];let group=0,index=0,all=false,filtered=[],lastScenic=2;const $=s=>document.querySelector(s);const esc=s=>(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));const num=n=>"Q"+String(n).padStart(2,"0");let reviewed={};try{reviewed=JSON.parse(localStorage.getItem("js-gd-guide-reviewed")||"{}")}catch{}
function key(c){return c.group+"-"+c.n}
function scenicCard(c){return `<article class="sheet active-card" data-card="${key(c)}"><header class="heading"><h1>${num(c.n)} · ${names[c.group]}</h1><label class="review-label"><input type="checkbox" class="review-checkbox" data-review="${key(c)}" ${reviewed[key(c)]?"checked":""}>已复习</label></header><p class="label">2026 江苏 · 景区知识问答</p><p class="question jiangsu">${esc(c.q)}</p><section class="comparison"><p class="label">中文参考答案</p><p class="reference-answer">${esc(c.answer)}</p><p class="card-sources">出处　${esc(c.source)}</p></section>${!all?`<div class="card-navigation"><button data-step="-1" ${index===0?"disabled":""}>上一题</button><button data-step="1" ${index===filtered.length-1?"disabled":""}>下一题</button></div>`:""}</article>`}
function card(c){if(c.group>=2)return scenicCard(c);const m=c.match;return `<article class="sheet active-card" data-card="${key(c)}"><header class="heading"><h1>${num(c.n)} · ${names[c.group]}</h1><label class="review-label"><input type="checkbox" class="review-checkbox" data-review="${key(c)}" ${reviewed[key(c)]?"checked":""}>已复习</label></header><p class="label">江苏 · 2025 中文原题</p><p class="question jiangsu">${esc(c.q)}</p><div class="answer-group"><p class="label">江苏 · 中文参考答案</p><p class="reference-answer">${esc(c.answer)}</p></div><div class="answer-group jiangsu-english"><p class="label">江苏 · 英文口述参考答案</p><p class="reference-answer" lang="en">${esc(c.answer_en)}</p>${c.answer_en_note?`<p class="note">${esc(c.answer_en_note)}</p>`:""}</div><section class="comparison"><div class="match-heading"><p class="label">广东 · 2026 中英对照原题</p><span class="tag ${!m?"none":m.rank==="高度对应"?"high":"partial"}">${m?m.rank:"未找到对应"}</span></div>${m?`<p class="original">${esc(m.zh)}</p><p class="question" lang="en">${esc(m.en)}</p><div class="answer-group"><p class="label">广东 · 中文参考答案</p><p class="reference-answer">${esc(m.answer_zh)}</p></div><div class="answer-group"><p class="label">广东 · 英文参考答案</p><p class="reference-answer" lang="en">${esc(m.answer_en)}</p></div><p class="card-sources">题干出处　${esc(m.source)}</p>${m.note?`<p class="note">${esc(m.note)}</p>`:""}`:'<p class="none-message">广东题库中暂未找到足够对应的题目。</p>'}</section>${!all?`<div class="card-navigation"><button data-step="-1" ${index===0?"disabled":""}>上一题</button><button data-step="1" ${index===filtered.length-1?"disabled":""}>下一题</button></div>`:""}</article>`}
function render(){let q=$("#note-search").value.trim().toLowerCase();filtered=cards.filter(c=>c.group===group&&(!q||[num(c.n),String(c.n),c.q,c.answer,c.answer_en,c.match?.zh,c.match?.en,c.match?.answer_zh,c.match?.answer_en,c.match?.rank].join(" ").toLowerCase().includes(q)));index=Math.min(index,Math.max(0,filtered.length-1));$("#sheet").innerHTML=(all?filtered:filtered.slice(index,index+1)).map(card).join("");$("#empty").hidden=!!filtered.length;$("#card-position").textContent=filtered.length?`${index+1} / ${filtered.length}`:"0 / 0";$("#search-summary").textContent=`${names[group]} · 共 ${filtered.length} 题`;$("#jump").innerHTML=filtered.map((c,i)=>`<option value="${i}">${num(c.n)} · ${esc(c.q.slice(0,24))}</option>`).join("");$("#jump").value=String(index);$("#jump").disabled=!filtered.length;document.querySelectorAll(".section-tab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.g==="scenic"?group>=2:+b.dataset.g===group)));$("#scenic-tabs").hidden=group<2;document.querySelectorAll(".scenic-tab").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.g===group)));$(".intro").textContent=group>=2?"2026江苏现场考试英语类指定六景区 · 中文原题及参考答案。未提供答案的思考题不列入本页。":"上方为江苏中文原题、中文参考答案与英文口述稿，下方为广东中英文原题及参考答案。高度对应表示考点相近，不代表题干完全相同。未匹配题目保留，便于后续补译。";document.querySelectorAll("[data-step]").forEach(b=>b.disabled=all||!filtered.length||(+b.dataset.step<0?index===0:index===filtered.length-1));$("#view-toggle").textContent=all?"切换到单张卡片":"切换到全部卡片"}
function step(d){if(all)return;index=Math.max(0,Math.min(filtered.length-1,index+d));render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if("g"in b.dataset){group=b.dataset.g==="scenic"?lastScenic:+b.dataset.g;if(group>=2)lastScenic=group;index=0;$("#note-search").value="";render()}else if("step"in b.dataset){step(+b.dataset.step)}else if(b.id==="view-toggle"){all=!all;document.body.classList.toggle("carousel",!all);render()}else if(b.id==="clear-search"){$("#note-search").value="";index=0;render()}else if(b.id==="print"){window.print()}});$("#note-search").addEventListener("input",()=>{index=0;render()});$("#jump").addEventListener("change",e=>{index=+e.target.value;if(all){document.querySelector('[data-card="'+key(filtered[index])+'"]').scrollIntoView({block:"start"})}else render()});document.addEventListener("change",e=>{if(e.target.matches("[data-review]")){reviewed[e.target.dataset.review]=e.target.checked;try{localStorage.setItem("js-gd-guide-reviewed",JSON.stringify(reviewed))}catch{}}});document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==="ArrowRight"){e.preventDefault();step(1)}else if(e.key==="ArrowLeft"){e.preventDefault();step(-1)}});render();
</script></body></html>
