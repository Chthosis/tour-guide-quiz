<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"错","stem":"北京中轴线北端为永定门，南端为北京鼓楼、钟楼。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“北端为北京鼓楼、钟楼，南端为永定门”。北京中轴线北端为\n\n北京鼓楼、钟楼，南端为永定门，纵贯北京老城，全长 7.8 公里。","clips":[]},{"n":2,"kind":"判断题","answer":"对","stem":"山西运城垣曲县发现的距今 4500 万年的灵长类动物化石命名为“世纪曙猿”，这一发现把类人猿出现的时间向前推进了 1000 万年。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。山西运城垣曲县发现过距今 4500 万年的灵长类动物化石，命名为“世\n\n纪睡猫”，这一发现把类人猿出现的时间向前推进了 1000 万年。","clips":[]},{"n":3,"kind":"判断题","answer":"错","stem":"天津杨柳青年画产生于明代崇祯年间，与山东潍坊年画并称“南桃北柳”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“与苏州桃花坞年画并称‘南桃北柳’”。杨柳青年画产生于中国\n\n明代崇祯年间，与苏州桃花坞年画并称“南桃北柳”。","clips":[]},{"n":4,"kind":"判断题","answer":"错","stem":"辽宁千山山城开创了高句丽民族构筑山城的先河。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“五女山山城”。五女山山城彰显了高句丽民族杰出的智慧和高\n\n超的建筑技艺，开了高句丽民族构筑山城的先河。","clips":[]},{"n":5,"kind":"判断题","answer":"对","stem":"山东潍坊是中国著名的风筝产地，明代就已在民间出现扎风筝的艺人，现在潍坊已成为国际风筝节的固定举办地。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。山东潍坊是中国著名的风筝产地，明代就已在民间出现扎风筝的艺人。\n\n赢得了“风筝艺术，潍坊第一”的美誉。现在潍坊已成为国际风筝节的固定举办地。","clips":[]},{"n":6,"kind":"判断题","answer":"对","stem":"北宋定都开封，当时开封人口超 100 万，为全国第一大城市，其商业贸易额占全国之半。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。北宋定都开封，当时开封人口超 100 万，为全国第一大城市，其商业\n\n贸易额占全国之半。","clips":[]},{"n":7,"kind":"判断题","answer":"对","stem":"江苏自古便是闻名遐迩的“水乡”和“鱼米之乡”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。江苏自古便是闻名遐迩的“水乡”和“鱼米之乡”。","clips":[]},{"n":8,"kind":"判断题","answer":"错","stem":"公元 264 年，西晋把南海、苍梧、郁林、高梁 4 个郡从交州划出，另设广州，广州由此得名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“东吴”。吴景帝永安七年（264 年），东吴把南海、苍梧、郁林、\n\n高梁 4 个郡（今两广大部）从交州划出，另设广州，州治番禺，广州由此得名。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"抗日战争时期，国民政府定重庆为陪都，重庆同华盛顿、巴黎、莫斯科一道被列为世界反法西斯四大指挥中心。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“伦敦”。抗日战争时期，国民政府定重庆为陪都，重庆同华盛\n\n顿、伦敦、莫斯科一道被列为世界反法西斯四大指挥中心。","clips":[]},{"n":10,"kind":"判断题","answer":"错","stem":"先后共有 13 个政权在陕西建都。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“14 个政权”。先后共有西周、秦、汉、西晋、隋、唐等 14 个\n\n政权在陕西建都。","clips":[]},{"n":11,"kind":"判断题","answer":"对","stem":"1936 年 10 月，中国工农红军三大主力在甘肃会宁大会师，标志着二万五千里长征胜利结束。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1936 年 10 月，中国工农红军三大主力在甘肃会宁大会师，标志着二\n\n万五千里长征胜利结束。","clips":[]},{"n":12,"kind":"判断题","answer":"错","stem":"1662 年 2 月，郑成功迫使西班牙总督签字投降，从西班牙殖民者手中收复了台湾。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“荷兰总督换一”。1662 年 2 月，郑成功迫使荷兰总督换一签字\n\n投降。郑成功从荷兰殖民者手中收复了中国领土台湾。郑成功因此被誉为民族英雄，在台湾\n\n亦被尊为“开台圣王”。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"福建九市一区全部获评国家森林城市，是全国最绿的省份。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。福建九市一区全部获评国家森林城市，森林覆盖率 65.85%，连续 47\n\n年保持全国第一，是全国最绿的省份。","clips":[]},{"n":14,"kind":"判断题","answer":"对","stem":"2025 年盘州至兴义高铁建成通车，贵州成为西南地区首个“市市通高铁”的省份。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2025 年盘州至兴义高铁建成通车，贵州成为西南地区首个“市市通\n\n高铁”的省份。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"川藏铁路从成都到拉萨，线路三起三落，累计爬升高度达 1.4 万米。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“八起八落”。从成都到拉萨，线路八起八落，累计爬升高度达\n\n1.4 万米，川藏铁路被称为世界上最难建的铁路。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"内蒙古呼伦贝尔的根河市曾有-58℃的记录，被称为“中国寒极”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“中国冷极”。东部林区最低气温一般低于-50℃，呼伦贝尔的根\n\n河市曾有-58℃的记录，被称为“中国冷极”。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"中华苏维埃共和国临时中央政府设在井冈山，故井冈山又有“红都”之称。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“瑞金”。中华苏维埃共和国临时中央政府设在瑞金，故瑞金有\n\n“红都”之称。","clips":[]},{"n":18,"kind":"判断题","answer":"对","stem":"黄山黔县国际乡村旅游度假区是全国首个以“村”字号命名的国家级旅游度假区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。黄山县国际乡村旅游度假区是全国首个以“村”字号命名的国家级旅\n\n游度假区。","clips":[]},{"n":19,"kind":"判断题","answer":"对","stem":"抗日战争时期，云南军民 9 个月时间抢修完成的滇缅公路一度成为当时国内唯一通往国外的战略运输通道。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。抗日战争时期，云南军民 9 个月时间抢修完成全长 959.4 公里的滇缅\n\n公路，创造了近代中国公路建筑史奇迹，滇缅公路一度成为当时国内唯一通往国外的战略运\n\n输通道。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"《格萨尔》史诗是世界上唯一一部至今还在不断创作的“活着的史诗”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《格萨尔》史诗是世界上唯一一部至今还在不断创作的“活着的史诗”，\n\n格萨尔文化的特性、多样性、活态性特征在国内外享有极高的声誉。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"1949 年中国人民政治协商会议第一届全体会议选举毛泽东为中央人民政府主席。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1949 年 9 月 21~30 日，中国人民政治协商会议第一届全体会议在北\n\n平隆重举行，大会通过起临时宪法作用的《中国人民政治协商会议共同纲领》，选举毛泽东\n\n为中央人民政府主席。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"安史之乱是唐朝由盛到衰的转折点，安史之乱后唐朝出现藩镇割据、宦官专权、农民起义三大痼疾。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。安史之乱是唐朝由盛到衰的转折点，安史之乱后唐朝出现藩镇割据、\n\n宦官专权、农民起义三大痼疾，直到公元 907 年被节度使朱温取代。","clips":[]},{"n":23,"kind":"判断题","answer":"对","stem":"禅宗奉菩提达摩为初祖，五祖弘忍是禅宗的实际创始人。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。唐时，五祖弘忍创建“东山法门”，为禅宗的实际创始人。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"禅让制传承到大禹时，被其子夏启破坏，改为王位世袭制。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。禅让制传承到大禹时，被其子夏启破坏，改为王位世袭制。","clips":[]},{"n":25,"kind":"判断题","answer":"对","stem":"1926 年 7 月 9 日，国民革命军在广州誓师北伐，直接目标是打击受帝国主义支持的北洋军阀。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1926 年 7 月 9 日，国民革命军在广州誓师北伐，直接目标是打击受\n\n帝国主义支持的北洋军阀。","clips":[]},{"n":26,"kind":"判断题","answer":"对","stem":"指南针在南宋时称为“罗盘”，用于导航。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。战国时使用“司南”。北宋时出现人工磁化制造的指南针，科学家沈\n\n括还发现了地磁偏角现象。南宋时出现导航用指南针，称为“罗盘”。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"宋元时期，珠算开始在中国广泛使用。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。宋元时期，珠算开始在中国广泛使用。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"加拿大素有“枫叶之国”的美誉，枫树是加拿大的国树。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。加拿大素有“枫叶之国”的美誉。枫树是加拿大的国树，也是加拿大\n\n民族的象征。","clips":[]},{"n":29,"kind":"判断题","answer":"错","stem":"认为“民为贵，社稷次之，君为轻”的思想家是孔子。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“民为贵，社稷次之，君为轻”是孟子（不是孔子）的主张。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"钟馗原是岁暮时张挂的门神，清代成为端午之神。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。钟馗原是岁暮时张挂的门神，清代成为端午之神。节日期间主要有赛\n\n龙舟、吃粽子、挂钟馗像、挂香袋、饮雄黄酒、插菖蒲、采药等活动，或煮水沐身以祛暑避\n\n邪。","clips":[]},{"n":31,"kind":"判断题","answer":"错","stem":"官式建筑中重檐歇山顶规格最高，如故宫太和殿。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，官式建筑中规格最高的是重檐庑殿顶（不是重檐歇山顶）。庑殿顶又\n\n有单檐和重檐之分，官式建筑中重檐庑殿顶规格最高，如故宫太和殿。","clips":[]},{"n":32,"kind":"判断题","answer":"错","stem":"社指谷物神，稷指土地神，社稷成为国家的象征。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，社指土地神，稷指谷物神（不是社指谷物神、稷指土地神）。社稷因\n\n此成为国家的象征。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"伊斯兰教中人数最多的派别是什叶派。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，伊斯兰教中人数最多的派别是逊尼派（不是什叶派）。逊尼派是伊斯\n\n兰教中人数最多的一派，中国穆斯林大多属于逊尼派。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"对联最基本的特点是平仄相谐。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，字句相等（不是平仄相谐）是对联最基本的特点。无论是寥寥几个字\n\n的短联，还是成百上千字的长联，其上下联皆必须字相对，句也相对，字句相等。这是对联\n\n最基本的特点。","clips":[]},{"n":35,"kind":"判断题","answer":"错","stem":"1937 年 7 月 7 日的卢沟桥事变，是中国人民抗日战争的起点，揭开了世界反法西斯战争的序幕。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，中国人民抗日战争的起点是九一八事变（不是卢沟桥事变），揭开了\n\n世界反法西斯战争的序幕。中国人民在白山黑水间的奋起抵抗，成为中国人民抗日战争的起\n\n点，同时揭开了世界反法西斯战争的序幕。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"别号是古代文人为自己取的雅号，如北宋苏轼号“东坡居士”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。别号是古代文人为自己取的雅号，如东晋道士葛洪号“抱朴子”，陶\n\n潜号“五柳先生”，北宋苏轼号“东坡居士”。","clips":[]},{"n":37,"kind":"判断题","answer":"对","stem":"李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。李大钊是在中国举起十月革命旗帜的第一人，是中国最早的马克思主\n\n义传播者。","clips":[]},{"n":38,"kind":"判断题","answer":"错","stem":"古人用十天干与十二地支相配计年，每 60 年一个轮回，称一个“二甲”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，每 60 年一个轮回称一个“甲子”（不是“二甲”）。计年时每 60 年一\n\n个轮回，称一个“甲子”或“花甲”。","clips":[]},{"n":39,"kind":"判断题","answer":"错","stem":"屈原是春秋时期楚国人，是我国第一位伟大的诗人。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，屈原是战国时期楚国（不是春秋时期）诗人。屈原是我国第一位伟大\n\n的诗人，他在楚地民歌的基础上汲取了中原文化而创造出楚辞，创作出《离骚》《九歌》《九\n\n章》《天问》等作品。","clips":[]},{"n":40,"kind":"判断题","answer":"错","stem":"每个月的初一叫望，最后一天叫晦，中间十五（大月十六）那天叫朔。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，每个月的初一叫朔（不是望），中间十五（大月十六）那天叫望（不\n\n是朔）。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"D","stem":"设计库容量 43 亿立方米，是华北地区最大的水库，也是北京最重要的地表饮用水水源地的是（    ）。","options":{"A":"官厅水库","B":"怀柔水库","C":"十三陵水库","D":"密云水库"},"explanation":"密云区建有密云水库，设计库容量 43 亿立方米，是华北地区最大的水库，也是北京\n\n最重要的地表饮用水水源地。A 项官厅水库位于河北怀来，C 项十三陵水库、B 项怀柔水库\n\n均非华北地区最大的水库，故不选。","clips":[]},{"n":42,"kind":"单项选择题","answer":"D","stem":"山西素有“中国古代建筑艺术博物馆”的美称，全国保存完好的宋、金以前的地面古建筑物（     ）以上在山西境内。","options":{"A":"50%","B":"60%","C":"80%","D":"70%"},"explanation":"山西素有“中国古代建筑艺术博物馆”的美称，全国保存完好的宋、金以前的地面古\n\n建筑物 70%以上在山西境内，其数量之多和历史价值、艺术价值之高居全国首位。","clips":[]},{"n":43,"kind":"单项选择题","answer":"D","stem":"下列艺术形式中，不属于辽宁极具民间特色的艺术形式的是（）。","options":{"A":"二人转","B":"辽剧","C":"海城高跷秧歌","D":"安塞腰鼓"},"explanation":"辽宁极具民间特色的艺术形式有二人转、辽剧、海城高跷秧歌等。安塞腰鼓是陕西省\n\n著名的汉族民俗活动，不属于辽宁极具民间特色的艺术形式。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":44,"kind":"单项选择题","answer":"B","stem":"全国普通话标准音采集的核心区域是河北承德（   ）。","options":{"A":"平山县","B":"滦平县","C":"遵化市","D":"易县"},"explanation":"滦平县为全国普通话标准音采集的核心区域。A 项平山县以革命圣地西柏坡著称，C\n\n项遵化市、D 项易县均与普通话标准音采集无关，故不选。","clips":[]},{"n":45,"kind":"单项选择题","answer":"A","stem":"1954 年被周恩来总理亲自命名为“杂技之乡”的是河北（   ）。","options":{"A":"沧州吴桥","B":"衡水饶阳","C":"保定白沟","D":"廊坊三河"},"explanation":"吴桥是我国杂技艺术的发祥地之一，被称作杂技艺术的摇篮，1954 年吴桥被周恩来\n\n总理亲自命名为“杂技之乡”。B 项饶阳、C 项白沟、D 项三河均非“杂技之乡”，故不选。","clips":[]},{"n":46,"kind":"单项选择题","answer":"B","stem":"现有有效药品批准文号 13634 个、总数位列全国第一的中药材产区是（     ）。","options":{"A":"武陵山区","B":"长白山区","C":"大小兴安岭","D":"秦巴山区"},"explanation":"吉林省长白山区现有有效药品批准文号 13634 个，总数位列全国第一。","clips":[]},{"n":47,"kind":"单项选择题","answer":"B","stem":"长春—满洲里—德国（简称“长满欧”）国际货运班列终点到达德国的（        ）。","options":{"A":"杜伊斯堡","B":"施瓦茨海德","C":"汉堡","D":"慕尼黑"},"explanation":"长春—满洲里—德国（简称“长满欧”）国际货运班列终点到达德国的施瓦茨海德，\n\n全程约 9800 公里。是国内运行的所有国际班列中，途经国家最少、运行时间最短、基础运\n\n行成本最低的班列。A 项杜伊斯堡、C 项汉堡、D 项慕尼黑均为德国城市，但不是“长满欧”\n\n班列的终点站，故不选。","clips":[]},{"n":48,"kind":"单项选择题","answer":"B","stem":"高 468 米，与左右两侧的南浦大桥、杨浦大桥一起形成“双龙戏珠”之势的是（    ）。","options":{"A":"上海中心大厦","B":"东方明珠广播电视塔","C":"金茂大厦","D":"上海环球金融中心"},"explanation":"东方明珠广播电视塔高 468 米，塔身由 11 个大小不一的球形结构组成，借鉴了“大\n\n珠小珠落玉盘”的诗意意境，它和左右两侧的南浦大桥、杨浦大桥一起，形成双龙戏珠之势。\n\nA 项上海中心大厦、C 项金茂大厦、D 项上海环球金融中心均为上海高层地标建筑，但与南\n\n浦大桥、杨浦大桥构成“双龙戏珠”的是东方明珠广播电视塔，故不选。","clips":[]},{"n":49,"kind":"单项选择题","answer":"A","stem":"江苏 1667 年因江南省东西分置而建省，得名于（   ）之首字。","options":{"A":"江宁府与苏州府","B":"江宁府与镇江府","C":"苏州府与常州府","D":"徐州府与扬州府"},"explanation":"1667 年，因江南省东西分置而建省，得名于“江宁府”与“苏州府”之首字。B 项镇\n\n江府、C 项常州府、D 项徐州府均非江苏得名来源，故不选。","clips":[]},{"n":50,"kind":"单项选择题","answer":"C","stem":"浙江海域面积 26 万平方千米，是全国岛屿最多的省份，其中为中国第四大岛的是（）。","options":{"A":"海南岛","B":"崇明岛","C":"舟山岛","D":"平潭岛"},"explanation":"浙江海域面积 26 万平方千米，是全国岛屿最多的省份。其中面积 502.65 平方千米的\n\n舟山岛为中国第四大岛。A 项海南岛为海南省第一大岛，B 项崇明岛是中国第三大岛、位于\n\n上海，D 项平潭岛位于福建，均非中国第四大岛，故不选。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":51,"kind":"单项选择题","answer":"C","stem":"20 世纪 60 年代开发的（   ）是我国最大的油田，也是世界上为数不多的特大型陆相砂岩油田之一。","options":{"A":"克拉玛依油田","B":"胜利油田","C":"大庆油田","D":"辽河油田"},"explanation":"20 世纪 60 年代开发的大庆油田是我国最大的油田，也是世界上为数不多的特大型陆\n\n相砂岩油田之一，目前已成为我国最大的石油生产基地。","clips":[]},{"n":52,"kind":"单项选择题","answer":"D","stem":"将驯鹿定为吉祥物、每年 6 月 18 日为共同节日的“瑟宾节”是（   ）的传统节日。","options":{"A":"鄂伦春族","B":"达斡尔族","C":"赫哲族","D":"鄂温克族"},"explanation":"愚宾节是鄂温克族重要的传统节日，每年 6 月 18 日为鄂温克族的共同节日“瑟宾节”，\n\n将驯鹿定为吉祥物。A 项鄂伦春族有古伦木省节，B 项达斡尔族参与五大连池药泉会，C 项\n\n赫哲族以捕鱼为生，均与“瑟宾节”不符，故不选。","clips":[]},{"n":53,"kind":"单项选择题","answer":"C","stem":"因作《聊斋志异》获誉“世界短篇小说之王”的山东文学家是（        ）。","options":{"A":"吴承恩","B":"罗贯中","C":"蒲松龄","D":"施耐庵"},"explanation":"蒲松龄因作《聊斋志异》获誉“世界短篇小说之王”。A 项吴承恩为《西游记》作者，\n\nB 项罗贯中为《三国演义》作者，D 项施耐庵为《水浒传》作者，均与《聊斋志异》无关，\n\n故不选。","clips":[]},{"n":54,"kind":"单项选择题","answer":"B","stem":"“四面荷花三面柳，一城山色半城湖”描绘的是素有“泉城”之称的山东（       ）。","options":{"A":"青岛","B":"济南","C":"烟台","D":"威海"},"explanation":"山东省省会济南素有“泉城”之称，“家家泉水，户户垂杨”“四面荷花三面柳，一城\n\n山色半城湖”的美景名扬四海。A 项青岛以啤酒和海滨风光著称，C 项烟台被称为“人间仙\n\n境”，D 项威海是甲午海战之地，均非“泉城”，故不选。","clips":[]},{"n":55,"kind":"单项选择题","answer":"C","stem":"福建水系密布，河流众多，全长 577 千米、是中国东南沿海地区流域面积最大的河流是（   ）。","options":{"A":"九龙江","B":"晋江","C":"闽江","D":"汀江"},"explanation":"福建水系密布，河流众多，闽江为全省最大河流，全长 577 千米，流域面积 60992\n\n平方千米，是中国东南沿海地区流域面积最大的河流。A 项九龙江、B 项晋江、D 项汀江均\n\n为福建河流，但非全省最大河流，故不选。","clips":[]},{"n":56,"kind":"单项选择题","answer":"A","stem":"简称“黄”或“徽”，古称新安、歙州、徽州，已有 2200 余年建城史的是安徽省的（   ）。","options":{"A":"黄山市","B":"安庆市","C":"宣城市","D":"池州市"},"explanation":"黄山市简称“黄”或“徽”，古称新安、歙州、徽州，已经有 2200 余年建城史。B 项\n\n安庆为“安徽”得名来源之一，C 项宣城、D 项池州均非古称新安、歙州、徽州的城市，故\n\n不选。","clips":[]},{"n":57,"kind":"单项选择题","answer":"C","stem":"我国跨经度最广的省级行政区是（   ）。","options":{"A":"新疆维吾尔自治区","B":"甘肃省","C":"内蒙古自治区","D":"西藏自治区"},"explanation":"内蒙古面积约 118.3 万平方千米，约占全国总面积的八分之一，居全国第 3 位，是我\n\n国跨经度最广的省级行政区。A 项新疆是我国面积最大的省级行政单位，B 项甘肃、D 项西\n\n藏均不是跨经度最广的省级行政区，故不选。","clips":[]},{"n":58,"kind":"单项选择题","answer":"C","stem":"（   ）是客家先民中原南迁的第一站，是目前海内外最大的客家聚居地，世称“客家摇篮”。","options":{"A":"闽西","B":"粤东","C":"赣南","D":"桂南"},"explanation":"赣州是客家先民中原南迁的第一站，是客家民系的发祥地和客家人的主要聚居地之一，\n\n赣州市的客家人口占 95%以上，赣南是目前海内外最大的客家聚居地，世称“客家摇篮”。A\n\n项闽西、B 项粤东、D 项桂南均为客家人聚居区域，但海内外最大的客家聚居地是赣南，故\n\n不选。","clips":[]},{"n":59,"kind":"单项选择题","answer":"D","stem":"素有“河山拱戴，形胜甲于天下”之誉的河南城市是（     ）。","options":{"A":"开封","B":"安阳","C":"郑州","D":"洛阳"},"explanation":"洛阳山川环抱、五水绕城，素有“河山拱戴，形胜甲于天下”之誉。A 项开封为北宋\n\n都城，C 项郑州为全国首个“米”字形高铁枢纽城市，B 项安阳以殷墟著称，均非“河山拱\n\n戴，形胜甲于天下”所指城市，故不选。","clips":[]},{"n":60,"kind":"单项选择题","answer":"A","stem":"有“京剧之母”美誉，是武汉代表性剧种的是（    ）。","options":{"A":"汉剧","B":"楚剧","C":"花鼓戏","D":"黄梅戏"},"explanation":"武汉文化具有浓郁的楚文化特色，是“高山流水遇知音”故事的发生地，其汉剧有“京\n\n剧之母”的美誉。B 项楚剧、C 项花鼓戏均为湖北地方剧种，D 项黄梅戏发源于湖北黄梅、\n\n发展壮大于安徽安庆，但有“京剧之母”美誉的是汉剧，故不选。","clips":[]},{"n":61,"kind":"单项选择题","answer":"A","stem":"“三湘四水”是湖南的又一称谓，其中“四水”指（      ）。","options":{"A":"湘江、资江、沅江、澧水","B":"湘江、资江、沅江、潇水","C":"潇水、蒸水、沅水、澧水","D":"湘江、漓水、资江、沅江"},"explanation":"“四水”指湘江、资江、沅江和澧水。B 项潇水、C 项蒸水均为湘江支流，属“三湘”\n\n得名来源，D 项漓水位于广西，均不属于“四水”，故不选。","clips":[]},{"n":62,"kind":"单项选择题","answer":"D","stem":"别称“羊城”“穗城”“花城”，被称为中国的“南大门”的是广东省的（       ）。","options":{"A":"汕头","B":"深圳","C":"珠海","D":"广州"},"explanation":"广州别称“羊城”“穗城”“花城”，是中国的“南大门”。B 项深圳别称“鹏城”，C\n\n项珠海、A 项汕头均为经济特区，均非“羊城”“穗城”“花城”，故不选。","clips":[]},{"n":63,"kind":"单项选择题","answer":"B","stem":"1972 年发现于广西北流市六靖镇、被誉为“铜鼓之王”的是（    ）。","options":{"A":"万家坝铜鼓","B":"汉代云雷纹大铜鼓","C":"翔鹭纹铜鼓","D":"冷水冲铜鼓"},"explanation":"1972 年，发现于广西北流市六靖镇的汉代云雷纹大铜鼓，被誉为“铜鼓之王”。A 项\n\n万家坝铜鼓出土于云南楚雄，C 项翔鹭纹铜鼓出土于广西贵港但非“铜鼓之王”，D 项冷水冲\n\n铜鼓出土于广西藤县，故不选。","clips":[]},{"n":64,"kind":"单项选择题","answer":"C","stem":"被称为“海参之王”，最长可达 1.2 米的海南省特有海珍是（    ）。","options":{"A":"刺参","B":"光参","C":"梅花参","D":"绿刺参"},"explanation":"梅花参是海南省特有的海珍，主要在南海诸岛海域出产。海参为“海产八珍”之首，\n\n尤以梅花参最为珍贵。梅花参最长可达 1.2 米，重 12~13 千克，故称“海参之王”。A 项刺\n\n参、B 项光参、D 项绿刺参均非海南省特有的“海参之王”，故不选。","clips":[]},{"n":65,"kind":"单项选择题","answer":"C","stem":"下列美食中，不属于海南四大名菜的是（   ）。","options":{"A":"文昌鸡","B":"嘉积鸭","C":"白切鸡","D":"和乐蟹"},"explanation":"文昌鸡、嘉积鸭、东山羊、和乐蟹是海南四大名菜，另有临高乳猪、石山塞羊、曲口\n\n海鲜和三亚三绝（梅花参、鲍鱼和鱼翅）全岛闻名。白切鸡是广东名菜，不属于海南四大名\n\n菜。","clips":[]},{"n":66,"kind":"单项选择题","answer":"B","stem":"被誉为“世界美食之都”的成都，其制作川菜的主要作料、有“川菜之魂”之称的是（   ）。","options":{"A":"涪陵榨菜","B":"郫县豆瓣","C":"保宁醋","D":"永川豆豉"},"explanation":"成都被誉为“世界美食之都”，郫县豆瓣是制作川菜的主要作料，有“川菜之魂”之\n\n称。A 项涪陵榨菜为重庆特产，C 项保宁醋、D 项永川豆豉均非“川菜之魂”，故不选。","clips":[]},{"n":67,"kind":"单项选择题","answer":"A","stem":"清政府下令从湖广省（湖北、湖南）和广东、福建等省大量移民四川，史称“湖广填四川”，若论城市则以湖北（   ）的移民最多。","options":{"A":"麻城","B":"孝感","C":"黄州","D":"武昌"},"explanation":"清政府下令从湖广省（湖北、湖南）和广东、福建等省大量移民四川，史称“湖广填\n\n四川”。移民总数上百万，其中湖广省人数最多，广东、福建客家人次之。若论城市则湖北\n\n麻城的移民最多。","clips":[]},{"n":68,"kind":"单项选择题","answer":"B","stem":"汇集了唐末两宋以来 5 万多尊摩崖石刻雕像，代表 9-13 世纪世界石窟艺术最高水平的是重庆（     ）。","options":{"A":"乐山大佛","B":"大足石刻","C":"安岳石刻","D":"潼南大佛"},"explanation":"大足石刻是大足区境内石窟寺及石窟造像的总称，是集儒、释、道三教造像于一体的\n\n大型石窟造像群。大足石刻汇集了唐宋两宋以来的 5 万多尊摩崖石刻雕像，代表了 9-13 世\n\n纪世界石窟艺术的最高水平，是重庆最具国际影响力的文化旅游品牌。A 项乐山大佛为世界\n\n现存最高的石刻弥勒佛坐像，C 项安岳石刻、D 项潼南大佛均非集儒、释、道三教造像于一\n\n体的大型石窟造像群，故不选。","clips":[]},{"n":69,"kind":"单项选择题","answer":"B","stem":"考古工作者在宝鸡市扶风县和岐山县发掘到，自清代以来出土大批占卜甲骨、大盂鼎、大丰簋、毛公鼎、散氏盘等珍贵青铜器的西周初期都城遗址是（       ）。","options":{"A":"半坡遗址","B":"周原","C":"石峁遗址","D":"蓝田猿人遗址"},"explanation":"考古工作者在宝鸡市扶风县和岐山县发掘到西周初期都城“周原”遗址，自清代以来\n\n这里已出土大批占卜甲骨、大盂鼎、大丰簋、毛公鼎、散氏盘等珍贵青铜器。A 项半坡遗址\n\n为新石器时代仰韶文化聚落遗址，C 项石峁遗址为龙山文化晚期城址，D 项蓝田猿人遗址为\n\n旧石器时代遗址，均非西周初期都城遗址，故不选。","clips":[]},{"n":70,"kind":"单项选择题","answer":"C","stem":"1983 年被国家旅游局确定为中国旅游标志的东汉青铜器铜奔马（又名马超龙雀），出土于甘肃省武威市（     ）。","options":{"A":"白塔寺","B":"天梯山","C":"雷台","D":"莫高窟"},"explanation":"被视为中国古代高超铸造业象征的东汉青铜器——铜奔马（又名马超龙雀），就出土\n\n于甘肃省武威市雷台的东汉墓，1983 年被国家旅游局确定为中国旅游标志，并一直沿用至\n\n今。A 项白塔寺是西藏纳入中国版图的见证地，B 项天梯山石窟被称为“石窟鼻祖”，D 项莫\n\n高窟被誉为“世界艺术宝库”，均非铜奔马出土地，故不选。","clips":[]},{"n":71,"kind":"单项选择题","answer":"A","stem":"为中国十大名茶之一的贵州名茶是（    ）。","options":{"A":"都匀毛尖","B":"湄潭翠芽","C":"凤冈锌硒茶","D":"雷山银球茶"},"explanation":"都匀毛尖为中国十大名茶之一。B 项湄潭翠芽、C 项凤冈锌硒茶、D 项雷山银球茶均\n\n为贵州茶叶名品，但均不在中国十大名茶之列，故不选。","clips":[]},{"n":72,"kind":"单项选择题","answer":"D","stem":"纳西族最具特色的妇女服饰是缀以圆形花片、双肩各有一个大的、背上并列七个小的，象征披星戴月的（     ）。","options":{"A":"凤凰装","B":"查尔瓦","C":"风花雪月头饰","D":"七星披肩"},"explanation":"纳西族最具特色的服饰是妇女的“七星披肩”，缀以圆形花片，双肩各有一个大的，\n\n背上并列七个小的，分别象征日、月、星辰，表示披星戴月、勤劳不息。A 项凤凰装是畲族\n\n女性传统服装，B 项查尔瓦是彝族服饰，C 项“风花雪月”的寓意体现在白族姑娘的头饰上，\n\n均非纳西族服饰，故不选。","clips":[]},{"n":73,"kind":"单项选择题","answer":"D","stem":"深达 5382 米，是地球上最深的峡谷的是（   ）。","options":{"A":"怒江大峡谷","B":"金沙江虎跳峡","C":"澜沧江梅里峡谷","D":"雅鲁藏布江大峡谷"},"explanation":"雅鲁藏布江为西藏第一大河，也是世界上海拔最高的大河。雅鲁藏布江大峡谷深达\n\n5382 米，是地球上最深的峡谷。A 项怒江大峡谷、B 项金沙江虎跳峡、C 项澜沧江梅里峡谷\n\n均非地球上最深的峡谷，故不选。","clips":[]},{"n":74,"kind":"单项选择题","answer":"A","stem":"一般用铜或银制、形似马蹄，为撒拉族妇女所钟爱的独特乐器是（   ）。","options":{"A":"口弦","B":"马头琴","C":"东布尔","D":"弹布尔"},"explanation":"“口弦”是撒拉族的一种独特乐器，一般用铜或银制，形似马蹄，为撒拉族妇女所钟\n\n爱。B 项马头琴为蒙古族代表性乐器，C 项东布尔、D 项弹布尔为哈萨克族、维吾尔族乐器，\n\n均非撒拉族妇女所钟爱的乐器，故不选。","clips":[]},{"n":75,"kind":"单项选择题","answer":"C","stem":"中国北方面积最大的丹霞地貌分布区，也是中国海拔最高的丹霞地貌群，位于宁夏西吉的（     ）。","options":{"A":"须弥山","B":"六盘山","C":"火石寨","D":"贺兰山"},"explanation":"西吉火石寨国家地质公园的丹霞地貌，是中国北方面积最大的丹霞地貌分布区，也是\n\n中国海拔最高的丹霞地貌群。A 项须弥山以石窟著称，B 项六盘山、D 项贺兰山均非丹霞地\n\n貌分布区，故不选。","clips":[]},{"n":76,"kind":"单项选择题","answer":"C","stem":"截至 2025 年年底，新疆民用运输机场数量达到（   ）个，在全国排名第一。","options":{"A":"24","B":"26","C":"28","D":"30"},"explanation":"航空运输方面，截至 2025 年年底，新疆民用运输机场数量达到 28 个，机场数量在全\n\n国排名第二，是全国覆盖面积最广、支线机场最多的机场网络。","clips":[]},{"n":77,"kind":"单项选择题","answer":"D","stem":"我国民族文学领域的“三大史诗”不包括（    ）。","options":{"A":"柯尔克孜族的《玛纳斯》","B":"藏族的《格萨尔》","C":"蒙古族的《江格尔》","D":"维吾尔族的《阿凡提的故事》"},"explanation":"柯尔克孜族的《玛纳斯》与藏族的《格萨尔》、蒙古族的《江格尔》一起，被誉为我\n\n国民族文学领域的“三大史诗”。在寓言故事中，维吾尔族的《阿凡提的故事》闻名遐迩，\n\n具有很高的文学地位。《阿凡提的故事》是寓言故事，不属于我国民族文学领域的“三大史\n\n诗”。","clips":[]},{"n":78,"kind":"单项选择题","answer":"B","stem":"世界上关于台湾最早的记述，是三国时期吴人沈莹留下的（         ）。","options":{"A":"《岛夷志略》","B":"《临海水土志》","C":"《东西洋考》","D":"《使琉球录》"},"explanation":"台湾有文字记载的历史可以追溯到公元 230 年。三国时期吴王孙权派 1 万多名官兵到\n\n达“夷洲”（今台湾），吴人沈莹的《临海水土志》留下了世界上关于台湾最早的记述。A 项\n\n《岛夷志略》为元代汪大渊所著，C 项《东西洋考》为明代张燮所著，D 项《使琉球录》为\n\n明代陈侃所著，均非世界上关于台湾最早的记述，故不选。","clips":[]},{"n":79,"kind":"单项选择题","answer":"A","stem":"澳门会展业具有较高的国际知名度和竞争力，曾获评（      ）。","options":{"A":"最佳亚洲会议城市","B":"最佳亚洲会展城市","C":"最佳亚洲旅游城市","D":"最佳亚洲商务城市"},"explanation":"澳门会展业也具有较高的国际知名度和竞争力，曾获评“最佳亚洲会议城市”。","clips":[]},{"n":80,"kind":"单项选择题","answer":"B","stem":"“三巴”是葡语（   ）的粤语音，大三巴牌坊因此得名。","options":{"A":"圣方济各","B":"圣保禄","C":"圣母玫瑰","D":"圣若瑟"},"explanation":"“三巴”是葡语“圣保禄”的粤语音。大三巴牌坊为“澳门八景”之一，是澳门的象\n\n征，是圣保禄教堂正面前壁的遗址。A 项圣方济各、C 项圣母玫瑰、D 项圣若瑟均非“三巴”\n\n的葡语来源，故不选。","clips":[]},{"n":81,"kind":"单项选择题","answer":"A","stem":"世界文化遗产“土司遗址”由（   ）联合申报。","options":{"A":"湖南、贵州、湖北","B":"湖南、重庆、贵州","C":"贵州、云南、广西","D":"湖北、重庆、湖南"},"explanation":"“土司遗址”由湖南、贵州、湖北联合申报。","clips":[]},{"n":82,"kind":"单项选择题","answer":"C","stem":"2025 年列入《非物质文化遗产优秀实践名录》的是（    ）保护计划。","options":{"A":"蒙古族长调","B":"福建木偶戏传承人培养","C":"赫哲族伊玛堪","D":"维吾尔木卡姆"},"explanation":"2025 年 12 月，“赫哲族伊玛堪”保护计划选入优秀保护实践名册。A 项蒙古族长调、\n\nD 项维吾尔木卡姆为《人类非物质文化遗产代表作名录》项目，B 项福建木偶戏传承人培养\n\n计划于 2012 年列入优秀实践名录，故不选。","clips":[]},{"n":83,"kind":"单项选择题","answer":"A","stem":"中国北方最大的佛事活动场所，寺内通高 27.21 米的金漆木雕千手千眼观世音菩萨被载入世界吉尼斯大全的是河北承德（    ）。","options":{"A":"普宁寺","B":"独乐寺","C":"隆兴寺","D":"普陀宗乘之庙"},"explanation":"普宁寺是中国北方最大的佛事活动场所，寺中通高 27.21 米的金漆木雕千手千眼观世\n\n音菩萨被载入世界吉尼斯大全，极具宗教艺术魅力。B 项独乐寺位于天津蓟州，C 项隆兴寺\n\n位于河北正定、有“京外名刹之首”之称，D 项普陀宗乘之庙为承德外八庙之一，均非中国\n\n北方最大的佛事活动场所，故不选。","clips":[]},{"n":84,"kind":"单项选择题","answer":"C","stem":"被誉为“羲皇故里”“陇上江南”，相传是伏羲、女娲诞生地的甘肃城市是（     ）。","options":{"A":"兰州市","B":"武威市","C":"天水市","D":"张掖市"},"explanation":"天水被誉为“羲皇故里”“陇上江南”，拥有 8000 年文明史和 2700 多年建城史，相传\n\n是伏羲、女娲诞生地。","clips":[]},{"n":85,"kind":"单项选择题","answer":"D","stem":"早期道教“五斗米道”的创始人是（   ）。","options":{"A":"王重阳","B":"葛洪","C":"张角","D":"张陵"},"explanation":"在蜀中鹤鸣山（今四川省大邑县境内），有张陵（又称张道陵、张“天师”）在传播道\n\n教，因信徒入教必须交五斗米，故名“五斗米道”。","clips":[]},{"n":86,"kind":"单项选择题","answer":"C","stem":"有“南半球的纽约”之称的澳大利亚第一大城市是（       ）。","options":{"A":"堪培拉","B":"布里斯班","C":"悉尼","D":"墨尔本"},"explanation":"悉尼位于澳大利亚东南部，是新南威尔士州的首府，澳大利亚第一大城市，也是经济、\n\n文化、金融、航运和旅游的中心，有“南半球的纽约”之称。","clips":[]},{"n":87,"kind":"单项选择题","answer":"C","stem":"独具短报文通信服务功能的我国卫星导航系统是（       ）。","options":{"A":"伽利略系统","B":"GPS 系统","C":"北斗卫星导航系统","D":"格洛纳斯系统"},"explanation":"自主建设、独立运行、独具短报文通信服务功能的北斗卫星导航系统成为与美国全球\n\n定位系统（GPS）、俄罗斯格洛纳斯系统、欧洲伽利略系统并列的全球四大卫星导航系统之一。","clips":[]},{"n":88,"kind":"单项选择题","answer":"D","stem":"1928 年 2 月初步形成的农村革命根据地是（   ）。","options":{"A":"赣南闽西根据地","B":"湘鄂西根据地","C":"陕甘根据地","D":"井冈山革命根据地"},"explanation":"1928 年 2 月，井冈山革命根据地初步形成。毛泽东、朱德领导下的赣南闽西根据地\n\n是当时全国面积最大、力量最强的根据地，建立了苏区中央局和苏维埃中央政府，因此又称\n\n为中央根据地、中央苏区。","clips":[]},{"n":89,"kind":"单项选择题","answer":"D","stem":"下列属于冰川湖的是（   ）。","options":{"A":"鄱阳湖","B":"镜泊湖","C":"杭州西湖","D":"新疆喀纳斯湖"},"explanation":"冰川湖：由冰川侵蚀形成的凹地积水成湖，如新疆喀纳斯湖。","clips":[]},{"n":90,"kind":"单项选择题","answer":"C","stem":"世界上最长、被誉为桥梁界“珠穆朗玛峰”的跨海大桥是（            ）。","options":{"A":"东海大桥","B":"杭州湾跨海大桥","C":"港珠澳大桥","D":"胶州湾跨海大桥"},"explanation":"10 月 23 日，世界上最长的跨海大桥港珠澳大桥（55 千米）开通仪式在广东省珠海市\n\n举行。这一超级工程集桥梁、隧道和人工岛于一体，其建设难度之大，被誉为桥梁界的“珠\n\n穆朗玛峰”。","clips":[]},{"n":91,"kind":"单项选择题","answer":"C","stem":"元代总结南北农业经验、绘制 200 多幅农具图的农书是（      ）。","options":{"A":"《农桑辑要》","B":"《齐民要术》","C":"王祯《农书》","D":"《汜胜之书》"},"explanation":"元代中期王祯著《农书》，特点是既讲北方也总结南方农业生产的经验，还绘制了 200\n\n多幅农具图，弥补了前人著作的缺陷。","clips":[]},{"n":92,"kind":"单项选择题","answer":"B","stem":"蝴蝶泉联“前生疑是庄周化”中的“庄周化”指的是（）。","options":{"A":"“庄周鼓盆”","B":"“庄周梦蝶”","C":"“庖丁解牛”","D":"“庄周贷粟”"},"explanation":"蝴蝶舞翻斑，为万紫千红飞去飞来，前生疑是庄周化。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":93,"kind":"单项选择题","answer":"A","stem":"关于唐三彩中的蓝色釉，下列说法正确的是（）。","options":{"A":"是中国最早的以钴土作彩料所呈现的釉色","B":"是唐三彩的主要釉色","C":"只在宫廷瓷器中使用","D":"以铁为主要呈色剂"},"explanation":"唐三彩以黄、绿、白三色为主，但也有紫、褐、蓝等色，其中蓝色是中国最早的以钴\n\n土作彩料所呈现的釉色。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":94,"kind":"单项选择题","answer":"C","stem":"中国佛教的创造阶段和鼎盛时期是（   ）。","options":{"A":"明清两代","B":"秦汉两代","C":"隋唐两代","D":"宋元两代"},"explanation":"隋唐两代是汉地佛教的创造阶段和鼎盛时期。","clips":[]},{"n":95,"kind":"单项选择题","answer":"D","stem":"世界上最早的天文学著作是战国时期的（      ）。","options":{"A":"《授时历》","B":"《周髀算经》","C":"《梦溪笔谈》","D":"《甘石星经》"},"explanation":"战国时期的《甘石星经》是世界上最早的天文学著作，记录了 800 多个恒星的名字。","clips":[]},{"n":96,"kind":"单项选择题","answer":"C","stem":"中国人民抗日战争胜利纪念日是（    ）。","options":{"A":"8 月 15 日","B":"9 月 2 日","C":"9 月 3 日","D":"9 月 9 日"},"explanation":"9 月 3 日成为中国人民抗日战争胜利纪念日。","clips":[]},{"n":97,"kind":"单项选择题","answer":"A","stem":"南传佛教又称（   ）。","options":{"A":"上座部佛教","B":"大乘佛教","C":"密乘佛教","D":"藏传密教"},"explanation":"南传佛教以小乘佛教（上座部佛教）为主。","clips":[]},{"n":98,"kind":"单项选择题","answer":"C","stem":"世界著名的“五一棚”大熊猫野外观测站位于（        ）。","options":{"A":"神农架自然保护区","B":"扎龙自然保护区","C":"四川卧龙自然保护区","D":"西双版纳自然保护区"},"explanation":"四川卧龙自然保护区位于四川省汶川县西南部，是我国建立最早，栖息地面积最大，\n\n以保护大熊猫、小熊猫、金丝猴等珍稀动物以及高山森林生态系统为主的综合性自然保护区，\n\n是世界自然遗产“四川大熊猫栖息地”中最重要的核心保护区，有世界著名的“五一棚”大\n\n熊猫野外观测站，建有大熊猫博物馆。","clips":[]},{"n":99,"kind":"单项选择题","answer":"A","stem":"中国唯一的载人航天发射场是（    ）卫星发射中心。","options":{"A":"酒泉","B":"太原","C":"西昌","D":"文昌"},"explanation":"酒泉卫星发射中心是我国创建最早、规模最大的综合性卫星发射中心，也是中国唯一\n\n的载人航天发射场。","clips":[]},{"n":100,"kind":"单项选择题","answer":"A","stem":"“华龙一号”是我国自主研发的（     ）。","options":{"A":"三代核电机组","B":"四代核电机组","C":"风电机组","D":"水电机组"},"explanation":"2022 年 11 月 27 日，我国自主研发的三代核电机组“华龙一号”在福建福清核电站\n\n成功并网投入商业运行，标志着我国三代核电技术跻身世界前列，成为继美国、法国、俄罗\n\n斯等国家之后真正掌握三代核电技术的国家。","clips":[]},{"n":101,"kind":"单项选择题","answer":"B","stem":"确立思想建党、政治建军原则的是（     ）。","options":{"A":"八七会议","B":"古田会议","C":"遵义会议","D":"瓦窑堡会议"},"explanation":"1929 年 12 月，红四军党的第九次代表大会在福建上杭古田召开，即古田会议。大会\n\n根据中央九月来信精神，通过毛泽东起草的古田会议决议，确立了思想建党、政治建军的原\n\n则。","clips":[]},{"n":102,"kind":"单项选择题","answer":"B","stem":"谥号中“炀”字的含义是（）。","options":{"A":"表扬：好内远礼","B":"批评：好内远礼","C":"同情：短命","D":"同情：遭受国难"},"explanation":"谥号中，一是表扬的，如“文”“武”“成”“景”。二是批评的，如“炀”（好内远礼）、\n\n“厉”（杀戮无辜），“炀”字属批评之类。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":103,"kind":"单项选择题","answer":"B","stem":"商朝代表性器物后母戊鼎，是迄今世界上发现的最大的（      ）。","options":{"A":"陶器","B":"青铜器","C":"铁器","D":"玉器"},"explanation":"商朝代表性器物是高达 133 厘米、重达 832.84 公斤的后母戊鼎，是迄今世界上发现\n\n的最大的青铜器。","clips":[]},{"n":104,"kind":"单项选择题","answer":"A","stem":"建安文学的集大成者曹植，其赋代表作是（       ）。","options":{"A":"《洛神赋》","B":"《七哀诗》","C":"《登楼赋》","D":"《燕歌行》"},"explanation":"曹植是建安文学的集大成者，赋代表作是《洛神赋》。","clips":[]},{"n":105,"kind":"单项选择题","answer":"D","stem":"世界上最大的凯旋门位于（   ）。","options":{"A":"柏林","B":"罗马","C":"伦敦","D":"巴黎"},"explanation":"凯旋门位于巴黎戴高乐星形广场中央，是为纪念拿破仑在奥斯特里茨战役中击败俄奥\n\n联军而建的，于 1836 年建成，是世界上最大的凯旋门。","clips":[]},{"n":106,"kind":"单项选择题","answer":"A","stem":"我国现存最早的一部医书是西汉（    ）。","options":{"A":"《黄帝内经》","B":"《神农本草经》","C":"《千金方》","D":"《伤寒杂病论》"},"explanation":"西汉《黄帝内经》，我国现存最早的一部医书，包括《素问》和《灵枢》两部分，奠\n\n定了传统中医学理论基础。","clips":[]},{"n":107,"kind":"单项选择题","answer":"D","stem":"“前不见古人，后不见来者”出自陈子昂的（        ）。","options":{"A":"《感遇》","B":"《春夜别友人》","C":"《登泽州城北楼宴》","D":"《登幽州台歌》"},"explanation":"陈子昂代表作《登幽州台歌》，留下“前不见古人，后不见来者”的感叹。","clips":[]},{"n":108,"kind":"单项选择题","answer":"B","stem":"我国独立研制的第五代隐身战机是（       ）。","options":{"A":"歼 10、歼 16","B":"歼 20、歼 35","C":"运 20、空警-500","D":"歼 15、空警-2000"},"explanation":"中国独立研制了先进战机歼 10、歼 15（舰载机）、歼 16（多用途战机）和第五代隐\n\n身战机歼 20、歼 35，设计制造了运 20 大型军用运输机和空警-200、空警-500、空警-2000\n\n等先进预警机，是世界上屈指可数能够自行研制五代战机和先进预警机的国家之一。","clips":[]},{"n":109,"kind":"单项选择题","answer":"A","stem":"按八卦布局的三清宫古建筑群被誉为“中国古代道教建筑的露天博物馆”，其所在的名山是（     ）。","options":{"A":"三清山","B":"武当山","C":"青城山","D":"龙虎山"},"explanation":"三清山 1600 余年的道教文化广博精微，按八卦布局的三清宫古建筑群，被誉为“中\n\n国古代道教建筑的露天博物馆”。","clips":[]},{"n":110,"kind":"单项选择题","answer":"D","stem":"全民族抗战爆发后中国军队主动对日作战取得的第一个重大胜利是（   ）。","options":{"A":"台儿庄战役","B":"百团大战","C":"淞沪会战","D":"平型关大捷"},"explanation":"1937 年 9 月 25 日，八路军第一一五师主力在平型关伏击日军，首战告捷，这是全民\n\n族抗战爆发后中国军队主动对日作战取得的第一个重大胜利。","clips":[]},{"n":111,"kind":"单项选择题","answer":"D","stem":"嘉量全套量器从大到小依次为（）。","options":{"A":"解、升、斗、合、龠","B":"斗、解、升、合、龠","C":"解、斗、合、升、龠","D":"解、斗、升、合、龠"},"explanation":"嘉量是我国古时的标准量器，全套量器从大到小依次为解、斗、升、合、龠，含有统\n\n一度量衡的意义，象征着国家的统一和强盛。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":112,"kind":"单项选择题","answer":"C","stem":"中国园林最初的形式为（）。","options":{"A":"囿","B":"苑","C":"圃","D":"园"},"explanation":"最初的形式为圃。公元前 11 世纪，周文王曾建“灵圉”。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":113,"kind":"单项选择题","answer":"A","stem":"英国的国花是（    ）。","options":{"A":"玫瑰","B":"香根鸢尾花","C":"雏菊","D":"樱花"},"explanation":"国旗为米字旗，国花是玫瑰。","clips":[]},{"n":114,"kind":"单项选择题","answer":"B","stem":"明清科举会试由（    ）主持。","options":{"A":"工部","B":"礼部","C":"吏部","D":"户部"},"explanation":"次年春天在京师举行，叫“会试”（又称“塞围”），由礼部主持，举人才有资格参加\n\n考试，考中者称为“贡士”。","clips":[]},{"n":115,"kind":"单项选择题","answer":"B","stem":"1997 年，我国正式批准开展（     ）业务。","options":{"A":"边境旅游","B":"中国公民出境旅游","C":"外国人入境旅游","D":"港澳台居民内地游"},"explanation":"1997 年，香港回归，国家旅游局召开了出境旅游工作会议，正式批准开展中国公民\n\n出境旅游业务，推动了内地与香港出入境双向市场的起步发展，使我国旅游业呈现出国内游、\n\n出境游和入境游开始同步发展的新格局。","clips":[]},{"n":116,"kind":"单项选择题","answer":"B","stem":"有“争气桥”之称的是（     ）。","options":{"A":"武汉长江大桥","B":"南京长江大桥","C":"钱塘江大桥","D":"港珠澳大桥"},"explanation":"南京长江大桥位于鼓楼区下关和浦口区桥北之间，是长江上第一座由中国自行设计和\n\n建造的双层式铁路、公路两用桥梁，是新中国技术成就与现代化的象征，有“争气桥”之称，\n\n1968 年 12 月 29 日通车。","clips":[]},{"n":117,"kind":"单项选择题","answer":"C","stem":"瓷器烧成温度必须在（      ）以上。","options":{"A":"800℃","B":"1000℃","C":"1200℃","D":"1500℃"},"explanation":"瓷器是以高岭土（俗称瓷土）为原料，经 1200℃以上高温烧制而成的器物。","clips":[]},{"n":118,"kind":"单项选择题","answer":"A","stem":"1904 年在美国芝加哥世界博览会上获得一等奖的是（     ）。","options":{"A":"景泰蓝“宝鼎炉”","B":"景德镇青花瓷","C":"龙泉青瓷","D":"宜兴紫砂器"},"explanation":"1904 年，在美国芝加哥世界博览会上，景泰蓝“宝鼎炉”获得一等奖，1915 年巴拿\n\n马万国博览会上再获一等奖，自此景泰蓝在国际上声誉大振。","clips":[]},{"n":119,"kind":"单项选择题","answer":"B","stem":"被誉为“中国天眼”的 FAST，其主要用途是（   ）。","options":{"A":"导航定位","B":"探索宇宙的起源和演化","C":"监测地震活动","D":"预报天气变化"},"explanation":"我国还在贵州省平塘县建成世界上最大、最灵敏的单口径巨型射电望远镜（FAST），\n\n主要用于探索宇宙的起源和演化。","clips":[]},{"n":120,"kind":"单项选择题","answer":"B","stem":"“汉兴厚葬”的典型，历时 53 年才修成的帝王陵是（     ）。","options":{"A":"秦始皇陵","B":"汉茂陵","C":"唐乾陵","D":"明孝陵"},"explanation":"汉茂陵是汉武帝刘彻的陵墓，位于陕西省兴平市，是西汉帝王陵中规模最大的一座，\n\n始建于武帝即位后的第二年，历时 53 年才修成，是“汉兴厚葬”的典型。","clips":[]},{"n":121,"kind":"单项选择题","answer":"C","stem":"中国风筝发展的鼎盛时期是（   ）。","options":{"A":"秦汉时期","B":"唐宋时期","C":"明清时期","D":"民国时期"},"explanation":"明清时期是中国风筝发展的鼎盛时期，风筝在大小、样式、扎制技术、装饰和放飞技\n\n艺上都有了超越前人的巨大进步。","clips":[]},{"n":122,"kind":"单项选择题","answer":"A","stem":"把铸牢中华民族共同体意识写入党章的是党的（     ）。","options":{"A":"十九大","B":"二十大","C":"十七大","D":"十八大"},"explanation":"2017 年，党的十九大正式提出“铸牢中华民族共同体意识”，强调加强各民族对中华\n\n文化的认同，推动共同繁荣发展，并将其写入党章。","clips":[]},{"n":123,"kind":"单项选择题","answer":"A","stem":"下列关于京张高铁的表述，正确的是（    ）。","options":{"A":"在世界上首次实现了时速 350 公里的自动驾驶","B":"全长 1318 公里","C":"2008 年开通运营","D":"是世界上第一条高速铁路"},"explanation":"2019 年 12 月 30 日开通运营的京张高铁，使用我国自主研制的复兴号智能动车组，\n\n采用北斗卫星导航系统，在世界上首次实现了时速 350 公里的自动驾驶。","clips":[]},{"n":124,"kind":"单项选择题","answer":"B","stem":"平定“三藩之乱”、统一台湾、签订《尼布楚条约》的皇帝是（      ）。","options":{"A":"顺治帝","B":"康熙帝","C":"雍正帝","D":"乾隆帝"},"explanation":"康熙皇帝平定了平西王吴三桂、平南王尚可喜、靖南王耿精忠的“三藩之乱”，统一\n\n了台湾，与沙俄签订《尼布楚条约》，划定了中俄东部边界线，维护了国家主权。","clips":[]},{"n":125,"kind":"单项选择题","answer":"A","stem":"第一部白话新诗集《尝试集》的作者是（     ）。","options":{"A":"胡适","B":"郭沫若","C":"徐志摩","D":"闻一多"},"explanation":"代表作家胡适是写白话新诗的第一人，1920 年出版了他的第一部白话新诗集《尝试\n\n集》。","clips":[]},{"n":126,"kind":"单项选择题","answer":"C","stem":"宫殿建筑采取严格的中轴对称的布局方式，是为了表现（    ）。","options":{"A":"军事防御的需要","B":"体现阴阳五行的观念","C":"君权受命于天和以皇权为核心的等级观念","D":"宗教教义的要求"},"explanation":"为了表现君权受命于天和以皇权为核心的等级观念，宫殿建筑采取严格的中轴对称的\n\n布局方式。","clips":[]},{"n":127,"kind":"单项选择题","answer":"D","stem":"良渚文化主要分布在（）。","options":{"A":"辽河流域","B":"珠江流域","C":"黄河流域","D":"长江流域"},"explanation":"良渚文化主要分布在浙江杭州市钱塘江流域和太湖流域，以余杭区最为集中，已发掘\n\n出村落、墓地、祭坛和占地达 290 多万平方米的城址，标志着人类进入了文明时代。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":128,"kind":"单项选择题","answer":"B","stem":"黄山三大主峰中最高的是（      ）。","options":{"A":"天都峰","B":"莲花峰","C":"玉屏峰","D":"光明顶"},"explanation":"黄山主要为花岗岩山体，有大小 72 峰，莲花峰、光明顶、天都峰为黄山三大主峰，\n\n且高度均超过 1800 米，是我国东部少有的高峰，其中莲花峰最高，海拔 1864.8 米。","clips":[]},{"n":129,"kind":"单项选择题","answer":"C","stem":"被称为“医圣”，开创用八纲辨证施治的是（     ）。","options":{"A":"李时珍","B":"华佗","C":"张仲景","D":"孙思邈"},"explanation":"东汉《伤寒杂病论》，作者张仲景，人称“医圣”，开创用八纲辨证施治。","clips":[]},{"n":130,"kind":"单项选择题","answer":"A","stem":"2020 年我国成功发射（   ）火星探测器，开启了对火星奥秘的探索。","options":{"A":"天问一号","B":"神舟十二号","C":"墨子号","D":"嫦娥五号"},"explanation":"2020 年我国成功发射“天问一号”火星探测器，开启了对火星奥秘的探索。\n\n三、多选题","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABC","stem":"宁夏在地形上分为三大板块，包括（      ）。","options":{"A":"北部引黄灌区","B":"中部干旱带","C":"南部山区","D":"中部灌区","E":"北部山区"},"explanation":"宁夏在地形上分为：北部引黄灌区、中部干旱带和南部山区三大板块。D 项中部为干\n\n旱带而非灌区，E 项北部为引黄灌区而非山区，故不选。","clips":[]},{"n":132,"kind":"多项选择题","answer":"ABCD","stem":"下列属于阿里山五奇的有（     ）。","options":{"A":"日出","B":"云海","C":"晚霞","D":"森林","E":"高山公路"},"explanation":"日出、云海、晚霞、森林与高山铁路，合称阿里山五奇。E 项应为“高山铁路”，不\n\n是“高山公路”，故不选。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ABC","stem":"考古发现的河北保定满城西汉中山靖王刘胜夫妇墓，出土的稀世珍宝有（      ）。","options":{"A":"金缕玉衣","B":"长信宫灯","C":"错金铜博山炉","D":"后母戊鼎","E":"越王勾践剑"},"explanation":"考古发现的河北保定满城西汉中山靖王刘胜夫妇墓，出土“金缕玉衣”“长信宫灯”\n\n“错金铜博山炉”等稀世珍宝，充分反映了西汉时期河北经济文化的高度发达。D 项后母戊\n\n鼎出土于河南安阳殷墟，E 项越王勾践剑出土于湖北，均不属于满城汉墓出土文物，故不选。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ABC","stem":"历史上海南岛有三种古称，包括（）。","options":{"A":"珠崖","B":"儋耳","C":"琼台","D":"琼州","E":"崖州"},"explanation":"历史上海南岛有三种古称：珠崖、儋耳、琼台。D 项琼州、E 项崖州为海南历史政区\n\n名称，不属于海南岛的三种古称，故不选。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":135,"kind":"多项选择题","answer":"ABCE","stem":"下列河流中，属于北京境内五大水系的有（     ）。","options":{"A":"潮白河","B":"北运河","C":"大清河","D":"拒马河","E":"蓟运河"},"explanation":"北京境内有永定河、潮白河、北运河、大清河和蓟运河五大水系，是北京市淡水的主\n\n要来源。D 项拒马河为流经河北、北京的河流，不属于北京境内五大水系，故不选。","clips":[]},{"n":136,"kind":"多项选择题","answer":"ABCD","stem":"关于福建省地理特点的说法，正确的有（     ）。","options":{"A":"依山傍海","B":"地势总体上西北高、东南低","C":"山地、丘陵面积约占全省土地总面积的 80%","D":"享有“东南山国”之称","E":"被称为“七山一水二分田”"},"explanation":"福建省简称“闽”，福建的地理特点是“依山傍海”，地势总体上西北高、东南低，山\n\n地、丘陵面积约占全省土地总面积的 80%，享有“东南山国”之称，也被称为“八山一水一\n\n分田”。E 项“七山一水二分田”是浙江的说法，福建被称为“八山一水一分田”，故不选。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ABCDE","stem":"关于山西大同云冈石窟的说法，正确的有（     ）。","options":{"A":"始建于北魏和平年间","B":"与敦煌莫高窟、洛阳龙门石窟并列为“中国三大石窟”","C":"融合了印度、中西亚的艺术元素","D":"融入了希腊、古罗马的建筑造型和装饰纹样","E":"展现了中外文化的交流与融合"},"explanation":"本题说法全部正确。云冈石窟位于大同市西郊武周山南麓，依山开凿，始建于北魏和\n\n平年间，现存主要洞窟 45 个，共计 1100 多个小龛，大小造像 59000 余尊，与敦煌莫高窟、\n\n洛阳龙门石窟并列为“中国三大石窟”。云冈石窟的艺术风格独特而多元，它融合了印度、\n\n中西亚的艺术元素，又巧妙地融入了希腊、古罗马的建筑造型和装饰纹样，展现了中外文化\n\n的交流与融合。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABC","stem":"上海以三大先导产业为核心构建特色产业体系，这三大先导产业具体指（   ）。","options":{"A":"人工智能","B":"集成电路","C":"生物医药产业","D":"新能源汽车","E":"高端装备制造"},"explanation":"上海的特色产业体系以三大先导产业为核心，“三大先导产业”具体指人工智能、集\n\n成电路和生物医药产业。2025 年三大先导产业规模突破 2 万亿元。D 项新能源汽车、E 项高\n\n端装备制造均不属于上海“三大先导产业”，故不选。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABC","stem":"长江三峡以（   ）而驰名。","options":{"A":"瞿塘雄","B":"巫峡秀","C":"西陵峡险","D":"虎跳峡险","E":"灯影峡秀"},"explanation":"以立体画廊长江三峡最负盛名，长江三峡以瞿塘雄、巫峡秀、西陵峡险而驰名。D 项\n\n虎跳峡位于云南金沙江，E 项灯影峡为西陵峡中的一段，均与“瞿塘雄、巫峡秀、西陵峡险”\n\n的表述不符，故不选。","clips":[]},{"n":140,"kind":"多项选择题","answer":"BCDE","stem":"下列景区中，属于青海省国家 5A 级旅游景区的有（   ）。","options":{"A":"茶卡盐湖景区","B":"青海湖风景区","C":"塔尔寺景区","D":"互助土族故土园旅游区","E":"阿咪东索景区"},"explanation":"青海省现有国家 5A 级旅游景区共 4 家：青海湖风景区、西宁市塔尔寺景区、海东市\n\n互助土族故土园旅游区、海北州阿咪东索景区。茶卡盐湖景区位于海西州乌兰县，虽知名度\n\n高，但为国家 4A 级旅游景区。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ABC","stem":"在四川茶馆欣赏川剧，能看到川剧的三大绝技是（      ）。","options":{"A":"变脸","B":"吐火","C":"滚灯","D":"水袖","E":"跟头"},"explanation":"四川的茶馆不仅能饮茶，还常常有川剧表演，能够欣赏到川剧“变脸”“吐火”“滚灯”\n\n三大绝技。D 项水袖、E 项跟头为戏曲表演基本功，不属于川剧“三大绝技”，故不选。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABC","stem":"关于南狮狮头的说法，正确的有（   ）。","options":{"A":"黄脸为刘备狮","B":"红脸为关公狮","C":"黑脸为张飞狮","D":"黄脸代表忠义、胜利","E":"黑脸代表泽被苍生、仁义"},"explanation":"南狮狮头有脸谱化的特点：黄脸为刘备狮，代表泽被苍生、仁义及皇家贵气。红脸为\n\n关公狮，代表忠义、胜利。黑脸为张飞狮，代表勇猛、霸气等。D 项忠义、胜利是红脸关公\n\n狮的寓意，E 项泽被苍生、仁义是黄脸刘备狮的寓意，故不选。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABC","stem":"下列少数民族中，属于甘肃特有的有（      ）。","options":{"A":"东乡族","B":"裕固族","C":"保安族","D":"撒拉族","E":"土族"},"explanation":"东乡、裕固、保安为 3 个甘肃特有少数民族。D 项撒拉族、E 项土族主要聚居在青海，\n\n不属于甘肃特有少数民族，故不选。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABC","stem":"香港由（   ）以及 262 个大小离岛组成。","options":{"A":"香港岛","B":"九龙半岛","C":"新界内陆地区","D":"大屿山","E":"鸭洲洲"},"explanation":"香港由香港岛、九龙半岛、新界内陆地区以及 262 个大小岛组成。D 项大屿山、E 项\n\n鸭洲均为香港的岛屿，不属于香港的三大组成部分，故不选。","clips":[]},{"n":145,"kind":"多项选择题","answer":"ABCE","stem":"下列关于贵州省的说法，正确的有（     ）。","options":{"A":"贵州少数民族人口仅次于广西、云南、新疆，居全国第 4 位","B":"苗族的先祖可追溯到原始社会时代活跃于中原地区的蚩尤部落","C":"贵州名酒无论数量还是质量都名列前茅，被清代诗人郑珍称赞为“酒冠黔人国”","D":"贵州是全国少数民族人口数量最多的省份","E":"贵州的天麻、石斛、杜仲等都是传统特产"},"explanation":"贵州少数民族人口仅次于广西、云南、新疆，居全国第 4 位。苗族是我国本土起源的\n\n一个国际性的古老少数民族，苗族的先祖可追溯到原始社会时代活跃于中原地区的苗尤部落。\n\n贵州名酒无论是数量还是质量，在国内外都名列前茅，被清代诗人郑珍称赞为“酒冠黔人国”。\n\n贵州的天麻、石斛、杜仲等都是传统特产。D 项说法错误，贵州少数民族人口仅次于广西、\n\n云南、新疆，居全国第 4 位，并非全国少数民族人口数量最多的省份，故不选。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABCE","stem":"下列关于中国旅游重点城市的说法，正确的有（          ）。","options":{"A":"南宁素有“中国绿城”“天下民歌眷恋的地方”等美誉","B":"杭州作为“茶都”，拥有中国茶叶博物馆和著名的龙井村","C":"兰州是独具魅力的“黄河之都”，形成了“两山对峙、大河中流”的城市风貌","D":"扬州个园被誉为中国晚清第一名园","E":"遵义素有“川黔咽喉”“黔北粮仓”之称"},"explanation":"南宁素有“中国绿城”“天下民歌眷恋的地方”等美誉。作为“茶都”，杭州拥有中国\n\n茶叶博物馆和著名的龙井村。兰州是独具魅力的黄河之都。黄河穿城而过，形成了“两山对\n\n峙、大河中流”的城市风貌。遵义自古为“川黔咽喉”，素有“黔北粮仓”之称。D 项说法\n\n错误，被誉为“中国晚清第一名园”的是扬州何园，并非个园，故不选。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ABCE","stem":"杭帮菜为浙菜的代表菜，下列属于杭帮菜传统名菜的有（           ）。","options":{"A":"西湖醋鱼","B":"龙井虾仁","C":"东坡肉","D":"白切鸡","E":"宋嫂鱼羹"},"explanation":"杭帮菜为浙菜的代表菜，传统名菜有西湖醋鱼、龙井虾仁、东坡肉、宋嫂鱼羹、干炸\n\n响铃、蜜汁火方和西湖蔬菜汤等。D 项白切鸡为广东名菜，不属于杭帮菜传统名菜，故不选。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABCE","stem":"下列科技成就与其取得时间对应正确的有（       ）。","options":{"A":"第一颗原子弹爆炸成功——1964 年","B":"第一颗氢弹空爆试验成功——1967 年","C":"“东方红一号”发射成功——1970 年","D":"第一颗人造卫星——1958 年","E":"“华龙一号”并网商运——2022 年"},"explanation":"1964 年 10 月 16 日成功爆炸我国第一颗原子弹。1967 年 6 月 17 日，我国第一颗氢弹\n\n空爆试验成功。1970 年 4 月 24 日，我国用长征一号运载火箭成功发射第一颗人造卫星“东\n\n方红一号”，成为继苏联、美国、法国、日本之后，世界第五个能独立发射人造地球卫星的\n\n国家。2022 年 11 月 27 日，我国自主研发的三代核电机组“华龙一号”在福建福清核电站\n\n成功并网投入商业运行，标志着我国三代核电技术跻身世界前列，成为继美国、法国、俄罗\n\n斯等国家之后真正掌握三代核电技术的国家。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ACDE","stem":"发展红色旅游的重要意义有（      ）。","options":{"A":"有利于加强和改进新时期爱国主义教育","B":"有利于带动沿海地区率先发展","C":"有利于带动革命老区经济社会的协调发展","D":"有利于弘扬民族精神","E":"有利于保护和利用革命历史文化遗产"},"explanation":"发展红色旅游，对于加强革命传统教育，增强全国人民特别是青少年的爱国情感，弘\n\n扬和培育民族精神，带动革命老区经济社会协调发展，具有重要的现实意义和深远的历史意\n\n义。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABCD","stem":"下列关于广西的说法，正确的有（         ）。","options":{"A":"广西之名源于宋至道三年（997 年）分广南路为广南东路和广南西路，今广西大部属广南西路","B":"壮族早年有婚后“不落夫家”的习俗，女子一般婚后两三年后才住夫家","C":"抗战时期，以“文化城”桂林为中心，抗日救亡文化运动在广西蓬勃开展，影响全国","D":"广西容县南方黑芝麻、柳州螺蛳粉、桂林辣椒酱、桂林三花酒、横县茉莉花茶、梧州龟苓膏等特色食品、饮料均已形成规模化生产、加工产业，享誉全国","E":"壮族人喜吃腌制的甜食，妇女有嚼槟榔的习俗"},"explanation":"宋至道三年（997 年），分广南路为广南东路和广南西路，今广西大部属广南西路，\n\n广西之名源于此。壮族早年有婚后“不落夫家”的习俗，女子一般婚后两三年后才住夫家。\n\n抗战时期，以“文化城”桂林为中心，抗日救亡文化运动在广西蓬勃开展，影响全国。广西\n\n容县南方黑芝麻、柳州螺蛳粉、桂林辣椒酱、桂林三花酒、横县茉莉花茶、梧州龟苓膏等特\n\n色食品、饮料均已形成规模化生产、加工产业，享誉全国。E 项说法错误，壮族人喜吃腌制\n\n的酸食，并非甜食，故不选。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABCD","stem":"下列属于“楷书四大家”的有（）。","options":{"A":"欧阳询","B":"颜真卿","C":"柳公权","D":"赵孟頫","E":"王羲之"},"explanation":"唐朝欧阳询、颜真卿、柳公权与元朝赵孟頫，合称“楷书四大家”。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":152,"kind":"多项选择题","answer":"BCDE","stem":"下列关于长城的表述，正确的有（         ）。","options":{"A":"明长城东端的终点是嘉峪关","B":"汉长城规模最大，东起辽东，西迄蒲昌海","C":"秦始皇以秦、赵、燕三国北方长城为基础修缮增筑","D":"长城包括城墙、敌台、烽火台、关隘等设施","E":"春秋时楚国最早修筑长城，称“方城”"},"explanation":"A 项错误，嘉峪关是明朝万里长城西端的终点，山海关是明长城东端的重要关隘。据\n\n文献记载，春秋时楚国最早修筑长城数百里，称“方城”。嘉峪关位于甘肃省嘉峪关市西南\n\n隅，因建于嘉峪山麓而得名，是明朝万里长城西端的终点，建于明洪武年间，是目前保存最\n\n完整的一座城关，有“天下第一雄关”的美名，也是丝绸之路上的重要一站。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ABC","stem":"现存的著名皇家园林有（   ）。","options":{"A":"北京颐和园","B":"北海公园","C":"河北承德避暑山庄","D":"苏州拙政园","E":"上海豫园"},"explanation":"现存著名皇家园林：北京颐和园、北海公园，河北承德避暑山庄等。现存的私家园林：\n\n北京恭王府，苏州拙政园、留园，上海豫园，绍兴沈园等。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ABC","stem":"粤菜由三种风味组成，包括（       ）。","options":{"A":"广府风味","B":"客家（东江）风味","C":"潮汕风味","D":"闽南风味","E":"琼州风味"},"explanation":"粤菜由广府（以广州菜为代表）、客家（以东江菜为代表）、潮汕（以潮州菜为代表）\n\n三种风味组成，以广府风味为代表。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABDE","stem":"中国四大盆地包括（    ）。","options":{"A":"塔里木盆地","B":"准噶尔盆地","C":"吐鲁番盆地","D":"柴达木盆地","E":"四川盆地"},"explanation":"中国四大盆地分别是塔里木盆地、准噶尔盆地、四川盆地和柴达木盆地。","clips":[]},{"n":156,"kind":"多项选择题","answer":"BCDE","stem":"下列节日与习俗对应正确的有（          ）。","options":{"A":"重阳节：插柳、踏青","B":"端午节：赛龙舟、吃粽子、插菖蒲","C":"重阳节：登高、插茱萸、饮菊花酒","D":"元宵节：放花灯、猜灯谜","E":"清明节：扫墓、插柳、踏青"},"explanation":"插柳、踏青是清明节的习俗，A 项错误。清明节又称踏青节，节期在农历三月间，即\n\n公历 4 月 5 日前后。清明节的习俗活动主要有扫墓、插柳、踏青、射柳、蹴鞠、放风筝、荡\n\n秋千等。重阳节的习俗主要有登高、插茱萸、饮菊花酒等，应景食品是重阳糕。元宵节之夜\n\n有放花灯、观花灯，耍社火、打太平鼓、猜灯谜、踩高跷、舞狮子、扭秧歌、唱大戏等活动，\n\n热闹非凡，故有“闹元宵”之说。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABCD","stem":"法国人的礼节主要有（    ）。","options":{"A":"握手礼","B":"拥抱礼","C":"贴面礼","D":"吻手礼","E":"鞠躬礼"},"explanation":"法国人的礼节主要有握手礼、拥抱礼、贴面礼和吻手礼，法国是世界上最早公开行亲\n\n吻礼的国家，也是使用亲吻礼频率最高的国家之一。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ACDE","stem":"下列属于李白代表作的有（       ）。","options":{"A":"《蜀道难》","B":"《春望》","C":"《行路难》","D":"《望庐山瀑布》","E":"《将进酒》"},"explanation":"《春望》是杜甫作品，B 项错误。李白诗歌雄奇峭丽、豪放飘逸，凝聚着盛唐的时代\n\n精神，世人称其为“遗仙”。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABCD","stem":"下列属于我国古代四大发明的有（    ）。","options":{"A":"造纸术","B":"印刷术","C":"火药","D":"指南针","E":"地动仪"},"explanation":"四大发明是：造纸术、印刷术、火药、指南针。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABCD","stem":"湖笔具有（   ）四大特点，被誉为“笔中之冠”。","options":{"A":"尖","B":"齐","C":"圆","D":"健","E":"柔"},"explanation":"湖笔自元代以后取代了宣笔的地位，分羊毫、狼毫、紫毫、兼毫四大类，具有尖、齐、\n\n圆、健四大特点。","clips":[]},{"n":161,"kind":"多项选择题","answer":"BCDE","stem":"秦统一六国后采取的措施包括（    ）。","options":{"A":"实行分封制","B":"在经济、文化上统一了度量衡、货币、文字","C":"军事上北伐匈奴并修建万里长城","D":"南征岭南并开凿灵渠","E":"政治上实行皇帝制度、三公九卿制度、郡县制度"},"explanation":"A 项错误，秦统一后在地方实行郡县制度，并非分封制。公元前 221 年秦始皇统一六\n\n国而建立，是中国第一个高度集权的封建专制王朝。为了维护大一统局面，秦始皇在政治上\n\n实行皇帝制度、三公九卿制度、郡县制度和思想专制制度，统一了刑律，制造了“焚书坑儒”\n\n事件。","clips":[]},{"n":162,"kind":"多项选择题","answer":"BCE","stem":"蜀绣的经典之作有（   ）。","options":{"A":"《百鸟朝凤》","B":"《蜀宫乐女演乐图》挂屏","C":"《熊猫图》座屏","D":"双面绣《猫》","E":"《芙蓉鲤鱼》巨幅作品"},"explanation":"《百鸟朝凤》是粤绣代表作，双面绣《猫》是苏绣作品，AD 两项错误。《蜀宫乐女演\n\n乐园》挂屏、《熊猫图》座屏和陈列在北京人民大会堂四川厅的巨幅作品《芙蓉鲤鱼》都是\n\n蜀绣的经典之作。26 教材改动说明：蜀绣条目 26 版整体改写——新增古称“川绣”、“蜀中\n\n之宝”及巴蜀文化背景；针法由“100 种以上”及详细列举改为以晕针为核心、辅以滚针切\n\n针等；代表作调整为《熊猫图》座屏，并补充题材、色彩和线条特点；25 版“以软缎、彩\n\n丝为主要原料”等旧述不再保留。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABC","stem":"中国人民解放军战略决战的“三大战役”有（    ）。","options":{"A":"辽沈战役","B":"淮海战役","C":"平津战役","D":"渡江战役","E":"济南战役"},"explanation":"渡江战役、济南战役不属于三大战役，DE 两项错误。1948 年 9 月 12 日至 1949 年 1\n\n月 31 日，中国人民解放军同国民党军进行战略决战，先后发动了辽沈战役、淮海战役和平\n\n津战役，史称“三大战役”。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ABCD","stem":"按照海岸物质组成及其形态，海岸可以分为（   ）。","options":{"A":"沙砾质海岸","B":"淤泥质海岸","C":"三角洲海岸","D":"生物海岸","E":"侵蚀海岸"},"explanation":"侵蚀海岸是按海岸基本特征（海岸侵蚀地貌和海岸堆积地貌）划分的类型，E 项错误。\n\n海岸地貌按照其基本特征可以分为海岸侵蚀地貌和海岸堆积地貌，按照海岸物质组成及其形\n\n态可以分为沙砾质海岸、淤泥质海岸、三角洲海岸、生物海岸等。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ABCE","stem":"一般所称中国“四大名玉”包括（）。","options":{"A":"和田玉","B":"岫岩玉","C":"独山玉","D":"翡翠","E":"蓝田玉"},"explanation":"翡翠是产于缅甸的硬玉，不属于中国“四大名玉”，D 项错误。一般所称中国“四大\n\n名玉”是指新疆的和田玉、辽宁岩县的岩玉、河南南阳的独山玉、陕西蓝田的蓝田玉。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper5-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
</html>
