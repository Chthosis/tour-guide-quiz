<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"错","stem":"《宪法》在总纲中规定：中华人民共和国的一切权力属于中央人民政府。","options":{"对":"正确","错":"错误"},"explanation":"中华人民共和国的一切权力属于人民。故本题错误。","clips":[]},{"n":2,"kind":"判断题","answer":"对","stem":"《旅游法》规定，旅行社不得出租、出借旅行社业务经营许可证，或者以其他形式非法转让旅行社业务经营许可。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":3,"kind":"判断题","answer":"错","stem":"《民法典》规定，用人单位的工作人员因执行工作任务造成他人损害的，由用人单位承担侵权责任。用人单位承担侵权责任后，可以向有故意或过失的工作人员追偿。","options":{"对":"正确","错":"错误"},"explanation":"此题错在是“重大过失”，不是“过失”。","clips":[]},{"n":4,"kind":"判断题","answer":"错","stem":"根据《旅行社条例实施细则》，旅行社服务网点以设立社的名义从事《旅行社条例》规定的经营活动，其经营活动的责任和后果，由设立它的分社承担。","options":{"对":"正确","错":"错误"},"explanation":"分社和服务网点不具有法人资格，不作为权利、义务的主体，以设立分社、服务网\n\n点的旅行社的名义从事《旅游法》《旅行社条例》规定的业务经营，其经营活动的责任和后\n\n果，由设立社承担。分社不能设立分支机构。","clips":[]},{"n":5,"kind":"判断题","answer":"对","stem":"经营者主动消除或者减轻违法行为危害后果的，按照规定可以从轻、减轻或者不予处罚。","options":{"对":"正确","错":"错误"},"explanation":"条例明确将主动消除、减轻违法行为危害后果列为依照《中华人民共和国行政处罚\n\n法》从轻、减轻或者不予处罚的情形，题干表述正确。","clips":[]},{"n":6,"kind":"判断题","answer":"对","stem":"旅游目的地安全风险提示级别为二级的，属于严重级别，用橙色标示。","options":{"对":"正确","错":"错误"},"explanation":"根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为一级\n\n（特别严重）、二级（严重）、三级（较重）和四级（一般），分别用红色、橙色、黄色和蓝\n\n色标示。","clips":[]},{"n":7,"kind":"判断题","answer":"错","stem":"根据《安全生产法》，遵循民事活动自愿的原则，生产经营单位可以与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任。","options":{"对":"正确","错":"错误"},"explanation":"解析根据《安全生产法》第 52 条规定，生产经营单位不得以任何形式与从业人员订\n\n立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任。因此，该说法\n\n是错误的。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"根据《国内水路运输管理规定》的规定，水路旅客班轮运输业务经营者应当自取得班轮航线经营许可之日起 60 日内开航，并在开航的 15 日前通过媒体并在该航线停靠的各客运站点的明显位置向社会公布所使用的船舶、班期、班次、票价等信息。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n本题说法正确。《国内水路运输管理规定》第 27 条明确规定：“水路旅客班轮运输业务经营\n\n者应当自取得班轮航线经营许可之日起 60 日内开航，并在开航的 15 日前通过媒体并在该航\n\n线停靠的各客运站点的明显位置向社会公布所使用的船舶、班期、班次、票价等信息。”","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"根据《铁路法》的规定，因旅客的过错造成旅客行李损失的，铁路运输企业可以减轻赔偿责任。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n根据《铁路法》第 18 条规定，由于下列原因造成的货物、包裹、行李损失的，铁路运输企\n\n业不承担赔偿责任：\n\n（1）不可抗力；\n\n（2）货物或者包裹、行李中的物品本身的自然属性，或者合理损耗；\n\n（3）托运人、收货人或者旅客的过错。\n\n因此，若旅客自身存在过错（如未妥善固定行李导致掉落破损），铁路运输企业完全免责，\n\n而非“减轻”赔偿责任。","clips":[]},{"n":10,"kind":"判断题","answer":"错","stem":"根据《风景名胜区条例》，风景名胜区门票收入可以用于赔偿区内财产所有权人、使用权人的损失。","options":{"对":"正确","错":"错误"},"explanation":"《风景名胜区条例》第三十八条：风景名胜区的门票收入和风景名胜资源有偿使用\n\n费应当专门用于风景名胜资源的保护和管理以及风景名胜区内财产的所有权人、使用权人损\n\n失的补偿。\n\n不是“赔偿”而是“补偿”。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":11,"kind":"判断题","answer":"对","stem":"故意或者过失损毁国家保护的珍贵文物的，构成犯罪的，将依法追究刑事责任。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":12,"kind":"判断题","answer":"错","stem":"党的二十大报告指出，物质富足、精神富有是社会主义现代化的基本要求。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“基本要求”应为“根本要求”。\n\n党的二十大报告原文为：“物质富足、精神富有是社会主义现代化的根本要求。”\n\n“根本要求”强调其基础性、决定性地位，区别于一般性要求。“物质文明和精神文明相协\n\n调”是中国式现代化的五大特征之一。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"依据习近平新时代中国特色社会主义思想相关理论，坚定道路自信、理论自信、制度自信、文化自信，其中文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量。","options":{"对":"正确","错":"错误"},"explanation":"坚持社会主义核心价值体系。文化自信是一个国家、一个民族发展中更基本、更深\n\n沉、更持久的力量。题干表述正确。","clips":[]},{"n":14,"kind":"判断题","answer":"对","stem":"《宪法》规定，中华人民共和国国徽，中间是五星照耀下的天安门，周围是谷穗和齿轮。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"国务院各部门应当每日升挂国旗。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《国旗法》规定，国务院各部门，应当在工作日升挂国旗。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"《旅游强国建设“十五五”规划》在“工作中要做到”的四个坚持中，“坚持提质增效”被列在首位。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n《旅游强国建设“十五五”规划》在“工作中要做到”的四个坚持中，按顺序分别为：第一，\n\n坚持守正创新；第二，坚持提质增效；第三，坚持融合发展；第四，坚持高品质体验。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"2026 年 10 月 14 日，在法国马赛召开的国际灌排委员会第 77 届国际执行理事会会议上，2026 年世界灌溉工程遗产名录正式公布，我国申报的 5 处灌溉工程全部成功入选。至此，中国的世界灌溉工程遗产总数已达 46 项。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“4 处”。\n\n2026 年 10 月 14 日，在法国马赛召开的国际灌排委员会第 77 届国际执行理事会会议上，2026\n\n年世界灌溉工程遗产名录正式公布，我国申报的 4 处灌溉工程全部成功入选。至此，中国的\n\n世界灌溉工程遗产总数已达 46 项。\n\n我国这次申报的灌溉工程有 4 处，分别是：河南沁河广利渠、甘肃讨赖河绿洲灌溉系统、江\n\n西上饶市广信黄沙渠、福建长泰龙津古陂灌溉工程。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"每年 8 月为全国科普月，2026 年全国科普月以“科技改变生活创新赢得未来”为主题。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“9 月”。\n\n2024 年，新修订的科普法公布施行，明确每年 9 月为全国科普月。2026 年全国科普月以“科\n\n技改变生活创新赢得未来”为主题。","clips":[]},{"n":19,"kind":"判断题","answer":"对","stem":"2026 年 8 月 19 日，朱雀三号遥二运载火箭在东风商业航天创新试验区发射升空，运载火箭全程飞行正常，一子级成功着陆于回收场预定位置。此次任务是我国首次成功实施重复使用运载火箭一子级着陆腿方式回收，标志着我国重复使用火箭技术取得重大突破。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n2026 年 8 月 19 日，朱雀三号遥二运载火箭在东风商业航天创新试验区发射升空，运载火箭\n\n全程飞行正常，一子级成功着陆于回收场预定位置，二子级将搭载的鸿鸽 03 星顺利送入预\n\n定轨道，飞行试验任务取得圆满成功。此次任务是我国首次成功实施重复使用运载火箭一子\n\n级着陆腿方式回收，标志着我国重复使用火箭技术取得重大突破。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"2026 年 8 月 15 日是第四个全国生态日，主题为“厚植中国式现代化的绿色底色”。继民法典之后我国第二部以“法典”命名的法律——《中华人民共和国生态环境法典》自 15日起正式施行，标志着我国生态环境法治建设迈入新境界，为实现人与自然和谐共生的现代化进一步筑牢法治根基。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"2013 年 10 月 1 日，《中华人民共和国旅游法》施行，成为我国旅游业发展史上的一个里程碑。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n2013 年 10 月 1 日《中华人民共和国旅游法》施行，成为我国旅游业发展史上的一个重要里\n\n程碑。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"导游服务的扩散作用体现在对旅游产品和旅行社形象的传播，有助于扩大旅游产品的知名度和影响力。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。导游服务的扩散作用体现在对旅游产品和旅行社形象的传播，有助\n\n于扩大旅游产品的知名度和影响力。","clips":[]},{"n":23,"kind":"判断题","answer":"错","stem":"女士为保持面容光泽，女导游可以在带团期间画浓妆，但是不可以当众化妆或补妆。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n女士为保持面容光泽，女士可施淡妆，但不要浓妆，不当众化妆或补妆。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"旅游活动中，需用旅游者证件时，由全陪或领队统一收取，用毕立即如数归还并当面清点。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"地陪在客人入住后，告知旅游者自己将会在饭店大堂等候 40~60 分钟或对每个房间进行巡视。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n地陪应根据实际情况，告知旅游者自己会在饭店大堂等候 20~30 分钟或对每个房间进行巡视。","clips":[]},{"n":26,"kind":"判断题","answer":"对","stem":"领队带领游客在海外旅游期间，如旅游者要求安排另行付费旅游项目，领队应在行程计划中“自由活动”时段内组织实施，且不影响其他旅游者行程安排。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":27,"kind":"判断题","answer":"错","stem":"在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的亭亭玉立之态，这是导游讲解手势语中的指示手势语。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n在杭州西湖边，导游讲解荷花形态时，用手比画出荷花“出淤泥而不染，濯清涟而不妖”的\n\n亭亭玉立之态，这是导游讲解手势语中的象形手势语。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"当旅游者提出要求时，导游可以先有条件地答应，而实际上该条件基本无法满足，从而拒绝对方。这种方法叫做婉转拒绝法。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n婉转拒绝法是指当旅游者提出要求时，导游可以先有条件地答应，而实际上该条件基本无法\n\n满足，从而婉转地拒绝对方。","clips":[]},{"n":29,"kind":"判断题","answer":"对","stem":"旅游者提问后，导游引导其他旅游者回答，可促进旅游者之间互动，但操作难度大，需导游有较强控团能力，且不宜多用。这是客问客答法的特点。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n客问客答是指旅游者提问后，导游引导其他旅游者回答，可促进旅游者之间互动，但操作难\n\n度大，需导游有较强控团能力。","clips":[]},{"n":30,"kind":"判断题","answer":"错","stem":"旅游者要求变更行程，依据《中华人民共和国旅游法》，因变更行程增加的费用由旅游者承担，减少的费用不予退还。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n旅游者要求变更行程，向旅游者解释依据《中华人民共和国旅游法》，因变更行程增加的费\n\n用由旅游者承担，减少的费用在扣除已实际发生的成本后退还给旅游者。","clips":[]},{"n":31,"kind":"判断题","answer":"错","stem":"旅游者因自身疾病在境外死亡的，领队应及时向中国驻当地使领馆或政府派出机构报告，并按旅行社的安排处理相关事宜，但无需向外国警方报案。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n本题说法错误。旅游者死亡发生在境外的，领队应及时向当地警方报案，同时向中国驻当地\n\n使领或政府派出机构馆，并按旅行社的安排处理相关事宜。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"参与徒步旅游，进入草木茂密区域应穿长袖长裤，扎紧裤脚袖口，采用“打草惊蛇”方式驱赶蛇虫。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n风险防范：进入草木茂密区域应穿长袖长裤，扎紧裤脚袖口；采用“打草惊蛇”方式驱赶蛇\n\n虫，做好个人防护，避免被蛇虫咬伤。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"当旅游者在计划内购物店或自由活动期间所购买的商品出现质量问题，导游应该主动陪同旅游者前往商店，协助其办理退赔手续。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。当旅游者计划内购物店或自由活动期间所购买的商品出现质量问题，\n\n必要时，陪同旅游者前往购买地点，协助其办理退赔手续。","clips":[]},{"n":34,"kind":"判断题","answer":"对","stem":"一旦确认旅行社实际安排的饭店低于合同约定标准，导游需及时向旅游者致歉，并即刻向旅行社汇报，督促其迅速做出调整安排。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":35,"kind":"判断题","answer":"错","stem":"若在野外遭遇雷电且一时无法回到旅游客车，要立即到大树下、电线杆旁及高坡避雨。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n若在野外遭遇雷电且一时无法回到旅游客车，应立即寻找有防雷装置的庇护所，如装有避雷\n\n针的建筑物、山洞等。不宜选择孤立小屋、大树下、电线杆旁及高坡避雨。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"若遭遇山体滑坡，不要躲到有滚石和大量堆积物的山坡下方；当无法继续逃离时，应迅速抱住身边的树木等固定物体。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":37,"kind":"判断题","answer":"错","stem":"国有文物、非国有文物中的珍贵文物以及国家规定禁止出境的其他文物，在任何情况下都不得出境。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n国有文物、非国有文物中的珍贵文物以及国家规定禁止出境的其他文物，不得出境，但依法\n\n出境展览或因特殊需要经国务院批准出境的除外。","clips":[]},{"n":38,"kind":"判断题","answer":"错","stem":"全球最大国际航空联盟是星空联盟，我国的中国东方航空、厦门航空是其成员。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n全球最大国际航空联盟是星空联盟，我国的中国国际航空、深圳航空是成员。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"火车团体票（20 人以上同行程）退改签需不晚于开车前 48 小时。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n团体票（20 人以上同行程）退改签需不晚于开车前 48 小时。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"全国列车实行车票实名制，凭本人有效身份证件购票，同一日期、车次每证限购 1 张。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。全国列车实行车票实名制；须凭本人有效身份证件购票；同一日期、\n\n车次每证限购 1 张。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"A","stem":"在韩国釜山召开的联合国教科文组织第 48 届世界遗产大会，于北京时间 7 月 27 日审议通过了中国黄（渤）海候鸟栖息地世界自然遗产边界调整项目，（）候鸟栖息地成功纳入世界自然遗产。","options":{"A":"辽宁大连长山群岛","B":"辽宁辽河口","C":"山东黄河口","D":"福建闽江河口"},"explanation":"2026 年 7 月 27 日，在韩国釜山召开的第 48 届世界遗产大会上，中国黄（渤）海候\n\n鸟栖息地世界自然遗产边界调整项目获得通过，辽宁大连长山群岛候鸟栖息地成功纳入世界\n\n自然遗产，这是该系列遗产继 2024 年后的再次扩展。辽宁辽河口、山东黄河口虽同属黄（渤）\n\n海候鸟栖息地系列，但并非本次新纳入的组成部分；福建闽江河口则不属于该系列世界自然\n\n遗产。","clips":[]},{"n":42,"kind":"单项选择题","answer":"A","stem":"《宪法》规定，（）是中华人民共和国的根本政治制度。","options":{"A":"人民代表大会制度","B":"社会主义制度","C":"人民民主专政制度","D":"选举制度"},"explanation":"人民代表大会制度是我国的根本政治制度。","clips":[]},{"n":43,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国宪法》的规定，我国国家机构的组织原则是（）。","options":{"A":"三权分立原则","B":"民主集中制原则","C":"权力制衡原则","D":"少数服从多数原则"},"explanation":"宪法第 3 条确立了民主集中制为国家机构的组织原则。民主集中制不仅是人民代表\n\n大会制度的组织原则，也是我国所有国家机构共同遵循的活动原则。\n\nA 项错误，三权分立是西方资本主义国家的政权组织原则，我国宪法未予确立；C 项错误，\n\n权力制衡与三权分立相关，不是我国宪法确立的组织原则；D 项错误，少数服从多数是民主\n\n决策的一般规则，不是宪法规定的国家机构组织原则。","clips":[]},{"n":44,"kind":"单项选择题","answer":"B","stem":"根据《旅游法》的规定，旅行社具备履行条件，经旅游者要求仍拒绝履行合同，造成旅游者人身损害、滞留等严重后果的，旅游者还可以要求旅行社支付旅游费用（）的赔偿金。","options":{"A":"一倍到五倍","B":"一倍到三倍","C":"三倍","D":"双倍"},"explanation":"《旅游法》第 70 条，旅行社具备履行条件，经旅游者要求仍拒绝履行合同，造成旅\n\n游者人身损害、滞留等严重后果的，旅游者还可以要求旅行社支付旅游费用一倍以上三倍以\n\n下的赔偿金。","clips":[]},{"n":45,"kind":"单项选择题","answer":"B","stem":"《旅游法》规定，旅游行程开始前，旅游者可以将包价旅游合同中自身的权利义务转让第三人，旅行社没有正当理由的不得拒绝，因此增加的费用由（）承担。","options":{"A":"第三人","B":"旅游者和第三人","C":"旅游者","D":"旅游者或第三人"},"explanation":"《旅游法》第 64 条规定，旅游行程开始前，旅游者可以将包价旅游合同中自身的权\n\n利义务转让给第三人，旅行社没有正当理由的不得拒绝，因此增加的费用由旅游者和第三人\n\n承担。\n\n[答题技巧]\n\n旅游行程开始前，旅游者可以转让权利义务，旅行社没有正当理由不得拒绝，增加的费用由\n\n转让人和受让人承担。\n\n不能拒绝，但是也有条件不允许的情况不得已拒绝。所以是没有正当理由的不得拒绝。","clips":[]},{"n":46,"kind":"单项选择题","answer":"B","stem":"《中华人民共和国旅游法》规定，景区超过最大承载量接待旅游者的，由景区主管部门责令改正，情节严重的，责令停业整顿（）。","options":{"A":"1 个月至 3 个月","B":"1 个月至 6 个月","C":"6 个月至 9 个月","D":"9 个月至 12 个月"},"explanation":"《旅游法》第 105 条，景区在旅游者数量可能达到最大承载量时，未依照本法规定\n\n公告或者未向当地人民政府报告，未及时采取疏导、分流等措施，或者超过最大承载量接待\n\n旅游者的，由景区主管部门责令改正，情节严重的，责令停业整顿 1 个月至 6 个月。","clips":[]},{"n":47,"kind":"单项选择题","answer":"B","stem":"我国《旅游法》规定，（）统筹组织国家旅游形象的境外推广工作。","options":{"A":"国务院","B":"国务院旅游主管部门","C":"国家","D":"国务院外交主管部门"},"explanation":"《旅游法》第 25 条规定，国家制定并实施旅游形象推广战略。国务院旅游主管部门\n\n统筹组织国家旅游形象的境外推广工作，建立旅游形象推广机构和网络，开展旅游国际合作\n\n与交流。","clips":[]},{"n":48,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，合同解除后，以下说法正确的是（）。","options":{"A":"尚未履行的，继续履行","B":"已经履行的，当事人无法请求恢复原状","C":"已经履行的，根据履行情况和合同性质，当事人可以请求采取其他补救措施","D":"已经履行的，当事人无权请求赔偿损失"},"explanation":"《民法典》第 566 条规定，合同解除后，尚未履行的，终止履行；已经履行的，根\n\n据履行情况和合同性质，当事人可以请求恢复原状或者采取其他补救措施，并有权请求赔偿\n\n损失。","clips":[]},{"n":49,"kind":"单项选择题","answer":"C","stem":"根据《民法典》的规定，16 周岁以上的未成年人，以自己的劳动收入为主要生活来源的，（）。","options":{"A":"为完全民事行为能力人","B":"为限制民事行为能力人","C":"视为完全民事行为能力人","D":"为无民事行为能力人"},"explanation":"16 周岁以上的未成年人（不满 18 周岁的自然人为未成年人），以自己的劳动收入为\n\n主要生活来源的，视为完全民事行为能力人。","clips":[]},{"n":50,"kind":"单项选择题","answer":"D","stem":"根据《民法典》的规定，以下关于防止损失扩大义务的说法，正确的是（）。","options":{"A":"当事人一方违约后，对方可以采取适当措施防止损失的扩大","B":"没有采取适当措施致使损失扩大的，因为对方违约造成的损失也无权要求赔偿","C":"当事人因防止损失扩大支出的合理费用，由双方分担","D":"因违约而发生的损害由违约方所致，受害人对此没有过错"},"explanation":"《民法典》第 591 条规定，当事人一方违约后，对方应当采取适当措施防止损失的\n\n扩大；没有采取适当措施致使损失扩大的，不得就扩大的损失要求赔偿。当事人因防止损失\n\n扩大支出的合理费用，由违约方承担。","clips":[]},{"n":51,"kind":"单项选择题","answer":"C","stem":"为保护当事人的利益，《民法典》规定，基于重大误解实施的民事法律行为，行为人有权请求人民法院或者仲裁机构（）。","options":{"A":"变更","B":"变更或撤销","C":"撤销","D":"宣布无效"},"explanation":"《民法典》第 147 条规定，基于重大误解实施的民事法律行为，行为人有权请求人\n\n民法院或者仲裁机构予以撤销。","clips":[]},{"n":52,"kind":"单项选择题","answer":"B","stem":"根据《民法典》的规定，建筑物、构筑物或者其他设施及其搁置物、悬挂物发生脱落、坠落造成他人损害，（）无需承担侵权责任。","options":{"A":"所有人","B":"施工单位","C":"使用人","D":"管理人"},"explanation":"《民法典》第 1253 条，建筑物、构筑物或者其他设施及其搁置物、悬挂物发生脱落、\n\n坠落造成他人损害，所有人、管理人或者使用人不能证明自己没有过错的，应当承担侵权责\n\n任。","clips":[]},{"n":53,"kind":"单项选择题","answer":"A","stem":"某旅行社导游杨某带团游览一山水景点时，因道路狭窄，游客李某被同行张某不慎挤落水中，造成人身伤害。有证据表明，杨某多次提醒游客注意安全。根据《民法典》的规定，下列选项正确的是（）。","options":{"A":"旅行社对李某不承担赔偿责任","B":"旅行社应当对李某承担连带赔偿责任","C":"旅行社应当对李某承担补充赔偿责任","D":"旅行社赔偿后，有权向张某追偿"},"explanation":"解析因第三人的行为造成旅游者人身损害、财产损失，由第三人承担责任；旅游经\n\n营者、旅游辅助服务者未尽安全保障义务，旅游者请求其承担相应补充责任的，人民法院应\n\n予支持。关键词：第三人张某造成李某受伤，旅行社的导游杨某已尽安全保障义务，故旅行\n\n社不对李某承担赔偿。","clips":[]},{"n":54,"kind":"单项选择题","answer":"A","stem":"根据《民法典》的规定，以下对侵害他人造成人身损害的赔偿，说法正确的是（）。","options":{"A":"应当赔偿医疗费、护理费等合理费用","B":"因误工减少的收入及利息","C":"同一侵权行为造成多人死亡的，应当以相同数额确定死亡赔偿金","D":"被侵权人死亡的，其亲属有权请求侵权人承担侵权责任"},"explanation":"“利息”错误，《民法典》第 1179 条，侵害他人造成人身损害的，应当赔偿医疗费、\n\n护理费、交通费、营养费、住院伙食补助费等为治疗和康复支出的合理费用，以及因误工减\n\n少的收入；\n\n“应当”错误，第 1180 条，因同一侵权行为造成多人死亡的，可以以相同数额确定死亡赔\n\n偿金；“亲属”错误，第 1181 条，被侵权人死亡的，其近亲属有权请求侵权人承担侵权责任。","clips":[]},{"n":55,"kind":"单项选择题","answer":"B","stem":"根据《旅游法》的规定，旅行社组织旅游活动必须向（）的供应商订购旅游产品和旅游服务。","options":{"A":"优质","B":"合格","C":"诚信","D":"报价合理"},"explanation":"《旅游法》第 34 条规定，旅行社组织旅游活动必须向合格的供应商订购旅游产品和\n\n旅游服务。","clips":[]},{"n":56,"kind":"单项选择题","answer":"D","stem":"依据《旅行社服务质量赔偿标准》，旅行社组织国内旅游因自身原因不能成行的，应在规定的期限内通知旅游者。下列关于旅行社赔偿违约金的说法中，正确的是（）。","options":{"A":"提前 3 日通知的，应支付旅游费用总额 20%的违约金","B":"提前 2 日通知的，应支付旅游费用总额 30%的违约金","C":"提前 5 日通知的，应支付旅游费用总额 15%的违约金","D":"提前 6 日通知的，应支付旅游费用总额 10%的违约金"},"explanation":"“提前 3 日通知……”和“提前 2 日通知……”错误，出发前 3 日至 1 日通知的，\n\n应支付旅游费用总额 15%的违约金；“提前 5 日通知……”错误，出发前 7 日（含 7 日）至 4\n\n日通知，应支付旅游费用总额 10%的违约金。","clips":[]},{"n":57,"kind":"单项选择题","answer":"C","stem":"根据《旅行社条例》的规定，某旅行社导游员小张未经旅游者同意，擅自将团队带入行程单以外的某购物店购买商品，那么旅游者有权在（）要求旅行社为其办理退货并先行垫付退货货款。","options":{"A":"购买商品后 30 日内","B":"旅游合同签订后 30 日内","C":"旅游行程结束后 30 日内","D":"旅游行程结束前"},"explanation":"《旅游法》第 35 条规定，旅行社不得以不合理的低价组织旅游活动，诱骗旅游者，\n\n并通过安排购物或者另行付费旅游项目获取回扣等不正当利益。旅行社组织、接待旅游者，\n\n不得指定具体购物场所，不得安排另行付费旅游项目。但是，经双方协商一致或者旅游者要\n\n求，且不影响其他旅游者行程安排的除外。发生违反前两款规定情形的，旅游者有权在旅游\n\n行程结束后 30 日内，要求旅行社为其办理退货并先行垫付退货货款，或者退还另行付费旅\n\n游项目的费用。","clips":[]},{"n":58,"kind":"单项选择题","answer":"B","stem":"根据《旅游法》《旅行社条例》的规定，以下说法正确的是（）。","options":{"A":"旅行社为接待旅游者委派的导游人员，应当持有国家规定的导游资格证","B":"旅行社组织团队出境旅游，应当按照规定安排领队或者导游全程陪同","C":"旅行社应当与其委派从事领队业务的导游订立劳务合同","D":"旅行社应当将本单位领队名单报所在地省级旅游行政管理部门备案"},"explanation":"《旅游法》第 36 条规定，旅行社组织团队出境旅游或者组织、接待团队入境旅游，\n\n应当按照规定安排领队或者导游全程陪同。","clips":[]},{"n":59,"kind":"单项选择题","answer":"B","stem":"在线旅游经营者未取得质量标准、信用等级使用相关称谓和标识的，依据《在线旅游经营服务管理暂行规定》，由县级以上文化和旅游主管部门责令改正，给予警告，可以并处（）万元以下罚款。","options":{"A":"1","B":"3","C":"5","D":"10"},"explanation":"《在线旅游经营服务管理暂行规定》第 34 条规定，在线旅游经营者违反本规定第\n\n12 条第 1 款有关规定，未取得质量标准、信用等级使用相关称谓和标识的，由县级以上文\n\n化和旅游主管部门责令改正，给予警告，可并处 3 万元以下罚款。","clips":[]},{"n":60,"kind":"单项选择题","answer":"B","stem":"《文化和旅游市场信用管理规定》规定，导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起（）内不得重新申请导游证或者从事旅行社业务。","options":{"A":"5 年","B":"3 年","C":"2 年","D":"1 年"},"explanation":"导游、领队因被吊销导游证而被认定为严重失信主体的，旅行社有关管理人员因旅\n\n行社被吊销旅行社业务经营许可证而被认定为严重失信主体的，自处罚之日起 3 年内不得重\n\n新申请导游证或者从事旅行社业务。","clips":[]},{"n":61,"kind":"单项选择题","answer":"C","stem":"根据《中华人民共和国宪法》的规定，全国人民代表大会每届任期为（）。","options":{"A":"2 年","B":"3 年","C":"5 年","D":"无限"},"explanation":"全国人民代表大会每届任期 5 年（第 60 条）；地方各级人民代表大会每届任期 5 年\n\n（第 98 条）。","clips":[]},{"n":62,"kind":"单项选择题","answer":"C","stem":"《旅游法》规定，导游或领队未经旅行社委派，私自承揽业务，由旅游主管部门责令改正，没收违法所得，处（）罚款，并暂扣或者吊销导游证。","options":{"A":"500 元以上 5000 元以下","B":"2000 元以上 2 万元以下","C":"1000 元以上 1 万元以下","D":"1000 元以下"},"explanation":"《旅游法》第 102 条，导游、领队私自承揽业务，由旅游主管部门责令改正，没收\n\n违法所得，处 1000 元以上 1 万元以下罚款，并暂扣或者吊销导游证。","clips":[]},{"n":63,"kind":"单项选择题","answer":"D","stem":"《导游管理办法》规定，我国领队管理由资格准入制改为（）管理制度，旅游主管部门不再对领队从业进行行政审批。","options":{"A":"注册","B":"登记","C":"审核","D":"备案"},"explanation":"《导游管理办法》第 25 条，具备领队条件的导游从事领队业务的，应当符合《旅行\n\n社条例实施细则》等法律、法规和规章的规定。旅行社应当按要求将本单位具备领队条件的\n\n领队信息及变更情况，通过全国旅游监管服务信息系统报旅游主管部门备案。据此可以推断\n\n此处是“备案”。","clips":[]},{"n":64,"kind":"单项选择题","answer":"A","stem":"导游员王某在带团中未佩戴导游身份标识，旅游主管部门在依法检查中发现，且王某百般狡辩，拒不改正。根据《导游人员管理条例》的规定，旅游行政部门可以对王某罚款（）。","options":{"A":"300 元","B":"600 元","C":"800 元","D":"1000 元"},"explanation":"导游在执业过程中应当携带电子导游证、佩戴导游身份标识，并开启导游执业相关\n\n应用软件，由旅游行政部门责令改正；拒不改正的，处 500 元以下的罚款。","clips":[]},{"n":65,"kind":"单项选择题","answer":"A","stem":"依据《中华人民共和国消费者权益保护法》的规定，有关行政部门收到消费者投诉，应当自收到投诉之日起（）个工作日内予以处理并告知消费者。","options":{"A":"7","B":"10","C":"15","D":"20"},"explanation":"解析有关行政部门应当自收到投诉之日起 7 个工作日内，予以处理并告知消费者。\n\n对不符合规定的投诉决定不予受理的，应当告知消费者不予受理的理由和其他解决争议的途\n\n径。","clips":[]},{"n":66,"kind":"单项选择题","answer":"C","stem":"《消费者权益保护法》规定，经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起 6 个月内发现瑕疵，发生争议的，由（）承担有关瑕疵的举证责任。","options":{"A":"生产者","B":"消费者","C":"经营者","D":"以上都需要"},"explanation":"《消费者权益保护法》规定，经营者提供的机动车、计算机、电视机、电冰箱、空\n\n调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起 6 个月内\n\n发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。","clips":[]},{"n":67,"kind":"单项选择题","answer":"B","stem":"下列不属于《治安管理处罚法》规定的治安管理处罚种类的是（）。","options":{"A":"警告","B":"罚金","C":"行政拘留","D":"吊销公安机关发放的许可证件"},"explanation":"解析依据第 10 条，治安管理处罚分为警告、罚款、行政拘留、吊销公安机关发放的\n\n许可证件四种，对违反治安管理的外国人还可以附加适用限期出境或者驱逐出境。罚金属于\n\n刑罚种类，不是治安管理处罚。B 项正确：罚金属于刑罚中的财产刑，不是治安管理处罚种\n\n类。","clips":[]},{"n":68,"kind":"单项选择题","answer":"D","stem":"根据《治安管理处罚法》的规定，对违反治安管理行为当事人在（）个月内曾受过治安管理处罚的，予以从重处罚。","options":{"A":"1","B":"3","C":"6","D":"12"},"explanation":"《治安管理处罚法》第 20 条规定，违反治安管理有下列情形之一的，从重处罚：\n\n（1）有较严重后果的；（2）教唆、胁迫、诱骗他人违反治安管理的；（3）对报案人、控告\n\n人、举报人、证人打击报复的；（4）一年内曾受过治安管理处罚的。","clips":[]},{"n":69,"kind":"单项选择题","answer":"B","stem":"根据《旅游投诉处理办法》第 7 条的规定，对于同一个旅游纠纷，两个以上旅游投诉处理机构都有管辖权的，由（）管辖。","options":{"A":"旅游经营者住所地的旅游投诉处理机构","B":"最先收到的旅游投诉处理机构","C":"投诉人首先选择的旅游投诉处理机构","D":"共同的上一级旅游投诉处理机构"},"explanation":"《旅游投诉处理办法》第 7 条规定：“除本办法第五条第二款规定的情形外，对于同\n\n一个旅游纠纷，两个以上的旅游投诉处理机构都有管辖权的，由最先收到的旅游投诉处理机\n\n构管辖。”管辖冲突时以“最先收到投诉”为确定标准，既防止互相推诿，也防止重复受理。","clips":[]},{"n":70,"kind":"单项选择题","answer":"C","stem":"根据《旅游投诉处理办法》第 13 条的规定，投诉人（）人以上，以同一事由投诉同一被投诉人的，为共同投诉。","options":{"A":"2","B":"3","C":"4","D":"5"},"explanation":"《旅游投诉处理办法》第 13 条规定：“投诉人四人以上，以同一事由投诉同一被投\n\n诉人的，为共同投诉。共同投诉可以由投诉人推选一至三名代表人进行投诉。”共同投诉须\n\n同时满足“四人以上”“同一事由”“同一被投诉人”三个要件。","clips":[]},{"n":71,"kind":"单项选择题","answer":"B","stem":"根据《旅游投诉处理办法》的规定，旅游投诉处理机构处理旅游投诉，一般实行（）制度。","options":{"A":"和解","B":"调解","C":"仲裁","D":"登记"},"explanation":"（原文解析未完整显示）","clips":[]},{"n":72,"kind":"单项选择题","answer":"A","stem":"根据《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》，下列属于旅游经营者、旅游辅助服务者不予免责情形的是（）。","options":{"A":"旅游者自行安排旅游活动期间旅行社未做必要提示","B":"旅游者未履行如实告知义务的","C":"因不可抗力等客观原因导致旅游合同无法履行的","D":"旅游者擅自脱团的"},"explanation":"《最高人民法院关于审理旅游纠纷案件适用法律若干问题的规定》第 19 条规定，旅\n\n游者在自行安排活动期间遭受人身损害、财产损失，旅游经营者未尽到必要的提示义务、救\n\n助义务，旅游者请求旅游经营者承担相应责任的，人民法院应予支持。","clips":[]},{"n":73,"kind":"单项选择题","answer":"C","stem":"《旅游法》规定，旅游经营者应当严格执行安全生产管理和（）的法律、法规和国家标准、行业标准。","options":{"A":"安全保护制度","B":"安全防范措施","C":"消防安全管理","D":"安全风险提示"},"explanation":"《旅游法》第 79 条，旅游经营者应当严格执行安全生产管理和消防安全管理的法律、\n\n法规和国家标准、行业标准，具备相应的安全生产条件，制定旅游者安全保护制度和应急预\n\n案。","clips":[]},{"n":74,"kind":"单项选择题","answer":"D","stem":"《旅游法》规定，旅行社应当按照规定交纳（），用于旅游者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","options":{"A":"旅游风险抵押金","B":"旅游权益损害赔偿金","C":"旅游安全保障金","D":"旅游服务质量保证金"},"explanation":"《旅游法》第 31 条规定，旅行社应当按照规定交纳旅游服务质量保证金，用于旅游\n\n者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","clips":[]},{"n":75,"kind":"单项选择题","answer":"B","stem":"旅游者 50 人以上 200 人以下滞留超过 24 小时，并对当地生产生活秩序造成较大影响的，属于（）。","options":{"A":"一般旅游突发事件","B":"较大旅游突发事件","C":"重大旅游突发事件","D":"特别重大旅游突发事件"},"explanation":"《旅游安全管理办法》第 42 条规定，本办法所称较大旅游突发事件包括下列情形：\n\n造成或者可能造成人员死亡（含失踪）3 人以上 10 人以下或者重伤 10 人以上 50 人以下；\n\n旅游者 50 人以上 200 人以下滞留超过 24 小时，并对当地生产生活秩序造成较大影响；其他\n\n在境内外产生较大影响，并对旅游者人身、财产安全造成较大威胁的事件。","clips":[]},{"n":76,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国民用航空法》的规定，旅客未能出示客票、客票不符合规定或者客票遗失，下列说法正确的是（）。","options":{"A":"航空旅客运输合同直接失效","B":"不影响航空旅客运输合同的存在或者有效","C":"承运人有权拒绝提供全部运输服务","D":"旅客须出示购票凭证方可乘机"},"explanation":"法条原文：第 116 条客票是航空旅客运输合同订立和运输合同条件的初步证据。旅\n\n客未能出示客票、客票不符合规定或者客票遗失，不影响运输合同的存在或者有效。\n\nA 项错误，客票仅为运输合同订立的初步证据，旅客未能出示客票、客票不符合规定或者客\n\n票遗失，不影响运输合同的存在或者有效，不会导致合同直接失效。\n\nB 项正确，符合第 116 条规定，不影响运输合同的存在或者有效。\n\nC 项错误，客票问题不影响合同效力，承运人不能因此拒绝提供运输服务。\n\nD 项错误，法律并未规定。","clips":[]},{"n":77,"kind":"单项选择题","answer":"B","stem":"申请开办饭店，未经公安机关审查批准，也未向工商行政管理部门申请登记，未领取营业执照而开业的，公安机关可以酌情给予警告或者处以（）罚款。","options":{"A":"200 元","B":"200 元以下","C":"500 元","D":"500 元以下"},"explanation":"解析申请开办饭店，未经公安机关审查批准，也未向工商行政管理部门申请登记，\n\n未领取营业执照而开业的，公安机关可以酌情给予警告或者处以 200 元以下罚款。","clips":[]},{"n":78,"kind":"单项选择题","answer":"C","stem":"根据《娱乐场所管理条例》，娱乐场所设置具有赌博功能的电子游戏机机型、机种、电路板等游戏设施设备的，由县级公安部门没收违法所得和非法财物，并处违法所得（）的罚款。","options":{"A":"1 倍以上 3 倍以下","B":"1 倍以上 5 倍以下","C":"2 倍以上 5 倍以下","D":"5 倍以上 10 倍以下"},"explanation":"娱乐场所有下列情形之一的，由县级公安部门没收违法所得和非法财物，并处违法\n\n所得 2 倍以上 5 倍以下的罚款。设置具有赌博功能的电子游戏机机型、机种、电路板等游戏\n\n设施设备的。以现金、有价证券作为奖品，或者回购奖品的。","clips":[]},{"n":79,"kind":"单项选择题","answer":"B","stem":"根据《风景名胜区条例》的规定，规划期届满前（），组织编制机关应当对风景名胜区规划组织评估，决定是否重新编制规划。","options":{"A":"1 年","B":"2 年","C":"3 年","D":"5 年"},"explanation":"《风景名胜区条例》第二十三条：风景名胜区总体规划的规划期届满前 2 年，规划\n\n的组织编制机关应当组织专家对规划进行评估，作出是否重新编制规划的决定。在新规划批\n\n准前，原规划继续有效。","clips":[]},{"n":80,"kind":"单项选择题","answer":"D","stem":"根据《自然保护区条例》的规定，自然保护区核心保护区以外的区域划为（）。","options":{"A":"实验区","B":"缓冲区","C":"过渡区","D":"一般控制区"},"explanation":"《自然保护区条例》第十六条：自然保护区划分为核心保护区和一般控制区，实行\n\n分区管控。核心保护区以外的区域划为一般控制区。\n\nABC 三项错误，实验区、缓冲区、核心区是修订前条例的三区划分模式；\n\nD 项正确，现行条例已调整为“核心保护区+一般控制区”两区管控，依据条例第十六条。","clips":[]},{"n":81,"kind":"单项选择题","answer":"A","stem":"（）全面推进，构建人类命运共同体成为引领时代潮流和人类前进方向的鲜明旗帜，我国外交在世界大变局中开创新局、在世界乱局中化危为机，我国国际影响力、感召力、塑造力显著提升。","options":{"A":"中国特色大国外交","B":"和平共处五项原则","C":"独立自主的外交政策","D":"对外开放战略"},"explanation":"中国特色大国外交全面推进，构建人类命运共同体成为引领时代潮流和人类前进方\n\n向的鲜明旗帜，我国外交在世界大变局中开创新局、在世界乱局中化危为机，我国国际影响\n\n力、感召力、塑造力显著提升。","clips":[]},{"n":82,"kind":"单项选择题","answer":"D","stem":"全面推进依法治国必须全面贯彻和坚持的基本原则包括（）。","options":{"A":"坚持从人民需求出发","B":"坚持政府的领导","C":"坚持中国共产党的主体地位","D":"坚持依法治国和以德治国相结合"},"explanation":"解析“坚持从人民需求出发”改成坚持从中国实际出发；“坚持政府的领导”改成坚\n\n持中国共产党的领导；“坚持中国共产党的主体地位”改成坚持人民主体地位。","clips":[]},{"n":83,"kind":"单项选择题","answer":"C","stem":"《港区国安法》规定，有以下（）情形的，对有关犯罪嫌疑人可以从轻、减轻处罚。","options":{"A":"在犯罪过程中，被动放弃犯罪的","B":"自动投案，如实供述他人罪行的","C":"在犯罪过程中，自动有效地防止犯罪结果发生的","D":"揭发他人犯罪行为"},"explanation":"解析《港区国安法》第 33 条规定。“在犯罪过程中，被动放弃犯罪的”错在“被动”，\n\n正确的说法是“主动”；“自动投案，如实供述他人罪行的”错在“他人”，正确的说法是“自\n\n己的”；“揭发他人犯罪行为”错在表述不完全，不仅“揭发他人犯罪行为”，还要查证属实。","clips":[]},{"n":84,"kind":"单项选择题","answer":"B","stem":"下列选项中，关于奏唱国歌的场合，正确的是（）。","options":{"A":"宪法修改仪式","B":"国家公祭仪式","C":"重大社交活动","D":"各机构组织的重大纪念仪式"},"explanation":"根据《国歌法》第 4 条规定，“宪法颁布仪式”错误，是“宪法宣誓仪式”；\n\n“重大社交活动”错误，是“重大外交活动”；\n\n“各机构”错误，是“各级机关”。","clips":[]},{"n":85,"kind":"单项选择题","answer":"D","stem":"依据文化和旅游部《旅游强国建设“十五五”规划》，规划提出，深入开展（）国家旅游形象推广。","options":{"A":"“旅游中国美好生活”","B":"“美丽中国”","C":"“畅游中国”","D":"“你好！中国”"},"explanation":"健全国家旅游对外推广体系。加强中国旅游品牌的整体设计，深入开展“你好！中\n\n国”国家旅游形象推广，结合自然资源、历史文化等建立高辨识度的营销品牌。\n\nA 项错误，“旅游中国美好生活”是国内旅游宣传推广活动名称，不属于国家旅游形象推广，\n\n故 A 错误。B 项错误，“美丽中国”是规划中“文明旅游美丽中国”主题活动的表述，不是\n\n国家旅游形象推广，故 B 错误。\n\nC 项错误，“畅游中国”不是规划表述，故 C 错误。D 项正确，深入开展“你好！中国”国家\n\n旅游形象推广，符合规划原文，故 D 正确。","clips":[]},{"n":86,"kind":"单项选择题","answer":"C","stem":"某通讯公司甲为铺设地下管线，在步行街路面挖一深坑，并放置了警示标志用作提醒。乙驾驶汽车撞倒标志后未及时复原，致使丙骑电动车途经该处时避让不及，撞倒人行道上的旅游者丁。下列关于赔偿的说法中，正确的是（）。","options":{"A":"乙独自承担赔偿责任","B":"乙、丙共同承担赔偿责任","C":"甲、乙共同承担赔偿责任","D":"甲、乙、丙共同承担赔偿责任"},"explanation":"《侵权责任法》第 91 条，在公共场所或者道路上挖坑、修缮安装地下设施等，没有\n\n设置明显标志和采取安全措施造成他人损害的，施工人应当承担侵权责任。虽然在此处，甲\n\n放置了警示标志，但是并没有采取合适的安全措施，故需要承担责任。\n\n第 31 条，因紧急避险造成损害的，由引起险情发生的人承担责任。如果危险是由自然原因\n\n引起的，紧急避险人不承担责任或者给予适当补偿。紧急避险采取措施不当或者超过必要的\n\n限度，造成不应有的损害的，紧急避险人应当承担适当的责任。丙的行为属于紧急避险，因\n\n此无需承担责任。","clips":[]},{"n":87,"kind":"单项选择题","answer":"C","stem":"导游服务作为一种职业正式出现在（）年。","options":{"A":"1841","B":"1845","C":"1846","D":"1865"},"explanation":"1846 年，导游服务作为一种职业的正式出现在苏格兰之行。","clips":[]},{"n":88,"kind":"单项选择题","answer":"A","stem":"对导游采用严格型管理、需通过国家统一考试持证上岗的是（）。","options":{"A":"日本","B":"德国","C":"美国","D":"英国"},"explanation":"对导游采用严格型管理，需通过国家统一考试持证上岗的新加坡、日本、以色列。","clips":[]},{"n":89,"kind":"单项选择题","answer":"B","stem":"下列选项中，对导游服务地位描述不正确的一项是（）。","options":{"A":"旅游服务水平的体现者","B":"旅游政策制定的主导者","C":"旅游市场竞争的助力者","D":"旅游产品信息的反馈者"},"explanation":"导游服务的地位：旅游服务工作的主导者；旅游服务水平的体现者；旅游市场竞争\n\n的助力者；旅游产品信息的反馈者。","clips":[]},{"n":90,"kind":"单项选择题","answer":"D","stem":"关于高级导游晋升特级导游的说法，正确的一项是（）。","options":{"A":"原则上采取论文答辩形式，每 3 年开展一次","B":"考核内容是综合案例分析和导游词创作等","C":"申请参加特级导游等级考核的，应具有大学专科以上学历","D":"高级导游在三年内，全国旅游监管服务平台带团记录不少于 25 次或 90 天"},"explanation":"考核形式：特级导游等级考核，原则上采取论文答辩形式，每 4 年开展一次；根据\n\n需要，可增加笔试形式；\n\n考核科目和内容：导游词创作和导游相关专业论文等；\n\n考核条件：申请参加特级导游等级考核的，应具有大学本科以上学历，取得高级导游等级满\n\n3 年，3 年内在全国旅游监管服务平台的带团记录不少于 25 次或 90 天。","clips":[]},{"n":91,"kind":"单项选择题","answer":"D","stem":"下列关于导游工作着装要求的描述，正确的一项是（）。","options":{"A":"为突出导游特点，可适当多搭配装饰物","B":"全身颜色不宜超过 2 种","C":"因导游全天工作为避免汗味，可使用气味较浓烈的香水","D":"使用无线设备时，接收器隐藏于衣物内，避免外露影响美观"},"explanation":"配饰应简约大方，避免夸张首饰或过多装饰物；全身颜色不宜超过 3 种；避免使用\n\n气味浓烈的香水；使用无线设备时，接收器应隐藏于衣物内，避免外露影响美观。","clips":[]},{"n":92,"kind":"单项选择题","answer":"A","stem":"握手礼仪在实践中运用正确的是（）。","options":{"A":"握手一定要伸右手，伸左手是不礼貌的","B":"握手的时间以一至三秒为宜，关系亲近的当然可以长时间相握","C":"在寒冷的冬天，可以带手套握手","D":"无论是同性还是异性，握手力度要保持一致"},"explanation":"握手一定要伸右手，伸左手是不礼貌的；握手的时间以三至五秒为宜，关系亲近的\n\n当然可以长时间相握；用力大小也应适度。对男子可以稍重些，对女子则应轻柔；寒冷的冬\n\n天，户外相遇或者时间仓促来不及脱手套，在握手开始时，应说一声：“对不起！。","clips":[]},{"n":93,"kind":"单项选择题","answer":"C","stem":"为他人做介绍时，应该遵循的介绍原则是（）。","options":{"A":"将身份高的介绍给身份低的","B":"将年长者介绍给年轻人","C":"将主人介绍给客人","D":"将女士介绍给男士"},"explanation":"介绍原则：应遵循“让长者、客人先知”的原则。即先把身份低的、年纪轻的介绍\n\n给身份高的、年纪大的；先将主人介绍给客人；先将男士介绍给女士。","clips":[]},{"n":94,"kind":"单项选择题","answer":"B","stem":"下列内容中，（）不是欢送词中的内容。","options":{"A":"对旅游团在本地的旅游行程进行简要回顾","B":"预祝旅游活动愉快顺利","C":"向旅游者以及入境领队、全陪、司机表达感谢之情","D":"对行程中存在的不尽如人意之处表示歉意"},"explanation":"对旅游团在本地的旅游行程进行简要回顾，着重提及那些能引发旅游者情感共鸣的\n\n人和事，强化旅游者对本次旅游经历的印象；向旅游者以及入境领队、全陪、司机表达感谢\n\n之情，肯定各方在此次旅程中的支持与配合；对行程中存在的不尽如人意之处表示歉意。选\n\n项 B，是欢迎词的内容。","clips":[]},{"n":95,"kind":"单项选择题","answer":"C","stem":"旅游者参加计划外的文娱活动，地陪导游操作正确的是（）。","options":{"A":"一般情况下，地陪需要陪同前往","B":"旅游者要参与不正常的夜生活活动，地陪应耐心劝阻","C":"地陪应准确告知演出时间、地点和票价等信息，必要时可协助其购票","D":"地陪应告知其不是接团计划内的，请其自行处理"},"explanation":"（1）提供准确信息（可协助购票，一般不陪同）：对于旅游者自行要求观看的计划\n\n外文娱节目，地陪应准确告知演出时间、地点和票价等信息，必要时可协助其购票，但一般\n\n情况下不陪同前往。\n\n（2）拒绝不健康活动（法律引导）：若旅游者欲观看不健康的文娱节目或参与不正常的夜生\n\n活活动，地陪应明确拒绝，并向其阐述我国相关法律法规，引导旅游者文明旅游。","clips":[]},{"n":96,"kind":"单项选择题","answer":"C","stem":"导游在为游客提供购物服务时，操作不当的是（）。","options":{"A":"旅游者购买商品后，地陪应提醒其妥善保存购物发票","B":"若旅游者提出托运需求，应详细介绍托运手续，并积极提供协助","C":"导游带团期间不得向游客介绍特色商品","D":"若存在小贩强买强卖现象，地陪有责任提前告知旅游者避免上当受骗"},"explanation":"解析若部分景区存在小贩强买强卖现象，地陪有责任提前告知旅游者避免上当受骗；\n\n旅游者购买商品后，地陪应提醒其妥善保存购物发票；若旅游者提出托运需求，地陪应详细\n\n介绍托运手续，并积极提供必要的协助。","clips":[]},{"n":97,"kind":"单项选择题","answer":"D","stem":"导游在带领游客游览过程中，操作恰当的是（）。","options":{"A":"让旅游者充分游览观赏，导游少讲，多陪伴","B":"导游要提供标准化讲解，不能因旅游者文化程度、理解能力和地域差异而调整","C":"导游应注重用文化诠释景点，使旅游者感觉导游高深莫测","D":"地陪时刻观察周围的环境，使游客自始至终环绕和跟随在自己周围或前后"},"explanation":"景区讲解时，地陪需确保在计划时间和费用内，让旅游者充分游览观赏，做到“导”\n\n“游”结合，集中与分散相宜，劳逸结合；\n\n根据旅游者文化程度、理解能力和地域差异调整讲解方式，观察旅游者反应，灵活调整内容\n\n和速度；\n\n注重用文化诠释景点，使旅游者领悟文化内涵，得到美的享受，讲解时要把握详略。","clips":[]},{"n":98,"kind":"单项选择题","answer":"C","stem":"关于导游旗杆的描述，正确的是（）。","options":{"A":"使用导游旗时，可以使用造型怪异的挂饰方便游客认找","B":"暂不使用导游旗时，可以当做垫坐","C":"导游旗形状以长方形或三角形为宜，尺寸以 45cm×30cm 或 60cm×40cm 为宜","D":"无论多少游客，带团时都必须打导游旗"},"explanation":"导游旗形状以长方形或三角形为宜，旗面宽高尺寸以 45cm×30cm 或 60cm×40cm 为\n\n宜，颜色应鲜艳醒目，材质易于飘扬，旗面应印制旅行社名称、标志或产品名称，字迹清晰、\n\n易辨识，无违背公序良俗的文字、符号或图案。导游服务过程中，当旅游者人数超过 10 人\n\n时应持导游旗，旅游者人数少于 10 人时可根据现场情况决定是否持导游旗。\n\n导游在使用导游旗时，应保持旗杆直立，旗面位于旅游者易辨识的方位；\n\n暂不使用导游旗时，需妥善放置，不应垫坐、玩耍等。","clips":[]},{"n":99,"kind":"单项选择题","answer":"C","stem":"导游带团讲解时，符合音量大小要求的选项是（）。","options":{"A":"音量应以绝大多数游客能听清为宜","B":"在庄严肃穆的场合适当提高音量","C":"讲解重要信息时应适当加大音量，提醒游客注意","D":"提及敏感的内容时，适当提高音量"},"explanation":"1. 旅游者人数多少：当旅游者人数较多时，应适当提高音量；反之则降低。音量应\n\n以每位旅游者能听清为宜，如有需要，可借助扩音器辅助讲解；\n\n2. 讲解点环境情况：在宽阔地带且人员分散、环境嘈杂的场景下，应适当提高音量；而在\n\n庄严重要场合、室内安静空间等场所进行讲解时，则应适当减小音量；\n\n3. 讲解内容的重要程度：讲解重要内容或需强调信息时，应加大音量以提醒旅游者注意；\n\n提及敏感、不宜多讲内容时，则应轻描淡写。","clips":[]},{"n":100,"kind":"单项选择题","answer":"B","stem":"导游的讲解必须以客观事实为依据，杜绝信口开河、胡编乱造的行为，这体现了（）的准确性。","options":{"A":"思想观点","B":"讲解内容","C":"遣词造句","D":"语音语调"},"explanation":"讲解内容准确：导游的讲解必须以客观事实为依据，杜绝信口开河、胡编乱造的行\n\n为。导游需要持续学习，积累扎实的知识储备，深入了解游览景点的历史、文化、风俗习惯\n\n等各方面情况。","clips":[]},{"n":101,"kind":"单项选择题","answer":"C","stem":"以生产日期计算，救生衣使用年限建议不超过（），且救生衣出现破损应及时更换。","options":{"A":"3 年","B":"5 年","C":"6 年","D":"8 年"},"explanation":"解析以生产日期计算，救生衣使用年限建议不超过 6 年，且救生衣出现破损应及时\n\n更换。","clips":[]},{"n":102,"kind":"单项选择题","answer":"C","stem":"未满 18 周岁的港澳居民办理港澳居民来往内地通行证，签发有效期为（）。","options":{"A":"1 年","B":"3 年","C":"5 年","D":"10 年"},"explanation":"解析港澳居民来往内地通行证：通行证有效期分为 5 年与 10 年两种：申请人年满\n\n18 周岁，签发有效期为 10 年；未满 18 周岁，签发有效期为 5 年的通行证。","clips":[]},{"n":103,"kind":"单项选择题","answer":"D","stem":"（）常用于表达讽刺、含蓄、烦躁、轻薄、厌恶、意外等情绪。","options":{"A":"高声调","B":"低降调","C":"平直调","D":"曲折调"},"explanation":"曲折调常用于表达讽刺、含蓄、烦躁、轻薄、厌恶、意外等情绪。","clips":[]},{"n":104,"kind":"单项选择题","answer":"C","stem":"导游将目光集中投向某一旅游者或某区域，以产生情绪呼应。这是目光语中的（）。","options":{"A":"前视法","B":"环视法","C":"点视法","D":"虚视法"},"explanation":"点说法：导游将目光集中投向某一旅游者或某区域，以产生情绪呼应。","clips":[]},{"n":105,"kind":"单项选择题","answer":"A","stem":"华山是五岳中海拔最高的山峰，其陡峭险峻位居五岳之首，也是五岳中唯一为道教所独占的名山。这些内容都属于突出重点法中的（）。","options":{"A":"突出独特之处","B":"突出有代表性部分","C":"突出旅游者感兴趣的内容","D":"突出“最”“第一”"},"explanation":"突出重点法：突出独特之处；突出有代表性部分；突出旅游者感兴趣的内容；突出\n\n“最”“第一”。","clips":[]},{"n":106,"kind":"单项选择题","answer":"D","stem":"带领老年团旅行时，导游操作正确的一项是（）。","options":{"A":"景点游览宜多，为老年人创造机会多看多游","B":"导游适当采用激将法刺激老年人参加挑战性不强的项目","C":"讲解内容应讲一些专业知识，少一些家常闲聊","D":"景点线路复杂场所，导游要不厌其烦地提醒，预防老年人迷路走丢"},"explanation":"景点游览宜少而精：每天的游览项目不宜过多。在合同约定范围内，选择景点内具\n\n有代表性的点位参观，游览内容少而精，慢行细看，让老年人有足够的时间欣赏和休息；参\n\n游项目宜量力而行：导游不宜用激将法刺激老年人参加挑战性项目。应提醒他们慎重考虑，\n\n量力而行，避免因体力不支而发生危险；在景点线路复杂、游人拥挤的场所，导游要不厌其\n\n烦地提醒，预防老年人迷路走丢；讲解内容应减少说教，多一些家常闲聊。","clips":[]},{"n":107,"kind":"单项选择题","answer":"C","stem":"儿童不满 2 周岁但需要一个独立座位，其购买机票的票价是（）。","options":{"A":"成人正常票价的 10%","B":"成人正常票价的 20%","C":"成人正常票价的 50%","D":"成人正常票价的 70%"},"explanation":"婴儿票：成人正常票价的 10%，不单独占座。需占座则购买儿童票。儿童票：成人\n\n正常票价 50%，独立占有一个座位。","clips":[]},{"n":108,"kind":"单项选择题","answer":"B","stem":"导游在安排游览顺序时，宜采用（）。","options":{"A":"“松紧相间，先紧后松”","B":"“先远后近，先高后低”","C":"“快旅慢游，精彩在后”","D":"“难易相兼，先易后难”"},"explanation":"游览顺序宜“先远后近，先高后低”：\n\n“先远后近”指整体行程先游览离交通站点远的景点，提升最后送站的把握度；每日行程先\n\n安排离酒店远的景点，方便旅游者疲惫时快速回酒店休息。\n\n“先高后低”则是将爬山、登楼等登高项目安排在游览初期，此时旅游者精力充沛、挑战欲\n\n望强，避免后期因体力不足或兴趣丧失放弃登高。","clips":[]},{"n":109,"kind":"单项选择题","answer":"D","stem":"面对游客单独用餐或不随团用餐的情况，导游处理规范的选项是（）。","options":{"A":"因旅游团内部矛盾或其他原因，导游婉转拒绝单独用餐请求","B":"告知游客单独用餐费用自理，原餐费不退","C":"按照团队计划人数上菜","D":"如因游客身体不适，同意旅游者不随团用餐的要求，餐费按照合同约定处理"},"explanation":"1. 因旅游团内部矛盾或其他原因提出时：\n\n问清情况，耐心解释，建议其与其他旅游者一起用餐；\n\n如旅游者坚持单独用餐，可协助其与餐厅联系，但应告知旅游者单独用餐的餐费自理，原餐\n\n费根据旅游合同约定处理。\n\n2. 由于外出自由活动、访友、疲劳等原因不随团用餐时：\n\n关心旅游者身体状况：同意旅游者要求，并第一时间对身体不适的旅游者予以关心照顾。\n\n明确餐费处理方式：告知旅游者原餐费根据旅游合同约定处理。通知餐馆调整用餐人数：及\n\n时通知餐馆减少用餐人数。","clips":[]},{"n":110,"kind":"单项选择题","answer":"A","stem":"关于调换房间的要求，导游处理得当的是（）。","options":{"A":"不涉及房间价格且饭店有空房时，适当予以满足","B":"如没有客房，导游明确拒绝","C":"如果客房清洁不达标或设施出现损坏，导游立即协调换房","D":"如果客房有蟑螂、臭虫、老鼠等，导游首先联系客房部打扫，客人不满意再换房"},"explanation":"1. 客房清洁或设施问题：立即处理：如客房清洁不达标或设施出现损坏，导游应迅\n\n速要求饭店客房部门进行打扫、消毒、整理或修理工作。仍不满意调房：如旅游者仍不满意，\n\n坚持调房，导游应与饭店有关部门联系，予以满足，为其调换房间。2. 客房有蟑螂、臭虫、\n\n老鼠等：立即满足：旅游者提出换房，应立即满足，必要时应调换饭店。调换另一朝向或另\n\n一楼层的同一标准客房：不涉及房间价格且饭店有空房时：与饭店客房部联系，适当予以满\n\n足，或请领队在团队内部进行调整。无法满足时：向旅游者做好耐心解释工作","clips":[]},{"n":111,"kind":"单项选择题","answer":"C","stem":"个别游客要求自费观看文娱节目，导游操作正确的是（）。","options":{"A":"婉转拒绝","B":"游客执意要去大型娱乐场所或情况复杂的场所时，导游必须陪同前往","C":"时间允许，与接待社有关部门联系请其报价，详细告知游客相关情况","D":"要求前往不健康的娱乐场所，耐心劝阻"},"explanation":"要求自费观看文娱节目时间允许时：积极协助。酌情选择以下两种方法：方法一：\n\n与接待社有关部门联系请其报价，将对外报价（包括节目票费、车费、服务费）告知旅游者\n\n并逐一解释清楚，若旅游者认可则请接待社预订，同时陪同前往。方法二：协助解决，提醒\n\n旅游者注意安全，帮助联系购买门票，请旅游者自行前往，相关费用自理。游客执意要去大\n\n型娱乐场所或情况复杂的场所时：提醒旅游者注意安全，必要时可陪同前往。要求前往不健\n\n康的娱乐场所：果断拒绝并介绍中国的传统观念和道德风貌，严肃指出不健康的娱乐活动和\n\n不正常的夜生活在中国是明令禁止的，是违法行为，会受到法律的惩处。","clips":[]},{"n":112,"kind":"单项选择题","answer":"A","stem":"下列选项中，属于旅游行程变更主观因素的是（）。","options":{"A":"旅游者个人兴趣改变","B":"自然灾害","C":"交通事故","D":"景点游客承载量达到上限"},"explanation":"客观因素：\n\n自然因素：极端天气（如暴雨、暴雪、台风等）、自然灾害（如地震、山体滑坡、泥石流等）。\n\n社会因素：交通事故、交通管制、公共卫生事件等。\n\n景点因素：景点临时关闭、景点游客承载量达到上限等。","clips":[]},{"n":113,"kind":"单项选择题","answer":"C","stem":"（）是导致误机（车、船）的客观原因。","options":{"A":"导游因行程安排不当致旅游者无法按时抵达机场","B":"导游未认真核对票据而弄错时间或地点","C":"途中遭遇交通事故、恶劣天气、自然灾害","D":"交通时间改变，旅行社忘记通知导游"},"explanation":"1. 主观原因：在接待过程中，导游因行程安排不当致旅游者无法按时抵达机场（车\n\n站、码头）、未认真核对票据而弄错时间或地点等由人为因素造成的事故，均属主观原因，\n\n是预防的重点。\n\n2. 客观原因：途中遭遇交通事故、恶劣天气、自然灾害等不可抗力或难以预测因素引发的\n\n误机（车、船），属客观原因。","clips":[]},{"n":114,"kind":"单项选择题","answer":"A","stem":"如果是特殊游客，例如老年人、未成年人、残疾人等，一旦走失，导游应该（）。","options":{"A":"立即报警","B":"12 小时以后报警","C":"24 小时以后报警","D":"48 小时以后报警"},"explanation":"特殊人群（老年人/未成年人/残疾人）：立即报警。","clips":[]},{"n":115,"kind":"单项选择题","answer":"B","stem":"为了避免游客在旅游过程中遭遇传染病疫情，导游操作错误的是（）。","options":{"A":"出行戴口罩、勤洗手，打喷嚏或咳嗽时用肘部或纸巾遮住口鼻","B":"增加外出，不要在室内逗留，避免空气不流通","C":"多喝水、吃蔬菜水果、多休息、不熬夜，行程安排劳逸结合","D":"疫情高发期，随时关注旅游者身体状况，做到早发现、早治疗"},"explanation":"1. 做好个人防护，出行戴口罩、勤洗手，打喷嚏或咳嗽时用肘部或纸巾遮住口鼻，\n\n个人生活用品分开使用，加强通风和清洁消毒；\n\n2. 不去高风险区域\n\n减少外出，出游时避免人流大的景点及人群聚集区，少去室内公共场所；\n\n3. 提高机体免疫能力多喝水、吃蔬菜水果、多休息、不熬夜，行程安排劳逸结合；\n\n4. 密切关注旅游者状况，疫情高发期，随时关注旅游者身体状况，做到早发现、早报告、\n\n早诊断、早隔离、早治疗。","clips":[]},{"n":116,"kind":"单项选择题","answer":"C","stem":"遭遇火灾后，导游应该（）。","options":{"A":"导游带领游客迅速搭乘电梯以最快速度逃生","B":"提醒游客只能拿身边的东西，其他东西放弃","C":"若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗","D":"若火势较大，快速冲过火区，尽量减少被火势包围的可能"},"explanation":"1. 立即报警，发现火情后，导游应迅速拨打 119 报警，同时简明扼要地将情况上报\n\n旅行社；\n\n2. 组织旅游者撤离，导游应迅速组织旅游者通过安全出口疏散撤离，不搭乘电梯或随意跳\n\n楼；\n\n3. 引导旅游者自救，必要时，导游应引导旅游者就地开展自救：\n\n·如提醒大家不要贪恋财物，迅速逃生；·若楼道出现浓烟，应尽快找毛巾沾湿并捂住口鼻，\n\n身体尽量贴近地面行走；·若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗；·若\n\n大火已封闭逃生通道，则应立即退回室内，用湿被褥塞住门缝，并向窗外发出求救信号，等\n\n待救援；\n\n4. 组织抢救受伤者，若火势较大且有人受伤，应立即组织抢救。\n\n5. 安抚旅游者情绪，做好旅游者情绪安抚工作，配合旅行社解决因火灾引发的一系列问题；\n\n6. 做好善后工作，协助有关方面处理善后事宜，设法使旅游活动尽早恢复。","clips":[]},{"n":117,"kind":"单项选择题","answer":"C","stem":"遭受雷击后，导游救护正确的选项是（）。","options":{"A":"如果衣服着火，迅速把伤者衣服脱下来，避免烧伤","B":"若伤者失去意识，立即做人工呼吸","C":"若伤者无呼吸，应迅速组织人员进行心肺复苏","D":"若伤者失去呼吸，立即拨打 120，静静等待医护人员到来"},"explanation":"衣物着火处理：如果衣服着火，可往伤者身上泼水或用厚外衣、毯子等把伤者捂住\n\n灭火，迅速隔绝空气使火熄灭；\n\n伤者有呼吸时：若伤者失去意识但仍有呼吸，应让其舒适平卧，保持安静休息，随后送往医\n\n院进行进一步检查和治疗；\n\n伤者无呼吸时：若伤者无呼吸，应迅速组织人员进行心肺复苏，持续施救直至救护人员赶到，\n\n心肺复苏操作应规范、用力适度，确保救援效果。","clips":[]},{"n":118,"kind":"单项选择题","answer":"B","stem":"（）是由人民政府外事部门颁发的。","options":{"A":"外交护照","B":"公务护照","C":"普通护照","D":"澳门特别行政区护照"},"explanation":"解析公务护照：由外交部、我国驻外使、领馆或者外交部委托的其他驻外机构以及\n\n外交部委托的省、自治区、直辖市和设区的市人民政府外事部门颁发。","clips":[]},{"n":119,"kind":"单项选择题","answer":"D","stem":"下列药材中，可以出境的是（）。","options":{"A":"麝香","B":"蟾酥","C":"牛黄","D":"人参"},"explanation":"解析麝香、蟾酥、虎骨、犀牛角、牛黄等以及超出上述规定限值的中药材、中成药\n\n不准出境。","clips":[]},{"n":120,"kind":"单项选择题","answer":"B","stem":"来自疫区的人员必须出示疾病预防接种证明。卫生检疫机关有权对无证者施以（）日的强制留验。","options":{"A":"5","B":"6","C":"7","D":"8"},"explanation":"来自疫区的人员还必须出示有效的相关疾病预防接种证明。卫生检疫机关有权对无\n\n证者施以 6 日的强制留验。","clips":[]},{"n":121,"kind":"单项选择题","answer":"C","stem":"一名 17 周岁的内地公民，申请往来港澳通行证的有效期为（）。","options":{"A":"3 年","B":"5 年","C":"10 年","D":"20 年"},"explanation":"未满 16 周岁的申请者所持通行证有效期为 5 年，年满 16 周岁（含）以上的申请者\n\n所持通行证有效期为 10 年。","clips":[]},{"n":122,"kind":"单项选择题","answer":"A","stem":"CA 是（）的代码。","options":{"A":"中国国际航空公司","B":"中国东方航空公司","C":"中国南方航空股份有限公司","D":"春秋航空公司"},"explanation":"解析由航空公司二字英文代码与阿拉伯数字构成。例如，中国国际航空公司（CA）、\n\n中国东方航空公司（MU）、中国南方航空股份有限公司（CZ）。","clips":[]},{"n":123,"kind":"单项选择题","answer":"C","stem":"根据航空公司规定，（）的酒精饮料，单容器不超过 5 升，旅客托运总量不超过 5 升。","options":{"A":"酒精含量≤1%","B":"酒精含量≤24%","C":"24%\u003c酒精含量≤70%","D":"酒精含量>70%"},"explanation":"24%\u003c酒精含量≤70%：单容器不超 5 升，旅客托运总量不超 5 升。","clips":[]},{"n":124,"kind":"单项选择题","answer":"D","stem":"关于铁路限量携带物品的描述，正确的选项是（）。","options":{"A":"自喷压力容器冷烫精/染发剂等，限量 1000 毫升","B":"打火机 5 个","C":"管制器具一件","D":"花露水限带 1 件且容量小于 100 毫升"},"explanation":"自喷压力容器（冷烫精/染发剂/摩丝/发胶/杀虫剂/空气清新剂等）总量限制：≤600\n\n毫升；\n\n打火机：≤2 个；\n\n管制器具禁止托运与携带；\n\n花露水限带 1 件，单件容量：≤100 毫升","clips":[]},{"n":125,"kind":"单项选择题","answer":"B","stem":"如果在沙漠中迷失方向，游客应该（）。","options":{"A":"如果是多人，立即分头找寻道路","B":"原地等候救援","C":"沿着原路返回","D":"立即联系组团社"},"explanation":"若走散迷失方向，切勿慌张和乱走，应在原地等待救援。","clips":[]},{"n":126,"kind":"单项选择题","answer":"A","stem":"在冰上进行活动时，（）是极其危险的。","options":{"A":"冰面上随意穿行、打闹嬉戏","B":"穿好防滑鞋、防寒衣物、头盔","C":"仔细观察冰面颜色、气泡、裂纹","D":"了解设备位置及使用方法"},"explanation":"禁止行为：\n\n冰面上随意穿行、打闹嬉戏；\n\n使用明火或进行破坏冰面的活动。","clips":[]},{"n":127,"kind":"单项选择题","answer":"C","stem":"外汇兑换证明（水单）的有效期为（）。","options":{"A":"1 个月","B":"3 个月","C":"6 个月","D":"12 个月"},"explanation":"游客应妥善保管银行出具的外汇兑换证明（俗称“水单”，有效期为 6 个月）。","clips":[]},{"n":128,"kind":"单项选择题","answer":"C","stem":"旅游意外保险的索赔时效，一般为事故发生之日起（）内。","options":{"A":"30 天","B":"90 天","C":"180 天","D":"365 天"},"explanation":"按合同约定，一般为事故发生之日起 180 日内。","clips":[]},{"n":129,"kind":"单项选择题","answer":"B","stem":"饭店取得星级标志满（）年后，需进行评定性复核。","options":{"A":"3","B":"5","C":"8","D":"10"},"explanation":"饭店取得星级标志满 5 年后，需进行评定性复核。","clips":[]},{"n":130,"kind":"单项选择题","answer":"A","stem":"2011 年，我国开始在（）试点离境退税政策。","options":{"A":"海南","B":"厦门","C":"上海","D":"青岛"},"explanation":"2011 年起，中国在海南开始试点离境退税政策。\n\n三、多选题","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABCD","stem":"《宪法》规定，以下属于公民人身自由权的是（）。","options":{"A":"人身自由不受侵犯","B":"人格尊严不受侵犯","C":"住宅不受侵犯","D":"通信自由和通信秘密受法律的保护","E":"公民有宗教信仰自由"},"explanation":"“公民有宗教信仰自由”错误，公民有宗教信仰自由是公民的宗教信仰自由权。","clips":[]},{"n":132,"kind":"多项选择题","answer":"BCD","stem":"依据我国《旅游法》的规定，下列选项中，属于旅游发展规划内容的是（）。","options":{"A":"旅游业发展的规划纲要","B":"旅游业发展的总体要求和发展目标","C":"旅游资源保护和利用的要求和措施","D":"旅游基础设施建设","E":"旅游产品营销"},"explanation":"《旅游法》第 18 条规定，旅游发展规划应当包括旅游业发展的总体要求和发展目标，\n\n旅游资源保护和利用的要求和措施，以及旅游产品开发、旅游服务质量提升、旅游文化建设、\n\n旅游形象宣传和推广、旅游基础设施和公共服务设施建设的要求和促进等内容。","clips":[]},{"n":133,"kind":"多项选择题","answer":"BE","stem":"依据《中华人民共和国旅游法》，因不可抗力或者旅行社、履行辅助人已尽合理注意义务仍不能避免的事件，影响了旅游行程。下列关于处理这种情形的说法中，正确的有（）。","options":{"A":"合同变更的，因此增加的费用由旅行社与旅游者分担","B":"合同不能继续履行的，旅行社和旅游者均可以解除合同","C":"危及旅游者人身、财产安全的，旅行社采取相应的安全措施，支出的费用由旅行社承担","D":"造成旅游者滞留的，旅行社采取相应安置措施，增加的返程费用由旅行社承担","E":"造成旅游者滞留的，旅行社采取相应安置措施，增加的食宿费用由旅游者承担"},"explanation":"《旅游法》第 67 条规定，因不可抗力或者旅行社、履行辅助人已尽合理注意义务仍\n\n不能避免的事件，影响旅游行程的，按照下列情形处理：\n\n合同不能继续履行的，旅行社和旅游者均可以解除合同。合同不能完全履行的，旅行社经向\n\n旅游者作出说明，可以在合理范围内变更合同；旅游者不同意变更的，可以解除合同。合同\n\n解除的，组团社应当在扣除已向地接社或者履行辅助人支付且不可退还的费用后，将余款退\n\n还旅游者；合同变更的，因此增加的费用由旅游者承担，减少的费用退还旅游者。危及旅游\n\n者人身、财产安全的，旅行社应当采取相应的安全措施，因此支出的费用，由旅行社与旅游\n\n者分担。造成旅游者滞留的，旅行社应当采取相应的安置措施。因此增加的食宿费用，由旅\n\n游者承担；增加的返程费用，由旅行社与旅游者分担。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ABC","stem":"关于监护人的职责，下列说法正确的有（）。","options":{"A":"监护人应当代理被监护人实施民事法律行为","B":"监护人应当保护被监护人的人身权利、财产权利以及其他合法权益","C":"监护人应当尊重被监护人的真实意愿（在有能力表达时）","D":"监护人应当按照尽可能有利于被监护人的原则履行监护职责","E":"未成年人的监护人履行监护职责，应当最大程度地尊重被监护人的真实意愿"},"explanation":"《民法典》第 35 条规定，监护人应当按照最有利于被监护人的原则履行监护职责。\n\n监护人除为维护被监护人利益外，不得处分被监护人的财产。未成年人的监护人履行监护职\n\n责，在作出与被监护人利益有关的决定时，应当根据被监护人的年龄和智力状况，尊重被监\n\n护人的真实意愿。成年人的监护人履行监护职责，应当最大程度地尊重被监护人的真实意愿，\n\n保障并协助被监护人实施与其智力、精神健康状况相适应的民事法律行为。对被监护人有能\n\n力独立处理的事务，监护人不得干涉。","clips":[]},{"n":135,"kind":"多项选择题","answer":"BCDE","stem":"民事法律行为的生效要件包括（）。","options":{"A":"行为人具有完全民事行为能力","B":"不违反法律的强制性规定","C":"意思表示真实","D":"不违反行政法规的强制性规定","E":"不违背公序良俗"},"explanation":"《民法典》第 143 条规定，具备下列条件的民事法律行为有效：\n\n（1）行为人具有相应的民事行为能力；\n\n（2）意思表示真实；\n\n（3）不违反法律、行政法规的强制性规定，不违背公序良俗。\n\n“行为人具有完全民事行为能力”错误，只要行为人有相应的民事行为能力就可以，不是必\n\n须要求“完全民事行为能力”。","clips":[]},{"n":136,"kind":"多项选择题","answer":"CE","stem":"依据《旅行社服务质量赔偿标准》，旅行社应当向旅游者支付旅游费用总额 20%的违约金的情形包括（）。","options":{"A":"旅行社未经旅游者同意，擅自将旅游者转团、拼团的","B":"旅行社未经旅游者同意，擅自安排另行付费项目的","C":"擅自违反合同约定增加购物两次，延长停留时间的","D":"因旅行社原因造成旅游者未能乘坐预定交通工具的","E":"强迫或者变相强迫旅游者购物一次的"},"explanation":"选项“旅行社未经旅游者同意，擅自将旅游者转团、拼团的”错误，擅自转团、拼\n\n团的，旅行社应向旅游者支付旅游费用总额 25%的违约金；\n\n选项“旅行社未经旅游者同意，擅自安排另行付费项目的”错误，未经旅游者签字确认，擅\n\n自安排合同约定以外的用餐、娱乐、医疗保健、参观等另行付费项目的，旅行社应承担另行\n\n付费项目的费用。\n\n选项“因旅行社原因……”错误，因旅行社原因未乘坐公共交通工具的。旅行社应赔偿旅游\n\n者的直接经济损失，并支付直接经济损失 20%的违约金；\n\n选项“擅自违反合同……”正确，未经旅游者签字确认，擅自违反合同约定增加购物次数、\n\n延长停留时间的，每次向旅游者支付旅游费用总额 10% 的违约金；\n\n选项“强迫或者变相……”正确，强迫或者变相强迫旅游者购物的，每次向旅游者支付旅游\n\n费用总额 20% 的违约金。","clips":[]},{"n":137,"kind":"多项选择题","answer":"BCDE","stem":"依据《导游管理办法》，当旅游突发事件发生时，导游员采取的应急处置措施有（）。","options":{"A":"向发生地公安部门报告","B":"救助受困旅游者","C":"协助救助受困旅游者","D":"根据有关机构的要求，采取调整或者中止行程、停止带团前往风险区域","E":"根据有关机构的要求，采取撤离风险区域等避险措施"},"explanation":"“向发生地公安部门报告”错误，是“向本单位负责人报告”，《导游管理办法》第\n\n24 条，旅游突发事件发生后，导游应当立即采取下列必要的处置措施：向本单位负责人报\n\n告，情况紧急或者发生重大、特别重大旅游突发事件时，可以直接向发生地、旅行社所在地\n\n县级以上旅游主管部门、安全生产监督管理部门和负有安全生产监督管理职责的其他相关部\n\n门报告；救助或者协助救助受困旅游者；根据旅行社、旅游主管部门及有关机构的要求，采\n\n取调整或者中止行程、停止带团前往风险区域、撤离风险区域等避险措施。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABD","stem":"根据《导游管理办法》的规定，具有下列（）情形的，不予核发导游证。","options":{"A":"无民事行为能力或者限制民事行为能力的","B":"患有甲类、乙类传染性疾病的","C":"受过治安处罚的","D":"患有可能危害旅游者人身健康安全的传染性疾病的","E":"患有重度抑郁症的"},"explanation":"《导游管理办法》第 12 条规定，具有下列情形的，不予核发导游证：无民事行为能\n\n力或者限制民事行为能力的；患有甲类、乙类以及其他可能危害旅游者人身健康安全的传染\n\n性疾病的；受过刑事处罚的，过失犯罪的除外；被吊销导游证之日起未逾 3 年的。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ADE","stem":"我国对“旅游不文明行为记录”的信息保存期限实行动态管理，下列关于信息保存期限的表述中正确的是（）。","options":{"A":"违反刑法的，信息保存期限为 3 年至 5 年","B":"法院判决承担责任，信息保存期限为 3 年至 5 年","C":"多次纳入“旅游不文明行为记录”的，信息保存期限为 5 年至 10 年","D":"受到行政处罚的，信息保存期限为 2 年至 4 年","E":"未受到法律法规处罚的，但造成恶劣社会影响的，信息保存期限为 1 年至 3 年"},"explanation":"《国家旅游局关于旅游不文明行为记录管理暂行办法》第 9 条规定，“旅游不文明行\n\n为记录”信息保存期限为 1- 5 年，实行动态管理。 ①行为当事人违反刑法的，信息保存期\n\n限为 3- 5 年；②行为当事人受到行政处罚或法院判决承担责任的，信息保存期限为 2- 4\n\n年；③行为未受到法律法规处罚，但造成严重社会影响的，信息保存期限为 1- 3 年。\n\n“未受到法律法规处罚的，但造成社会影响的……”错在“造成社会影响”，应该是“造成\n\n严重社会影响”。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ABCE","stem":"根据《旅游法》的规定，旅游者与旅游经营者发生纠纷，可以通过（）途径解决。","options":{"A":"双方协商","B":"向消费者协会、旅游投诉受理机构或者有关调解组织申请调解","C":"根据达成的仲裁协议提请仲裁机构仲裁","D":"向监察机关提出申诉","E":"向人民法院提起诉讼"},"explanation":"《旅游法》第 92 条规定，旅游者与旅游经营者发生纠纷，可以通过下列途径解决：\n\n（1）双方协商；（2）向消费者协会、旅游投诉受理机构或者有关调解组织申请调解；（3）\n\n根据与旅游经营者达成的仲裁协议提请仲裁机构仲裁；（4）向人民法院提起诉讼。选项“向\n\n监察机关提出申诉”不在此其情形内。“监察机关”是对所有行使公共权力的公职人员进行\n\n监察。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ADE","stem":"根据可能对旅游者造成的（），旅游目的地安全风险提示级别分为一级、二级、三级和四级。","options":{"A":"发展态势","B":"影响范围","C":"持续时间","D":"危害程度","E":"紧急程度"},"explanation":"解析根据可能对旅游者造成的危害程度、紧急程度和发展态势，风险提示级别分为\n\n一级（特别严重）、二级（严重）、三级（较重）和四级（一般），分别用红色、橙色、黄色\n\n和蓝色标示。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABCDE","stem":"《中华人民共和国食品安全法》规定，食品安全事故应急预案应当对（）等作出规定。","options":{"A":"事故处置组织指挥体系与职责","B":"预防预警机制","C":"食品安全事故分级","D":"处置程序","E":"应急保障措施"},"explanation":"食品安全事故应急预案应当对食品安全事故分级、事故处置组织指挥体系与职责、\n\n预防预警机制、处置程序、应急保障措施等做出规定。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABD","stem":"根据《宪法》规定，以下可能影响公民的选举权和被选举权的因素有（）。","options":{"A":"年龄","B":"国籍","C":"民事行为能力","D":"政治权利","E":"宗教教派"},"explanation":"解析我国年满 18 周岁的公民，不分民族、种族、性别、职业、家庭出身、宗教信仰、\n\n教育程度、财产状况、居住期限，都有选举权和被选举权；但是依照法律被剥夺政治权利的\n\n人除外。","clips":[]},{"n":144,"kind":"多项选择题","answer":"BCDE","stem":"在订立包价旅游合同时，旅行社应当向旅游者详细说明和告知的事项包括（）。","options":{"A":"包价旅游合同的费用构成","B":"旅游活动中的安全注意事项","C":"旅行社依法可以减免责任的信息","D":"旅游者应当注意的旅游目的地相关法律、法规和风俗习惯、宗教禁忌","E":"法律、法规规定的其他应当告知的事项"},"explanation":"《旅游法》第 62 条规定，订立包价旅游合同时，旅行社应当向旅游者告知下列事项：\n\n旅游者不适合参加旅游活动的情形；旅游活动中的安全注意事项；旅行社依法可以减免责任\n\n的信息；旅游者应当注意的旅游目的地相关法律、法规和风俗习惯、宗教禁忌，依照中国法\n\n律不宜参加的活动等；法律、法规规定的其他应当告知的事项。在包价旅游合同履行中，遇\n\n有前款规定事项的，旅行社也应当告知旅游者。“包价旅游合同的费用构成”是旅行社的商\n\n业秘密，无需告诉旅游者。故本项错误。","clips":[]},{"n":145,"kind":"多项选择题","answer":"ACE","stem":"依据习近平新时代中国特色社会主义思想相关理论，下列关于新发展阶段、新发展理念、新发展格局的表述，符合“十个明确”规定的有（）。","options":{"A":"贯彻创新、协调、绿色、开放、共享的新发展理念","B":"构建以国内国际双循环为主体、国内大循环相互促进的新发展格局","C":"使市场在资源配置中起决定性作用，更好发挥政府作用","D":"推动高速发展，统筹发展和安全","E":"把握新发展阶段，加快构建新发展格局"},"explanation":"明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，\n\n更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，\n\n加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，\n\n统筹发展和安全（“十个明确”第 7 点）。A 项正确，创新、协调、绿色、开放、共享为新发\n\n展理念，。B 项错误，原文为“以国内大循环为主体、国内国际双循环相互促进”，选项将主\n\n次表述颠倒。C 项正确，市场在资源配置中起决定性作用、更好发挥政府作用。D 项错误，\n\n原文为推动高质量发展，不是高速发展。E 项正确，把握新发展阶段、加快构建新发展格局。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABCE","stem":"下列关于英雄烈士遗属抚恤优待制度的表述正确的是（）。","options":{"A":"地方人民政府应当每年定期走访慰问英雄烈士遗属","B":"对英雄烈士的抚恤优待要与国民经济和社会发展相适应并逐步提高","C":"国家鼓励和支持自然人、法人和非法人组织参与英雄烈士保护工作","D":"自然人、法人和非法人组织捐赠财产用于英雄烈士保护的，依法免缴税费","E":"英雄烈士遗属按照国家规定享受教育、就业、养老、住房、医疗等方面的优待"},"explanation":"“自然人、法人和……依法免缴税费”错误，《英烈法》第 20 条规定，自然人、法\n\n人和非法人组织捐赠财产用于英雄烈士保护的，依法享受税收优惠。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ADE","stem":"根据《食品安全法》规定，县级以上人民政府食品安全监督管理部门接到食品安全事故的报告后，应当立即会同有关部门进行调查处理，并采取（）措施。","options":{"A":"开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员","B":"对导致食品安全事故的食品及其原料进行清洗消毒","C":"对疑似被污染的食品及其原料，责令食品生产经营者召回","D":"封存被污染的食品相关产品","E":"做好信息发布工作"},"explanation":"“对导致食品安全事故的食品及其原料进行清洗消毒”说法有误，正确的表达是“封\n\n存可能导致食品安全事故的食品及其原料”；\n\n“对疑似被污染……”，正确的表达是“对确认属于被污染的食品及其原料”。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABCE","stem":"全陪的主要职责有（）。","options":{"A":"实施旅游接待计划","B":"做好联络工作","C":"宣传、调研工作","D":"进行导游讲解","E":"维护安全，处理问题"},"explanation":"实施旅游接待计划；做好联络工作；做好组织协调工作；维护安全，处理问题；宣\n\n传、调研工作。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ACE","stem":"地陪导游首次沿途讲解包括（）。","options":{"A":"介绍当地的地理位置、气候环境、历史文化","B":"推销当地特产","C":"讲解从机场（车站、码头）到下榻饭店或参观景点道路沿线存在的景观","D":"宣布当天或者次日安排","E":"向旅游者介绍饭店的名称、位置、星级、服务项目、入住手续及注意事项"},"explanation":"介绍当地的地理位置、气候环境、历史文化、经济发展、社会生活、风物特产等；\n\n讲解从机场（车站、码头）到下榻饭店或参观景点道路沿线存在的景观，包括建筑、雕塑、\n\n河湖、道路、绿化植物、飞禽走兽等。讲解时要注意触景生情、点面结合、简明扼要，使讲\n\n解速度与旅游车行驶速度一致，准确描述景物；\n\n在旅游车快到下榻饭店时，地陪应向旅游者介绍饭店的名称、位置、星级、距机场（车站、\n\n码头）距离、服务项目、入住手续及注意事项等","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABCD","stem":"地陪导游接团前的准备工作包括（）。","options":{"A":"熟悉接待计划","B":"落实接待计划","C":"知识准备","D":"形象准备与心理准备","E":"旅游产品销售准备"},"explanation":"解析熟悉接待计划；落实接待计划；物品与资料准备；知识准备；形象准备与心理\n\n准备。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABDE","stem":"旅游团即将抵达前的业务安排内容有（）。","options":{"A":"与全陪或入境领队联系","B":"确认抵达信息","C":"持证上岗","D":"与旅游车司机对接","E":"再次核实旅游团抵达的时间"},"explanation":"1. 确认旅游团抵达的时间和地点（与全陪或入境领队联系、确认抵达信息）。\n\n2. 与旅游车司机对接；\n\n3. 再次核实旅游团抵达的时间。","clips":[]},{"n":152,"kind":"多项选择题","answer":"BCDE","stem":"全陪带团首站讲解的内容包括（）。","options":{"A":"首站城市概况","B":"致欢迎词","C":"介绍行程安排","D":"介绍消费支付和货币兑换方式","E":"提醒注意事项"},"explanation":"致欢迎词; 介绍行程安排; 介绍消费支付和货币兑换方式; 提醒注意事项。","clips":[]},{"n":153,"kind":"多项选择题","answer":"CD","stem":"游客在海外购物时，应该遵循的原则有（）。","options":{"A":"导游领队应提醒游客理性、诚信消费，全力议价","B":"遵守购物场所规范，保持购物场所秩序，可以随意试吃","C":"导游领队应提醒游客尊重购物场所购物数量限制","D":"提醒游客购物活动结束时间和购物结束后的集合地点，避免游客迟到","E":"购买奢侈品时，要求少开价格发票，合理避税"},"explanation":"1. 导游领队应提醒游客理性、诚信消费, 适度议价, 善意待人, 遵守契约。\n\n2. 导游领队应提醒游客遵守购物场所规范, 保持购物场所秩序, 不哄抢喧哗, 试吃试, 用\n\n商品应征得同意, 不随意占用购物场所非公共区域的休息座椅。\n\n3. 导游领队应提醒游客尊重购物场所购物数量限制。4. 在购物活动前，导游领队应提醒游\n\n客购物活动结束时间和购物结束后的集合地点，避免游客迟到、拖延而引发的不文明现象发\n\n生。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ABCD","stem":"下列内容中，对导游虚实结合法描述正确的是（）。","options":{"A":"“虚”包括民间故事、神话传说","B":"“实”指景观的具体形象、真实历史","C":"虚实有机结合、自然连贯，不能生搬硬套","D":"以“实”为主，“虚”为“实”服务，烘托情节","E":"注意内容选择，“虚”要从眼前景物中选，“实”要“精”要“活”"},"explanation":"“虚”包括民间故事、神话传说等，“实”指景观的具体形象、真实历史等。运用虚\n\n实结合法时，需注意以下几点：\n\n（1）虚实有机结合、自然连贯，不能生搬硬套；（2）以“实”为主，“虚”为“实”服务，\n\n烘托情节；（3）注意内容选择，“实”要从眼前景物中选，“虚”要“精”要“活”。","clips":[]},{"n":155,"kind":"多项选择题","answer":"BCDE","stem":"在带研学团旅行过程中，导游应该注意的事项包括（）。","options":{"A":"适当做到旅游特色产品营销","B":"掌握必要的教育知识和教学方法","C":"区分讲解与研学指导的不同功能","D":"重视言传身教的作用","E":"牢记安全第一的理念"},"explanation":"掌握必要的教育知识和教学方法；区分讲解与研学指导的不同功能；重视言传身教\n\n的作用；牢记安全第一的理念。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABCD","stem":"导游应对游客个别要求的原则是（）。","options":{"A":"遵循法律、法规和标准的原则","B":"维护尊严原则","C":"尽量满足旅游者合理要求的原则","D":"尊重旅游者，不卑不亢的原则","E":"符合旅行社要求的原则"},"explanation":"遵循法律、法规和标准的原则；\n\n维护尊严原则；\n\n尽量满足旅游者合理要求的原则；\n\n尊重旅游者，不卑不亢的原则。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABE","stem":"游客提出延长旅游期限，导游操作正确的内容包括（）。","options":{"A":"由旅游者提出书面申请，报请旅行社同意","B":"协助旅游者办理延长旅游期相关事宜","C":"如外国旅游者为团体签证时，请其自行到当地公安机关机构出入境管理部门办理分离团队签证","D":"若因病、受伤滞留的旅游者，导游应该无偿为游客提供帮助","E":"若外国旅游者要求延长签证未获批准，请领队、全陪协助做好规劝工作，使其按时随团出境"},"explanation":"1. 书面申请与审批，由旅游者提出书面申请，报请旅行社同意：\n\n2. 协助办理相关事宜，协助旅游者办理延长旅游期相关事宜（如重新订房、订交通票等）。\n\n如外国旅游者为团体签证时，须协助其去当地公安机关机构出入境管理部门办理分离团队签\n\n证或延，长个人旅华签证手续，费用由其自理。\n\n若外国旅游者要求延长旅行期的签证未获当地出入境管理部门的批准，导游应请领队、全陪\n\n协助做好规劝工作，使其按时随团出境；\n\n3. 关心滞留旅游者，导游应关心因病、受伤滞留的旅游者。如需导游继续为其提供各项服\n\n务，则与旅行社另签相关合同；\n\n4. 费用自理，\n\n延长旅游期内所发生的一切费用由旅游者自理。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ACDE","stem":"为了预防游客中暑，导游应该（）。","options":{"A":"夏日旅游节奏轻松，避免长时间烈日下活动","B":"提醒旅游者少穿浅色宽松棉麻服装，多穿化纤类","C":"涂抹防晒霜，带遮阳伞、帽、太阳镜、防晒衣等","D":"建议旅游者带保温杯，及时补水","E":"提醒旅游者准备藿香正气水、人丹、十滴水、风油精等常规药物"},"explanation":"1. 合理安排行程，夏日旅游节奏轻松，避免长时间烈日下活动，早晚室外参观，中\n\n午前后室内游览或休息；2. 做好防护工作，提醒旅游者穿浅色宽松棉麻服装，少穿化纤类；\n\n涂抹防晒霜；带遮阳伞、帽、太阳镜、防晒衣等；3. 喝水补充电解质，建议旅游者带保温\n\n杯，及时补水，可在茶水中加菊花等清凉解毒成分；4. 备好防暑药品，提醒旅游者准备藿\n\n香正气水、人丹、十滴水、风油精等常规药物。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABCE","stem":"中国游客在境外丢失证件后，导游应该（）。","options":{"A":"稳定旅游者情绪","B":"协助寻找，同时报告旅行社","C":"向当地警方报失（取得丢失证明）","D":"向中国驻当地使领馆申请签证","E":"办理相关离境手续"},"explanation":"旅游者丢失证件或物品时，导游应稳定旅游者情绪，详细了解丢失情况，协助寻找，\n\n同时报告旅行社，并按以下要求处理；\n\n领队应协助旅游者： ①向当地警方报失（取得丢失证明）； ②向中国驻当地使领馆/政府派\n\n出机构申请新证件；③办理相关离境手续。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABC","stem":"当旅游者遭遇社会骚乱等群体性事件时，导游应该（）。","options":{"A":"立即向旅行社报告","B":"向旅游者预警，引导旅游者采取相应的安全防范措施","C":"立刻带领旅游者撤离事发区域","D":"稳定旅游者情绪，立即取消旅游行程","E":"旅游者人身、财物受到威胁的，带领游客与歹徒搏斗"},"explanation":"（1）立即向旅行社报告，反映旅游者遭遇群体性事件的详细情况，并向旅游者预警，\n\n引导旅游者采取相应的安全防范措施，同时配合现场警务人员指挥，组织旅游者有序撤离事\n\n发区域，若无警务人员现场指挥，立刻带领旅游者撤离事发区域；\n\n（2）旅游者人身、财物受到威胁的，根据现场条件，引导旅游者开展自救和互救，并及时\n\n带领旅游者脱离险境，全力保护旅游者的人身和财物安全；\n\n（3）稳定旅游者情绪，视情况变更或取消旅游行程，取消旅游行程的，协助旅游者返回出\n\n发地或旅游者指定的合理地点。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCDE","stem":"导游带领游客在户外旅行中遭遇地震，应该（）。","options":{"A":"客车行驶过程中遭遇地震，司机应立即稳定车辆，迅速降低车速","B":"客车停车后，组织乘客撤离车辆","C":"若在徒步旅行时发生地震，应立即停止行进，就地选择开阔地带避险","D":"迅速蹲下或坐下，降低身体重心，双手护住头部，保持身体稳定","E":"选择空旷、平坦且远离建筑物、树木、电线杆等潜在危险源的地点停车"},"explanation":"（1）旅游客车行驶中遇震，当旅游客车行驶过程中遭遇地震，导游应迅速提醒司机\n\n采取紧急措施。司机应立即稳定车辆，迅速降低车速，寻找并选择空旷、平坦且远离建筑物、\n\n树木、电线杆等潜在危险源的地点停车。停车后，组织乘客有序撤离车辆，引导大家疏散至\n\n安全区域，避免因车辆晃动、碰撞或其他次生灾害造成人员伤害。（2）徒步旅行时遇震，若\n\n在徒步旅行时发生地震，应立即停止行进，就地选择开阔地带避险。迅速蹲下或坐下，降低\n\n身体重心，双手护住头部，保持身体稳定，防止因地面晃动而摔倒受伤。同时，务必远离以\n\n下危险物体和区域。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABC","stem":"形成山体滑坡的条件有（）。","options":{"A":"存在由地下水活动产生的滑坡动力","B":"有较松散的岩土","C":"有一定坡度的斜坡","D":"山间或山前为陡峭的谷地地形"},"explanation":"形成山体滑坡的三个条件为： ① 存在由地下水活动产生的滑坡动力； ②有较松散\n\n的岩土；③有一定坡度的斜坡。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ABE","stem":"关于出入境携带金银的描述，正确的内容有（）。","options":{"A":"旅客携带金、银入境数量不受限制，但是必须向海关申报登记","B":"携带或者复带金银出境，海关凭中国人民银行出具的证明或者原入境时的申报单登记的数量查验放行","C":"携带在境内供应游客购买的金银饰品出境，海关凭发票查验放行","D":"每人携带黄金饰品限额为 10 市两（312.5 克）","E":"每人携带银质器皿限额为 20 市两（625 克）"},"explanation":"旅客携带金、银入境数量不受限制，但是必须向海关申报登记，由海关登记后予以\n\n放行；\n\n携带或者复带金银出境，海关凭中国人民银行出具的证明或者原入境时的申报单登记的数量\n\n查验放行；\n\n携带在境内供应游客购买的金银饰品（包括镶嵌饰品、工艺品、器皿等）出境，海关凭国内\n\n经营金银制品的单位开具的特种发货票查验放行；\n\n在境内的中国人、外国侨民和无国籍人出境定居，每人携带金银的限额为：黄金饰品 1 市两\n\n（31.25 克），白银饰品 10 市两（312.50 克），银质器皿 20 市两（625 克）。\n\n经海关查验符合规定限额的放行。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ACD","stem":"下列情形中，旅游者会被拒载的是（）。","options":{"A":"旅游者携带国家规定禁运物品","B":"饮酒的旅客","C":"拒绝安检的旅客","D":"90 岁的老人"},"explanation":"依据《公共航空运输旅客服务管理规定》，以下情况承运人应拒绝运输：\n\n（1）按国家规定禁运的旅客或物品；（2）拒绝安检的旅客；（3）未经安检的行李；（4）办\n\n理乘机登记手续时身份证件与购票时不符的旅客；（5）其他违反国家规定的情况。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ACDE","stem":"（）是高原反应的典型症状。","options":{"A":"轻度症状为头疼、头晕、心慌、气短、胸闷","B":"中度症状为身体燥热，体温达到 38 度以上","C":"中度症状为嘴唇和指甲床呈青紫色","D":"重度症状为咳嗽带痰，有粉红色或泡沫状痰液","E":"重度症状为步态不稳、无法走直线"},"explanation":"症状与体征：\n\n轻度症状：头疼、头晕、心慌、气短、胸闷、食欲缺乏、手脚发麻、恶心、呕吐、口唇指甲\n\n发绀。中度症状：头痛加剧、频繁呕吐、呼吸急促、嘴唇和指甲床呈青紫色（缺氧标志）。\n\n重度症状：呼吸极度困难，静息时也无法平卧，需端坐呼吸；咳嗽带痰，有粉红色或泡沫状\n\n痰液；面色灰白、皮肤湿冷、神志模糊、胡言乱语或昏迷；步态不稳、无法走直线；剧烈头\n\n痛，伴随喷射性呕吐。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper4-subject12-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
</html>
