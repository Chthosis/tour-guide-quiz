<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"对","stem":"1989 年，我国把重阳节定为老年节。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。九九重阳，又与“久久”谐音，有祝愿长久长寿的含义。1989 年，\n\n我国把重阳节定为老年节，赋予这个传统节日尊老、爱老、敬老、助老的全新内涵。","clips":[]},{"n":2,"kind":"判断题","answer":"对","stem":"南昌起义标志着中国共产党独立领导革命战争、创建人民军队的开端。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1927 年 8 月 1 日，在以周恩来为书记的中共中央前敌委员会领导下，\n\n贺龙、叶挺、朱德、刘伯承等率领军队 2 万多人，举行南昌起义。南昌起义在以周恩来为书\n\n记的中共中央前敌委员会领导下举行，标志着中国共产党独立领导革命战争、创建人民军队\n\n和武装夺取政权的开端，开启了中国革命新纪元。","clips":[]},{"n":3,"kind":"判断题","answer":"对","stem":"明朝李时珍所著《本草纲目》是集中国古代药物学大成的巨著，被誉为“东方药学巨典”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。明朝李时珍著《本草纲目》，全书 190 余万字，共记载药物 1892 种，\n\n收集药方 11096 个，绘制插图 1160 幅，是集中国古代药物学大成的巨著，被誉为“东方药\n\n学巨典”。","clips":[]},{"n":4,"kind":"判断题","answer":"对","stem":"“小李杜”指晚唐诗人杜牧和李商隐。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。杜牧擅长七绝，李商隐工于七律，后世将二人合称为“小李杜”。杜\n\n牧擅长七绝，李商隐工于七律。","clips":[]},{"n":5,"kind":"判断题","answer":"错","stem":"贵州茅台酒是浓香型白酒的典型代表。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。贵州茅台酒是酱香型（不是浓香型）白酒的典型代表；泸州老窖特\n\n曲、五粮液酒为浓香型酒的代表。","clips":[]},{"n":6,"kind":"判断题","answer":"对","stem":"五四运动是近代中国革命史上具有划时代意义的事件，标志着新民主主义革命的伟大开端。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。五四运动标志着新民主主义革命的伟大开端，孕育了以爱国、进步、\n\n民主、科学为主要内容的伟大五四精神，其核心是爱国主义精神。五四运动孕育了以爱国、\n\n进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义精神。","clips":[]},{"n":7,"kind":"判断题","answer":"对","stem":"李大钊发表的《我的马克思主义观》，标志着马克思主义在中国进入比较系统的传播阶段。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。李大钊发表的《我的马克思主义观》，系统介绍了马克思主义理论，\n\n在当时思想界产生重大影响，标志着马克思主义在中国进入比较系统的传播阶段。李大钊是\n\n在中国举起十月革命旗帜的第一人，是中国最早的马克思主义传播者。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"兰花、巨猿、蝴蝶被誉为马来西亚的三大珍宝。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。兰花、巨猿、蝴蝶被誉为马来西亚“三大珍宝”。马来西亚是亚洲新\n\n兴的工业国之一，天然橡胶、棕榈油和胡椒的产量与出口量居世界前列，曾是世界产锡大国。\n\n吉隆坡有“世界锡都、胶都”之美誉。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"什叶派是伊斯兰教中人数最多的一派，中国穆斯林大多属于什叶派。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。本题说法错误。伊斯兰教中人数最多的是逊尼派（不是什叶派），中\n\n国穆斯林大多属于逊尼派；什叶派人数较少，中国新疆塔吉克族穆斯林属于什叶派。","clips":[]},{"n":10,"kind":"判断题","answer":"错","stem":"中国共产党历史上的两个伟大转折点是八七会议和党的十一届三中全会。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。本题说法错误。遵义会议是党的历史上一个生死攸关的转折点；党\n\n的十一届三中全会实现了新中国成立以来党的历史上具有深远意义的伟大转折。","clips":[]},{"n":11,"kind":"判断题","answer":"对","stem":"目前我国已经成立的民族自治地方共 155 个，包括 5 个自治区、30 个自治州和 120 个自治县（旗）。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。目前已经成立的民族自治地方共 155 个，包括内蒙古自治区、广西\n\n壮族自治区、西藏自治区、宁夏回族自治区、新疆维吾尔自治区共 5 个自治区，在吉林、湖\n\n北、湖南、四川、贵州、云南、甘肃、青海、新疆等 9 省区共设立 30 个自治州，在河北、\n\n内蒙古、辽宁、吉林、黑龙江、浙江、湖北、湖南、广东、广西、海南、重庆、四川、贵州、\n\n云南、甘肃、青海、新疆等 18 省（区市）共设立 120 个自治县（旗）。","clips":[]},{"n":12,"kind":"判断题","answer":"错","stem":"乌龙茶属于全发酵茶。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。乌龙茶（青茶）属半发酵茶（不是全发酵茶），介于红茶与绿茶之间；\n\n红茶才是全发酵茶。","clips":[]},{"n":13,"kind":"判断题","answer":"错","stem":"苏州宝带桥建于隋开皇年间，是我国孔数最多的联拱石桥。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。苏州宝带桥建于唐代（不是隋开皇年间），是我国孔数最多的联拱石\n\n桥，长 318 米，宽 4.1 米，共 53 个孔；建于隋代的是赵州桥。","clips":[]},{"n":14,"kind":"判断题","answer":"对","stem":"甲骨文是刻写在龟甲和牛肩胛骨上的文字，主要发现于商朝殷墟遗址。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。甲骨文是商周官府占卜用的原始档案，安阳殷墟发现的甲骨片超过\n\n15 万片，发现单字 4000 多个，是一种非常成熟的文字。甲骨文是商周官府占卜用的原始档\n\n案，对于商周历史和文字学研究意义重大。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"道教形成于西汉时期。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。道教是土生土长的中国宗教，形成于东汉时期。道教奉道家学派创\n\n始人老子为祖师爷。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"桂林山水属于丹霞地貌。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。桂林山水属于喀斯特（岩溶）地貌（不是丹霞地貌），漓江两岸是世\n\n界上规模最大、风景最优美的亚热带岩溶风景区，自古享有“桂林山水甲天下”之誉。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"叠山置石中，黄石用于假山的基础部分称“收顶”，太湖石置于假山上部称“叠脚”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。黄石质地坚硬，用于假山的基础部分，称叠脚；太湖石具有皱、瘦、\n\n漏、透四大特点，置于假山上部，称收顶。太湖石具有皱、瘦、漏、透四大特点，置于假山\n\n上部供游人玩赏品味。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"金沙江下游梯级水电开发工程建成了三峡、葛洲坝、乌东德、白鹤滩四座梯级水电站。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。金沙江下游梯级水电开发工程共建成乌东德、白鹤滩、溪洛渡、向\n\n家坝四座梯级水电站（不含三峡、葛洲坝），总装机容量相当于两个三峡工程，是我国西电\n\n东送项目的重要支撑。","clips":[]},{"n":19,"kind":"判断题","answer":"错","stem":"鲁菜的口味以麻辣著称。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。鲁菜讲究调味醇正，口味偏于咸鲜（不是麻辣），以麻辣著称的是川\n\n菜；鲁菜烹调技法以爆、扒见长。","clips":[]},{"n":20,"kind":"判断题","answer":"错","stem":"泰姬陵由莫卧儿王朝皇帝阿克巴为死去的妃子泰姬·玛哈尔建造，是印度的标志。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。泰姬陵由莫卧儿王朝皇帝沙贾汗（不是阿克巴）为死去的妃子泰姬·玛\n\n哈尔建造，是世界七大奇迹之一，成为印度的标志。","clips":[]},{"n":21,"kind":"判断题","answer":"错","stem":"北京故宫宫殿区以三大殿为中心，占地面积约 15 万平方米，有大小宫殿 70 多座。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，题干混淆了“占地面积”与“建筑面积”。北京故宫宫殿区以三大殿\n\n为中心，占地面积约 72 万平方米，建筑面积约 15 万平方米，有大小宫殿 70 多座、房屋 9000\n\n余间。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"兰州中山铁桥是第一座横跨黄河的铁桥，被称为“天下黄河第一桥”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。沿河而建的兰州水车与荷兰风车齐名；中山铁桥是第一座横跨黄河\n\n的铁桥，被称为“天下黄河第一桥”；黄河母亲雕塑已成为黄河文化和中华民族母亲形象的\n\n代表，是全国最美的城市雕塑之一。","clips":[]},{"n":23,"kind":"判断题","answer":"对","stem":"位于吐鲁番盆地的艾丁湖低于海平面 154.31 米，是中国陆地最低点。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。在大山东部和西部，还有被称为“火洲”的吐鲁番盆地和被誉为“塞\n\n外江南”的伊犁谷地。位于吐鲁番盆地的艾丁湖，低于海平面 154.31 米，是中国陆地最低\n\n点。","clips":[]},{"n":24,"kind":"判断题","answer":"错","stem":"泥人张彩塑创始于清代乾隆年间，是天津艺人张明山创造的彩绘泥塑艺术品。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。“乾隆年间”应改为“道光年间”。泥人张彩塑被公认为天津一绝，\n\n创始于清代道光年间，是天津艺人张明山于 19 世纪中叶创造的彩绘泥塑艺术品。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"清东陵中被称为“清陵之冠”的是裕陵地宫。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。“裕陵地宫”应改为“慈禧陵”。清东陵已开放 10 座陵寝，有清代最\n\n长的神道——孝陵神道（长达 6 千米）、清代规模最大的石像生——孝陵石像生（18 对）；\n\n有目前国内唯一被誉为地下佛堂和石雕宝库的裕陵地宫和号称清陵之冠的慈禧陵。","clips":[]},{"n":26,"kind":"判断题","answer":"对","stem":"宁夏是我国最大的回族聚居区。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。宁夏是我国最大的回族聚居区，回族人口为 262.6 万；回族以农业\n\n经济为主，以善于经商而著称。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"宁夏贺兰山东麓葡萄酒品牌价值在葡萄酒细分领域中居中国第一、世界第四。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。贺兰山东麓葡萄酒品牌价值在葡萄酒细分领域中居中国第一、世界\n\n第四，获国际顶级赛事大奖 1100 多项。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"云南是我国民族种类最多的省份，其中 15 个民族为云南特有。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。云南是我国民族种类最多的省份，全省少数民族人口数约 1563.6\n\n万，占全省人口总数的 33.12%。除汉族以外，人口在 6000 人以上的世居少数民族有彝族、\n\n哈尼族、白族、傣族、壮族、苗族等 25 个。其中哈尼族、白族、傣族、族、纳西族、独龙\n\n族等 15 个民族为云南特有。","clips":[]},{"n":29,"kind":"判断题","answer":"错","stem":"山西运城芮城县西侯度遗址发现的火烧骨，将人类用火的历史追溯至距今约 50 万年前。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“50 万年”应改为“243 万～180 万年”。运城芮城县西侯度遗址发\n\n现了火烧骨，将人类最早用火的时间追溯到了距今约 243 万～180 万年前。","clips":[]},{"n":30,"kind":"判断题","answer":"错","stem":"“哈尔滨”在达斡尔语中意为“天然牧场”，哈尔滨又名“鹤城”，市鸟为丹顶鹤。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“哈尔滨市”应改为“齐齐哈尔市”。齐齐哈尔达斡尔语意为“天然\n\n牧场”，又名鹤城，市鸟为丹顶鹤，获得“亚洲最佳冰球城市”称号。","clips":[]},{"n":31,"kind":"判断题","answer":"错","stem":"吉林省是满族的发源地之一，满族人口居全国首位。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“吉林省”应改为“辽宁省”。辽宁省满族人口占全国满族人口的 50.4%，\n\n居全国第 1 位；锡伯族人口占全国锡伯族人口的 70.2%，也居全国第 1 位。吉林省是满族的\n\n发源地之一。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"吉林省是朝鲜族的主要聚居地，朝鲜族爱穿素白服，注重礼仪，尊老爱幼，能歌善舞。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。吉林省是朝鲜族的主要聚居地，朝鲜族爱穿素白服，注重礼仪，尊\n\n老爱幼，能歌善舞。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"海南省简称“琼”，位于中国大陆最南端，南沙群岛的曾母暗沙是我国最南端的领土。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“中国大陆最南端”应改为“中国最南端”。海南省简称琼，位于中\n\n国最南端。南沙群岛的曾母暗沙是我国最南端的领土。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"太极拳诞生于明末清初的河南嵩山少林寺。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“河南嵩山少林寺”应改为“河南温县陈家沟”。太极拳诞生于明末\n\n清初河南温县陈家沟。","clips":[]},{"n":35,"kind":"判断题","answer":"对","stem":"涪陵榨菜是中国对外出口的三大名菜之一。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。涪陵榨菜也是中国对外出口的三大名菜（榨菜、薇菜、竹笋）之一。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"云南境内泸沽湖畔的纳西族支系摩梭人，至今仍保留着走婚制和母系家庭形式。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。泸沽湖畔云南境内的纳西族支系摩梭人，至今仍保留着走婚制和母\n\n系家庭的形式。摩梭人的“阿注婚姻”被民族学家喻为“人类社会家庭婚姻发展史的活化石”。","clips":[]},{"n":37,"kind":"判断题","answer":"错","stem":"云南籍音乐家田汉是中华人民共和国国歌《义勇军进行曲》的作曲者。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“田汉”应改为“聂耳”。云南籍音乐家聂耳，是中华人民共和国国\n\n歌《义勇军进行曲》的作曲者。","clips":[]},{"n":38,"kind":"判断题","answer":"对","stem":"1937 年 1 月至 1947 年 3 月，延安一直是中共中央所在地和陕甘宁边区首府。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1935 年 9 月 27 日一 1948 年 3 月 23 日，中国共产党在陕北战斗和\n\n生活了 13 个春秋；1937 年 1 月至 1947 年 3 月，延安一直是中共中央所在地和陕甘宁边区\n\n首府。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"广西壮族自治区简称桂，境内喀斯特地貌广布，发育类型之多世界少见。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。广西壮族自治区简称桂，境内喀斯特地貌广布，集中连片分布于桂\n\n西南、桂西北、桂中和桂东北，发育类型之多世界少见。西南与越南接壤，有“广西盆地”\n\n之称。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"甘肃取甘州（今张掖）、肃州（今酒泉）二地首字而得名，元代设甘肃省，简称“甘”。（ ）","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。甘肃取甘州（今张掖）、肃州（今酒泉）二地的首字而成，元代设甘\n\n肃省，简称甘。而唐代曾在此设置过陇右道，故又简称“陇”。省会兰州。\n\n二、单选题（请将正确答案的字母填在括号内）","clips":[]},{"n":41,"kind":"单项选择题","answer":"A","stem":"领导东汉黄巾起义、传授太平道的是（ ）。","options":{"A":"张角","B":"张陵","C":"王重阳","D":"葛洪"},"explanation":"领导东汉黄巾起义的张角传授的为太平道；张陵（又称张道陵、张“天师”）在蜀中\n\n鹤鸣山传播五斗米道，太平道和五斗米道即为早期的道教。","clips":[]},{"n":42,"kind":"单项选择题","answer":"C","stem":"西汉出现农具耕车，唐朝出现轻便省力、适宜深耕的（ ）。","options":{"A":"简车","B":"水排","C":"曲辕犁","D":"翻车"},"explanation":"西汉农具出现耕车（畜力播种工具）和龙骨水车（灌溉工具），唐朝还出现轻便省力、\n\n适宜深耕的曲辕犁。","clips":[]},{"n":43,"kind":"单项选择题","answer":"D","stem":"抗美援朝纪念日是（ ）。","options":{"A":"11 月 25 日","B":"10 月 1 日","C":"10 月 19 日","D":"10 月 25 日"},"explanation":"10 月 25 日，志愿军打响了进入朝鲜后的第一仗，后来，这一天被定为抗美援朝纪\n\n念日。","clips":[]},{"n":44,"kind":"单项选择题","answer":"A","stem":"下列宋代散文名篇与作者对应错误的是（ ）。","options":{"A":"苏轼《爱莲说》","B":"欧阳修《醉翁亭记》","C":"王安石《游褒禅山记》","D":"范仲淹《岳阳楼记》"},"explanation":"《爱莲说》的作者是周敦颐，不是苏轼。周敦颐《爱莲说》是宋代散文名篇。宋代\n\n散文名家还有周敦颐《爱莲说》等。","clips":[]},{"n":45,"kind":"单项选择题","answer":"D","stem":"汉族饮食以（ ）为主食。","options":{"A":"牛羊肉","B":"水产品","C":"乳制品","D":"粮食作物"},"explanation":"汉族的饮食结构以粮食作物为主食，以鱼、肉、蔬菜为副食；汉族的饮食文化讲究\n\n色、香、味、形、器、意的完美结合，在世界上享有盛誉。","clips":[]},{"n":46,"kind":"单项选择题","answer":"C","stem":"韩国的国花是（ ）。","options":{"A":"雏菊","B":"樱花","C":"木槿花","D":"玫瑰"},"explanation":"韩国国旗为太极旗，国花是木槿花；红色和黄色是皇家的颜色，象征着幸福。韩国\n\n创造的经济繁荣被称为“汉江奇迹”。","clips":[]},{"n":47,"kind":"单项选择题","answer":"A","stem":"德国最古老的大学是（ ）。","options":{"A":"海德堡大学","B":"慕尼黑大学","C":"法兰克福大学","D":"柏林大学"},"explanation":"海德堡大学成立于 1386 年，是德国最古老的大学；柏林是德国“最翠绿”的大都市，\n\n慕尼黑拥有“欧洲建筑博物馆”之名。","clips":[]},{"n":48,"kind":"单项选择题","answer":"D","stem":"位于台湾的构造湖是（ ）。","options":{"A":"鄱阳湖","B":"五大连池","C":"月牙泉","D":"日月潭"},"explanation":"构造湖由地壳运动产生断裂凹陷经储水而成，如滇池、洱海、日月潭；鄱阳湖属河\n\n成湖，五大连池属堰塞湖，月牙泉属风成湖。","clips":[]},{"n":49,"kind":"单项选择题","answer":"B","stem":"首次提出“一个国家，两种制度”构想的时间是（ ）。","options":{"A":"1978 年","B":"1982 年","C":"1997 年","D":"1999 年"},"explanation":"1982 年，为解决台湾问题，邓小平首次提出“一个国家，两种制度”构想。","clips":[]},{"n":50,"kind":"单项选择题","answer":"B","stem":"下列谥号用字中，属于批评类的是（ ）。","options":{"A":"“武”","B":"“厉”","C":"“景”","D":"“文”"},"explanation":"解析谥号分三类：表扬的如“文”“武”“成”“景”；批评的如“炀”（好内远礼）、\n\n“厉”（杀戮无辜）；同情的如短命叫“哀”，遭受国难叫“愍”。批评的谥号如“炀”（好内\n\n远礼）、“厉”（杀戮无辜）。","clips":[]},{"n":51,"kind":"单项选择题","answer":"B","stem":"被誉为“唐画之祖”，其《游春图》为现存最早卷轴画的画家是（ ）。","options":{"A":"阎立本","B":"展子虔","C":"吴道子","D":"顾恺之"},"explanation":"解析隋朝展子虔既画山水也画人物，被认为是“唐画之祖”，代表作《游春图》是现\n\n存最早的卷轴画。隋朝展子虔既画山水也画人物。顾恺之主张“以形写神”，代表作《女史\n\n箴图》《洛神赋图》。","clips":[]},{"n":52,"kind":"单项选择题","answer":"B","stem":"京剧的主要唱腔包括“西皮”和（ ）两类。","options":{"A":"吹腔","B":"二黄","C":"高腔","D":"昆腔"},"explanation":"京剧主要唱腔是“西皮”与“二黄”两类，主要表演手法是唱、念、做、打，主要\n\n角色有生、旦、净、丑。京剧主要表演手法是唱、念、做、打，主要角色有生、旦、生、净、\n\n丑，历史上最著名的“京剧四大名旦”是梅兰芳、尚小云、程砚秋、荀慧生。","clips":[]},{"n":53,"kind":"单项选择题","answer":"B","stem":"龙泉青瓷产品分为两类，其中白胎和朱砂胎青瓷称为（ ）。","options":{"A":"“哥窑”","B":"“弟窑”","C":"“官窑”","D":"“汝窑”"},"explanation":"龙泉青瓷产品有两种：一种是白胎和朱砂胎青瓷，称“弟窑”；一种是釉面开片的黑\n\n胎青瓷，称“哥窑”，哥窑素有“紫口铁足”之称，堪称瓷中珍品。","clips":[]},{"n":54,"kind":"单项选择题","answer":"D","stem":"中国历史上第一部官定儒经是（ ）。","options":{"A":"开成石经","B":"正始石经","C":"三体石经","D":"熹平石经"},"explanation":"东汉蔡邕主持刻写熹平石经，置于洛阳太学，成为中国历史上第一部官定的儒经经\n\n文。","clips":[]},{"n":55,"kind":"单项选择题","answer":"C","stem":"官式建筑中规格最高的屋顶形式是（ ）。","options":{"A":"单檐庑殿顶","B":"攒尖顶","C":"重檐庑殿顶","D":"重檐歇山顶"},"explanation":"解析官式建筑中重檐庑殿顶规格最高，如故宫太和殿；重檐歇山顶等级仅次于重檐\n\n庑殿顶。重檐庑殿顶如故宫太和殿。重檐歇山顶等级仅次于重檐庑殿顶，多用于规格很高的\n\n殿堂，如故宫保和殿、天安门等。","clips":[]},{"n":56,"kind":"单项选择题","answer":"A","stem":"园林中供读书用、环境隐蔽清幽的建筑是（ ）。","options":{"A":"斋","B":"舫","C":"廊","D":"厅堂"},"explanation":"解析斋供读书用，环境当隐蔽清幽；舫是仿造舟船造型的建筑，多设于水际或池中；\n\n廊是一条带屋顶的路，既“引”且“观”。","clips":[]},{"n":57,"kind":"单项选择题","answer":"C","stem":"红军长征胜利结束的时间是（ ）。","options":{"A":"1934 年 10 月","B":"1935 年 10 月","C":"1936 年 10 月"},"explanation":"1934 年 10 月至 1936 年 10 月，红军长驱二万五千里，胜利完成震撼世界、彪炳史\n\n册的长征。1936 年 10 月 9 日，红四方面军指挥部到达甘肃会宁，与红一方面军会合；22\n\n日，红二方面军指挥部到达甘肃隆德将台堡（今属宁夏回族自治区），同红一方面军会合。\n\n至此，三大主力红军会师。","clips":[]},{"n":58,"kind":"单项选择题","answer":"A","stem":"唐代帝王陵墓采用“以山为陵”形式的典型代表是（ ）。","options":{"A":"唐乾陵","B":"宋陵","C":"秦始皇陵","D":"汉茂陵"},"explanation":"唐代李世民认为平地筑起高坡太劳民伤财，同时为了防止水土流失和盗墓，改为“以\n\n山为陵”的形式，唐乾陵即为典型例子；秦始皇陵、汉茂陵取“方上”形式。唐代李世民为\n\n防止水土流失和盗墓，改为“以山为陵”。","clips":[]},{"n":59,"kind":"单项选择题","answer":"A","stem":"北传佛教以大乘佛教为主，其经典主要使用（ ）。","options":{"A":"汉语","B":"藏语","C":"巴利语","D":"梵语"},"explanation":"解析北传佛教以大乘佛教为主，也包括密乘佛教，其经典主要属于汉语，也称汉语\n\n系佛教；南传佛教以小乘佛教（上座部佛教）为主。","clips":[]},{"n":60,"kind":"单项选择题","answer":"D","stem":"与南方苏州桃花坞年画并称“南桃北柳”的是（ ）。","options":{"A":"山东潍坊杨家埠年画","B":"四川绵竹年画","C":"河南朱仙镇年画","D":"天津杨柳青年画"},"explanation":"解析天津杨柳青年画有“家家会刻版，人人善丹青”之誉，与苏州桃花坞年画并称\n\n“南桃北柳”。天津杨柳青年画有“家家会刻版，人人善丹青”之誉。杨柳青年画有“家家\n\n会刻版，人人善丹青”之誉。","clips":[]},{"n":61,"kind":"单项选择题","answer":"A","stem":"开始采用年号纪年的皇帝是（ ）。","options":{"A":"汉武帝","B":"汉文帝","C":"汉景帝","D":"汉高祖"},"explanation":"西汉武帝时，开始采用年号纪年，如汉武帝将即位的第一年（公元前 140 年）称为\n\n建元元年，第二年称为建元二年等。","clips":[]},{"n":62,"kind":"单项选择题","answer":"C","stem":"宣纸最早产于唐代，有“（ ）”之说。","options":{"A":"万载存真","B":"纸中之王","C":"纸寿千年","D":"落纸如漆"},"explanation":"宣纸的原料是青檀皮，有“纸寿千年”之说法，分生熟两种。宣纸的原料是青檀皮。\n\n宣纸分生熟两种，熟宣经过胶矾浸染，宜于工笔。","clips":[]},{"n":63,"kind":"单项选择题","answer":"D","stem":"下列属于汉隶代表作的是（ ）。","options":{"A":"《兰亭集序》","B":"《祭侄文稿》","C":"《泰山石刻》","D":"《石门颂》"},"explanation":"汉隶代表作有东汉《石门颂》《孔宙碑》《衡方碑》《曹全碑》《张迁碑》等；《泰山石\n\n刻》是李斯小篆代表作。汉隶代表作还有《孔宙碑》《衡方碑》《曹全碑》《张迁碑》等。","clips":[]},{"n":64,"kind":"单项选择题","answer":"D","stem":"中国烹饪在夏商周时期出现铜烹，西汉以后出现（ ）。","options":{"A":"电烹","B":"陶烹","C":"石烹","D":"铁烹"},"explanation":"夏商周时期出现铜烹，西汉以后出现铁烹，发展到现在还出现了能够精准控制火力\n\n和时长的电烹技术，烹饪工艺不断改进和完善，形成了富有中国特色的风味体系。","clips":[]},{"n":65,"kind":"单项选择题","answer":"A","stem":"陕西西凤酒属于（）白酒。","options":{"A":"兼香型","B":"米香型","C":"酱香型","D":"浓香型"},"explanation":"西凤酒以大麦、豌豆制曲，优质高粱为原料，属兼香型白酒；贵州茅台酒是酱香型\n\n的典型代表，泸州老窖特曲、五粮液酒为浓香型代表。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":66,"kind":"单项选择题","answer":"A","stem":"寄畅园是中国（ ）园林的代表。","options":{"A":"山麓别墅","B":"皇家","C":"寺院"},"explanation":"寄畅园是中国山麓别墅园林的代表；北京颐和园内的谐趣园、圆明园内的廓然大公\n\n均为仿无锡惠山寄畅园而建。寄畅园取王羲之“取次仁智乐，寄畅山水阴”句命名，是中国\n\n山麓别墅园林的代表。","clips":[]},{"n":67,"kind":"单项选择题","answer":"A","stem":"我国著名的花岗岩低山或名丘地貌景区是（ ）。","options":{"A":"厦门鼓浪屿万石山","B":"陕西华山","C":"山东泰山","D":"安徽黄山"},"explanation":"厦门鼓浪屿万石山、浙江普陀山、海南岛天涯海角等景区属于典型的花岗岩低山或\n\n名丘地貌。山东泰山、安徽黄山、陕西华山等为花岗岩高山地貌。鼓浪屿万石山属典型的花\n\n岗岩低山或名丘地貌。","clips":[]},{"n":68,"kind":"单项选择题","answer":"C","stem":"山顶洞人习惯在墓葬周边撒赤铁矿粉，说明他们（ ）。","options":{"A":"已经开始种植水稻","B":"已经会种植粟","C":"已经有灵魂不死的意识","D":"已经会烧制彩陶"},"explanation":"山顶洞人习惯在墓葬周边撒赤铁矿粉，说明他们已经有灵魂不死的意识，代表着原\n\n始宗教信仰开始萌芽。山顶洞人代表着原始宗教信仰开始萌芽。山顶洞人已经掌握人工取火\n\n技术，会使用骨针缝制皮衣。","clips":[]},{"n":69,"kind":"单项选择题","answer":"D","stem":"历代修筑的长城中，规模最大的是（ ）。","options":{"A":"明长城","B":"楚方城","C":"秦长城","D":"汉长城"},"explanation":"汉长城规模最大，东起辽东，西迄蒲昌海（今新疆罗布泊），长 1 万千米；秦始皇统\n\n一六国后，以秦、赵、燕三国的北方长城为基础修缮增筑。秦始皇统一六国后，以秦、赵、\n\n燕三国的北方长城为基础，修缮增筑长城。","clips":[]},{"n":70,"kind":"单项选择题","answer":"A","stem":"欧洲地势最高的首都是（ ）。","options":{"A":"马德里","B":"伯尔尼","C":"伦敦","D":"巴黎"},"explanation":"马德里是西班牙首都，欧洲地势最高的首都。西班牙还有“太阳王国”之称。西班\n\n牙民风奔放热情，以斗牛、弗拉门戈舞蹈、吉他而闻名。","clips":[]},{"n":71,"kind":"单项选择题","answer":"B","stem":"被称为最具吸引力旅游资源的“3S”，指的是阳光、沙滩和（ ）。","options":{"A":"海风","B":"海水","C":"沙雕","D":"浪花"},"explanation":"阳光、沙滩、海水（3S）被称为最具吸引力的旅游资源。阳光、沙滩、海水被称为\n\n最具吸引力的旅游资源。","clips":[]},{"n":72,"kind":"单项选择题","answer":"C","stem":"“中国白”也成为（ ）白瓷的代名词。","options":{"A":"河北唐山","B":"景德镇","C":"福建德化","D":"浙江龙泉"},"explanation":"福建德化是我国白瓷著名产地。“中国白”也成为德化白瓷的代名词。德化窑是古代\n\n南方著名瓷窑。","clips":[]},{"n":73,"kind":"单项选择题","answer":"D","stem":"1964 年 10 月 16 日，我国成功爆炸了第一颗（ ）。","options":{"A":"导弹","B":"人造卫星","C":"氢弹","D":"原子弹"},"explanation":"1964 年 10 月 16 日成功爆炸我国第一颗原子弹；1967 年 6 月 17 日，我国第一颗氢\n\n弹空爆试验成功。1966 年 10 月 27 日，我国自行研制的东风二号核导弹试爆成功，标志着\n\n“两弹”成功结合，中国有了可用于实战的核导弹。","clips":[]},{"n":74,"kind":"单项选择题","answer":"A","stem":"世界上最大、最长的珊瑚礁群是（ ）。","options":{"A":"大堡礁","B":"马尔代夫珊瑚礁","C":"伯利兹珊瑚礁","D":"红海珊瑚礁"},"explanation":"大堡礁是世界上最大、最长的珊瑚礁群，1981 年被列入《世界自然遗产名录》，纵\n\n贯澳大利亚的东北沿海，被誉为“透明清澈的海中野生王国”。","clips":[]},{"n":75,"kind":"单项选择题","answer":"B","stem":"桂林三花酒是（ ）白酒的代表。","options":{"A":"浓香型","B":"米香型","C":"清香型","D":"酱香型"},"explanation":"桂林三花酒是米香型白酒的代表。泸州老窖特曲、五粮液酒为浓香型酒的代表；清\n\n香型白酒代表品牌是山西汾酒，产自山西汾阳杏花村。桂林三花酒是米香型白酒的代表。","clips":[]},{"n":76,"kind":"单项选择题","answer":"C","stem":"以燕窝和鱼翅的烹制最为有名的官府菜是（ ）。","options":{"A":"宫廷菜","B":"孔府菜","C":"谭家菜","D":"随园菜"},"explanation":"谭家菜代表名菜有清汤燕窝、黄焖鱼翅、红烧鲍鱼、扒大乌参、草菇蒸鸡等。谭家\n\n菜在烹调中讲求糖盐各半，以甜提鲜、以咸提香。","clips":[]},{"n":77,"kind":"单项选择题","answer":"B","stem":"1949 年中国人民政治协商会议第一届全体会议决定以（ ）为代国歌。","options":{"A":"《黄河大合唱》","B":"《义勇军进行曲》","C":"《歌唱祖国》","D":"《没有共产党就没有新中国》"},"explanation":"会议决定采用公元纪年，以《义勇军进行曲》为代国歌，国旗为五星红旗。会议还\n\n决定采用公元纪年，国旗为五星红旗，北平改名为北京。","clips":[]},{"n":78,"kind":"单项选择题","answer":"C","stem":"长江三峡自西向东依次是（ ）。","options":{"A":"西陵峡、巫峡、瞿塘峡","B":"瞿塘峡、西陵峡、巫峡","C":"瞿塘峡、巫峡、西陵峡","D":"巫峡、瞿塘峡、西陵峡"},"explanation":"长江三峡西起重庆市奉节白帝城，东止湖北宜昌南津关，全长 200 余千米，自西向\n\n东分别是瞿塘峡、巫峡、西陵峡。瞿塘峡是三峡中最短的一个，长 8 千米，以雄伟险峻著称，\n\n有“夔门天下雄”之称。","clips":[]},{"n":79,"kind":"单项选择题","answer":"B","stem":"标志着我国古代数学体系基本形成的是东汉时期的（ ）。","options":{"A":"《周牌算经》","B":"《九章算术》","C":"《甘石星经》","D":"《梦溪笔谈》"},"explanation":"解析东汉时期的《九章算术》，提出了负数概念及正负数运算法则，标志着我国古代\n\n数学体系基本形成。《九章算术》提出了负数概念及正负数运算法则；西汉《周牌算经》是\n\n我国最早的数学著作，提出了勾股定理。","clips":[]},{"n":80,"kind":"单项选择题","answer":"A","stem":"中国的四大高原是（ ）。","options":{"A":"青藏高原、内蒙古高原、黄土高原、云贵高原","B":"青藏高原、内蒙古高原、黄土高原、帕米尔高原","C":"青藏高原、内蒙古高原、云贵高原、帕米尔高原","D":"青藏高原、黄土高原、云贵高原、帕米尔高原"},"explanation":"四大高原为青藏高原、内蒙古高原、黄土高原、云贵高原。","clips":[]},{"n":81,"kind":"单项选择题","answer":"B","stem":"南非的三个首都是（ ）。","options":{"A":"茨瓦内、布隆方丹、约翰内斯堡","B":"茨瓦内、布隆方丹、开普敦","C":"布隆方丹、开普敦、约翰内斯堡","D":"茨瓦内、开普敦、约翰内斯堡"},"explanation":"南非是世界上唯一拥有三个首都的国家：行政首都是茨瓦内（原名比勒陀利亚），司\n\n法首都为布隆方丹，立法首都为开普敦。","clips":[]},{"n":82,"kind":"单项选择题","answer":"D","stem":"下列不属于“建安七子”的是（ ）。","options":{"A":"孔融","B":"陈琳","C":"王粲","D":"曹植"},"explanation":"建安文学中的重要作家有“曹氏父子”（曹操、曹丕、曹植）和“建安七子”（孔融、\n\n陈琳、王粲、徐干、阮瑀、应玚、刘桢）。","clips":[]},{"n":83,"kind":"单项选择题","answer":"C","stem":"“江南三大奇石”包括（ ）。","options":{"A":"玉玲珑、冠云峰、四季假山","B":"冠云峰、结云峰、环秀山庄假山","C":"玉玲珑、冠云峰、结云峰","D":"玉玲珑、结云峰、环秀山庄假山"},"explanation":"被称为“江南三大奇石”的上海豫园的玉玲珑、苏州留园的冠云峰、杭州竹素园的\n\n结云峰，都是假山中的佼佼者。","clips":[]},{"n":84,"kind":"单项选择题","answer":"A","stem":"泰国三大国宝是（ ）。","options":{"A":"玉佛寺、卧佛寺、金佛寺","B":"玉佛寺、卧佛寺、郑王庙","C":"卧佛寺、金佛寺、四面佛","D":"玉佛寺、金佛寺、四面佛"},"explanation":"玉佛寺、卧佛寺、金佛寺被称为泰国三大国宝，其中玉佛寺是泰国唯一没有和尚居\n\n住的佛寺。","clips":[]},{"n":85,"kind":"单项选择题","answer":"B","stem":"我国四大卫星发射中心（场）是（ ）。","options":{"A":"酒泉、太原、西昌、乌鲁木齐","B":"酒泉、太原、西昌、文昌","C":"酒泉、太原、文昌、乌鲁木齐","D":"太原、西昌、文昌、乌鲁木齐"},"explanation":"1970 年我国发射第一颗人造地球卫星后，目前已建成甘肃酒泉卫星发射中心、山西\n\n太原卫星发射中心、四川西昌卫星发射中心和海南文昌卫星发射场。","clips":[]},{"n":86,"kind":"单项选择题","answer":"D","stem":"帝王陵地面建筑的三部分是（ ）。","options":{"A":"祭祀建筑区、神道、地宫","B":"神道、护陵监、宝城","C":"祭祀建筑区、地宫、宝城","D":"祭祀建筑区、神道、护陵监"},"explanation":"帝王陵的地面建筑主要有三部分：祭祀建筑区、神道、护陵监。","clips":[]},{"n":87,"kind":"单项选择题","answer":"D","stem":"下列属于上海本帮菜经典菜肴的是（ ）。","options":{"A":"佛跳墙","B":"白切鸡","C":"剁椒鱼头","D":"黄焖栗子鸡"},"explanation":"上海本帮菜即沪菜，核心特色为淡油赤酱、咸中带甜、油而不腻，经典菜肴有响油\n\n鳝糊、黄焖栗子鸡等。A 项佛跳墙是闽菜，B 项白切鸡是粤菜，C 项剁椒鱼头是湘菜，均易\n\n误选。","clips":[]},{"n":88,"kind":"单项选择题","answer":"A","stem":"2021 年首次举办的中国首个海边戏剧节是（ ）。","options":{"A":"阿那亚戏剧节","B":"乌镇戏剧节","C":"大凉山戏剧节","D":"南京戏剧节"},"explanation":"河北还于 2021 年首次举办阿那亚戏剧节，这是中国首个海边戏剧节；2023 年廊坊\n\n《只有红楼梦·戏剧幻城》首次开放，是国内首个以《红楼梦》为主题的大型戏剧群落。","clips":[]},{"n":89,"kind":"单项选择题","answer":"D","stem":"以“沙子会唱歌”而闻名、被称为“响沙之王”的 5A 级景区是（ ）。","options":{"A":"沙坡头","B":"鸣沙山","C":"库布齐","D":"响沙湾"},"explanation":"在鄂尔多斯库布齐沙漠中，以沙子会唱歌而闻名的 5A 级景区响沙滩被称为“响沙之\n\n王”，只要踩踏或滑行它就会发出嗡嗡响声。A 项沙坡头在宁夏中卫（中国四大响沙之一），\n\nB 项鸣沙山在甘肃敦煌，易误选。","clips":[]},{"n":90,"kind":"单项选择题","answer":"B","stem":"有“草原敦煌”美称的是（ ）。","options":{"A":"云冈石窟","B":"阿尔寨石窟","C":"龙门石窟","D":"莫高窟"},"explanation":"阿尔寨石窟有“草原敦煌”的美称。","clips":[]},{"n":91,"kind":"单项选择题","answer":"D","stem":"下列文化中，被认为是中国早期国家形态的重要代表、印证中华文明悠久历史的是（ ）。","options":{"A":"仰韶文化","B":"红山文化","C":"龙山文化","D":"良渚文化"},"explanation":"良渚文化是中国早期国家形态的重要代表，良渚古城遗址被认为是 5000 年前的区域\n\n性权力中心，印证了中华文明 5000 年的历史。","clips":[]},{"n":92,"kind":"单项选择题","answer":"D","stem":"“京味文学”的代表人物是（ ）。","options":{"A":"茅盾","B":"巴金","C":"曹禺","D":"老舍"},"explanation":"“京味文学”是北京最具特色的文化现象。老舍是京味文学的代表，他留下的《骆\n\n驼祥子》《四世同堂》《茶馆》《龙须沟》等作品至今影响深远。","clips":[]},{"n":93,"kind":"单项选择题","answer":"B","stem":"瘦西湖是（ ）的标志性文旅名片，素有“园林之盛，甲于天下”之誉。","options":{"A":"苏州","B":"扬州","C":"无锡","D":"镇江"},"explanation":"瘦西湖是扬州的标志性文旅名片，五亭桥是瘦西湖的地标，二十四桥则因古诗意境\n\n而闻名。","clips":[]},{"n":94,"kind":"单项选择题","answer":"C","stem":"享誉世界的民歌《茉莉花》根植于（ ）。","options":{"A":"浙江","B":"福建","C":"江苏","D":"湖南"},"explanation":"享誉世界的《茉莉花》根植江苏，融合江南温婉气韵，成为江苏民歌乃至中国民间\n\n音乐的经典名片。","clips":[]},{"n":95,"kind":"单项选择题","answer":"B","stem":"“元曲四大家”之一、散曲代表作是《天净沙·秋思》的北京文化名人是（ ）。","options":{"A":"关汉卿","B":"马致远","C":"王实甫","D":"白朴"},"explanation":"北京文化名人马致远是“元曲四大家”之一，其散曲代表作是《天净沙·秋思》，杂\n\n剧代表作是《汉宫秋》。","clips":[]},{"n":96,"kind":"单项选择题","answer":"A","stem":"被誉为“全球首部皇家文化主题大型户外实景演出”的是（ ）。","options":{"A":"《鼎盛王朝·康熙大典》","B":"《大宋·东京梦华》","C":"《长恨歌》","D":"《印象·刘三姐》"},"explanation":"《鼎盛王朝·康熙大典》被誉为“全球首部皇家文化主题大型户外实景演出”。B 项\n\n在河南开封，C 项在陕西西安，D 项在广西桂林，均为跨省易混演艺项目。","clips":[]},{"n":97,"kind":"单项选择题","answer":"A","stem":"作为中国“洋家乐”发源地，利用乡村闲置资源发展文化旅游的浙江名镇是（ ）。","options":{"A":"莫干山镇","B":"乌镇","C":"南浔镇","D":"西塘镇"},"explanation":"莫干山镇作为中国“洋家乐”发源地，利用乡村闲置资源发展文化旅游。","clips":[]},{"n":98,"kind":"单项选择题","answer":"D","stem":"堪称“草原之舟”的蒙古族特有交通工具是（ ）。","options":{"A":"雪橇","B":"马车","C":"驼队","D":"勒勒车"},"explanation":"勒勒车是蒙古族特有的牛车，堪称“草原之舟”。“沙漠之舟”指骆驼，注意区分。","clips":[]},{"n":99,"kind":"单项选择题","answer":"A","stem":"被誉为“奇秀甲于东南”的上海园林是（ ）。","options":{"A":"豫园","B":"古猗园","C":"秋霞圃","D":"曲水园"},"explanation":"豫园其名体现“豫悦老亲”之意，被誉为“奇秀甲于东南”“东南名园冠”等。","clips":[]},{"n":100,"kind":"单项选择题","answer":"C","stem":"呼和浩特简称“呼市”，旧称“归绥市”，其名称意为（ ）。","options":{"A":"“金色的城”","B":"“神圣的城”","C":"“青色的城”","D":"“美丽的城”"},"explanation":"呼和浩特简称“呼市”，旧称“归绥市”，意为“青色的城”，是“中国乳都”，以奶\n\n制品和草原风味著称。","clips":[]},{"n":101,"kind":"单项选择题","answer":"D","stem":"江苏花果山景区有（ ）的美誉。","options":{"A":"“天下第一奇山”","B":"“海天佛国”","C":"“东南第一山”","D":"“东海第一胜境”"},"explanation":"花果山景区有“东海第一胜境”美誉。A 项是黄山（安徽）的常见誉称，B 项是普陀\n\n山（浙江），C 项是雁荡山（浙江），均易误选。","clips":[]},{"n":102,"kind":"单项选择题","answer":"B","stem":"江苏平原面积占陆地面积的（ ）。","options":{"A":"68.8%","B":"86.90%","C":"80.1%","D":"92.5%"},"explanation":"江苏省地形以平原为主，平原面积占陆地面积的 86.90%。C 项 80.1%是山西山地丘\n\n陵面积占比，易误选。","clips":[]},{"n":103,"kind":"单项选择题","answer":"C","stem":"被联合国旅游组织授予“世界冰雪旅游卓越城市”称号的是（ ）。","options":{"A":"长春市","B":"吉林市","C":"哈尔滨市","D":"沈阳市"},"explanation":"联合国旅游组织授予哈尔滨市“世界冰雪旅游卓越城市”称号。哈尔滨素有“冰城”\n\n“东方莫斯科”“东方小巴黎”之美称，是享誉中外的冰雪艺术之都。","clips":[]},{"n":104,"kind":"单项选择题","answer":"D","stem":"素有“北门锁钥”之称的是（ ）。","options":{"A":"慕田峪长城","B":"司马台长城","C":"居庸关长城","D":"八达岭长城"},"explanation":"八达岭长城素有“北门锁钥”之称。点评：常见考法是把“八达岭”偷换成“慕田\n\n峪”。","clips":[]},{"n":105,"kind":"单项选择题","answer":"D","stem":"盛京三陵中，安葬清太祖努尔哈赤的陵墓是（ ）。","options":{"A":"清永陵","B":"清昭陵","C":"清孝陵","D":"清福陵"},"explanation":"清永陵葬努尔哈赤以上四代父祖、福陵葬努尔哈赤、昭陵葬皇太极，合称盛京三陵。\n\n清福陵是清太祖努尔哈赤和孝慈高皇后叶赫那拉氏的陵墓。","clips":[]},{"n":106,"kind":"单项选择题","answer":"C","stem":"以刀刻染色工艺为核心，被誉为“中华民间艺术一绝”的山西剪纸是（ ）。","options":{"A":"蔚县剪纸","B":"陕北剪纸","C":"广灵剪纸","D":"扬州剪纸"},"explanation":"广灵剪纸以刀刻染色工艺为核心，构图生动、用料考究，被誉为“中华民间艺术一\n\n绝”。闻喜花馍将面食做到了极致。","clips":[]},{"n":107,"kind":"单项选择题","answer":"B","stem":"2014 年 11 月 19 日，浙江（ ）成为世界互联网大会永久会址。","options":{"A":"西塘","B":"乌镇","C":"南浔","D":"周庄"},"explanation":"乌镇素有“中国最后的枕水人家”之誉，拥有 7000 多年文明史和 1300 年建镇史，\n\n2014 年 11 月 19 日成为世界互联网大会永久会址。D 项周庄在江苏，易误选。","clips":[]},{"n":108,"kind":"单项选择题","answer":"D","stem":"辽宁全省地形概貌大致是（ ）。","options":{"A":"“七山一水二分田”","B":"“五山一水一草三分田”","C":"“八山一水一分田”","D":"“六山一水三分田”"},"explanation":"辽宁全省地形概貌大致是“六山一水三分田”，山地丘陵约占全省国土总面积的 60%，\n\n地势呈马蹄形向渤海倾斜。A 项“七山一水二分田”是浙江，B 项“五山一水一草三分田”\n\n是黑龙江，C 项“八山一水一分田”是福建和贵州的概貌表述，易误选。","clips":[]},{"n":109,"kind":"单项选择题","answer":"A","stem":"以“铁人”著称的大庆精神核心人物是（ ）。","options":{"A":"王进喜","B":"雷锋","C":"焦裕禄","D":"孔繁森"},"explanation":"以铁人王进喜为代表的大庆精神，是中华民族精神的重要组成部分。","clips":[]},{"n":110,"kind":"单项选择题","answer":"B","stem":"被誉为“中华文明的曙光”、位于安徽含山县的遗址是（ ）。","options":{"A":"双墩遗址","B":"凌家滩遗址","C":"贾湖遗址","D":"屈家岭遗址"},"explanation":"位于含山县的凌家滩遗址，被誉为“中华文明的曙光”。蚌埠双墩遗址距今约 7000\n\n年，是目前淮河中游地区发现的最早、保存最完整的新石器时代文化遗址。","clips":[]},{"n":111,"kind":"单项选择题","answer":"D","stem":"上海市的平均海拔是（ ）。","options":{"A":"43.5 米","B":"50 米以下","C":"100 米左右","D":"4 米左右"},"explanation":"上海平均海拔 4 米左右。A 项 43.5 米是北京平均海拔，易误选。","clips":[]},{"n":112,"kind":"单项选择题","answer":"C","stem":"中国民间武术有 129 个拳种，其中发源于河北省的有（ ）。","options":{"A":"36 个","B":"42 个","C":"52 个","D":"65 个"},"explanation":"中国有民间武术 129 个拳种，其中 52 个发源于河北省。现存规模和影响较大的有沧\n\n州的八极拳、邯郸永年的太极拳、廊坊的八卦掌等。","clips":[]},{"n":113,"kind":"单项选择题","answer":"A","stem":"国内仅存的三座唐代木构建筑中，位于五台山的是（ ）。","options":{"A":"佛光寺东大殿、南禅寺大佛殿","B":"佛光寺东大殿、晋祠圣母殿","C":"南禅寺大佛殿、永乐宫三清殿","D":"晋祠圣母殿、华严寺大雄宝殿"},"explanation":"佛光寺东大殿和南禅寺大佛殿是国内仅存三座唐代木构建筑的杰出之作，为研究唐\n\n代建筑提供了极为珍贵的实物资料。","clips":[]},{"n":114,"kind":"单项选择题","answer":"A","stem":"天津素有（ ）之称。","options":{"A":"“九河下梢”“河海要冲”","B":"“九省通衢”“江汉汇流”","C":"“塞上江南”“鱼米之乡”","D":"“六朝古都”“十朝都会”"},"explanation":"天津素有“九河下梢”“河海要冲”之称，是中国北方最大的港口城市。“九省通衢”\n\n指武汉（湖北），“塞上江南”指宁夏，“六朝古都”指南京（江苏），均易误选。","clips":[]},{"n":115,"kind":"单项选择题","answer":"C","stem":"被称为“东方城堡”、融祠、家、堡为一体的封闭式客家建筑是（ ）。","options":{"A":"福建土楼","B":"开平碉楼","C":"客家围屋","D":"吊脚楼"},"explanation":"客家围屋又被称为“东方城堡”，是一种融祠、家、堡为一体，具有鲜明防卫特征的\n\n封闭式客家建筑。A 项福建土楼是客家聚族而居的传统民居，B 项开平碉楼在广东，易误选。","clips":[]},{"n":116,"kind":"单项选择题","answer":"A","stem":"被誉为“世界水电之都”的湖北城市是（ ）。","options":{"A":"宜昌","B":"襄阳","C":"荆州","D":"十堰"},"explanation":"宜昌素有“三峡门户”“川鄂咽喉”之称，古称“夷陵”，被誉为“世界水电之都”，\n\n是屈原、王昭君的故里。","clips":[]},{"n":117,"kind":"单项选择题","answer":"B","stem":"按照《粤港澳大湾区发展规划纲要》，粤港澳大湾区的四大中心城市是（ ）。","options":{"A":"香港、澳门、珠海、东莞","B":"香港、澳门、广州、深圳","C":"广州、深圳、珠海、佛山","D":"香港、广州、深圳、东莞"},"explanation":"2019 年 2 月 18 日《粤港澳大湾区发展规划纲要》印发，以香港、澳门、广州、深\n\n圳四大中心城市作为区域发展的核心引擎。","clips":[]},{"n":118,"kind":"单项选择题","answer":"C","stem":"安徽地跨中国南北气候分界线（ ），呈现暖温带向亚热带过渡的气候特征。","options":{"A":"秦岭","B":"长江","C":"淮河","D":"新安江"},"explanation":"安徽地跨中国南北气候分界线淮河，呈现暖温带向亚热带过渡的气候特征；长江、\n\n淮河横贯东西，将全省分为淮北平原、江淮丘陵、皖南山区三大自然区域。","clips":[]},{"n":119,"kind":"单项选择题","answer":"C","stem":"鲁菜是中国四大菜系之一，发源于山东，其三大系列是（ ）。","options":{"A":"济南菜、博山菜、孔府菜","B":"孔府菜、胶东菜、运河菜","C":"济南菜、孔府菜、胶东菜","D":"济南菜、胶东菜、微山湖菜"},"explanation":"鲁菜是济南菜、孔府菜、胶东菜三大系列，充分体现了孔子“食不厌精，脍不厌细”\n\n的思想。","clips":[]},{"n":120,"kind":"单项选择题","answer":"B","stem":"“广州”之名始于（ ）。","options":{"A":"秦朝置南海郡","B":"吴景帝永安七年（264 年）另设广州，州治番禺","C":"唐贞观年间","D":"明初改制为省"},"explanation":"吴景帝永安七年（264 年），东吴把南海、苍梧、郁林、高梁 4 个郡从交州划出，另\n\n设广州，州治番禺，广州由此得名。","clips":[]},{"n":121,"kind":"单项选择题","answer":"C","stem":"广昌孟戏被誉为（ ）。","options":{"A":"“中国戏剧的活化石”","B":"“百戏之祖”","C":"“中国古代戏曲声腔的活化石”","D":"“东方戏曲明珠”"},"explanation":"江西有“戏曲之邦”“戏曲重要发源地”之誉，广昌孟戏是中国古代戏曲声腔的“活\n\n化石”。A 项“中国戏剧的活化石”指土家族傩戏（湖南、湖北），易误选。","clips":[]},{"n":122,"kind":"单项选择题","answer":"A","stem":"地处晋冀豫三省交界、被誉为“人工天河”的是（ ）。","options":{"A":"红旗渠","B":"都江堰","C":"坎儿井","D":"灵渠"},"explanation":"红旗渠位于河南安阳林州市，是国家 5A 级旅游景区、全国重点文物保护单位，被誉\n\n为“人工天河”。B 项在四川，C 项在新疆，D 项在广西，易误选。","clips":[]},{"n":123,"kind":"单项选择题","answer":"D","stem":"湖北省建省之始是（ ）。","options":{"A":"隋开皇九年（589 年）","B":"明洪武年间","C":"民国初年","D":"清康熙三年（1664 年）湖广分治"},"explanation":"清康熙三年（1664 年）湖广分治，大体以洞庭湖为界，南为湖南布政使司，北为湖\n\n北布政使司，此为湖北省建省之始。","clips":[]},{"n":124,"kind":"单项选择题","answer":"C","stem":"被联合国教科文组织评为世界 25 首优秀民歌之一的土家族民歌是（ ）。","options":{"A":"《黄四姐》","B":"《茉莉花》","C":"《龙船调》","D":"《康定情歌》"},"explanation":"《龙船调》源自湖北利川市，被联合国教科文组织评为世界 25 首优秀民歌之一；2014\n\n年以《龙船调》为代表的土家族民歌（利川灯歌）被列入第四批国家级非物质文化遗产代表\n\n性项目名录。","clips":[]},{"n":125,"kind":"单项选择题","answer":"A","stem":"南水北调中线工程的水源地是（ ）。","options":{"A":"丹江口水库","B":"小浪底水库","C":"葛洲坝","D":"鄱阳湖"},"explanation":"南水北调中线工程以汉江中上游的丹江口水库为水源地，给河南、河北、北京、天\n\n津四省市提供大量生活和生产用水。B 项小浪底水库在黄河干流（河南），易误选。","clips":[]},{"n":126,"kind":"单项选择题","answer":"D","stem":"江南三大名楼之一、位于湖南的名楼是（）。","options":{"A":"黄鹤楼","B":"滕王阁","C":"鹳雀楼","D":"岳阳楼"},"explanation":"岳阳楼是江南三大名楼之一，岳阳以“洞庭天下水、岳阳天下楼”著称于世。A 项\n\n黄鹤楼在湖北武汉，B 项滕王阁在江西南昌，均易误选。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":127,"kind":"单项选择题","answer":"A","stem":"湘菜的代表派系是（ ）。","options":{"A":"组庵湘菜","B":"官府湘菜","C":"民间土菜","D":"寺院素菜"},"explanation":"湘菜的主题是下饭，代表派系为组庵湘菜，如组庵豆腐、组庵鱼翅等；民间湘菜代\n\n表菜品有剁椒鱼头、辣椒炒肉、湘西外婆菜、吉首酸肉等。","clips":[]},{"n":128,"kind":"单项选择题","answer":"B","stem":"福建（ ）已成为中国乃至世界重要的鞋业生产基地。","options":{"A":"厦门","B":"晋江","C":"莆田","D":"漳州"},"explanation":"晋江已成为中国乃至世界的重要鞋业生产基地。","clips":[]},{"n":129,"kind":"单项选择题","answer":"A","stem":"中国近代“船政文化”的发祥地是福建（ ）。","options":{"A":"福州马尾","B":"厦门","C":"泉州","D":"漳州"},"explanation":"福州马尾是船政文化的发祥地。民族英雄林则徐是福建人，“船政之父”沈葆桢也与\n\n此密切相关。","clips":[]},{"n":130,"kind":"单项选择题","answer":"D","stem":"全球拥有世界遗产最多的城市是（ ）。","options":{"A":"洛阳","B":"西安","C":"苏州","D":"北京"},"explanation":"北京有世界遗产 8 项：长城（北京段）、故宫、周口店“北京人”遗址、颐和园、天\n\n坛、明十三陵、京杭大运河（北京段）、北京中轴线，是全球拥有世界遗产最多的城市。\n\n[答题技巧] 遗产最多的城市：北京；双遗最多的国家：中国+澳大利亚（4 项，澳大利亚四\n\n个字）。\n\n三、多选题（请将正确答案的字母填在括号内）","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABCD","stem":"定制旅游产品的特点有（ ）。","options":{"A":"专属性强、个性化突出","B":"强调更多的情感代入和深入体验","C":"具有更多的交互性","D":"对创意和供应链的要求高","E":"完全标准化、无差别"},"explanation":"定制旅游产品专属性强、个性化突出，强调更多的情感代入和深入体验，具有更多\n\n的交互性，拓展性强，对创意和供应链的要求高。定制旅游产品专属性强、个性化突出，拓\n\n展性强。","clips":[]},{"n":132,"kind":"多项选择题","answer":"BCDE","stem":"下列关于明清科举考试及录取称谓的表述，正确的有（ ）。","options":{"A":"会试考中者称为“进士”","B":"乡试考取者称为“举人”","C":"会试考中者称为“贡士”","D":"殿试一甲前三名分别称为“状元”“榜眼”“探花”","E":"乡试第一名称为“解元”"},"explanation":"乡试考取者称为“举人”；会试考中者称为“贡士”；殿试一甲取前三名，分别称为\n\n“状元”“榜眼”“探花”；乡试第一名称为“解元”。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ACD","stem":"下列关于宫殿前日晷和嘉量的表述，正确的有（ ）。","options":{"A":"日晷是皇权的象征","B":"日晷是军权的象征","C":"日晷一般与嘉量并列于左右","D":"日晷与嘉量象征天地一统、江山永固"},"explanation":"日晷常设于宫殿前，是皇权的象征，一般与嘉量并列于左右，象征天地一统、江山\n\n永固。嘉量是中国古代的标准量器，含有统一度量衡的意义，象征着国家的统一和强盛。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ABCD","stem":"下列作品中，属于“中国四大古典戏曲”的有（ ）。","options":{"A":"《西厢记》","B":"《牡丹亭》","C":"《桃花扇》","D":"《长生殿》","E":"《窦娥冤》"},"explanation":"“中国四大古典戏曲”为元代王实甫《西厢记》、明代汤显祖《牡丹亭》、清代孔尚\n\n任《桃花扇》、清代洪昇《长生殿》。《窦娥冤》是关汉卿的元杂剧代表作，不属于“四大古\n\n典戏曲”。","clips":[]},{"n":135,"kind":"多项选择题","answer":"ABCD","stem":"下列农学著作中，属于中国古代“四大农书”的有（ ）。","options":{"A":"《汜胜之书》","B":"《齐民要术》","C":"《农书》","D":"《农政全书》","E":"《农桑辑要》"},"explanation":"中国古代“四大农书”为《汜胜之书》《齐民要术》《农书》《农政全书》。《农桑辑要》\n\n不属于“四大农书”。","clips":[]},{"n":136,"kind":"多项选择题","answer":"ABCDE","stem":"中国瓷器的主要产地有（ ）。","options":{"A":"江西景德镇","B":"湖南醴陵","C":"浙江龙泉","D":"山东淄博","E":"河北唐山"},"explanation":"江西景德镇被称为“瓷都”。湖南醴陵、福建德化、浙江龙泉、山东淄博和河北唐山\n\n也是中国瓷器的主要产地。福建德化、浙江龙泉也是中国瓷器的主要产地。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ABCD","stem":"地表喀斯特景观有（ ）。","options":{"A":"峰林、峰丛","B":"石林","C":"天坑、天生桥","D":"地表钙华堆积","E":"石钟乳、石笋"},"explanation":"石钟乳、石笋、石柱、石花属于地下喀斯特景观。地下喀斯特景观溶洞遍布，洞内\n\n常有地下湖或地下暗河。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABCD","stem":"重阳节的习俗主要有（ ）。","options":{"A":"登高","B":"插茱萸","C":"饮菊花酒","D":"吃重阳糕","E":"赛龙舟"},"explanation":"赛龙舟是端午节习俗。重阳节的习俗主要有登高、插茱萸、饮菊花酒等，应景食品\n\n是重阳糕。1989 年，我国把重阳节定为老年节。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABCD","stem":"全真道与正一道的区别有（ ）。","options":{"A":"全真道主张三教合一，正一道以行符篆为主要特征","B":"全真道士必须出家住宫观，正一道道士可以有家室","C":"全真道重内丹修炼，正一道以画符念咒、驱鬼降妖为特征","D":"全真道奉《道德经》《般若波罗蜜多心经》《孝经》，正一道奉《正一经》","E":"两派都没有清规戒律"},"explanation":"全真道以《道德经》《般若波罗蜜多心经》《孝经》为主要经典，主张道、佛、儒三\n\n教合一，重内丹修炼，道士必须出家住宫观，不得蓄妻室；正一道集符篆派之大成，以行符\n\n篆为主要特征，奉《正一经》，道士可以有家室。全真道制定了严格的清规戒律，E 项错误。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ABCD","stem":"下列关于《诗经》的表述，正确的有（ ）。","options":{"A":"是我国第一部诗歌总集","B":"产生于春秋时期","C":"按音乐的特点分为风、雅、颂三部分","D":"表现手法归纳为赋、比、兴","E":"雅分为大雅、小雅、颂三部分"},"explanation":"《诗经》是我国第一部诗歌总集，产生于春秋时期，按音乐的特点分为风、雅、颂\n\n三部分，表现手法归纳为赋、比、兴；其中风又称“十五国风”，雅分为大雅、小雅两部分，\n\n颂分为周颂、鲁颂、商颂三部分。E 项表述错误。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ABCD","stem":"下列关于三湾改编的表述，正确的有（ ）。","options":{"A":"1927 年 9 月 29 日在江西永新县三湾村进行","B":"建立党的各级组织和党代表制度","C":"党的支部建在连上","D":"成立各级士兵委员会，实行民主制度","E":"事实上确立了毛泽东在党中央的领导地位"},"explanation":"三湾改编建立党的各级组织和党代表制度，党的支部建在连上，班、排有小组，连\n\n以上设党代表，营、团设党委；成立各级士兵委员会，实行民主制度，在政治上官兵平等。\n\n三湾改编从组织上确立了党对军队的领导。E 项是遵义会议的历史意义。三湾改编从组织上\n\n确立了党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABC","stem":"现存著名楼阁式塔有（ ）。","options":{"A":"西安大雁塔","B":"应县木塔","C":"泉州开元寺双塔","D":"河南嵩岳寺塔","E":"崇圣寺三塔"},"explanation":"楼阁式塔现存著名古塔有西安大雁塔、应县木塔、泉州开元寺双塔；嵩岳寺塔、崇\n\n圣寺三塔为密檐式塔。楼阁式塔为数众多、历史最久，形式也最为壮观。西安大雁塔、应县\n\n木塔、泉州开元寺双塔均为楼阁式塔。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABCDE","stem":"下列词作名篇与作者的对应关系，正确的有（ ）。","options":{"A":"柳永《望海潮》","B":"苏轼《念奴娇·赤壁怀古》","C":"李清照《如梦令·昨夜雨疏风骤》","D":"辛弃疾《永遇乐·京口北固亭怀古》","E":"王安石《桂枝香·金陵怀古》"},"explanation":"以上对应均正确；宋词流派有以柳永、李清照为代表的婉约派，以苏轼、辛弃疾为\n\n代表的豪放派。传说岳飞创作的《满江红》也是宋词名篇。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABDE","stem":"“初唐四杰”包括（ ）。","options":{"A":"王勃","B":"杨炯","C":"陈子昂","D":"卢照邻","E":"骆宾王"},"explanation":"初唐时期代表诗人有“初唐四杰”（王勃、杨炯、卢照邻、骆宾王）和陈子昂。","clips":[]},{"n":145,"kind":"多项选择题","answer":"BCDE","stem":"下列被后世奉为“五经”的古代文献有（ ）。","options":{"A":"《论语》","B":"《诗》","C":"《书》","D":"《礼》","E":"《易》"},"explanation":"经孔子整理的古代文献《诗》《书》《礼》《易》和他撰写的鲁国编年体史书《春秋》\n\n被后世奉为经典，称“五经”。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ACDE","stem":"中国风筝的“四艺”包括（ ）。","options":{"A":"扎","B":"刻","C":"糊","D":"绘","E":"放"},"explanation":"中国风筝的技艺概括起来只有四个字：扎、糊、绘、放，简称“四艺”，即扎架子、\n\n糊纸面、绘花彩、放风筝。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ABCE","stem":"下列关于帝王祭祀时间的表述，正确的有（ ）。","options":{"A":"冬至日祭天","B":"夏至日祭地","C":"春分日祭日","D":"夏至日祭天","E":"秋分日祭月"},"explanation":"祭天在南郊的天坛，时间在冬至日；祭地在北郊的地坛，时间在夏至日；祭日于东\n\n郊的日坛，时间在春分日；祭月于西郊的月坛，时间在秋分日。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABD","stem":"下列关于四川民族聚居区的说法，正确的有（ ）。","options":{"A":"四川是全国最大的彝族聚居区","B":"四川是全国第二大藏族聚居区","C":"四川是全国最大的藏族聚居区","D":"四川是全国唯一的羌族聚居区"},"explanation":"四川是全国最大的彝族聚居区、全国第二大藏族聚居区、全国唯一的羌族聚居区。\n\n彝族是四川省人数最多的少数民族，祭司称为“毕摩”，火把节是其最盛大的节日。点评：\n\n“最大”“唯一”系列是地导常考内容。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABE","stem":"“桂林三宝”是指（ ）。","options":{"A":"三花酒","B":"桂林豆腐乳","C":"桂林米粉","D":"桂花糕","E":"桂林辣椒酱"},"explanation":"桂林三宝是指三花酒、桂林豆腐乳、桂林辣椒酱。D 项桂花糕为干扰项。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABCD","stem":"河西走廊已成为游人凭吊历史的旅游名胜，其古长城遗存包括（ ）等。","options":{"A":"“天下第一雄关”","B":"阳关","C":"玉门关","D":"“长城第一墩”","E":"镇北台"},"explanation":"甘肃是我国长城文化资源大省，境内现存长城主要为战国秦、汉、明三代遗迹，三\n\n代长城的西端起点主要在甘肃境内。全省长城总长度为 3654 千米，居全国第二。在河西走\n\n廊，“天下第一雄关”嘉峪关、“长城第一墩”、阳关、玉门关、汉长城等古长城遗存，都已\n\n成为游人凭吊历史的旅游名胜。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ABE","stem":"合称“盛京三陵”的陵墓有（ ）。","options":{"A":"清永陵","B":"清福陵","C":"清景陵","D":"清孝陵","E":"清昭陵"},"explanation":"清永陵、清福陵、清昭陵合称盛京三陵。清孝陵在河北清东陵（顺治帝陵），易误选。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ACD","stem":"广东戏曲中，流行最广、影响最深、观众最多的三种是（ ）。","options":{"A":"粤剧","B":"黄梅戏","C":"广东汉剧","D":"潮剧","E":"粤北采茶戏"},"explanation":"广东戏曲以粤剧、潮剧、广东汉剧三种流行最广、影响最深、观众最多。B 项黄梅\n\n戏是安徽剧种，易误选。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ACE","stem":"吉林省是著名的“东北三宝”主产区，“东北三宝”包括（）。","options":{"A":"人参","B":"灵芝","C":"鹿茸角","D":"狍子","E":"貂皮"},"explanation":"吉林省是著名的“东北三宝”——人参、貂皮、鹿茸角（一说乌拉草）的主产区。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":154,"kind":"多项选择题","answer":"ABCE","stem":"下列关于《格萨尔》史诗的说法，正确的有（ ）。","options":{"A":"是世界上最长的史诗","B":"是世界上唯一一部至今还在不断创作的“活着的史诗”","C":"有六七十部、150 多万行","D":"是蒙古族的英雄史诗","E":"青海果洛藏族自治州是其主要发祥地"},"explanation":"《格萨尔王传》有六七十部、150 多万行，是世界上最长的史诗，也是世界上唯一\n\n一部至今还在不断创作的“活着的史诗”；青海果洛藏族自治州是其主要发祥地。D 项错误，\n\n《格萨尔》是藏族的英雄史诗。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABD","stem":"下列关于黎族的说法，正确的有（ ）。","options":{"A":"擅长制作独木器，器具原料都必须是一块整木","B":"以黎锦、黎单闻名于世","C":"男子曾有文面文身的习俗","D":"妇女曾有文面文身的习俗，称为“雕题”","E":"传统民居多为竹木结构的“船形屋”"},"explanation":"黎族擅长制作独木器，所使用的任何器具，原料都必须是一块整木。黎族手工纺织\n\n技术历史悠久，早在唐宋时代就领先于中原，并以黎锦、黎单闻名于世。黎族妇女曾有文面\n\n文身的习俗，称为“雕题”。C 项错误，文面文身是黎族妇女曾有的习俗，并非男子。黎族\n\n传统民居多为竹木结构的楼房或草房。有的住宅为“船形屋”，用竹木扎构成轮廓，状如船\n\n篷，盖以茅草，呈半圆筒形。E 项错误，教材表述为“有的住宅”为“船形屋”，并非传统\n\n民居“多为”船形屋。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ACE","stem":"下列关于新疆的说法，正确的有（ ）。","options":{"A":"陆地面积最大","B":"海岸线最长","C":"毗邻国家最多","D":"人口最多","E":"陆地边境线最长"},"explanation":"新疆是我国陆地面积最大、陆地边境线最长、毗邻国家最多的省区。新疆陆地边境\n\n线长 5700 多千米，约占全国陆地边境线的 1/4，与蒙古、俄罗斯、哈萨克斯坦、吉尔吉斯\n\n斯坦、塔吉克斯坦、阿富汗、巴基斯坦、印度 8 个国家接壤。","clips":[]},{"n":157,"kind":"多项选择题","answer":"BCDE","stem":"西藏的特产有（ ）等。","options":{"A":"昆仑玉","B":"藏茶、西藏木碗","C":"麝香、藏香、唐卡","D":"藏刀、手工地毯","E":"冬虫夏草、藏红花"},"explanation":"西藏的特产有冬虫夏草、藏红花、藏茶、西藏木碗、麝香、藏香、藏饰品、唐卡、\n\n藏刀、手工地毯等。A 项昆仑玉不在西藏特产之内，故不选。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ACDE","stem":"台湾省的支柱产业有（ ）等。","options":{"A":"半导体行业","B":"纺织业","C":"电子制造业","D":"石化产业","E":"精密机械"},"explanation":"台湾省制造业与高新技术产业发达，在半导体、IT、通信、精密电子制造等领域领\n\n先全球。台湾省目前支柱产业有半导体行业、电子制造业、精密机械、工控设备、石化产业\n\n等。B 项纺织业不在支柱产业之内。","clips":[]},{"n":159,"kind":"多项选择题","answer":"BCDE","stem":"下列关于山西汾酒的说法，正确的有（ ）。","options":{"A":"唐代诗人李白“牧童遥指杏花村”让其声名大噪","B":"又称“杏花村酒”","C":"是中国清香型白酒的典型代表","D":"1915 年参加巴拿马万国博览会获得白酒甲等大奖","E":"产于汾阳市杏花村"},"explanation":"汾酒产于汾阳市杏花村，又称“杏花村酒”，是中国清香型白酒的典型代表，有着\n\n4000 多年的历史；1915 年参加巴拿马万国博览会，曾获得白酒甲等大奖。A 项错误，“借问\n\n酒家何处有，牧童遥指杏花村”是唐代诗人杜牧的诗句。","clips":[]},{"n":160,"kind":"多项选择题","answer":"BCD","stem":"澳门的美称有（ ）。","options":{"A":"“东方之珠”","B":"“创意之都”","C":"“东方蒙特卡洛”","D":"“盛事之都”","E":"“东方夏威夷”"},"explanation":"澳门拥有“盛事之都”“创意之都”等美称，还是世界四大赌城之一，有“东方蒙特\n\n卡洛”之称。A 项“东方之珠”是香港的美誉，易误选。","clips":[]},{"n":161,"kind":"多项选择题","answer":"BCE","stem":"陕西省代表性旅游演艺剧目有（ ）等。","options":{"A":"《驼铃传奇》","B":"《延安保育院》","C":"《再回延安》《延安保卫战》","D":"《宋城千古情》","E":"《长恨歌》《西安千古情》"},"explanation":"陕西省代表性剧目有西安市《长恨歌》《西安千古情》，延安市《延安保育院》《再回\n\n延安》《延安保卫战》等。D 项《宋城千古情》在浙江杭州，易误选。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ADE","stem":"下列关于齐鲁文化的说法，正确的有（ ）。","options":{"A":"齐鲁文化是“齐文化”和“鲁文化”的合称","B":"齐文化重伦理，鲁文化尚功利","C":"鲁文化尚功利，齐文化重伦理","D":"齐文化尚功利，鲁文化重伦理","E":"齐文化讲求革新，鲁文化尊重传统"},"explanation":"齐鲁文化是“齐文化”和“鲁文化”的合称：齐文化尚功利、讲求革新，鲁文化重\n\n伦理、尊重传统。B 项把两者特点说反了，为典型干扰项。","clips":[]},{"n":163,"kind":"多项选择题","answer":"BDE","stem":"安徽入选联合国教科文组织非物质文化遗产代表作名录的项目有（ ）。","options":{"A":"徽墨制作技艺","B":"中国珠算","C":"歙砚制作技艺","D":"宣纸制作技艺","E":"徽州木结构营造技艺"},"explanation":"安徽入选的 3 项为“宣纸制作技艺”“中国珠算”以及作为“中国传统木结构建筑营\n\n造技艺”代表之一的“徽州木结构营造技艺”。A 项徽墨制作技艺是国家级非遗，不属于这 3\n\n项，易误选。","clips":[]},{"n":164,"kind":"多项选择题","answer":"CDE","stem":"下列属于贵州世界遗产的有（ ）。","options":{"A":"三江并流","B":"左江花山岩画","C":"赤水丹霞","D":"梵净山","E":"荔波喀斯特"},"explanation":"贵州自然遗产 3 项：中国南方喀斯特（第一期荔波喀斯特、第二期施秉白云岩）、中\n\n国丹霞（赤水丹霞）、梵净山。三江并流为云南的世界自然遗产、左江花山岩画为广西的世\n\n界遗产。","clips":[]},{"n":165,"kind":"多项选择题","answer":"BDE","stem":"粤剧被列入联合国教科文组织人类非物质文化遗产代表作名录，由（ ）联合申报。","options":{"A":"海南","B":"香港","C":"台湾","D":"广东","E":"澳门"},"explanation":"2009 年 10 月 2 日，由广东、香港和澳门联合申报，粤剧被列为联合国教科文组织\n\n人类非物质文化遗产代表作名录。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper4-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retrySequence=[], retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    if(Array.isArray(state.retrySequence))retrySequence=[...new Set(state.retrySequence)].filter(n=>questions.some(q=>q.n===n));
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,retrySequence,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  const list=wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
  const rank=new Map(retrySequence.map((n,i)=>[n,i]));
  return list.sort((a,b)=>(rank.get(a.n)??Infinity)-(rank.get(b.n)??Infinity));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
    retrySequence=[];
  }
  if(!list.length)return;
  if(!retrySequence.length){
    for(let i=list.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [list[i],list[j]]=[list[j],list[i]];
    }
    retrySequence=list.map(q=>q.n);
  }
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  retrySequence=[];
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
