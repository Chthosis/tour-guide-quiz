<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"对","stem":"《授时历》是中国古代使用时间最长､精确度最高的历法。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。传说中国最早的历法是《黄帝历》。至元代郭守敬又制定《授时历》。\n\n《授时历》是中国古代使用时间最长、精确度最高的历法。","clips":[]},{"n":2,"kind":"判断题","answer":"对","stem":"正一道道士可以有家室,可不出家､不住宫观。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。正一道集符箓派之大成，以行符箓为主要特征，清规戒律不如全真道\n\n严格。正一道以行符箓为主要特征（画符念咒、驱鬼降妖、祈福禳灾），奉持的主要经典为\n\n《正一经》。","clips":[]},{"n":3,"kind":"判断题","answer":"对","stem":"文化是旅游的灵魂,旅游则是文化的重要载体。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。文化和旅游密不可分，二者相辅相成。文化是旅游的灵魂，旅游则是\n\n文化的重要载体。党的十九届五中全会确定了到 2035 年建成文化强国的远景目标，为文化\n\n和旅游发展擘画了蓝图。","clips":[]},{"n":4,"kind":"判断题","answer":"对","stem":"商周青铜器上常有铭文,这些铭文又称金文或钟鼎文;商器字数少,周器字数多。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。商周青铜器上常有铭文（又称金文或钟鼎文），商器字数少，周器字\n\n数多，其中西周毛公鼎竟达 497 个字（也有人释读成 499 字）。","clips":[]},{"n":5,"kind":"判断题","answer":"对","stem":"太平道和五斗米道均为早期道教。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。领导东汉黄巾起义的张角传授的为太平道；张陵在蜀中鹤鸣山传播五\n\n斗米道。张陵在蜀中鹤鸣山传播五斗米道，因信徒入教必须交五斗米而得名。","clips":[]},{"n":6,"kind":"判断题","answer":"对","stem":"2014 年,习近平总书记提出建设“四好农村路”,即把农村公路建好､管好､护好､运营好。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2014 年，习近平总书记提出“要进一步把农村公路建好、管好、护\n\n好、运营好”，全国农村掀起了建设“四好农村路”的新高潮，制约农村发展的交通瓶颈进\n\n一步被打破。","clips":[]},{"n":7,"kind":"判断题","answer":"对","stem":"古代纪年中,每 60 年为一个轮回,称为一个“甲子”或“花甲”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。十天干与十二地支相配，得到 60 个干支组合，计年时每 60 年一个轮\n\n回，称为一个“甲子”或“花甲”。十天干与十二地支相配，得到 60 个干支组合，最早用于\n\n计日，后来用于计年。","clips":[]},{"n":8,"kind":"判断题","answer":"错","stem":"被誉为“天下第一行书”的《兰亭集序》,其作者是颜真卿。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。《兰亭集序》的作者是东晋王羲之（不是颜真卿），王羲之被尊为“书\n\n圣”；颜真卿是“楷书四大家”之一，其著名行书作品是《祭侄文稿》。","clips":[]},{"n":9,"kind":"判断题","answer":"对","stem":"党的十九大将铸牢中华民族共同体意识写入党章。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。2017 年，党的十九大正式提出“铸牢中华民族共同体意识”，强调加\n\n强各民族对中华文化的认同，推动共同繁荣发展，并将其写入党章。","clips":[]},{"n":10,"kind":"判断题","answer":"对","stem":"新中国成立后建成的第一条铁路是成渝铁路。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。新中国成立后建成的第一条铁路是成渝铁路，全长 505 千米，连通成\n\n都和重庆，1950 年开始建设，1952 年 7 月 1 日建成通车，填补了西南地区铁路建设的空白。","clips":[]},{"n":11,"kind":"判断题","answer":"对","stem":"明朝宋应星著有《天工开物》,该书被外国学者称为“中国 17 世纪的工艺百科全书”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《天工开物》是世界上第一部关于农业和手工业生产的综合性科技著\n\n作。《天工开物》有明代末年资本主义萌芽的相关记载，是世界上第一部关于农业和手工业\n\n生产的综合性科技著作。","clips":[]},{"n":12,"kind":"判断题","answer":"错","stem":"研学旅行是家庭教育的一部分,其最核心的属性是娱乐性。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。研学旅行是学校教育（不是家庭教育）的一部分，由教育部门和学校\n\n有计划地组织安排，学生是研学旅游的主体，研学旅行最重要的性质是教育性。","clips":[]},{"n":13,"kind":"判断题","answer":"错","stem":"乡村旅游发生在乡村地区,并以新奇性作为旅游吸引物。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。乡村旅游是以乡村性（不是新奇性）作为旅游吸引物；其概念包含两\n\n个方面：一是发生在乡村地区，二是以乡村性作为旅游吸引物，二者缺一不可。","clips":[]},{"n":14,"kind":"判断题","answer":"错","stem":"我国人口数量最多的少数民族是回族。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。我国少数民族中人口数量最多的是壮族（不是回族）；我国汉族是人\n\n数最多的民族。","clips":[]},{"n":15,"kind":"判断题","answer":"错","stem":"纽约是美国首都,也是联合国总部所在地。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。美国的首都是华盛顿（不是纽约），华盛顿被美国人称为“国家的心\n\n脏”；纽约是美国第一大城市，也是联合国总部所在地。","clips":[]},{"n":16,"kind":"判断题","answer":"错","stem":"赵州桥由鲁班设计建造。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。赵州桥（安济桥）是由著名工匠李春（不是鲁班）设计建造的，建于\n\n隋代，是世界上现存最大的敞肩桥。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"北京颐和园内的谐趣园仿杭州西湖而建。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。谐趣园是仿无锡惠山寄畅园（不是杭州西湖）而建；同样仿寄畅园而\n\n建的还有圆明园内的廓然大公（后来也称双鹤斋）。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"清明节的前一天是中元节。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。清明节的前一天为寒食节（不是中元节），寒食节又称冷节、禁烟节，\n\n据说是为纪念介子推。","clips":[]},{"n":19,"kind":"判断题","answer":"对","stem":"战国时期,韩､赵､魏由春秋时期的晋国分裂而来,史称“三家分晋”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。战国时期，出现韩、赵、魏、楚、燕、齐、秦等强国的对峙，其中韩、\n\n赵、魏由春秋时期的晋国分裂而来，史称“三家分晋”。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"宋代五大名窑为汝窑､官窑､哥窑､钧窑､定窑。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。宋代五大名窑为汝窑、官窑、哥窑、钧窑、定窑。","clips":[]},{"n":21,"kind":"判断题","answer":"错","stem":"北京胡同大部分形成于明､清两代。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“明、清”应改为“元、明、清”。北京胡同星罗棋布，共有 7000 余\n\n条，大部分形成于元、明、清三个朝代，民间有“有名的胡同三千六，没名的胡同赛牛毛”\n\n之说。","clips":[]},{"n":22,"kind":"判断题","answer":"错","stem":"土家族妇女的“盛装”银饰堪称中华民族服装之最,黔东南被称为“苗族服饰博物馆”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“土家族”应改为“苗族”。苗族服饰式样繁多、色彩艳丽。苗族妇女\n\n的“盛装”银饰堪称中华民族服装之最，以大为美、以重为美、以多为美。黔东南是我国和\n\n世界上苗族服饰种类最多、保存最好的区域，被称为“苗族服饰博物馆”。","clips":[]},{"n":23,"kind":"判断题","answer":"错","stem":"广西是全国唯一没有平原支撑的省份,素有“八山一水一分田”之说。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“广西”应改为“贵州”。贵州省 92.5%的面积为山地和丘陵，是全国\n\n唯一一个没有平原支撑的省份。点评：“全国唯一”是地导重要常考内容。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"日月潭是我国台湾省第一大天然湖泊,有“海外别洞天”之称。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。日月潭位于南投县，是台湾省最大的淡水湖，也是中国台湾省第一大\n\n天然湖泊，有“海外别洞天”之称。","clips":[]},{"n":25,"kind":"判断题","answer":"对","stem":"四川简称川或蜀,省会成都市,最高峰贡嘎山有“蜀山之王”的美誉。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。四川简称川或蜀，省会成都市；最高峰贡嘎山，海拔 7508.9 米，有\n\n“蜀山之王”美誉。","clips":[]},{"n":26,"kind":"判断题","answer":"对","stem":"西藏是世界上海拔最高的地区,素有“世界屋脊”之称。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。西藏是世界上海拔最高的地区，素有“世界屋脊”之称。境内超过\n\n8000 米的高峰有 5 座，其中世界第一高峰珠穆朗玛峰就耸立在中尼边界上。","clips":[]},{"n":27,"kind":"判断题","answer":"错","stem":"维多利亚港是世界第一大海港。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，错在“世界第一”。维多利亚港是亚洲第一、世界第三大海港；香港\n\n货运机场则已第 14 次被评为世界上最繁忙的货运机场。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"重庆是中国西部地区唯一的直辖市,山中有城,城中有山,故有“山城”之称。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。重庆简称“渝”，位于祖国内陆西南部，长江和嘉陵江汇合处。重庆\n\n是中国西部地区唯一的直辖市，山中有城，城中有山，故有“山城”之称。","clips":[]},{"n":29,"kind":"判断题","answer":"对","stem":"桂林､阳朔一带的石灰岩峰林,曾被明代旅行家徐霞客誉为“碧莲玉笋世界”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。广西桂林山水绝佳，桂林、阳朔一带的石灰岩峰林曾被徐霞客誉为“碧\n\n莲玉笋世界”；广西洞穴众多，素有“无山不洞，无洞不奇”之称。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"长沙别称“星城”,源于轸宿附星“长沙星”,因此又有“星沙”之称。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。长沙简称“长”，别称“星城”——相传得名于二十八宿中轸宿附星\n\n“长沙星”，因此又有“星沙”之称。","clips":[]},{"n":31,"kind":"判断题","answer":"对","stem":"黎族是海南岛上最早的居民,海南是全国唯一的黎族聚居区。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。汉族、黎族、苗族、回族是海南省世居民族，黎族是海南岛上最早的\n\n居民。海南是全国唯一的黎族聚居区。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"宁夏是全国唯一全境属于黄河流域的省区,堪称中国生态微缩盆景。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。宁夏是全国唯一全境属于黄河流域的省区，拥有完整的山水林田湖草\n\n沙生态体系，堪称中国生态微缩盆景。","clips":[]},{"n":33,"kind":"判断题","answer":"错","stem":"福建陆地海岸线位居全国第一。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“第一”应改为“第二”。福建以侵蚀海岸为主，陆地海岸线长达 3752\n\n千米，位居全国第二，海岸线曲折率居全国第一位。","clips":[]},{"n":34,"kind":"判断题","answer":"对","stem":"国家速滑馆与“鸟巢”“冰立方”共同组成“双奥之城”的标志性建筑群。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。国家速滑馆与“鸟巢”“冰立方”共同组成双奥之城的标志性建筑群。\n\n国家体育场“鸟巢”是唯一举办“双奥”开幕式和闭幕式的场馆；“冰立方”即国家游泳中\n\n心，是“水立方”的冬奥化身。","clips":[]},{"n":35,"kind":"判断题","answer":"对","stem":"江苏省在“十四五”时期重点打造的“1650”产业体系,包括 16 个重点产业集群和 50条重点产业链。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。“1650”产业体系是江苏省在“十四五”时期重点打造的 16 个重点产\n\n业集群、50 条重点产业链；江苏已培育 14 个国家级和 2 个省级先进制造业集群，工程机械、\n\n高端纺织、光伏等产业位居全球前列，动力电池、海工装备、新能源汽车等在全国处于领先\n\n地位。","clips":[]},{"n":36,"kind":"判断题","answer":"错","stem":"截至目前,我国入选联合国教科文组织非物质文化遗产名录的项目已达 61 项,入选数量居世界首位。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“61 项”应改为“45 项”，“61 项”是我国的世界遗产总数。截至 2026\n\n年 6 月，我国共有 45 个项目列入联合国教科文组织非遗名录、名册，总数居世界第一，其\n\n中，列入代表作名录 40 项，列入急需保护名录项目 3 项，入选优秀保护实践名册 2 项。（数\n\n据更新，以此为准）。——口诀——非遗 45 世界一：代表 40，急 3，优 2。","clips":[]},{"n":37,"kind":"判断题","answer":"对","stem":"泉州具有南音､南戏､南建筑､南拳､南派工艺等独具特色的“五南”文化。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。泉州具有南音、南戏、南建筑、南拳、南派工艺等独具特色的“五南”\n\n文化。戏曲文化源远流长，有梨园戏、高甲戏等剧种，还有中国一绝“提线木偶”（其他教\n\n材补充）。","clips":[]},{"n":38,"kind":"判断题","answer":"对","stem":"张家界原名大庸市,因旅游建市。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。张家界市：·原名大庸市，明崇祯三年(1630 年)，张再弘被赐团官，\n\n且设衙署于此。于是，这一带成为张氏世袭领地，被叫成了“张家界”。·张家界因旅游建市。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"1292 年,元朝政府批准设立上海县,这是上海行政建制之始。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1292 年，元朝政府把上海镇从华亭县划出，批准设立上海县，这是\n\n上海行政建制之始。16 世纪中叶，明代的上海已成为全国棉纺织手工业中心。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"北京胡同星罗棋布,民间有“有名的胡同三千六,没名的胡同赛牛毛”之说。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。北京胡同共有 7000 余条，大部分形成于元、明、清三个朝代，民间\n\n有“有名的胡同三千六，没名的胡同赛牛毛”之说。","clips":[]},{"n":41,"kind":"单项选择题","answer":"C","stem":"我国最大的内陆河是( )。","options":{"A":"伊犁河","B":"黑河","C":"塔里木河","D":"额尔齐斯河"},"explanation":"塔里木盆地是中国面积最大的内陆盆地，盆地北缘的塔里木河是我国最大的内陆河；\n\n准噶尔盆地是中国第二大内陆盆地。","clips":[]},{"n":42,"kind":"单项选择题","answer":"C","stem":"佛教开始传入中国的时间是( )。","options":{"A":"魏晋南北朝","B":"隋唐时期","C":"西汉哀帝元寿元年","D":"东汉永平年间"},"explanation":"西汉哀帝元寿元年（公元前 2 年），大月氏王使臣伊存向中国博士弟子景卢口授《浮\n\n屠经》，佛教开始传入中国，史称“伊存授经”。","clips":[]},{"n":43,"kind":"单项选择题","answer":"C","stem":"全真道的主要创派人是( )。","options":{"A":"张道陵","B":"张角","C":"王重阳","D":"丘处机"},"explanation":"全真道主要创派人为王重阳，主张道、佛、儒三教合一；丘处机开创的龙门派势力最\n\n大，至今全真道仍以龙门派人数最多。","clips":[]},{"n":44,"kind":"单项选择题","answer":"B","stem":"俄罗斯的首都是( )。","options":{"A":"圣彼得堡","B":"莫斯科","C":"叶卡捷琳堡","D":"符拉迪沃斯托克"},"explanation":"莫斯科自 1147 年建城，迄今已有 870 多年历史，是世界上绿化覆盖率最高的城市之\n\n一；克里姆林宫和红场是俄罗斯的标志，圣彼得堡被称为俄罗斯的“北方首都”。","clips":[]},{"n":45,"kind":"单项选择题","answer":"D","stem":"中国第一大群岛,其所在城市也是中国第一个以群岛建制的地级市,该群岛是( )。","options":{"A":"南沙群岛","B":"长山群岛","C":"庙岛群岛","D":"舟山群岛"},"explanation":"舟山群岛是中国第一大群岛，渔业发达。舟山群岛渔业发达，是国务院批准的中国首\n\n个以海洋经济为主题的国家战略新区。舟山群岛渔业发达。","clips":[]},{"n":46,"kind":"单项选择题","answer":"A","stem":"都江堰是以( )为特征的大型水利工程。","options":{"A":"无坝引水","B":"拦河大坝","C":"船闸通航","D":"灌溉为主"},"explanation":"都江堰以无坝引水为特征，2000 年被联合国教科文组织列入《世界文化遗产名录》。\n\n2000 年，都江堰水利工程被联合国教科文组织列入《世界文化遗产名录》。","clips":[]},{"n":47,"kind":"单项选择题","answer":"A","stem":"从造型上看,大多为实心､一般不能登临的塔是( )。","options":{"A":"密檐式塔","B":"覆钵式塔","C":"金刚宝座塔","D":"楼阁式塔"},"explanation":"密檐式塔大都是实心的，一般不能登临，现存著名古塔有河南嵩岳寺塔、西安小雁塔、\n\n崇圣寺三塔。密檐式塔现存著名古塔还有西安小雁塔、崇圣寺三塔。嵩岳寺塔、西安小雁塔、\n\n崇圣寺三塔均为密檐式塔。","clips":[]},{"n":48,"kind":"单项选择题","answer":"C","stem":"《富春山居图》的作者是“元四家”中的( )。","options":{"A":"王蒙","B":"吴镇","C":"黄公望","D":"倪瓒"},"explanation":"元代画家有“元四家”：黄公望、倪瓒、王蒙、吴镇。其中黄公望的《富春山居图》\n\n是中国十大传世名画之一。元代画家有“元四家”：黄公望、倪瓒、王蒙、吴镇。","clips":[]},{"n":49,"kind":"单项选择题","answer":"A","stem":"宣纸分生熟两种,其中( )。","options":{"A":"生宣渍水渗化,作写意画最好","B":"熟宣渍水渗化,作写意画最好","C":"生宣经过胶矾浸染,宜于工笔","D":"两者渗化性相同"},"explanation":"宣纸分生熟两种：生宣渍水渗化，作写意画最好；熟宣经过胶矾浸染，不渗化，宜于\n\n工笔，细描细写，为书画最理想的用纸。","clips":[]},{"n":50,"kind":"单项选择题","answer":"A","stem":"明长城中保存最完好､最具代表性的一段是( )。","options":{"A":"八达岭长城","B":"老龙头长城","C":"嘉峪关长城","D":"山海关长城"},"explanation":"八达岭长城位于北京西北，是明长城中保存最完好、最具代表性的一段；老龙头长城\n\n是长城入海的端头部分，有“中华之魂”的盛誉。","clips":[]},{"n":51,"kind":"单项选择题","answer":"B","stem":"北朝民歌中,描写花木兰替父从军故事的名篇是( )。","options":{"A":"《敕勒歌》","B":"《木兰辞》","C":"《孔雀东南飞》","D":"《陌上桑》"},"explanation":"北朝民歌名篇有《敕勒歌》和《木兰辞》，《木兰辞》描写花木兰替父从军的故事，它\n\n与建安年间产生的《孔雀东南飞》，被誉为魏晋南北朝民间长篇叙事诗的双璧。","clips":[]},{"n":52,"kind":"单项选择题","answer":"A","stem":"我国最早的脉学著作《脉经》的作者是西晋时期的( )。","options":{"A":"王叔和","B":"宋慈","C":"葛洪","D":"皇甫谧"},"explanation":"西晋王叔和著《脉经》，是我国最早的脉学著作；西晋皇甫谧著《针灸甲乙经》，是我\n\n国第一部针灸学著作。皇甫谧著《针灸甲乙经》是我国第一部针灸学著作。","clips":[]},{"n":53,"kind":"单项选择题","answer":"A","stem":"中国穆斯林大多属于伊斯兰教的( )。","options":{"A":"逊尼派","B":"什叶派","C":"苏菲派","D":"哈瓦利吉派"},"explanation":"逊尼派是伊斯兰教中人数最多的一派，中国穆斯林大多属于逊尼派；中国新疆塔吉克\n\n族穆斯林属于什叶派；苏菲派是伊斯兰教内部的神秘主义派别。逊尼派是伊斯兰教中人数最\n\n多的一派。","clips":[]},{"n":54,"kind":"单项选择题","answer":"A","stem":"世界上首次实现时速 350 千米自动驾驶的高铁线路是( )。","options":{"A":"京张高铁","B":"广深港高铁","C":"京津城际铁路","D":"京沪高铁"},"explanation":"2019 年 12 月 30 日开通运营的京张高铁，使用我国自主研制的复兴号智能动车组，\n\n采用北斗卫星导航系统，在世界上首次实现了时速 350 千米的自动驾驶。京张高铁采用北斗\n\n卫星导航系统，使用我国自主研制的复兴号智能动车组。","clips":[]},{"n":55,"kind":"单项选择题","answer":"B","stem":"红茶出现于( ),采用全发酵法制成。","options":{"A":"明朝","B":"清朝","C":"唐朝","D":"宋朝"},"explanation":"红茶出现于清朝，用全发酵法制成，制作关键是渥红（发酵）以促进酶活性，使多酚\n\n类充分氧化，红茶多以产地命名，以安徽祁红、云南滇红尤为出众。","clips":[]},{"n":56,"kind":"单项选择题","answer":"B","stem":"河南登封( )的建成,标志着砖结构技术的巨大进步。","options":{"A":"妙应寺白塔","B":"嵩岳寺塔","C":"应县木塔","D":"大雁塔"},"explanation":"河南登封嵩岳寺塔的建造标志着砖结构技术的巨大进步，它是中国现存最早的砖塔。\n\n嵩岳寺塔是密檐式塔，也是河南登封的名塔。嵩岳寺塔是密檐式塔的典型代表。","clips":[]},{"n":57,"kind":"单项选择题","answer":"D","stem":"发现地磁偏角现象的北宋科学家是( )。","options":{"A":"郭守敬","B":"张衡","C":"一行","D":"沈括"},"explanation":"北宋时出现人工磁化制造的指南针，科学家沈括还发现了地磁偏角现象；其编撰的《梦\n\n溪笔谈》被李约瑟评价为“中国科学史上的里程碑”。沈括编撰《梦溪笔谈》，英国科学史家\n\n李约瑟评价此书为“中国科学史上的里程碑”。","clips":[]},{"n":58,"kind":"单项选择题","answer":"A","stem":"世界上最大的黄土堆积区是( )。","options":{"A":"黄土高原","B":"云贵高原","C":"青藏高原","D":"内蒙古高原"},"explanation":"黄土高原是世界上最大的黄土堆积区，也是世界上黄土覆盖面积最大的高原。黄土高\n\n原是世界上黄土覆盖面积最大的高原。黄土高原是中华民族古代文明的发祥地之一。","clips":[]},{"n":59,"kind":"单项选择题","answer":"D","stem":"位于准噶尔盆地西北边缘､人称“魔鬼城”的雅丹地貌是( )。","options":{"A":"敦煌鸣沙山","B":"宁夏沙坡头","C":"新疆罗布泊","D":"乌尔禾风城"},"explanation":"准噶尔盆地地层中的煤、石油及古生物化石堪称“史前地质博物馆”；盆地内雅丹地\n\n貌广泛分布，尤以盆地西北边缘的乌尔禾风城最具代表性，人称“魔鬼城”。","clips":[]},{"n":60,"kind":"单项选择题","answer":"C","stem":"江南私家园林中,叠山艺术的典型代表是( )的假山。","options":{"A":"苏州留园","B":"上海豫园","C":"苏州环秀山庄","D":"扬州个园"},"explanation":"苏州环秀山庄的假山是江南私家园林叠山的典型代表。苏州环秀山庄的假山是江南私\n\n家园林叠山的典型代表。","clips":[]},{"n":61,"kind":"单项选择题","answer":"A","stem":"《徐霞客游记》开篇之日被确定为( )。","options":{"A":"中国旅游日","B":"世界旅游日","C":"中国旅游节","D":"文化遗产日"},"explanation":"徐霞客名徐弘祖，号霞客，著《徐霞客游记》，游记开篇之日被确定为中国旅游日；\n\n《徐霞客游记》堪称中国旅游史及中国文化史上的一座里程碑。","clips":[]},{"n":62,"kind":"单项选择题","answer":"D","stem":"韩国第一大岛济州岛的象征是( )。","options":{"A":"智异山","B":"金刚山","C":"雪岳山","D":"汉拿山"},"explanation":"济州岛是个火山岛，也是韩国第一大岛，以“三多、三无、三丽”著称，汉拿山是济\n\n州岛的象征。济州岛是个火山岛，以“三多、三无、三丽”著称。","clips":[]},{"n":63,"kind":"单项选择题","answer":"C","stem":"春节俗称“新年”,其活动结束于( )。","options":{"A":"除夕","B":"正月初一","C":"正月十五元宵节","D":"二月二"},"explanation":"正月十五为每年第一个望月，称为上元节，也称元宵节，是春节活动的高潮和结束，\n\n故有“闹元宵”之说。元宵节之夜有放花灯、观花灯、猜灯谜等活动，热闹非凡，故有“闹\n\n元宵”之说。","clips":[]},{"n":64,"kind":"单项选择题","answer":"D","stem":"中国第一部纪传体通史是( )。","options":{"A":"《汉书》","B":"《资治通鉴》","C":"《春秋》","D":"《史记》"},"explanation":"司马迁创作《史记》，是中国第一部纪传体通史，被鲁迅誉为“史家之绝唱，无韵之\n\n离骚”。司马迁创作《史记》，被鲁迅誉为“史家之绝唱，无韵之离骚”。","clips":[]},{"n":65,"kind":"单项选择题","answer":"D","stem":"我国雨凇出现最多的山岳是( )。","options":{"A":"黄山","B":"衡山","C":"庐山","D":"峨眉山"},"explanation":"我国峨眉山雨凇最多，庐山雨凇誉称“玻璃世界”；我国雾凇出现最多的是吉林省吉\n\n林市。庐山雨凇誉称“玻璃世界”。我国雾凇出现最多的是吉林省吉林市。","clips":[]},{"n":66,"kind":"单项选择题","answer":"C","stem":"享有天下“神品”之称,且泡茶数天后不馊､仍能保持茶香的是( )。","options":{"A":"龙泉青瓷","B":"德化白瓷","C":"宜兴紫砂器","D":"景德镇青花瓷"},"explanation":"江苏宜兴被誉为中国“陶都”，其紫砂器享有天下“神品”之称。紫砂器是用质地细\n\n腻、含铁量高的特殊陶土制成的无釉细陶器，泡茶数天后不馊且仍能保持茶香。","clips":[]},{"n":67,"kind":"单项选择题","answer":"A","stem":"FAST(中国天眼)位于我国( )。","options":{"A":"贵州省平塘县","B":"云南省腾冲县","C":"四川省稻城县","D":"广西壮族自治区大新县"},"explanation":"我国在贵州省平塘县建成世界上最大、最灵敏的单口径巨型射电望远镜（FAST），主\n\n要用于探索宇宙的起源和演化，其口径达 500 米。","clips":[]},{"n":68,"kind":"单项选择题","answer":"D","stem":"我国人口分布的特点是( )。","options":{"A":"南少北多","B":"分布均匀","C":"东南疏､西北密","D":"东南密､西北疏"},"explanation":"中国人口的分布呈现东南密、西北疏的特点，形成了大杂居、小聚居、交错居住的格\n\n局。在少数民族聚居区一般都有一定数量的汉族居民。中国人口分布呈现东南密、西北疏的\n\n特点。","clips":[]},{"n":69,"kind":"单项选择题","answer":"B","stem":"产生于春秋时期的我国第一部诗歌总集是( )。","options":{"A":"《楚辞》","B":"《诗经》","C":"《乐府诗集》","D":"《文选》"},"explanation":"《诗经》是我国第一部诗歌总集，按音乐的特点分为风、雅、颂三部分，表现手法为\n\n赋、比、兴。《诗经》按音乐的特点分为风、雅、颂三部分。","clips":[]},{"n":70,"kind":"单项选择题","answer":"B","stem":"嵩山以“峻”著称,古有“峻极于天”之说,它被地质学界称为( )。","options":{"A":"“地球绿洲”","B":"“五世同堂”","C":"“天然火山博物馆”","D":"“造型地貌博物馆”"},"explanation":"嵩山以峻著称，主峰峻极峰古有“峻极于天”之说；嵩山岩石发育完整，太古宙至新\n\n生代的地层和岩石均有出露，被地质学界称为“五世同堂”，有中国最古老的岩系“登封杂\n\n岩”。","clips":[]},{"n":71,"kind":"单项选择题","answer":"B","stem":"皇家园林“一池三山”模式开创于( )。","options":{"A":"灵囿","B":"上林苑","C":"圆明园","D":"艮岳"},"explanation":"上林苑用太液池所挖之土堆成岛，象征东海三仙山，确立了皇家园林“一池三山”的\n\n模式，开创了人工造山的先例。上林苑开创了人工造山的先例。","clips":[]},{"n":72,"kind":"单项选择题","answer":"A","stem":"春节起源于原始社会的( )。","options":{"A":"腊祭","B":"社祭","C":"傩祭","D":"雩祭"},"explanation":"春节起源于原始社会的腊祭；春节活动从腊月里过小年开始，经过除夕、春节，直到\n\n正月十五元宵节结束。春节活动从腊月里过小年开始，直到正月十五元宵节结束。","clips":[]},{"n":73,"kind":"单项选择题","answer":"D","stem":"黎明时出现于东方的金星称为( )。","options":{"A":"“岁星”","B":"“荧惑”","C":"“长庚”","D":"“启明”"},"explanation":"金星又称“明星”“太白”，亮度最强，黎明时现于东方叫“启明”，黄昏时在西方叫\n\n“长庚”。金星又称“明星”“太白”，亮度最强，黄昏时在西方叫“长庚”。","clips":[]},{"n":74,"kind":" :[]},{"n":82,"kind":"单项选择题","answer":"A","stem":"川菜调味常用的“三椒”指的是( )。","options":{"A":"辣椒､花椒､胡椒","B":"辣椒､花椒､青椒","C":"辣椒､胡椒､泡椒","D":"花椒､胡椒､青椒"},"explanation":"传统川菜用料广博、味型丰富，调味多用三椒（辣椒、花椒、胡椒）和鲜姜、豆瓣酱，\n\n以豆瓣酱为主调味料。","clips":[]},{"n":83,"kind":"单项选择题","answer":"B","stem":"“三江并流”指的是( )三条大江。","options":{"A":"金沙江､澜沧江､雅鲁藏布江","B":"金沙江､澜沧江､怒江","C":"金沙江､怒江､长江","D":"澜沧江､怒江､雅鲁藏布江"},"explanation":"三江并流指金沙江、澜沧江和怒江这三条发源于青藏高原的大江在云南省境内自北向\n\n南并行奔流 170 多千米。","clips":[]},{"n":84,"kind":"单项选择题","answer":"C","stem":"罗马的“三多”指的是( )。","options":{"A":"雕塑多､教堂多､广场多","B":"教堂多､喷泉多､博物馆多","C":"雕塑多､教堂多､喷泉多","D":"雕塑多､广场多､喷泉多"},"explanation":"罗马有三多：雕塑多、教堂多、喷泉多，被誉为全球最大的“露天历史博物馆”。","clips":[]},{"n":85,"kind":"单项选择题","answer":"D","stem":"中国古典园林理水的三种方法是( )。","options":{"A":"掩､隔､断","B":"掩､破､合","C":"隔､破､断","D":"掩､隔､破"},"explanation":"古典园林理水之法一般有三种： 一是掩，以建筑和花木将池岸加以掩映，使其与周\n\n边的美景浑然一体； 二是隔，对于较大的水面，用堤、桥、水廊等分隔，以增加景深和空\n\n间层次，使水面有幽深之感； 三是破，当水面较小时，可用乱石为岸、犬牙交错，并植以\n\n细竹野藤，使一洼水池也具有深邃山野的审美意趣。","clips":[]},{"n":86,"kind":"单项选择题","answer":"B","stem":"下列属于中国四大名砚的是( )。","options":{"A":"端砚､歙砚､洮河砚､红丝砚","B":"端砚､歙砚､洮河砚､澄泥砚","C":"端砚､歙砚､澄泥砚､红丝砚","D":"端砚､洮河砚､澄泥砚､红丝砚"},"explanation":"端砚与歙砚、洮河砚、澄泥砚被誉为中国的四大名砚。","clips":[]},{"n":87,"kind":"单项选择题","answer":"B","stem":"吉林省人参产量占全国的( )。","options":{"A":"40%","B":"60%","C":"50%","D":"70%"},"explanation":"吉林省是中国最大的人参生产和出口基地，人参产量占全国的 60%，占世界的 40%以\n\n上。长白山区是“世界生物资源宝库”和“中国三大中药材基因库”之一。","clips":[]},{"n":88,"kind":"单项选择题","answer":"C","stem":"第二次国内革命战争时期,江西共诞生了( )开国将军,占全国开国将军总数的 1/5,位列全国第一。","options":{"A":"276 位","B":"198 位","C":"325 位","D":"156 位"},"explanation":"红色的江西一共诞生了 325 位开国将军，占全国开国将军总数的 1/5，开国将军人数\n\n位列全国第一；江西籍有名有姓的革命烈士有 25 万多人，占全国的六分之一。","clips":[]},{"n":89,"kind":"单项选择题","answer":"D","stem":"我国最早传承现代音乐艺术､诞生了国内第一支交响乐团和第一所音乐教育学校的城市是( )。","options":{"A":"上海","B":"北京","C":"广州","D":"哈尔滨"},"explanation":"哈尔滨是我国传承现代音乐艺术最早的城市，诞生了国内第一支交响乐团、第一所音\n\n乐教育学校，被联合国授予亚洲唯一的“世界音乐之城”，“中国·哈尔滨之夏音乐会”是中\n\n国三大音乐节之一。","clips":[]},{"n":90,"kind":"单项选择题","answer":"B","stem":"内蒙古北部与( )两国接壤。","options":{"A":" A":"长春","B":"广州","C":"重庆","D":"武汉"},"explanation":"重庆在中国的汽车工业占有举足轻重的地位，是全国重要的汽车制造基地，有着“东\n\n方底特律”的美誉，2025 年重庆汽车产量位居全国城市第一。","clips":[]},{"n":101,"kind":"单项选择题","answer":"D","stem":"江苏简称“苏”,地跨( )两大水系。","options":{"A":"长江､黄河","B":"淮河､黄河","C":"长江､钱塘江","D":"长江､淮河"},"explanation":"江苏地跨长江、淮河两大水系。","clips":[]},{"n":102,"kind":"单项选择题","answer":"B","stem":"位列我国十大名茶之一､以“色绿､香郁､味甘､形美”四绝著称的是( )。","options":{"A":"铁观音","B":"西湖龙井","C":"碧螺春","D":"黄山毛峰"},"explanation":"西湖龙井位列我国十大名茶之一，有 1200 多年历史，以“色绿、香郁、味甘、形美”\n\n四绝著称，清乾隆游览杭州西湖时把狮峰山下胡公庙前的十八棵茶树封为“御茶”。","clips":[]},{"n":103,"kind":"单项选择题","answer":"C","stem":"1954 年 12 月 25 日,西藏修通了闻名世界的( ),自此才有了现代意义上的公路汽车运输。","options":{"A":"青藏铁路","B":"川藏铁路","C":"青藏､川藏公路","D":"新藏公路"},"explanation":"1954 年 12 月 25 日修通了闻名世界的青藏、川藏公路。","clips":[]},{"n":104,"kind":"单项选择题","answer":"D","stem":"建于北魏､悬于悬崖峭壁之上､以惊险奇特著称的山西古建筑是( )。","options":{"A":"应县木塔","B":"鹳雀楼","C":"飞云楼","D":"悬空寺"},"explanation":"建于北魏的恒山悬空寺悬于悬崖峭壁之上，以惊险奇特著称；太原的晋祠是荟萃了多\n\n元古建筑形制的千年古祠；芮城永乐宫是典型的元代道观建筑群。","clips":[]},{"n":105,"kind":"单项选择题","answer":"B","stem":"下列褶皱山地带中,我国东北——西南走向山脉组合最整齐､世界特征最显著的是( )。","options":{"A":"横断山脉","B":"川东平行岭谷","C":"大巴山脉","D":"武陵山脉"},"explanation":"川东平行岭谷是我国东北——西南走向山脉组合最整齐地区，山脉与丘陵谷地相间有\n\n序排列，也是世界上特征最显著的褶皱山地带。","clips":[]},{"n":106,"kind":"单项选择题","answer":"D","stem":"解放战争时期,中国共产党解放的第一座大城市､有“新中国的试验田”之称的是( )。","options":{"A":"济南","B":"郑州","C":"太原","D":"石家庄"},"explanation":"石家庄是解放战争时期中国共产党解放的第一座大城市，有“新中国的试验田”之称，\n\n也是“两个务必”诞生地。济南战役是山东的重要战役。","clips":[]},{"n":107,"kind":"单项选择题","answer":"B","stem":"徐家汇教堂是上海规模最大的( )教堂,也是中国第一座按西方建筑方式建造的天主教教堂。","options":{"A":"罗马式","B":"哥特式","C":"巴洛克式","D":"拜占庭式"},"explanation":"徐家汇教堂为典型的法国中世纪哥特式双塔建筑，是上海规模最大的哥特式教堂，曾\n\n被誉为“远东第一大教堂”。","clips":[]},{"n":108,"kind":"单项选择题","answer":"C","stem":"解放战争时期,党中央在河北( )指挥了著名的“三大战役”,召开了七届二中全会。","options":{"A":"涉县赤岸村","B":"阜平城南庄","C":"平山县西柏坡","D":"唐县白求恩纪念馆"},"explanation":"党中央在河北平山县西柏坡指挥了著名的“三大战役”，召开了西柏坡会议（七届二\n\n中全会），为夺取全国胜利奠定了基础。解放石家庄是中国革命由农村包围城市、最后夺取\n\n全国胜利的转折点。","clips":[]},{"n":109,"kind":"单项选择题","answer":"D","stem":"沈阳故宫在清朝初期被称为( )。","options":{"A":"“陪都宫殿”","B":"“关外紫禁城”","C":"“奉天行宫”","D":"“盛京皇宫”"},"explanation":"沈阳故宫是清朝入关前努尔哈赤、皇太极两代皇帝兴建和使用的宫殿，清初时期被称\n\n为“盛京皇宫”；1644 年清政权迁都北京后，又被称为“陪都宫殿”。A 项“陪都宫殿”是迁\n\n都北京后的称谓，易误选。","clips":[]},{"n":110,"kind":"单项选择题","answer":"D","stem":"被联合国教科文组织认定为中国最具代表性的两首民歌之一､被誉为“山东第二省歌”的是( )。","options":{"A":"《茉莉花》","B":"《康定情歌》","C":"《在那遥远的地方》","D":"《沂蒙山小调》"},"explanation":"《沂蒙山小调》是山东特色民歌中传播最广、影响力最大的作品，被联合国教科文组\n\n织认定为中国最具代表性的两首民歌之一，被誉为“山东第二省歌”。","clips":[]},{"n":111,"kind":"单项选择题","answer":"B","stem":"“姑娘追”是( )青年最喜爱的一种马上体育游戏,也是男女青年相互表达爱情的一种方式。","options":{"A":"维吾尔族","B":"哈萨克族","C":"塔吉克族","D":"回族"},"explanation":"“姑娘追”是哈萨克青年最喜爱的一种马上体育游戏；刁羊是新疆各兄弟民族群众普\n\n遍喜爱的传统体育活动，特别是哈萨克族、柯尔克孜族、塔吉克族、蒙古族的牧民群众。","clips":[]},{"n":112,"kind":"单项选择题","answer":"C","stem":"北京的四合院源于( )院落式民居,是老北京城最主要的民居建筑。","options":{"A":"宋代","B":"明代","C":"元代","D":"清代"},"explanation":"北京四合院源于元代院落式民居，是老北京城最主要的民居建筑。 北京四合院以正\n\n房、倒座房、东西厢房围绕中间庭院形成平面布局，是北方传统住宅的统称。","clips":[]},{"n":113,"kind":"单项选择题","answer":"D","stem":"平遥古城有“龟城”之称,其街道格局为( )。","options":{"A":"“王”字形","B":"“井”字形","C":"“田”字形","D":"“土”字形"},"explanation":"平遥古城街道格局为“土”字形，整体布局遵从八卦方位。城内外有各类遗址、古建\n\n筑 300 多处，保存完整的明清民宅近 4000 座。","clips":[]},{"n":114,"kind":"单项选择题","answer":"B","stem":"山西刀削面因制作过程中采用独特的( )而得名。","options":{"A":"拉面工艺","B":"削面工艺","C":"压面工艺","D":"切面工艺"},"explanation":"山西刀削面因其制作过程中采用独特的削面工艺而得名，形似柳叶的面条独具特色；\n\n太原被称为“面食之都”，“一面百吃”的绝技独步天下。","clips":[]},{"n":115,"kind":"单项选择题","answer":"D","stem":"下列名山中,被誉为“佛国天堂”的是( )。","options":{"A":"五台山","B":"普陀山","C":"九华山","D":"峨眉山"},"explanation":"峨眉山是中国佛教四大名山中普贤菩萨的道场，被誉为“佛国天堂”。五台山有“华\n\n北屋脊”之称，普陀山以“海天佛国”著称，均为佛教名山，易误选。","clips":[]},{"n":116,"kind":"单项选择题","answer":"A","stem":"辽宁简称“辽”,取( )之意而得名。","options":{"A":"“辽河流域永远安宁”","B":"“辽河之水天上来”","C":"“辽西走廊安宁”","D":"“辽东安定”"},"explanation":"辽宁简称辽，取“辽河流域永远安宁”之意而得其名，省会沈阳市。","clips":[]},{"n":117,"kind":"单项选择题","answer":"A","stem":"“三地三摇篮”中,“中国人民航空事业的摇篮”位于( )。","options":{"A":"吉林长春","B":"辽宁沈阳","C":"黑龙江哈尔滨","D":"陕西西安"},"explanation":"“三地三摇篮”是吉林省最鲜明的红色标识，即东北抗日联军创建地、东北解放战争\n\n发起地、抗美援朝后援地；新中国汽车工业的摇篮、新中国电影事业的摇篮、中国人民航空\n\n事业的摇篮。 其中，中国人民航空事业的摇篮对应 A 项“吉林长春”。","clips":[]},{"n":118,"kind":"单项选择题","answer":"C","stem":"916 年建立契丹国､947 年改国号为“辽”的政权,在今内蒙古( )附近建立了蒙古草原上的第一座都城上京。","options":{"A":"呼和浩特市","B":"包头市","C":"赤峰市巴林左旗","D":"鄂尔多斯市"},"explanation":"916 年建立契丹国，947 年更国号为辽，其间在今内蒙古赤峰市巴林左旗附近建立了\n\n蒙古草原上的第一个都城上京。","clips":[]},{"n":119,"kind":"单项选择题","answer":"A","stem":"天津“风筝魏”的创始人是( )。","options":{"A":"魏元泰","B":"魏长生","C":"魏良辅","D":"魏源"},"explanation":"天津风筝之中以“魏记”生产的风筝最为精美、著名，创始人魏元泰技艺精湛，享有\n\n“风筝魏”的美誉。","clips":[]},{"n":120,"kind":"单项选择题","answer":"C","stem":"徽商在明清时期称雄商界,其文化特质突出表现为( )。","options":{"A":"“以末致富,以本守之”","B":"“官商一体”","C":"“贾而好儒”","D":"“重农抑商”"},"explanation":"程朱理学对皖南民俗影响深远，徽商“贾而好儒”、重贞节伦理等文化特质突出。","clips":[]},{"n":121,"kind":"单项选择题","answer":"B","stem":"天津古文化街旅游区又称( ),是津门十景之一。","options":{"A":"三岔河口","B":"津门故里","C":"意式风情区","D":"五大道"},"explanation":"天津古文化街旅游区（津门故里）是津门十景之一，是天津市的一张富有魅力的“城\n\n市名片”。","clips":[]},{"n":122,"kind":"单项选择题","answer":"C","stem":"以“色清如水晶､香醇似幽兰”著称,代表皖酒文化的安徽名酒是( )。","options":{"A":"口子窖","B":"迎驾贡酒","C":"古井贡酒","D":"金种子酒"},"explanation":"古井贡酒传承历史悠久，以其“色清如水晶、香醇似幽兰、入口甘美醇和、回味经久\n\n不息”而广受欢迎，代表了皖酒文化的独特魅力。","clips":[]},{"n":123,"kind":"单项选择题","answer":"A","stem":"中国四大石窟中,位于甘肃的是( )。","options":{"A":"敦煌莫高窟､天水麦积山石窟","B":"敦煌莫高窟､洛阳龙门石窟","C":"天水麦积山石窟､大同云冈石窟","D":"洛阳龙门石窟､大同云冈石窟"},"explanation":"中国四大石窟，甘肃有两个，即敦煌莫高窟、天水麦积山石窟。","clips":[]},{"n":124,"kind":"单项选择题","answer":"C","stem":"下列国家 5A 级旅游景区中,属于陕西､山西两省共有的是( )。","options":{"A":"雁门关","B":"云丘山","C":"黄河壶口瀑布","D":"大明宫"},"explanation":"陕西、山西共有的 5A 景区是黄河壶口瀑布。A 项雁门关、B 项云丘山为山西独有 5A\n\n景区；D 项大明宫位于陕西西安。","clips":[]},{"n":125,"kind":"单项选择题","answer":"A","stem":"全球第二个､中国第一个完全通过填海造陆建成的机场是( )。","options":{"A":"澳门国际机场","B":"香港国际机场","C":"上海浦东国际机场","D":"深圳宝安国际机场"},"explanation":"答案选 A。澳门国际机场是全球第二个、中国第一个完全由填海造陆而建成的机场。","clips":[]},{"n":126,"kind":"单项选择题","answer":"B","stem":"1952 年 7 月建成通车的新中国第一条自行设计施工､完全采用国产材料的铁路是( )。","options":{"A":"宝成铁路","B":"成渝铁路","C":"成昆铁路","D":"川黔铁路"},"explanation":"答案选 B。1952 年 7 月，新中国自行设计施工、完全采用国产材料修建的第一条铁路\n\n——成渝铁路建成通车，基本改写了蜀道难的历史。","clips":[]},{"n":127,"kind":"单项选择题","answer":"A","stem":"蒙古语意为“河流密集的地方”､被誉为“中国盐湖城”的城市是( )。","options":{"A":"格尔木市","B":"德令哈市","C":"西宁市","D":"拉萨市"},"explanation":"格尔木市蒙古语意为“河流密集的地方”，因青藏公路而生、因盐湖工业而兴，被誉\n\n为“中国盐湖城”和“青藏高原上的璀璨明珠”（其他教材补充）。","clips":[]},{"n":128,"kind":"单项选择题","answer":"B","stem":"下列湖南民俗中,主题为纪念神农恩德的是( )。","options":{"A":"跳香节","B":"赶秋节","C":"姑娘追","D":"赶僵尸"},"explanation":"湖南花垣县麻栗场至吉首市矮寨一带的苗民，每年立秋日到来前，要过赶秋节，以此\n\n纪念神农的恩德。","clips":[]},{"n":129,"kind":"单项选择题","answer":"B","stem":"天津独乐寺始建于( )。","options":{"A":"隋朝","B":"唐朝","C":"宋朝","D":"元朝"},"explanation":"答案选 B。独乐寺始建于唐，重建于辽统和二年（公元 984 年），以古建、泥塑、壁\n\n画“三绝”享誉中外。","clips":[]},{"n":130,"kind":"单项选择题","answer":"D","stem":"华南第一高峰是( )。","options":{"A":"广东石坑崆","B":"湖南酃峰","C":"海南五指山主峰","D":"广西猫儿山主峰"},"explanation":"答案选 D。广西猫儿山主峰是华南第一高峰。","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABCD","stem":"全真道的特点有( )。","options":{"A":"以《道德经》《般若波罗蜜多心经》《孝经》为主要经典","B":"主张道､佛､儒三教合一","C":"重内丹修炼,不尚符箓","D":"道士必须出家住宫观,不得蓄妻室","E":"道士可以有家室,可不出家"},"explanation":"道士可以有家室、可不出家的是正一道，不是全真道。全真道士必须出家住宫观，不\n\n得蓄妻室，并制定了严格的清规戒律。","clips":[]},{"n":132,"kind":"多项选择题","answer":"ABC","stem":"下列属于范仲淹《岳阳楼记》名句的有( )。","options":{"A":"“不以物喜,不以己悲”","B":"“居庙堂之高则忧其民”","C":"“处江湖之远则忧其君”","D":"“落霞与孤鹜齐飞,秋水共长天一色”","E":"“醉翁之意不在酒”"},"explanation":"“居庙堂之高”指在朝中做官，“处江湖之远”意思是不在朝廷做官；“醉翁之意不在\n\n酒”出自欧阳修《醉翁亭记》。“居庙堂之高”指在朝中做官，“处江湖之远”意思是不在朝\n\n廷做官。","clips":[]},{"n":133,"kind":"多项选择题","answer":"ABC","stem":"下列关于“竹林七贤”的说法,正确的有( )。","options":{"A":"包括嵇康､阮籍","B":"包括向秀､刘伶","C":"包括阮咸､王戎､山涛","D":"是东晋时期的名士群体","E":"包括陶渊明"},"explanation":"竹林七贤为嵇康、阮籍、向秀、刘伶、阮咸、王戎、山涛，是西晋时期的名士群体，\n\n不包括陶渊明。嵇康、阮籍、向秀、刘伶、阮咸、王戎、山涛时人称为“竹林七贤”。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ABC","stem":"下列属于春季节气的有( )。","options":{"A":"立春､雨水","B":"惊蛰､春分","C":"清明､谷雨","D":"立夏､小满","E":"芒种､夏至"},"explanation":"春天：立春、雨水、惊蛰、春分、清明、谷雨； 夏天：立夏、小满、芒种、夏至。 二\n\n十四节气中，清明既是节气又是传统节日。","clips":[]},{"n":135,"kind":"多项选择题","answer":"ABCD","stem":"下列关于宫殿建筑的表述,正确的有( )。","options":{"A":"宫殿是帝王朝会和居住的地方","B":"宫殿建筑采取严格的中轴对称的布局方式","C":"宫殿建筑实行“左祖右社”的布局","D":"北京故宫宫殿分前朝和内廷两部分","E":"北京故宫内廷以太和殿为中心"},"explanation":"宫殿是帝王朝会和居住的地方，是我国古代建筑中最高级、最豪华、艺术价值最高的\n\n一种类型；为体现君权受命于天和以皇权为核心的等级观念，宫殿建筑采取严格的中轴对称\n\n的布局方式，实行“左祖右社”；北京故宫宫殿分前后两部分，即前朝和内廷，前朝以太和\n\n殿、中和殿、保和殿三大殿为中心。 E 项错误，前朝以太和殿、中和殿、保和殿三大殿为\n\n中心。","clips":[]},{"n":136,"kind":"多项选择题","answer":"ABCD","stem":"下列关于红军长征的表述,正确的有( )。","options":{"A":"时间是 1934 年 10 月至 1936 年 10 月","B":"行程二万五千里","C":"遵义会议是党的历史上生死攸关的转折点","D":"会后成立毛泽东､周恩来､王稼祥组成的三人小组","E":"长征胜利结束的标志是井冈山会师"},"explanation":"1934 年 10 月至 1936 年 10 月，红军长驱二万五千里，胜利完成震撼世界、彪炳史册\n\n的长征。遵义会议是党的历史上生死攸关的转折点，事实上确立了毛泽东同志在党中央和红\n\n军的领导地位；会后成立毛泽东、周恩来、王稼祥组成的三人小组，负责全军的军事行动。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ABCD","stem":"下列学派与代表人物的对应关系,正确的有( )。","options":{"A":"孔子､孟子——儒家","B":"老子､庄子——道家","C":"墨子——墨家","D":"商鞅､韩非——法家","E":"孙武､孙膑——法家"},"explanation":"孙武、孙膑是兵家代表人物；其余对应正确。孙武、孙膑是兵家代表人物。道家主张\n\n摒弃现代文明、回归原始生活；法家主张严刑峻法，战国中后期一度受到秦国的重用。","clips":[]},{"n":138,"kind":"多项选择题","answer":"ABCD","stem":"下列关于中国佛教三大体系的表述,正确的有( )。","options":{"A":"北传佛教——以大乘佛教为主,经典主要属于汉语","B":"南传佛教——以小乘佛教(上座部佛教)为主","C":"藏传佛教——具有活佛转世等特色","D":"北传佛教也称汉语系佛教","E":"南传佛教也称汉语系佛教"},"explanation":"北传佛教以大乘佛教为主，其经典主要属于汉语，也称汉语系佛教；南传佛教以小乘\n\n佛教（上座部佛教）为主；咒术性、对喇嘛异常尊崇、活佛转世思想和宗教与政治的结合，\n\n是历史上藏传佛教的四个特色。E 项错误。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABCD","stem":"西周青铜器“四大重器”包括( )。","options":{"A":"毛公鼎","B":"大盂鼎","C":"散氏盘","D":"虢季子白盘","E":"后母戊鼎"},"explanation":"西周青铜器四大重器为毛公鼎、大盂鼎、散氏盘和虢季子白盘；后母戊鼎是商朝器物。\n\n后母戊鼎是商朝器物，高达 133 厘米、重达 832.84 公斤，是迄今世界上发现的最大的青铜\n\n器。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ACD","stem":"下列古人对天象与人事吉凶关系的认识,正确的有( )。","options":{"A":"木星代表五谷丰登","B":"金星代表五谷丰登","C":"日食是上天对天子的警告","D":"彗星是兵灾的凶象","E":"日食象征五谷丰登"},"explanation":"古人认为天象的变化预示着人事的吉凶，如木星（又叫岁星）代表五谷丰登，日食是\n\n上天对天子的警告，彗星是兵灾的凶象。","clips":[]},{"n":141,"kind":"多项选择题","answer":"BCE","stem":"巴金“激流三部曲”包括( )。","options":{"A":"《雾》","B":"《家》","C":"《春》","D":"《雨》","E":"《秋》"},"explanation":"巴金的长篇小说系列有《爱情三部曲》（《雾》《雨》《电》）和《激流三部曲》（《家》\n\n《春》《秋》）。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABDE","stem":"甲骨文已具备的汉字基本造字法“四书”包括( )。","options":{"A":"象形","B":"会意","C":"假借","D":"指事","E":"形声"},"explanation":"甲骨文已经具备了汉字基本的造字法“四书”（象形、会意、指事、形声），是一种非\n\n常成熟的文字。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ACDE","stem":"下列荣获联合国教科文组织创意城市网络“美食之都”称号的中国城市有( )。","options":{"A":"四川成都","B":"福建厦门","C":"广东顺德","D":"江苏扬州","E":"福建泉州"},"explanation":"四川成都、广东顺德、江苏扬州、江苏淮安、广东潮州、福建泉州以及澳门七座城市\n\n先后被联合国教科文组织创意城市网络（UCCN）授予“美食之都”称号。","clips":[]},{"n":144,"kind":"多项选择题","answer":"BD","stem":"抗美援朝战争中涌现出的特级英雄有( )。","options":{"A":"邱少云","B":"杨根思","C":"王海","D":"黄继光","E":"于喜田"},"explanation":"志愿军战士中涌现出特级英雄杨根思、黄继光，一级英雄邱少云、王海、于喜田、柴\n\n云振等 30 多万名英雄功臣和近 6000 个功臣集体。","clips":[]},{"n":145,"kind":"多项选择题","answer":"BCDE","stem":"“元曲四大家”包括( )。","options":{"A":"纪君祥","B":"关汉卿","C":"白朴","D":"马致远","E":"郑光祖"},"explanation":"著名作品有关汉卿《窦娥冤》、白朴《墙头马上》、马致远《汉宫秋》、郑光祖《倩女\n\n离魂》，此四人被誉为“元曲四大家”。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABE","stem":"殿试一甲前三名的称谓有( )。","options":{"A":"状元","B":"榜眼","C":"会元","D":"解元","E":"探花"},"explanation":"殿试排名分三等，称“三甲”，一甲取前三名，分别称为“状元”“榜眼”“探花”，赐\n\n“进士及第”。","clips":[]},{"n":147,"kind":"多项选择题","answer":"CE","stem":"下列属于同情类谥号用字的有( )。","options":{"A":"文","B":"武","C":"哀","D":"炀","E":"愍"},"explanation":"谥号用的字是固定的，有三类：一是表扬的，如“文”“武”“成”“景”；二是批评的，\n\n如“炀”（好内远礼）、“厉”（杀戮无辜）；三是同情的，如短命叫“哀”，遭受国难叫“愍”。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABCD","stem":"下列属于浙江著名史前文化遗存的有( )。","options":{"A":"上山遗址","B":"跨湖桥遗址","C":"河姆渡文化","D":"良渚文化","E":"马家窑文化"},"explanation":"上山遗址被誉为“世界稻源”；跨湖桥遗址出土了距今 7000 多年的独木舟；河姆渡文\n\n化反映母系氏族社会的繁荣；良渚文化是中国早期国家形态的重要代表。湖州钱山漾遗址还\n\n出土了世界最早的丝麻织物。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABC","stem":"岭南文化由( )三大部分构成。","options":{"A":"固有的本土文化","B":"南迁的中原文化","C":"舶来的域外文化","D":"草原游牧文化","E":"客家文化"},"explanation":"岭南文化由固有的本土文化、南迁的中原文化、舶来的域外文化三部分构成，主要有\n\n广府文化、客家文化、潮州文化、雷州文化等分支。D 项草原游牧文化不属于岭南文化构成，\n\n易误选。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABE","stem":"陕西发现的仰韶文化时期母系氏族遗址有( )等。","options":{"A":"大河村遗址","B":"半坡遗址（西安灞桥区）","C":"姜寨遗址（西安临潼区）","D":"大地湾遗址","E":"杨官寨遗址（西安高陵区）"},"explanation":"陕西发现了距今 6000 年前的仰韶文化半坡遗址、姜寨遗址和杨官寨遗址。 C 项大地\n\n湾遗址在甘肃，易误选。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":151,"kind":"多项选择题","answer":"ADE","stem":"湖北构建起覆盖全周期的红色文化体系的“三大精神”是( )。","options":{"A":"大别山精神","B":"红岩精神","C":"长征精神","D":"抗疫精神","E":"抗洪精神"},"explanation":"湖北以“大别山精神”“抗洪精神”“抗疫精神”三大精神为代表，构建起覆盖新民主\n\n主义革命、社会主义建设、改革开放和新时代的全周期红色文化体系。B 项长征精神主要与\n\n江西、贵州、四川等相关，易误选。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":152,"kind":"多项选择题","answer":"ABCE","stem":"纳西族的艺术珍品有( )。","options":{"A":"长篇史诗《创世纪》","B":"反映社会生活的百科全书《东巴经》","C":"用象形文字写成的《东巴画谱》","D":"《格萨尔王传》","E":"《白沙细乐》"},"explanation":"纳西族有著名的长篇史诗《创世纪》、反映古代纳西族社会生活的百科全书《东巴经》、\n\n用象形文字写成的《东巴画谱》以及纳西古乐《白沙细乐》等艺术珍品。D 项《格萨尔王传》\n\n是藏族英雄史诗（西藏）。","clips":[]},{"n":153,"kind":"多项选择题","answer":"BCD","stem":"下列属于澳门美食代表的有( )。","options":{"A":"过桥米线","B":"马介休","C":"焗生蚝","D":"葡式蛋挞","E":"烤乳猪"},"explanation":"葡式蛋挞是澳门美食的代表名片之一；马介休是葡式美食的主要材料；澳门的焗生蚝\n\n远近闻名。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ABCDE","stem":"吉林省著名的旅游景观有( )等。","options":{"A":"长白山","B":"吉林雾凇","C":"长春净月潭","D":"查干湖","E":"珲春防川"},"explanation":"本题全部正确。“雄山托天池，林海藏珍奇”的长白山、中国四大自然奇观之一的吉\n\n林雾凇、亚洲最大森林氧吧净月潭、渔猎文化胜地查干湖、“一眼望三国”的珲春防川，都\n\n是吉林著名的旅游景观。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABCE","stem":"新疆正在打造的四大千亿级石化基地有( )。","options":{"A":"独山子—奎屯—克拉玛依","B":"乌鲁木齐","C":"巴州","D":"库尔勒","E":"库车"},"explanation":"新疆油气生产加工规模居全国第一，正打造独山子—奎屯—克拉玛依、乌鲁木齐、巴\n\n州、库车四大千亿级石化基地。D 项库尔勒不在四大基地之列。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABDE","stem":"内蒙古现代农牧业独具优势,“黄金奶源带”“马铃薯种薯黄金带”“肉羊产业带”“玉米黄金带”渐次排布,使内蒙古成为名副其实的( )。","options":{"A":"“粮仓”","B":"“肉库”","C":"“油都”","D":"“绒都”","E":"“奶罐”"},"explanation":"向日葵、谷子、大豆等品种选育全国领先，全国名特优新农产品保持全国第一，是名\n\n副其实的“粮仓、肉库、奶罐、绒都”。C 项“油都”不在所列称号之内。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ACDE","stem":"下列福建茶叶与茶类的对应关系中,正确的有( )。","options":{"A":"安溪铁观音——乌龙茶","B":"金骏眉——绿茶","C":"正山小种——红茶","D":"白毫银针——白茶","E":"武夷岩茶——乌龙茶"},"explanation":"乌龙茶的主要代表有安溪铁观音和武夷岩茶；红茶代表有武夷山“正山小种”、福安\n\n“坦洋工夫”等；白茶代表有白毫银针、白牡丹等。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABDE","stem":"江西旅游资源可以概括为“四个千年”,包括( )。","options":{"A":"千年瓷都景德镇","B":"千年名楼滕王阁","C":"千年古刹灵隐寺","D":"千年古刹东林寺","E":"千年书院白鹿洞"},"explanation":"“四个千年”即千年瓷都景德镇、千年名楼滕王阁、千年书院白鹿洞、千年古刹东林\n\n寺。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABCDE","stem":"豫菜代表性名菜和小吃有( )。","options":{"A":"鲤鱼焙面","B":"洛阳牡丹燕菜","C":"葱扒羊肉","D":"河南烩面","E":"开封灌汤包"},"explanation":"本题全部正确。豫菜是河南代表菜系，秉承五味调和、质味适中的烹饪理念，兼容南\n\n北风味；代表性名菜有鲤鱼焙面、洛阳牡丹燕菜、葱扒羊肉等；特色小吃有河南烩面、胡辣\n\n汤、开封灌汤包等。洛阳水席坚守传统制作技艺，汤菜兼备、宴席考究，是豫菜文化与宫廷\n\n饮食文化的经典传承。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ACDE","stem":"下列关于黑龙江世居民族生产方式的对应,正确的有( )。","options":{"A":"赫哲族——以捕鱼为生","B":"达斡尔族——以狩猎为生","C":"蒙古族､达斡尔族——以牧业为主","D":"满族､朝鲜族——以农耕为主","E":"鄂伦春族——以狩猎为生"},"explanation":"赫哲族以捕鱼为生，鄂伦春族以狩猎为生，蒙古族、达斡尔族以牧业为主，满族、朝\n\n鲜族以农耕为主。","clips":[]},{"n":161,"kind":"多项选择题","answer":"BCE","stem":"下列河流中,发源于青海的有( )。","options":{"A":"黑龙江","B":"黄河","C":"澜沧江","D":"珠江","E":"长江"},"explanation":"青海是长江、黄河、澜沧江的发源地，被称为“江河源头”。青海又称“三江源”，素\n\n有“中华水塔”之美誉，全省平均海拔 3000 米以上。","clips":[]},{"n":162,"kind":"多项选择题","answer":"CDE","stem":"塔尔寺的艺术“三绝”包括( )。","options":{"A":"酥油茶","B":"唐卡","C":"壁画","D":"酥油花","E":"堆绣"},"explanation":"酥油花、堆绣、壁画被誉为塔尔寺的艺术“三绝”。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ADE","stem":"上海科技馆是中国唯一拥有( )三座大型场馆的综合性科学技术博物馆集群。","options":{"A":"科技馆","B":"艺术博物馆","C":"历史博物馆","D":"自然博物馆","E":"天文馆"},"explanation":"上海科技馆是中国唯一拥有科技馆、自然博物馆、天文馆三座大型场馆的综合性科学\n\n技术博物馆集群，已成为上海特色文化地标、参观量最大的旅游景点之一。","clips":[]},{"n":164,"kind":"多项选择题","answer":"BCDE","stem":"截至目前,海南的国家 5A 级旅游景区包括( )。","options":{"A":"海口骑楼老街","B":"三亚南山大小洞天","C":"槟榔谷黎苗文化旅游区","D":"三亚市蜈支洲岛","E":"三亚南山文化旅游区"},"explanation":"截至 2026 年 7 月，海南有国家 5A 级旅游景区 7 家：三亚南山文化旅游区、三亚南山\n\n大小洞天、呀诺达雨林、分界洲岛、槟榔谷黎苗文化旅游区、三亚市蜈支洲岛、三亚市天涯\n\n海角。","clips":[]},{"n":165,"kind":"多项选择题","answer":"DE","stem":"“丝绸之路:长安——天山廊道的路网”由中国与( )跨国申报。","options":{"A":"乌兹别克斯坦","B":"土库曼斯坦","C":"塔吉克斯坦","D":"吉尔吉斯斯坦","E":"哈萨克斯坦"},"explanation":"“丝绸之路：长安——天山廊道的路网（跨国遗产）”由河南、陕西、甘肃、新疆联合\n\n申报。（中国与哈萨克斯坦、吉尔吉斯斯坦跨国申报）。——口诀——丝路三国：中国哈萨克\n\n斯坦吉尔吉斯斯坦。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper3-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retrySequence=[], retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    if(Array.isArray(state.retrySequence))retrySequence=[...new Set(state.retrySequence)].filter(n=>questions.some(q=>q.n===n));
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,retrySequence,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  const list=wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
  const rank=new Map(retrySequence.map((n,i)=>[n,i]));
  return list.sort((a,b)=>(rank.get(a.n)??Infinity)-(rank.get(b.n)??Infinity));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
    retrySequence=[];
  }
  if(!list.length)return;
  if(!retrySequence.length){
    for(let i=list.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [list[i],list[j]]=[list[j],list[i]];
    }
    retrySequence=list.map(q=>q.n);
  }
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  retrySequence=[];
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
