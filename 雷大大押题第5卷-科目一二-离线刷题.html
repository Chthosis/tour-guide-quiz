<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"错","stem":"根据《中华人民共和国宪法》的规定，公民合法的私有财产不受侵犯，因此一切私有财产均受宪法保护。","options":{"对":"正确","错":"错误"},"explanation":"公民合法的私有财产不受侵犯，受宪法保护的前提是财产“合法”，并非一切私有财\n\n产均受宪法保护。","clips":[]},{"n":2,"kind":"判断题","answer":"错","stem":"《旅游法》规定，县级以上人民政府应当按照国民经济和社会发展规划的要求，组织编制旅游发展规划。","options":{"对":"正确","错":"错误"},"explanation":"《旅游法》第 17 条规定，国务院和省、自治区、直辖市人民政府以及旅游资源丰富\n\n的设区的市和县级人民政府，应当按照国民经济和社会发展规划的要求，组织编制旅游发展\n\n规划。错在“县级以上人民政府”，故本题错误。","clips":[]},{"n":3,"kind":"判断题","answer":"对","stem":"根据《民法典》的规定，采用两种以上文字的合同，各文本使用的词句不一致的，应当根据合同的相关条款、性质、目的以及诚实信用原则等予以解释。","options":{"对":"正确","错":"错误"},"explanation":"解析各文本使用的词句不一致的，应当根据合同的相关条款、性质、目的以及诚信\n\n原则等予以解释。","clips":[]},{"n":4,"kind":"判断题","answer":"对","stem":"《旅行社条例》规定，凡是中国内地居民持中国护照出国旅游或者持通行证赴香港、澳门和台湾旅游的，均属出境旅游。","options":{"对":"正确","错":"错误"},"explanation":"解析凡是中国内地居民持中国护照出国旅游或者持通行证赴香港、澳门和台湾旅游\n\n的，均属出境旅游。故本题说法正确。","clips":[]},{"n":5,"kind":"判断题","answer":"对","stem":"国家建立经营者守法、行业自律、消费者参与、政府监管和社会监督相结合的消费者权益保护共同治理体系。","options":{"对":"正确","错":"错误"},"explanation":"条例原文表述为“建立和完善经营者守法、行业自律、消费者参与、政府监管和社\n\n会监督相结合的消费者权益保护共同治理体系”，题干与法条一致，说法正确。","clips":[]},{"n":6,"kind":"判断题","answer":"错","stem":"旅游突发事件仅指突然发生、造成或者可能造成旅游者人身伤亡，需要采取应急处置措施予以应对的自然灾害、事故灾难、公共卫生事件和社会安全事件。","options":{"对":"正确","错":"错误"},"explanation":"旅游突发事件是指突然发生、造成或者可能造成旅游者人身伤亡、财产损失。此处\n\n既有“人身伤亡”也包括“财产损失”。","clips":[]},{"n":7,"kind":"判断题","answer":"错","stem":"国务院旅游主管部门建立旅游目的地安全风险提示制度。","options":{"对":"正确","错":"错误"},"explanation":"本题表述错误。\n\n《旅游法》第 77 条规定，国家建立旅游目的地安全风险提示制度。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"根据《中华人民共和国民用航空法》的规定，航空货运单是航空货物运输合同订立和运输条件以及承运人接受货物的初步证据。","options":{"对":"正确","错":"错误"},"explanation":"第 122 条，航空货运单是航空货物运输合同订立和运输条件以及承运人接受货物的\n\n初步证据。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"根据《出入境管理法》的规定，外国人以及交通运输工具应当从对外开放的口岸入境出境，特殊情况下，可以从外事部门批准的地点出境入境。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，错在“外事部门”。\n\n《出境入境管理法》第 6 条规定：“中国公民、外国人以及交通运输工具应当从对外开放的\n\n口岸出境入境，特殊情况下，可以从国务院或者国务院授权的部门批准的地点出境入境。”","clips":[]},{"n":10,"kind":"判断题","answer":"错","stem":"根据《风景名胜区条例》，省级风景名胜区总体规划由省级人民政府林草主管部门组织编制。","options":{"对":"正确","错":"错误"},"explanation":"《风景名胜区条例》第十六条：国家级风景名胜区规划由省、自治区、直辖市人民\n\n政府林业草原主管部门组织编制。省级风景名胜区规划由县级人民政府组织编制。省级风景\n\n名胜区规划的编制主体是县级人民政府，而不是省级人民政府林业草原主管部门，故判断为\n\n错。","clips":[]},{"n":11,"kind":"判断题","answer":"错","stem":"在国家法定节假日和学校寒暑假期间，博物馆应当免费开放。","options":{"对":"正确","错":"错误"},"explanation":"在国家法定节假日和学校寒暑假期间，博物馆应当开放。注意：不是所有的博物馆\n\n都是“免费”开放。","clips":[]},{"n":12,"kind":"判断题","answer":"对","stem":"依据习近平法治思想，坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设。","options":{"对":"正确","错":"错误"},"explanation":"解析坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社\n\n会一体建设。该表述与原文完全一致，故本题正确。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"党的二十大报告指出，中国式现代化是全体人民共同富裕的现代化。共同富裕是中国特色社会主义的本质要求，也是一个长期的历史过程。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n本题说法正确。党的二十大报告明确指出：“中国式现代化是全体人民共同富裕的现代化。”\n\n共同富裕是社会主义的本质要求，是中国式现代化的重要特征。","clips":[]},{"n":14,"kind":"判断题","answer":"对","stem":"对英雄烈士的抚恤优待要与国民经济和社会发展相适应并逐步提高。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":15,"kind":"判断题","answer":"对","stem":"每年 9 月 30 日为烈士纪念日，清明节当日国家在首都北京天安门广场人民英雄纪念碑前举行纪念仪式，缅怀英雄烈士。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。《英烈法》第 5 条规定，每年 9 月 30 日为烈士纪念日，国家在首都\n\n北京天安门广场人民英雄纪念碑前举行纪念仪式，缅怀英雄烈士。","clips":[]},{"n":16,"kind":"判断题","answer":"对","stem":"根据《旅游强国建设“十五五”规划》，旅游业被定位为新兴的战略性支柱产业和具有显著时代特征的民生产业、幸福产业。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":17,"kind":"判断题","answer":"对","stem":"2025 年 10 月 24 日，第十四届全国人民代表大会常务委员会第十八次会议依据《中华人民共和国宪法》表决通过决定，以法律形式将 10 月 25 日设立为“台湾光复纪念日”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n2025 年 10 月 24 日，第十四届全国人民代表大会常务委员会第十八次会议依据《中华人民\n\n共和国宪法》表决通过决定，以法律形式将 10 月 25 日设立为“台湾光复纪念日”。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"2025 年 11 月，我国首艘电磁弹射航母福建舰正式入列，海军进入双航母时代。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，应为“三航母时代”。\n\n2025 年 11 月 5 日，航母 18 的福建舰在海南三亚某军港正式入列。这艘全球首艘常规动力\n\n电磁弹射型航母的服役，不仅标志着中国海军进入三航母时代，更意味着其舰载航空兵作战\n\n体系完成了从滑跃起飞到电磁弹射的代际跨越。","clips":[]},{"n":19,"kind":"判断题","answer":"对","stem":"2026 年 2 月 14 日，习近平主席在致非洲联盟峰会贺电中宣布，中方将于 2026 年 5 月 1日起对 53 个非洲建交国全面实施零关税举措，同时继续推动商签共同发展经济伙伴关系协定。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n2026 年 2 月 14 日，习近平主席在致非洲联盟峰会贺电中宣布，中方将于 2026 年 5 月 1 日\n\n起对 53 个非洲建交国全面实施零关税举措，同时继续推动商签共同发展经济伙伴关系协定。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"海南自贸港全岛封关运作于 2025 年 12 月 18 日正式启动。海南自由贸易港全岛封关，是指将海南全岛建成一个海关监管特殊区域，实施以“一线”放开、“二线”管住、岛内自由”为基本特征的自由化便利化政策制度。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n海南自贸港全岛封关运作于 2025 年 12 月 18 日正式启动。\n\n海南自由贸易港全岛封关，是指将海南岛全岛建成一个海关监管特殊区域，实施以“一线”\n\n放开、“二线”管住、岛内自由”为基本特征的自由化便利化政策制度；是海南自由贸易港\n\n建设的标志性和基础性工程，标志着海南自由贸易港建设进入实质性阶段。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"导游是国家方针政策的宣传者和执行者，又是将旅游者的意见、要求传递至旅行社和旅游行政管理部门的传递者，这是导游沟通上下纽带作用的体现。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"2016 年 9 月，国家旅游局推行“电子导游证”，建设“全国旅游监管服务平台”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":23,"kind":"判断题","answer":"对","stem":"领队是指依法取得从业资格，受组团旅行社（组团社）委派，全权代表组团社带领旅游团出境旅游，监督境外地接社和导游等执行旅游计划，并为旅游者提供出入境等相关服务的工作人员。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"首次沿途导游是地陪接到旅游团队后的第一次导游讲解，对于满足旅游者好奇心和求知欲、展示地陪知识技能以及树立良好第一印象具有重要作用。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"旅游者提出的要求与原行程不符且涉及接待规格时，导游一般要请示旅行社，视情况而定。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n入境领队（全陪）或旅游者提出的要求与原行程不符且涉及接待规格时，导游一般要婉转拒\n\n绝。","clips":[]},{"n":26,"kind":"判断题","answer":"错","stem":"国际通用的白皮书，即“国际预防接种证书”，其核心作用在于借助卫生检疫措施来避免传染病的跨境传播。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n国际通用的黄皮书，即“国际预防接种证书”，其核心作用在于借助卫生检疫措施来避免传\n\n染病的跨境传播。","clips":[]},{"n":27,"kind":"判断题","answer":"错","stem":"在讲述一段感人的历史故事时，于情节关键处稍作停顿，让情感在静默中得以升华，这是导游运用逻辑停顿的方法进行讲解。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n导游若能以饱满感情运用感情停顿，将获得更丰富深沉的效果，营造出“此时无声胜有声”\n\n的境界。比如在讲述一段感人的历史故事时，于情节关键处稍作停顿，让情感在静默中得以\n\n升华。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"导游提出问题，引导旅游者积极作答，这是我问客答法的运用。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":29,"kind":"判断题","answer":"对","stem":"致欢送词是导游最后一次展示风采、影响旅游者看法的机会。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"非居民游客携带单价超出 5000 元人民币的物品，须向海关申报，并办理进境手续。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":31,"kind":"判断题","answer":"错","stem":"导游在接待政务团时，应能进行有针对性的讲解，适当引用相关专业术语，并保持讲解内容的准确性与权威性。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。导游在接待商务团时，应能进行有针对性的讲解，适当引用相关专\n\n业术语，并保持讲解内容的准确性与权威性。","clips":[]},{"n":32,"kind":"判断题","answer":"错","stem":"导游应发自内心地尊重残障游客，主动为残障游客在旅游期间拍照。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n发自内心的尊重是建立良好互动关系的前提，未经同意，不可随意对残障旅游者拍照。","clips":[]},{"n":33,"kind":"判断题","answer":"对","stem":"导游处理个别要求时，要维护国家尊严与自身人格尊严，对损害国家利益、民族尊严的要求断然拒绝并严正驳斥。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":34,"kind":"判断题","answer":"对","stem":"通常情况下，导游不陪同个别旅游者前往计划外景点。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":35,"kind":"判断题","answer":"错","stem":"若只是个别旅游者执意推迟用餐，导游应尽量协调推迟用餐时间。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n若只是个别旅游者执意推迟用餐，导游应带领全团按原计划正常用餐，同时协助个别旅游者\n\n后续联系餐馆安排点餐，并告知其不随团用餐的费用自理，原餐费按照旅游合同约定处理","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"若确定气象变化或已发生的自然灾害将影响行程，在征得旅游者同意且获得旅行社认可后，导游灵活调整行程，保障旅游者安全。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":37,"kind":"判断题","answer":"错","stem":"若山坡前缘出现横向及纵向裂缝，前缘土体出现隆起现象，以及动物出现惊恐异常等情况，则预示着即将发生泥石流。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。\n\n若山坡前缘出现横向及纵向裂缝，前缘土体出现隆起现象，以及动物出现惊恐异常等情况，\n\n则预示着即将发生山体滑坡。","clips":[]},{"n":38,"kind":"判断题","answer":"错","stem":"无论是正常票价还是特价机票，其客票有效期均为 1 年。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误。正常票价的客票有效期为 1 年。特价机票的有效期以承运人的规定\n\n为准。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"水运企业取得航线经营许可后，应在 60 日内开通运营，并于开航前 15 日通过媒体公示及在客运站点公告。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"无论是手提行李还是托运行李，都禁止夹带打火机和火柴。此外，旅客携带手机、电脑等物品时，需将手机调成飞行模式或关机后再乘坐飞机。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"C","stem":"2026 年《政府工作报告》提出的我国经济增长预期目标是（   ）。","options":{"A":"5%左右","B":"5.5%左右","C":"4.5%—5%","D":"4.5%左右"},"explanation":"2026 年 3 月，十四届全国人大四次会议审议通过的《政府工作报告》提出，2026\n\n年经济增长预期目标设定为“4.5%—5%”，首次采用区间形式。2026 年前三季度我国 GDP 同\n\n比增长 4.6%，为实现全年目标打下良好基础。","clips":[]},{"n":42,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国宪法》的规定，我国的根本政治制度是（        ）。","options":{"A":"中国共产党领导的多党合作和政治协商制度","B":"人民代表大会制度","C":"民族区域自治制度","D":"基层群众自治制度"},"explanation":"宪法第 2 条、第 3 条确立了人民代表大会制度为我国的根本政治制度，它是政权组\n\n织形式，直接体现国体，是实现人民当家作主的根本途径。\n\nA 项错误，中国共产党领导的多党合作和政治协商制度属于基本政治制度；C 项错误，民族\n\n区域自治制度属于基本政治制度；D 项错误，基层群众自治制度属于基本政治制度。","clips":[]},{"n":43,"kind":"单项选择题","answer":"A","stem":"根据《中华人民共和国宪法》第 34 条的规定，下列属于公民民主权利的是（   ）。","options":{"A":"选举权和被选举权","B":"劳动权","C":"受教育权","D":"休息权"},"explanation":"公民权利保障：公民享有选举权和被选举权（第 34 条）、批评建议权（第 41 条）等\n\n广泛民主权利。B 项错误，C 项错误，D 项错误，休息权规定于宪法第 43 条。上述权利均属\n\n社会经济文化权利，不是选举权和被选举权。","clips":[]},{"n":44,"kind":"单项选择题","answer":"A","stem":"根据《旅游法》的规定，由于公共交通经营者的原因造成旅游者人身损害、财产损失的，（   ）旅行社应当协助旅游者向公共交通经营者索赔。","options":{"A":"仅由公共交通经营者承担赔偿责任","B":"由公共交通经营者依法承担主要责任","C":"旅行社应当承担连带责任","D":"旅行社应当承担补充责任"},"explanation":"《旅游法》第 71 条规定，由于公共交通经营者的原因造成旅游者人身损害、财产损\n\n失的，由公共交通经营者依法承担赔偿责任，旅行社应当协助旅游者向公共交通经营者索赔。","clips":[]},{"n":45,"kind":"单项选择题","answer":"D","stem":"《旅游法》规定，旅行社应当按照规定交纳（   ），用于旅游者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","options":{"A":"旅游风险抵押金","B":"旅游权益损害赔偿金","C":"旅游安全保障金","D":"旅游服务质量保证金"},"explanation":"《旅游法》第 31 条规定，旅行社应当按照规定交纳旅游服务质量保证金，用于旅游\n\n者权益损害赔偿和垫付旅游者人身安全遇有危险时紧急救助的费用。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":46,"kind":"单项选择题","answer":"B","stem":"《旅游法》规定，因未达到约定人数不能出团的，组团社经征得旅游者书面同意，可以委托其他旅行社履行合同，（    ）。","options":{"A":"组团社对旅游者承担责任，受委托的旅行社也对旅游者承担责任","B":"组团社对旅游者承担责任，受委托的旅行社对组团社承担责任","C":"组团社和受委托的旅行社均可以旅游者承担责任","D":"根据情况，旅游者可以选择组团社或受委托的旅行社承担责任"},"explanation":"《旅游法》第 63 条第 2 款规定，因未达到约定人数不能出团的，组团社经征得旅游\n\n者书面同意，可以委托其他旅行社履行合同。组团社对旅游者承担责任，受委托的旅行社对\n\n组团社承担责任。旅游者不同意的，可以解除合同。","clips":[]},{"n":47,"kind":"单项选择题","answer":"D","stem":"根据《旅游法》的规定，导游员小张所带的旅游团队遭遇山洪，为保护旅游者人身和财产安全，经旅行社同意租用直升机将旅游者撤离到安全区域，为此支出的费用应当由（          ）承担。","options":{"A":"旅行社承担","B":"旅游者承担","C":"旅行社或旅游者承担","D":"旅行社和旅游者分担"},"explanation":"《旅游法》第 67 条规定，因不可抗力危及旅游者人身、财产安全的，旅行社应当采\n\n取相应的安全措施，因此支出的费用，由旅行社与旅游者分担。","clips":[]},{"n":48,"kind":"单项选择题","answer":"B","stem":"根据《民法典》的规定，自然人（        ）具有民事权利能力，依法享有民事权利，承担民事义务。","options":{"A":"从出生时起至 18 岁时止","B":"从出生时起至死亡时止","C":"从 18 岁时起至死亡时止","D":"从具有劳动能力时起至退休时止"},"explanation":"《民法典》第 13 条规定，自然人从出生时起到死亡时止，具有民事权利能力，依法\n\n享有民事权利，承担民事义务。","clips":[]},{"n":49,"kind":"单项选择题","answer":"A","stem":"合同债权人将合同权利全部或部分转让给第三人的，（       ）。","options":{"A":"应当通知债务人","B":"应当经债务人同意","C":"应当办理审批手续","D":"应当经相关部门批准"},"explanation":"《民法典》第 546 条规定，债权人转让债权，未通知债务人的，该转让对债务人不\n\n发生效力。","clips":[]},{"n":50,"kind":"单项选择题","answer":"B","stem":"当事人可以约定一方向对方给付定金作为债权担保，收受定金的一方不履行约定的债务，致使不能实现合同目的的，应当（       ）返还定金。","options":{"A":"5 倍","B":"2 倍","C":"3 倍","D":"10 倍"},"explanation":"《民法典》第 587 条规定，债务人履行债务的，定金应当抵作价款或者收回。给付\n\n定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，无权请求返还\n\n定金；收受定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应\n\n当双倍返还定金。","clips":[]},{"n":51,"kind":"单项选择题","answer":"B","stem":"合同法定解除的情形不包括（     ）。","options":{"A":"当事人一方迟延履行致使不能实现合同目的","B":"合同履行期间发生不可抗力","C":"在履行期限届满之前，当事人一方明确表示不履行主要债务","D":"当事人一方迟延履行主要债务，经催告后在合同期限内仍未履行"},"explanation":"《民法典》第 563 条规定，有下列情形之一的，当事人可以解除合同：\n\n因不可抗力致使不能实现合同目的；\n\n在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；\n\n当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；\n\n当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；\n\n法律规定的其他情形。\n\n以持续履行的债务为内容的不定期合同，当事人可以随时解除合同，但是应当在合理期限之\n\n前通知对方。\n\n“合同履行期间发生不可抗力”错在，不仅发生不可抗力，而是不可抗力导致合同目的不能\n\n实现，才可以法定解除。","clips":[]},{"n":52,"kind":"单项选择题","answer":"B","stem":"根据《民法典》的规定，限制民事行为能力人实施的民事法律行为需要经法定代理人同意或者追认后有效的，相对人可以催告法定代理人自收到通知之日起（          ）内予以追认。","options":{"A":"15 日","B":"30 日","C":"60 日","D":"10 日"},"explanation":"限制民事行为能力人实施的纯获利益的民事法律行为或者与其年龄、智力、精神健\n\n康状况相适应的民事法律行为有效；实施的其他民事法律行为经法定代理人同意或者追认后\n\n有效。相对人可以催告法定代理人自收到通知之日起 30 日内予以追认。","clips":[]},{"n":53,"kind":"单项选择题","answer":"B","stem":"根据《旅游法》的规定，发生（            ）情形的，组团社不能仅将余款退还旅游者。","options":{"A":"旅游行程结束前，旅游者解除合同的","B":"旅行社非因法定情形，单方面解除合同的","C":"旅游行程开始后，旅游者解除合同的","D":"旅游者从事违法或者违反社会公德的活动的，旅行社解除合同的"},"explanation":"《旅游法》第 65、66 条规定，旅游者解除旅游合同后，旅行社在法定情形下解除合\n\n同时，组团社应当在扣除必要的费用后，将余款退还旅游者。\n\n旅行社非因法定情形，单方面解除合同的”组团社需要承担违约赔偿。","clips":[]},{"n":54,"kind":"单项选择题","answer":"B","stem":"以挂靠形式从事道路运输经营活动的机动车，发生交通事故造成损害，属于该机动车一方责任的，由（      ）。","options":{"A":"挂靠人承担责任","B":"挂靠人和被挂靠人承担连带责任","C":"被挂靠人承担责任","D":"挂靠人承担责任，被挂靠人承担补充责任"},"explanation":"《民法典》第 1211 条规定，以挂靠形式从事道路运输经营活动的机动车，发生交通\n\n事故造成损害，属于该机动车一方责任的，由挂靠人和被挂靠人承担连带责任。","clips":[]},{"n":55,"kind":"单项选择题","answer":"A","stem":"根据《民法典》相关规定，以下关于监护人责任的说法中正确的是（            ）。","options":{"A":"无民事行为能力人、限制民事行为能力人造成他人损害的，由监护人承担侵权责任","B":"监护人尽到监护责任的，可以减轻或免除其侵权责任","C":"有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，从监护人财产中支付赔偿费用","D":"监护人支付赔偿后的不足部分，由侵权人自行承担"},"explanation":"《民法典》第 1188 条规定，无民事行为能力人、限制民事行为能力人造成他人损害\n\n的，由监护人承担侵权责任。监护人尽到监护职责的，可以减轻其侵权责任。有财产的无民\n\n事行为能力人、限制民事行为能力人造成他人损害的，从本人财产中支付赔偿费用；不足部\n\n分，由监护人赔偿。","clips":[]},{"n":56,"kind":"单项选择题","answer":"A","stem":"《中华人民共和国旅游法》规定，旅行社聘用导游或领队要求导游垫付或者向导游收取费用的，由旅游主管部门责令改正，没收违法所得，并（             ）。","options":{"A":"处 5000 元以上 5 万元以下罚款","B":"处 1000 元以上 1 万元以下罚款","C":"处 3000 元以上 3 万元以下罚款","D":"处 2000 元以上 2 万元以下罚款"},"explanation":"《中华人民共和国旅游法》旅行社聘用导游或领队要求导游垫付或者向导游收取费\n\n用的，由旅游主管部门责令改正，没收违法所得，并处 5000 元以上 5 万元以下罚款；情节\n\n严重的，责令停业整顿或者吊销旅行社业务经营许可证。","clips":[]},{"n":57,"kind":"单项选择题","answer":"A","stem":"根据《旅游法》的规定，旅行社应当提示参加团队旅游的旅游者按照规定投保（              ）。","options":{"A":"人身意外伤害保险","B":"旅行社责任保险","C":"交通意外保险","D":"综合意外保险"},"explanation":"《旅游法》第 61 条规定，旅行社应当提示参加团队旅游的旅游者按照规定投保人身\n\n意外伤害保险。","clips":[]},{"n":58,"kind":"单项选择题","answer":"B","stem":"根据《旅行社条例》的规定，旅行社在银行存入质量保证金的，应当设立独立账户，存期由旅行社确定，但不得少于（           ）。","options":{"A":"一个月","B":"一年","C":"六个月","D":"两年"},"explanation":"旅行社在银行存入质量保证金的，应当设立独立账户，存期由旅行社确定，但不得\n\n少于 1 年。","clips":[]},{"n":59,"kind":"单项选择题","answer":"C","stem":"《旅游法》规定，为旅游者提供交通、住宿、餐饮、娱乐等服务的经营者，应当符合法律、法规规定的要求，按照（     ）履行义务。","options":{"A":"法律规定","B":"市场标准","C":"合同约定","D":"行业标准"},"explanation":"《旅游法》第 49 条规定，为旅游者提供交通、住宿、餐饮、娱乐等服务的经营者，\n\n应当符合法律、法规规定的要求，按照合同约定履行义务。","clips":[]},{"n":60,"kind":"单项选择题","answer":"A","stem":"依据《在线旅游经营服务管理暂行规定》，平台内经营者与旅游者发生旅游纠纷的，平台经营者应当积极协助旅游者维护合法权益。鼓励（      ）先行赔付。","options":{"A":"平台经营者","B":"平台内经营者","C":"自建网站经营者","D":"平台内经营者或平台经营者"},"explanation":"解析依据《在线旅游经营服务管理暂行规定》第 21 条，平台内经营者与旅游者发生\n\n旅游纠纷的，平台经营者应当积极协助旅游者维护合法权益。鼓励平台经营者先行赔付。","clips":[]},{"n":61,"kind":"单项选择题","answer":"C","stem":"某旅行社经营出境和入境旅游业务，2021 年设立了一家经营入境和出境旅游业务的分社和一家经营入境旅游业务和国内旅游业务的分社，并设立了两个服务网点。根据《旅行社条例》，该旅行社应当存入质量保证金账户的金额共计（     ）。","options":{"A":"175 万元","B":"155 万元","C":"180 万元","D":"190 万元"},"explanation":"经营入境旅游业务和国内旅游业务，同时还经营出境旅游业务的旅行社，存入质量\n\n保证金为 140 万元。如果该分社既经营国内旅游业务，又经营入境旅游业务，还经营出境旅\n\n游业务，则应当向其质量保证金账户增存 35 万元；每设立 1 个经营国内旅游业务和入境旅\n\n游业务的分社，应当增存 5 万元；设立服务网点不需要增存质量保证金。 140 + 3 5 + 5 =\n\n180 万。","clips":[]},{"n":62,"kind":"单项选择题","answer":"D","stem":"导游员小张在带团过程中强迫旅游者进购物店购物三次，根据《旅行社服务质量赔偿标准》的规定，旅行社应当按照旅游费用总额的（      ）向旅游者支付违约金。","options":{"A":"10%","B":"30%","C":"40%","D":"60%"},"explanation":"强迫或者变相强迫旅游者购物的，每次向旅游者支付旅游费用总额 20% 的违约金。\n\n注意，题干强迫旅游者进购物店购物三次，每次      20% ，因此答案是 60% 。","clips":[]},{"n":63,"kind":"单项选择题","answer":"D","stem":"《旅游法》规定，未取得导游证从事导游活动的，由旅游主管部门责令改正，没收违法所得，并处（       ）罚款，予以公告。","options":{"A":"2000 元以上 1 万元以下","B":"1000 元以上 3 万元以下","C":"2000 元以上 2 万元以下","D":"1000 元以上 1 万元以下"},"explanation":"《旅游法》第 102 条规定，未取得导游证从事导游活动的，由旅游主管部门责令改\n\n正，没收违法所得，并处 1000 元以上 1 万元以下罚款，予以公告。","clips":[]},{"n":64,"kind":"单项选择题","answer":"C","stem":"根据《导游管理办法》的规定，旅行社有下列哪些行为的，导游有权向劳动行政部门投诉举报、申请仲裁或者向人民法院提起诉讼？","options":{"A":"不依法与临时聘用的导游订立劳务合同的","B":"不依法为临时聘用的导游缴纳社会保险费用的","C":"要求聘用导游缴纳自身社会保险费用的","D":"支付导游的报酬低于当地平均工资标准的"},"explanation":"《导游管理办法》第 27 条规定，旅行社有下列行为之一的，导游有权向劳动行政部\n\n门投诉举报、申请仲裁或者向人民法院提起诉讼：\n\n（1）不依法与聘用的导游订立劳动合同的；（2）不依法向聘用的导游支付劳动报酬、导游\n\n服务费用或者缴纳社会保险费用的；（3）要求导游缴纳自身社会保险费用的；（4）支付导游\n\n的报酬低于当地最低工资标准的。\n\n本题中，C 项分别符合第（3）项规定，属于明确禁止的侵权行为，导游可依法维权。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":65,"kind":"单项选择题","answer":"B","stem":"《导游管理办法》规定，申请取得导游证，申请人与经常执业地区的旅行社订立劳动合同的确认信息，旅行社应当自申请人提交申请之日起（      ）内确认。","options":{"A":"3 个工作日","B":"5 个工作日","C":"7 个工作日","D":"10 个工作日"},"explanation":"《导游管理办法》第 10 条规定，申请取得导游证，申请人应当通过全国旅游监管服\n\n务信息系统填写申请信息，并提交下列申请材料：\n\n（1）身份证的扫描件或者数码照片等电子版；（2）未患有传染性疾病的承诺；（3）无过失\n\n犯罪以外的犯罪记录的承诺；（4）与经常执业地区的旅行社订立劳动合同或者在经常执业地\n\n区的旅游行业组织注册的确认信息。前款第（4）项规定的信息，旅行社或者旅游行业组织\n\n应当自申请人提交申请之日起 5 个工作日内确认。","clips":[]},{"n":66,"kind":"单项选择题","answer":"A","stem":"根据《导游管理办法》的规定，下列关于导游执业规范的说法，正确的是（    ）。","options":{"A":"应当携带电子导游证","B":"应当携带导游身份标识","C":"旅游者有权查验导游电子导游证","D":"旅游者有权查验导游身份标识"},"explanation":"《导游管理办法》第 20 条规定：“导游在执业过程中应当携带电子导游证、佩戴导\n\n游身份标识，并开启导游执业相关应用软件。旅游者有权要求导游展示电子导游证和导游身\n\n份标识。”因此，A 项完全正确。","clips":[]},{"n":67,"kind":"单项选择题","answer":"B","stem":"根据《导游管理办法》的规定，具有下列（   ）情形的，应当由所在地旅游主管部门给予注销导游证。","options":{"A":"对不具备申请资格的申请人核发导游证的","B":"导游证被依法吊销的","C":"申请人以欺骗、贿赂等不正当手段取得导游证的","D":"对不符合法定条件的申请人核发导游证的"},"explanation":"《导游管理办法》第 17 条规定，有下列情形之一的，所在地旅游主管部门应当注销\n\n导游证：\n\n① 导游死亡的； ② 导游证有效期届满未申请换发导游证的； ③ 导游证依法被撤销、吊\n\n销的； ④ 导游与旅行社订立的劳动合同解除、终止或者在旅游行业组织取消注册后，超过\n\n3 个月未与其他旅行社订立劳动合同或者未在其他旅游行业组织注册的； ⑤ 取得导游证后\n\n出现本办法第 12 条不予核发导游证情形第（1）项至第（3）项的； ⑥ 依法应当注销导游\n\n证的其他情形。导游证被注销后，导游符合法定执业条件需要继续执业的，应当依法重新申\n\n请取得导游证。B 项完全符合第（5）项规定。其余三项为导游被撤销导游证的情形。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":68,"kind":"单项选择题","answer":"B","stem":"依据《治安管理处罚法》的规定，违反治安管理行为在（   ）以内没有被公安机关发现的，不再处罚。","options":{"A":"3 个月","B":"6 个月","C":"12 个月","D":"24 个月"},"explanation":"解析依据第 25 条，违反治安管理行为在 6 个月以内没有被公安机关发现的，不再处\n\n罚；期限从行为发生之日起计算，行为有连续或者继续状态的，从行为终了之日起计算。","clips":[]},{"n":69,"kind":"单项选择题","answer":"C","stem":"根据《治安管理处罚法》第 28 条的规定，因扰乱体育比赛、文艺演出活动秩序被处以拘留处罚的，可以同时责令其（        ）以内不得进入同类场馆观看同类比赛、演出。","options":{"A":"三个月至一年","B":"三个月至 6 个月","C":"六个月至一年","D":"两年内"},"explanation":"《治安管理处罚法》第 28 条规定，因扰乱体育比赛、文艺演出活动秩序被处以拘留\n\n处罚的，可以同时责令其六个月至一年以内不得进入体育场馆、演出场馆观看同类比赛、演\n\n出。","clips":[]},{"n":70,"kind":"单项选择题","answer":"C","stem":"根据《消费者权益保护法》的规定，经营者提供的机动车、计算机、电视机、电冰箱、空调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起（        ）内发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。","options":{"A":"1 个月","B":"3 个月","C":"6 个月","D":"1 年内"},"explanation":"《消费者权益保护法》规定，经营者提供的机动车、计算机、电视机、电冰箱、空\n\n调器、洗衣机等耐用商品或者装饰装修等服务，消费者自接受商品或者服务之日起 6 个月内\n\n发现瑕疵，发生争议的，由经营者承担有关瑕疵的举证责任。","clips":[]},{"n":71,"kind":"单项选择题","answer":"B","stem":"根据《旅游投诉处理办法》的规定，以下（     ）属于旅游投诉的地域管辖范围。","options":{"A":"投诉者所在地","B":"旅游合同签订地","C":"损害结果发生地","D":"旅游合同解除地"},"explanation":"《旅游投诉处理办法》第 5 条规定：“旅游投诉由旅游经营者住所地、旅游合同签订\n\n地或者旅游纠纷发生地县级以上旅游投诉处理机构管辖。需要立即制止、纠正旅游经营者的\n\n损害行为的，应当由旅游纠纷发生地旅游投诉处理机构管辖。”需要即时制止、纠正的情形\n\n以旅游纠纷发生地管辖，便于快速处置，防止损害扩大。","clips":[]},{"n":72,"kind":"单项选择题","answer":"D","stem":"根据《旅游投诉处理办法》的规定，以下（     ）属于旅游投诉的实质要件。","options":{"A":"投诉人与投诉事项有间接利害关系","B":"有明确的投诉人","C":"旅游投诉书","D":"具体的投诉请求"},"explanation":"《旅游投诉管理办法》第 9 条，旅游投诉应当符合下列条件：\n\n（1）投诉人与投诉事项有直接利害关系；\n\n（2）有明确的被投诉人、具体的投诉请求。\n\n旅游投诉可以口头投诉，故不是必须条件。","clips":[]},{"n":73,"kind":"单项选择题","answer":"C","stem":"根据《旅游投诉处理办法》第 23 条的规定，旅游投诉处理机构应当在受理旅游投诉之日起（        ）以内作出处理。","options":{"A":"30 日","B":"45 日","C":"60 日","D":"90 日"},"explanation":"《旅游投诉处理办法》第 23 条规定：“旅游投诉处理机构应当在受理旅游投诉之日\n\n起六十日以内，作出以下处理：（一）达成调解协议的，应当制作《旅游投诉调解书》，由投\n\n诉人与被投诉人签字、盖章或者以适当方式确认，并加盖旅游投诉处理机构公章；（二）调\n\n解不成的，应当终止调解，制作《旅游投诉终止调解书》，并以适当方式告知投诉人与被投\n\n诉人。”","clips":[]},{"n":74,"kind":"单项选择题","answer":"B","stem":"旅行社责任保险的保险范围不包括（    ）。","options":{"A":"因旅行社疏忽或过失应当承担赔偿责任的","B":"因旅行社重大过失应当承担赔偿责任的","C":"因发生意外事故旅行社应当承担赔偿责任","D":"国务院旅游主管部门会同中国保险监督管理委员会规定的其他情形"},"explanation":"保险公司是以盈利为目的的公司，旅行社重大过失应当承担赔偿责任的，保险公司\n\n不会理赔。","clips":[]},{"n":75,"kind":"单项选择题","answer":"D","stem":"《旅游安全管理办法》规定，旅游突发事件实行报告制度，以下说法正确的是（   ）。","options":{"A":"一般旅游突发事件上报至县级旅游主管部门","B":"较大旅游突发事件逐级上报至设区的市级旅游主管部门","C":"重大旅游突发事件逐级上报至省级旅游主管部门","D":"特别重大旅游突发事件逐级上报至文化和旅游部"},"explanation":"各级旅游主管部门应当建立旅游突发事件报告制度。旅游主管部门在接到旅游经营\n\n者的报告后，应当向同级人民政府和上级旅游主管部门报告。一般旅游突发事件上报至设区\n\n的市级旅游主管部门；较大旅游突发事件逐级上报至省级旅游主管部门；重大和特别重大旅\n\n游突发事件逐级上报至文化和旅游部。","clips":[]},{"n":76,"kind":"单项选择题","answer":"C","stem":"《旅游安全管理办法》规定，旅行社组织出境旅游，应当制作（   ）。","options":{"A":"应急联络卡","B":"个人健康卡","C":"安全信息卡","D":"紧急救援卡"},"explanation":"旅游安全管理办法》第 12 条，旅行社组织出境旅游，应当制作安全信息卡。","clips":[]},{"n":77,"kind":"单项选择题","answer":"B","stem":"根据《中华人民共和国民用航空法》的规定，收货人于货物到达目的地点，有权要求承运人交付货物的前提是（      ）。","options":{"A":"已经取得航空货运单原件","B":"缴付应付款项并履行运输条件","C":"取得托运人的书面授权","D":"货物已经完成海关查验"},"explanation":"第 124 条，收货人于货物到达目的地点，并在缴付应付款项和履行运输条件后，有\n\n权要求承运人交付货物。\n\nA 项错误，法律并未要求收货人必须持有航空货运单原件方可提货。\n\nB 项正确，收货人应当在缴付应付款项并履行运输条件后，才有权要求承运人交付货物。\n\nC 项错误，收货人基于运输合同享有提货权利，不以托运人书面授权为前提。\n\nD 项错误，海关查验不是收货人提货的法定前提条件。","clips":[]},{"n":78,"kind":"单项选择题","answer":"B","stem":"根据《铁路法》的规定，铁路运输企业应当对承运的货物、包裹、行李自接受承运时起到交付时止发生的灭失、短少、变质、污染或者损坏，承担赔偿责任。旅客根据自愿申请办理行李保价运输的，按照（      ），但最高不超过保价额。","options":{"A":"实际保价额赔偿","B":"实际损失赔偿","C":"最高赔偿限额","D":"声明价格赔偿"},"explanation":"《铁路法》第 17 条规定，铁路运输企业应当对承运的货物、包裹、行李自接受承运\n\n时起到交付时止发生的灭失、短少、变质、污染或者损坏，承担赔偿责任。托运人或者旅客\n\n根据自愿申请办理保价运输的，按照实际损失赔偿，但最高不超过保价额。","clips":[]},{"n":79,"kind":"单项选择题","answer":"C","stem":"根据《娱乐场所管理条例》的规定，娱乐场所依法取得营业执照和相关批准文件、许可证后，应当在（       ）内向所在地县级公安部门备案。","options":{"A":"7 日","B":"7 个工作日","C":"15 日","D":"15 个工作日"},"explanation":"《娱乐场所管理条例》规定，娱乐场所依法取得营业执照和相关批准文件、许可证\n\n后，应当在 15 日内向所在地县级公安部门备案。","clips":[]},{"n":80,"kind":"单项选择题","answer":"B","stem":"根据《风景名胜区条例》的规定，在国家级风景名胜区内修建缆车、索道等重大建设工程，项目选址方案应当报（           ）核准。","options":{"A":"国务院林业草原主管部门","B":"省、自治区、直辖市人民政府林业草原主管部门","C":"县级以上人民政府林业草原主管部门","D":"风景名胜区管理机构"},"explanation":"《风景名胜区条例》第二十八条：在风景名胜区内从事本条例第二十六条、第二十\n\n七条禁止范围以外的建设活动，应当经风景名胜区管理机构审核后，依照有关法律、法规的\n\n规定办理审批手续。在国家级风景名胜区内修建缆车、索道等重大建设工程，项目的选址方\n\n案应当报省、自治区、直辖市人民政府林业草原主管部门核准。A 项错误，国务院林业草原\n\n主管部门负责全国监督管理，不负责缆车、索道等重大建设工程选址方案的核准。B 项正确，\n\n符合条例第二十八条第二款关于选址方案核准机关的规定。C 项错误，县级以上人民政府林\n\n业草原主管部门，层级不符合法条规定，故错误。D 项错误，风景名胜区管理机构负责区内\n\n相关活动的审核，不承担重大建设工程选址方案的核准职权。","clips":[]},{"n":81,"kind":"单项选择题","answer":"C","stem":"依照《博物馆条例》的规定，博物馆违法从事非文物藏品的商业经营活动，没有违法所得的，处以（       ）罚款。","options":{"A":"2000 元以上 5000 元以下","B":"2000 元以上 1 万元以下","C":"5000 元以上 2 万元以下","D":"5000 元以上 5 万元以下"},"explanation":"此种情形下，由相关部门责令改正，有违法所得的，没收违法所得，并处违法所得\n\n2 倍以上 5 倍以下罚款；没有违法所得的，处 5000 元以上 2 万元以下罚款；情节严重的，\n\n由登记管理机关撤销登记。","clips":[]},{"n":82,"kind":"单项选择题","answer":"C","stem":"习近平法治思想强调，全面依法治国最广泛、最深厚的基础是（         ）。","options":{"A":"中国共产党","B":"以宪法为核心的法律体系","C":"人民","D":"社会主义制度"},"explanation":"习近平法治思想强调，要坚持以人民为中心。全面依法治国最广泛、最深厚的基础\n\n是人民，必须坚持为了人民、依靠人民。要把体现人民利益、反映人民愿望、维护人民权益、\n\n增进人民福祉落实到全面依法治国各领域全过程。","clips":[]},{"n":83,"kind":"单项选择题","answer":"B","stem":"依据习近平新时代中国特色社会主义思想相关理论，（          ）是马克思主义的本质属性。","options":{"A":"实践性","B":"人民性","C":"开放性","D":"科学性"},"explanation":"人民性是马克思主义的本质属性，党的理论是来自人民、为了人民、造福人民的理\n\n论，人民的创造性实践是理论创新的不竭源泉。\n\nA 项错误，实践性是马克思主义的基本特征，但文档明确规定人民性为马克思主义的本质属\n\n性。\n\nB 项正确。\n\nC 项错误，开放性并非马克思主义本质属性。\n\nD 项错误，科学性是马克思主义的特征，但不是本质属性。","clips":[]},{"n":84,"kind":"单项选择题","answer":"C","stem":"依据法律规定，以下场所中（         ）无须悬挂国徽。","options":{"A":"乡镇人民代表大会会场","B":"人民大会堂","C":"公安机关","D":"各级人民法院和专门人民法院的审判庭"},"explanation":"下列场所应当悬挂国徽：北京天安门城楼、人民大会堂；县级以上各级人民代表大\n\n会及其常务委员会会议厅，乡、民族乡、镇的人民代表大会会场；各级人民法院和专门人民\n\n法院的审判庭；宪法宣誓场所；出境入境口岸的适当场所。","clips":[]},{"n":85,"kind":"单项选择题","answer":"B","stem":"中央人民政府对香港特别行政区有关的国家安全事务负有（     ）。","options":{"A":"宪制责任","B":"根本责任","C":"主要责任","D":"基本责任"},"explanation":"《港区国安法》第 3 条规定，中央人民政府对香港特别行政区有关的国家安全事务\n\n负有根本责任。","clips":[]},{"n":86,"kind":"单项选择题","answer":"A","stem":"《关于推动在线旅游市场高质量发展的意见》提到的“两个作用”是指（    ）。","options":{"A":"市场和政府的作用","B":"企业和个人的作用","C":"高速和高质量的作用","D":"供给和需求的作用"},"explanation":"《意见》（一）指导思想明确提出：“充分发挥市场在资源配置中的决定性作用，更\n\n好发挥政府作用”。这“两个作用”是新时代经济治理的核心理念。因此，A 项正确。","clips":[]},{"n":87,"kind":"单项选择题","answer":"C","stem":"世界上组织出国包价旅游的开端是（     ）。","options":{"A":"1846 年苏格兰之行","B":"1845 年利物浦之行","C":"1855 年巴黎之行","D":"1872 年北美之行"},"explanation":"1855 年，跨国包价旅游的开端：组织从莱斯特到巴黎的旅游（游览 4 天）；一次性\n\n包价（含往返交通费和住宿费）世界上组织出国包价旅游的开端。","clips":[]},{"n":88,"kind":"单项选择题","answer":"A","stem":"1927 年，陈光甫创办中国第一本旅游刊物（    ）。","options":{"A":"《旅行杂志》","B":"《旅游杂志》","C":"《民国游记》","D":"《民国旅游》"},"explanation":"1927 年，陈光甫创办中国第一本旅游刊物《旅行杂志》。","clips":[]},{"n":89,"kind":"单项选择题","answer":"B","stem":"1954 年，（   ）成立。","options":{"A":"中国旅行社","B":"中国国际旅行社","C":"中国青年旅行社","D":"海外旅行社"},"explanation":"1954 年 4 月 15 日: 中国国际旅行社 (以下称“国旅”) 总社在北京成立, 上海等\n\n12 城设分支社。","clips":[]},{"n":90,"kind":"单项选择题","answer":"B","stem":"（   ）年，举行全国导游资格考试。","options":{"A":"1988","B":"1989","C":"1990","D":"1991"},"explanation":"1989 年：举行全国导游资格考试（每年一次）。","clips":[]},{"n":91,"kind":"单项选择题","answer":"D","stem":"下列选项中，按照技术等级划分的是（       ）。","options":{"A":"专职导游","B":"外语导游","C":"地陪导游","D":"高级导游"},"explanation":"根据 2025 年 3 月 1 日起施行的《导游等级考核管理办法》，我国导游等级分为初级、\n\n中级、高级、特级四个等级，全国实行统一的导游等级考核制度。","clips":[]},{"n":92,"kind":"单项选择题","answer":"D","stem":"下列关于领队职责的描述，错误的是（       ）。","options":{"A":"遵守外事纪律，维护国家利益和民族尊严","B":"向旅游者说明旅游目的地法律法规、风土人情及风俗习惯","C":"领队代表组团社监督地接社和地陪履行旅游合同","D":"主动将外国特产介绍给旅游者，并正确引导他们购买"},"explanation":"领队应恪守职业道德，遵守外事纪律，维护国家利益和民族尊严，提醒旅游者抵制\n\n有损国家利益和民族尊严的言行。\n\n向旅游者说明旅游目的地法律法规、风土人情及风俗习惯等，提供全程陪同服务，并在旅游\n\n行程的各个环节宣讲文明旅游注意事项，引导文明旅游；\n\n领队代表组团社监督地接社和地陪履行旅游合同，按照组团社的行程计划兑现接待服务承诺，\n\n监督其执行接待标准和保证服务质量，维护组团社和旅游者的合法权益。","clips":[]},{"n":93,"kind":"单项选择题","answer":"B","stem":"导游在着装时，服装颜色不宜超过（    ）。","options":{"A":"2 种","B":"3 种","C":"4 种","D":"5 种"},"explanation":"全身颜色不宜超过 3 种。","clips":[]},{"n":94,"kind":"单项选择题","answer":"D","stem":"下列关于导游交谈礼仪的描述，正确的一项是（        ）。","options":{"A":"导游与旅游者交谈过程中态度霸气，稳重，需要引领团队","B":"导游与旅游者交谈时要选择自己擅长的领域","C":"只能适度的拿旅游者的缺点和不足来开玩笑","D":"导游对一件事不了解，不要随意地去质疑、不要打断、纠正对方"},"explanation":"导游与旅游者交谈过程中态度要谦虚诚恳，说话要平和沉稳；导游与旅游者交谈时\n\n要选择对方感兴趣的话题或是彼此都感兴趣的话题，或是对方比较擅长的领域；导游与旅游\n\n者交谈时，切记不能拿旅游者的缺点和不足来开玩笑，懂得尊重旅游者；当导游对一件事不\n\n了解的时候，就不要随意地去质疑、不要打断、纠正对方。","clips":[]},{"n":95,"kind":"单项选择题","answer":"A","stem":"导游电话礼仪应该遵循的原则是（    ）。","options":{"A":"通话内容应简明扼要、直言主题","B":"通话结束后，应主动接电话","C":"时间以适中为佳，不要着急把话讲完","D":"一般选择在休息时间打电话，别耽误办公"},"explanation":"除非有急事，一般不要在休息时间、用餐之时打电话；通话时间以短为佳、宁短勿\n\n长，一般限定在 3 分钟之内；通话内容应简明扼要、长话短说、直言主题。","clips":[]},{"n":96,"kind":"单项选择题","answer":"C","stem":"导游在接团前，要准备一些交谈的话题，下面内容中应避免出现的话题是（   ）。","options":{"A":"当前热门话题","B":"国内外重大新闻","C":"宗教纷争问题","D":"当地的美食推荐和饮食文化"},"explanation":"交谈话题知识：当前热门话题；国内外重大新闻；旅游者可能感兴趣的话题；旅游\n\n者国家（地区）知识准备。","clips":[]},{"n":97,"kind":"单项选择题","answer":"B","stem":"地陪导游在客人用餐过程中，（    ）","options":{"A":"无需巡视","B":"应巡视 1-2 次","C":"应巡视 2-3 次","D":"应巡视不少于 3 次"},"explanation":"用餐过程中，地陪应巡视旅游团用餐情况 1 一 2 次。","clips":[]},{"n":98,"kind":"单项选择题","answer":"C","stem":"在带领游客购物时，地陪操作正确的选项是（   ）。","options":{"A":"不得擅自增加购物次数，但是可以适当延长停留时间","B":"只能向旅游者兜售旅游当地特色物品，其他不可","C":"可以向游客介绍本地商品的特色及选购方法","D":"入境旅游者要购买麝香、犀牛角和虎骨等，明确告知只能少量购买"},"explanation":"禁止擅自增加购物次数或延长停留时间，不得向旅游者兜售任何物品；地陪应向旅\n\n游团清晰说明购物场所的停留时间以及购物过程中的相关注意事项，并详细介绍本地商品的\n\n特色及选购方法，重点突出商品的实用性、收藏性、装饰性、纪念性等特点；当入境旅游者\n\n购买特殊商品（如中药或中药制成品）时，应推荐其前往质量可靠、信誉良好的大型药店，\n\n并明确告知我国海关关于药品携带出境的限额规定（即合理自用范围），特别强调海关严禁\n\n携带麝香、犀牛角和虎骨等中药材出境。","clips":[]},{"n":99,"kind":"单项选择题","answer":"D","stem":"（    ）不属于送行前业务准备的范畴。","options":{"A":"核对交通票据","B":"提醒注意事项","C":"及时归还证件","D":"收集反馈意见"},"explanation":"核对交通票据；提醒注意事项；商定出发时间；及时归还证件。","clips":[]},{"n":100,"kind":"单项选择题","answer":"B","stem":"下列选项中，对全陪首次接待入境团的描述，不正确的是（     ）。","options":{"A":"应在接团前一日与首站接待社取得联系，了解接待工作详细安排情况","B":"与首站地陪一起提前 20 分钟到达接站地点，迎候旅游团","C":"协助地陪认找应接旅游团，防止错接","D":"接到旅游团后，全陪要向领队和游客问好，进行自我介绍，并介绍地陪"},"explanation":"（1）提前联系接待社：全陪应在接团前一日与首站接待社取得联系，了解接待工作\n\n详细安排情况强调提前沟通的重要性；\n\n（2）提前到达接站地点：与首站地陪一起提前 30 分钟到达接站地点，迎候旅游团强调时间\n\n要求；\n\n（3）协助认找旅游团：协助地陪认找应接旅游团，防止错接强调合作与避免失误；\n\n（4）向领队和旅游者问好：接到旅游团后，全陪要向领队和游客问好，进行自我介绍，并\n\n介绍地陪强调初次接触的礼节和人员介绍。\n\n（5）确认实到人数：立即询问确认实到人数，与接待计划不符时，及时通报组团社，由其\n\n通知各站地接社。","clips":[]},{"n":101,"kind":"单项选择题","answer":"D","stem":"游客出境前，应确认自己的护照有效期，一般应在（     ）以上。","options":{"A":"一个月","B":"三个月","C":"六个月","D":"一年"},"explanation":"检查护照有效期：护照剩余有效期一般应在一年以上。","clips":[]},{"n":102,"kind":"单项选择题","answer":"A","stem":"某旅游团在海边旅游，游客希望购买海龟，并让店家烹制，导游回绝，表示海龟是国家保护动物，禁止捕杀和交易。这是导游运用了拒绝方法中的（          ）。","options":{"A":"正面回绝法","B":"替代方案法","C":"婉转拒绝法","D":"拖延时间法"},"explanation":"正面回绝法：当旅游者提出不当要求时，导游可直接从正面给予回绝。在涉及原则\n\n性的大是大非问题面前，导游应当敢于正面回绝。","clips":[]},{"n":103,"kind":"单项选择题","answer":"B","stem":"在前往景区的车上，有两位游客在座位上大声交谈，影响他人休息。导游起身望向两人，同时轻声咳嗽两下，两人听到后马上压低声音。这里导游采用了（         ）。","options":{"A":"侧面迂回法","B":"间接暗示法","C":"正面引导法","D":"眼神交流法"},"explanation":"间接暗示法：发现问题时，导游既不直接明说，也不从侧面劝告，而是采用含蓄隐\n\n喻的动作或声音暗示旅游者接受劝告的方法。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":104,"kind":"单项选择题","answer":"B","stem":"（    ）常用于导游表达惭愧、爱护、沉思等情绪时。","options":{"A":"仰视法","B":"俯视法","C":"闭目法","D":"虚视法"},"explanation":"俯视法：导游讲话时低头，视线向下看低处。该法常用于导游表达惭愧、爱护、沉\n\n思等情绪时，和仰视法一样，也不宜过多使用。","clips":[]},{"n":105,"kind":"单项选择题","answer":"C","stem":"下列关于导游讲解时语速快慢的表述，正确的是（   ）。","options":{"A":"对于年龄较大、身份尊贵、性格平和者，应适当加快语速","B":"在安静地点、氛围欢快场合，可适当降低语速","C":"讲解重要内容或需强调信息时，应放慢语速","D":"对于中青年和好动者，则可适当降低语速"},"explanation":"1. 讲解对象：面对不同年龄、身份、性格的旅游者，应采取不同语速。对于年龄较\n\n大、身份尊贵、性格平和者，应放慢语速；对于中青年和好动者，则可适当提高语速。\n\n2. 讲解环境：在喧闹空间、庄严肃穆场合，应适当降低语速；在安静地点、氛围欢快场合，\n\n可适当提升语速。\n\n3. 讲解内容：讲解重要内容或需强调信息时，应放慢语速；提及无关紧要、众所周知或敏\n\n感内容时，可快速带过。","clips":[],"sourceNote":"题面根据解析卷中的完整题目整理。"},{"n":106,"kind":"单项选择题","answer":"C","stem":"例如在介绍苏州园林的造景手法时，可以这样讲：“古代造园家很讲究借景，就像计成在《园冶》中所说，要善于利用周围的自然景观来丰富园林的景色。”这段话中，导游采用了（       ）的方式。","options":{"A":"明引","B":"暗引","C":"意引","D":"语引"},"explanation":"意引：不直接引用原文，而是间接地引述原意，同样具备一定的说服力。\n\n例如在介绍苏州园林的造景手法时，可以这样讲：“古代造园家很讲究借景，就像计成在《园\n\n冶》中所说，要善于利用周围的自然景观来丰富园林的景色。”通过意引的方式，将专业的\n\n园林理论融入讲解中，使游客能够更容易地理解苏州园林独特的造景魅力。","clips":[]},{"n":107,"kind":"单项选择题","answer":"A","stem":"导游从白帝城讲起，这里因刘备托孤闻名；接着进入瞿塘峡，谈其险峻雄伟、山水壮阔；再进入巫峡，着重讲解巫山十二峰及云雾缭绕的迷人景色；然后是西陵峡，介绍其滩多水急的地理特点；最后抵达终点宜昌。导游在这段讲解中采用了（          ）。","options":{"A":"分段讲解法","B":"突出重点法","C":"触景生情法","D":"妙用数字法"},"explanation":"例如，可按空间位移顺序分段讲解长江三峡，乘船自西往东游览长江三峡，导游就\n\n可将其分为五个部分来讲解。先从白帝城讲起，这里因刘备托孤闻名；接着进入瞿塘峡，谈\n\n其险峻雄伟、山水壮阔；再进入巫峡，着重讲解巫山十二峰及云雾缭绕的迷人景色；然后是\n\n西陵峡，介绍其滩多水急的地理特点；最后抵达终点宜昌，讲述其作为三峡门户的重要地位\n\n及三峡大坝等现代化建设成果。","clips":[]},{"n":108,"kind":"单项选择题","answer":"C","stem":"在游览故宫时，游客对建筑感兴趣，导游应重点介绍故宫的建筑物及其特征、建筑布局和建筑艺术；游客对历史感兴趣，导游应重点讲解故宫的历史沿革。这是突出重点法中的（       ）运用。","options":{"A":"突出独特之处","B":"突出有代表性部分","C":"突出旅游者感兴趣的内容","D":"突出“最”“第一”"},"explanation":"导游应通过观察、交流，寻找旅游者普遍感兴趣的话题并展开讲解。\n\n举例：在游览故宫时，如游客对中国古代建筑感兴趣，导游应重点介绍故宫的建筑物及其特\n\n征、建筑布局和建筑艺术，并将中国古代宫殿建筑与民间建筑乃至西方国家的宫殿建筑进行\n\n比较；如果游客对中国历史尤其是明、清的历史感兴趣，导游应重点讲解故宫的历史沿革和\n\n在故宫发生的重大事件，使游客从故宫的介绍中加深对明、清历史的了解。","clips":[]},{"n":109,"kind":"单项选择题","answer":"D","stem":"下列选项中，导游在带领亲子团出行时把握准确的一项是（       ）。","options":{"A":"兼顾父母与孩子，关注父母为主","B":"涉及到费用的时候，不要提前沟通，要在当场确认","C":"提醒家长保护好孩子，导游避免过多介入","D":"具备高超的讲解技能，把握“深入浅出”的原则，多采用有情节的故事"},"explanation":"兼顾父母与孩子，引导亲子互动；\n\n导游须具备高超的讲解技能，把握“深入浅出”的原则，多采用有情节的故事、启发式和提\n\n问式讲解；\n\n导游应提前与家长沟通，清晰告知收费标准，并根据实际情况，在旅游期间，与家长密切配\n\n合，密切关注孩子的动向，确保其始终处于安全环境中。","clips":[]},{"n":110,"kind":"单项选择题","answer":"B","stem":"我国面积单位中，1 公顷等于（   ）亩。","options":{"A":"10","B":"15","C":"50","D":"100"},"explanation":"1 公顷=100 米的平方=10000 平方米；1 亩=666.67 平方米，所以 1 公顷=15 亩","clips":[]},{"n":111,"kind":"单项选择题","answer":"A","stem":"下列关于携带外币现钞出境的要求，描述正确的一项是（             ）。","options":{"A":"无论多少钱，如果不超过最近一次入境时申报外币现钞数额，不需申领《携带外汇出境许可证》","B":"携带金额≤等值 10000 美元的，不需申领《携带证》","C":"等值 10000 美元\u003c携带金额≤等值 20000 美元的，需要向银行申领《携带证》，出境时海关凭证验放。","D":"若加盖银行印章的《携带证》累计总额超过等值 20000 美元，海关不予放行"},"explanation":"携带外币现钞出境，如果不超过最近一次入境时申报外币现钞数额，不需申领《携\n\n带外汇出境许可证》（以下简称《携带证》），海关会凭最近一次入境时的外币现钞申报数额\n\n记录验放。如果没有或超出最近一次入境申报外币现钞数额记录的：\n\n（1）携带金额≤ 等值 5000 美元的，不需申领《携带证》，海关予以放行。（2）等值 5000\n\n美元 ＜携带金额≤ 等值 10000 美元的，需要向银行申领《携带证》，出境时海关凭证验放。\n\n对使用多张《携带证》的，若加盖银行印章的《携带证》累计总额超过等值 10000 美元，海\n\n关不予放行。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":112,"kind":"单项选择题","answer":"C","stem":"若旅游者在用餐前（   ）小时以上提出换餐，导游应尽量与餐厅联系。","options":{"A":"1","B":"2","C":"3","D":"4"},"explanation":"解析用餐前 3 小时提出换餐的处理，尽量与餐厅联系，事先向游客讲清楚如能换妥\n\n差价由旅游者自理，询问餐厅能否提供相应服务。","clips":[]},{"n":113,"kind":"单项选择题","answer":"C","stem":"部分旅游者提出更换计划内的文娱活动，导游操作正确的是（       ）。","options":{"A":"婉转拒绝","B":"向游客承诺更换","C":"若决定分路参与，在同一线路上，尽量为少数旅游者提供方便","D":"若不同路，则应为他们安排车辆，车费由旅行社承担"},"explanation":"与接待社计调部门联系，尽可能调换，但不要在未联系妥当之前许诺；如接待社无\n\n法调换，要向旅游者做好耐心解释工作，并说明票已订好，不能退换，请其谅解。\n\n若决定分路参与文娱活动，两个文娱活动地点在同一线路上，应与司机商量，尽量为少数旅\n\n游者提供方便，送他们到目的地；若不同路，则应为他们安排车辆，但车费自理。","clips":[],"sourceNote":"本题按试题卷选项判分。解析卷漏列了试题卷 C 项，且将 D 项的内容标成了 C。"},{"n":114,"kind":"单项选择题","answer":"D","stem":"为防止接待纠纷的产生，导游应（   ）。","options":{"A":"时刻维护旅行社利益","B":"安排活动只要按照合同即可，不需要跟游客沟通","C":"对不文明行为直接纠正或批评，避免其他游客模仿","D":"了解可能引发纠纷的矛盾诉求，帮助解决问题，必要时求助相关部门"},"explanation":"解析解析 1. 严格按合同执行旅游行程：旅游合同是实施行程的依据，保障双方利\n\n益，消除纠纷；2. 提前沟通：安排活动前多与旅游者沟通，征求意见，增强参与感，避免\n\n矛盾；3. 了解旅游者诉求：了解可能引发纠纷的矛盾诉求，帮助解决问题，必要时求助相\n\n关部门；4. 合理引导旅游者行为：对不文明行为通过单独沟通、小提示等方式引导，避免\n\n直接纠正或批评。旅游者激动时先引导冷静，再沟通。","clips":[]},{"n":115,"kind":"单项选择题","answer":"D","stem":"当游客发生溺水事故后，导游引导游客正确自救的做法是（        ）。","options":{"A":"将手臂上举扑腾，尽量引起别人注意","B":"呼吸时尽量用鼻吸气、用嘴呼气，以防呛水","C":"若遇腿部抽筋，可先深吸一口气，潜入水中搬动大腿","D":"若不慎将水吸入气管内，屏气到把嘴鼻露出水面，调整呼吸"},"explanation":"1. 保持镇定，节省体力溺水者不要手脚乱蹬，以节省体力，在野外还可防止水草缠\n\n绕；更不要将手臂上举扑腾，这样人会下沉得更快\n\n2. 放松身体，保持仰位落水后，溺水者应尽快踢掉鞋子，然后放松身体，尽可能保持仰位，\n\n使头部后仰露出嘴鼻部；呼吸时尽量用嘴吸气、用鼻呼气，以防呛水；吸气要深，呼气要浅，\n\n有助于身体浮在水面\n\n3. 若遇呛水，咳嗽调整若不慎在吸气时将水吸入气管内造成呛水，溺水者应保持冷静，克\n\n制住想咳嗽的感觉，屏气到把嘴鼻露出水面，然后通过咳嗽调整呼吸，待气管内的水分排出\n\n后，呼吸就能恢复正常\n\n4. 若遇抽筋，张手扳腿若遇到手指抽筋，可先将手握拳，再用力张开，反复操作，直至抽\n\n筋消除；\n\n若遇腿部抽筋，可先深吸一口气仰浮水上，用抽筋肢体对侧的手握住抽筋肢体的脚趾，再用\n\n力向身体方向拉，同时用同侧的手掌压住抽筋肢体的膝盖，帮助抽筋腿伸直，直至症状缓解","clips":[]},{"n":116,"kind":"单项选择题","answer":"C","stem":"依据 24 小时内的降水量划分，被定义为大暴雨的是（   ）。","options":{"A":"50 毫米及以下","B":"50.0-99.9 毫米","C":"100-249.9 毫米","D":"250 毫米及以上"},"explanation":"暴雨等级划分：依据 24 小时内降水量来划分暴雨等级，包括暴雨（50.0- 99.9 毫\n\n米）、大暴雨（100- 249.9 毫米）和特大暴雨（250 毫米及以上）。","clips":[]},{"n":117,"kind":"单项选择题","answer":"D","stem":"发给前往国外定居、探亲、学习，从事商务活动等非公务原因出国的中国公民的护照是（     ）。","options":{"A":"外交护照","B":"公务护照","C":"特区护照","D":"普通护照"},"explanation":"由公安部或者公安部委托的地方公安机关，以及驻外使、领馆和驻香港、澳门公署\n\n签发，发给前往国外定居、探亲、学习、就业、旅行、从事商务活动等非公务原因出国的中\n\n国公民。","clips":[]},{"n":118,"kind":"单项选择题","answer":"B","stem":"短期出国的公民无法补发护照，可申请（   ）。","options":{"A":"身份证","B":"中华人民共和国旅行证","C":"短期出国证明","D":"礼遇签证"},"explanation":"短期出国的公民若时间紧迫，无法补发护照，可向中国驻外使馆、领馆或外交部委\n\n托的其他机构申请中华人民共和国旅行证。","clips":[]},{"n":119,"kind":"单项选择题","answer":"C","stem":"东盟旅游团入境广西桂林的免签时间为（   ）。","options":{"A":"48 小时","B":"72 小时","C":"144 小时","D":"240 小时"},"explanation":"在境内有资质旅行社组织接待下，可从桂林机场口岸免签入境出境，活动范围限于\n\n桂林市域，停留不超 144 小时（6 天），采取团进团出方式。","clips":[]},{"n":120,"kind":"单项选择题","answer":"D","stem":"游客寄往国外的中药材、中成药，总值限人民币（    ）。","options":{"A":"150 元","B":"300 元","C":"800 元","D":"1000 元"},"explanation":"游客寄往国外的中药材、中成药，总值限人民币 1000 元。","clips":[]},{"n":121,"kind":"单项选择题","answer":"C","stem":"中国公民出入境，每人每次携带的人民币限额为（    ）。","options":{"A":"5000 元","B":"10000 元","C":"20000 元","D":"50000 元"},"explanation":"中国公民出入境、外国人入出境，每人每次携带的人民币限额为 20000 元，携带超\n\n量人民币出入境的，应当按照国家规定向海关如实申报。","clips":[]},{"n":122,"kind":"单项选择题","answer":"D","stem":"无论是国内还是国际航空公司，经济舱的代码都是（   ）。","options":{"A":"A","B":"B","C":"F","D":"Y"},"explanation":"国内或者国际经济舱代码都是 Y。","clips":[]},{"n":123,"kind":"单项选择题","answer":"C","stem":"承运人或代理人收到旅客有效退款申请后，应在（      ）个工作日内完成退款手续。","options":{"A":"3","B":"5","C":"7","D":"12"},"explanation":"承运人或代理人收到旅客有效退款申请后，应在 7 个工作日内完成退款手续（不含\n\n金融机构处理时间）。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":124,"kind":"单项选择题","answer":"A","stem":"外交人员乘坐火车可以免费携带物品的最大重量是（           ）。","options":{"A":"35 千克","B":"20 千克","C":"15 千克","D":"10 千克"},"explanation":"乘坐火车每人免费携带品的重量：外交人员 ≤ 35kg","clips":[]},{"n":125,"kind":"单项选择题","answer":"C","stem":"为了避免发生高原反应，每天应该补水至少（        ）。","options":{"A":"1000 毫升","B":"2000 毫升","C":"4000 毫升","D":"6000 毫升"},"explanation":"剂量：每日 4000 毫升液体","clips":[]},{"n":126,"kind":"单项选择题","answer":"D","stem":"下列关于人民币纳入 SDR 的描述，正确的一项是（        ）。","options":{"A":"SDR 是特别提款权的英文首字母，之前由美元、英镑、欧元和卢布组成","B":"2025 年 12 月，国际货币基金组织宣布把人民币纳入 SDR","C":"人民币的权重由 12.28%提升至 15.96%","D":"中国加入 SDR 意味着人民币真正跻身于全球主要货币之列"},"explanation":"2015 年 12 月 1 日，国际货币基金组织（IMF）宣布把人民币纳入 SDR，权重定为\n\n10.92% 。2022 年 5 月，该组织将人民币的权重提高至 12. 28% 。\n\nSDR 是特别提款权的英文首字母，是国际货币基金组织创造的国际储备资产，之前由美元、\n\n英镑、欧元和日元组成。\n\n中国加入 SDR 意味着人民币真正路身于全球主要货币之列，人民币作为结算货币将得到更广\n\n泛地使用，也将推动人民币成为可兑换、可自由使用的货币。","clips":[]},{"n":127,"kind":"单项选择题","answer":"A","stem":"下列选项中，关于铁路意外伤害保险的说法，正确的是（              ）。","options":{"A":"成年旅客收费 3 元，保额 50 万身故伤残金+5 万意外医疗","B":"未成年人收费 1 元，保额 10 万身故伤残金+1 万意外医疗","C":"铁路意外伤害保险属于强制保险，已经将费用算在车票中","D":"期限为持有效乘车凭证实名制登车到凭证载明到站检票出站止"},"explanation":"期限起止：持有效乘车凭证实名制验证/检票进站 →凭证载明到站检票出站止·2020\n\n年 5 月 10 日起费率：成年旅客：3 元 →保额 50 万身故伤残金 +5 万意外医疗；未成年人：\n\n1 元 →保额 20 万身故伤残金 +2 万意外医疗。","clips":[]},{"n":128,"kind":"单项选择题","answer":"D","stem":"我国旅游饭店一共分为（       ）等级。","options":{"A":"2 个","B":"3 个","C":"4 个","D":"5 个"},"explanation":"我国旅游饭店星级划分为一星级、二星级、三星级、四星级、五星级，其中一星级\n\n为最低，五星级为最高。","clips":[]},{"n":129,"kind":"单项选择题","answer":"B","stem":"关于我国离境退税的条件，描述错误的一项是（        ）。","options":{"A":"物品未启用/未消费","B":"同人同日同店购物≥500 元人民币","C":"购买日距离境日≤90 天","D":"物品随身或随行托运出境"},"explanation":"① 同一境外旅客同一日在同一退税商店购买的退税物品金额达到 200 元人民币；并\n\n且按规定取得退税申请单（凭购买退税物品的增值税普通发票向退税商店索取）等退税凭证。\n\n② 在离境口岸办理离境手续，离境前退税物品尚未启用或消费；\n\n③ 离境日距退税物品购买日不超过 90 天；\n\n④ 所购退税物品由境外旅客本人随身携带或随行托运出境。\n\n⑤ 所购退税物品经海关验核并在退税申请单上签章。\n\n⑥ 在指定的退税代理机构办理退税。","clips":[]},{"n":130,"kind":"单项选择题","answer":"C","stem":"目前海南离岛免税政策是（    ）。","options":{"A":"商品总计有 30 种，离岛旅客每年每人免税购物额度为 10 万人民币","B":"商品总计有 50 种，离岛旅客每年每人免税购物额度为 15 万人民币","C":"商品总计有 47 种，离岛旅客每年每人免税购物额度为 10 万人民币","D":"商品总计有 52 种，离岛旅客每年每人免税购物额度为 15 万人民币"},"explanation":"目前离岛免税商品品种总计有 47 种，离岛旅客每年每人免税购物额度为 10 万人民\n\n币，不限次数。\n\n三、多选题","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABC","stem":"根据《中华人民共和国宪法》的规定，民主集中制原则的内涵体现在（        ）。","options":{"A":"人民与权力机关的关系","B":"权力机关与其他国家机关的关系","C":"中央与地方的关系","D":"公民与权力机关的关系","E":"人民与行政机关的关系"},"explanation":"宪法第 3 条确立了民主集中制为国家机构的组织原则，其内涵体现在三个层面：人\n\n民与权力机关；权力机关与其他国家机关；中央与地方关系。D 错误：宪法规定的是人民（整\n\n体）与权力机关的关系，并非单个公民和权力机关的关系，不属于民主集中制三大内涵范畴。\n\nE 错误：人民与行政机关的关系，归属于权力机关和其他国家机关这一大关系之下，不是民\n\n主集中制独立划分的内涵层面","clips":[]},{"n":132,"kind":"多项选择题","answer":"BC","stem":"下列对公民基本权利和义务的说法中，正确的是（     ）。","options":{"A":"任何公民都有权对国家公职人员进行批评、建议、申诉","B":"既是公民基本权利，又是公民基本义务的有受教育权和劳动权","C":"公民的休息权是以劳动权为前提的","D":"父母有抚养教育子女、成年子女有赡养扶助父母的义务","E":"计划生育是公民的基本权利"},"explanation":"解析对于任何国家机关和国家工作人员的违法失职行为，有向有关国家机关提出申\n\n诉、控告或者检举的权利；父母有抚养教育未成年子女的义务；计划生育是公民的基本义务。","clips":[]},{"n":133,"kind":"多项选择题","answer":"BC","stem":"根据《旅游法》的规定，以下情形中旅行社无需承担责任的是（       ）。","options":{"A":"旅行社因为其地接社原因对旅游者违约","B":"旅行社因为铁路运输部门的原因而不能履行合同约定","C":"旅游者未尽其应尽的配合、协助履行义务导致违约","D":"旅游者虽在自由活动期间发生损害，但旅行社未尽到安全提示义务","E":"旅行社因为餐饮问题对旅游者违约"},"explanation":"因为地接社原因对旅游者违约，旅行社作为组团社需要承担责任。\n\n旅游者在自由活动期间发生损害，旅行社未尽到安全提示义务也需要承担责任；\n\n《旅游法》第 71 条规定：由于地接社、履行辅助人的原因导致违约的，由组团社承担责任。\n\n所以旅行社因为饭店原因对旅游者违约需要承担责任。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ABD","stem":"根据《旅游法》的规定，公益性的（     ）等，除重点文物保护单位和珍贵文物收藏单位外，应当逐步免费开放。","options":{"A":"纪念馆","B":"城市公园","C":"文化生态保护区","D":"博物馆","E":"风景名胜区"},"explanation":"《旅游法》第 43 条，公益性的城市公园、博物馆、纪念馆等，除重点文物保护单位\n\n和珍贵文物收藏单位外，应当逐步免费开放。","clips":[]},{"n":135,"kind":"多项选择题","answer":"ACDE","stem":"根据《民法典》的规定，委托代理授权采用书面形式的，授权委托书应当载明的内容包括（      ）。","options":{"A":"代理人的姓名或者名称","B":"代理人签名或者盖章","C":"代理事项","D":"代理权限和期限","E":"被代理人的姓名或者名称"},"explanation":"《民法典》第 165 条规定，委托代理授权采用书面形式的，授权委托书应当载明代\n\n理人的姓名或者名称、代理事项、权限和期限，并由被代理人签名或者盖章。","clips":[]},{"n":136,"kind":"多项选择题","answer":"CE","stem":"根据《民法典》的规定，以下属于侵权责任不承担责任和减免责任的情形是（          ）。","options":{"A":"被侵权人对损害的发生也有过错的，可以减轻或免除侵权人的责任","B":"损害是因受害人故意造成的，行为人可以相应减轻责任","C":"损害是因第三人造成的，第三人应当承担侵权责任","D":"只要因不可抗力造成他人损害的，都无须承担责任","E":"正当防卫超过必要的限度，造成不应有的损害的，正当防卫人应当承担适当的责任"},"explanation":"《民法典》第 1173 条，被侵权人对同一损害的发生或者扩大有过错的，可以减轻侵\n\n权人的责任。第 1174 条，损害是因受害人故意造成的，行为人不承担责任。\n\n《民法典》第 180 条，因不可抗力不能履行民事义务的，不承担民事责任。法律另有规定的，\n\n依照其规定。","clips":[]},{"n":137,"kind":"多项选择题","answer":"BCD","stem":"某旅行社在组织旅游者赴境外旅游过程中，安排旅游者参加另行付费旅游项目，且未征得旅游者同意。对此，由旅游主管部门对直接负责该项目的导游王某，（     ）。","options":{"A":"处 200 元以上 2000 元以下罚款","B":"处 2000 元以上 2 万元以下罚款","C":"并暂扣或者吊销导游证","D":"没收违法所得","E":"情节严重的，吊销导游证"},"explanation":"《旅游法》第 35 条规定，旅行社不得以不合理的低价组织旅游活动，诱骗旅游者，\n\n并通过安排购物或者另行付费旅游项目获取回扣等不正当利益。\n\n《旅游法》第 98 条规定，旅行社违反本法第 35 条规定的，由旅游主管部门责令改正，没收\n\n违法所得，责令停业整顿，并处 3 万元以上 30 万元以下罚款；\n\n违法所得 30 万元以上的，并处违法所得 1 倍以上 5 倍以下罚款；情节严重的，吊销旅行社\n\n业务经营许可证；对直接负责的主管人员和其他直接责任人员，没收违法所得，处 2000 元\n\n以上 2 万元以下罚款，并暂扣或者吊销导游证。","clips":[]},{"n":138,"kind":"多项选择题","answer":"AD","stem":"按照《导游人员管理条例》的规定，导游人员调整或者变更接待计划的条件包括（        ）。","options":{"A":"在引导旅游者旅行、游览过程中","B":"遇到可能危及旅游者人身财产安全的紧急情形","C":"征得全部旅游者的书面同意","D":"立即报告旅行社","E":"由多数旅游者提出"},"explanation":"《导游人员管理条例》第 13 条规定，导游人员在引导旅游者旅行、游览过程中，遇\n\n有可能危及旅游者人身安全的紧急情形时，经征得多数旅游者的同意，可以调整或者变更接\n\n待计划，但是应当立即报告旅行社。\n\n“遇到可能危及旅游者人身财产安全的紧急情形”是“人身安全”，\n\n应该是“征得多数旅游者的同意”，\n\n“由多数旅游者提出”错误，没有这个条件要求。","clips":[]},{"n":139,"kind":"多项选择题","answer":"DE","stem":"依据《导游管理办法》，以下关于导游“经常执业地区”的说法正确的是（      ）。","options":{"A":"连续执业时间在 3 个月内累计执业达到 60 日","B":"导游户籍所在省级行政区域","C":"导游连续执业的县级以上行政区域","D":"导游连续执业的省级行政区域","E":"连续执业时间在 3 个月内累计执业达到 30 日"},"explanation":"经常执业地区，是指导游连续执业或者 3 个月内累计执业达到 30 日的省级行政区域。","clips":[]},{"n":140,"kind":"多项选择题","answer":"BCE","stem":"依据《治安管理处罚法》的规定，下列属于从重处罚情形的有（    ）。","options":{"A":"有严重后果的","B":"教唆、诱骗他人违法行为的","C":"对报案人、控告人、举报人、证人打击报复的","D":"1 年以内曾受过两次以上治安管理处罚的","E":"胁迫他人违法行为的"},"explanation":"依据第 22 条，从重处罚的情形包括：有较严重后果的；教唆、胁迫、诱骗他人违法\n\n的；对报案人、控告人、举报人、证人打击报复的；1 年以内曾受过治安管理处罚的。\n\nA 项错误：有较严重后果属于从重情形，而不是“严重”。\n\nB 项、E 项正确：教唆、胁迫、诱骗他人违法属于从重情形。\n\nC 项正确：对报案人、控告人、举报人、证人打击报复属于从重情形。\n\nD 项错误，一年以内曾受过治安管理处罚即从重，并非要求两次以上。","clips":[]},{"n":141,"kind":"多项选择题","answer":"BC","stem":"《旅游投诉处理办法》规定，投诉人可以就下列事项向旅游投诉处理机构投诉（   ）。","options":{"A":"认为旅游者违反合同约定的","B":"因旅游经营者的责任致使投诉人财产受到损害的","C":"因不可抗力致使旅游合同不能履行的，投诉人与被投诉人发生争议","D":"意外事故致使旅游合同不能完全履行的","E":"旅游经营者损害团队中其他旅游者合法权益的"},"explanation":"《旅游投诉处理办法》第 8 条规定了旅游投诉案件的受理范围和除外情形。投诉人\n\n可以就下列事项向旅游投诉处理机构投诉：\n\n① 认为旅游经营者违反合同约定的。\n\n②因旅游经营者的责任致使投诉人人身、财产受到损害的。\n\n③因不可抗力、意外事故致使旅游合同不能履行或者不能完全履行，投诉人与被投诉人发生\n\n争议的。\n\n④其他损害旅游者合法权益的。\n\n“认为旅游者违反合同约定的”错误，旅游投诉的主体只能是“旅游者”。\n\n“意外事故致使旅游合同不能完全履行的”错误，投诉人与被投诉人发生争议，投诉人才可\n\n以就此进行投诉。\n\n“旅游经营者损害团队中其他旅游者合法权益的”错误，此情形与投诉人没有直接利害关系，\n\n所以不符合旅游投诉的实质要件。","clips":[]},{"n":142,"kind":"多项选择题","answer":"ABD","stem":"国家鼓励（   ）为人民政府应对突发事件工作提供物资、资金、技术支持和捐赠。","options":{"A":"公民","B":"法人","C":"自然人","D":"其他组织","E":"行政机关"},"explanation":"《突发事件应对法》第 34 条规定，国家鼓励公民、法人和其他组织为人民政府应对\n\n突发事件工作提供物资、资金、技术支持和捐赠。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ABDE","stem":"《中华人民共和国食品安全法》规定，县级以上人民政府食品安全监督管理部门接到食品安全事故报告后，应当立即会同相关部门进行调查处理，并（       ），以防止或者减轻社会危害。","options":{"A":"做好信息发布工作，依法对食品安全事故及其处理情况进行发布，并对可能产生的危害加以解释、说明","B":"对确认属于被污染的食品及其原料，责令食品生产经营者依法召回或停止经营","C":"封存被污染食品的相关环境，并责令立即进行清理消杀","D":"开展应急救援工作，组织救治因食品安全事故导致人身伤害的人员","E":"封存可能导致食品安全事故的食品及其原料，并立即进行检验"},"explanation":"“封存被污染食品的相关环境，并责令立即进行清理消杀”错误，根据常识，当有\n\n食品安全事故发生的时候，相关环境是不能进行清理消杀的，因为有可能涉及到调查取证，\n\n故错误。正确的表达是“封存被污染的食品相关产品，并责令进行清洗消毒”。其余选项描\n\n述正确。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABCD","stem":"党的十九届六中全会强调的“两个确立”及其重大意义包括（   ）。","options":{"A":"确立习近平同志党中央的核心、全党的核心地位","B":"确立习近平新时代中国特色社会主义思想的指导地位","C":"反映全党全军全国各族人民共同心愿","D":"对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义","E":"主要适用于当前发展阶段"},"explanation":"答案选 ABCD。\n\n“两个确立”是确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特\n\n色社会主义思想 的指导地位；其反映全党全军全国各族人民共同心愿，对新时代党和国家\n\n事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。E 项“两个确立”是关乎民\n\n族复兴长远进程的重大政治论断，不仅适用于当前阶段，更是新征程上必须长期坚持的根本\n\n政治保证。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":145,"kind":"多项选择题","answer":"ABC","stem":"2023 年提出的“七个着力”还包括（   ）。","options":{"A":"着力续中华文脉、推动中华优秀传统文化创造性转化和创新性发展","B":"着力推动文化事业和文化产业繁荣发展","C":"着力加强国际传播能力建设、促进文明交流互鉴","D":"着力以文化产业为主、文化事业为辅的发展方向","E":"着力提升对外叙事能力，促进单向文化输出"},"explanation":"答案选 ABC。\n\n“七个着力”还包括着力续中华文脉、推动中华优秀传统文化创造性转化和创新性发展，着\n\n力推动文化事业和文化产业繁荣发展，着力加强国际传播能力建设、促进文明交流互鉴。\n\nD 项文化事业和文化产业是统筹推进、协调发展的关系。文化事业重在公共公益保障，文化\n\n产业重在市场发展，不存在“产业为主、事业为辅”的定位。\n\nE 项我国国际传播坚持文明交流互鉴、双向平等对话，不是单向文化输出。","clips":[]},{"n":146,"kind":"多项选择题","answer":"BDE","stem":"《英烈法》规定，以侮辱、诽谤或者其他方式侵害英雄烈士的姓名、肖像、名誉、荣誉，损害社会公共利益的，（     ）。","options":{"A":"承担部分民事责任","B":"依法承担民事责任","C":"依法承担行政责任","D":"构成犯罪的，依法追究刑事责任","E":"构成违反治安管理行为的，由公安机关依法给予治安管理处罚"},"explanation":"《英烈法》第 26 条规定，以侮辱、诽谤或者其他方式侵害英雄烈士的姓名、肖像、\n\n名誉、荣誉，损害社会公共利益的，依法承担民事责任；构成违反治安管理行为的，由公安\n\n机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ABE","stem":"根据《中华人民共和国宪法》的规定，关于非公有制经济，下列说法正确的有（   ）。","options":{"A":"是社会主义市场经济的重要组成部分","B":"国家保护其合法权益","C":"国家保障非公有制经济的巩固和发展","D":"是社会主义市场经济的重要补充部分","E":"国家鼓励、支持和引导其发展，并依法实行监督和管理"},"explanation":"在法律规定范围内的个体经济、私营经济等非公有制经济，是社会主义市场经济的\n\n重要组成部分。国家保护其合法权益，鼓励、支持和引导其发展，并依法实行监督和管理（第\n\n11 条）。C 错误：“保障巩固和发展”是宪法针对国有经济的规定，不适用于非公有制经济。\n\nD 错误：“重要补充部分”，现行宪法表述为重要组成部分，该说法错误。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ACD","stem":"导游工作的客观情况复杂，表现在（      ）。","options":{"A":"服务对象复杂","B":"与计调关系复杂","C":"人际关系复杂","D":"旅游者需求多样","E":"文化信息复杂"},"explanation":"客观情况复杂：服务对象复杂；人际关系复杂；旅游者需求多样。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABCD","stem":"导游人员的基本职责包括（   ）。","options":{"A":"接受导游任务，引导文明旅游","B":"进行导游讲解，传播中国文化","C":"安排旅游事宜，保护旅游者安全","D":"反映意见要求，安排相关活动","E":"旅游市场调研，开拓市场"},"explanation":"解析接受导游任务，引导文明旅游；进行导游讲解，传播中国文化；安排旅游事宜，\n\n保护旅游者安全；反映意见要求，安排相关活动；解答旅游者问询，处理相关问题。","clips":[]},{"n":150,"kind":"多项选择题","answer":"BCD","stem":"地陪导游在游客入住饭店时提供的服务包括（       ）。","options":{"A":"为游客办理入住手续，并分房","B":"宣布当天或次日活动的安排","C":"提醒游客入住注意事项","D":"安排叫早服务","E":"告知全陪处理客人在店问题"},"explanation":"解析协助办理入住手续；宣布当天或次日活动的安排；照顾旅游团入住（提醒游客\n\n入住注意事项、处理入住问题）；安排叫早服务；离店服务。","clips":[]},{"n":151,"kind":"多项选择题","answer":"AB","stem":"地陪带领游客参观游览出发前的服务内容有（       ）。","options":{"A":"提前准备好导游旗、行程单，开启导游执业相关应用软件","B":"按时提前到达集合地点","C":"核实、清点人数，若有客人未到，请全陪妥善安排好客人","D":"告知旅游者将贵重物品留在房间，不要随身携带以免丢失","E":"地陪站在车门一侧，为每一位游客提供帮助"},"explanation":"地陪应提前准备好导游旗，携带手机（电子导游证）、行程单及必要票证，佩戴导游\n\n身份标识，并开启导游执业相关应用软件；地陪应提前 10 分钟到达约定集合点；若发现有\n\n旅游者未到，应向入境领队、全陪或其他旅游者了解情况，及时查找；告知旅游者不要将贵\n\n重物品留在房间；旅游者按约定时间集合，核实、清点人数后，地陪站在车门一侧，热情招\n\n呼旅游者上车，为老弱病残者提供必要帮助。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABCE","stem":"旅游者参加旅游合同约定的文化娱乐活动时，地陪应（       ）。","options":{"A":"陪同前往并简要介绍文化娱乐活动内容和特点","B":"按时组织旅游者入场，倡导旅游者文明参与活动","C":"告知旅游者活动结束后的集合时间和地点","D":"节目开始后，导游要悄然离场，不要影响游客观看","E":"活动结束时提醒旅游者不要遗留物品并有序退场"},"explanation":"（1）陪同介绍：陪同前往并简要介绍文化娱乐活动内容和特点；（2）组织入场与倡\n\n导文明：按时组织旅游者入场，倡导旅游者文明参与活动（3）告知集合信息：告知旅游者\n\n活动结束后的集合时间和地点；（4）安全提醒与防范：提醒旅游者在文化娱乐活动场所注意\n\n人身和财物安全，并采取必要的防范措施；（5）结束提醒与退场：活动结束时提醒旅游者不\n\n要遗留物品并有序退场。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ACD","stem":"全陪的联络工作和桥梁作用主要体现在（     ）。","options":{"A":"建立联络渠道，做好各站的联络工作","B":"做好商家和游客之间的桥梁作用","C":"做好领队与地陪、旅游者与地陪之间的联络、协调工作","D":"做好旅游行程特别是上下站之间的联络工作","E":"做好商家与商家之间的联络工作"},"explanation":"（1）建立联络渠道：全陪应做好各站的联络工作，架起沟通的桥梁；（2）协调各方\n\n关系：做好领队与地陪、旅游者与地陪之间的联络、协调工作；（3）确保行程衔接：做好旅\n\n游行程各站间，特别是上下站之间的联络工作。","clips":[]},{"n":154,"kind":"多项选择题","answer":"AE","stem":"针对不文明行为的处理，导游应该（    ）。","options":{"A":"因无心之过出现礼仪规范不协调的行为，应及时提醒和劝阻","B":"如果游客不礼貌，必要时导游代替游客道歉","C":"对于从事违法或违反社会公德活动的游客，不听劝阻、不能制止的，导游与其解除旅游合同","D":"对于从事违法活动的游客，尽量劝阻","E":"对于从事违法活动的游客后果严重的，领队应主动向相关执法机关报告"},"explanation":"（1）对于游客因无心之过而与旅游目的地风俗禁忌、礼仪规范不协调的行为，应及\n\n时提醒和劝阻，必要时协助游客赔礼道歉。\n\n（2）对于从事违法或违反社会公德活动的游客，或从事严重影响其他游客权益的活动，不\n\n听劝阻、不能制止的，根据旅行社的指示，导游领队可代表旅行社与其解除旅游合同。\n\n（3）对于从事违法活动的游客，不听劝阻、无法制止，后果严重的，导游领队应主动向相\n\n关执法、管理机关报告，寻求帮助，依法处理。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ACE","stem":"导游合理搭配活动内容，具体包括（    ）。","options":{"A":"游览节奏宜“松紧相间，先紧后松”","B":"游览时间宜“重点突出，面面俱到”","C":"游览顺序宜“先远后近，先高后低”","D":"游览旅程宜“多多益善，能走尽走”","E":"游览安排宜“快旅慢游，精彩在后”"},"explanation":"游览节奏宜“松紧相间，先紧后松”；游览顺序宜“先远后近，先高后低”；游览安\n\n排宜“快旅慢游，精彩在后”。","clips":[]},{"n":156,"kind":"多项选择题","answer":"BCD","stem":"若允许游客全天不随团活动，导游应做的工作是（       ）。","options":{"A":"告知游客需增加的各项费用自理，原费用不退","B":"告诉旅游者用餐的时间和地点，以便其归队时用餐","C":"提醒其注意安全，保护好自己的财物","D":"提醒旅游者带上饭店卡片备用","E":"报告组团社，让其备案"},"explanation":"1. 要求全天或某一景点不随团活动不影响整个旅游团活动时，可以满足并提供必要\n\n帮助。按照以下程序处理：提前说明如果不随团活动，需增加的各项费用自理，原费用根据\n\n旅游合同约定处理。告诉旅游者用餐的时间和地点，以便其归队时用餐。提醒其注意安全，\n\n保护好自己的财物。提醒旅游者带上饭店卡片（卡片上有中英文的饭店名称、地址、电话）\n\n备用。用中英文写张便条，注明旅游者要去的地点的名称、地址及简短对话，以备不时之需。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABCD","stem":"面对旅游者的个别要求，导游处理的方法有（     ）。","options":{"A":"要求合理且导游经努力能予以满足，导游尽量满足","B":"要求合理，但因主客观因素限制，导游无法满足，耐心解释","C":"要求不合理，但导游通过努力仍可满足，导游想办法争取满足","D":"要求不合理且导游无法满足，婉转拒绝","E":"无论如何都应该尽全力满足"},"explanation":"导游实际带团时，旅游者的个别要求大致可分为四种类型：\n\n一是要求合理且导游经努力能予以满足；二是要求合理，但因主客观因素限制，导游无法满\n\n足；三是要求不合理，但导游通过努力仍可满足；四是要求不合理且导游无法满足。","clips":[]},{"n":158,"kind":"多项选择题","answer":"ABC","stem":"关于导游漏接的主观原因，描述正确的选项有（    ）。","options":{"A":"导游自身问题，如看错接站（机）时间","B":"旅行社接待计划书写有误，未能及时通知导游","C":"导游举牌接站的地方选择不当","D":"导游前往接站（机）途中，遭遇突发交通事故而迟到","E":"旅游者乘坐的国际航班提前抵达"},"explanation":"主观原因：\n\n导游自身问题，如看错接站（机）时间、弄错接站（机）地点等；旅行社接待计划书写有误，\n\n或旅行社上下站之间沟通不畅，未能及时将旅游者临时变动后的交通方式或抵达时间告知导\n\n游。旅游者自身问题，如自行出票的旅游者中途更换航班，却未及时通知旅行社或导游自己\n\n临时变更后的新班次信息等。\n\n客观原因：\n\n导游前往接站（机）途中，遭遇突发交通事故而迟到。旅游者乘坐的国际航班提前抵达等。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABCE","stem":"为防止毒虫伤人，导游可提醒旅游者（    ）。","options":{"A":"有户外活动时，穿长袖长裤，必要时扣紧袖口、领口","B":"避免穿深色与花色衣物，以免吸引昆虫","C":"建议旅游者携带防蚊液、驱虫剂、中药香囊","D":"多喷洒香水等芳香剂，驱赶蚊虫","E":"草木茂盛、大树下、草地、水边易聚集毒虫，应尽量避免逗留"},"explanation":"1. 做好穿着防护有户外活动时，提前告知旅游者穿长袖长裤，必要时扣紧袖口、领\n\n口，扎紧裤脚，戴帽子。避免穿深色与花色衣物，以免吸引昆虫；2. 配备驱虫用品建议旅\n\n游者携带防蚊液、驱虫剂、中药香囊等，皮肤暴露部位提前喷洒防蚊液。切忌喷洒香水等芳\n\n香剂，以免昆虫误以为是花朵；3. 避免进入毒虫聚集的环境毒虫常栖息于阴暗、闷热、潮\n\n湿处，草木茂盛、大树下、草地、水边易聚集毒虫，应尽量避免逗留。","clips":[]},{"n":160,"kind":"多项选择题","answer":"BCD","stem":"面对旅游者出现病危的情况，导游应该（       ）。","options":{"A":"地陪亲自到医院全程记录抢救过程，全陪安抚客人","B":"导游应立即拨打急救电话求救","C":"协同患者亲友送病人至医疗急救机构/医院抢救","D":"及时报告旅行社","E":"如患者系外籍人士，通知外交部"},"explanation":"① 旅游者病危时，导游应立即拨打急救电话求救； ② 或协同患者亲友送病人至医\n\n疗急救机构/医院抢救； ③ 或请医生前来抢救； ④ 及时报告旅行社；涉外处理：如患者\n\n系外籍人士，协助患者通知其所在国驻华使领馆；团队安排：妥善安排好其他旅游者的活动，\n\n地陪导游带团继续游览。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCE","stem":"当旅游者发生食物中毒时，导游应（     ）。","options":{"A":"立即与当地医疗机构联系救助事宜，并设法催吐","B":"对食品进行留样，取得旅游者呕吐物的样本","C":"将旅游者送至医疗急救机构或医院进行救治，并保留相关证据","D":"尽量不要向旅行社通报，设法独立处理好","E":"如果在境外，领队及时向中国驻当地使领馆报告"},"explanation":"1. 境内食物中毒\n\n1. 境内食物中毒(1) 立即与当地医疗机构联系救助事宜，并设法催吐，同时对食品进行留\n\n样，取得旅游者呕吐物的样本；(2) 将旅游者送至医疗急救机构或医院进行救治，并保留相\n\n关证据；(3) 及时向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾病预防控制\n\n机构报告，反映旅游者食物中毒的详细情况。\n\n2. 境外食物中毒\n\n（1）领队应及时向中国驻当地使领馆或政府派出机构报告。（2）在其指导下，全力做好食\n\n物中毒应对处置工作。","clips":[]},{"n":162,"kind":"多项选择题","answer":"BDE","stem":"旅游期间在室内出现雷电时，操作正确的是（         ）。","options":{"A":"可以使用太阳能淋浴器洗澡","B":"应立即关好门窗，减少外部雷电电磁辐射的侵入","C":"使用笔记本电脑工作，不连电线可以上网","D":"切勿站在阳台上，不要触摸金属管线，暂停给电器充电","E":"尽量远离金属门窗、幕墙以及有电源插座的地方"},"explanation":"当雷电出现时，如果身处室内，应立即关好门窗，减少外部雷电电磁辐射的侵入。\n\n尽量远离金属门窗、幕墙以及有电源插座的地方，避免接触导电物体。\n\n切勿站在阳台上，不要触摸金属管线，暂停给电器充电，避免使用电视机、电脑等电子设备，\n\n同时停止使用太阳能热水器等，防止雷电通过相关设施造成伤害。","clips":[]},{"n":163,"kind":"多项选择题","answer":"BCDE","stem":"地震时室内避险的正确做法是（   ）。","options":{"A":"躲在楼梯过道或电梯内","B":"躲在立柱旁边、内承重墙的墙根、墙角等位置相对较为安全","C":"优先躲避在坚固家具旁或下方","D":"若条件允许，用湿毛巾等捂住口鼻，防止吸入灰尘等有害物质","E":"蹲下，蜷曲身体，降低身体重心，将额头置于膝盖间"},"explanation":"坚固家具旁或下方：如坚固的柜台、桌椅、书桌等旁边或下面；\n\n利用建筑结构优势：小开间区域（如卫生间、储藏室等）、立柱旁边、内承重墙的墙根、墙\n\n角等位置相对较为安全；\n\n基本站姿：蹲下，蜷曲身体，降低身体重心，将额头置于膝盖间，双手紧扣置于颈后，保护\n\n头部和颈部关键部位；若条件允许，用湿毛巾等捂住口鼻，防止吸入灰尘等有害物质，避免\n\n呼吸道受刺激或堵塞。","clips":[],"sourceNote":"试题卷与解析卷表述有差异，本题采用解析卷版本。"},{"n":164,"kind":"多项选择题","answer":"ABC","stem":"下列情形中，铁路运输企业可以拒绝运输的有（    ）。","options":{"A":"拒付补票款或加收票款","B":"拒绝安全检查","C":"需依法实施传染病隔离管理","D":"100 岁的老人","E":"重病的患者"},"explanation":"有下列情形之一的，铁路运输企业可以拒绝运输：\n\n① 拒付补票款或加收票款； ② 拒绝安全检查； ③ 购票后拒绝身份核验或票证信息不符；\n\n④ 需依法实施传染病隔离管理； ⑤ 扰乱秩序、精神障碍或醉酒危及安全； ⑥ 法律法规\n\n规定的其他情形。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ABDE","stem":"在研学活动中我们应该执行的规范有（   ）。","options":{"A":"上下车时清点人数","B":"活动后规定地点按时集中","C":"晚间尽量避免巡查、夜查，影响学生休息","D":"督促供方做好食物留样","E":"将安全知识融入讲解"},"explanation":"上下车时清点人数；活动后规定地点按时集中；督促供方做好食物留样；将安全知\n\n识融入讲解；按制度开展巡查、夜查。","clips":[]}]</script>
<script>
'use strict';

const el=id=>document.getElementById(id);
const key='leidada-2026-paper5-subject12-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retrySequence=[], retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    if(Array.isArray(state.retrySequence))retrySequence=[...new Set(state.retrySequence)].filter(n=>questions.some(q=>q.n===n));
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,retrySequence,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  const list=wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
  const rank=new Map(retrySequence.map((n,i)=>[n,i]));
  return list.sort((a,b)=>(rank.get(a.n)??Infinity)-(rank.get(b.n)??Infinity));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
    retrySequence=[];
  }
  if(!list.length)return;
  if(!retrySequence.length){
    for(let i=list.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [list[i],list[j]]=[list[j],list[i]];
    }
    retrySequence=list.map(q=>q.n);
  }
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  retrySequence=[];
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
