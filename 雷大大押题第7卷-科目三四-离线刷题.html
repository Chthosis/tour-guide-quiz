<script type="application/json" id="question-data">[{"n":1,"kind":"判断题","answer":"错","stem":"青岛是我国啤酒产业的发源地，被中国酒业协会授予“中国啤酒之都”称号。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“青岛”应改为“哈尔滨”。哈尔滨是我国啤酒产业的发源地，被中\n\n国酒业协会授予“中国啤酒之都·哈尔滨”称号。\n\n易混对比——啤酒之城：\n\n· 哈尔滨：我国啤酒产业的发源地，获授“中国啤酒之都·哈尔滨”称号（黑龙江）；\n\n· 青岛：著名的青岛啤酒产地（山东）。","clips":[]},{"n":2,"kind":"判断题","answer":"对","stem":"应县木塔是我国现存最古、最高的一座木结构大塔。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。应县木塔是楼阁式塔的代表，是我国现存最古、最高的一座木结构\n\n大塔。\n\n同类对比——我国现存著名古塔：\n\n· 应县木塔：我国现存最古、最高的一座木结构大塔；\n\n· 嵩岳寺塔：河南登封，其建造标志着砖结构技术的巨大进步。","clips":[]},{"n":3,"kind":"判断题","answer":"错","stem":"2000 年初，胡锦涛视察广东，提出了“三个代表”重要思想。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“胡锦涛”应改为“江泽民”。2000 年初，江泽民视察广东，提出了\n\n“三个代表”重要思想。","clips":[]},{"n":4,"kind":"判断题","answer":"错","stem":"红茶制作的关键工序是杀青。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，红茶制作的关键是渥红（发酵）（不是杀青），以促进酶活性，使多\n\n酚类充分氧化；红茶出现于清朝，用全发酵法制成。\n\n易混对比——茶叶发酵程度与关键工序：\n\n· 绿茶：不发酵茶，初制时高温杀青；\n\n· 红茶：全发酵茶，关键工序是渥红（发酵）；\n\n· 青茶（乌龙茶）：半发酵茶；\n\n· 黄茶：轻发酵茶，采用杀青、焖黄方法制作。","clips":[]},{"n":5,"kind":"判断题","answer":"错","stem":"闽南方言称台湾为“大员”“台员”等，明洪武年间公文开始正式使用“台湾”称谓。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“明洪武年间”应改为“明万历年间”。由于迁居台湾的闽南人居多，\n\n闽南方言称台湾为“大员”“台员”等，明万历年间公文开始正式使用“台湾”称谓。","clips":[]},{"n":6,"kind":"判断题","answer":"错","stem":"北京人生活在距今 70 万-20 万年前，已经掌握人工取火技术。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，已经掌握人工取火技术的是山顶洞人（不是北京人）。北京人生活在\n\n距今 70 万-20 万年前，已发现 6 个头盖骨和属于 40 个男女个体的人体化石、10 多万件石器\n\n和长期使用天然火的痕迹；山顶洞人已经掌握人工取火技术，会使用骨针缝制皮衣。\n\n易混对比——北京人与山顶洞人：\n\n· 北京人：生活在距今 70 万-20 万年前；\n\n· 山顶洞人：已经掌握人工取火技术；\n\n· 山顶洞人：会使用骨针缝制皮衣，佩戴兽牙、石珠项链。","clips":[]},{"n":7,"kind":"判断题","answer":"错","stem":"三星堆遗址位于四川省广汉市，出土了大量精美的青铜器等文物，证明其属于汉代文化遗址。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，三星堆遗址出土的是商周时期古蜀国的青铜器和玉器、金器、陶器，\n\n并非汉代。三星堆遗址位于四川省广汉市，其出土的青铜器、玉器、金器、陶器，显示出当\n\n时的蜀文化丝毫不亚于北方的商周文化。\n\n易混对比——三星堆遗址：\n\n· 三星堆遗址：商周时期古蜀国遗址，位于四川省广汉市；\n\n· 青铜大立人像：高 260.8 厘米，世界现存最高、最完整的青铜立人像，号称“铜像之王”。","clips":[]},{"n":8,"kind":"判断题","answer":"对","stem":"新时代以来的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。新时代以来的伟大变革，在党史、新中国史、改革开放史、社会主\n\n义发展史、中华民族发展史上具有里程碑意义。\n\n同类对比——新时代伟大变革：\n\n· 五史：党史、新中国史、改革开放史、社会主义发展史、中华民族发展史；\n\n· 意义：新时代伟大变革具有里程碑意义。","clips":[]},{"n":9,"kind":"判断题","answer":"错","stem":"唐宋八大家（韩愈、柳宗元、欧阳修、王安石、苏洵、苏轼、苏辙、白居易）中宋占其六。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，唐宋八大家中宋占其六，但末位应是曾巩（不是白居易）；白居易是\n\n唐代著名诗人，不在唐宋八大家之列。\n\n易混对比——唐宋八大家：\n\n· 唐代：韩愈、柳宗元；\n\n· 宋代：欧阳修、王安石、苏洵、苏轼、苏辙、曾巩。","clips":[]},{"n":10,"kind":"判断题","answer":"错","stem":"西安有 3100 多年建城史和 1100 多年国都史，先后有 14 个封建王朝在此建都。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“14 个”应改为“13 个”。西安有 3100 多年建城史和 1100 多年国都\n\n史，先后有 13 个封建王朝在此建都。陕西全省则先后共有西周、秦、汉、西晋、隋、唐等\n\n14 个政权在陕西建都。\n\n易混对比——建都数字：\n\n· 西安：3100 多年建城史、1100 多年国都史，先后有 13 个封建王朝在此建都（陕西）；\n\n· 陕西全省：先后共有西周、秦、汉、西晋、隋、唐等 14 个政权建都；\n\n· 洛阳：十三朝古都，有 5000 多年文明史、1500 多年建都史（河南）。","clips":[]},{"n":11,"kind":"判断题","answer":"错","stem":"楷书之祖是东晋王羲之，他与汉末三国人钟繇合称“钟王”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，楷书之祖是汉末三国人钟繇（不是东晋王羲之），他与东晋王羲之合\n\n称“钟王”。\n\n易混对比——钟繇与王羲之：\n\n· 钟繇：汉末三国人，楷书之祖；\n\n· 王羲之：东晋人，世称“书圣”；\n\n· “钟王”：钟繇与王羲之的合称。","clips":[]},{"n":12,"kind":"判断题","answer":"错","stem":"大理古城被联合国教科文组织高度评价为“展示了一幅非同寻常的文化、经济、社会及宗教发展的完整画卷”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“大理古城”应改为“平遥古城”。平遥古城被联合国教科文组织高\n\n度评价为“展示了一幅非同寻常的文化、经济、社会及宗教发展的完整画卷”。平遥古城有\n\n“龟城”之称，街道格局为“土”字形，整体布局遵从八卦方位，体现了明清时期城市规划\n\n理念和形制分布。城内外有各类遗址、古建筑 300 多处，保存完整的明清民宅近 4000 座，\n\n街道商铺都体现历史原貌，被称作研究中国古代城市的活样本。\n\n易混对比——平遥古城（山西）：\n\n· 平遥古城：有“龟城”之称，街道格局为“土”字形，整体布局遵从八卦方位；\n\n· 明清民宅：保存完整的明清民宅近 4000 座，被称作研究中国古代城市的活样本；\n\n· 联合国教科文组织评价：“展示了一幅非同寻常的文化、经济、社会及宗教发展的完整画\n\n卷”。","clips":[]},{"n":13,"kind":"判断题","answer":"对","stem":"铸牢中华民族共同体意识，要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、\n\n荣辱与共、生死与共、命运与共的共同体理念，把铸牢中华民族共同体意识作为新时代党的\n\n民族工作和民族地区各项工作的主线。\n\n同类对比——共同体理念：\n\n· 四个与共：休戚与共、荣辱与共、生死与共、命运与共；\n\n· 主线：铸牢中华民族共同体意识。","clips":[]},{"n":14,"kind":"判断题","answer":"错","stem":"上海迪士尼的标志性建筑为高 69 米的奇幻童话城堡，融合牡丹、祥云等中国元素，是亚洲最高的迪士尼城堡。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“亚洲最高”应改为“全球最高”。上海迪士尼标志性建筑为高 69\n\n米的奇幻童话城堡，融合牡丹、祥云等中国元素，是全球最高的迪士尼城堡。上海迪士尼乐\n\n园是中国内地首座、亚洲第三个、全球第六个迪士尼主题乐园，以“原汁原味迪士尼，别具\n\n一格中国风”为特色。\n\n易混对比——迪士尼乐园：\n\n· 上海迪士尼：中国内地首座、亚洲第三个、全球第六个，奇幻童话城堡高 69 米为全球最\n\n高迪士尼城堡；\n\n· 香港迪士尼：全球第 5 座、亚洲第 2 座、中国第 1 座迪士尼乐园。","clips":[]},{"n":15,"kind":"判断题","answer":"对","stem":"绝句、律诗一律押平声韵，不换韵，“押韵”也叫“叶韵”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。这是近体诗的押韵规则：绝句、律诗一律押平声韵，不换韵。“押韵”\n\n也叫“吐韵”；平起的诗首句起韵，仄起的诗第二句起韵，其下都是隔句押韵。","clips":[]},{"n":16,"kind":"判断题","answer":"对","stem":"潮州湘子桥初建于宋代，是我国第一座启闭式桥梁。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。湘子桥又称广济桥，位于潮州古城的东门外，初建于宋代，距今已\n\n有 800 余年的历史，是我国第一座启闭式桥梁。\n\n同类对比——我国古代名桥：\n\n· 湘子桥（广济桥）：位于潮州，我国第一座启闭式桥梁；\n\n· 赵州桥：隋代建造，世界上最早的敞肩石拱桥；\n\n· 卢沟桥：位于北京，始建于金代，是北京现存最古老的联拱石桥。","clips":[]},{"n":17,"kind":"判断题","answer":"错","stem":"日本的传统文化以“三道”即茶道、花道、剑道为代表。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，日本传统文化“三道”指茶道、花道、书道（不是剑道）。","clips":[]},{"n":18,"kind":"判断题","answer":"错","stem":"广西西隔北部湾与越南相对，东面和南面在南海中与菲律宾、文莱、印度尼西亚和马来西亚为邻。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“广西”应改为“海南”。海南西隔北部湾与越南相对，东面和南面\n\n在南海中与菲律宾、文莱、印度尼西亚和马来西亚为邻。\n\n易混对比——海南与广西区位：\n\n· 海南：西隔北部湾与越南相对，东面和南面在南海中与菲律宾、文莱、印度尼西亚和马\n\n来西亚为邻；\n\n· 广西：西南与越南接壤，有“广西盆地”之称。","clips":[]},{"n":19,"kind":"判断题","answer":"错","stem":"龙凤旗袍制作代表了京派旗袍手工制作技艺的最高水平，每一件都承载着“指尖上的非遗”匠心。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“京派旗袍”应改为“海派旗袍”。龙凤旗袍制作代表了海派旗袍手\n\n工制作技艺的最高水平，属于国家级非遗，其核心在于全手工、个性化精工定制。\n\n易混对比——旗袍：\n\n· 龙凤旗袍：代表海派旗袍手工制作技艺的最高水平，属国家级非遗（上海）；\n\n· 旗袍：已成为中国传统女装，吉林省是满族的发源地之一。","clips":[]},{"n":20,"kind":"判断题","answer":"对","stem":"西夏陵是西夏王朝的陵墓遗址群，是现存规模最大、等级最高、保存最完整的一处西夏文化遗址。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。西夏陵（又称西夏王陵）是西夏王朝的陵墓遗址群，位于宁夏银川\n\n市西，是现存规模最大、等级最高、保存最完整的一处西夏文化遗址。西夏陵分布范围近\n\n40 平方千米，包含 9 座帝陵、271 处陪葬墓，2025 年 7 月 11 日被正式列入《世界遗产名录》。\n\n西夏陵的陵寝制度承袭唐宋帝陵传统，又吸收佛教建筑与党项、吐蕃、回鹘等多元文化影响，\n\n构成中国陵园建筑中别具一格的形式，故有“东方金字塔”之称。","clips":[]},{"n":21,"kind":"判断题","answer":"对","stem":"大连冬无严寒，夏无酷暑，每年空气质量优良天数在 300 天以上，对休养疗养十分有利。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。大连冬无严寒，夏无酷暑，每年空气质量优良天数在 300 天以上，\n\n对休养疗养十分有利。大连是中国最佳旅游城市，理想的旅游、度假和避暑胜地。","clips":[]},{"n":22,"kind":"判断题","answer":"对","stem":"泉州是我国首届“东亚文化之都”，也是全国著名侨乡和台湾省汉族同胞主要祖籍地。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。泉州简称“泉”或“鲤”，是我国首批历史文化名城，是世界闽南文\n\n化的发祥地，是首届“东亚文化之都”，也是全国著名侨乡和台湾省汉族同胞主要祖籍地。\n\n泉州港古称“刺桐港”，是中国古代海上丝绸之路起点之一。","clips":[]},{"n":23,"kind":"判断题","answer":"对","stem":"嘉兴南湖是中国共产党的诞生地和“红船精神”的发源地。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。嘉兴南湖是中国共产党的诞生地和“红船精神”的发源地，1921 年\n\n中共一大在此闭幕，庄严宣告了中国共产党的成立。","clips":[]},{"n":24,"kind":"判断题","answer":"对","stem":"1966 年 10 月 27 日，我国自行研制的东风二号核导弹试爆成功，标志着“两弹”成功结合。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1966 年 10 月 27 日，我国自行研制的东风二号核导弹试爆成功，标\n\n志着“两弹”成功结合，中国有了可用于实战的核导弹。\n\n同类对比——“两弹一星”重大成就：\n\n· 1964 年 10 月 16 日：我国第一颗原子弹爆炸成功；\n\n· 1966 年 10 月 27 日：东风二号核导弹试爆成功，标志“两弹”成功结合；\n\n· 1967 年 6 月 17 日：我国第一颗氢弹空爆试验成功。","clips":[]},{"n":25,"kind":"判断题","answer":"错","stem":"距今约 6000 年的磁山文化是仰韶文化的源头，其出土的家鸡骨骼是已知世界上最早的家鸡。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，“6000 年”应改为“8000 年”。磁山文化，距今约 8000 年，是仰韶\n\n文化的源头。其出土的家鸡骨骼是已知世界上最早的家鸡。\n\n同类对比——史前文化遗址：\n\n· 磁山文化：距今约 8000 年，仰韶文化的源头，出土世界最早家鸡骨骼（河北）；\n\n· 红山文化：距今 6500~5000 年，出土“中华第一龙”玉龙（内蒙古）；\n\n· 半坡遗址：距今 6000 年前的仰韶文化遗址（陕西）；\n\n· 西侯度遗址：人类用火历史追溯至距今约 243 万年（山西）。","clips":[]},{"n":26,"kind":"判断题","answer":"错","stem":"五行相生的顺序是：金克木，木克土，土克水，水克火，火克金。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，金克木、木克土、土克水、水克火、火克金是五行相克（不是五行\n\n相生）；五行相生为：金生水，水生木，木生火，火生土，土生金。\n\n易混对比——五行相生与五行相克：\n\n· 五行相生：金生水，水生木，木生火，火生土，土生金；\n\n· 五行相克：金克木，木克土，土克水，水克火，火克金；\n\n· 五行：金、木、水、火、土。","clips":[]},{"n":27,"kind":"判断题","answer":"对","stem":"百团大战是全国抗战以来八路军在华北发动的规模最大、持续时间最长的一次带战略性进攻的战役。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1940 年 8 月 20 日至 1941 年 1 月 24 日，八路军总部在华北发动了\n\n一次对日军大规模的进攻，陆续参战的部队达到 105 个团 20 余万人，史称“百团大战”，是\n\n全国抗战以来八路军在华北发动的规模最大、持续时间最长的一次带战略性进攻的战役，作\n\n战 1824 次，毙伤日、伪军 2.5 万人，打击了日军的侵略气焰，在抗战局面比较低迷时振奋\n\n了全国民心。\n\n同类对比——抗日战争重要战役：\n\n· 平型关大捷：1937 年 9 月，全民族抗战爆发后中国军队主动对日作战取得的第一个重大\n\n胜利；\n\n· 台儿庄战役：1938 年取得胜利，粉碎日本帝国主义“三个月灭亡中国”的计划；\n\n· 百团大战：1940 年 8 月在华北发动，是规模最大、持续时间最长的战略性进攻战役。","clips":[]},{"n":28,"kind":"判断题","answer":"对","stem":"因澳门南湾地区盛产生蚝，澳门古称“蚝镜澳”，大意就是生蚝港，自古以生蚝命名。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。因为澳门南湾地区盛产生蚝，澳门古称“蚝镜澳”，大意就是生蚝港，\n\n自古以生蚝命名，今天澳门的“焜生蚝”远近闻名。","clips":[]},{"n":29,"kind":"判断题","answer":"对","stem":"中国于 1985 年 12 月 12 日正式加入《保护世界文化与自然遗产公约》。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。中国于 1985 年 12 月 12 日正式加入《保护世界文化与自然遗产公约》。\n\n同类对比——世界遗产制度时间线：\n\n· 1985 年 12 月 12 日：中国正式加入《保护世界文化与自然遗产公约》；\n\n· 1986 年：中国开始向联合国教科文组织申报世界遗产项目；\n\n· 1999 年 10 月 29 日：中国当选世界遗产委员会成员；\n\n· 每年 6 月第二个星期六：中国文化遗产日。","clips":[]},{"n":30,"kind":"判断题","answer":"对","stem":"北宋景德年间，昌南镇烧制的瓷器被选为贡品，宋真宗以年号“景德”赐名，即今天的景德镇。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。北宋景德年间，昌南镇烧制的瓷器被选为贡品，宋真宗以年号“景\n\n德”赐名。景德镇陶瓷以白瓷著称，素有“白如玉，明如镜，薄如纸，声如馨”之誉。\n\n同类对比——江西“四个千年”（江西）：\n\n· 千年瓷都：景德镇；\n\n· 千年名楼：滕王阁；\n\n· 千年书院：白鹿洞；\n\n· 千年古刹：东林寺。","clips":[]},{"n":31,"kind":"判断题","answer":"对","stem":"山东是全国唯一拥有全部 41 个工业大类的省份。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。山东省产业体系完备，是全国唯一拥有全部 41 个工业大类的省份。","clips":[]},{"n":32,"kind":"判断题","answer":"对","stem":"党的十九大把习近平新时代中国特色社会主义思想写入党章，并确立为党的指导思想。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。党的十九大把党的十八大以来党的理论创新成果明确概括为习近平\n\n新时代中国特色社会主义思想，并确立为党的指导思想。\n\n同类对比——党的指导思想写入党章历程：\n\n· 党的十五大：把邓小平理论作为党的指导思想写入党章；\n\n· 党的十六大：把“三个代表”重要思想写入党章；\n\n· 党的十八大：把科学发展观确立为党的指导思想；\n\n· 党的十九大：把习近平新时代中国特色社会主义思想写入党章并确立为党的指导思想。","clips":[]},{"n":33,"kind":"判断题","answer":"对","stem":"北京故宫是世界上现存规模最大、最完整的古代木构建筑群。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。北京故宫位于北京市中心，是世界上现存规模最大、最完整的古代\n\n木构建筑群，始建于 1406 年，历时 14 年才完工，为明清两代的皇宫。\n\n同类对比——著名宫殿建筑群：\n\n· 北京故宫：世界上现存规模最大、最完整的古代木构建筑群；\n\n· 沈阳故宫：与北京故宫同为明清宫殿建筑群实例；\n\n· 布达拉宫：宫堡式建筑群，始建于 7 世纪吐蕃赞普松赞干布时期。","clips":[]},{"n":34,"kind":"判断题","answer":"错","stem":"中国共产党第一次全国代表大会确定党的名称为“中国共产党”，选举产生了以李大钊为书记的中央局。","options":{"对":"正确","错":"错误"},"explanation":"本题说法错误，中共一大选举产生了以陈独秀（不是李大钊）为书记的中央局。大\n\n会确定党的名称为“中国共产党”，通过了中国共产党第一个纲领。\n\n易混对比——中共一大相关史实：\n\n· 中共一大：确定党的名称为“中国共产党”；\n\n· 中央局：一大选举产生以陈独秀为书记的中央局；\n\n· 陈独秀：1920 年上海共产党组织成立时任书记。","clips":[]},{"n":35,"kind":"判断题","answer":"对","stem":"浚县正月古庙会被誉为“华北第一古庙会”。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。浚县正月古庙会被誉为“华北第一古庙会”。宝丰马街书会是中国规\n\n模最大的露天曲艺集会，被誉为“中国曲艺史活化石”。\n\n同类对比——河南民俗盛会（河南）：\n\n· 浚县正月古庙会：“华北第一古庙会”；\n\n· 宝丰马街书会：中国规模最大的露天曲艺集会，被誉为“中国曲艺史活化石”。","clips":[]},{"n":36,"kind":"判断题","answer":"对","stem":"紫貂是国家一级保护动物，其毛皮堪称裘皮之冠。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。紫貂是国家一级保护动物，其毛皮堪称裘皮之冠。\n\n同类对比——东北“三宝”：\n\n· 人参：长白山人参因形状酷似人形而得名，吉林人参产量占全国 60%（吉林）；\n\n· 貂皮：紫貂毛皮堪称“裘皮之冠”（吉林）；\n\n· 鹿茸角：吉林著名特产，“东北三宝”之一（吉林）。","clips":[]},{"n":37,"kind":"判断题","answer":"对","stem":"火药在唐末开始用于军事，宋代甚至出现“霹雳炮”“震天炮”等火器。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。火药的发明与道士炼丹有关，唐代孙思邈曾经记载用硫黄、硝石和\n\n木炭制造火药，唐末火药就开始用于军事，宋代甚至出现“霹雳炮”“震天炮”等火器。\n\n同类对比——中国古代四大发明：\n\n· 造纸术：东汉蔡伦改进造纸法，造出“蔡侯纸”；\n\n· 印刷术：目前所见最早的印刷品为唐代《金刚经》（868 年），称雕版印刷；\n\n· 火药：唐代孙思邈曾记载制法，唐末开始用于军事，宋代出现“霹雳炮”“震天炮”等火\n\n器。","clips":[]},{"n":38,"kind":"判断题","answer":"对","stem":"天津的历史遗迹是城市近代史与中国近代史的缩影和有力见证，故有“看近代史到天津”的说法。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。天津的历史遗迹是城市近代史与中国近代史的缩影和有力见证，故\n\n有“看近代史到天津”的说法。","clips":[]},{"n":39,"kind":"判断题","answer":"对","stem":"《南京条约》是中国近代史上第一个不平等条约，被迫割让香港岛给英国。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。1842 年清朝签订中国近代史上第一个不平等条约《南京条约》，被\n\n迫割让香港岛，向英国赔款，开放广州、福州、厦门、宁波、上海五处为通商口岸，并丧失\n\n关税自主权。\n\n同类对比——鸦片战争与《南京条约》：\n\n· 鸦片战争：1840 年英国为打开中国市场发动；\n\n· 《南京条约》：1842 年签订，中国近代史上第一个不平等条约；\n\n· 《南京条约》内容：被迫割让香港岛，开放广州、福州、厦门、宁波、上海五处为通商\n\n口岸。","clips":[]},{"n":40,"kind":"判断题","answer":"对","stem":"原始神话是我国浪漫主义文学的源头。","options":{"对":"正确","错":"错误"},"explanation":"本题说法正确。原始神话是我国浪漫主义文学的源头，《女娲补天》《夸父逐日》《后\n\n羿射日》《嫦娥奔月》等著名神话大多保存在先秦诸子散文及《楚辞》《山海经》《淮南子》\n\n等著作中。\n\n二、单选题","clips":[]},{"n":41,"kind":"单项选择题","answer":"C","stem":"“人生自古谁无死？留取丹心照汗青”出自文天祥的（ ）。","options":{"A":"《指南录》","B":"《正气歌》","C":"《过零丁洋》","D":"《金陵驿》"},"explanation":"答案选 C。“人生自古谁无死？留取丹心照汗青”出自文天祥《过零丁洋》。","clips":[]},{"n":42,"kind":"单项选择题","answer":"B","stem":"我国雾凇出现最多的城市是（ ）。","options":{"A":"大连市","B":"吉林市","C":"哈尔滨市","D":"沈阳市"},"explanation":"答案选 B。我国雾凇出现最多的是吉林省吉林市，每当雾凇来临，吉林市松花江岸\n\n十里长堤成为“忽如一夜春风来，千树万树梨花开”的仙境；我国峨眉山雨凇最多，庐山雨\n\n凇著称“玻璃世界”。\n\n同类对比——气象奇观：\n\n· 雾凇：我国出现最多的城市是吉林省吉林市；\n\n· 吉林雾凇：松花江岸十里长堤“忽如一夜春风来，千树万树梨花开”；\n\n· 蜃景：山东蓬莱出现次数最多。","clips":[]},{"n":43,"kind":"单项选择题","answer":"A","stem":"科举制正式创立的标志是隋炀帝时设立（ ）。","options":{"A":"进士科","B":"秀才科","C":"明法科","D":"明经科"},"explanation":"答案选 A。隋文帝罢中正官，隋炀帝时又设进士科，允许士人自由报考，标志着科\n\n举制正式创立。\n\n易混对比——中国古代选官制度：\n\n· 汉代：实行察举制和征辟制；\n\n· 魏晋：实行九品中正制，出现“上品无寒门，下品无士族”现象；\n\n· 隋朝：隋炀帝设进士科，标志科举制正式创立。","clips":[]},{"n":44,"kind":"单项选择题","answer":"C","stem":"被誉为“东方雕塑陈列馆”的世界文化遗产是（ ）。","options":{"A":"莫高窟","B":"云冈石窟","C":"天水麦积山石窟","D":"龙门石窟"},"explanation":"世界文化遗产麦积山石窟被誉为“东方雕塑陈列馆”，凌空栈道惊险奇绝。A 项莫高\n\n窟在敦煌，B 项云冈石窟在大同，D 项龙门石窟在洛阳，被誉为“东方雕塑陈列馆”的世界\n\n文化遗产为天水麦积山石窟，故不选。\n\n易混对比——石窟著称：\n\n· 麦积山石窟：“东方雕塑陈列馆”（甘肃）；\n\n· 天梯山石窟：“石窟鼻祖”（甘肃）；\n\n· 莫高窟：“世界艺术宝库”（甘肃）；\n\n· 云冈石窟：三大佛教石窟中承前启后的艺术瑰宝（山西）。","clips":[]},{"n":45,"kind":"单项选择题","answer":"C","stem":"我国民族分布的格局是（ ）。","options":{"A":"按省聚居","B":"大聚居、小杂居","C":"大杂居、小聚居、交错居住","D":"完全混居"},"explanation":"答案选 C。在少数民族聚居区，一般都有一定数量的汉族居民，从而形成了大杂居、\n\n小聚居、交错居住的格局。","clips":[]},{"n":46,"kind":"单项选择题","answer":"C","stem":"中秋节得名是因为（ ）。","options":{"A":"为庆祝秋季丰收","B":"为祭祀月神","C":"时间在每年阴历八月十五，恰值三秋之中","D":"为纪念嫦娥奔月"},"explanation":"答案选 C。中秋节的时间在每年阴历八月十五，恰值三秋之中，故名；在中国人心\n\n目中，中秋节是象征团圆的传统节日。\n\n同类对比——传统节日得名：\n\n· 中秋节：阴历八月十五恰值三秋之中，又名团圆节、仲秋节；\n\n· 端午节：农历五月初五，以纪念屈原说影响最为广泛；\n\n· 重阳节：农历九月初九，“九”为阳数之极，两阳数相重谓之“重阳”。","clips":[]},{"n":47,"kind":"单项选择题","answer":"C","stem":"下列城市中，不属于《南京条约》规定开放的通商口岸的是（ ）。","options":{"A":"广州","B":"福州","C":"天津","D":"宁波"},"explanation":"1842 年，清政府在中英鸦片战争中战败，被迫签订《南京条约》，规定开放广州、\n\n福州、厦门、宁波、上海五处为通商口岸；天津于 1860 年（第二次鸦片战争后）被辟为通\n\n商口岸。A 项广州、B 项福州、D 项宁波均在《南京条约》五口通商之列，C 项天津不在其中，\n\n故本题选 C。\n\n易混对比——近代开埠：\n\n· 1842 年《南京条约》：开放广州、福州、厦门、宁波、上海五处为通商口岸；\n\n· 1843 年 11 月 17 日：上海正式对外开埠；\n\n· 1860 年：天津被辟为通商口岸。","clips":[]},{"n":48,"kind":"单项选择题","answer":"B","stem":"下列名胜中，位于河南开封的是（ ）。","options":{"A":"白马寺","B":"大相国寺","C":"少林寺","D":"中岳庙"},"explanation":"同类对比——河南名寺古建（河南）：\n\n· 大相国寺：开封核心景点；\n\n· 白马寺：在洛阳，佛教传入后第一座官办寺院；\n\n· 少林寺、中岳庙：登封“天地之中”历史建筑群组成部分。","clips":[]},{"n":49,"kind":"单项选择题","answer":"A","stem":"既是一部生动的“地质教科书”，又是一座天然的“地质博物馆”的风景名胜区是（ ）。","options":{"A":"野三坡风景名胜区","B":"苍岩山风景名胜区","C":"崆山白云洞","D":"娲皇宫景区"},"explanation":"野三坡风景名胜区，是一部生动的地质教科书，又是一座天然的地质博物馆。它还\n\n是中国北方极为罕见的集雄山碧水、奇峡怪泉、文物古迹、名树古刹于一身的风景名胜区。\n\n同类对比——河北名胜（河北）：\n\n· 野三坡：生动的“地质教科书”，天然的“地质博物馆”；\n\n· 白石山：中国唯一的大理岩峰林景观；\n\n· 白洋淀：中国海河平原上最大的湖泊，“华北明珠”；\n\n· 西柏坡：党的七届二中全会召开地，“两个务必”诞生地。","clips":[]},{"n":50,"kind":"单项选择题","answer":"C","stem":"“中华民族”概念被广泛使用的时期是（ ）。","options":{"A":"秦汉时期","B":"隋唐时期","C":"抗日战争时期","D":"新中国成立后"},"explanation":"答案选 C。抗日战争时期，“中华民族”概念被广泛使用，成为团结全国各族人民的\n\n精神旗帜。","clips":[]},{"n":51,"kind":"单项选择题","answer":"A","stem":"我国第一座佛教寺庙是（ ）。","options":{"A":"白马寺","B":"少林寺","C":"悬空寺","D":"灵隐寺"},"explanation":"答案选 A。东汉永平十年（67 年），汉明帝邀请印度僧人迦叶摩腾与竺法兰来华，二\n\n人以白马驮经抵达洛阳，次年敕建白马寺，此为中国第一座佛教寺庙，二人所译《四十二章\n\n经》是中国现存最早的汉译佛经。B 少林寺以中华武术和禅宗著称；C 悬空寺为恒山人文景\n\n观之最，徐霞客称之为“天下巨观”；D 灵隐寺的素斋享有盛名。\n\n易混对比——佛教初传中国：\n\n· 东汉永平十年（67 年）：汉明帝邀请印度僧人迦叶摩腾与竺法兰来华；\n\n· 白马驮经：二人以白马驮经抵达洛阳传法、译经；\n\n· 白马寺：次年敕建，为中国第一座佛教寺庙。","clips":[]},{"n":52,"kind":"单项选择题","answer":"B","stem":"中国古代最早采用的纪年法是（ ）。","options":{"A":"公元纪年","B":"帝王纪年法","C":"年号纪年法","D":"干支纪年法"},"explanation":"答案选 B。中国古代最早采用的是帝王纪年法，即帝王登基那一年算起，有一年算\n\n一年；西汉武帝时开始采用年号纪年。\n\n易混对比——古代纪年法：\n\n· 帝王纪年法：中国古代最早采用，从帝王登基那一年算起；\n\n· 年号纪年法：西汉武帝时开始采用，改年号叫“改元”；\n\n· 共和行政：自公元前 841 年起，中国历史有了确切的纪年。","clips":[]},{"n":53,"kind":"单项选择题","answer":"B","stem":"泰国人忌讳用（ ）服务或用其吃东西。","options":{"A":"右手","B":"左手","C":"双手","D":"筷子"},"explanation":"答案选 B。泰国人进入寺庙及进入他人房间前要脱鞋，忌讳用左手服务或用左手吃\n\n东西；泰国僧侣不可与女性进行身体接触，除僧侣外任何人不能触摸他人头部。\n\n同类对比——泰国礼俗禁忌：\n\n· 脱鞋：进入寺庙及进入他人房间前要脱鞋；\n\n· 左手：忌讳用左手服务或用左手吃东西；\n\n· 僧侣：不可与女性进行身体接触。","clips":[]},{"n":54,"kind":"单项选择题","answer":"A","stem":"世界上线路最长、标准最高的高速铁路是（ ）。","options":{"A":"京沪高铁","B":"京张高铁","C":"成渝高铁","D":"京津城际铁路"},"explanation":"答案选 A。2011 年运营的京沪高铁，全长 1318 公里、运行时速 350 公里，是世界上\n\n线路最长、标准最高的高速铁路；2008 年开通的京津城际铁路是中国第一条高速铁路。\n\n同类对比——我国高速铁路成就：\n\n· 京沪高铁：2011 年运营，全长 1318 公里，是世界上线路最长、标准最高的高速铁路；\n\n· 京津城际铁路：2008 年开通，是中国第一条高速铁路；\n\n· 六次大提速：1997-2007 年，中国铁路创造了世界上既有线路提速改造的先进水平。","clips":[]},{"n":55,"kind":"单项选择题","answer":"D","stem":"我国第一部针灸学著作《针灸甲乙经》的作者是（ ）。","options":{"A":"王叔和","B":"孙思邈","C":"李时珍","D":"皇甫谧"},"explanation":"答案选 D。皇甫谧著《针灸甲乙经》，是我国第一部针灸学著作。A 西晋王叔和著《脉\n\n经》，是我国最早的脉学著作；B 孙思邈是唐朝名医，著《千金方》；C 李时珍是明朝药物学\n\n家，著《本草纲目》。\n\n易混对比——古代医学名著：\n\n· 《针灸甲乙经》：西晋皇甫谧著，我国第一部针灸学著作；\n\n· 《脉经》：西晋王叔和著，我国最早的脉学著作；\n\n· 《千金方》：唐朝孙思邈著；\n\n· 《本草纲目》：明朝李时珍著。","clips":[]},{"n":56,"kind":"单项选择题","answer":"B","stem":"党的十一届三中全会召开的时间是（ ）。","options":{"A":"1976 年 10 月","B":"1978 年 12 月 18-22 日","C":"1980 年 2 月","D":"1982 年 9 月"},"explanation":"答案选 B。1978 年 12 月 18-22 日，党的十一届三中全会在北京举行，会议的主要任\n\n务是确定把全党工作重点转移到社会主义现代化建设上来。\n\n同类对比——党史重要会议：\n\n· 中共一大：1921 年 7 月 23 日在上海召开；\n\n· 遵义会议：1935 年 1 月 15-17 日，中共中央在遵义召开政治局扩大会议；\n\n· 十一届三中全会：1978 年 12 月 18-22 日在北京举行。","clips":[]},{"n":57,"kind":"单项选择题","answer":"A","stem":"北宋范仲淹脍炙人口的（ ）使岳阳楼著称于世。","options":{"A":"《岳阳楼记》","B":"《醉翁亭记》","C":"《游褒禅山记》","D":"《前赤壁赋》"},"explanation":"答案选 A。岳阳楼位于湖南岳阳，自古有“洞庭天下水，岳阳天下楼”之誉，北宋\n\n范仲淹脍炙人口的《岳阳楼记》更使岳阳楼著称于世；其屋顶为四坡盔顶，是我国现存最大、\n\n最著名的盔顶建筑。B《醉翁亭记》是欧阳修的名篇；C《游褒禅山记》是王安石的名篇；D\n\n《前赤壁赋》是苏轼的名篇。\n\n易混对比——江南名楼与名篇：\n\n· 岳阳楼：湖南岳阳，范仲淹《岳阳楼记》，“洞庭天下水，岳阳天下楼”；\n\n· 滕王阁：王勃《滕王阁序》，“落霞与孤鹜齐飞，秋水共长天一色”；\n\n· 黄鹤楼：崔颢“昔人已乘黄鹤去，此地空余黄鹤楼”。","clips":[]},{"n":58,"kind":"单项选择题","answer":"C","stem":"位居景德镇四大传统名瓷之首，享有“瓷国明珠”之美誉的是（ ）。","options":{"A":"粉彩瓷","B":"颜色釉瓷","C":"青花瓷","D":"玲珑瓷"},"explanation":"答案选 C。青花瓷、玲珑瓷、粉彩瓷、颜色釉瓷并称为景德镇四大传统名瓷，其中\n\n青花瓷烧造历史最为悠久，位居四大名瓷之首，享有“瓷国明珠”之美誉。\n\n易混对比——景德镇四大传统名瓷：\n\n· 青花瓷：位居四大名瓷之首，享有“瓷国明珠”之美誉；\n\n· 玲珑瓷：四大传统名瓷之一；\n\n· 粉彩瓷：四大传统名瓷之一；\n\n· 颜色釉瓷：四大传统名瓷之一。","clips":[]},{"n":59,"kind":"单项选择题","answer":"D","stem":"长城的设施中，遇敌情时白天燃烟、夜间放火的是（ ）。","options":{"A":"关隘","B":"城墙","C":"敌台","D":"烽火台"},"explanation":"答案选 D。烽火台是利用举火和燃烟来传达军情的高台建筑，一般都筑在长城附近\n\n的小山包上，如遇敌情，白天燃烟，夜间放火，并以鸣炮的数目告知来敌的大致数目，台台\n\n相传，通报敌情消息。\n\n同类对比——长城军事防御设施：\n\n· 城墙：长城的建筑主体，外侧一面设垛口墙、望口、射洞；\n\n· 敌台：骑跨城墙突兀于墙外，可以从侧向射击敌人；\n\n· 烽火台：白天燃烟、夜间放火传达军情；\n\n· 关隘：长城沿线重要据点，扼守出入长城的咽喉要道。","clips":[]},{"n":60,"kind":"单项选择题","answer":"A","stem":"秦在关中修建的、主要用于农业灌溉的水利工程是（ ）。","options":{"A":"郑国渠","B":"都江堰","C":"灵渠","D":"邗沟"},"explanation":"答案选 A。秦在关中修建郑国渠，在蜀郡修建都江堰，主要用于农业灌溉，使关中\n\n平原和成都平原成为沃野。B 都江堰由秦蜀郡守李冰主持修建，位于蜀郡；C 灵渠是秦南征\n\n岭南时开凿；D 邗沟是春秋时期吴国开凿的沟通长江和淮河的运河。\n\n同类对比——古代著名水利工程：\n\n· 郑国渠：秦在关中修建，主要用于农业灌溉；\n\n· 都江堰：秦在蜀郡修建，使成都平原成为沃野；\n\n· 灵渠：秦朝开凿；\n\n· 邗沟：春秋时期吴国开凿。","clips":[]},{"n":61,"kind":"单项选择题","answer":"B","stem":"中国“天空之镜”指的是（ ）。","options":{"A":"青海湖","B":"茶卡盐湖","C":"东台吉乃尔湖","D":"察尔汗盐湖"},"explanation":"中国“天空之镜”——茶卡盐湖。A 项青海湖是我国最大的内陆咸水湖，C 项东台吉\n\n乃尔湖称青海版“马尔代夫”，D 项察尔汗盐湖是中国最大的盐湖，而“天空之镜”指茶卡\n\n盐湖，故不选。\n\n易混对比——青海湖泊盐湖：\n\n· 青海湖：我国最大的内陆咸水湖；\n\n· 茶卡盐湖：中国“天空之镜”；\n\n· 东台吉乃尔湖：青海版“马尔代夫”；\n\n· 察尔汗盐湖：中国最大的盐湖（面积超 5800 平方千米）。","clips":[]},{"n":62,"kind":"单项选择题","answer":"C","stem":"中国园林发展的转折点是（ ）。","options":{"A":"宋元时期","B":"秦汉时期","C":"魏晋南北朝时期","D":"隋唐时期"},"explanation":"答案选 C。魏晋南北朝时期是中国园林发展的转折点；唐宋时期园林达到成熟阶段，\n\n明清时期园林艺术进入精深发展阶段。\n\n同类对比——中国古典园林发展阶段：\n\n· 魏晋南北朝时期：中国园林发展的转折点；\n\n· 唐宋时期：园林达到成熟阶段；\n\n· 明清时期：园林艺术进入精深发展阶段。","clips":[]},{"n":63,"kind":"单项选择题","answer":"B","stem":"被誉为“中国楹联第一村”的古村是（ ）。","options":{"A":"宏村","B":"西递","C":"诸葛八卦村","D":"曼底下村"},"explanation":"正确答案为 B。西递以楹联文化为最大特色，被誉为“中国楹联第一村”。26 版教材\n\n新增考点。\n\n易混对比——西递与宏村特色：\n\n· 西递：船形村落，以楹联文化著称；\n\n· 宏村：牛形水系，月沼为牛胃南湖为牛肚；\n\n区分关键：“中国楹联第一村”是西递；宏村以牛形水系和“中国画里的乡村”著称。","clips":[]},{"n":64,"kind":"单项选择题","answer":"A","stem":"韩国人一日三餐都离不开泡菜，韩国的主食是（ ）。","options":{"A":"大米","B":"玉米","C":"土豆","D":"面食"},"explanation":"答案选 A。韩国食物以泡菜文化为特色，主食是大米，传统名菜有烤肉、泡菜、冷\n\n面。\n\n同类对比——韩国饮食文化：\n\n· 泡菜：韩国人一日三餐都离不开；\n\n· 主食：大米；\n\n· 传统名菜：烤肉、泡菜、冷面。","clips":[]},{"n":65,"kind":"单项选择题","answer":"D","stem":"“楚庭”是（ ）最早的名称。","options":{"A":"潮州市","B":"惠州市","C":"肇庆市","D":"广州市"},"explanation":"“楚庭”是广州最早的名称，公元 226 年，孙权将交州分为交州和广州，“广州”由\n\n此得名。","clips":[]},{"n":66,"kind":"单项选择题","answer":"A","stem":"陕西盛产苹果，成为陕西优质苹果代名词的是（ ）。","options":{"A":"洛川苹果","B":"米脂小米","C":"富平柿饼","D":"临潼石榴"},"explanation":"陕西盛产苹果，洛川苹果成为陕西优质苹果的代名词。B 项米脂小米、C 项富平柿饼\n\n均为陕西风物特产，D 项临潼石榴为干扰项，成为陕西优质苹果代名词者为洛川苹果，故不\n\n选。\n\n同类对比——陕西风物（陕西）：\n\n· 洛川苹果：陕西优质苹果的代名词；\n\n· 米脂小米：颗粒圆大、色泽金黄、黏糯爽口、清香四溢；\n\n· 富平柿饼：白里透红、清甜软糯，远销海内外。","clips":[]},{"n":67,"kind":"单项选择题","answer":"A","stem":"法国最古老的城市是（ ）。","options":{"A":"马赛","B":"巴黎","C":"尼斯","D":"夏纳"},"explanation":"答案选 A。马赛是法国第二大城市，位于法国南部，是地中海最大的港口，建于公\n\n元前 6 世纪的古希腊时代，是法国最古老的城市。\n\n易混对比——法国主要城市：\n\n· 马赛：法国最古老的城市，地中海最大的港口；\n\n· 巴黎：法国首都；\n\n· 尼斯：仅次于巴黎的法国第二大旅游城市；\n\n· 夏纳：因每年举办国际电影节而闻名。","clips":[]},{"n":68,"kind":"单项选择题","answer":"A","stem":"有“木雕之乡”之称的是（ ）。","options":{"A":"浙江东阳","B":"浙江温州乐清","C":"福建福州","D":"广东潮汕地区"},"explanation":"答案选 A。东阳木雕产于浙江东阳，当地有“木雕之乡”之称。东阳木雕不施彩绘，\n\n以木材天然色泽为基调，又有“白木雕”之称。26 教材新增考点。\n\n易混对比——东阳乐清潮州木雕称号：\n\n· 东阳：木雕之乡，不施彩绘，又称白木雕；\n\n· 乐清：中国黄杨木雕之乡；\n\n· 潮州：以金漆木雕著称。","clips":[]},{"n":69,"kind":"单项选择题","answer":"C","stem":"南京大屠杀中，遇难者达（ ）人以上。","options":{"A":"10 万","B":"20 万","C":"30 万","D":"40 万"},"explanation":"答案选 C。1937 年 12 月 13 日，日军占领南京后，进行了长达 6 周骇人听闻的血腥\n\n大屠杀，中国平民和解除武装的军人被枪杀、焚烧、活埋以及被日军用其他方法残忍杀害者\n\n达 30 万人以上。\n\n同类对比——抗日战争重大事件：\n\n· 九一八事变：1931 年 9 月 18 日，东北三省沦为日本占领地；\n\n· 南京大屠杀：1937 年 12 月 13 日，遇难者达 30 万人以上；\n\n· 平型关大捷：全民族抗战爆发后中国军队主动对日作战取得的第一个重大胜利。","clips":[]},{"n":70,"kind":"单项选择题","answer":"A","stem":"隋朝修建的大运河以（ ）为中心。","options":{"A":"洛阳","B":"涿郡","C":"余杭","D":"长安"},"explanation":"答案选 A。隋朝修建了以洛阳为中心的大运河，沟通了南北交通，对后代政治制度\n\n和经济发展影响巨大。\n\n同类对比——隋朝重大工程：\n\n· 大运河：隋朝修建，以洛阳为中心，沟通南北交通；\n\n· 赵州桥：隋代建造，世界上最早的敞肩石拱桥；\n\n· 大兴城：隋朝建造，规划严整。","clips":[]},{"n":71,"kind":"单项选择题","answer":"D","stem":"俗称“黄教”、明清两代执掌藏区政权的教派是（ ）。","options":{"A":"宁玛派","B":"萨迦派","C":"噶举派","D":"格鲁派"},"explanation":"答案选 D。15 世纪初，宗喀巴创立格鲁派，明清时期中央政府对格鲁派多有扶持，\n\n使其一度成为执掌藏区政权和神权的著名教派，势力最大；格鲁派俗称“黄教”，拉萨的甘\n\n丹寺、哲蚌寺、色拉寺及日喀则的扎什伦布寺等都是格鲁派（黄教）重要的寺庙。\n\n易混对比——藏传佛教主要教派：\n\n· 宁玛派：俗称“红教”；\n\n· 萨迦派：俗称“花教”；\n\n· 噶举派：俗称“白教”；\n\n· 格鲁派：俗称“黄教”，明清时期执掌藏区政权。","clips":[]},{"n":72,"kind":"单项选择题","answer":"B","stem":"将神仙信仰系统化，融入儒家思想的是（ ）。","options":{"A":"丘处机","B":"葛洪","C":"陆修静","D":"寇谦之"},"explanation":"答案选 B。葛洪将神仙信仰系统化，融入了儒家思想，他的弟子儒道兼修。A 丘处机\n\n是全真道龙门派开创者；C 陆修静创立南天师道，制定了道徒晋级制度和道教斋醮仪式；D\n\n北朝人寇谦之进一步改革了道教宗教仪式，并把道教思想与忠君、孝道思想融为一体。\n\n易混对比——道教历史人物：\n\n· 葛洪：东晋人，将神仙信仰系统化，融入儒家思想；\n\n· 陆修静：南朝人，参与改造道教；\n\n· 寇谦之：北朝人，参与改造道教；\n\n· 丘处机：全真道龙门派开创者。","clips":[]},{"n":73,"kind":"单项选择题","answer":"B","stem":"威士忌被誉为（ ）。","options":{"A":"“白色火焰”","B":"“液体黄金”","C":"“生命之水”","D":"“液体面包”"},"explanation":"答案选 B。被誉为“液体黄金”的威士忌是英国的特色购物产品。\n\n易混对比——英国特色购物产品：\n\n· 威士忌：被誉为“液体黄金”；\n\n· 银器、泰迪熊、烟斗：英国特色购物产品；\n\n· 英国红茶、英国巧克力、英国雪利酒：特色购物产品。","clips":[]},{"n":74,"kind":"单项选择题","answer":"C","stem":"别名梁溪，素有“太湖明珠”之誉的城市是（ ）。","options":{"A":"常州市","B":"镇江市","C":"无锡市","D":"南通市"},"explanation":"无锡市：别名梁溪，简称“锡”，素有“太湖明珠”之誉。\n\n同类对比——江苏城市名片（江苏）：\n\n· 无锡：别名梁溪，简称“锡”，“太湖明珠”；\n\n· 苏州：古称姑苏、平江，有“人间天堂”的美誉；\n\n· 南京：古称金陵、建康，中国四大古都之一、十朝都会；\n\n· 扬州：“淮左名都，竹西佳处”“中国运河第一城”。","clips":[]},{"n":75,"kind":"单项选择题","answer":"D","stem":"中国最大的火山堰塞湖是（ ）。","options":{"A":"长白山天池","B":"喀纳斯湖","C":"五大连池","D":"镜泊湖"},"explanation":"答案选 D。镜泊湖位于黑龙江省牡丹江市，是中国最大的火山堰塞湖，吊水楼瀑布\n\n是镜泊湖景区一绝。A 长白山天池是火山口湖；C 五大连池是火山熔岩堵塞白河河道形成的\n\n火山堰塞湖。\n\n易混对比——火山湖泊类型：\n\n· 镜泊湖：我国最大的火山堰塞湖，吊水楼瀑布是景区一绝；\n\n· 五大连池：因火山熔岩堵塞河道形成 5 个互相连通的火山堰塞湖；\n\n· 长白山天池：火山口湖。","clips":[]},{"n":76,"kind":"单项选择题","answer":"B","stem":"端砚产于（ ）。","options":{"A":"安徽歙县","B":"广东肇庆","C":"甘肃卓尼","D":"山西新绛"},"explanation":"答案选 B。端砚产于广东省肇庆市，因隋在肇庆设端州府，所以称端砚。端砚贵有\n\n石眼，有“端石一斤，价值千金”之说。A 项安徽歙县、C 项甘肃卓尼、D 项山西新绛分别\n\n是歙砚、洮河砚、澄泥砚的产地，三者与端砚并称中国四大名砚，均非端砚产地。\n\n易混对比——中国四大名砚：\n\n· 端砚：产于广东肇庆；\n\n· 歙砚：产于安徽歙县；\n\n· 洮河砚：产于甘肃卓尼；\n\n· 澄泥砚：产于山西新绛。","clips":[]},{"n":77,"kind":"单项选择题","answer":"A","stem":"乌龙茶名品铁观音产于（ ）。","options":{"A":"福建","B":"广东","C":"台湾","D":"云南"},"explanation":"答案选 A。乌龙茶产地主要集中在福建、广东、台湾一带，名品有福建的武夷岩茶、\n\n铁观音，广东的凤凰单枞，台湾的乌龙等。\n\n易混对比——乌龙茶名品产地：\n\n· 铁观音：产于福建；\n\n· 武夷岩茶：产于福建；\n\n· 凤凰单枞：产于广东；\n\n· 乌龙：产于台湾。","clips":[]},{"n":78,"kind":"单项选择题","answer":"B","stem":"世界上规模最大的大理石峡谷是（ ）。","options":{"A":"阿里山峡谷","B":"太鲁阁峡谷","C":"河北白石山","D":"雅鲁藏布江大峡谷"},"explanation":"20 千米长的太鲁阁峡谷是世界上规模最大的大理石峡谷。A 项阿里山以日出、云海、\n\n晚霞、森林、高山铁路“五奇”著称，C 项河北白石山是中国唯一的大理岩峰林景观，D 项\n\n雅鲁藏布江大峡谷是地球上最深的峡谷，世界规模最大的大理石峡谷为太鲁阁峡谷，故不选。\n\n同类对比——峡谷之最：\n\n· 太鲁阁峡谷：世界上规模最大的大理石峡谷，长 20 千米（台湾）；\n\n· 雅鲁藏布江大峡谷：深达 5382 米，是地球上最深的峡谷（西藏）；\n\n· 白石山：中国唯一的大理岩峰林景观（河北）。","clips":[]},{"n":79,"kind":"单项选择题","answer":"A","stem":"有“蜀中之宝”美誉的是（ ）。","options":{"A":"蜀绣","B":"蜀锦","C":"苏绣","D":"宋锦"},"explanation":"答案选 A。蜀绣是以四川成都为中心的刺绣品的总称，古称“川绣”，有“蜀中之宝”\n\n的美誉。26 教材新增考点。\n\n易混对比——蜀绣与蜀锦美誉：\n\n· 蜀绣：以成都为中心，有蜀中之宝美誉；\n\n· 蜀锦：发源地为四川成都，有锦绣之根美称。","clips":[]},{"n":80,"kind":"单项选择题","answer":"D","stem":"被誉为“中国古代农业百科全书”的是北魏贾思勰撰写的（ ）。","options":{"A":"《农书》","B":"《农政全书》","C":"《汜胜之书》","D":"《齐民要术》"},"explanation":"答案选 D。北魏时期，贾思勰撰写《齐民要术》，被誉为“中国古代农业百科全书”，\n\n是中国早期农书中保存最完整的一部。\n\n易混对比——中国古代农书：\n\n· 《汜胜之书》：中国最早的农书，西汉晚期成书；\n\n· 《齐民要术》：北魏贾思勰撰，被誉为“中国古代农业百科全书”；\n\n· 《农政全书》：明代徐光启著，是中国古代农学著作的集大成者。","clips":[]},{"n":81,"kind":"单项选择题","answer":"B","stem":"春秋时期出现了乘法口诀并有了（ ）的概念。","options":{"A":"无理数","B":"分数","C":"小数","D":"负数"},"explanation":"答案选 B。春秋时出现乘法口诀并有了分数的概念。","clips":[]},{"n":83,"kind":"单项选择题","answer":"A","stem":"留下“昔人已乘黄鹤去，此地空余黄鹤楼”名句的是（ ）。","options":{"A":"崔颢","B":"孟浩然","C":"王湾","D":"王维"},"explanation":"答案选 A。人称“唐人七言律诗第一”的崔颢，在武汉黄鹤楼留有“昔人已乘黄鹤\n\n去，此地空余黄鹤楼”的名句；传说李白读了崔颢《黄鹤楼》诗亦大为佩服，感慨“眼前有\n\n景道不得，崔颢题诗在上头”。\n\n易混对比——黄鹤楼名篇：\n\n· 崔颢：人称“唐人七言律诗第一”；\n\n· 《黄鹤楼》：“昔人已乘黄鹤去，此地空余黄鹤楼”；\n\n· 李白：读后感慨“眼前有景道不得，崔颢题诗在上头”。","clips":[],"sourceNote":"原试卷与解析题干不同。此处按试卷题干作答，解析前半段对应试卷题干，后半段另提到李白。"},{"n":84,"kind":"单项选择题","answer":"C","stem":"发明了用“麻沸散”进行全麻后施行腹腔手术，并自创“五禽戏”的东汉“神医”是（ ）。","options":{"A":"张仲景","B":"孙思邈","C":"华佗","D":"李时珍"},"explanation":"答案选 C。东汉“神医”华佗，发明了用“麻沸散”进行全麻后施行腹腔手术，其\n\n自创的“五禽戏”是最早的健身操，开中国保健医学先河。A 张仲景是东汉“医圣”，著《伤\n\n寒杂病论》，开创用八纲辨证施治；B 孙思邈是唐朝名医，著《千金方》，被誉为“药王”；D\n\n李时珍是明朝药物学家，著《本草纲目》。\n\n易混对比——我国古代名医：\n\n· 华佗：东汉“神医”，发明“麻沸散”，自创“五禽戏”；\n\n· 张仲景：东汉“医圣”，著《伤寒杂病论》；\n\n· 孙思邈：唐朝名医，著《千金方》，被誉为“药王”；\n\n· 李时珍：明朝药物学家，著《本草纲目》。","clips":[]},{"n":85,"kind":"单项选择题","answer":"A","stem":"素有“八朝古都”之称，迄今已有 4100 余年建城史和建都史的是（ ）。","options":{"A":"开封市","B":"商丘市","C":"安阳市","D":"郑州市"},"explanation":"开封是首批国家历史文化名城，素有“八朝古都”之称，迄今已有 4100 余年的建城\n\n史和建都史。\n\n同类对比——河南古都（河南）：\n\n· 开封：“八朝古都”，迄今已有 4100 余年建城史和建都史；\n\n· 洛阳：十三朝古都，有 5000 多年文明史、1500 多年建都史；\n\n· 郑州：中国八大古都之一，“天地之中”，别称商都、绿城。","clips":[]},{"n":86,"kind":"单项选择题","answer":"D","stem":"年日照时间 3000 小时以上，素有“日光城”美誉的城市是（ ）。","options":{"A":"日喀则","B":"林芝","C":"昌都","D":"拉萨"},"explanation":"拉萨年日照时间 3000 小时以上，素有“日光城”的美誉。A 项日喀则、B 项林芝、C\n\n项昌都均为西藏城市，但年日照时间 3000 小时以上、素有“日光城”美誉者为拉萨，故不\n\n选。","clips":[]},{"n":87,"kind":"单项选择题","answer":"C","stem":"集演奏、演唱、舞蹈于一体，反映传统农耕生产生活中祭祀祈福、欢庆丰收的朝鲜族民间表演艺术是（ ）。","options":{"A":"长鼓舞","B":"安代舞","C":"农乐舞","D":"摆手舞"},"explanation":"朝鲜族农乐舞是国家级非物质文化遗产，集演奏、演唱、舞蹈于一体，是反映传统\n\n农耕生产生活中祭祀祈福、欢庆丰收的民间表演艺术。A 项长鼓舞是瑶族盛行的传统舞蹈，\n\nB 项安代舞是蒙古族自娱性的传统民间舞蹈，D 项摆手舞是土家族最著名的传统舞蹈，均非\n\n集演奏、演唱、舞蹈于一体的朝鲜族民间表演艺术，故不选。\n\n易混对比——民族舞蹈：\n\n· 农乐舞：朝鲜族，集演奏、演唱、舞蹈于一体（吉林）；\n\n· 长鼓舞：瑶族盛行的传统舞蹈（广西）；\n\n· 安代舞：蒙古族自娱性的传统民间舞蹈（内蒙古）；\n\n· 摆手舞：最著名的土家舞蹈，与祭祀祖先、祈求丰收相联系（湖南）。","clips":[]},{"n":88,"kind":"单项选择题","answer":"D","stem":"黎族传统民居多为竹木结构的楼房或草房，屋顶呈（ ）。","options":{"A":"圆顶形","B":"平顶形","C":"穹窿形","D":"金字塔形"},"explanation":"黎族传统民居多为竹木结构的楼房或草房。金字塔形屋顶，上盖茅草，用竹条或树\n\n枝扎成墙架，再以泥糊。\n\n同类对比——黎族传统民居：\n\n· 金字塔形屋顶：黎族传统民居典型屋顶，上盖茅草；\n\n· 船形屋：用竹木扎构成轮廓，状如船篷，呈半圆筒形；\n\n· 墙架做法：以竹条或树枝扎成墙架，再以泥糊。","clips":[]},{"n":89,"kind":"单项选择题","answer":"B","stem":"已成为北京市第一大产业的是（ ）。","options":{"A":"金融服务业","B":"信息服务业","C":"旅游产业","D":"商务服务业"},"explanation":"北京信息服务业已经成为全市第一大产业。北京全年实现数字经济增加值 24166.3\n\n亿元，占全市地区生产总值的比重为 46.4%。A 项金融服务业、C 项旅游产业、D 项商务服务\n\n业均为北京重要产业，但已成为北京市第一大产业的是信息服务业，故不选。","clips":[]},{"n":90,"kind":"单项选择题","answer":"A","stem":"被誉为“上帝折鞭处”的是（ ）。","options":{"A":"合川钓鱼城","B":"白帝城","C":"荆州古城","D":"襄阳古城"},"explanation":"1243 年至 1279 年发生在此长达 36 年的“钓鱼城保卫战”，是南宋王朝与蒙古之间\n\n的生死决战，钓鱼城因此被誉为“上帝折鞭处”。B 项白帝城在重庆，C 项荆州古城在湖北，\n\nD 项襄阳古城在湖北，发生 36 年“钓鱼城保卫战”且被誉为“上帝折鞭处”者为合川钓鱼\n\n城，故不选。","clips":[]},{"n":91,"kind":"单项选择题","answer":"A","stem":"1973 年，袁隆平等人在世界上首次培育成功强优势的（ ）。","options":{"A":"釉型杂交水稻","B":"粳型杂交水稻","C":"釉型常规水稻","D":"糯型杂交水稻"},"explanation":"答案选 A。1973 年我国釉型杂交水稻科研协作组的袁隆平等人，在世界上首次培育\n\n成功强优势的釉型杂交水稻。\n\n同类对比——新中国科技成就：\n\n· 1973 年：袁隆平等首次培育成功强优势的釉型杂交水稻；\n\n· 1964 年 10 月 16 日：我国第一颗原子弹爆炸成功；\n\n· 2015 年：屠呦呦获诺贝尔生理学或医学奖，贡献为创制新型抗疟药青蒿素和双氢青蒿素。","clips":[]},{"n":92,"kind":"单项选择题","answer":"A","stem":"金星在黄昏时现于西方，称为（ ）。","options":{"A":"“长庚”","B":"“启明”","C":"“岁星”","D":"“荧惑”"},"explanation":"答案选 A。金星又称“明星”“太白”，五星中亮度最强，黎明时现于东方叫“启明”，\n\n黄昏时在西方叫“长庚”，《诗经》有“东有启明，西有长庚”之说。C 岁星是木星；D 荧惑\n\n是火星。\n\n易混对比——金星别称：\n\n· 金星：又称“明星”“太白”，五星中亮度最强；\n\n· 启明：金星黎明时现于东方的称呼；\n\n· 长庚：金星黄昏时现于西方的称呼。","clips":[]},{"n":93,"kind":"单项选择题","answer":"C","stem":"中国现存最早的一部编年体史书是孔子所著（ ）。","options":{"A":"《资治通鉴》","B":"《尚书》","C":"《春秋》","D":"《史记》"},"explanation":"答案选 C。孔子著《春秋》，仅有 1.8 万字，是中国现存最早的一部编年体史书。B\n\n《尚书》和甲骨文是最早的档案类史料；D《史记》是我国第一部纪传体通史。\n\n易混对比——著名史书：\n\n· 《春秋》：孔子著，是中国现存最早的一部编年体史书；\n\n· 《史记》：西汉司马迁著，是中国第一部纪传体通史；\n\n· 《资治通鉴》：宋代司马光主持编写。","clips":[]},{"n":94,"kind":"单项选择题","answer":"A","stem":"陕西被列入联合国教科文组织《人类非物质文化遗产代表作名录》的项目是（ ）。","options":{"A":"西安鼓乐","B":"秦腔","C":"安塞腰鼓","D":"花儿"},"explanation":"陕西列入《人类非物质文化遗产代表作名录》1 项：西安鼓乐。B 项秦腔、C 项安塞\n\n腰鼓均为陕西著名民间艺术，但未列入《人类非物质文化遗产代表作名录》；D 项花儿系甘\n\n肃等省列入该名录的项目，故不选。\n\n同类对比——人类非遗代表作：\n\n· 西安鼓乐（陕西）；\n\n· 花儿、藏戏（甘肃）；\n\n· 侗族大歌（贵州）；\n\n· 粤剧（广东）。","clips":[]},{"n":95,"kind":"单项选择题","answer":"D","stem":"被誉为“生活着的千年古镇”的是（ ）。","options":{"A":"周庄","B":"乌镇","C":"南浔古镇","D":"西塘古镇"},"explanation":"正确答案为 D。西塘古镇位于浙江省嘉善县，地处江浙沪两省一市交界处，是一座\n\n已有千年历史的江南水乡古镇，至今仍有 2600 余户原住居民生活其中，被誉为“生活着的\n\n千年古镇”。A 项，周庄被誉为“中国第一水乡”。B 项，乌镇素有“中国最后的枕水人家”\n\n之誉。C 项，南浔古镇素有“诗书之乡”的美誉。26 版教材新增考点。\n\n易混对比——古镇文化称号辨析：\n\n· 周庄：被誉为“中国第一水乡”；\n\n· 乌镇：素有“中国最后的枕水人家”之誉；\n\n· 南浔古镇：素有“诗书之乡”的美誉；\n\n· 西塘古镇：被誉为“生活着的千年古镇”；\n\n区分关键：西塘是“生活着的千年古镇”；周庄是“中国第一水乡”。","clips":[]},{"n":96,"kind":"单项选择题","answer":"D","stem":"内蒙古的哈达主要有蓝色和白色两种，其中献给珍贵客人的是（ ）。","options":{"A":"白色哈达","B":"红色哈达","C":"黄色哈达","D":"蓝色哈达"},"explanation":"内蒙古的哈达主要有蓝色和白色两种，白色哈达是献给一般客人的，蓝色哈达是献\n\n给珍贵客人的。\n\n易混对比——蒙古族哈达：\n\n· 白色哈达：献给一般客人的；\n\n· 蓝色哈达：献给珍贵客人的；\n\n· 易错点：内蒙古哈达以蓝色最为尊贵，不是白色。","clips":[]},{"n":97,"kind":"单项选择题","answer":"C","stem":"有着“中国电影从这里走向世界”之美誉的是（ ）。","options":{"A":"横店影视城","B":"环球恐龙城","C":"镇北堡西部影城","D":"无锡影视基地"},"explanation":"镇北堡西部影城，这里拍摄了《红高粱》《东邪西毒》《大话西游》等 100 多部影片，\n\n有着“中国电影从这里走向世界”之美誉。A 项横店影视城在浙江东阳，B 项环球恐龙城在\n\n江苏常州，D 项无锡影视基地在江苏，拍摄《红高粱》等影片、有“中国电影从这里走向世\n\n界”之美誉者为镇北堡西部影城，故不选。\n\n同类对比——影视基地：\n\n· 镇北堡西部影城：《红高粱》等 100 多部影片拍摄地，“中国电影从这里走向世界”（宁夏）；\n\n· 横店影视城：国家 5A 级旅游景区（浙江）；\n\n· 无锡影视基地三国水浒城：国家 5A 级旅游景区（江苏）。","clips":[]},{"n":98,"kind":"单项选择题","answer":"B","stem":"香港最具有代表性的沙滩是（ ）。","options":{"A":"亚龙湾","B":"浅水湾","C":"金石滩","D":"北海银滩"},"explanation":"浅水湾号称“天下第一湾”，有“东方夏威夷”之美誉，是香港最具有代表性的沙滩。\n\nA 项亚龙湾在海南，C 项金石滩在大连，D 项北海银滩在广西，香港最具有代表性的沙滩为\n\n浅水湾，故不选。\n\n易混对比——海滨旅游胜地：\n\n· 浅水湾：香港最有代表性的沙滩，“天下第一湾”“东方夏威夷”；\n\n· 亚龙湾：海南海滨胜地；\n\n· 金石滩：大连海滨地貌，“海上石林”；\n\n· 北海银滩：广西北海。","clips":[]},{"n":99,"kind":"单项选择题","answer":"A","stem":"全国唯一经国务院批复的建设践行新发展理念的公园城市示范区是（ ）。","options":{"A":"成都市","B":"重庆市","C":"西安市","D":"昆明市"},"explanation":"成都又被誉为“雪山下的公园城市”“一座来了就不想走的城市”，是全国唯一经国\n\n务院批复的建设践行新发展理念的公园城市示范区。","clips":[]},{"n":100,"kind":"单项选择题","answer":"B","stem":"位于世界“冰雪黄金带”的省份是（ ）。","options":{"A":"黑龙江省","B":"吉林省","C":"辽宁省","D":"内蒙古自治区"},"explanation":"北纬 43°附近是世界的“冰雪黄金带”，长白山雪期长、降雪量大，具有发展冰雪\n\n旅游的良好条件。A 项黑龙江省、C 项辽宁省、D 项内蒙古自治区均非“冰雪黄金带”所指\n\n省份，故不选。","clips":[]},{"n":101,"kind":"单项选择题","answer":"C","stem":"世界上最大的铜鼓现陈列于（ ）。","options":{"A":"桂林博物馆","B":"柳州博物馆","C":"广西壮族自治区博物馆","D":"广东省博物馆"},"explanation":"1972 年，发现于广西北流市六靖镇的汉代云雷纹大铜鼓，被誉为“铜鼓之王”，现\n\n陈列于南宁市广西壮族自治区博物馆内，是世界上最大的铜鼓。\n\n同类对比——广西文化名片（广西）：\n\n· 云雷纹大铜鼓：“铜鼓之王”，世界上最大的铜鼓，陈列于广西壮族自治区博物馆；\n\n· 左江花山岩画：2016 年列入《世界遗产名录》，展现壮族先民骆越人社会生活；\n\n· 刘三姐歌谣：国家级非物质文化遗产。","clips":[]},{"n":102,"kind":"单项选择题","answer":"C","stem":"刘备“三顾茅庐”“隆中对”等故事发生在湖北的（ ）。","options":{"A":"荆州","B":"宜昌","C":"襄阳","D":"武汉"},"explanation":"襄阳：刘备“三顾茅庐”“隆中对”等故事就发生在这里。A 项荆州、B 项宜昌、D\n\n项武汉均为湖北城市，但“三顾茅庐”“隆中对”发生地为襄阳，故不选。","clips":[]},{"n":103,"kind":"单项选择题","answer":"D","stem":"我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群，历代官方祭祀伏羲的重要地方是（ ）。","options":{"A":"周口太昊伏羲陵","B":"炎帝陵","C":"黄帝陵","D":"天水伏羲庙"},"explanation":"天水伏羲庙是我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群，是历\n\n代官方祭祀伏羲的重要地方。A 项太昊伏羲陵在河南，B 项炎帝陵在湖南，C 项黄帝陵在陕\n\n西，我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群是天水伏羲庙，故不选。\n\n易混对比——始祖祭祀地：\n\n· 天水伏羲庙：我国目前规模最宏大、保存最完整的纪念伏羲氏的明代建筑群（甘肃）；\n\n· 太昊伏羲陵：淮阳太昊伏羲祭典是寻根祭祖盛典（河南）。","clips":[]},{"n":104,"kind":"单项选择题","answer":"B","stem":"我国最大的淡水湖是（ ），被称为“白鹤世界”“珍禽王国”。","options":{"A":"太湖","B":"鄱阳湖","C":"巢湖","D":"洞庭湖"},"explanation":"答案选 B。鄱阳湖是我国最大的淡水湖，湖中有大量长江流域的珍贵鱼类，每年还\n\n有许多珍贵的鸟类栖息在这里，被称为“白鹤世界”“珍禽王国”。\n\n同类对比——我国著名湖泊：\n\n· 鄱阳湖：我国最大的淡水湖，被称为“白鹤世界”“珍禽王国”；\n\n· 镜泊湖：我国最大的火山堰塞湖；\n\n· 五大连池：因火山熔岩堵塞河道形成 5 个互相连通的火山堰塞湖。","clips":[]},{"n":105,"kind":"单项选择题","answer":"B","stem":"自称“毕慈卡”，先民与古代巴人有直接渊源关系的民族是（ ）。","options":{"A":"苗族","B":"土家族","C":"侗族","D":"瑶族"},"explanation":"土家族人自称“毕慈卡”，意为本地人。土家族的先民与古代巴人有直接的渊源关系。\n\nA 项苗族、C 项侗族、D 项瑶族的自称均非“毕慈卡”，其先民与古代巴人亦无直接渊源关系，\n\n故不选。\n\n同类对比——民族自称：\n\n· 土家族：自称“毕慈卡”，意为本地人；\n\n· 畲族：自称“山哈”，意为山里的客人（浙江）；\n\n· 羌族：自称尔玛，又称“云朵上的民族”（四川）；\n\n· 维吾尔：民族自称，意为“团结”“联合”“协助”（新疆）。","clips":[]},{"n":106,"kind":"单项选择题","answer":"B","stem":"2024 年 7 月列入《世界遗产名录》、填补了中国世界自然遗产中缺少沙漠类型空白的是（ ）。","options":{"A":"塔克拉玛干沙漠","B":"巴丹吉林沙漠—沙山湖泊群","C":"腾格里沙漠","D":"科尔沁草原"},"explanation":"巴丹吉林沙漠—沙山湖泊群于 2024 年 7 月被成功列入《世界遗产名录》，填补了中\n\n国世界自然遗产中缺少沙漠类型的空白。A 项塔克拉玛干沙漠是中国最大的沙漠，C 项腾格\n\n里沙漠在宁夏中卫与黄河相遇，D 项科尔沁草原被誉为“草原上的花园”，2024 年列入《世\n\n界遗产名录》的沙漠类遗产为巴丹吉林沙漠—沙山湖泊群，故不选。\n\n同类对比——沙漠景观：\n\n· 巴丹吉林沙漠：中国第三大沙漠、第二大流动沙漠，“中国最美沙漠”（内蒙古）；\n\n· 塔克拉玛干沙漠：中国最大的沙漠，面积 33.76 万平方公里（新疆）；\n\n· 腾格里沙漠：在宁夏中卫与黄河相遇，现“大漠孤烟直，长河落日圆”风光（宁夏）。","clips":[]},{"n":107,"kind":"单项选择题","answer":"A","stem":"古朴典雅的纳西族建筑中，丽江古城的（ ）最具代表性。","options":{"A":"四方街","B":"木府","C":"黑龙潭","D":"五凤楼"},"explanation":"丽江古城的四方街最具代表性。纳西古乐起源于 14 世纪，是云南省最为古老的乐曲，\n\n也是世界最古老的乐曲之一，被誉为“音乐化石”。B 项木府、C 项黑龙潭、D 项五凤楼均为\n\n丽江知名景观，但最具代表性的是丽江古城四方街，故不选。","clips":[]},{"n":108,"kind":"单项选择题","answer":"B","stem":"白毫银针属于（ ）。","options":{"A":"黄茶","B":"白茶","C":"黑茶","D":"绿茶"},"explanation":"答案选 B。白茶茶性寒凉，有退热祛暑之功效，名品有白毫银针、白牡丹、贡眉等。\n\n易混对比——茶叶发酵程度：\n\n· 白茶：轻发酵茶，茶性寒凉，有退热祛暑之功效；\n\n· 绿茶：不发酵茶，初制时高温杀青；\n\n· 青茶（乌龙茶）：半发酵茶；\n\n· 红茶：全发酵茶；\n\n· 黑茶：后发酵茶。","clips":[]},{"n":109,"kind":"单项选择题","answer":"B","stem":"有高空跳塔和空中漫步等刺激娱乐项目，其蹦极是世界上商业蹦极之最，高度达 233米的是（ ）。","options":{"A":"大三巴牌坊","B":"澳门旅游塔","C":"妈阁庙","D":"金莲花广场"},"explanation":"澳门旅游塔的冒险乐园是世界顶级娱乐场所，有高空跳塔和空中漫步等刺激娱乐项\n\n目，它的蹦极是世界上商业蹦极之最，高度达到 233 米。A 项大三巴牌坊是澳门的象征，C\n\n项妈阁庙是澳门三大古刹中最古老者，D 项金莲花广场是澳门回归的纪念地标，蹦极高度达\n\n233 米、为世界商业蹦极之最者为澳门旅游塔，故不选。\n\n同类对比——澳门地标（澳门）：\n\n· 大三巴牌坊：“澳门八景”之一，澳门的象征，圣保禄教堂正面前壁的遗址；\n\n· 妈阁庙：澳门三大古刹中最古老者，澳门葡文名称 MACAU 由此而来；\n\n· 金莲花广场：为庆祝 1999 年澳门主权回归设立；\n\n· 澳门旅游塔：蹦极是世界上商业蹦极之最，高度达 233 米。","clips":[]},{"n":110,"kind":"单项选择题","answer":"C","stem":"将民族区域自治制度载入国家根本大法的是（ ）。","options":{"A":"1984 年《中华人民共和国民族区域自治法》","B":"党的十五大报告","C":"1954 年第一届全国人民代表大会通过的《中华人民共和国宪法》","D":"1949 年《中国人民政治协商会议共同纲领》"},"explanation":"答案选 C。1954 年第一届全国人民代表大会通过的《中华人民共和国宪法》，将民族\n\n区域自治制度载入国家根本大法；1954 年第一部宪法和其后历次修改的宪法都确认了这一\n\n政策和制度的地位。\n\n同类对比——民族区域自治制度入法历程：\n\n· 《共同纲领》：1949 年通过，起临时宪法作用；\n\n· 1954 年宪法：第一届全国人民代表大会通过，将民族区域自治制度载入国家根本大法；\n\n· 历次修宪：都确认了民族区域自治政策和制度的地位。","clips":[]},{"n":111,"kind":"单项选择题","answer":"A","stem":"素有“无峰不奇，无石不峭，无庙不古，无处不幽”之美誉的名山是（ ）。","options":{"A":"千山","B":"五台山","C":"齐云山","D":"天柱山"},"explanation":"辽宁千山素有“东北明珠”之称，有“无峰不奇，无石不峭，无庙不古，无处不幽”\n\n之美誉。B 项五台山在山西，C 项齐云山、D 项天柱山均为安徽名山，均非“无峰不奇，无\n\n石不峭，无庙不古，无处不幽”之美誉所指，故不选。","clips":[]},{"n":112,"kind":"单项选择题","answer":"D","stem":"素有“黄山归来不看山，九寨归来不看水”之说的景区是（ ）。","options":{"A":"黄龙景区","B":"四姑娘山","C":"峨眉山","D":"九寨沟景区"},"explanation":"九寨沟景区叠瀑、翠海、彩林、雪峰密布，水色清纯艳丽，有如“人间仙境”“童话\n\n世界”，素有“黄山归来不看山，九寨归来不看水”之说。A 项黄龙、B 项四姑娘山、C 项峨\n\n眉山均为四川著名景区，但素有“黄山归来不看山，九寨归来不看水”之说者为九寨沟景区，\n\n故不选。\n\n同类对比——四川景区誉称（四川）：\n\n· 九寨沟：“人间仙境”“童话世界”，素有“黄山归来不看山，九寨归来不看水”之说；\n\n· 峨眉山：普贤菩萨道场，“佛国天堂”“仙山佛国”。","clips":[]},{"n":113,"kind":"单项选择题","answer":"A","stem":"与美国阿波罗宇宙飞船登月活动、苏联第一颗人造卫星共同被联合国评为“象征 20世纪人类征服自然的三大奇迹”的中国工程是（ ）。","options":{"A":"成昆铁路工程","B":"青藏铁路工程","C":"三峡工程","D":"港珠澳大桥"},"explanation":"1984 年 12 月 8 日，中国成昆铁路工程、美国阿波罗宇宙飞船登月活动和苏联第一\n\n颗人造卫星，共同被联合国评为“象征 20 世纪人类征服自然的三大奇迹”。B 项青藏铁路、\n\nC 项三峡工程、D 项港珠澳大桥均为伟大工程，但与阿波罗登月、苏联第一颗人造卫星并称\n\n20 世纪人类征服自然三大奇迹者为成昆铁路工程，故不选。\n\n同类对比——中国超级工程：\n\n· 成昆铁路：与美国阿波罗登月、苏联第一颗人造卫星并称“象征 20 世纪人类征服自然的\n\n三大奇迹”（四川）；\n\n· 青藏铁路：全长 1956 公里，是世界上海拔最高、在冻土上路程最长的高原铁路（西藏）；\n\n· 港珠澳大桥：全长 55 千米，是目前世界上最长的跨海大桥（粤港澳）。","clips":[]},{"n":114,"kind":"单项选择题","answer":"D","stem":"全国规模最大、最完整的关帝建筑群是（ ）。","options":{"A":"大同华严寺","B":"太原晋祠","C":"平遥城隍庙","D":"运城解州关帝庙"},"explanation":"运城解州关帝庙是全国规模最大、最完整的关帝建筑群。解州关帝庙也是全国规模\n\n最大的武庙。A 项大同华严寺、B 项太原普祠、C 项平遥城隍庙均为山西著名古建筑，但全\n\n国规模最大、最完整的关帝建筑群为运城解州关帝庙，故不选。\n\n同类对比——山西古建（山西）：\n\n· 解州关帝庙：全国规模最大、最完整的关帝建筑群，全国规模最大的武庙（运城）；\n\n· 晋祠：荟萃多元古建筑形制的千年古祠（太原）；\n\n· 华严寺：大雄宝殿建筑面积之宏伟、殿顶鸱吻之高大均为全国佛寺之最（大同）。","clips":[]},{"n":115,"kind":"单项选择题","answer":"B","stem":"有“中国夏都”之称的是（ ）。","options":{"A":"兰州市","B":"西宁市","C":"银川市","D":"乌鲁木齐市"},"explanation":"西宁有“中国夏都”之称。西宁古称西平郡、青唐城，是青藏高原唯一人口超过百\n\n万的中心城市。\n\n同类对比——城市别称：\n\n· 西宁：“中国夏都”（青海）；\n\n· 哈尔滨：“冰城”“东方莫斯科”“东方小巴黎”（黑龙江）；\n\n· 长春：“北国春城”“东方底特律”（吉林）；\n\n· 拉萨：年日照时间 3000 小时以上，“日光城”（西藏）。","clips":[]},{"n":116,"kind":"单项选择题","answer":"C","stem":"世界上最小的首都之一是（ ），机场建在邻近的珊瑚岛。","options":{"A":"新加坡市","B":"斯里巴加湾市","C":"马累","D":"曼谷"},"explanation":"答案选 C。马累是马尔代夫的首都，面积约 1.96 平方千米，是世界上最小的首都之\n\n一，小得没有自己的机场，马尔代夫的机场建在隔邻的瑚湖尔岛。\n\n易混对比——特色首都：\n\n· 马累：马尔代夫首都，世界最小首都之一，机场建在瑚湖尔岛；\n\n· 新加坡：首都即国家，一个城市就是一个国家；\n\n· 印度：首都新德里，孟买素有印度“商业首都”之称。","clips":[]},{"n":117,"kind":"单项选择题","answer":"A","stem":"始建于春秋时期，完成于战国时期，西起黄河河畔，东至黄海海滨的长城是（ ）。","options":{"A":"齐长城","B":"嘉峪关","C":"明长城","D":"黄崖关长城"},"explanation":"齐长城，始建于春秋时期，完成于战国时期，西起黄河河畔，东至黄海海滨。B 项\n\n嘉峪关号称“天下第一雄关”，C 项明长城为明代修筑，D 项黄崖关长城在天津，均非始建于\n\n春秋、完成于战国者，故不选。\n\n同类对比——长城名胜：\n\n· 齐长城：始建于春秋、完成于战国，西起黄河、东至黄海（山东）；\n\n· 山海关：建于明长城东端，“万里长城第一关”（河北）；\n\n· 嘉峪关：“天下第一雄关”，在甘肃；\n\n· 黄崖关长城：天津的世界文化遗产。","clips":[]},{"n":118,"kind":"单项选择题","answer":"C","stem":"最早见于《史记》，曾经为丝绸之路必经之地的西域故城遗迹是（ ）。","options":{"A":"交河故城遗址","B":"高昌故城","C":"楼兰故城遗址","D":"北庭故城"},"explanation":"楼兰，是西域故城遗迹。最早见于《史记》，曾经为丝绸之路必经之地。A 项交河故\n\n城、B 项高昌故城、D 项北庭故城均为西域故城遗迹，但最早见于《史记》、曾为丝绸之路必\n\n经之地者为楼兰故城遗址，故不选。\n\n同类对比——西域故城（新疆）：\n\n· 楼兰故城：最早见于《史记》，曾经为丝绸之路必经之地；\n\n· 交河故城：世界上最大最古老、保存得最完好的生土建筑城市，安西都护府最早驻地；\n\n· 高昌故城、北庭故城：丝绸之路世界遗产点。","clips":[]},{"n":119,"kind":"单项选择题","answer":"C","stem":"“元曲四大家”中《倩女离魂》的作者是（ ）。","options":{"A":"白朴","B":"马致远","C":"郑光祖","D":"关汉卿"},"explanation":"答案选 C。元曲著名作品有关汉卿《窦娥冤》、白朴《墙头马上》、马致远《汉宫秋》、\n\n郑光祖《倩女离魂》，此四人被誉为“元曲四大家”。\n\n易混对比——元曲四大家及其代表作：\n\n· 关汉卿：《窦娥冤》；\n\n· 白朴：《墙头马上》；\n\n· 马致远：《汉宫秋》；\n\n· 郑光祖：《倩女离魂》。","clips":[]},{"n":120,"kind":"单项选择题","answer":"D","stem":"书院模式的成熟标志，理学大师朱熹制订书院揭示的书院是（ ）。","options":{"A":"鹅湖书院","B":"白鹭洲书院","C":"嵩阳书院","D":"白鹿洞书院"},"explanation":"白鹿洞书院是书院模式的成熟标志，理学大师朱熹制订的《白鹿洞书院揭示》是我\n\n国古代书院最早的章程，成为后世书院遵行的准绳和法规。A 项鹅湖书院首创学术自由争辩\n\n之风，B 项白鹭洲书院以人才辈出、延续办学 800 年著称，C 项嵩阳书院在河南登封“天地\n\n之中”历史建筑群中，均非“书院模式的成熟标志”，故不选。\n\n易混对比——江西三大书院：\n\n· 白鹿洞书院：中国四大书院之一，“天下书院之首”，朱熹《白鹿洞书院揭示》为古代书\n\n院最早章程；\n\n· 鹅湖书院：首创学术自由争辩之风；\n\n· 白鹭洲书院：以人才辈出、延续办学 800 年著称。","clips":[]},{"n":121,"kind":"单项选择题","answer":"D","stem":"厦景一般上现厦景多出现在（ ），下现厦景多出现在沙漠地区。","options":{"A":"高原地区","B":"内陆盆地","C":"草原地区","D":"海滨地区"},"explanation":"答案选 D。蜃景有上现蜃景与下现蜃景之分，一般上现蜃景多出现在海滨地区，下\n\n现蜃景多出现在沙漠地区；山东蓬莱蜃景出现次数最多。\n\n同类对比——蜃景奇观：\n\n· 上现蜃景：多出现在海滨地区；\n\n· 下现蜃景：多出现在沙漠地区；\n\n· 山东蓬莱：我国蜃景出现次数最多的地方。","clips":[]},{"n":122,"kind":"单项选择题","answer":"B","stem":"被称为中华民族的“四季花园”和中外游客的“度假天堂”的是（ ）。","options":{"A":"云南","B":"海南","C":"福建","D":"台湾"},"explanation":"海南被称为中华民族的“四季花园”和中外游客的“度假天堂”。A 项云南有“动植\n\n物王国”之称，C 项福建、D 项台湾均为东南沿海省份，被称为中华民族的“四季花园”和\n\n中外游客的“度假天堂”的是海南，故不选。","clips":[]},{"n":123,"kind":"单项选择题","answer":"B","stem":"下列美食中，属于河北标志性特产美食的是（ ）。","options":{"A":"狗不理包子","B":"河间驴肉火烧","C":"刀削面","D":"羊肉泡馍"},"explanation":"河间驴肉火烧是河北标志性特产美食。A 项狗不理包子为天津名吃，C 项刀削面为山\n\n西面食，D 项羊肉泡馍为陕西名吃，河北标志性特产美食为河间驴肉火烧，故不选。\n\n易混对比——华北名吃：\n\n· 河间驴肉火烧：河北标志性特产美食（河北）；\n\n· 狗不理包子：天津小吃“津门三绝”之一（天津）；\n\n· 刀削面：削面工艺独特、形似柳叶，太原被称为“面食之都”（山西）；\n\n· 牛羊肉泡馍：陕西风味小吃代表（陕西）。","clips":[]},{"n":124,"kind":"单项选择题","answer":"D","stem":"具有鲜明民族特色的畲族女性传统服装是（ ）。","options":{"A":"七星披肩","B":"彩虹袖","C":"杂帕","D":"凤凰装"},"explanation":"畲族女性的传统服装“凤凰装”具有鲜明的民族特色。A 项七星披肩是纳西族妇女\n\n最具特色的服饰，B 项彩虹袖是互助土族传统服饰最典型的标志之一，C 项尕帕是维吾尔族\n\n喜爱的四楞花帽，均非畲族女性的传统服装，故不选。\n\n易混对比——民族服饰：\n\n· 凤凰装：畲族女性的传统服装（浙江、福建）；\n\n· 七星披肩：纳西族妇女最具特色的服饰，象征披星戴月（云南）；\n\n· 彩虹袖：互助土族传统服饰最典型的标志，互助县被誉为“彩虹之乡”（青海）；\n\n· 尕帕：维吾尔族喜爱的四楞花帽（新疆）。","clips":[]},{"n":125,"kind":"单项选择题","answer":"C","stem":"截至 2026 年 7 月，中国列入《世界遗产名录》的世界遗产共有（ ）项。","options":{"A":"59","B":"60","C":"61","D":"62"},"explanation":"截至 2026 年 7 月，中国已有 61 项世界遗产列入《世界遗产名录》，其中世界文化遗\n\n产 42 项、世界自然遗产 15 项（自然遗产总数位列世界第一）、世界文化与自然双重遗产 4\n\n项。\n\n同类对比——中国世界遗产数字：\n\n· 61 项构成：世界文化遗产 42 项、世界自然遗产 15 项（世界第一）、双重遗产 4 项；\n\n· 双重遗产数量：与澳大利亚并列世界第一；\n\n· 两次承办世界遗产委员会会议：2004 年苏州第 28 届、2021 年福州第 44 届。","clips":[]},{"n":126,"kind":"单项选择题","answer":"A","stem":"山西省陵川县境内的昆山挂壁公路位于（ ）景区，是 7 条挂壁公路中最为惊险的。","options":{"A":"王莽岭","B":"绵山","C":"太行山大峡谷","D":"五台山"},"explanation":"山西省内还拥有独特的挂壁公路，陵川县境内的昆山挂壁公路位于王莽岭景区，是\n\n7 条挂壁公路中最为惊险的。","clips":[]},{"n":127,"kind":"单项选择题","answer":"A","stem":"素有“浙江延安”之称的浙南抗日根据地旧址位于（ ）。","options":{"A":"温州平阳","B":"台州临海","C":"温州乐清","D":"金华义乌"},"explanation":"素有“浙江延安”之称的浙南（平阳）抗日根据地旧址，是新民主主义革命时期浙\n\n江唯一一次全省党代会（中共浙江省一大）的召开地。","clips":[]},{"n":128,"kind":"单项选择题","answer":"C","stem":"中国工农红军长征翻越的最后一座高山是（ ）。","options":{"A":"贺兰山","B":"须弥山","C":"六盘山","D":"罗山"},"explanation":"宁夏六盘山是中国工农红军长征翻越的最后一座高山，毛泽东在此写下《清平乐·六\n\n盘山》。","clips":[]},{"n":129,"kind":"单项选择题","answer":"A","stem":"被茶界奉为“茶圣”的是（ ）。","options":{"A":"陆羽","B":"孙思邈","C":"贾思勰","D":"徐光启"},"explanation":"答案选 A。唐代陆羽著《茶经》，是中国也是世界第一部茶叶科学专著，记述了茶的\n\n起源、品质、种植方法、产地、采制、烹饮及器具等，陆羽因此被茶界奉为“茶圣”。B 孙\n\n思邈是唐代名医，著《千金方》，被誉为“药王”。C 贾思勰是北魏农学家，著《齐民要术》。\n\nD 徐光启是明代农学家，著《农政全书》。\n\n同类对比——茶文化：\n\n· 陆羽：唐人，著《茶经》，被后人誉为“茶圣”；\n\n· 《茶经》：是中国也是世界第一部有关茶叶的科学专著；\n\n· 唐代：饮茶风气大盛。","clips":[]},{"n":130,"kind":"单项选择题","answer":"B","stem":"保存了古汉语音韵，被学术界认定为“古汉语的活化石”的是（ ）。","options":{"A":"闽南语","B":"客家方言","C":"福州话","D":"莆仙话"},"explanation":"客家方言保存了古汉语音韵，被学术界认定为“古汉语的活化石”。\n\n三、多选题","clips":[]},{"n":131,"kind":"多项选择题","answer":"ABCD","stem":"“元杂剧四大悲剧”包括（ ）。","options":{"A":"《窦娥冤》","B":"《汉宫秋》","C":"《梧桐雨》","D":"《赵氏孤儿》","E":"《西厢记》"},"explanation":"正确答案为 ABCD。关汉卿《窦娥冤》、马致远《汉宫秋》、白朴《梧桐雨》和纪君祥\n\n《赵氏孤儿》合称“元杂剧四大悲剧”。\n\n易混对比——四大悲剧、元曲四大家与四大古典戏曲：\n\n· 四大悲剧：窦娥冤、汉宫秋、梧桐雨、赵氏孤儿；\n\n· 元曲四大家：关汉卿、白朴、马致远、郑光祖；\n\n· 四大古典戏曲：西厢记、牡丹亭、桃花扇、长生殿。","clips":[]},{"n":132,"kind":"多项选择题","answer":"ABC","stem":"我国已开发的冰川风景区有（ ）。","options":{"A":"四川贡嘎山海螺沟冰川","B":"新疆阿尔泰山喀纳斯冰川湖","C":"云南丽江玉龙雪山冰川","D":"吉林长白山冰川","E":"西藏林芝冰川"},"explanation":"我国已开发的冰川风景区有四川贡嘎山海螺沟冰川、新疆阿尔泰山喀纳斯冰川湖、\n\n云南丽江玉龙雪山冰川等。D 吉林长白山、E 西藏林芝不在已开发冰川风景区之列。\n\n易混对比——我国已开发的冰川风景区：\n\n· 四川贡嘎山海螺沟冰川；\n\n· 新疆阿尔泰山喀纳斯冰川湖；\n\n· 云南丽江玉龙雪山冰川。","clips":[]},{"n":133,"kind":"多项选择题","answer":"BDE","stem":"昆曲诞生了诸多传世经典，下列属于昆曲传世经典的有（ ）。","options":{"A":"《汉宫秋》","B":"《牡丹亭》","C":"《红楼梦》","D":"《长生殿》","E":"《桃花扇》"},"explanation":"它以曲词典雅、唱念做打俱全、表演程式精湛见长，被称为“水磨调”，诞生了《牡\n\n丹亭》《长生殿》《桃花扇》等传世经典。A 项《汉宫秋》是元代马致远的杂剧代表作，C 项\n\n《红楼梦》是古典小说，均非昆曲传世经典，故不选。\n\n易混对比——昆曲传世经典：\n\n· 《牡丹亭》《长生殿》《桃花扇》：昆曲传世经典；\n\n· 《汉宫秋》：元代马致远杂剧代表作，非昆曲剧目；\n\n· 昆曲：2001 年首批“人类口头和非物质遗产代表作”，被称为“百戏之祖”（江苏）。","clips":[]},{"n":134,"kind":"多项选择题","answer":"ACE","stem":"西凤酒的“三绝”包括（ ）。","options":{"A":"不上头","B":"入口醇和浓郁","C":"不干喉","D":"蜜香清雅","E":"回味愉快"},"explanation":"答案选 ACE。西凤酒“不上头、不干喉、回味愉快”的特点被世人赞为“三绝”。B\n\n项，入口醇和浓郁是董酒的特点。D 项，蜜香清雅是米香型酒的主要特征。26 版教材改动：\n\n西凤酒特点描述改为“不上头、不干喉、回味愉快”的“三绝”，并新增“酒中凤凰”美誉。\n\n易混对比——西凤酒三绝：\n\n· 西凤酒三绝：不上头、不干喉、回味愉快；\n\n· 米香型：蜜香清雅、入口柔绵、落口爽冽、回味悠长；\n\n· 西凤酒属性：陕西西凤酒是兼香型白酒代表；\n\n· 区分关键：西凤三绝看不上头、不干喉、回味愉快；米香型看蜜香清雅。","clips":[]},{"n":135,"kind":"多项选择题","answer":"ABCE","stem":"福建是产茶大省，在全国占有重要地位。关于福建茶叶，下列说法正确的有（ ）。","options":{"A":"红茶代表有武夷山“正山小种”、福安“坦洋工夫”","B":"茉莉花茶代表有福州茉莉花茶","C":"福建是乌龙茶、红茶、白茶、茉莉花茶的发源地","D":"安溪铁观音是绿茶的主要代表之一","E":"白茶代表有白毫银针、白牡丹"},"explanation":"福建是乌龙茶、红茶、白茶、茉莉花茶的发源地。乌龙茶的主要代表有安溪铁观音\n\n和武夷岩茶；红茶的代表有武夷山“正山小种”、福安“坦洋工夫”等；白茶的代表有白毫\n\n银针、白牡丹等；茉莉花茶的代表有福州茉莉花茶等。D 项安溪铁观音是乌龙茶的主要代表\n\n之一，而非绿茶，故不选。\n\n易混对比——福建茶类归属（福建）：\n\n· 乌龙茶：安溪铁观音、武夷岩茶（大红袍为精品）；\n\n· 红茶：武夷山“正山小种”、福安“坦洋工夫”；\n\n· 白茶：白毫银针、白牡丹；\n\n· 茉莉花茶：福州茉莉花茶。","clips":[]},{"n":136,"kind":"多项选择题","answer":"ABCD","stem":"下列国家与首都对应正确的有（ ）。","options":{"A":"日本——东京","B":"韩国——首尔","C":"泰国——曼谷","D":"印度——新德里","E":"巴西——里约热内卢"},"explanation":"答案选 ABCD。日本首都东京、韩国首都首尔、泰国首都曼谷、印度首都新德里。E\n\n巴西的首都是巴西利亚，不是里约热内卢，故 E 项错误。","clips":[]},{"n":137,"kind":"多项选择题","answer":"ABDE","stem":"过诺鲁孜节的民族有（ ）。","options":{"A":"柯尔克孜族","B":"乌孜别克族","C":"回族","D":"维吾尔族","E":"哈萨克族"},"explanation":"诺鲁孜节是新疆维吾尔、哈萨克、柯尔克孜、乌孜别克和塔吉克族共有的传统民族\n\n节日，时间在春分时节，相当于公历 3 月 22 日，内容是辞旧迎新，类似内地的春节。C 项\n\n回族的传统节日主要有开斋节、古尔邦节、圣纪节等，不过诺鲁孜节，故不选。\n\n易混对比——新疆共有节日诺鲁孜节：\n\n· 诺鲁孜节：维吾尔、哈萨克、柯尔克孜、乌孜别克、塔吉克族共有，春分时节；\n\n· 开斋节、古尔邦节：回族、维吾尔族等民族的共同节日；\n\n· 注意：回族没有诺鲁孜节。","clips":[]},{"n":138,"kind":"多项选择题","answer":"BCDE","stem":"下列人物中，属于历史上最著名的“京剧四大名旦”的有（ ）。","options":{"A":"周信芳","B":"梅兰芳","C":"程砚秋","D":"荀慧生","E":"尚小云"},"explanation":"历史上最著名的“京剧四大名旦”是梅兰芳、尚小云、程砚秋、荀慧生。A 周信芳\n\n是清末民初海派京剧的著名艺人，不属于京剧四大名旦。","clips":[]},{"n":139,"kind":"多项选择题","answer":"ABCD","stem":"下列关于帝王陵墓封土形式的表述，正确的有（ ）。","options":{"A":"周代开始“封土为坟”","B":"秦汉时期取“方上”形式，以秦始皇陵为典型","C":"唐代改为“以山为陵”，以唐乾陵为典型","D":"宋代恢复“方上”，但规模比秦汉时代小得多","E":"唐乾陵采用“方上”形式"},"explanation":"答案选 ABCD。周代开始“封土为坟”；秦汉时期取“方上”形式，以秦始皇陵为典\n\n型；唐代改为“以山为陵”，唐乾陵即为典型；宋代恢复“方上”，但规模比秦汉时代小得多。\n\nE 唐乾陵采用“以山为陵”形式，不是“方上”，故 E 项错误。\n\n同类对比——帝王陵墓封土形式沿革：\n\n· 周代：开始“封土为坟”；\n\n· 秦汉时期：取“方上”形式，以秦始皇陵为典型；\n\n· 唐代：改为“以山为陵”，以唐乾陵为典型；\n\n· 宋代：恢复“方上”，规模比秦汉小得多；\n\n· 明清两代：采用“宝城宝顶”形式。","clips":[]},{"n":140,"kind":"多项选择题","answer":"ABCD","stem":"下列属于“中国四大名陶”的有（ ）。","options":{"A":"江苏宜兴紫砂器","B":"云南建水紫陶","C":"广西钦州坭兴陶","D":"重庆荣昌安富陶","E":"河南洛阳仿唐三彩"},"explanation":"答案选 ABCD。中国四大名陶包括江苏宜兴紫砂器、云南建水紫陶、广西钦州坭兴陶\n\n和重庆荣昌安富陶。河南洛阳仿唐三彩属于历史悠久的陶器产地，但不列入四大名陶。26\n\n教材新增考点。\n\n易混对比——四大名陶：\n\n· 江苏宜兴：紫砂器；\n\n· 云南建水：紫陶；\n\n· 广西钦州：坭兴陶；\n\n· 重庆荣昌：安富陶。","clips":[]},{"n":141,"kind":"多项选择题","answer":"ABCDE","stem":"关于上海的城市定位与发展，下列说法正确的有（ ）。","options":{"A":"上海是全国最大的经济中心城市","B":"上海是全球重要的经济枢纽","C":"上海是长三角世界级城市群的核心城市","D":"上海是国际经济、金融、贸易、航运、科技创新中心和文化大都市","E":"上海享有“新零售之都”“电商直播之都”“电竞之都”等新称号"},"explanation":"本题说法全部正确。上海是全国最大的经济中心城市和全球重要的经济枢纽，是国\n\n务院批复确定的长江三角洲世界级城市群的核心城市，也是国际经济、金融、贸易、航运、\n\n科技创新中心和文化大都市。上海享有“新零售之都”“电商直播之都”“电竞之都”等新称\n\n号。","clips":[]},{"n":142,"kind":"多项选择题","answer":"BCE","stem":"下列属于“太行三珍”的有（ ）。","options":{"A":"栗子","B":"花椒","C":"核桃","D":"红枣","E":"柿子"},"explanation":"核桃、柿子和花椒并称“涉县三珍”或“太行三珍”。A 项栗子、D 项红枣均不属于\n\n“太行三珍”，故不选。\n\n同类对比——河北风物（河北）：\n\n· “涉县三珍”（“太行三珍”）：核桃、柿子、花椒；\n\n· 河间驴肉火烧：河北标志性特产美食；\n\n· 正定“三八席”：八凉、八热、八蒸碗的传统民俗宴席。","clips":[]},{"n":143,"kind":"多项选择题","answer":"ACE","stem":"傣族的传统节日主要有（ ）。","options":{"A":"开门节","B":"火把节","C":"泼水节","D":"沐浴节","E":"关门节"},"explanation":"傣族的传统节日主要有泼水节、关门节和开门节等。B 项火把节是彝族最盛大的节\n\n日，D 项沐浴节是藏族传统节日，均非傣族传统节日，故不选。\n\n易混对比——西南民族节日：\n\n· 泼水节、关门节、开门节：傣族传统节日；\n\n· 火把节：彝族最盛大的节日；\n\n· 沐浴节：藏族传统节日（9 月上旬）。","clips":[]},{"n":144,"kind":"多项选择题","answer":"ABCDE","stem":"下列景观中，共同构成山城重庆神奇魅力的有（ ）。","options":{"A":"天空之城洪崖洞","B":"8D 魔幻立交桥","C":"时尚金街解放碑","D":"千年古镇磁器口","E":"轻轨穿楼李子坝"},"explanation":"重庆独特的地理与文化环境孕育了其特有的城市旅游品牌，时尚金街解放碑、天空\n\n之城洪崖洞、千年古镇磁器口，轻轨穿楼李子坝、8D 魔幻立交桥、长江过江索道以及城市\n\n康养好去处的南温泉、北温泉等，共同构成了山城重庆的神奇魅力。","clips":[]},{"n":145,"kind":"多项选择题","answer":"ACD","stem":"那达慕大会每年夏季举办，集合了体育竞技和文化娱乐，其项目包括（ ）。","options":{"A":"摔跤","B":"叼羊","C":"赛马","D":"射箭","E":"赛歌"},"explanation":"那达慕大会是蒙古族最重要的节日之一，每年夏季举办，集合了体育竞技和文化娱\n\n乐，包括赛马、摔跤、射箭等项目。B 项叼羊是新疆少数民族的民间竞技项目，E 项赛歌是\n\n壮族“歌圩”的活动形式，均非那达慕大会项目，故不选。\n\n易混对比——那达慕大会项目：\n\n· 赛马、摔跤、射箭：那达慕大会传统项目；\n\n· 姑娘追：哈萨克青年最喜爱的马上体育游戏（新疆）；\n\n· 赛歌：壮族“歌圩”对歌、赛歌集会。","clips":[]},{"n":146,"kind":"多项选择题","answer":"ABCD","stem":"下列佛教名山与菩萨道场对应正确的有（ ）。","options":{"A":"山西五台山——文殊菩萨","B":"浙江普陀山——观音菩萨","C":"四川峨眉山——普贤菩萨","D":"安徽九华山——地藏菩萨","E":"湖北武当山——地藏菩萨"},"explanation":"汉地佛教四大名山为五台山、普陀山、峨眉山和九华山，分别对应文殊、观音、普\n\n贤和地藏菩萨。E 项湖北武当山不属于汉地佛教四大名山，地藏菩萨道场是安徽九华山。\n\n易混对比——汉地佛教四大名山与菩萨道场：\n\n· 五台山（山西）：文殊菩萨道场；\n\n· 普陀山（浙江）：观音菩萨道场；\n\n· 峨眉山（四川）：普贤菩萨道场；\n\n· 九华山（安徽）：地藏菩萨道场。","clips":[]},{"n":147,"kind":"多项选择题","answer":"ABC","stem":"中国古典园林构景手段中的抑景，又可分为（ ）。","options":{"A":"山抑","B":"树抑","C":"曲抑","D":"水抑","E":"花抑"},"explanation":"答案选 ABC。抑景有山抑、树抑、曲抑之分：园林入口处迎门挡以假山叫山抑；杭\n\n州花港观鱼东大门的雪松是树抑的范例；“山重水复疑无路，柳暗花明又一村”是曲抑的体\n\n现。D 水抑、E 花抑不是抑景的分类，故 D、E 项错误。\n\n同类对比——抑景的分类：\n\n· 山抑：园林入口处迎门挡以假山；\n\n· 树抑：杭州花港观鱼东大门的雪松为范例；\n\n· 曲抑：“山重水复疑无路，柳暗花明又一村”的体现。","clips":[]},{"n":148,"kind":"多项选择题","answer":"ABCE","stem":"下列白酒品牌中，属于四川“六朵金花”的有（ ）。","options":{"A":"郎酒","B":"剑南春","C":"泸州老窖","D":"汾酒","E":"五粮液"},"explanation":"四川五粮液、泸州老窖、剑南春、水井坊、郎酒和舍得酒“六朵金花”，几乎占据了\n\n中国名酒的半壁河山。D 项汾酒为山西名酒，不属于四川“六朵金花”，故不选。\n\n易混对比——川酒“六朵金花”：\n\n· 五粮液、泸州老窖、剑南春、水井坊、郎酒、舍得酒：川酒“六朵金花”；\n\n· 汾酒：山西名酒，有着 4000 多年悠久历史；\n\n· 茅台酒：产自遵义仁怀市茅台镇，被誉为酱香型白酒标杆典范（贵州）。","clips":[]},{"n":149,"kind":"多项选择题","answer":"ABCDE","stem":"下列画家与其代表作对应正确的有（ ）。","options":{"A":"顾恺之——《女史箴图》《洛神赋图》","B":"展子虔——《游春图》","C":"阎立本——《步辇图》《历代帝王图》","D":"吴道子——《送子天王图》","E":"张择端——《清明上河图》"},"explanation":"顾恺之代表作《女史箴图》《洛神赋图》；展子虔代表作《游春图》；阎立本代表作《步\n\n辇图》《历代帝王图》；吴道子代表作《送子天王图》；张择端代表作《清明上河图》。以上对\n\n应均正确。","clips":[]},{"n":150,"kind":"多项选择题","answer":"ABCD","stem":"江西“四大名山”是指（ ）。","options":{"A":"庐山","B":"井冈山","C":"三清山","D":"龙虎山","E":"武夷山"},"explanation":"四大名山：匡庐奇秀甲天下的庐山、养生福地井冈山、峰林奇观三清山、道教祖庭\n\n龙虎山。E 项武夷山在福建，非江西“四大名山”内容，故不选。\n\n同类对比——江西“四大名山”（江西）：\n\n· 庐山：匡庐奇秀甲天下；\n\n· 井冈山：养生福地；\n\n· 三清山：峰林奇观；\n\n· 龙虎山：道教祖庭。","clips":[]},{"n":151,"kind":"多项选择题","answer":"ACE","stem":"武隆景区的主要组成部分有（ ）。","options":{"A":"仙女山","B":"金佛山","C":"天生三桥","D":"黑山谷","E":"芙蓉洞"},"explanation":"武隆景区地处武陵山与大娄山脉交会的褶皱地带，喀斯特地貌十分显著，主要由“天\n\n生三桥、仙女山、芙蓉洞”三部分组成。B 项金佛山、D 项黑山谷均为重庆知名景区，非武\n\n隆景区组成部分，故不选。\n\n易混对比——重庆景区（重庆）：\n\n· 武隆景区：天生三桥、仙女山、芙蓉洞三部分，芙蓉洞有目前国内外发现的最大竖井群；\n\n· 金佛山：“喀斯特桌山”地貌世界遗产，“生物基因库、中华药库”；\n\n· 万盛黑山谷：重庆 5A 景区，非武隆组成部分。","clips":[]},{"n":152,"kind":"多项选择题","answer":"ABC","stem":"香港夜景有“世界三大夜景”之一的美誉，观赏香港夜景的最佳地点有（ ）。","options":{"A":"中环摩天轮","B":"天际 100 香港观景台","C":"太平山顶","D":"金紫荆广场","E":"海洋公园"},"explanation":"香港夜景最佳观赏地点是香港中环摩天轮里，天际 100 香港观景台或坐山顶缆车登\n\n上太平山顶。D 项金紫荆广场、E 项海洋公园均非观赏香港夜景的最佳地点，故不选。","clips":[]},{"n":153,"kind":"多项选择题","answer":"ABCD","stem":"下列民居建筑与地域对应正确的有（ ）。","options":{"A":"骑楼——岭南","B":"四合院——北京","C":"围龙屋——客家","D":"石库门里弄——上海","E":"吊脚楼——四川"},"explanation":"四合院是北京传统民居，骑楼是岭南特色建筑，客家围屋（也称为围龙屋、围屋、\n\n转龙屋、客家围龙屋）是中华客家文化中著名的特色民居建筑，石库门里弄是上海最具本土\n\n特色的民居建筑形态。E 项吊脚楼为土家族、苗族等民族的传统民居，与“四川”对应不当，\n\n故不选。\n\n易混对比——民居与地域：\n\n· 四合院：北京传统民居（北京）；\n\n· 石库门里弄：上海最具本土特色的民居建筑形态（上海）；\n\n· 骑楼：岭南特色建筑，广州骑楼为粤派骑楼代表（广东）；\n\n· 围龙屋：客家文化中著名的特色民居建筑（广东）；\n\n· 吊脚楼：土家族、苗族依山而建的传统民居（湖南、贵州等）。","clips":[]},{"n":154,"kind":"多项选择题","answer":"ABCD","stem":"我国著名的四大民间木刻年画产地是（ ）。","options":{"A":"苏州桃花坞","B":"天津杨柳青","C":"山东潍坊杨家埠","D":"四川绵竹","E":"河南朱仙镇"},"explanation":"答案选 ABCD。苏州桃花坞、天津杨柳青、山东潍坊杨家埠和四川绵竹，是我国著名\n\n的四大民间木刻年画产地。E 河南朱仙镇不在四大民间木刻年画产地之列，故 E 项错误。","clips":[]},{"n":155,"kind":"多项选择题","answer":"ABCE","stem":"湖北土家族山歌的歌词内容有（ ）。","options":{"A":"情歌","B":"苦歌","C":"打猎歌","D":"敬酒歌","E":"扯谎歌"},"explanation":"湖北土家族人好唱山歌，其歌词内容非常丰富，有谈情说爱的“情歌”、倾诉苦情的\n\n“苦歌”、上山打猎的“打猎歌”、女儿出嫁的“哭嫁歌”、开心逗趣的“扯谎歌”，所谓“婚\n\n丧嫁娶设歌堂、喜怒哀乐都是歌”。D 项敬酒歌不在土家族山歌歌词内容之列，故不选。\n\n同类对比——土家族歌舞：\n\n· 山歌歌词：情歌、苦歌、打猎歌、哭嫁歌、扯谎歌（湖北）；\n\n· 山歌类型：情歌、哭嫁歌、摆手歌、劳动歌、盘歌（湖南）；\n\n· 摆手舞：最著名的土家舞蹈（湖南）；\n\n· 摊戏：被称为“中国戏剧的活化石”（湖南）。","clips":[]},{"n":156,"kind":"多项选择题","answer":"ABCD","stem":"官式建筑屋顶形式中，级别高于攒尖的有（ ）。","options":{"A":"重檐庑殿","B":"重檐歇山","C":"单檐庑殿","D":"单檐歇山","E":"卷棚"},"explanation":"答案选 ABCD。官式建筑屋顶形式级别从高到低依次为重檐庑殿、重檐歇山、单檐庑\n\n殿、单檐歇山、攒尖、悬山、硬山、卷棚；重檐庑殿顶规格最高，如故宫太和殿。E 卷棚排\n\n在攒尖之后，级别低于攒尖，故 E 项错误。","clips":[]},{"n":157,"kind":"多项选择题","answer":"ABCE","stem":"下列属于贵州省国家 5A 级旅游景区的有（ ）。","options":{"A":"黄果树瀑布景区","B":"龙宫景区","C":"百里杜鹃景区","D":"石林风景区","E":"万峰林景区"},"explanation":"贵州 10 处：黄果树大瀑布、龙宫、百里杜鹃、樟江、青岩古镇、梵净山、镇远古城、\n\n赤水丹霞、织金洞、黔西南州万峰林。D 项石林风景区属于云南省 5A 级景区，不属于贵州，\n\n故不选。","clips":[]},{"n":158,"kind":"多项选择题","answer":"BCDE","stem":"中国目前保存最为完好的四大古城有（ ）。","options":{"A":"南京古城","B":"平遥古城","C":"丽江古城","D":"徽州古城","E":"阆中古城"},"explanation":"正确答案为 BCDE。中国目前古城中保存最为完好的是平遥古城、丽江古城、徽州古\n\n城、阆中古城。26 版教材新增考点。\n\n同类对比——四大古城保存与构成：\n\n· 四大古城：平遥、丽江、徽州、阆中；\n\n· 其他古城：西安、南京、凤凰、大理、荆州等；\n\n区分关键：保存最完好的四大古城为平遥、丽江、徽州、阆中。","clips":[]},{"n":159,"kind":"多项选择题","answer":"ABDE","stem":"安徽“皖南四大名山”是指（ ）。","options":{"A":"九华山","B":"天柱山","C":"琅琊山","D":"齐云山","E":"黄山"},"explanation":"安徽自然景观山水相连，尤以“皖南四大名山”黄山、九华山、天柱山、齐云山最\n\n具有代表性。C 项琅琊山在安徽滁州，不属“皖南四大名山”，故不选。\n\n易混对比——“四大名山”组合：\n\n· 皖南四大名山：黄山、九华山、天柱山、齐云山（安徽）；\n\n· 江西四大名山：庐山、井冈山、三清山、龙虎山（江西）；\n\n· 琅琊山：安徽滁州 5A 景区，不在“皖南四大名山”之列。","clips":[]},{"n":160,"kind":"多项选择题","answer":"ABDE","stem":"下列菜品中，属于民间湘菜代表菜品的有（ ）。","options":{"A":"吉首酸肉","B":"辣椒炒肉","C":"毛血旺","D":"剁椒鱼头","E":"湘西外婆菜"},"explanation":"湘菜代表派系为组庵湘菜，如组庵豆腐、组庵鱼翅等；民间湘菜代表菜品有剁椒鱼\n\n头、辣椒炒肉、湘西外婆菜、吉首酸肉等。C 项毛血旺为重庆菜肴，非民间湘菜代表菜品，\n\n故不选。\n\n易混对比——湘菜构成（湖南）：\n\n· 组庵湘菜：组庵豆腐、组庵鱼翅等；\n\n· 民间湘菜：剁椒鱼头、辣椒炒肉、湘西外婆菜、吉首酸肉；\n\n· 毛血旺：重庆火锅经典，非湘菜（重庆）。","clips":[]},{"n":161,"kind":"多项选择题","answer":"ABCD","stem":"伟大建党精神的具体内涵包括（ ）。","options":{"A":"坚持真理、坚守理想","B":"践行初心、担当使命","C":"不怕牺牲、英勇斗争","D":"对党忠诚、不负人民","E":"无私奉献、勇于创新"},"explanation":"中国共产党的先驱们创建了中国共产党，形成了坚持真理、坚守理想，践行初心、\n\n担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民的伟大建党精神，这是中国共产党的\n\n精神之源。E“无私奉献、勇于创新”属于三线精神，不属于伟大建党精神。","clips":[]},{"n":162,"kind":"多项选择题","answer":"ABC","stem":"唐三彩的颜色以（ ）三色为主，但也有紫、褐、蓝等色。","options":{"A":"黄","B":"绿","C":"白","D":"红","E":"黑"},"explanation":"唐三彩以黄、绿、白三色为主，但也有紫、褐、蓝等色，其中蓝色是中国最早的以\n\n钴土作彩料所呈现的釉色；考古发现的唐三彩大都用作明器（随葬品）。D 红、E 黑不是唐三\n\n彩的主色。\n\n同类对比——唐三彩釉色：\n\n· 主色：黄、绿、白三色；\n\n· 其他色：有紫、褐、蓝等色；\n\n· 蓝色：中国最早的以钴土作彩料所呈现的釉色。","clips":[]},{"n":163,"kind":"多项选择题","answer":"ACDE","stem":"三星堆遗址出土的文物有（ ）。","options":{"A":"青铜神树","B":"“太阳神鸟”金饰","C":"青铜人面具","D":"黄金杖","E":"青铜大立人像"},"explanation":"如 57 件青铜人面具，高 3.96 米的青铜神树，高 2.62 米的青铜大立人像，宽 1.38\n\n米并长着“千里眼”“顺风耳”的青铜面具，长 1.42 米的黄金杖。B 项“太阳神鸟”金饰出\n\n土于金沙遗址，非三星堆遗址，故不选。\n\n易混对比——三星堆与金沙（四川）：\n\n· 三星堆遗址：57 件青铜人面具、高 3.96 米青铜神树、高 2.62 米青铜大立人像、长 1.42\n\n米黄金杖；\n\n· 金沙遗址：“太阳神鸟”金饰，已成为中国文化遗产的标志。","clips":[]},{"n":164,"kind":"多项选择题","answer":"ACD","stem":"鲁菜的代表名菜有（ ）。","options":{"A":"葱烧海参","B":"松鼠鳜鱼","C":"糖醋鲤鱼","D":"油焖大虾","E":"白切鸡"},"explanation":"答案选 ACD。鲁菜三大头牌菜为葱烧海参、糖醋鲤鱼、九转大肠，其他代表性菜品\n\n有油焖大虾、油爆双脆等。B 项，松鼠鳜鱼属苏菜。E 项，白切鸡属粤菜。\n\n易混对比——地域与菜系代表菜对应（地名+菜名）：\n\n· 苏菜五大头牌：蟹粉狮子头、松鼠鳜鱼、大煮干丝、金陵盐水鸭、无锡酱排骨；\n\n· 鲁菜三大头牌：葱烧海参、糖醋鲤鱼、九转大肠；\n\n· 粤菜四大头牌：白切鸡、烧鹅、烤乳猪、佛跳墙；\n\n· 川菜名菜：鱼香肉丝、宫保鸡丁、夫妻肺片、麻婆豆腐、回锅肉、凉拌鸡、开水白菜、\n\n鸡豆花等；\n\n· 粤菜其他经典菜品：红烧乳鸽、蜜汁叉烧、潮汕卤鹅、东江盐焗鸡、爽口牛丸等。\n\n· 苏菜名品：文思豆腐、软兜长鱼、三套鸭、响油鳝糊等。","clips":[]},{"n":165,"kind":"多项选择题","answer":"ABC","stem":"徽州建筑中的“三大瑰宝”包括（ ）。","options":{"A":"徽州府衙","B":"许国石坊","C":"渔梁坝","D":"承志堂","E":"周庄双桥"},"explanation":"正确答案为 ABC。徽州府街、许国石坊、渔梁坝被称为徽派建筑的“三大瑰宝”。26\n\n版教材新增考点。\n\n同类对比——安徽徽派建筑三大瑰宝：\n\n·徽州府衙:在徽州古城中心，称缩小的故宫;\n\n·许国石坊:唯一八柱四面围合八脚牌楼;\n\n·渔梁坝:新安江最古老拦河坝，称徽州都江堰。","clips":[]}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('question-data').textContent);
const el=id=>document.getElementById(id);
const key='leidada-2026-paper7-subject34-quiz-v1';
const answerText={对:'正确',错:'错误'};
const sorted=values=>[...values].sort().join('');
const isCorrect=(q,values)=>sorted(values)===sorted(q.answer);
let results={}, retryResults={}, retryIds=null, retryOrder={}, position=1, mode="all", selection=new Set();
try{
  const state=JSON.parse(localStorage.getItem(key)||'null');
  if(state){
    position=Number.isInteger(state.position)&&questions.some(q=>q.n===state.position)?state.position:1;
    if(state.mode==="wrong"||state.mode==="retry")mode=state.mode;
    if(Array.isArray(state.retryIds))retryIds=new Set(state.retryIds);
    for(const q of questions){
      const values=state.results?.[q.n];
      if(Array.isArray(values)&&values.length&&new Set(values).size===values.length&&values.every(v=>Object.hasOwn(q.options,v))&&(q.kind==='多项选择题'||values.length===1)){
        results[q.n]=values;
        const order=state.retryOrder?.[q.n];
        if(Array.isArray(order)&&sorted(order)===sorted(Object.keys(q.options))){
          retryOrder[q.n]=order;
        }
        const retry=state.retryResults?.[q.n];
        if(!isCorrect(q,values)&&(!retryIds||retryIds.has(q.n))&&Array.isArray(retry)&&retry.length&&
           new Set(retry).size===retry.length&&retry.every(v=>Object.hasOwn(q.options,v))&&
           (q.kind==='多项选择题'||retry.length===1)){
          retryResults[q.n]=retry;
        }
      }
    }
  }
}catch{el('storage').hidden=false;}
const quizTimer=createQuizTimer(key,()=>questions.every(q=>Boolean(results[q.n])));
function save(){
  quizTimer.sync();
  try{localStorage.setItem(key,JSON.stringify({position,results,retryResults,retryOrder,mode,retryIds:retryIds?[...retryIds]:null}));}
  catch{el('storage').hidden=false;}
}
function wrongQuestions(){
  return questions.filter(q=>results[q.n]&&!isCorrect(q,results[q.n]));
}
function retryQuestions(){
  return wrongQuestions().filter(q=>!retryIds||retryIds.has(q.n));
}
function pool(){
  if(mode==='all')return questions;
  return mode==='retry'?retryQuestions():wrongQuestions();
}
function optionOrder(q){
  const letters=Object.keys(q.options);
  if(mode!=='retry'||q.kind==='判断题')return letters;
  if(!retryOrder[q.n]){
    for(let i=letters.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [letters[i],letters[j]]=[letters[j],letters[i]];
    }
    retryOrder[q.n]=letters;
    save();
  }
  return retryOrder[q.n];
}
function activeResults(){return mode==='retry'?retryResults:results;}
if(mode!=='all'&&!pool().some(q=>q.n===position)){
  position=pool()[0]?.n||position;
}
let showingReport=mode==='all'&&Object.keys(results).length===questions.length;
const pointsByType={'判断题':0.5,'单项选择题':0.5,'多项选择题':1};

function renderReport(){
  let total=0;
  let maximum=0;
  const rows=[];
  for(const [kind,points] of Object.entries(pointsByType)){
    const section=questions.filter(q=>q.kind===kind);
    const correct=section.filter(q=>results[q.n]&&isCorrect(q,results[q.n])).length;
    const score=correct*points;
    const max=section.length*points;
    total+=score;
    maximum+=max;
    const row=document.createElement('tr');
    for(const value of [kind,correct,section.length-correct,`${score} / ${max}`]){
      const cell=document.createElement('td');
      cell.textContent=value;
      row.append(cell);
    }
    rows.push(row);
  }
  el('total-score').textContent=`${total} / ${maximum} 分`;
  el('subscores').replaceChildren(...rows);
}
function focusQuestion(){
  if(showingReport){
    el('report-title').focus();
    return;
  }
  (el('options').querySelector('button:not(:disabled)')||el('stem')).focus();
}
function jump(n){
  showingReport=false;
  position=n;
  selection.clear();
  save();
  render();
  focusQuestion();
}
function render(){
  const wrong=wrongQuestions();
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const q=list[index];
  const retrying=mode==='retry';
  const answers=activeResults();
  el('all').setAttribute('aria-pressed',String(mode==='all'));
  el('mistakes').setAttribute('aria-pressed',String(mode==='wrong'));
  const retryList=retryQuestions();
  const retryCount=Object.keys(retryResults).length;
  const retryWrong=retryList.filter(q=>retryResults[q.n]&&!isCorrect(q,retryResults[q.n])).length;
  const roundDone=retryList.length>0&&retryCount===retryList.length;
  el('retry').hidden=mode==='all'||!retryList.length||(retrying&&(!roundDone||!retryWrong));
  el('retry').textContent=retrying?'继续重刷 '+retryWrong+' 道错题':retryCount?'查看重刷进度':'重刷错题';
  el('retry').disabled=retrying&&!roundDone;
  el('wrong-count').textContent=wrong.length;
  const answered=Object.keys(results).length;
  const total=retrying?retryList.length:questions.length;
  const done=retrying?retryCount:answered;
  el('progress-label').textContent=`${retrying?'重刷':'已答'} ${done} / ${total}`;
  el('progress').max=total||1;
  el('progress').value=done;
  el('score').textContent=retrying
    ? `本轮答对 ${done-retryWrong} · 答错 ${retryWrong}${roundDone&&!retryWrong?" · 全部答对":""}`
    : `整卷答对 ${answered-wrong.length} · 答错 ${wrong.length} · 未答 ${questions.length-answered}`;
  el('reset').disabled=answered===0;
  el('show-report').hidden=showingReport||answered!==questions.length;
  el('report').hidden=!showingReport;
  el('card').hidden=showingReport;
  el('index').hidden=showingReport||!q;
  el('nav').hidden=showingReport||!q;
  if(showingReport){
    renderReport();
    return;
  }
  el('options').replaceChildren();
  el('clips').replaceChildren();
  el('grid').replaceChildren();
  el('actions').hidden=true;
  el('result').hidden=true;
  el('explanation').hidden=true;
  el('question-face').hidden=false;
  el('flip').hidden=true;
  el('flip').textContent='查看解析 · 空格';
  if(!q){
    el('meta').textContent='错题';
    el('stem').textContent='目前没有错题。';
    return;
  }
  el('source-note').textContent=q.sourceNote||'';
  el('source-note').hidden=!q.sourceNote;
  const submitted=answers[q.n];
  const multi=q.kind==='多项选择题';
  el('meta').textContent=`第 ${q.n} 题 · ${q.kind}`;
  el('stem').textContent=q.stem;
  el('prev').disabled=index===0;
  el('next').disabled=index===list.length-1;
  el('original-order').hidden=!retrying||q.kind==='判断题';
  const order=optionOrder(q);
  const displayLetters=Object.keys(q.options);
  for(const [index,letter] of order.entries()){
    const label=q.options[letter];
    const button=document.createElement('button');
    button.type='button';
    button.className='option';
    const marked=(submitted||[...selection]).includes(letter);
    button.setAttribute('aria-pressed',String(marked));
    button.disabled=Boolean(submitted);
    if(q.kind!=='判断题'){
      const prefix=document.createElement('b');
      prefix.textContent=displayLetters[index];
      button.append(prefix);
    }
    const text=document.createElement('span');
    text.textContent=label;
    button.append(text);
    if(multi&&!submitted){
      const mark=document.createElement('span');
      mark.className='flag selection-mark';
      mark.setAttribute('aria-hidden','true');
      mark.textContent='✓ 已选';
      button.append(mark);
    }
    if(submitted){
      const correct=q.answer.includes(letter);
      if(correct||marked){
        button.classList.add(correct?'correct':'incorrect');
        const flag=document.createElement('span');
        flag.className='flag';
        flag.textContent=correct?(marked?'已选 · 正确':'正确答案'):'已选 · 错误';
        button.append(flag);
      }
    }else{
      button.onclick=()=>{
        if(!multi){selection=new Set([letter]);submit();return;}
        if(selection.has(letter)){selection.delete(letter);}else{selection.add(letter);}
        button.setAttribute('aria-pressed',String(selection.has(letter)));
        el('submit').disabled=selection.size===0;
      };
    }
    el('options').append(button);
  }
  if(!submitted&&multi){
    el('actions').hidden=false;
    el('submit').disabled=selection.size===0;
  }
  if(submitted){
    const right=isCorrect(q,submitted);
    const result=el('result');
    result.classList.toggle('wrong',!right);
    result.textContent=`${right?'答对了':'答错了'} · 正确答案 ${answerText[q.answer]||order.flatMap((letter,index)=>q.answer.includes(letter)?[displayLetters[index]]:[]).join('、')}`;
    result.hidden=false;
    el('explanation-text').textContent=q.explanation;
    for(const [page,base64] of q.clips){
      const figure=document.createElement('figure');
      const img=document.createElement('img');
      img.src=base64;
      img.alt=`第 ${q.n} 题原解析，PDF 第 ${page} 页`;
      const caption=document.createElement('figcaption');
      caption.textContent=`解析卷第 ${page} 页`;
      figure.append(img,caption);
      el('clips').append(figure);
    }
    el('flip').hidden=false;
  }
  for(const item of list){
    const b=document.createElement('button');
    b.textContent=item.n;
    const values=answers[item.n];
    const status=values?(isCorrect(item,values)?'答对':'答错'):'未作答';
    b.setAttribute('aria-label',`第 ${item.n} 题，${status}`);
    if(values)b.className=isCorrect(item,values)?'right':'wrong';
    if(item.n===position)b.setAttribute('aria-current','true');
    b.onclick=()=>{
      el('index').open=false;
      jump(item.n);
    };
    el('grid').append(b);
  }
}
function submit(){
  const q=questions.find(q=>q.n===position);
  const answers=activeResults();
  if(!selection.size||answers[q.n])return;
  answers[q.n]=[...selection];
  selection.clear();
  save();
  render();
  el('result').scrollIntoView({block:'nearest'});
}
function flipCard(){
  const showExplanation=el('explanation').hidden;
  el('question-face').hidden=showExplanation;
  el('explanation').hidden=!showExplanation;
  el('flip').textContent=showExplanation?'返回题目 · 空格':'查看解析 · 空格';
  el(showExplanation?'ex-title':'stem').focus();
}
function move(delta){
  const list=pool();
  const index=list.findIndex(q=>q.n===position);
  const target=list[index+delta];
  if(target)jump(target.n);
}
document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
  if(event.target.closest('input, textarea, select, [contenteditable]'))return;
  if(showingReport)return;
  const index=el('index');
  if(event.key==='ArrowUp'||event.key==='ArrowDown'){
    if(index.open&&index.contains(document.activeElement))return;
    const options=[...el('options').querySelectorAll('button:not(:disabled)')];
    if(!options.length)return;
    event.preventDefault();
    const current=options.indexOf(document.activeElement);
    const down=event.key==='ArrowDown';
    const step=down?1:-1;
    const next=current<0?(down?0:options.length-1):(current+step+options.length)%options.length;
    options[next].focus();
    return;
  }
  if(event.key===' '&&!el('flip').hidden&&
      (!event.target.closest('button, summary, a')||event.target===el('flip'))){
    event.preventDefault();
    if(!event.repeat)flipCard();
    return;
  }
  if(event.repeat)return;
  if(/^[1-5]$/.test(event.key)){
    if(index.open&&index.contains(document.activeElement))return;
    const option=el('options').querySelectorAll('.option')[Number(event.key)-1];
    if(!option||option.disabled)return;
    if(event.key==='5'&&el('actions').hidden)return;
    event.preventDefault();
    option.focus();
    option.click();
    return;
  }
  const previousQuestion=event.key==='ArrowLeft'||event.key.toLowerCase()==='q';
  const nextQuestion=event.key==='ArrowRight'||event.key.toLowerCase()==='w';
  if(previousQuestion||nextQuestion){
    if(el('nav').hidden||(index.open&&index.contains(document.activeElement)))return;
    event.preventDefault();
    move(previousQuestion?-1:1);
    return;
  }
  if(event.key==='Escape'&&!index.hidden){
    event.preventDefault();
    if(index.open&&index.contains(document.activeElement)){
      index.open=false;
      if(el('explanation').hidden)focusQuestion();
      else el('ex-title').focus();
    }else{
      index.open=true;
      (index.querySelector('[aria-current="true"]')||index.querySelector('summary')).focus();
    }
  }
  if(event.key!=='Enter'||el('nav').hidden)return;
  if(event.target.closest('button:not(.option):not(#submit):not(#prev):not(#next), summary, a'))return;
  event.preventDefault();
  if(!el('actions').hidden){
    submit();
    return;
  }
  event.target.closest('.option:not(:disabled)')?.click();
});
function showReport(){
  mode='all';
  showingReport=true;
  save();
  render();
  focusQuestion();
}
el('show-report').onclick=showReport;
el('flip').onclick=flipCard;
el('submit').onclick=submit;
el('prev').onclick=()=>move(-1);
el('next').onclick=()=>move(1);
el('mistakes').onclick=()=>{
  mode='wrong';
  const list=pool();
  jump(list.some(q=>q.n===position)?position:list[0]?.n||position);
};
el('retry').onclick=()=>{
  let list=retryQuestions();
  if(mode==='retry'){
    if(!list.every(q=>retryResults[q.n]))return;
    list=list.filter(q=>!isCorrect(q,retryResults[q.n]));
    if(!list.length)return;
    retryIds=new Set(list.map(q=>q.n));
    retryResults={};
    retryOrder={};
  }
  if(!list.length)return;
  mode='retry';
  jump((list.find(q=>!retryResults[q.n])||list[0]).n);
};
el('all').onclick=()=>{
  mode='all';
  jump(position);
};
el('reset').onclick=()=>{
  if(!confirm('清空本卷的答题进度和错题记录？'))return;
  results={};
  quizTimer.reset();
  retryResults={};
  retryIds=null;
  retryOrder={};
  mode='all';
  jump(1);
};
render();
focusQuestion();
</script>
</body>
</html>
